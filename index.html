<script type="module">

import {
 createClient

const SUPABASE_URL =
"https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

createClient(

/* =====================================================

const OVERPASS_SERVERS = [

const LOW_COIN_THRESHOLD = 8;

const COLLECTION_DISTANCE = 25;


/* =====================================================
   SKINS
===================================================== */

const SKINS = {

 blue:{
  name:"Blue",
  color:"#00aaff",
  price:0
 },

 red:{
  name:"Red",
  color:"#ff3030",

 },

 },

 },

 gold:{

 },

 pink:{
  name:"Pink",

  price:350
 }

};


/* =====================================================
   STATE
===================================================== */

let currentUser=null;
let playerData=null;
let gameMode=null;

let map=null;
let playerMarker=null;
let accuracyCircle=null;

let coins=[];
let watchId=null;

let lastRoadLat=null;
let lastRoadLon=null;

let loadingRoads=false;

let musicStarted=false;
let musicMuted=false;

let audioContext=null;
let musicGain=null;
let musicTimer=null;

let toastTimer=null;


/* =====================================================
   DOM
===================================================== */

const authScreen =
document.getElementById("authScreen");

const modeScreen =
document.getElementById("modeScreen");

document.getElementById("loadingScreen");

const loadingBar =
document.getElementById("loadingBar");

document.getElementById("loadingText");

const status =
document.getElementById("status");

const coinsDisplay =
document.getElementById("coinsDisplay");

const authStatus =
document.getElementById("authStatus");

const shopOverlay =
document.getElementById("shopOverlay");

const shopItems =
document.getElementById("shopItems");

const shopBalance =
document.getElementById("shopBalance");

const accountOverlay =
document.getElementById("accountOverlay");

const accountEmail =
document.getElementById("accountEmail");


/* =====================================================
   HELPERS
===================================================== */

function setLoading(text,percent){

 loadingText.textContent=text;
 loadingBar.style.width=percent+"%";

}


function setStatus(text){

 status.textContent=text;

}


function showToast(text){

 const toast =
 document.getElementById("toast");

 toast.textContent=text;

 toast.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(
  ()=>{
   toast.classList.remove("show");
  },
  2200
 );

}


/* =====================================================
   DISTANCE
===================================================== */

function distanceMeters(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R=6371000;

 const p1=lat1*Math.PI/180;
 const p2=lat2*Math.PI/180;

 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;

 const a=
 Math.sin(dLat/2)**2+
 Math.cos(p1)*
 Math.cos(p2)*
 Math.sin(dLon/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

}


/* =====================================================
   AUDIO
===================================================== */

/*
 Mobile Safari will NOT allow arbitrary audio
 to begin before a user interaction.

 The first button tap therefore starts the music.
*/

function startMusic(){

 if(musicStarted)
  return;

 try{

  audioContext=
  new (
   window.AudioContext ||
   window.webkitAudioContext
  )();

  musicGain=
  audioContext.createGain();

  musicGain.gain.value=.035;

  musicGain.connect(
   audioContext.destination
  );

  musicStarted=true;

  playMusicLoop();

  document.getElementById(
   "musicButton"
  ).textContent="🎵";

 }catch(error){

  console.log("Audio unavailable",error);

 }

}


function playMusicLoop(){

 if(!musicStarted || musicMuted)
  return;

 if(audioContext.state==="suspended")
  audioContext.resume();

 const now=
 audioContext.currentTime;

 /*
  Simple arcade-style melody.
 */

 const notes=[
  261.63,
  329.63,
  392.00,
  329.63,
  293.66,
  349.23,
  440.00,
  349.23
 ];

 notes.forEach(
  (frequency,index)=>{

   const osc=
   audioContext.createOscillator();

   const gain=
   audioContext.createGain();

   osc.type="triangle";

   osc.frequency.value=
   frequency;

   gain.gain.setValueAtTime(
    0,
    now+index*.32
   );

   gain.gain.linearRampToValueAtTime(
    .18,
    now+index*.32+.03
   );

   gain.gain.exponentialRampToValueAtTime(
    .001,
    now+index*.32+.28
   );

   osc.connect(gain);
   gain.connect(musicGain);

   osc.start(
    now+index*.32
   );

   osc.stop(
    now+index*.32+.3
   );

  }
 );

 musicTimer=setTimeout(
  ()=>{
   playMusicLoop();
  },
  2700
 );

}


function toggleMusic(){

 if(!musicStarted){

  startMusic();
  return;

 }

 musicMuted=!musicMuted;

 const button=
 document.getElementById(
  "musicButton"
 );

 if(musicMuted){

  musicGain.gain.value=0;

  button.textContent="🔇";

 }else{

  musicGain.gain.value=.035;

  button.textContent="🎵";

  playMusicLoop();

 }

}


function playCoinSound(){

 if(!audioContext)
  return;

 if(audioContext.state==="suspended")
  audioContext.resume();

 const now=
 audioContext.currentTime;

 [880,1174,1568].forEach(
  (frequency,index)=>{

   const osc=
   audioContext.createOscillator();

   const gain=
   audioContext.createGain();

   osc.type="sine";

   osc.frequency.value=
   frequency;

   gain.gain.setValueAtTime(
    .15,
    now+index*.07
   );

   gain.gain.exponentialRampToValueAtTime(
    .001,
    now+index*.07+.18
   );

   osc.connect(gain);
   gain.connect(audioContext.destination);

   osc.start(
    now+index*.07
   );

   osc.stop(
    now+index*.07+.2
   );

  }
 );

}


document
.getElementById("musicButton")
.addEventListener(
 "click",
 toggleMusic
);


/* =====================================================
   AUTH
===================================================== */

async function checkAuth(){

 authStatus.textContent=
 "Checking account...";

 const {
  data,
  error
 }=
 await supabase.auth.getSession();

 if(error)
  console.error(error);

 if(data.session){

  currentUser=data.session.user;

  await afterLogin();

 }else{

  authScreen.style.display="flex";

  authStatus.textContent=
  "Sign in to save your coins.";

 }

}


document
.getElementById("signInButton")
.addEventListener(
 "click",
 signIn
);


async function signIn(){

 /*
  This tap also satisfies iPhone's audio
  user-interaction requirement.
 */

 startMusic();

 const email=
 document
 .getElementById("emailInput")
 .value
 .trim();

 if(!email){

  authStatus.textContent=
  "Enter your email.";

  return;

 }

 if(!email.includes("@")){

  authStatus.textContent=
  "Enter a valid email.";

  return;

 }

 const button=
 document.getElementById(
  "signInButton"
 );

 button.disabled=true;

 authStatus.textContent=
 "Sending sign-in link...";

 const redirect=
 window.location.origin+
 window.location.pathname;

 const {
  error
 }=
 await supabase.auth.signInWithOtp({

  email,

  options:{
   emailRedirectTo:redirect,
   shouldCreateUser:true
  }

 });

 button.disabled=false;

 if(error){

  console.error(error);

  authStatus.textContent=
  "❌ "+error.message;

  return;

 }

 authStatus.textContent=
 "✅ Check your email and tap the link.";

}


/* =====================================================
   AFTER LOGIN
===================================================== */

async function afterLogin(){

 authScreen.style.display="none";

 try{

  await loadPlayer();

 }catch(error){

  console.error(error);

  authScreen.style.display="flex";

  authStatus.textContent=
  "Couldn't load player data.";

  return;

 }

 modeScreen.style.display="flex";

 /*
  Start audio from the fact that the user has
  already interacted with the app.
 */

 startMusic();

}


/* =====================================================
   PLAYER
===================================================== */

async function loadPlayer(){

 if(!currentUser)
  return;

 let {
  data,
  error
 }=
 await supabase
 .from("players")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(error)
  throw error;

 if(!data){

  const newPlayer={

   id:currentUser.id,

   username:
   currentUser.email
   ?.split("@")[0] ||
   "Player",

   coins:0,
   xp:0,
   level:1,

   unlocked_skins:["blue"],

   equipped_skin:"blue",

   collected_coins:[]

  };

  const result=
  await supabase
  .from("players")
  .insert(newPlayer)
  .select()
  .single();

  if(result.error)
   throw result.error;

  data=result.data;

 }

 data.coins=
 Number(data.coins||0);

 data.xp=
 Number(data.xp||0);

 data.level=
 Number(data.level||1);

 data.unlocked_skins=
 Array.isArray(data.unlocked_skins)
 ? data.unlocked_skins
 : ["blue"];

 data.collected_coins=
 Array.isArray(data.collected_coins)
 ? data.collected_coins
 : [];

 data.equipped_skin=
 data.equipped_skin||"blue";

 playerData=data;

 updateCoinDisplay();

}


async function savePlayer(){

 if(!playerData)
  return;

 const {
  error
 }=
 await supabase
 .from("players")
 .update({

  coins:playerData.coins,
  xp:playerData.xp,
  level:playerData.level,

  unlocked_skins:
  playerData.unlocked_skins,

  equipped_skin:
  playerData.equipped_skin,

  collected_coins:
  playerData.collected_coins,

  updated_at:
  new Date().toISOString()

 })
 .eq("id",playerData.id);

 if(error){

  console.error(error);

  showToast("⚠️ Save failed");

 }

}


/* =====================================================

===================================================== */

document
.getElementById("publicMode")

);

function chooseMode(mode){

 gameMode=mode;

 loadingScreen.style.display="flex";

  15
 );

 initializeMap();

 setLoading(

/* =====================================================
   MAP
===================================================== */

function initializeMap(){

 if(map)
  return;

 map=
 L.map("map",{
  zoomControl:true
 }).setView(
  [42.96,-85.67],
  15
 );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:
   "© OpenStreetMap contributors"
  }
 ).addTo(map);

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

 if(!navigator.geolocation){

  setStatus(
   "❌ GPS isn't supported."
  );

  return;

 }

 if(watchId!==null)
  navigator.geolocation.clearWatch(watchId);

 watchId=
 navigator.geolocation.watchPosition(
  onLocation,
  onLocationError,
  {
   enableHighAccuracy:true,
   maximumAge:2000,
   timeout:12000
  }
 );

}


function onLocation(position){

 const lat=
 position.coords.latitude;

 const lon=
 position.coords.longitude;

 const accuracy=
 position.coords.accuracy||30;

 setLoading(
  "Location found!",
  60
 );

 if(!playerMarker){

  createPlayer(lat,lon);

  map.setView(
   [lat,lon],
   17
  );

  loadingScreen.style.display="none";

  setStatus(
   "🗺️ Finding your road..."
  );

  loadRoadNetwork(lat,lon);

 }else{

  playerMarker.setLatLng(
   [lat,lon]
  );

  if(accuracyCircle){

   accuracyCircle
   .setLatLng([lat,lon])
   .setRadius(accuracy);

  }

 }

 collectNearbyCoins(lat,lon);

 /*
  IMPORTANT:
  If there are no coins or very few coins,
  immediately generate another batch.
 */

 if(
  coins.filter(c=>!c.collected).length
  <= LOW_COIN_THRESHOLD
 ){

  loadRoadNetwork(
   lat,
   lon,
   true
  );

 }

 if(
  lastRoadLat!==null
 ){

  const moved=
  distanceMeters(
   lastRoadLat,
   lastRoadLon,
   lat,
   lon
  );

  if(
   moved>=ROAD_REFRESH_DISTANCE
  ){

   loadRoadNetwork(
    lat,
    lon
   );

  }

 }

 updateLiveStatus(
  lat,
  lon
 );

}


function updateLiveStatus(lat,lon){

 if(!coins.length)
  return;

 let nearest=Infinity;

 for(const c of coins){

  if(c.collected)
   continue;

  const d=
  distanceMeters(
   lat,
   lon,
   c.lat,
   c.lon
  );

  if(d<nearest)
   nearest=d;

 }

 if(nearest!==Infinity){

  setStatus(
   `🪙 Nearest coin: ${Math.round(nearest)}m • Coins nearby: ${
    coins.filter(c=>!c.collected).length
   }`
  );

 }

}


function onLocationError(error){

 console.log("GPS error",error);

 loadingScreen.style.display="none";

 if(error.code===1){

 }else{

  setStatus(
   "📍 Waiting for GPS..."

}

/* =====================================================
   ROAD NETWORK
===================================================== */

async function loadRoadNetwork(
 lat,
 lon,
 force=false
){

 if(loadingRoads)
  return;

 loadingRoads=true;

 lastRoadLat=lat;
 lastRoadLon=lon;

 setStatus(
  "🗺️ Searching connected roads..."
 );

 try{

  const ways=
  await getNearbyWays(
   lat,
   lon
  );

  if(!ways.length){

   setStatus(
    "🔎 No roads found. Retrying..."
   );

   loadingRoads=false;

   setTimeout(
    ()=>{
     loadRoadNetwork(
      lat,
      lon,
      true
     );
    },
    4000
   );

   return;

  }

  const nearest=
  findNearestRoadPoint(
   ways,
   lat,
   lon
  );

  if(!nearest){

   loadingRoads=false;

   return;

  }

  const roadDistance=
  Math.round(
   nearest.distance
  );

  if(roadDistance>350){

   setStatus(
    `🚶 Nearest mapped road: ${roadDistance}m`
   );

   loadingRoads=false;

   return;

  }

  const network=
  buildConnectedNetwork(
   ways,
   nearest.way
  );

  /*
   Draw the connected network faintly.
   This also helps confirm the game found
   the correct road rather than a nearby
   disconnected road.
  */

  drawRoadNetwork(network);

  generateNetworkCoins(
   network,
   nearest
  );

  setStatus(
   `🛣️ Road ${roadDistance}m away • ${coins.filter(c=>!c.collected).length} coins`
  );

 }catch(error){

  console.error(
   "Road error",
   error
  );

  setStatus(
   "⚠️ Road server unavailable. Retrying..."
  );

 }finally{

  loadingRoads=false;

 }

}


/* =====================================================
   OVERPASS
===================================================== */

async function getNearbyWays(
 lat,
 lon
){

 const latDelta=
 SEARCH_RADIUS/111320;

 const lonDelta=
 SEARCH_RADIUS/
 (
  111320*
  Math.cos(
   lat*Math.PI/180
  )
 );

 const south=lat-latDelta;
 const north=lat+latDelta;
 const west=lon-lonDelta;
 const east=lon+lonDelta;

 let filter=`
 way["highway"]
 (${south},${west},${north},${east});
 `;

 if(gameMode==="PUBLIC"){

  filter=`
   way["highway"]
   ["access"!="private"]
   ["access"!="no"]
   ["access"!="customers"]
   ["access"!="permit"]
   (${south},${west},${north},${east});
  `;

 }

 const query=`

 [out:json][timeout:20];

 ${filter}

 out tags geom;

 `;

 for(const server of OVERPASS_SERVERS){

  try{

   const controller=
   new AbortController();

   const timeout=
   setTimeout(
    ()=>{
     controller.abort();
    },
    15000
   );

   const response=
   await fetch(
    server,
    {
     method:"POST",

     headers:{
      "Content-Type":
      "application/x-www-form-urlencoded"
     },

     body:
     "data="+
     encodeURIComponent(query),

     signal:
     controller.signal
    }
   );

   clearTimeout(timeout);

   if(!response.ok)
    continue;

   const json=
   await response.json();

   const ways=
   filterWays(
    json.elements||[]
   );

   if(ways.length)
    return ways;

  }catch(error){

   console.log(
    "Overpass failed",
    server
   );

  }

 }

 return [];

}


/* =====================================================
   FILTER ROADS
===================================================== */

function filterWays(elements){

 const publicAllowed=[
  "footway",
  "path",
  "pedestrian",
  "steps",
  "cycleway",
  "bridleway",
  "living_street",
  "residential",
  "unclassified",
  "service",
  "tertiary",
  "tertiary_link",
  "secondary",
  "secondary_link
 ];

 const result=[];

 for(const e of elements){

  if(
   e.type!=="way"||
   !e.geometry||
   e.geometry.length<2
  )
   continue;

  const highway=
  e.tags?.highway;

  if(!highway)
   continue;

  if(gameMode==="PUBLIC"){

   if(
    !publicAllowed.includes(highway)
   )
    continue;

  }else{

   if([
    "motorway",
    "motorway_link",
    "trunk",
    "trunk_link"
   ].includes(highway))
    continue;

  }

  result.push({

   id:e.id,

   geometry:
   e.geometry.map(
    p=>({
     lat:Number(p.lat),
     lon:Number(p.lon)
    })
   ),

   tags:e.tags||{}

  });

 }

 return result;

}


/* =====================================================
   NEAREST ROAD
===================================================== */

function findNearestRoadPoint(
 ways,
 lat,
 lon
){

 let best=null;

 for(const way of ways){

  for(
   let i=0;
   i<way.geometry.length-1;
   i++
  ){

   const a=way.geometry[i];
   const b=way.geometry[i+1];

   const point=
   closestPointOnSegment(
    lat,
    lon,
    a.lat,
    a.lon,
    b.lat,
    b.lon
   );

   const d=
   distanceMeters(
    lat,
    lon,
    point.lat,
    point.lon
   );

   if(
    !best||
    d<best.distance
   ){

    best={
     way,
     segmentIndex:i,
     point,
     distance:d
    };

   }

  }

 }

 return best;

}


function closestPointOnSegment(
 lat,
 lon,
 lat1,
 lon1,
 lat2,
 lon2
){

 const cos=
 Math.cos(
  lat*Math.PI/180
 );

 const x=
 (lon-lon1)*111320*cos;

 const y=
 (lat-lat1)*111320;

 const dx=
 (lon2-lon1)*111320*cos;

 const dy=
 (lat2-lat1)*111320;

 const len2=
 dx*dx+dy*dy;

 let t=
 len2===0
 ?0
 :(x*dx+y*dy)/len2;

 t=Math.max(
  0,
  Math.min(1,t)
 );

 return{
  lat:lat1+(lat2-lat1)*t,
  lon:lon1+(lon2-lon1)*t
 };

}


/* =====================================================
   CONNECTED ROADS
===================================================== */

function buildConnectedNetwork(
 ways,
 startingWay
){

 const network=[];
 const visited=new Set();
 const queue=[startingWay];

 while(queue.length){

  const way=queue.shift();

  if(visited.has(way.id))
   continue;

  visited.add(way.id);
  network.push(way);

  for(const other of ways){

   if(visited.has(other.id))
    continue;

   if(
    waysConnected(
     way,
     other
    )
   ){

    queue.push(other);

   }

  }

 }

 return network;

}


function waysConnected(a,b){

 const a1=a.geometry[0];

 const a2=
 a.geometry[
  a.geometry.length-1
 ];

 const b1=b.geometry[0];

 const b2=
 b.geometry[
  b.geometry.length-1
 ];

 const limit=35;

 return(
  distanceMeters(
   a1.lat,a1.lon,
   b1.lat,b1.lon
  )<=limit||

  distanceMeters(
   a1.lat,a1.lon,
   b2.lat,b2.lon
  )<=limit||

  distanceMeters(
   a2.lat,a2.lon,
   b1.lat,b1.lon
  )<=limit||

  distanceMeters(
   a2.lat,a2.lon,
   b2.lat,b2.lon
  )<=limit
 );

}


/* =====================================================
   DRAW ROAD NETWORK
===================================================== */

let roadLayers=[];

function drawRoadNetwork(network){

 for(const layer of roadLayers){

  if(map.hasLayer(layer))
   map.removeLayer(layer);

 }

 roadLayers=[];

 for(const way of network){

  const line=
  L.polyline(
   way.geometry.map(
    p=>[p.lat,p.lon]
   ),
   {
    color:"#00aaff",
    weight:3,
    opacity:.25
   }
  ).addTo(map);

  roadLayers.push(line);

 }

}


/* =====================================================
   COIN GENERATION
===================================================== */

function generateNetworkCoins(
 network,
 nearest
){

 /*
  Remove only coins that haven't been
  collected when rebuilding the nearby area.
 */

 removeUncollectedCoins();

 const ordered=
 network.slice().sort(
  (a,b)=>
   distanceToWay(nearest.point,a)-
   distanceToWay(nearest.point,b)
 );

 let generated=0;

 for(
  let i=0;
  i<ordered.length&&
  generated<MAX_COINS;
  i++
 ){

  const way=ordered[i];

  const points=
  pointsAlongWay(
   way,
   i===0?nearest.point:null
  );

  for(const p of points){

   if(generated>=MAX_COINS)
    break;

   if(
    addCoin(
     p.lat,
     p.lon
    )
   ){

    generated++;

   }

  }

 }

}


/* =====================================================
   POINTS ALONG ROAD
===================================================== */

function pointsAlongWay(
 way,
 startingPoint=null
){

 const result=[];

 let geometry=
 way.geometry.slice();

 if(startingPoint){

  const first=geometry[0];

  const last=
  geometry[
   geometry.length-1
  ];

  const dFirst=
  distanceMeters(
   startingPoint.lat,
   startingPoint.lon,
   first.lat,
   first.lon
  );

  const dLast=
  distanceMeters(
   startingPoint.lat,
   startingPoint.lon,
   last.lat,
   last.lon
  );

  if(dLast<dFirst)
   geometry.reverse();

 }

 let accumulated=0;

 let previous=
 startingPoint||
 geometry[0];

 for(
  let i=0;
  i<geometry.length;
  i++
 ){

  const p=geometry[i];

  const d=
  distanceMeters(
   previous.lat,
   previous.lon,
   p.lat,
   p.lon
  );

  accumulated+=d;

  if(accumulated>=COIN_SPACING){

   result.push({
    lat:p.lat,
    lon:p.lon
   });

   accumulated=0;

  }

  previous=p;

 }

 return result;

}


function distanceToWay(
 point,
 way
){

 let best=Infinity;

 for(const p of way.geometry){

  const d=
  distanceMeters(
   point.lat,
   point.lon,
   p.lat,
   p.lon
  );

  if(d<best)
   best=d;

 }

 return best;

}


/* =====================================================
   COINS
===================================================== */

function coinId(lat,lon){

 return(
  Math.round(lat*100000)+
  "_"+
  Math.round(lon*100000)
 );

}


function addCoin(lat,lon){

 if(!map||!playerData)
  return false;

 const id=coinId(lat,lon);

 if(
  playerData.collected_coins
  .includes(id)
 )
  return false;

 for(const c of coins){

  if(c.collected)
   continue;

  if(
   distanceMeters(
    lat,lon,
    c.lat,c.lon
   )<25
  )
   return false;

 }

 const marker=
 L.marker(
  [lat,lon],
  {
   icon:
   L.divIcon({

    className:"",

    html:
    `<div class="coin">🪙</div>`,

    iconSize:[34,34],
    iconAnchor:[17,17]

   })
  }
 ).addTo(map);

 coins.push({

  id,
  lat,
  lon,
  marker,
  collected:false

 });

 return true;

}


function removeUncollectedCoins(){

 for(const c of coins){

  if(
   !c.collected&&
   map.hasLayer(c.marker)
  ){

   map.removeLayer(c.marker);

  }

 }

 coins=
 coins.filter(
  c=>c.collected
 );

}


/* =====================================================
   COLLECTION
===================================================== */

function collectNearbyCoins(
 lat,
 lon
){

 for(const c of coins){

  if(c.collected)
   continue;

  const d=
  distanceMeters(
   lat,
   lon,
   c.lat,
   c.lon
  );

  if(
   d<=COLLECTION_DISTANCE
  ){

   collectCoin(c);

  }

 }

}


async function collectCoin(c){

 if(
  !playerData||
  c.collected
 )
  return;

 c.collected=true;

 if(map.hasLayer(c.marker))
  map.removeLayer(c.marker);

 if(
  !playerData.collected_coins
  .includes(c.id)
 ){

  playerData.collected_coins.push(
   c.id
  );

 }

 playerData.coins+=10;
 playerData.xp+=10;

 checkLevel();

 updateCoinDisplay();

 playCoinSound();

 showToast(
  "🪙 COIN COLLECTED! +10"
 );

 await savePlayer();

 /*
  VERY IMPORTANT:
  If that was the last coin, immediately
  request another road batch.
 */

 const remaining=
 coins.filter(
  c=>!c.collected
 ).length;

 if(
  remaining<=LOW_COIN_THRESHOLD
 ){

  const pos=
  playerMarker?.getLatLng();

  if(pos){

   loadRoadNetwork(
    pos.lat,
    pos.lng,
    true
   );

  }

 }

}


function checkLevel(){

 if(!playerData)
  return;

 let required=
 playerData.level*100;

 while(
  playerData.xp>=required
 ){

  playerData.xp-=required;
  playerData.level++;

  showToast(
   `🎉 LEVEL ${playerData.level}!`
  );

  required=
  playerData.level*100;

 }

}


/* =====================================================
   DISPLAY
===================================================== */

function updateCoinDisplay(){

 coinsDisplay.textContent=
 `🪙 Coins: ${
  playerData?.coins||0
 }`;

}


/* =====================================================
   SHOP
===================================================== */

document
.getElementById("shopButton")
.addEventListener(
 "click",
 ()=>{
  shopOverlay.style.display="block";
  renderShop();
 }
);

document
.getElementById("closeShop")
.addEventListener(
 "click",
 ()=>{
  shopOverlay.style.display="none";
 }
);


function renderShop(){

 if(!playerData)
  return;

 shopBalance.textContent=
 `🪙 Coins: ${playerData.coins}`;

 shopItems.innerHTML="";

 for(
  const [id,skin]
  of Object.entries(SKINS)
 ){

  const unlocked=
  playerData.unlocked_skins
  .includes(id);

  const equipped=
  playerData.equipped_skin===id;

  const item=
  document.createElement("div");

  item.className="shopItem";

  const preview=
  document.createElement("div");

  preview.className="skinPreview";
  preview.style.background=skin.color;

  const info=
  document.createElement("div");

  info.className="skinInfo";

  info.innerHTML=`
   <div class="skinName">
    ${skin.name}
   </div>
   <div class="skinPrice">
    ${
     skin.price===0
     ?"FREE"
     :"🪙 "+skin.price
    }
   </div>
  `;

  const button=
  document.createElement("button");

  button.className="action";

  if(equipped){

   button.textContent="EQUIPPED";
   button.disabled=true;

  }else if(unlocked){

   button.textContent="EQUIP";

   button.onclick=
   ()=>{
    equipSkin(id);
   };

  }else if(
   playerData.coins>=skin.price
  ){

   button.textContent="BUY";

   button.onclick=
   ()=>{
    buySkin(id);
   };

  }else{

   button.textContent="NEED COINS";
   button.disabled=true;

  }

  item.append(
   preview,
   info,
   button
  );

  shopItems.appendChild(item);

 }

}


async function buySkin(id){

 const skin=SKINS[id];

 if(
  !skin||
  !playerData||
  playerData.coins<skin.price
 )
  return;

 playerData.coins-=skin.price;

 playerData.unlocked_skins.push(id);

 playerData.equipped_skin=id;

 await savePlayer();

 updateCoinDisplay();
 updatePlayerSkin();
 renderShop();

 showToast(
  `🎨 ${skin.name} unlocked!`
 );

}


async function equipSkin(id){

 if(
  !playerData.unlocked_skins
  .includes(id)
 )
  return;

 playerData.equipped_skin=id;

 await savePlayer();

 updatePlayerSkin();
 renderShop();

}


function updatePlayerSkin(){

 if(!playerMarker)
  return;

 const skin=
 SKINS[
  playerData.equipped_skin
 ]||SKINS.blue;

 playerMarker.setIcon(
  L.divIcon({

   className:"",

   html:
   `<div class="player"
   style="--player-color:${skin.color}"></div>`,

   iconSize:[28,28],
   iconAnchor:[14,14]

  })
 );

}
