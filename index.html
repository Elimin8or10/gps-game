<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>GPS Coin</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#080b10;
}

button{
  font-family:inherit;
}

#map{
  position:fixed;
  inset:0;
  z-index:1;
}

/* =========================
   AUTH
========================= */

#authScreen{
  position:fixed;
  inset:0;
  z-index:999999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at center,#18293a,#080b10 72%);
  color:white;
}

.authBox{
  width:min(420px,100%);
  padding:30px 24px;
  border-radius:26px;
  background:rgba(15,22,30,.96);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 70px rgba(0,0,0,.65);
  text-align:center;
}

.logo{
  font-size:64px;
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.authBox h1{
  margin:5px 0;
  font-size:36px;
  font-weight:900;
}

.authBox p{
  color:#9daab8;
  font-size:14px;
  margin:8px 0 24px;
}

.authInput{
  width:100%;
  padding:15px;
  border:1px solid #344250;
  border-radius:14px;
  outline:none;
  background:#0d141c;
  color:white;
  font-size:16px;
}

.authButton{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#00aaff;
  color:white;
  font-size:16px;
  font-weight:800;
}

.authButton:active{
  transform:scale(.98);
}

#authStatus{
  min-height:20px;
  margin-top:14px;
  color:#9daab8;
  font-size:13px;
}

/* =========================
   MODE
========================= */

#modeScreen{
  position:fixed;
  inset:0;
  z-index:999998;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at center,#172333,#080b10 72%);
  color:white;
}

.modeBox{
  width:min(500px,100%);
  text-align:center;
}

.modeBox h1{
  font-size:34px;
  margin:0 0 8px;
}

.modeBox p{
  color:#9ca9b8;
  margin:0 0 25px;
}

.modeButtons{
  display:flex;
  gap:14px;
}

.modeButton{
  flex:1;
  min-height:180px;
  padding:20px 12px;
  border:1px solid #344250;
  border-radius:22px;
  background:#151d26;
  color:white;
  transition:.15s;
}

.modeButton:active{
  transform:scale(.96);
}

.modeButton:hover{
  border-color:#00aaff;
}

.modeIcon{
  font-size:45px;
  margin-bottom:12px;
}

.modeName{
  font-size:19px;
  font-weight:900;
}

.modeDescription{
  margin-top:8px;
  color:#8e9aaa;
  font-size:12px;
  line-height:1.4;
}

/* =========================
   LOADING
========================= */

#loadingScreen{
  position:fixed;
  inset:0;
  z-index:999997;
  display:none;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#172333,#080b10 72%);
  color:white;
  transition:.5s;
}

#loadingScreen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loadingContent{
  width:min(430px,90%);
  text-align:center;
}

.loadingLogo{
  font-size:64px;
  animation:float 2s ease-in-out infinite;
}

.loadingTitle{
  margin:5px 0;
  font-size:36px;
  font-weight:900;
}

.loadingSubtitle{
  color:#9ca9b8;
  font-size:14px;
}

.loadingBar{
  width:100%;
  height:7px;
  margin-top:30px;
  border-radius:20px;
  overflow:hidden;
  background:#202a35;
}

#loadingBarInner{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#00aaff,#66ddff);
  box-shadow:0 0 15px #00aaff;
  transition:.4s;
}

#loadingText{
  margin-top:14px;
  color:#b9c5d2;
  font-size:14px;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  top:calc(10px + env(safe-area-inset-top));
  left:10px;
  right:10px;
  z-index:1000;
  display:flex;
  gap:7px;
  pointer-events:none;
}

.hudBox{
  min-height:44px;
  padding:10px 12px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(8,13,19,.94);
  color:white;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
  font-weight:bold;
  pointer-events:auto;
}

#coinsDisplay{
  flex:1;
  justify-content:flex-start;
}

#shopButton,
#accountButton{
  min-width:46px;
  cursor:pointer;
}

/* =========================
   STATUS
========================= */

#status{
  position:fixed;
  left:12px;
  right:12px;
  bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:1000;
  padding:11px 14px;
  border-radius:14px;
  background:rgba(8,13,19,.94);
  color:white;
  text-align:center;
  font-size:13px;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
  pointer-events:none;
}

/* =========================
   PLAYER
========================= */

.player{
  width:24px;
  height:24px;
  border:3px solid white;
  border-radius:50%;
  background:var(--player-color);
  box-shadow:
    0 0 8px var(--player-color),
    0 0 18px var(--player-color),
    0 0 30px var(--player-color);
}

/* =========================
   COINS
========================= */

.coin{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:3px solid #fff4a3;
  background:
    radial-gradient(
      circle at 35% 35%,
      #fffbd0,
      #ffe44d 25%,
      #ffd000 55%,
      #f0a000 80%,
      #c87800
    );
  box-shadow:
    0 0 8px #ffd700,
    0 0 18px #ffb000,
    0 0 28px rgba(255,190,0,.7);
  animation:coinPulse 1.4s infinite;
  font-size:15px;
}

@keyframes coinPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.13)}
}

/* =========================
   ROAD DISTANCE
========================= */

#roadDistance{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  top:calc(62px + env(safe-area-inset-top));
  z-index:999;
  padding:7px 12px;
  border-radius:12px;
  background:rgba(8,13,19,.9);
  color:white;
  font-size:12px;
  font-weight:bold;
  pointer-events:none;
}

/* =========================
   LEAFLET
========================= */

.leaflet-top{
  top:calc(115px + env(safe-area-inset-top)) !important;
}

.leaflet-left{
  left:10px !important;
}

.leaflet-control-zoom a{
  width:40px !important;
  height:40px !important;
  line-height:40px !important;
  font-size:20px !important;
}

/* =========================
   SHOP / ACCOUNT
========================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  padding:20px;
  overflow-y:auto;
  background:rgba(0,0,0,.8);
}

.panel{
  width:min(500px,100%);
  margin:30px auto;
  padding:20px;
  border-radius:22px;
  background:#151a20;
  color:white;
  box-shadow:0 10px 40px rgba(0,0,0,.7);
}

.panelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panelHeader h2{
  margin:0;
}

.closeButton{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  background:#333;
  color:white;
  font-size:18px;
}

.balance{
  margin:15px 0;
  padding:12px;
  text-align:center;
  border-radius:12px;
  background:rgba(255,215,0,.12);
  border:1px solid rgba(255,215,0,.4);
  font-weight:bold;
}

.shopItem{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
  padding:14px;
  border-radius:15px;
  background:#20262d;
}

.skinPreview{
  width:42px;
  height:42px;
  border:4px solid white;
  border-radius:50%;
}

.skinInfo{
  flex:1;
}

.skinName{
  font-weight:bold;
}

.skinPrice{
  margin-top:4px;
  color:#ffd700;
  font-size:13px;
}

.actionButton{
  border:0;
  border-radius:10px;
  padding:9px 12px;
  background:#0077cc;
  color:white;
  font-weight:bold;
}

.actionButton:disabled{
  opacity:.45;
}

.emailBox{
  margin:15px 0;
  padding:12px;
  border-radius:12px;
  background:#20262d;
  color:#b9c5d2;
  word-break:break-all;
}

.accountAction{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#0077cc;
  color:white;
  font-weight:bold;
}

.danger{
  background:#a83232;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  z-index:10000;
  transform:translate(-50%,20px);
  padding:13px 18px;
  border-radius:14px;
  background:#101820;
  color:white;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-weight:bold;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:430px){

  .modeButtons{
    flex-direction:column;
  }

  .modeButton{
    min-height:140px;
  }

}

</style>
</head>

<body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   SETTINGS
========================================================= */

const SEARCH_RADIUS = 1000;

const COIN_SPACING = 55;

const COLLECTION_DISTANCE = 25;

const REFRESH_DISTANCE = 80;

const MAIN_COINS = 12;

const BRANCH_COINS = 5;


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let playerData = null;

let map = null;

let playerMarker = null;

let coins = [];

let gpsStarted = false;

let trailLoading = false;

let currentLat = null;

let currentLon = null;

let gameMode = "PUBLIC";


const OVERPASS_SERVERS = [

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter"

];


/* =========================================================
   SKINS
========================================================= */

const SKINS = {

  blue:{
    name:"Blue",
    color:"#00aaff",
    price:0
  },

  red:{
    name:"Red",
    color:"#ff3030",
    price:50
  },

  green:{
    name:"Green",
    color:"#22dd55",
    price:100
  },

  purple:{
    name:"Purple",
    color:"#aa55ff",
    price:150
  },

  gold:{
    name:"Gold",
    color:"#ffd000",
    price:250
  },

  pink:{
    name:"Pink",
    color:"#ff4fa3",
    price:350
  }

};


/* =========================================================
   ELEMENTS
========================================================= */

const authScreen =
  document.getElementById("authScreen");

const emailInput =
  document.getElementById("emailInput");

const authStatus =
  document.getElementById("authStatus");

const modeScreen =
  document.getElementById("modeScreen");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingText =
  document.getElementById("loadingText");

const loadingBarInner =
  document.getElementById("loadingBarInner");

const coinsDisplay =
  document.getElementById("coinsDisplay");

const status =
  document.getElementById("status");

const roadDistance =
  document.getElementById("roadDistance");


/* =========================================================
   AUTH
========================================================= */

document
  .getElementById("signInButton")
  .addEventListener("click",signIn);


emailInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){
      signIn();
    }

  }
);


async function signIn(){

  const email =
    emailInput.value.trim();

  if(!email){

    authStatus.textContent =
      "Enter your email.";

    return;

  }


  authStatus.textContent =
    "Sending sign-in link...";


  try{

    const redirect =
      window.location.href.split("#")[0];


    const {
      error
    } =
    await supabase.auth.signInWithOtp({

      email,

      options:{
        emailRedirectTo:redirect
      }

    });


    if(error)
      throw error;


    authStatus.textContent =
      "✅ Check your email for the sign-in link.";

  }

  catch(error){

    console.error(error);

    authStatus.textContent =
      "❌ " + error.message;

  }

}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  try{

    const {
      data
    } =
    await supabase.auth.getSession();


    currentUser =
      data.session?.user || null;


    if(!currentUser){

      authScreen.style.display =
        "flex";

      return;

    }


    authScreen.style.display =
      "none";


    await loadPlayer();


    modeScreen.style.display =
      "flex";

  }

  catch(error){

    console.error(error);

    authScreen.style.display =
      "flex";

  }

}


/* =========================================================
   AUTH LISTENER
========================================================= */

supabase.auth.onAuthStateChange(
  (event,session)=>{

    if(
      event === "SIGNED_IN" &&
      session
    ){

      currentUser =
        session.user;

      authScreen.style.display =
        "none";

      loadPlayer()
        .then(()=>{
          modeScreen.style.display =
            "flex";
        });

    }


    if(event === "SIGNED_OUT"){

      location.reload();

    }

  }
);


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

  if(!currentUser)
    return;


  let result =
    await supabase
      .from("players")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();


  if(result.error)
    throw result.error;


  if(!result.data){

    const created =
      await supabase
        .from("players")
        .insert({
          id:currentUser.id
        })
        .select()
        .single();


    if(created.error)
      throw created.error;


    playerData =
      created.data;

  }
  else{

    playerData =
      result.data;

  }


  updateCoinDisplay();

}


/* =========================================================
   MODE
========================================================= */

document
  .getElementById("publicMode")
  .addEventListener(
    "click",
    ()=>{
      chooseMode("PUBLIC");
    }
  );


document
  .getElementById("unlimitedMode")
  .addEventListener(
    "click",
    ()=>{
      chooseMode("UNLIMITED");
    }
  );


function chooseMode(mode){

  gameMode =
    mode;

  modeScreen.style.display =
    "none";

  loadingScreen.style.display =
    "flex";

  setLoading(
    "Requesting your location...",
    20
  );

  startGPS();

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(text,percent){

  loadingText.textContent =
    text;

  loadingBarInner.style.width =
    percent + "%";

}


/* =========================================================
   GPS
========================================================= */

function startGPS(){

  if(gpsStarted)
    return;


  gpsStarted =
    true;


  if(!navigator.geolocation){

    setStatus(
      "❌ GPS is not available."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      updateLocation(
        position
      );

    },

    error => {

      console.error(error);

      if(
        error.code === 1
      ){

        setStatus(
          "📍 Location permission denied. Enable Location for this site."
        );

      }
      else{

        setStatus(
          "📍 Couldn't get location. Trying again..."
        );

      }

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }

  );


  navigator.geolocation.watchPosition(

    updateLocation,

    locationError,

    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:20000
    }

  );

}


/* =========================================================
   LOCATION
========================================================= */

function updateLocation(position){

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;


  if(!map){

    startGame(
      lat,
      lon
    );

    return;

  }


  currentLat =
    lat;

  currentLon =
    lon;


  if(playerMarker){

    playerMarker.setLatLng([
      lat,
      lon
    ]);

  }


  checkCoinCollection(
    lat,
    lon
  );


  updateNearestRoadDistance(
    lat,
    lon
  );


  if(
    lastTrailLat !== null &&
    lastTrailLon !== null
  ){

    const moved =
      distanceMeters(
        lastTrailLat,
        lastTrailLon,
        lat,
        lon
      );


    if(
      moved >= REFRESH_DISTANCE
    ){

      loadTrail(
        lat,
        lon
      );

    }

  }

}


function locationError(error){

  console.error(
    "GPS error",
    error
  );

}


/* =========================================================
   START GAME
========================================================= */

function startGame(lat,lon){

  currentLat =
    lat;

  currentLon =
    lon;


  map =
    L.map("map",{
      zoomControl:true
    }).setView(
      [lat,lon],
      17
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);


  createPlayer(
    lat,
    lon
  );


  setLoading(
    "Finding the nearest connected road...",
    70
  );

/* =========================================================
   ROAD DATA
========================================================= */

let lastTrailLat = null;

let lastTrailLon = null;

let currentWays = [];


async function loadTrail(lat,lon){

  if(trailLoading)
    return;


  trailLoading =
    true;


  setStatus(
    "🛣️ Finding nearest connected road..."
  );


  try{

    const ways =
      await getNearbyWays(
        lat,
        lon
      );


    currentWays =
      ways;


    if(!ways.length){

      setStatus(
        "❌ No suitable roads nearby."
      );

      return;

    }


    const network =
      buildConnectedNetwork(
        ways,
        lat,
        lon
      );


    if(!network){

      setStatus(
        "❌ Couldn't find a connected road."
      );

      return;

    }


    const distance =
      network.distance;


    roadDistance.textContent =
      "🛣️ Nearest road: " +
      Math.round(distance) +
      "m";


    if(distance > 300){

      setStatus(
        "🛣️ Nearest road is " +
        Math.round(distance) +
        "m away."
      );

      return;

    }


    removeUncollectedCoins();


    const route =
      generateCoinsAlongNetwork(
        ways,
        network
      );


    for(
      const point of route
    ){

      createCoin(
        point.lat,
        point.lon
      );

    }


    lastTrailLat =
      lat;

    lastTrailLon =
      lon;


    setStatus(
      "🪙 " +
      route.length +
      " coins placed along your road"
    );


    setLoading(
      "Ready!",
      100
    );


    setTimeout(
      ()=>{
        loadingScreen.classList.add(
          "hidden"
        );
      },
      500
    );

  }

  catch(error){

    console.error(
      "Trail error:",
      error
    );

    setStatus(
      "⚠️ Road loading failed."
    );

  }

  finally{

    trailLoading =
      false;

  }

}


/* =========================================================
   OVERPASS
========================================================= */

async function getNearbyWays(lat,lon){

  const latOffset =
    SEARCH_RADIUS / 111320;


  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat *
        Math.PI /
        180
      )
    );


  const south =
    lat-latOffset;

  const north =
    lat+latOffset;

  const west =
    lon-lonOffset;

  const east =
    lon+lonOffset;


  const query = `

    [out:json][timeout:25];

    way["highway"]
      (${south},${west},${north},${east});

    out tags geom;

  `;


  for(
    const server of
    OVERPASS_SERVERS
  ){

    try{

      const response =
        await fetch(
          server,
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },
            body:
              "data=" +
              encodeURIComponent(query)
          }
        );


      if(!response.ok)
        continue;


      const data =
        await response.json();


      return filterWays(
        data.elements || []
      );

    }
    catch(error){

      console.log(
        "Overpass failed",
        error
      );

    }

  }


  return [];

}


/* =========================================================
   FILTER
========================================================= */

function filterWays(elements){

  const result = [];


  for(
    const element of
    elements
  ){

    if(
      element.type !== "way" ||
      !element.geometry ||
      element.geometry.length < 2
    )
      continue;


    const tags =
      element.tags || {};


    const highway =
      tags.highway;


    if(!highway)
      continue;


    const access =
      String(
        tags.access || ""
      ).toLowerCase();


    if(
      access === "private" ||
      access === "no" ||
      access === "permit" ||
      access === "customers"
    )
      continue;


    if(gameMode === "PUBLIC"){

      const allowed = [

        "footway",
        "path",
        "pedestrian",
        "steps",
        "cycleway",
        "bridleway",
        "living_street",
        "residential",
        "service",
        "track"

      ];


      if(
        !allowed.includes(highway)
      )
        continue;

    }


    if(gameMode === "UNLIMITED"){

      const forbidden = [

        "motorway",
        "motorway_link",
        "trunk",
        "trunk_link"

      ];


      if(
        forbidden.includes(highway)
      )
        continue;

    }


    result.push({

      id:element.id,

      geometry:element.geometry,

      tags:tags

    });

  }


  return result;

}


/* =========================================================
   CONNECTED NETWORK
========================================================= */

function buildConnectedNetwork(
  ways,
  lat,
  lon
){

  let best =
    null;


  for(
    const way of ways
  ){

    for(
      let i=0;
      i<way.geometry.length;
      i++
    ){

      const p =
        way.geometry[i];


      const d =
        distanceMeters(
          lat,
          lon,
          p.lat,
          p.lon
        );


      if(
        !best ||
        d < best.distance
      ){

        best = {

          way:way,

          index:i,

          distance:d,

          point:p

        };

      }

    }

  }


  return best;

}


/* =========================================================
   GENERATE CONNECTED COINS
========================================================= */

function generateCoinsAlongNetwork(
  ways,
  start
){

  const result = [];


  let way =
    start.way;

  let index =
    start.index;


  let direction =
    index <
    way.geometry.length-1
      ? 1
      : -1;


  let lastPoint =
    way.geometry[index];


  let accumulated = 0;


  const visited =
    new Set();


  let safety = 0;


  while(
    result.length <
      MAIN_COINS &&
    safety < 1000
  ){

    safety++;


    const key =
      way.id +
      ":" +
      index +
      ":" +
      direction;


    if(
      visited.has(key)
    )
      break;


    visited.add(key);


    const nextIndex =
      index + direction;


    if(
      nextIndex < 0 ||
      nextIndex >=
        way.geometry.length
    ){

      const endpoint =
        way.geometry[
          direction === 1
            ? way.geometry.length-1
            : 0
        ];


      const connected =
        findConnectedWay(
          ways,
          endpoint,
          way.id
        );


      if(!connected)
        break;


      way =
        connected.way;

      index =
        connected.index;

      direction =
        connected.direction;

      lastPoint =
        way.geometry[index];

      continue;

    }


    const point =
      way.geometry[nextIndex];


    const d =
      distanceMeters(
        lastPoint.lat,
        lastPoint.lon,
        point.lat,
        point.lon
      );


    accumulated += d;


    if(
      accumulated >=
      COIN_SPACING
    ){

      result.push({

        lat:point.lat,

        lon:point.lon

      });


      accumulated = 0;

    }


    lastPoint =
      point;

    index =
      nextIndex;

  }


  return result;

}


/* =========================================================
   CONNECTED WAY
========================================================= */

function findConnectedWay(
  ways,
  endpoint,
  currentId
){

  let best =
    null;

  let bestDistance =
    35;


  for(
    const way of ways
  ){

    if(
      way.id === currentId
    )
      continue;


    const first =
      way.geometry[0];

    const last =
      way.geometry[
        way.geometry.length-1
      ];


    const d1 =
      distanceMeters(
        endpoint.lat,
        endpoint.lon,
        first.lat,
        first.lon
      );


    const d2 =
      distanceMeters(
        endpoint.lat,
        endpoint.lon,
        last.lat,
        last.lon
      );


    if(d1 < bestDistance){

      best = {

        way:way,

        index:0,

        direction:1

      };

      bestDistance =
        d1;

    }


    if(d2 < bestDistance){

      best = {

        way:way,

        index:
          way.geometry.length-1,

        direction:-1

      };

      bestDistance =
        d2;

    }

  }


  return best;

}


/* =========================================================
   COIN
========================================================= */

function createCoin(lat,lon){

  if(!map || !playerData)
    return;


  const id =
    makeCoinId(
      lat,
      lon
    );


  if(
    playerData.collected_coins &&
    playerData.collected_coins.includes(id)
  )
    return;


  for(
    const existing of coins
  ){

    if(
      distanceMeters(
        lat,
        lon,
        existing.latitude,
        existing.longitude
      ) < 18
    ){

      return;

    }

  }


  const marker =
    L.marker(
      [lat,lon],
      {
        icon:
          L.divIcon({
            className:"",
            html:
              `<div class="coin">🪙</div>`,
            iconSize:[34,34],
            iconAnchor:[17,17]
          })
      }
    ).addTo(map);


  coins.push({

    id:id,

    marker:marker,

    latitude:lat,

    longitude:lon,

    collected:false

  });

}


/* =========================================================
   COIN ID
========================================================= */

function makeCoinId(lat,lon){

  return (
    Math.round(lat*100000) +
    "_" +
    Math.round(lon*100000)
  );

}


/* =========================================================
   REMOVE COINS
========================================================= */

function removeUncollectedCoins(){

  if(!map)
    return;


  const remaining = [];


  for(
    const coin of coins
  ){

    if(coin.collected){

      remaining.push(
        coin
      );

    }
    else{

      if(
        map.hasLayer(
          coin.marker
        )
      ){

        map.removeLayer(
          coin.marker
        );

      }

    }

  }


  coins =
    remaining;

}


/* =========================================================
   CHECK COLLECTION
========================================================= */

function checkCoinCollection(
  lat,
  lon
){

  for(
    const coin of coins
  ){

    if(
      coin.collected
    )
      continue;


    const distance =
      distanceMeters(
        lat,
        lon,
        coin.latitude,
        coin.longitude
      );


    if(
      distance <=
      COLLECTION_DISTANCE
    ){

      collectCoin(
        coin
      );

    }

  }

}


/* =========================================================
   COLLECT COIN
========================================================= */

async function collectCoin(coin){

  if(
    !playerData ||
    !coin ||
    coin.collected
  )
    return;


  coin.collected =
    true;


  if(
    map &&
    map.hasLayer(
      coin.marker
    )
  ){

    map.removeLayer(
      coin.marker
    );

  }


  if(
    !playerData.collected_coins
  ){

    playerData.collected_coins =
      [];

  }


  if(
    !playerData.collected_coins.includes(
      coin.id
    )
  ){

    playerData.collected_coins.push(
      coin.id
    );

  }


  /* =====================
     ACTUAL REWARD
  ===================== */

  playerData.coins =
    Number(playerData.coins || 0) +
    10;


  playerData.xp =
    Number(playerData.xp || 0) +
    10;


  /* =====================
     LEVEL UP
  ===================== */

  while(
    playerData.xp >=
    playerData.level * 100
  ){

    playerData.xp -=
      playerData.level * 100;

    playerData.level++;

    showToast(
      "🎉 LEVEL " +
      playerData.level +
      "!"
    );

  }


  /* =====================
     UPDATE UI IMMEDIATELY
  ===================== */

  updateCoinDisplay();


  setStatus(
    "🪙 +10 coins! Total: " +
    playerData.coins
  );


  showToast(
    "🪙 +10 COINS!"
  );


  /* =====================
     SAVE TO SUPABASE
  ===================== */

  const {
    error
  } =
    await supabase
      .from("players")
      .update({

        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        playerData.id
      );


  if(error){

    console.error(
      "COIN SAVE ERROR:",
      error
    );


    showToast(
      "⚠️ Couldn't save coin"
    );

    return;

  }


  console.log(
    "Coin saved!",
    playerData.coins
  );

}


/* =========================================================
   COIN DISPLAY
========================================================= */

function updateCoinDisplay(){

}


/* =========================================================
   ROAD DISTANCE
========================================================= */

function updateNearestRoadDistance(
  lat,
  lon
){

  if(!currentWays.length)
    return;


  let nearest =
    Infinity;


  for(
    const way of currentWays
  ){

    for(
      const p of way.geometry
    ){

      const d =
        distanceMeters(
          lat,
          lon,
          p.lat,
          p.lon
        );


      if(d < nearest)
        nearest = d;

    }

  }


  if(nearest !== Infinity){

    roadDistance.textContent =
      "🛣️ Nearest road: " +
      Math.round(nearest) +
      "m";

  }

}

  container.innerHTML =

  for(
    const [id,skin]
    of Object.entries(SKINS)
  ){

    const unlocked =
      playerData.unlocked_skins
        .includes(id);


    const equipped =
      playerData.equipped_skin === id;


    const item =
      document.createElement("div");


    item.className =
      "shopItem";


    item.innerHTML = `

      <div
        class="skinPreview"
        style="background:${skin.color}"
      ></div>

      <div class="skinInfo">

        <div class="skinName">
          ${skin.name}
        </div>

        <div class="skinPrice">
          ${
            skin.price === 0
              ? "FREE"
              : "🪙 " + skin.price
          }
        </div>

      </div>

    `;


    const button =
      document.createElement("button");


    button.className =
      "actionButton";


    if(equipped){

      button.textContent =
        "EQUIPPED";

      button.disabled =
        true;

    }
    else if(unlocked){

      button.textContent =
        "EQUIP";

      button.onclick =
        ()=>{
          equipSkin(id);
        };

    }
    else if(
      playerData.coins >=
      skin.price
    ){

      button.textContent =
        "BUY";

      button.onclick =
        ()=>{
          buySkin(id);
        };

    }
    else{

      button.textContent =
        "NEED COINS";

      button.disabled =
        true;

    }


    item.appendChild(
      button
    );


    container.appendChild(
      item
    );

  }

}


/* =========================================================
   BUY SKIN
========================================================= */

async function buySkin(id){

  const skin =
    SKINS[id];


  if(!skin)
    return;


  if(
    playerData.unlocked_skins
      .includes(id)
  )
    return;


  if(
    playerData.coins <
    skin.price
  )
    return;


  playerData.coins -=
    skin.price;


  playerData.unlocked_skins.push(
    id
  );


  playerData.equipped_skin =
    id;


  await savePlayer();


  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();


  showToast(
    "🎨 " +
    skin.name +
    " unlocked!"
  );

}


/* =========================================================
   EQUIP
========================================================= */

async function equipSkin(id){

  if(
    !playerData.unlocked_skins
      .includes(id)
  )
    return;


  playerData.equipped_skin =
    id;


  await savePlayer();


  updatePlayerSkin();

  renderShop();


  showToast(
    "🎨 Skin equipped!"
  );

}

      );

/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dLat =
    (
      lat2-lat1
    ) *
    Math.PI /
    180;


  const dLon =
    (
      lon2-lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  return R*c;

}
