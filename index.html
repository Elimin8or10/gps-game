<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GPS Game</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =====================================================
   GLOBAL
===================================================== */

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #080b0f;

  font-family: Arial, sans-serif;

}


/* =====================================================
   MAP
===================================================== */

#map {

  width: 100%;
  height: 100%;

}


/* =====================================================
   LOADING SCREEN
===================================================== */

#loadingScreen {

  position: fixed;

  inset: 0;

  z-index: 99999;

  display: flex;

  align-items: center;
  justify-content: center;

  background:

    radial-gradient(
      circle at center,
      #18232d 0%,
      #0b1015 45%,
      #05070a 100%
    );

  color: white;

  transition:

    opacity 0.6s ease,
    visibility 0.6s ease;

}


#loadingScreen.hidden {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}


.loadingContent {

  width: min(90%, 360px);

  text-align: center;

}


.loadingLogo {

  width: 86px;
  height: 86px;

  margin: 0 auto 25px;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 42px;

  background:

    radial-gradient(
      circle at 35% 35%,
      #fffbd0,
      #ffd700 35%,
      #e69d00 75%,
      #9b5d00
    );

  box-shadow:

    0 0 15px #ffd700,
    0 0 40px rgba(255,200,0,0.7),
    0 0 90px rgba(255,170,0,0.35);

  animation:

    loadingCoin 1.5s infinite ease-in-out;

}


@keyframes loadingCoin {

  0% {

    transform:
      scale(1)
      rotate(0deg);

  }

  50% {

    transform:
      scale(1.1)
      rotate(8deg);

  }

  100% {

    transform:
      scale(1)
      rotate(0deg);

  }

}


.loadingTitle {

  font-size: 28px;

  font-weight: 800;

  letter-spacing: 1px;

  margin-bottom: 8px;

}


.loadingSubtitle {

  color: #9ca8b3;

  font-size: 15px;

  margin-bottom: 28px;

}


.loadingBar {

  height: 6px;

  width: 100%;

  overflow: hidden;

  border-radius: 20px;

  background: rgba(255,255,255,0.1);

}


.loadingBarInner {

  width: 35%;

  height: 100%;

  border-radius: 20px;

  background: #ffd000;

  box-shadow:

    0 0 12px #ffd000;

  animation:

    loadingBar 1.3s infinite ease-in-out;

}


@keyframes loadingBar {

  0% {

    transform: translateX(-130%);

  }

  100% {

    transform: translateX(400%);

  }

}


.loadingStatus {

  margin-top: 15px;

  font-size: 13px;

  color: #d7dde2;

}


/* =====================================================
   HUD
===================================================== */

#hud {

  position: absolute;

  top: 15px;
  left: 15px;
  right: 15px;

  z-index: 1000;

  display: flex;

  gap: 8px;

  font-family: Arial, sans-serif;

}


.hudBox {

  background:
    rgba(10,15,20,0.95);

  color: white;

  padding: 10px 12px;

  border-radius: 12px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.4);

  font-weight: bold;

}


#coinsDisplay {

  flex: 1;

}


#modeButton,
#shopButton {

  cursor: pointer;

  user-select: none;

}


/* =====================================================
   STATUS
===================================================== */

#status {

  position: absolute;

  bottom: 20px;
  left: 15px;
  right: 15px;

  z-index: 1000;

  background:
    rgba(10,15,20,0.95);

  color: white;

  padding: 12px;

  border-radius: 12px;

  text-align: center;

  font-family: Arial, sans-serif;

  box-shadow:
    0 3px 15px rgba(0,0,0,0.35);

}


/* =====================================================
   LEAFLET CONTROLS
===================================================== */

/*
  Move zoom buttons to bottom-right so they
  never overlap the top HUD.
*/

.leaflet-control-zoom {

  margin-bottom: 95px !important;

  margin-right: 12px !important;

}


.leaflet-control-zoom a {

  background: rgba(10,15,20,0.95) !important;

  color: white !important;

  border-color: #333 !important;

}


/* =====================================================
   PLAYER
===================================================== */

.player {

  width: 22px;
  height: 22px;

  border: 3px solid white;

  border-radius: 50%;

  box-shadow:

    0 0 8px var(--player-color),
    0 0 18px var(--player-color),
    0 0 30px var(--player-color);

  background:
    var(--player-color);

}


/* =====================================================
   COINS
===================================================== */

.coin {

  width: 28px;
  height: 28px;

  background:

    radial-gradient(
      circle at 35% 35%,
      #fffbd0 0%,
      #ffe44d 25%,
      #ffd000 55%,
      #f0a000 80%,
      #c87800 100%
    );

  border: 3px solid #fff4a3;

  border-radius: 50%;

  box-shadow:

    0 0 8px #ffd700,
    0 0 18px #ffb000,
    0 0 28px rgba(255,190,0,0.7);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 17px;

  animation:
    coinPulse 1.4s infinite;

}


@keyframes coinPulse {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.12);
  }

  100% {
    transform: scale(1);
  }

}


/* =====================================================
   SHOP
===================================================== */

#shopOverlay {

  display: none;

  position: absolute;

  inset: 0;

  z-index: 2000;

  background:
    rgba(0,0,0,0.75);

  overflow-y: auto;

  padding: 20px;

  box-sizing: border-box;

}


#shop {

  max-width: 500px;

  margin: 30px auto;

  background:
    #151a20;

  color: white;

  border-radius: 20px;

  padding: 20px;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.7);

}


#shopHeader {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 20px;

}


#shopHeader h2 {

  margin: 0;

}


#closeShop {

  background: #333;

  color: white;

  border: none;

  border-radius: 10px;

  padding: 9px 13px;

  font-size: 18px;

  cursor: pointer;

}


#shopBalance {

  background:
    rgba(255,215,0,0.12);

  border:
    1px solid rgba(255,215,0,0.4);

  border-radius: 12px;

  padding: 12px;

  text-align: center;

  margin-bottom: 15px;

  font-weight: bold;

}


.shopItem {

  background:
    #20262d;

  border-radius: 15px;

  padding: 15px;

  margin-bottom: 12px;

  display: flex;

  align-items: center;

  gap: 15px;

}


.skinPreview {

  width: 42px;
  height: 42px;

  border: 4px solid white;

  border-radius: 50%;

  box-shadow:
    0 0 14px currentColor;

  flex-shrink: 0;

}


.skinInfo {

  flex: 1;

}


.skinName {

  font-weight: bold;

  font-size: 17px;

  margin-bottom: 4px;

}


.skinPrice {

  color: #ffd700;

  font-size: 14px;

}


.shopButton {

  border: none;

  border-radius: 10px;

  padding: 9px 12px;

  color: white;

  background: #0077cc;

  font-weight: bold;

  cursor: pointer;

}


.shopButton:disabled {

  opacity: 0.5;

  cursor: default;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  #hud {

    top: 10px;

    left: 10px;
    right: 10px;

    gap: 6px;

  }


  .hudBox {

    padding: 9px 9px;

    font-size: 13px;

  }


  #status {

    bottom: 15px;

    left: 10px;
    right: 10px;

    font-size: 13px;

  }


  .leaflet-control-zoom {

    margin-bottom: 90px !important;

    margin-right: 10px !important;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     LOADING SCREEN
===================================================== -->

<div id="loadingScreen">

  <div class="loadingContent">

    <div class="loadingLogo">
      🪙
    </div>

    <div class="loadingTitle">
      GPS COIN
    </div>

    <div class="loadingSubtitle">
      Turning the real world into a game...
    </div>

    <div class="loadingBar">

      <div class="loadingBarInner"></div>

    </div>

    <div
      id="loadingStatus"
      class="loadingStatus"
    >
      Finding your location...
    </div>

  </div>

</div>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

  <div
    class="hudBox"
    id="coinsDisplay"
  >
    🪙 Coins: 0
  </div>

  <div
    class="hudBox"
    id="shopButton"
  >
    🛒 SHOP
  </div>

  <div
    class="hudBox"
    id="modeButton"
  >
    🌎 PUBLIC
  </div>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div id="status">
  📍 Finding your location...
</div>


<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>


<!-- =====================================================
     SHOP
===================================================== -->

<div id="shopOverlay">

  <div id="shop">

    <div id="shopHeader">

      <h2>
        🛒 Player Shop
      </h2>

      <button id="closeShop">
        ✕
      </button>

    </div>

    <div id="shopBalance">
      🪙 Coins: 0
    </div>

    <div id="shopItems"></div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   SAVE DATA
===================================================== */

const SAVE_KEY = "gpsGameSave";


const DEFAULT_SAVE = {

  coins: 0,

  unlockedSkins: [
    "blue"
  ],

  equippedSkin: "blue",

  collectedCoins: []

};


let save = loadSave();


function loadSave() {

  try {

    const stored =
      localStorage.getItem(
        SAVE_KEY
      );


    if (!stored) {

      return {
        ...DEFAULT_SAVE
      };

    }


    const parsed =
      JSON.parse(stored);


    return {

      ...DEFAULT_SAVE,

      ...parsed

    };


  } catch (error) {

    console.log(
      "Save error:",
      error
    );


    return {
      ...DEFAULT_SAVE
    };

  }

}


function saveGame() {

  try {

    localStorage.setItem(

      SAVE_KEY,

      JSON.stringify(save)

    );

  } catch (error) {

    console.log(
      "Could not save:",
      error
    );

  }

}


/* =====================================================
   SKINS
===================================================== */

const SKINS = {

  blue: {

    name: "Blue",

    color: "#00aaff",

    price: 0

  },

  red: {

    name: "Red",

    color: "#ff3030",

    price: 50

  },

  green: {

    name: "Green",

    color: "#22dd55",

    price: 100

  },

  purple: {

    name: "Purple",

    color: "#aa55ff",

    price: 150

  },

  gold: {

    name: "Gold",

    color: "#ffd000",

    price: 250

  },

  pink: {

    name: "Pink",

    color: "#ff4fa3",

    price: 350

  }

};


/* =====================================================
   GAME VARIABLES
===================================================== */

let map = null;

let player = null;

let coins = [];

let gameMode = "PUBLIC";

let currentLatitude = null;

let currentLongitude = null;

let loadingTrail = false;


/* =====================================================
   SETTINGS
===================================================== */

const SEARCH_RADIUS = 800;

const COIN_SPACING = 65;

const MAIN_COINS = 5;

const BRANCH_COINS = 3;

const COLLECTION_DISTANCE = 15;

const REFRESH_DISTANCE = 200;


/*
  Overpass servers.
*/

const OVERPASS_SERVERS = [

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter"

];


/* =====================================================
   LOADING SCREEN
===================================================== */

function setLoadingText(text) {

  const element =
    document.getElementById(
      "loadingStatus"
    );

  if (element) {

    element.innerText = text;

  }

}


function hideLoadingScreen() {

  const screen =
    document.getElementById(
      "loadingScreen"
    );

  if (!screen) {
    return;
  }

  screen.classList.add(
    "hidden"
  );

}


/* =====================================================
   HUD
===================================================== */

function updateCoinDisplay() {

  document.getElementById(
    "coinsDisplay"
  ).innerText =

    "🪙 Coins: " +
    save.coins;

}


updateCoinDisplay();


/* =====================================================
   START GAME
===================================================== */

function startGame(

  latitude,
  longitude

) {

  setLoadingText(
    "Loading your map..."
  );


  /*
    IMPORTANT:

    zoomControl:false prevents Leaflet
    from putting the buttons in the top-right.
  */

  map =
    L.map(
      "map",
      {
        zoomControl: false
      }
    ).setView(

      [
        latitude,
        longitude
      ],

      17

    );


  /*
    Put zoom buttons at bottom-right.
  */

  L.control.zoom({

    position:
      "bottomright"

  }).addTo(map);


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      attribution:
        "© OpenStreetMap contributors",

      maxZoom: 19

    }

  ).addTo(map);


  createPlayer(

    latitude,
    longitude

  );


  currentLatitude =
    latitude;

  currentLongitude =
    longitude;


  /*
    Start loading the trail.
  */

  loadTrail(

    latitude,
    longitude

  );

}


/* =====================================================
   CREATE PLAYER
===================================================== */

function createPlayer(

  latitude,
  longitude

) {

  const skin =
    SKINS[
      save.equippedSkin
    ] ||
    SKINS.blue;


  const playerIcon =
    L.divIcon({

      className: "",

      html:

        '<div class="player" ' +

        'style="--player-color:' +

        skin.color +

        '"></div>',

      iconSize:
        [28,28],

      iconAnchor:
        [14,14]

    });


  player =
    L.marker(

      [
        latitude,
        longitude
      ],

      {

        icon:
          playerIcon

      }

    ).addTo(map);

}


/* =====================================================
   UPDATE PLAYER SKIN
===================================================== */

function updatePlayerSkin() {

  if (!player) {
    return;
  }


  const skin =
    SKINS[
      save.equippedSkin
    ] ||
    SKINS.blue;


  const icon =
    L.divIcon({

      className: "",

      html:

        '<div class="player" ' +

        'style="--player-color:' +

        skin.color +

        '"></div>',

      iconSize:
        [28,28],

      iconAnchor:
        [14,14]

    });


  player.setIcon(
    icon
  );

}


/* =====================================================
   GPS
===================================================== */

function updateLocation(
  position
) {

  const latitude =
    position.coords.latitude;

  const longitude =
    position.coords.longitude;


  if (!map) {

    startGame(

      latitude,
      longitude

    );

    return;

  }


  player.setLatLng([

    latitude,
    longitude

  ]);


  checkCoinCollection(

    latitude,
    longitude

  );


  if (

    currentLatitude !== null &&

    currentLongitude !== null

  ) {

    const distance =
      distanceMeters(

        currentLatitude,
        currentLongitude,

        latitude,
        longitude

      );


    if (
      distance >=
      REFRESH_DISTANCE
    ) {

      currentLatitude =
        latitude;

      currentLongitude =
        longitude;


      loadTrail(

        latitude,
        longitude

      );

    }

  }

}


/* =====================================================
   LOAD TRAIL
===================================================== */

async function loadTrail(

  latitude,
  longitude

) {

  if (loadingTrail) {
    return;
  }


  loadingTrail = true;


  setLoadingText(
    "Finding nearby paths..."
  );


  setStatus(
    "🗺️ Finding a path..."
  );


  /*
    Remove old uncollected coins.
  */

  removeUncollectedCoins();


  const latOffset =
    SEARCH_RADIUS /
    111320;


  const lonOffset =

    SEARCH_RADIUS /

    (

      111320 *

      Math.cos(

        latitude *
        Math.PI /
        180

      )

    );


  const south =
    latitude -
    latOffset;


  const north =
    latitude +
    latOffset;


  const west =
    longitude -
    lonOffset;


  const east =
    longitude +
    lonOffset;


  /*
    Query only relevant pedestrian
    paths instead of every highway.

    This makes Overpass considerably
    less likely to time out.
  */

  let query;


  if (gameMode === "PUBLIC") {

    query = `

      [out:json]
      [timeout:25];

      (
        way["highway"="footway"]
          (${south},${west},${north},${east});

        way["highway"="path"]
          (${south},${west},${north},${east});

        way["highway"="pedestrian"]
          (${south},${west},${north},${east});

        way["highway"="steps"]
          (${south},${west},${north},${east});

        way["highway"="cycleway"]
          (${south},${west},${north},${east});

        way["highway"="bridleway"]
          (${south},${west},${north},${east});

        way["highway"="living_street"]
          (${south},${west},${north},${east});
      );

      out tags geom;

    `;

  } else {

    query = `

      [out:json]
      [timeout:25];

      (
        way["highway"]
          (${south},${west},${north},${east});
      );

      out tags geom;

    `;

  }


  let data = null;


  /*
    Try each Overpass server.
  */

  for (

    let i = 0;

    i <
    OVERPASS_SERVERS.length;

    i++

  ) {

    try {

      setLoadingText(

        i === 0

          ? "Connecting to the map network..."

          : "Trying another map server..."

      );


      const controller =
        new AbortController();


      const timeout =
        setTimeout(

          function() {

            controller.abort();

          },

          15000

        );


      const response =
        await fetch(

          OVERPASS_SERVERS[i],

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded"

            },

            body:
              "data=" +
              encodeURIComponent(
                query
              ),

            signal:
              controller.signal

          }

        );


      clearTimeout(
        timeout
      );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      data =
        await response.json();


      if (data) {

        break;

      }


    } catch (error) {

      console.log(

        "Overpass server failed:",

        error

      );

    }

  }


  /*
    Completely failed.
  */

  if (!data) {

    loadingTrail =
      false;


    setLoadingText(
      "Map data couldn't be loaded."
    );


    setStatus(
      "⚠️ Path server unavailable. Try again."
    );


    /*
      Hide loading screen after
      failure so the player isn't trapped.
    */

    setTimeout(

      hideLoadingScreen,

      700

    );


    return;

  }


  setLoadingText(
    "Building your trail..."
  );


  const ways =
    filterWays(
      data.elements || []
    );


  if (
    ways.length === 0
  ) {

    loadingTrail =
      false;


    setLoadingText(
      "No paths found nearby."
    );


    setStatus(

      gameMode === "PUBLIC"

        ? "🔎 No suitable public paths nearby."

        : "🔎 No mapped paths nearby."

    );


    setTimeout(

      hideLoadingScreen,

      900

    );


    return;

  }


  const start =
    findClosestNetworkPoint(

      ways,

      latitude,
      longitude

    );


  if (!start) {

    loadingTrail =
      false;


    setLoadingText(
      "Couldn't find a nearby trail."
    );


    setStatus(
      "🔎 Couldn't find a nearby path."
    );


    setTimeout(

      hideLoadingScreen,

      900

    );


    return;

  }


  /*
    If the closest path is extremely far
    away, tell the player.
  */

  if (start.distance > SEARCH_RADIUS) {

    loadingTrail =
      false;


    setLoadingText(
      "No nearby trail."
    );


    setStatus(
      "🔎 No path close enough."
    );


    setTimeout(

      hideLoadingScreen,

      900

    );


    return;

  }


  const mainRoute =
    buildNetworkRoute(

      ways,

      start,

      MAIN_COINS

    );


  const branchRoute =
    findNetworkBranch(

      ways,

      mainRoute,

      start

    );


  mainRoute.forEach(

    function(point) {

      createCoin(

        point.lat,
        point.lon

      );

    }

  );


  branchRoute.forEach(

    function(point) {

      createCoin(

        point.lat,
        point.lon

      );

    }

  );


  const total =
    mainRoute.length +
    branchRoute.length;


  loadingTrail =
    false;


  if (total > 0) {

    setLoadingText(
      "Trail ready. Go collect!"
    );


    setStatus(

      "🎮 " +
      total +
      " coins on real mapped paths"

    );

  } else {

    setLoadingText(
      "Path found, but it's too short."
    );


    setStatus(
      "🔎 Path found, but it's too short."
    );

  }


  /*
    Give the loading animation a moment
    to feel intentional instead of flashing.
  */

  setTimeout(

    hideLoadingScreen,

    650

  );

}


/* =====================================================
   FILTER WAYS
===================================================== */

function filterWays(
  elements
) {

  const result = [];


  elements.forEach(

    function(element) {

      if (
        element.type !==
        "way"
      ) {

        return;

      }


      if (
        !element.geometry ||
        element.geometry.length < 2
      ) {

        return;

      }


      const tags =
        element.tags || {};


      const highway =
        tags.highway;


      if (!highway) {
        return;
      }


      const access =
        String(
          tags.access || ""
        ).toLowerCase();


      /*
        Never use explicitly private paths
        in PUBLIC mode.
      */

      if (
        gameMode === "PUBLIC" &&
        (
          access === "private" ||
          access === "no" ||
          access === "permit" ||
          access === "customers"
        )
      ) {

        return;

      }


      if (
        gameMode === "PUBLIC"
      ) {

        const allowed = [

          "footway",
          "path",
          "pedestrian",
          "steps",
          "cycleway",
          "bridleway",
          "living_street"

        ];


        if (
          !allowed.includes(
            highway
          )
        ) {

          return;

        }

      }


      if (
        gameMode === "UNLIMITED"
      ) {

        const forbidden = [

          "motorway",
          "motorway_link",
          "trunk",
          "trunk_link",
          "primary",
          "primary_link"

        ];


        if (
          forbidden.includes(
            highway
          )
        ) {

          return;

        }

      }


      result.push({

        id:
          element.id,

        geometry:
          element.geometry,

        tags:
          tags

      });

    }

  );


  return result;

}


/* =====================================================
   CLOSEST NETWORK POINT
===================================================== */

function findClosestNetworkPoint(

  ways,
  latitude,
  longitude

) {

  let best = null;


  ways.forEach(

    function(way) {

      way.geometry.forEach(

        function(point,index) {

          const distance =
            distanceMeters(

              latitude,
              longitude,

              point.lat,
              point.lon

            );


          if (

            best === null ||

            distance <
            best.distance

          ) {

            best = {

              way:
                way,

              index:
                index,

              distance:
                distance,

              point:
                point

            };

          }

        }

      );

    }

  );


  return best;

}


/* =====================================================
   BUILD NETWORK ROUTE
===================================================== */

function buildNetworkRoute(

  ways,
  start,
  numberOfCoins

) {

  const route = [];


  const geometry =
    start.way.geometry;


  let direction = 1;


  if (
    start.index >=
    geometry.length - 1
  ) {

    direction = -1;

  }


  let currentWay =
    start.way;


  let currentIndex =
    start.index;


  let currentDirection =
    direction;


  let accumulated = 0;


  let lastPoint =
    start.point;


  const visited =
    new Set();


  while (

    route.length <
    numberOfCoins

  ) {

    const visitKey =

      currentWay.id +
      ":" +
      currentIndex +
      ":" +
      currentDirection;


    if (
      visited.has(
        visitKey
      )
    ) {

      break;

    }


    visited.add(
      visitKey
    );


    const nextIndex =

      currentIndex +
      currentDirection;


    if (

      nextIndex < 0 ||

      nextIndex >=
      currentWay.geometry.length

    ) {

      const endpoint =

        currentWay.geometry[

          currentDirection === 1

            ? currentWay.geometry.length - 1

            : 0

        ];


      const nextWay =
        findConnectedWay(

          ways,

          endpoint,

          currentWay.id

        );


      if (!nextWay) {

        break;

      }


      currentWay =
        nextWay.way;


      currentIndex =
        nextWay.index;


      currentDirection =
        nextWay.direction;


      continue;

    }


    const point =
      currentWay.geometry[
        nextIndex
      ];


    accumulated +=

      distanceMeters(

        lastPoint.lat,
        lastPoint.lon,

        point.lat,
        point.lon

      );


    if (
      accumulated >=
      COIN_SPACING
    ) {

      route.push({

        lat:
          point.lat,

        lon:
          point.lon

      });


      accumulated = 0;

    }


    lastPoint =
      point;


    currentIndex =
      nextIndex;

  }


  return route;

}


/* =====================================================
   CONNECTED WAY
===================================================== */

function findConnectedWay(

  ways,
  endpoint,
  currentWayId

) {

  let best = null;

  let bestDistance = 30;


  ways.forEach(

    function(way) {

      if (
        way.id ===
        currentWayId
      ) {

        return;

      }


      const first =
        way.geometry[0];


      const last =
        way.geometry[
          way.geometry.length - 1
        ];


      const d1 =
        distanceMeters(

          endpoint.lat,
          endpoint.lon,

          first.lat,
          first.lon

        );


      const d2 =
        distanceMeters(

          endpoint.lat,
          endpoint.lon,

          last.lat,
          last.lon

        );


      if (
        d1 <=
        bestDistance
      ) {

        best = {

          way:
            way,

          index:
            0,

          direction:
            1

        };


        bestDistance =
          d1;

      }


      if (
        d2 <=
        bestDistance
      ) {

        best = {

          way:
            way,

          index:
            way.geometry.length - 1,

          direction:
            -1

        };


        bestDistance =
          d2;

      }

    }

  );


  return best;

}


/* =====================================================
   FIND BRANCH
===================================================== */

function findNetworkBranch(

  ways,
  mainRoute,
  start

) {

  if (
    mainRoute.length < 2
  ) {

    return [];

  }


  for (

    let r = 1;

    r <
    mainRoute.length;

    r++

  ) {

    const routePoint =
      mainRoute[r];


    for (

      let i = 0;

      i <
      ways.length;

      i++

    ) {

      const way =
        ways[i];


      if (
        way.id ===
        start.way.id
      ) {

        continue;

      }


      const first =
        way.geometry[0];


      const last =
        way.geometry[
          way.geometry.length - 1
        ];


      const firstDistance =
        distanceMeters(

          routePoint.lat,
          routePoint.lon,

          first.lat,
          first.lon

        );


      const lastDistance =
        distanceMeters(

          routePoint.lat,
          routePoint.lon,

          last.lat,
          last.lon

        );


      if (
        firstDistance <= 30
      ) {

        return buildBranch(

          way,
          0,
          1

        );

      }


      if (
        lastDistance <= 30
      ) {

        return buildBranch(

          way,

          way.geometry.length - 1,

          -1

        );

      }

    }

  }


  return [];

}


/* =====================================================
   BUILD BRANCH
===================================================== */

function buildBranch(

  way,
  startIndex,
  direction

) {

  const result = [];


  let accumulated = 0;


  let lastPoint =
    way.geometry[startIndex];


  for (

    let step = 1;

    step <
    way.geometry.length;

    step++

  ) {

    const index =

      startIndex +
      step *
      direction;


    if (

      index < 0 ||

      index >=
      way.geometry.length

    ) {

      break;

    }


    const point =
      way.geometry[index];


    accumulated +=

      distanceMeters(

        lastPoint.lat,
        lastPoint.lon,

        point.lat,
        point.lon

      );


    if (
      accumulated >=
      COIN_SPACING
    ) {

      result.push({

        lat:
          point.lat,

        lon:
          point.lon

      });


      accumulated = 0;


      if (
        result.length >=
        BRANCH_COINS
      ) {

        break;

      }

    }


    lastPoint =
      point;

  }


  return result;

}


/* =====================================================
   CREATE COIN
===================================================== */

function createCoin(

  latitude,
  longitude

) {

  const id =
    makeCoinId(

      latitude,
      longitude

    );


  if (
    save.collectedCoins.includes(
      id
    )
  ) {

    return;

  }


  for (

    let i = 0;

    i <
    coins.length;

    i++

  ) {

    const existing =
      coins[i];


    if (

      distanceMeters(

        latitude,
        longitude,

        existing.latitude,
        existing.longitude

      ) < 20

    ) {

      return;

    }

  }


  const coinIcon =
    L.divIcon({

      className: "",

      html:
        '<div class="coin">🪙</div>',

      iconSize:
        [34,34],

      iconAnchor:
        [17,17]

    });


  const marker =
    L.marker(

      [
        latitude,
        longitude
      ],

      {

        icon:
          coinIcon

      }

    ).addTo(map);


  coins.push({

    id:
      id,

    marker:
      marker,

    latitude:
      latitude,

    longitude:
      longitude,

    collected:
      false

  });

}


/* =====================================================
   COIN ID
===================================================== */

function makeCoinId(

  latitude,
  longitude

) {

  return (

    Math.round(
      latitude * 100000
    ) +

    "_" +

    Math.round(
      longitude * 100000
    )

  );

}


/* =====================================================
   REMOVE UNCOLLECTED
===================================================== */

function removeUncollectedCoins() {

  const remaining = [];


  coins.forEach(

    function(coin) {

      if (
        coin.collected
      ) {

        remaining.push(
          coin
        );

      } else {

        if (
          map &&
          map.hasLayer(
            coin.marker
          )
        ) {

          map.removeLayer(
            coin.marker
          );

        }

      }

    }

  );


  coins =
    remaining;

}


/* =====================================================
   COLLECTION
===================================================== */

function checkCoinCollection(

  latitude,
  longitude

) {

  coins.forEach(

    function(coin) {

      if (
        coin.collected
      ) {

        return;

      }


      const distance =
        distanceMeters(

          latitude,
          longitude,

          coin.latitude,
          coin.longitude

        );


      if (
        distance <=
        COLLECTION_DISTANCE
      ) {

        collectCoin(
          coin
        );

      }

    }

  );

}


/* =====================================================
   COLLECT COIN
===================================================== */

function collectCoin(
  coin
) {

  coin.collected =
    true;


  if (
    map.hasLayer(
      coin.marker
    )
  ) {

    map.removeLayer(
      coin.marker
    );

  }


  if (
    !save.collectedCoins.includes(
      coin.id
    )
  ) {

    save.collectedCoins.push(
      coin.id
    );

  }


  save.coins +=
    10;


  saveGame();


  updateCoinDisplay();


  setStatus(
    "🪙 COIN COLLECTED! +10"
  );


  setTimeout(

    function() {

      setStatus(
        "🎮 KEEP EXPLORING"
      );

    },

    2000

  );

}


/* =====================================================
   DISTANCE
===================================================== */

function distanceMeters(

  lat1,
  lon1,

  lat2,
  lon2

) {

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dLat =

    (
      lat2 -
      lat1
    ) *

    Math.PI /
    180;


  const dLon =

    (
      lon2 -
      lon1
    ) *

    Math.PI /
    180;


  const a =

    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1 - a)

    );


  return R * c;

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text
) {

  document.getElementById(
    "status"
  ).innerText =
    text;

}


/* =====================================================
   SHOP
===================================================== */

function openShop() {

  document.getElementById(
    "shopOverlay"
  ).style.display =
    "block";


  renderShop();

}


function closeShop() {

  document.getElementById(
    "shopOverlay"
  ).style.display =
    "none";

}


function renderShop() {

  document.getElementById(
    "shopBalance"
  ).innerText =

    "🪙 Coins: " +
    save.coins;


  const container =
    document.getElementById(
      "shopItems"
    );


  container.innerHTML =
    "";


  Object.keys(
    SKINS
  ).forEach(

    function(id) {

      const skin =
        SKINS[id];


      const unlocked =
        save.unlockedSkins.includes(
          id
        );


      const equipped =
        save.equippedSkin ===
        id;


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "shopItem";


      item.innerHTML = `

        <div
          class="skinPreview"
          style="
            background:${skin.color};
            color:${skin.color};
          "
        ></div>

        <div class="skinInfo">

          <div class="skinName">
            ${skin.name}
          </div>

          <div class="skinPrice">

            ${
              skin.price === 0
                ? "FREE"
                : "🪙 " +
                  skin.price
            }

          </div>

        </div>

        <button
          class="shopButton"
        ></button>

      `;


      const button =
        item.querySelector(
          ".shopButton"
        );


      if (equipped) {

        button.innerText =
          "EQUIPPED";

        button.disabled =
          true;


      } else if (unlocked) {

        button.innerText =
          "EQUIP";


        button.addEventListener(

          "click",

          function() {

            equipSkin(
              id
            );

          }

        );


      } else if (
        save.coins >=
        skin.price
      ) {

        button.innerText =
          "BUY";


        button.addEventListener(

          "click",

          function() {

            buySkin(
              id
            );

          }

        );


      } else {

        button.innerText =
          "NEED COINS";

        button.disabled =
          true;

      }


      container.appendChild(
        item
      );

    }

  );

}


/* =====================================================
   BUY SKIN
===================================================== */

function buySkin(
  id
) {

  const skin =
    SKINS[id];


  if (!skin) {
    return;
  }


  if (
    save.unlockedSkins.includes(
      id
    )
  ) {

    return;

  }


  if (
    save.coins <
    skin.price
  ) {

    return;

  }


  save.coins -=
    skin.price;


  save.unlockedSkins.push(
    id
  );


  save.equippedSkin =
    id;


  saveGame();


  updateCoinDisplay();


  updatePlayerSkin();


  renderShop();


  setStatus(

    "🎨 " +
    skin.name +
    " unlocked!"

  );

}


/* =====================================================
   EQUIP SKIN
===================================================== */

function equipSkin(
  id
) {

  if (
    !save.unlockedSkins.includes(
      id
    )
  ) {

    return;

  }


  save.equippedSkin =
    id;


  saveGame();


  updatePlayerSkin();


  renderShop();


  setStatus(

    "🎨 " +
    SKINS[id].name +
    " equipped!"

  );

}


/* =====================================================
   SHOP EVENTS
===================================================== */

document.getElementById(
  "shopButton"
).addEventListener(

  "click",

  openShop

);


document.getElementById(
  "closeShop"
).addEventListener(

  "click",

  closeShop

);


/* =====================================================
   MODE SWITCH
===================================================== */

document.getElementById(
  "modeButton"
).addEventListener(

  "click",

  function() {

    if (
      gameMode ===
      "PUBLIC"
    ) {

      gameMode =
        "UNLIMITED";


      document.getElementById(
        "modeButton"
      ).innerText =
        "🔓 UNLIMITED";


    } else {

      gameMode =
        "PUBLIC";


      document.getElementById(
        "modeButton"
      ).innerText =
        "🌎 PUBLIC";

    }


    if (

      currentLatitude !== null &&

      currentLongitude !== null

    ) {

      loadTrail(

        currentLatitude,

        currentLongitude

      );

    }

  }

);


/* =====================================================
   GPS ERROR
===================================================== */

function locationError(
  error
) {

  console.log(
    "GPS error:",
    error
  );


  setLoadingText(
    "Location permission is required."
  );


  setStatus(
    "❌ Couldn't get your location. Check GPS permissions."
  );


  /*
    Don't leave the player staring
    at an infinite loading screen.
  */

  setTimeout(

    hideLoadingScreen,

    1000

  );

}


/* =====================================================
   START GPS
===================================================== */

if (
  "geolocation" in navigator
) {

  setLoadingText(
    "Finding your location..."
  );


  navigator.geolocation.watchPosition(

    updateLocation,

    locationError,

    {

      enableHighAccuracy:
        true,

      maximumAge:
        2000,

      timeout:
        10000

    }

  );


} else {

  setLoadingText(
    "GPS isn't available."
  );


  setStatus(
    "❌ GPS isn't available."
  );


  setTimeout(

    hideLoadingScreen,

    1000

  );

}

</script>
