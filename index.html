<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPS Coin</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #080b10;
}

button {
  font-family: inherit;
}

/* =========================
   MAP
========================= */

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
}

/* =========================
   AUTH
========================= */

#authScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 25px;

  background:
    radial-gradient(
      circle at center,
      #172333 0%,
      #080b10 70%
    );

  color: white;
}

.authBox {
  width: min(430px, 100%);
  padding: 28px;

  border-radius: 24px;

  background: rgba(20,28,38,.96);

  box-shadow:
    0 20px 60px rgba(0,0,0,.6);
}

.logo {
  text-align: center;
  font-size: 60px;

  animation:
    floatLogo 2s ease-in-out infinite;
}

@keyframes floatLogo {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}

.authBox h1 {
  text-align: center;
  margin: 5px 0;
  font-size: 32px;
}

.authSubtitle {
  text-align: center;
  color: #9aa8b7;
  margin-bottom: 25px;
}

.authInput {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;

  border: 1px solid #354352;
  border-radius: 12px;

  background: #0d141c;
  color: white;

  outline: none;
}

.authInput:focus {
  border-color: #00aaff;
}

.authButton {
  width: 100%;
  padding: 14px;
  margin-top: 8px;

  border: none;
  border-radius: 12px;

  background: #008ee6;
  color: white;

  font-weight: bold;
  font-size: 16px;
}

.authButton:active {
  transform: scale(.98);
}

#authMessage {
  margin-top: 15px;
  text-align: center;
  color: #aebbc8;
  font-size: 14px;
}

/* =========================
   LOADING
========================= */

#loadingScreen {
  position: fixed;
  inset: 0;
  z-index: 9000;

  display: none;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      #172333 0%,
      #080b10 70%
    );

  color: white;

  transition:
    opacity .5s ease,
    visibility .5s ease;
}

#loadingScreen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loadingContent {
  width: min(430px, 90%);
  text-align: center;
}

.loadingLogo {
  font-size: 65px;

  animation:
    floatLogo 2s ease-in-out infinite;
}

.loadingTitle {
  margin: 5px 0;
  font-size: 36px;
  font-weight: 900;
}

.loadingSubtitle {
  color: #9ca9b8;
}

.loadingBar {
  width: 100%;
  height: 7px;

  margin-top: 28px;

  overflow: hidden;

  border-radius: 20px;

  background: #202a35;
}

#loadingBarInner {
  width: 0%;
  height: 100%;

  border-radius: 20px;

  background:
    linear-gradient(
      90deg,
      #00aaff,
      #66ddff
    );

  box-shadow:
    0 0 15px #00aaff;

  transition: width .4s ease;
}

#loadingText {
  margin-top: 12px;
  color: #b9c5d2;
}

/* =========================
   MODE
========================= */

#modeSelect {
  display: none;

  margin-top: 28px;
}

.modeTitle {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 14px;
}

.modeButtons {
  display: flex;
  gap: 10px;
}

.modeChoice {
  flex: 1;

  padding: 17px 10px;

  border: 1px solid #354352;
  border-radius: 17px;

  background: #151d26;
  color: white;

  cursor: pointer;
}

.modeChoice:active {
  transform: scale(.96);
}

.modeChoice:hover {
  border-color: #00aaff;
}

.modeIcon {
  font-size: 30px;
}

.modeName {
  margin-top: 6px;
  font-weight: 900;
}

.modeDescription {
  margin-top: 5px;
  color: #8e9aaa;
  font-size: 11px;
  line-height: 1.4;
}

/* =========================
   HUD
========================= */

#hud {
  position: fixed;

  top:
    calc(
      10px +
      env(safe-area-inset-top)
    );

  left: 10px;
  right: 10px;

  z-index: 2000;

  display: flex;
  gap: 7px;
}

.hudBox {
  min-height: 43px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 9px 12px;

  border-radius: 14px;

  background:
    rgba(8,13,19,.94);

  color: white;

  box-shadow:
    0 4px 18px rgba(0,0,0,.35);

  backdrop-filter: blur(10px);

  font-weight: bold;
}

#coinsDisplay {
  flex: 1;
  justify-content: flex-start;
}

.hudButton {
  cursor: pointer;
}

/* =========================
   STATUS
========================= */

#status {
  position: fixed;

  left: 12px;
  right: 12px;

  bottom:
    calc(
      12px +
      env(safe-area-inset-bottom)
    );

  z-index: 3000;

  padding: 11px 14px;

  border-radius: 16px;

  background:
    rgba(8,13,19,.94);

  backdrop-filter: blur(12px);

  color: white;

  text-align: center;

  font-size: 12px;
  line-height: 1.55;

  box-shadow:
    0 5px 25px rgba(0,0,0,.4);

  pointer-events: none;
}

/* =========================
   PLAYER
========================= */

.player {
  width: 23px;
  height: 23px;

  border: 3px solid white;

  border-radius: 50%;

  background:
    var(--player-color);

  box-shadow:
    0 0 8px var(--player-color),
    0 0 18px var(--player-color),
    0 0 30px var(--player-color);
}

/* =========================
   COIN
========================= */

.coin {
  width: 30px;
  height: 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border: 3px solid #fff4a3;

  background:
    radial-gradient(
      circle at 35% 35%,
      #fffbd0 0%,
      #ffe44d 25%,
      #ffd000 55%,
      #f0a000 80%,
      #c87800 100%
    );

  box-shadow:
    0 0 8px #ffd700,
    0 0 18px #ffb000,
    0 0 28px rgba(255,190,0,.7);

  font-size: 16px;

  animation:
    coinPulse 1.4s infinite;
}

@keyframes coinPulse {
  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.13);
  }
}

/* =========================
   OVERLAYS
========================= */

.overlay {
  position: fixed;
  inset: 0;

  z-index: 5000;

  display: none;

  padding: 20px;

  overflow-y: auto;

  background:
    rgba(0,0,0,.8);
}

.panel {
  width: min(500px,100%);

  margin: 35px auto;

  padding: 22px;

  border-radius: 22px;

  background: #151a20;

  color: white;
}

/* =========================
   SHOP
========================= */

.panelHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panelHeader h2 {
  margin: 0;
}

.closeButton {
  border: none;
  border-radius: 10px;

  padding: 9px 13px;

  background: #333;
  color: white;

  font-size: 18px;
}

.shopBalance {
  margin: 18px 0;

  padding: 12px;

  border-radius: 12px;

  text-align: center;

  background:
    rgba(255,215,0,.12);

  border:
    1px solid rgba(255,215,0,.4);
}

.shopItem {
  display: flex;
  align-items: center;

  gap: 13px;

  margin-bottom: 12px;
  padding: 13px;

  border-radius: 15px;

  background: #20262d;
}

.skinPreview {
  width: 42px;
  height: 42px;

  flex-shrink: 0;

  border: 4px solid white;
  border-radius: 50%;
}

.skinInfo {
  flex: 1;
}

.skinName {
  font-weight: bold;
}

.skinPrice {
  color: #ffd700;
  margin-top: 4px;
  font-size: 13px;
}

.shopAction {
  border: none;
  border-radius: 10px;

  padding: 9px 12px;

  background: #0077cc;
  color: white;

  font-weight: bold;
}

.shopAction:disabled {
  opacity: .5;
}

/* =========================
   ACCOUNT
========================= */

.accountEmail {
  margin: 18px 0;

  padding: 12px;

  border-radius: 12px;

  background: #20262d;

  color: #b9c5d2;

  word-break: break-all;
}

.accountButton {
  width: 100%;

  border: none;
  border-radius: 12px;

  padding: 13px;

  margin-top: 10px;

  background: #0077cc;

  color: white;

  font-weight: bold;
}

.danger {
  background: #a83232;
}

/* =========================
   TOAST
========================= */

#toast {
  position: fixed;

  left: 50%;

  bottom: 100px;

  z-index: 10000;

  transform:
    translateX(-50%)
    translateY(20px);

  padding: 13px 18px;

  border-radius: 14px;

  background: #101820;

  color: white;

  box-shadow:
    0 8px 30px rgba(0,0,0,.45);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .25s,
    transform .25s;

  font-weight: bold;

  white-space: nowrap;
}

#toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   LEAFLET
========================= */

.leaflet-top {
  top: 70px;
}

.leaflet-left {
  left: 10px;
}

.leaflet-control-zoom a {
  width: 40px !important;
  height: 40px !important;

  line-height: 40px !important;

  font-size: 20px !important;
}

.leaflet-control-attribution {
  font-size: 9px;
}
</style>
</head>

<body>

<!-- =========================
     SIGN IN
========================= -->

<div id="authScreen">

<div id="hud">

  </div>

  <div

  </div>

    class="hudBox hudButton">

  </div>

</div>

<div id="map"></div>

  📍 Waiting for GPS...
</div>

<!-- =========================
     SHOP
========================= -->

<div
  id="shopOverlay"

        id="closeShop"

</div>

========================= -->

    </div>

  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

/* =========================================================
   GAME SETTINGS
========================================================= */

const SEARCH_RADIUS = 1000;

const COIN_SPACING = 55;

const MAIN_COINS = 12;

const BRANCH_COINS = 5;

const COLLECTION_DISTANCE = 18;

const ROAD_CONNECTION_DISTANCE = 35;

const REFRESH_DISTANCE = 150;

const OVERPASS_SERVERS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];

/* =========================================================
   SKINS
========================================================= */

const SKINS = {

  blue: {
    name: "Blue",
    color: "#00aaff",
    price: 0
  },

  red: {
    name: "Red",
    color: "#ff3030",
    price: 50
  },

  green: {
    name: "Green",
    color: "#22dd55",
    price: 100
  },

  purple: {
    name: "Purple",
    color: "#aa55ff",
    price: 150
  },

  gold: {
    name: "Gold",
    color: "#ffd000",
    price: 250
  },

  pink: {
    name: "Pink",
    color: "#ff4fa3",
    price: 350
  }

};

/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let playerData = null;

let map = null;

let playerMarker = null;

let coins = [];

let gameMode = "PUBLIC";

let currentLatitude = null;

let currentLongitude = null;

let gpsAccuracy = null;

let nearestRoadDistance = null;

let lastGPSUpdate = null;

let loadingTrail = false;

let gpsStarted = false;

/* =========================================================
   DOM
========================================================= */

const authScreen =
  document.getElementById("authScreen");

const authMessage =
  document.getElementById("authMessage");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingText =
  document.getElementById("loadingText");

const loadingBar =
  document.getElementById("loadingBarInner");

const modeSelect =
  document.getElementById("modeSelect");

const statusElement =
  document.getElementById("status");

const coinsDisplay =
  document.getElementById("coinsDisplay");

const shopOverlay =
  document.getElementById("shopOverlay");

const shopItems =
  document.getElementById("shopItems");

const shopBalance =
  document.getElementById("shopBalance");

const accountOverlay =
  document.getElementById("accountOverlay");

const accountEmail =
  document.getElementById("accountEmail");

/* =========================================================
   AUTH
========================================================= */

async function signIn() {

  const email =
    document.getElementById(
      "emailInput"
    ).value.trim();

  const password =
    document.getElementById(
      "passwordInput"
    ).value;

  if (!email || !password) {

    authMessage.innerText =
      "Enter your email and password.";

    return;
  }

  authMessage.innerText =
    "Signing in...";

  const {
    error
  } =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    authMessage.innerText =
      "❌ " + error.message;

    return;
  }

  authMessage.innerText =
    "✅ Signed in!";

  await startGameBoot();
}

async function signUp() {

  const email =
    document.getElementById(
      "emailInput"
    ).value.trim();

  const password =
    document.getElementById(
      "passwordInput"
    ).value;

  if (!email || !password) {

    authMessage.innerText =
      "Enter an email and password.";

    return;
  }

  if (password.length < 6) {

    authMessage.innerText =
      "Password must be at least 6 characters.";

    return;
  }

  authMessage.innerText =
    "Creating account...";

  const {
    data,
    error
  } =
    await supabase.auth.signUp({
      email,
      password
    });

  if (error) {

    authMessage.innerText =
      "❌ " + error.message;

    return;
  }

  if (!data.session) {

    authMessage.innerText =
      "✅ Account created! Check your email to confirm it.";

    return;
  }

  await startGameBoot();
}

document
  .getElementById("signInButton")
  .onclick = signIn;

document
  .getElementById("signUpButton")
  .onclick = signUp;

/* =========================================================
   LOADING
========================================================= */

function setLoading(
  text,
  progress
) {

  loadingText.innerText =
    text;

  loadingBar.style.width =
    progress + "%";
}

/* =========================================================
   BOOT
========================================================= */

async function startGameBoot() {

  authScreen.style.display =
    "none";

  loadingScreen.style.display =
    "flex";

  setLoading(
    "Loading account...",
    20
  );

  const {
    data
  } =
    await supabase.auth.getUser();

  currentUser =
    data.user;

  if (!currentUser) {

    authScreen.style.display =
      "flex";

    loadingScreen.style.display =
      "none";

    return;
  }

  setLoading(
    "Loading player...",
    45
  );

  await loadPlayer();

  setLoading(
    "Choose your game mode.",
    100
  );

  modeSelect.style.display =
    "block";
}

/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer() {

  if (!currentUser) return;

  const {
    data,
    error
  } =
    await supabase
      .from("players")
      .select("*")
      .eq("id", currentUser.id)
      .single();

  if (error) {

    console.error(error);

    /*
      If the trigger did not create the row,
      create it here.
    */

    const {
      data: created,
      error: createError
    } =
      await supabase
        .from("players")
        .insert({
          id: currentUser.id
        })
        .select()
        .single();

    if (createError) {

      throw createError;
    }

    playerData =
      created;

  } else {

    playerData =
      data;
  }

  updateCoinDisplay();
}

/* =========================================================
   MODE
========================================================= */

document
  .getElementById("publicMode")
  .onclick = () => {

    chooseMode("PUBLIC");
  };

document
  .getElementById("unlimitedMode")
  .onclick = () => {

    chooseMode("UNLIMITED");
  };

function chooseMode(mode) {

  gameMode =
    mode;

  modeSelect.style.display =
    "none";

  setLoading(
    "Requesting your location...",
    100
  );

  startGPS();
}

/* =========================================================
   GPS
========================================================= */

function startGPS() {

  if (gpsStarted) return;

  gpsStarted =
    true;

  if (!navigator.geolocation) {

    setStatus(
      "❌ Your browser does not support GPS."
    );

    return;
  }

  setStatus(
    "📍 Requesting location permission..."
  );

  navigator.geolocation.watchPosition(
    updateLocation,
    locationError,
    {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 15000
    }
  );
}

/* =========================================================
   GPS UPDATE
========================================================= */

function updateLocation(
  position
) {

  const latitude =
    position.coords.latitude;

  const longitude =
    position.coords.longitude;

  gpsAccuracy =
    position.coords.accuracy;

  lastGPSUpdate =
    Date.now();

  currentLatitude =
    latitude;

  currentLongitude =
    longitude;

  console.log(
    "GPS:",
    latitude,
    longitude,
    "accuracy:",
    gpsAccuracy
  );

  if (!map) {

    startGame(
      latitude,
      longitude
    );

    return;
  }

  if (playerMarker) {

    playerMarker.setLatLng([
      latitude,
      longitude
    ]);
  }

  checkCoinCollection(
    latitude,
    longitude
  );

  updateBottomStatus();

  /*
    Refresh trail only after the
    player has actually moved.
  */

  if (
    currentLatitude !== null &&
    currentLongitude !== null
  ) {

    updateNearestRoad(
      latitude,
      longitude
    );
  }
}

/* =========================================================
   START GAME
========================================================= */

function startGame(
  latitude,
  longitude
) {

  map =
    L.map("map", {
      zoomControl: true
    }).setView(
      [
        latitude,
        longitude
      ],
      17
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);

  createPlayer(
    latitude,
    longitude
  );

  loadingScreen.classList.add(
    "hidden"
  );

  setStatus(
    "🛣️ Finding your nearest connected road..."
  );

  loadTrail(
    latitude,
    longitude
  );
}

/* =========================================================
   PLAYER
========================================================= */

function getCurrentSkin() {

  const id =
    playerData?.equipped_skin ||
    "blue";

  return (
    SKINS[id] ||
    SKINS.blue
  );
}

function createPlayer(
  latitude,
  longitude
) {

  if (!map) return;

  playerMarker =
    L.marker(
      [
        latitude,
        longitude
      ],
      {
        icon:
          createPlayerIcon(
            getCurrentSkin().color
          )
      }
    ).addTo(map);
}

function createPlayerIcon(
  color
) {

  return L.divIcon({

    className: "",

    html:
      `<div class="player"
       style="--player-color:${color}">
       </div>`,

    iconSize: [28,28],

    iconAnchor: [14,14]
  });
}

function updatePlayerSkin() {

  if (!playerMarker)
    return;

  playerMarker.setIcon(
    createPlayerIcon(
      getCurrentSkin().color
    )
  );
}

/* =========================================================
   OVERPASS
========================================================= */

async function getNearbyWays(
  latitude,
  longitude
) {

  const latOffset =
    SEARCH_RADIUS / 111320;

  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        latitude *
        Math.PI / 180
      )
    );

  const south =
    latitude - latOffset;

  const north =
    latitude + latOffset;

  const west =
    longitude - lonOffset;

  const east =
    longitude + lonOffset;

  /*
    Public mode prioritizes walkable roads.
    Unlimited allows more types but still
    avoids dangerous major highways.
  */

  let highwayFilter;

  if (gameMode === "PUBLIC") {

    highwayFilter = `
      ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|service|unclassified"]
    `;

  } else {

    highwayFilter = `
      ["highway"]
    `;
  }

  const query = `

    [out:json]
    [timeout:25];

    way
      ${highwayFilter}
      (${south},${west},${north},${east});

    out tags geom;

  `;

  for (
    const server of
    OVERPASS_SERVERS
  ) {

    try {

      const response =
        await fetch(
          server,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(
                query
              )
          }
        );

      if (!response.ok)
        throw new Error(
          "HTTP " +
          response.status
        );

      const data =
        await response.json();

      return filterWays(
        data.elements || []
      );

    } catch (error) {

      console.log(
        "Overpass failed:",
        error
      );
    }
  }

  return [];
}

/* =========================================================
   FILTER
========================================================= */

function filterWays(
  elements
) {

  const result = [];

  for (
    const element of elements
  ) {

    if (
      element.type !== "way"
    )
      continue;

    if (
      !element.geometry ||
      element.geometry.length < 2
    )
      continue;

    const tags =
      element.tags || {};

    const highway =
      tags.highway;

    if (!highway)
      continue;

    const access =
      String(
        tags.access || ""
      ).toLowerCase();

    if (
      access === "private" ||
      access === "no" ||
      access === "permit" ||
      access === "customers"
    )
      continue;

    /*
      Never put the player on dangerous
      major highways.
    */

    const dangerous = [
      "motorway",
      "motorway_link",
      "trunk",
      "trunk_link"
    ];

    if (
      dangerous.includes(
        highway
      )
    )
      continue;

    result.push({
      id: element.id,
      geometry: element.geometry,
      tags
    });
  }

  return result;
}

/* =========================================================
   CLOSEST POINT
========================================================= */

function findClosestNetworkPoint(
  ways,
  latitude,
  longitude
) {

  let best = null;

  for (
    const way of ways
  ) {

    for (
      let i = 0;
      i < way.geometry.length;
      i++
    ) {

      const point =
        way.geometry[i];

      const distance =
        distanceMeters(
          latitude,
          longitude,
          point.lat,
          point.lon
        );

      if (
        !best ||
        distance <
        best.distance
      ) {

        best = {
          way,
          index: i,
          distance,
          point
        };
      }
    }
  }

  return best;
}

/* =========================================================
   CONNECTED ROAD SYSTEM
========================================================= */

function findConnectedWays(
  ways,
  currentWay,
  endpoint
) {

  const connected = [];

  for (
    const way of ways
  ) {

    if (
      way.id === currentWay.id
    )
      continue;

    const first =
      way.geometry[0];

    const last =
      way.geometry[
        way.geometry.length - 1
      ];

    const d1 =
      distanceMeters(
        endpoint.lat,
        endpoint.lon,
        first.lat,
        first.lon
      );

    const d2 =
      distanceMeters(
        endpoint.lat,
        endpoint.lon,
        last.lat,
        last.lon
      );

    if (
      d1 <= ROAD_CONNECTION_DISTANCE
    ) {

      connected.push({
        way,
        index: 0,
        direction: 1,
        distance: d1
      });
    }

    if (
      d2 <= ROAD_CONNECTION_DISTANCE
    ) {

      connected.push({
        way,
        index:
          way.geometry.length - 1,
        direction: -1,
        distance: d2
      });
    }
  }

  connected.sort(
    (a,b) =>
      a.distance -
      b.distance
  );

  return connected;
}

/* =========================================================
   BUILD CONNECTED ROUTE
========================================================= */

function buildConnectedRoute(
  ways,
  start,
  numberOfCoins
) {

  const route = [];

  let way =
    start.way;

  let index =
    start.index;

  let direction =
    index <
    way.geometry.length - 1
      ? 1
      : -1;

  let accumulated = 0;

  let lastPoint =
    way.geometry[index];

  const visitedWays =
    new Set();

  let safety = 0;

  while (
    route.length <
      numberOfCoins &&
    safety < 100
  ) {

    safety++;

    const wayKey =
      way.id +
      ":" +
      direction;

    if (
      visitedWays.has(
        wayKey
      )
    ) {

      /*
        We reached a loop.
        Try another connected road.
      */

      const endpoint =
        way.geometry[
          direction === 1
            ? way.geometry.length - 1
            : 0
        ];

      const alternatives =
        findConnectedWays(
          ways,
          way,
          endpoint
        );

      const next =
        alternatives.find(
          x =>
            !visitedWays.has(
              x.way.id +
              ":" +
              x.direction
            )
        );

      if (!next)
        break;

      way =
        next.way;

      index =
        next.index;

      direction =
        next.direction;

      accumulated = 0;

      lastPoint =
        way.geometry[index];

      continue;
    }

    visitedWays.add(
      wayKey
    );

    const nextIndex =
      index + direction;

    if (
      nextIndex >= 0 &&
      nextIndex <
      way.geometry.length
    ) {

      const point =
        way.geometry[
          nextIndex
        ];

      accumulated +=
        distanceMeters(
          lastPoint.lat,
          lastPoint.lon,
          point.lat,
          point.lon
        );

      if (
        accumulated >=
        COIN_SPACING
      ) {

        route.push({
          lat: point.lat,
          lon: point.lon
        });

        accumulated = 0;
      }

      lastPoint =
        point;

      index =
        nextIndex;

      continue;
    }

    /*
      End of road.

      IMPORTANT:
      Only continue onto a way
      physically connected to this
      road.
    */

    const endpoint =
      way.geometry[
        direction === 1
          ? way.geometry.length - 1
          : 0
      ];

    const connected =
      findConnectedWays(
        ways,
        way,
        endpoint
      );

    const next =
      connected.find(
        x =>
          !visitedWays.has(
            x.way.id +
            ":" +
            x.direction
          )
      );

    if (!next)
      break;

    way =
      next.way;

    index =
      next.index;

    direction =
      next.direction;

    accumulated = 0;

    lastPoint =
      way.geometry[index];
  }

  return route;
}

/* =========================================================
   TRAIL
========================================================= */

async function loadTrail(
  latitude,
  longitude
) {

  if (
    loadingTrail ||
    !map
  )
    return;

  loadingTrail = true;

  setStatus(
    "🛣️ Finding the road nearest you..."
  );

  removeUncollectedCoins();

  try {

    const ways =
      await getNearbyWays(
        latitude,
        longitude
      );

    if (!ways.length) {

      setStatus(
        "❌ No mapped roads found nearby."
      );

      loadingTrail = false;

      return;
    }

    const start =
      findClosestNetworkPoint(
        ways,
        latitude,
        longitude
      );

    if (!start) {

      setStatus(
        "❌ Couldn't find a nearby road."
      );

      loadingTrail = false;

      return;
    }

    nearestRoadDistance =
      start.distance;

    /*
      If the nearest mapped road is
      ridiculously far away, don't
      pretend it is the player's road.
    */

    if (
      start.distance > 150
    ) {

      setStatus(
        `🛣️ Nearest mapped road is ${Math.round(start.distance)}m away.`
      );

      loadingTrail = false;

      return;
    }

    /*
      Build route ONLY from the road
      containing the closest point,
      then continue through physically
      connected ways.
    */

    const route =
      buildConnectedRoute(
        ways,
        start,
        MAIN_COINS
      );

    /*
      First coin is on the actual
      nearest road point.
    */

    createCoin(
      start.point.lat,
      start.point.lon
    );

    for (
      const point of route
    ) {

      createCoin(
        point.lat,
        point.lon
      );
    }

    updateBottomStatus();

  } catch (error) {

    console.error(
      "Trail error:",
      error
    );

    setStatus(
      "⚠️ Couldn't load roads."
    );
  }

  loadingTrail = false;
}

/* =========================================================
   ROAD UPDATE
========================================================= */

async function updateNearestRoad(
  latitude,
  longitude
) {

  try {

    const ways =
      await getNearbyWays(
        latitude,
        longitude
      );

    if (!ways.length) {

      nearestRoadDistance =
        null;

      updateBottomStatus();

      return;
    }

    const nearest =
      findClosestNetworkPoint(
        ways,
        latitude,
        longitude
      );

    if (nearest) {

      nearestRoadDistance =
        nearest.distance;
    }

    updateBottomStatus();

  } catch (error) {

    console.log(
      "Road update failed:",
      error
    );
  }
}

/* =========================================================
   COINS
========================================================= */

function createCoin(
  latitude,
  longitude
) {

  if (!map || !playerData)
    return;

  const id =
    makeCoinId(
      latitude,
      longitude
    );

  if (
    playerData.collected_coins
      .includes(id)
  )
    return;

  /*
    Prevent duplicate coins.
  */

  for (
    const coin of coins
  ) {

    if (
      distanceMeters(
        latitude,
        longitude,
        coin.latitude,
        coin.longitude
      ) < 25
    ) {

      return;
    }
  }

  const marker =
    L.marker(
      [
        latitude,
        longitude
      ],
      {
        icon:
          L.divIcon({
            className: "",
            html:
              `<div class="coin">🪙</div>`,
            iconSize: [34,34],
            iconAnchor: [17,17]
          })
      }
    ).addTo(map);

  coins.push({
    id,
    marker,
    latitude,
    longitude,
    collected: false
  });
}

function makeCoinId(
  latitude,
  longitude
) {

  return (
    Math.round(
      latitude * 100000
    ) +
    "_" +
    Math.round(
      longitude * 100000
    )
  );
}

function removeUncollectedCoins() {

  if (!map)
    return;

  const remaining = [];

  for (
    const coin of coins
  ) {

    if (
      coin.collected
    ) {

      remaining.push(
        coin
      );

    } else {

      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );
      }
    }
  }

  coins =
    remaining;
}

/* =========================================================
   COLLECTION
========================================================= */

function checkCoinCollection(
  latitude,
  longitude
) {

  for (
    const coin of coins
  ) {

    if (
      coin.collected
    )
      continue;

    const distance =
      distanceMeters(
        latitude,
        longitude,
        coin.latitude,
        coin.longitude
      );

    if (
      distance <=
      COLLECTION_DISTANCE
    ) {

      collectCoin(
        coin
      );
    }
  }
}

async function collectCoin(
  coin
) {

  if (
    !playerData ||
    coin.collected
  )
    return;

  coin.collected =
    true;

  if (
    map &&
    map.hasLayer(
      coin.marker
    )
  ) {

    map.removeLayer(
      coin.marker
    );
  }

  if (
    !playerData
      .collected_coins
      .includes(coin.id)
  ) {

    playerData
      .collected_coins
      .push(coin.id);
  }

  playerData.coins += 10;

  playerData.xp += 10;

  checkLevel();

  updateCoinDisplay();

  showToast(
    "🪙 COIN COLLECTED! +10"
  );

  await savePlayer();
}

/* =========================================================
   LEVEL
========================================================= */

function checkLevel() {

  if (!playerData)
    return;

  const required =
    playerData.level * 100;

  while (
    playerData.xp >= required
  ) {

    playerData.xp -=
      playerData.level * 100;

    playerData.level++;

    showToast(
      "🎉 LEVEL " +
      playerData.level +
      "!"
    );
  }
}

/* =========================================================
   SAVE
========================================================= */

async function savePlayer() {

  if (!playerData)
    return;

  const {
    error
  } =
    await supabase
      .from("players")
      .update({
        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        unlocked_skins:
          playerData.unlocked_skins,

        equipped_skin:
          playerData.equipped_skin,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        playerData.id
      );

  if (error) {

    console.error(
      "Save error:",
      error
    );

    showToast(
      "⚠️ Save failed"
    );
  }
}

/* =========================================================
   HUD
========================================================= */

function updateCoinDisplay() {

  coinsDisplay.innerText =
    "🪙 Coins: " +
    (
      playerData?.coins ||
      0
    );
}

/* =========================================================
   STATUS
========================================================= */

function updateBottomStatus() {

  const mode =
    gameMode === "PUBLIC"
      ? "🌎 Public"
      : "🔓 Unlimited";

  const accuracy =
    gpsAccuracy !== null
      ? Math.round(
          gpsAccuracy
        )
      : null;

  const road =
    nearestRoadDistance !== null
      ? Math.round(
          nearestRoadDistance
        )
      : null;

  const nearbyCoins =
    coins.filter(
      coin =>
        !coin.collected
    ).length;

  const gps =
    accuracy !== null
      ? `📍 GPS ±${accuracy}m`
      : "📍 GPS connecting...";

  const roadText =
    road !== null
      ? road <= 10
        ? "🛣️ On/near road"
        : `🛣️ Road ${road}m away`
      : "🛣️ Finding road...";

  statusElement.innerHTML = `
    <div>
      ${gps} • ${roadText}
    </div>

    <div>
      ${mode} • 🪙 ${nearbyCoins} coins nearby
    </div>
  `;
}

function setStatus(text) {

  statusElement.innerHTML =
    text;
}

/* =========================================================
   SHOP
========================================================= */

document
  .getElementById("shopButton")
  .onclick = () => {

    shopOverlay.style.display =
      "block";

    renderShop();
  };

document
  .getElementById("closeShop")
  .onclick = () => {

    shopOverlay.style.display =
      "none";
  };

function renderShop() {

  if (!playerData)
    return;

  shopBalance.innerText =
    "🪙 Coins: " +
    playerData.coins;

  shopItems.innerHTML =
    "";

  Object.entries(
    SKINS
  ).forEach(
    ([id, skin]) => {

      const unlocked =
        playerData
          .unlocked_skins
          .includes(id);

      const equipped =
        playerData
          .equipped_skin === id;

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "shopItem";

      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "skinPreview";

      preview.style.background =
        skin.color;

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "skinInfo";

      info.innerHTML = `
        <div class="skinName">
          ${skin.name}
        </div>

        <div class="skinPrice">
          ${
            skin.price === 0
              ? "FREE"
              : "🪙 " +
                skin.price
          }
        </div>
      `;

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "shopAction";

      if (equipped) {

        button.innerText =
          "EQUIPPED";

        button.disabled =
          true;

      } else if (unlocked) {

        button.innerText =
          "EQUIP";

        button.onclick =
          () =>
            equipSkin(id);

      } else if (
        playerData.coins >=
        skin.price
      ) {

        button.innerText =
          "BUY";

        button.onclick =
          () =>
            buySkin(id);

      } else {

        button.innerText =
          "NEED COINS";

        button.disabled =
          true;
      }

      item.appendChild(
        preview
      );

      item.appendChild(
        info
      );

      item.appendChild(
        button
      );

      shopItems.appendChild(
        item
      );
    }
  );
}

async function buySkin(id) {

  if (!playerData)
    return;

  const skin =
    SKINS[id];

  if (!skin)
    return;

  if (
    playerData
      .unlocked_skins
      .includes(id)
  )
    return;

  if (
    playerData.coins <
    skin.price
  ) {

    showToast(
      "❌ Not enough coins"
    );

    return;
  }

  playerData.coins -=
    skin.price;

  playerData
    .unlocked_skins
    .push(id);

  playerData.equipped_skin =
    id;

  await savePlayer();

  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();

  showToast(
    "🎨 " +
    skin.name +
    " unlocked!"
  );
}

async function equipSkin(id) {

  if (!playerData)
    return;

  if (
    !playerData
      .unlocked_skins
      .includes(id)
  )
    return;

  playerData.equipped_skin =
    id;

  await savePlayer();

  updatePlayerSkin();

  renderShop();

  showToast(
    "🎨 " +
    SKINS[id].name +
    " equipped!"
  );
}

/* =========================================================
   ACCOUNT
========================================================= */

document
  .getElementById("accountButton")
  .onclick = () => {

    accountEmail.innerText =
      currentUser?.email ||
      "Unknown";

    accountOverlay.style.display =
      "block";
  };

document
  .getElementById("closeAccount")
  .onclick = () => {

    accountOverlay.style.display =
      "none";
  };

document
  .getElementById("signOutButton")
  .onclick = async () => {

    await supabase.auth.signOut();

    location.reload();
  };

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(text) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.innerText =
    text;

  toast.classList.add(
    "show"
  );

  if (toastTimer)
    clearTimeout(
      toastTimer
    );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );
}

/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;

  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;

  const a =
    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(
      dLon / 2
    ) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R * c;
}

/* =========================================================
   GPS ERROR
========================================================= */

function locationError(
  error
) {

  console.error(
    "GPS error:",
    error
  );

  if (
    error.code ===
    error.PERMISSION_DENIED
  ) {

    setStatus(
      "📍 Location permission denied. Enable Location for this site."
    );

  } else if (
    error.code ===
    error.POSITION_UNAVAILABLE
  ) {

    setStatus(
      "📍 Location unavailable. Move somewhere with GPS signal."
    );

  } else if (
    error.code ===
    error.TIMEOUT
  ) {

    setStatus(
      "📍 GPS timed out. Trying again..."
    );

  } else {

    setStatus(
      "📍 Couldn't get your location."
    );
  }
}

/* =========================================================
   CONSTANT STATUS UPDATE
========================================================= */

setInterval(
  () => {

    if (
      currentUser &&
      gpsStarted
    ) {

      updateBottomStatus();
    }

  },
  1000
);

/* =========================================================
   AUTH STATE
========================================================= */

supabase.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    console.log(
      "Auth:",
      event
    );

    if (
      event ===
      "SIGNED_OUT"
    ) {

      location.reload();
    }
  }
);

/* =========================================================
   INITIAL START
========================================================= */

async function initialBoot() {

  const {
    data
  } =
    await supabase.auth.getSession();

  if (
    data.session
  ) {

    currentUser =
      data.session.user;

    await startGameBoot();

  } else {

    authScreen.style.display =
      "flex";

    loadingScreen.style.display =
      "none";
  }
}

initialBoot();
