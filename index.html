<!DOCTYPE html>
<html>

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

    }


    #map {

      width: 100%;
      height: 100%;

    }


    /* =====================================================
       ACCOUNT SCREEN
       ===================================================== */

    #authOverlay {

      position: fixed;

      inset: 0;

      z-index: 10000;

      background:
        radial-gradient(
          circle at center,
          #202830 0%,
          #080b0f 100%
        );

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      box-sizing: border-box;

      font-family: Arial, sans-serif;

    }


    #authBox {

      width: 100%;

      max-width: 400px;

      background: #151a20;

      color: white;

      border-radius: 22px;

      padding: 28px;

      box-sizing: border-box;

      box-shadow:
        0 15px 50px rgba(0,0,0,0.7);

      text-align: center;

    }


    #authBox h1 {

      margin-top: 0;

      margin-bottom: 8px;

      font-size: 30px;

    }


    #authTitle {

      color: #aaa;

      margin-bottom: 25px;

    }


    #authBox input {

      width: 100%;

      box-sizing: border-box;

      background: #20262d;

      color: white;

      border: 1px solid #3b444e;

      border-radius: 12px;

      padding: 14px;

      margin-bottom: 12px;

      font-size: 16px;

      outline: none;

    }


    #authBox input:focus {

      border-color: #00aaff;

    }


    #authButton {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      background: #0077cc;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 5px;

    }


    #authButton:disabled {

      opacity: 0.5;

      cursor: default;

    }


    #switchAuthButton {

      width: 100%;

      border: none;

      background: transparent;

      color: #00aaff;

      padding: 15px 5px 5px;

      cursor: pointer;

      font-size: 14px;

    }


    #authStatus {

      min-height: 20px;

      margin-bottom: 0;

      color: #ffcc55;

      font-size: 14px;

      line-height: 1.4;

    }


    /* =====================================================
       HUD
       ===================================================== */

    #hud {

      position: absolute;

      top: 15px;

      left: 15px;

      right: 15px;

      z-index: 1000;

      display: flex;

      gap: 8px;

      font-family: Arial, sans-serif;

    }


    .hudBox {

      background:
        rgba(10,15,20,0.95);

      color: white;

      padding: 10px 12px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.4);

      font-weight: bold;

    }


    #coinsDisplay {

      flex: 1;

    }


    #modeButton,
    #shopButton,
    #accountButton {

      cursor: pointer;

      user-select: none;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      position: absolute;

      bottom: 20px;

      left: 15px;

      right: 15px;

      z-index: 1000;

      background:
        rgba(10,15,20,0.95);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;

    }


    /* =====================================================
       PLAYER
       ===================================================== */

    .player {

      width: 22px;

      height: 22px;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px var(--player-color),
        0 0 18px var(--player-color),
        0 0 30px var(--player-color);

      background:
        var(--player-color);

    }


    /* =====================================================
       COINS
       ===================================================== */

    .coin {

      width: 28px;

      height: 28px;

      background:
        radial-gradient(
          circle at 35% 35%,
          #fffbd0 0%,
          #ffe44d 25%,
          #ffd000 55%,
          #f0a000 80%,
          #c87800 100%
        );

      border:
        3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255,190,0,0.7);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 17px;

      animation:
        coinPulse 1.4s infinite;

    }


    @keyframes coinPulse {

      0% {

        transform:
          scale(1);

      }

      50% {

        transform:
          scale(1.12);

      }

      100% {

        transform:
          scale(1);

      }

    }


    /* =====================================================
       SHOP
       ===================================================== */

    #shopOverlay {

      display: none;

      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 2000;

      background:
        rgba(0,0,0,0.75);

      font-family: Arial, sans-serif;

      overflow-y: auto;

      padding: 20px;

      box-sizing: border-box;

    }


    #shop {

      max-width: 500px;

      margin: 30px auto;

      background:
        #151a20;

      color: white;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.7);

    }


    #shopHeader {

      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-bottom: 20px;

    }


    #shopHeader h2 {

      margin: 0;

    }


    #closeShop {

      background:
        #333;

      color:
        white;

      border:
        none;

      border-radius:
        10px;

      padding:
        9px 13px;

      font-size:
        18px;

      cursor:
        pointer;

    }


    #shopBalance {

      background:
        rgba(255,215,0,0.12);

      border:
        1px solid
        rgba(255,215,0,0.4);

      border-radius:
        12px;

      padding:
        12px;

      text-align:
        center;

      margin-bottom:
        15px;

      font-weight:
        bold;

    }


    .shopItem {

      background:
        #20262d;

      border-radius:
        15px;

      padding:
        15px;

      margin-bottom:
        12px;

      display:
        flex;

      align-items:
        center;

      gap:
        15px;

    }


    .skinPreview {

      width:
        42px;

      height:
        42px;

      border:
        4px solid white;

      border-radius:
        50%;

      box-shadow:
        0 0 14px currentColor;

      flex-shrink:
        0;

    }


    .skinInfo {

      flex:
        1;

    }


    .skinName {

      font-weight:
        bold;

      font-size:
        17px;

      margin-bottom:
        4px;

    }


    .skinPrice {

      color:
        #ffd700;

      font-size:
        14px;

    }


    .shopButton {

      border:
        none;

      border-radius:
        10px;

      padding:
        9px 12px;

      color:
        white;

      background:
        #0077cc;

      font-weight:
        bold;

      cursor:
        pointer;

    }


    .shopButton:disabled {

      opacity:
        0.5;

      cursor:
        default;

    }


  </style>

</head>


<body>


  <!-- =====================================================
       ACCOUNT
       ===================================================== -->

  <div id="authOverlay">

    <div id="authBox">

      <h1>
        🪙 GPS COINS
      </h1>

      <p id="authTitle">
        Create your account
      </p>

      <input
        id="emailInput"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="authButton">
        CREATE ACCOUNT
      </button>

      <button id="switchAuthButton">
        Already have an account? Log in
      </button>

      <p id="authStatus"></p>

    </div>

  </div>


  <!-- =====================================================
       HUD
       ===================================================== -->

  <div id="hud">

    <div
      class="hudBox"
      id="coinsDisplay"
    >
      🪙 Coins: 0
    </div>


    <div
      class="hudBox"
      id="shopButton"
    >
      🛒 SHOP
    </div>


    <div
      class="hudBox"
      id="modeButton"
    >
      🌎 PUBLIC
    </div>


    <div
      class="hudBox"
      id="accountButton"
    >
      👤 ACCOUNT
    </div>

  </div>


  <!-- =====================================================
       STATUS
       ===================================================== -->

  <div id="status">

    📍 Finding your location...

  </div>


  <!-- =====================================================
       MAP
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       SHOP
       ===================================================== -->

  <div id="shopOverlay">

    <div id="shop">

      <div id="shopHeader">

        <h2>
          🛒 Player Shop
        </h2>

        <button id="closeShop">
          ✕
        </button>

      </div>


      <div id="shopBalance">

        🪙 Coins: 0

      </div>


      <div id="shopItems"></div>

    </div>

  </div>


  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <script>


    /* =====================================================
       SUPABASE CONFIG
       ===================================================== */

    /*
      PUT YOUR REAL VALUES HERE.

      Supabase Dashboard:
      Project Settings
      → API

      USE:
      - Project URL
      - Publishable key

      DO NOT USE:
      - service_role key
      - secret key
    */


    const SUPABASE_URL =
      "YOUR_SUPABASE_PROJECT_URL";


    const SUPABASE_KEY =
      "YOUR_SUPABASE_PUBLISHABLE_KEY";


    const supabase =
      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

      );


    /* =====================================================
       DEFAULT SAVE
       ===================================================== */

    const DEFAULT_SAVE = {

      coins: 0,

      unlockedSkins: [

        "blue"

      ],

      equippedSkin:
        "blue",

      collectedCoins: []

    };


    let save = {

      ...DEFAULT_SAVE

    };


    let currentUser =
      null;


    /* =====================================================
       AUTH ELEMENTS
       ===================================================== */

    const authOverlay =
      document.getElementById(
        "authOverlay"
      );


    const authTitle =
      document.getElementById(
        "authTitle"
      );


    const authButton =
      document.getElementById(
        "authButton"
      );


    const switchAuthButton =
      document.getElementById(
        "switchAuthButton"
      );


    const emailInput =
      document.getElementById(
        "emailInput"
      );


    const passwordInput =
      document.getElementById(
        "passwordInput"
      );


    const authStatus =
      document.getElementById(
        "authStatus"
      );


    let authMode =
      "signup";


    /* =====================================================
       AUTH UI
       ===================================================== */

    function updateAuthUI() {

      if (
        authMode ===
        "signup"
      ) {

        authTitle.innerText =
          "Create your account";

        authButton.innerText =
          "CREATE ACCOUNT";

        switchAuthButton.innerText =
          "Already have an account? Log in";

      } else {

        authTitle.innerText =
          "Log into your account";

        authButton.innerText =
          "LOG IN";

        switchAuthButton.innerText =
          "Don't have an account? Sign up";

      }

    }


    updateAuthUI();


    /* =====================================================
       CLOUD LOAD
       ===================================================== */

    async function loadPlayerData() {

      if (!currentUser) {

        return;

      }


      setStatus(
        "☁️ Loading your account..."
      );


      const {

        data,

        error

      } = await supabase

        .from("players")

        .select("*")

        .eq(
          "id",
          currentUser.id
        )

        .maybeSingle();


      if (error) {

        console.error(
          "Player load error:",
          error
        );

        setStatus(
          "❌ Couldn't load your account."
        );

        return;

      }


      /* ===================================================
         CREATE NEW PLAYER
         =================================================== */

      if (!data) {

        const {

          data:
            newPlayer,

          error:
            createError

        } = await supabase

          .from("players")

          .insert({

            id:
              currentUser.id,

            coins:
              0,

            unlocked_skins:
              ["blue"],

            equipped_skin:
              "blue",

            collected_coins:
              []

          })

          .select()

          .single();


        if (createError) {

          console.error(
            "Player creation error:",
            createError
          );

          setStatus(
            "❌ Couldn't create your player."
          );

          return;

        }


        save = {

          coins:
            newPlayer.coins,

          unlockedSkins:
            newPlayer.unlocked_skins,

          equippedSkin:
            newPlayer.equipped_skin,

          collectedCoins:
            newPlayer.collected_coins

        };


      } else {


        /* =================================================
           LOAD EXISTING PLAYER
           ================================================= */

        save = {

          coins:
            data.coins ?? 0,

          unlockedSkins:
            data.unlocked_skins ?? [
              "blue"
            ],

          equippedSkin:
            data.equipped_skin ??
            "blue",

          collectedCoins:
            data.collected_coins ?? []

        };

      }


      updateCoinDisplay();


      setStatus(
        "☁️ Account loaded!"
      );

    }


    /* =====================================================
       CLOUD SAVE
       ===================================================== */

    async function saveGame() {

      if (!currentUser) {

        console.warn(
          "No logged-in user."
        );

        return;

      }


      const {

        error

      } = await supabase

        .from("players")

        .upsert({

          id:
            currentUser.id,

          coins:
            save.coins,

          unlocked_skins:
            save.unlockedSkins,

          equipped_skin:
            save.equippedSkin,

          collected_coins:
            save.collectedCoins,

          updated_at:
            new Date().toISOString()

        });


      if (error) {

        console.error(
          "Cloud save error:",
          error
        );

      }

    }


    /* =====================================================
       SIGN UP
       ===================================================== */

    async function createAccount(
      email,
      password
    ) {

      const {

        data,

        error

      } = await supabase.auth.signUp({

        email:
          email,

        password:
          password

      });


      if (error) {

        console.error(
          error
        );

        authStatus.innerText =
          error.message;

        return;

      }


      /*
        If email confirmation is enabled,
        session can be null.
      */

      if (!data.session) {

        authStatus.innerText =
          "📧 Check your email to confirm your account.";

        return;

      }


      await finishLogin(
        data.user
      );

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    async function loginAccount(
      email,
      password
    ) {

      const {

        data,

        error

      } = await supabase.auth
        .signInWithPassword({

          email:
            email,

          password:
            password

        });


      if (error) {

        console.error(
          error
        );

        authStatus.innerText =
          error.message;

        return;

      }


      await finishLogin(
        data.user
      );

    }


    /* =====================================================
       FINISH LOGIN
       ===================================================== */

    async function finishLogin(
      user
    ) {

      if (!user) {

        return;

      }


      currentUser =
        user;


      authStatus.innerText =
        "☁️ Loading player...";


      await loadPlayerData();


      authOverlay.style.display =
        "none";


      updateCoinDisplay();


      if (player) {

        updatePlayerSkin();

      }


      setStatus(
        "🎮 Welcome!"
      );

    }


    /* =====================================================
       LOGOUT
       ===================================================== */

    async function logoutAccount() {

      /*
        Save one final time before logging out.
      */

      await saveGame();


      const {

        error

      } = await supabase.auth.signOut();


      if (error) {

        console.error(
          error
        );

        return;

      }


      currentUser =
        null;


      save = {

        ...DEFAULT_SAVE

      };


      updateCoinDisplay();


      authMode =
        "login";


      emailInput.value =
        "";

      passwordInput.value =
        "";

      authStatus.innerText =
        "";


      updateAuthUI();


      authOverlay.style.display =
        "flex";


      setStatus(
        "👋 Logged out."
      );

    }


    /* =====================================================
       CHECK EXISTING SESSION
       ===================================================== */

    async function checkAuth() {

      const {

        data,

        error

      } = await supabase.auth
        .getSession();


      if (error) {

        console.error(
          "Session error:",
          error
        );

        authOverlay.style.display =
          "flex";

        return;

      }


      if (

        data.session &&

        data.session.user

      ) {

        await finishLogin(

          data.session.user

        );

      } else {

        authOverlay.style.display =
          "flex";

      }

    }


    /* =====================================================
       AUTH STATE
       ===================================================== */

    supabase.auth.onAuthStateChange(

      async function(
        event,
        session
      ) {


        if (
          event ===
          "SIGNED_OUT"
        ) {

          currentUser =
            null;

          authOverlay.style.display =
            "flex";

          return;

        }


        if (

          session &&

          session.user &&

          !currentUser

        ) {

          await finishLogin(

            session.user

          );

        }

      }

    );


    /* =====================================================
       AUTH BUTTON
       ===================================================== */

    authButton.addEventListener(

      "click",

      async function() {


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        if (!email) {

          authStatus.innerText =
            "Enter your email.";

          return;

        }


        if (
          password.length < 6
        ) {

          authStatus.innerText =
            "Password must be at least 6 characters.";

          return;

        }


        authButton.disabled =
          true;


        authStatus.innerText =
          "Please wait...";


        try {


          if (
            authMode ===
            "signup"
          ) {


            await createAccount(

              email,

              password

            );


          } else {


            await loginAccount(

              email,

              password

            );

          }


        } finally {

          authButton.disabled =
            false;

        }

      }

    );


    /* =====================================================
       SWITCH LOGIN / SIGNUP
       ===================================================== */

    switchAuthButton.addEventListener(

      "click",

      function() {


        if (
          authMode ===
          "signup"
        ) {

          authMode =
            "login";

        } else {

          authMode =
            "signup";

        }


        authStatus.innerText =
          "";


        updateAuthUI();

      }

    );


    /* =====================================================
       SKINS
       ===================================================== */

    const SKINS = {

      blue: {

        name:
          "Blue",

        color:
          "#00aaff",

        price:
          0

      },

      red: {

        name:
          "Red",

        color:
          "#ff3030",

        price:
          50

      },

      green: {

        name:
          "Green",

        color:
          "#22dd55",

        price:
          100

      },

      purple: {

        name:
          "Purple",

        color:
          "#aa55ff",

        price:
          150

      },

      gold: {

        name:
          "Gold",

        color:
          "#ffd000",

        price:
          250

      },

      pink: {

        name:
          "Pink",

        color:
          "#ff4fa3",

        price:
          350

      }

    };


    /* =====================================================
       GAME VARIABLES
       ===================================================== */

    let map =
      null;


    let player =
      null;


    let coins =
      [];


    let gameMode =
      "PUBLIC";


    let currentLatitude =
      null;


    let currentLongitude =
      null;


    let loadingTrail =
      false;


    /* =====================================================
       SETTINGS
       ===================================================== */

    const SEARCH_RADIUS =
      800;


    const COIN_SPACING =
      65;


    const MAIN_COINS =
      5;


    const BRANCH_COINS =
      3;


    const COLLECTION_DISTANCE =
      15;


    const REFRESH_DISTANCE =
      200;


    const OVERPASS_SERVERS = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];


    /* =====================================================
       HUD
       ===================================================== */

    function updateCoinDisplay() {

      document.getElementById(
        "coinsDisplay"
      ).innerText =

        "🪙 Coins: " +
        save.coins;

    }


    updateCoinDisplay();


    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(

      latitude,

      longitude

    ) {


      if (map) {

        return;

      }


      map =
        L.map("map").setView(

          [

            latitude,

            longitude

          ],

          17

        );


      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

          attribution:
            "© OpenStreetMap contributors"

        }

      ).addTo(map);


      createPlayer(

        latitude,

        longitude

      );


      currentLatitude =
        latitude;


      currentLongitude =
        longitude;


      loadTrail(

        latitude,

        longitude

      );

    }


    /* =====================================================
       CREATE PLAYER
       ===================================================== */

    function createPlayer(

      latitude,

      longitude

    ) {


      const skin =
        SKINS[

          save.equippedSkin

        ] ||

        SKINS.blue;


      const playerIcon =
        L.divIcon({

          className: "",

          html:

            '<div class="player" ' +

            'style="--player-color:' +

            skin.color +

            '"></div>',

          iconSize:
            [28,28],

          iconAnchor:
            [14,14]

        });


      player =
        L.marker(

          [

            latitude,

            longitude

          ],

          {

            icon:
              playerIcon

          }

        ).addTo(map);

    }


    /* =====================================================
       UPDATE PLAYER SKIN
       ===================================================== */

    function updatePlayerSkin() {

      if (!player) {

        return;

      }


      const skin =
        SKINS[

          save.equippedSkin

        ] ||

        SKINS.blue;


      const icon =
        L.divIcon({

          className: "",

          html:

            '<div class="player" ' +

            'style="--player-color:' +

            skin.color +

            '"></div>',

          iconSize:
            [28,28],

          iconAnchor:
            [14,14]

        });


      player.setIcon(
        icon
      );

    }


    /* =====================================================
       GPS
       ===================================================== */

    function updateLocation(
      position
    ) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      if (!map) {

        startGame(

          latitude,

          longitude

        );

        return;

      }


      player.setLatLng([

        latitude,

        longitude

      ]);


      checkCoinCollection(

        latitude,

        longitude

      );


      if (

        currentLatitude !== null &&

        currentLongitude !== null

      ) {


        const distance =
          distanceMeters(

            currentLatitude,

            currentLongitude,

            latitude,

            longitude

          );


        if (

          distance >=

          REFRESH_DISTANCE

        ) {


          currentLatitude =
            latitude;


          currentLongitude =
            longitude;


          loadTrail(

            latitude,

            longitude

          );

        }

      }

    }


    /* =====================================================
       LOAD TRAIL
       ===================================================== */

    async function loadTrail(

      latitude,

      longitude

    ) {


      if (loadingTrail) {

        return;

      }


      loadingTrail =
        true;


      setStatus(
        "🗺️ Building a path..."
      );


      removeUncollectedCoins();


      const latOffset =
        SEARCH_RADIUS /
        111320;


      const lonOffset =

        SEARCH_RADIUS /

        (

          111320 *

          Math.cos(

            latitude *

            Math.PI /

            180

          )

        );


      const south =
        latitude -
        latOffset;


      const north =
        latitude +
        latOffset;


      const west =
        longitude -
        lonOffset;


      const east =
        longitude +
        lonOffset;


      const query = `

        [out:json]
        [timeout:20];

        way["highway"]
          (${south},${west},${north},${east});

        out tags geom;

      `;


      let data =
        null;


      for (

        let i = 0;

        i <
        OVERPASS_SERVERS.length;

        i++

      ) {


        try {


          const response =
            await fetch(

              OVERPASS_SERVERS[i],

              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/x-www-form-urlencoded"

                },

                body:

                  "data=" +

                  encodeURIComponent(

                    query

                  )

              }

            );


          if (!response.ok) {

            throw new Error(

              "HTTP " +

              response.status

            );

          }


          data =
            await response.json();


          break;


        } catch (error) {

          console.log(

            "Overpass error:",

            error

          );

        }

      }


      if (!data) {

        setStatus(

          "⚠️ Couldn't load map data."

        );

        loadingTrail =
          false;

        return;

      }


      const ways =
        filterWays(

          data.elements

        );


      if (

        ways.length === 0

      ) {

        setStatus(

          gameMode ===
          "PUBLIC"

            ? "🔎 No suitable public paths nearby."

            : "🔎 No mapped paths nearby."

        );

        loadingTrail =
          false;

        return;

      }


      const start =
        findClosestNetworkPoint(

          ways,

          latitude,

          longitude

        );


      if (!start) {

        setStatus(

          "🔎 Couldn't find a nearby path."

        );

        loadingTrail =
          false;

        return;

      }


      const mainRoute =
        buildNetworkRoute(

          ways,

          start,

          MAIN_COINS

        );


      const branchRoute =
        findNetworkBranch(

          ways,

          mainRoute,

          start

        );


      mainRoute.forEach(

        function(point) {

          createCoin(

            point.lat,

            point.lon

          );

        }

      );


      branchRoute.forEach(

        function(point) {

          createCoin(

            point.lat,

            point.lon

          );

        }

      );


      const total =
        mainRoute.length +
        branchRoute.length;


      setStatus(

        total > 0

          ? "🎮 " +
            total +
            " coins on real mapped paths"

          : "🔎 Path found, but it's too short."

      );


      loadingTrail =
        false;

    }


    /* =====================================================
       FILTER WAYS
       ===================================================== */

    function filterWays(
      elements
    ) {


      const result =
        [];


      elements.forEach(

        function(element) {


          if (

            element.type !==
            "way"

          ) {

            return;

          }


          if (

            !element.geometry ||

            element.geometry.length <
            2

          ) {

            return;

          }


          const tags =
            element.tags ||
            {};


          const highway =
            tags.highway;


          if (!highway) {

            return;

          }


          const access =
            String(

              tags.access ||
              ""

            ).toLowerCase();


          if (

            gameMode ===
            "PUBLIC"

          ) {


            if (

              access ===
              "private" ||

              access ===
              "no" ||

              access ===
              "permit" ||

              access ===
              "customers"

            ) {

              return;

            }


            const allowed = [

              "footway",

              "path",

              "pedestrian",

              "steps",

              "cycleway",

              "bridleway",

              "living_street"

            ];


            if (

              !allowed.includes(
                highway
              )

            ) {

              return;

            }

          }


          if (

            gameMode ===
            "UNLIMITED"

          ) {


            const forbidden = [

              "motorway",

              "motorway_link",

              "trunk",

              "trunk_link",

              "primary",

              "primary_link"

            ];


            if (

              forbidden.includes(
                highway
              )

            ) {

              return;

            }

          }


          result.push({

            id:
              element.id,

            geometry:
              element.geometry,

            tags:
              tags

          });

        }

      );


      return result;

    }


    /* =====================================================
       CLOSEST NETWORK POINT
       ===================================================== */

    function findClosestNetworkPoint(

      ways,

      latitude,

      longitude

    ) {


      let best =
        null;


      ways.forEach(

        function(way) {


          way.geometry.forEach(

            function(

              point,

              index

            ) {


              const distance =
                distanceMeters(

                  latitude,

                  longitude,

                  point.lat,

                  point.lon

                );


              if (

                best === null ||

                distance <
                best.distance

              ) {


                best = {

                  way:
                    way,

                  index:
                    index,

                  distance:
                    distance,

                  point:
                    point

                };

              }

            }

          );

        }

      );


      return best;

    }


    /* =====================================================
       BUILD NETWORK ROUTE
       ===================================================== */

    function buildNetworkRoute(

      ways,

      start,

      numberOfCoins

    ) {


      const route =
        [];


      const geometry =
        start.way.geometry;


      let direction =
        1;


      if (

        start.index >=

        geometry.length - 1

      ) {

        direction =
          -1;

      }


      let currentWay =
        start.way;


      let currentIndex =
        start.index;


      let currentDirection =
        direction;


      let accumulated =
        0;


      let lastPoint =
        start.point;


      const visited =
        new Set();


      while (

        route.length <
        numberOfCoins

      ) {


        const visitKey =

          currentWay.id +

          ":" +

          currentIndex +

          ":" +

          currentDirection;


        if (

          visited.has(
            visitKey
          )

        ) {

          break;

        }


        visited.add(
          visitKey
        );


        const nextIndex =

          currentIndex +

          currentDirection;


        if (

          nextIndex < 0 ||

          nextIndex >=

          currentWay.geometry.length

        ) {


          const endpoint =

            currentWay.geometry[

              currentDirection === 1

                ? currentWay.geometry.length - 1

                : 0

            ];


          const nextWay =
            findConnectedWay(

              ways,

              endpoint,

              currentWay.id

            );


          if (!nextWay) {

            break;

          }


          currentWay =
            nextWay.way;


          currentIndex =
            nextWay.index;


          currentDirection =
            nextWay.direction;


          continue;

        }


        const point =
          currentWay.geometry[

            nextIndex

          ];


        accumulated +=

          distanceMeters(

            lastPoint.lat,

            lastPoint.lon,

            point.lat,

            point.lon

          );


        if (

          accumulated >=
          COIN_SPACING

        ) {


          route.push({

            lat:
              point.lat,

            lon:
              point.lon

          });


          accumulated =
            0;

        }


        lastPoint =
          point;


        currentIndex =
          nextIndex;

      }


      return route;

    }


    /* =====================================================
       CONNECTED WAY
       ===================================================== */

    function findConnectedWay(

      ways,

      endpoint,

      currentWayId

    ) {


      let best =
        null;


      let bestDistance =
        30;


      ways.forEach(

        function(way) {


          if (

            way.id ===
            currentWayId

          ) {

            return;

          }


          const first =
            way.geometry[0];


          const last =
            way.geometry[

              way.geometry.length - 1

            ];


          const d1 =
            distanceMeters(

              endpoint.lat,

              endpoint.lon,

              first.lat,

              first.lon

            );


          const d2 =
            distanceMeters(

              endpoint.lat,

              endpoint.lon,

              last.lat,

              last.lon

            );


          if (

            d1 <=
            bestDistance

          ) {


            best = {

              way:
                way,

              index:
                0,

              direction:
                1

            };


            bestDistance =
              d1;

          }


          if (

            d2 <=
            bestDistance

          ) {


            best = {

              way:
                way,

              index:
                way.geometry.length - 1,

              direction:
                -1

            };


            bestDistance =
              d2;

          }

        }

      );


      return best;

    }


    /* =====================================================
       FIND BRANCH
       ===================================================== */

    function findNetworkBranch(

      ways,

      mainRoute,

      start

    ) {


      if (

        mainRoute.length <
        2

      ) {

        return [];

      }


      for (

        let r = 1;

        r <
        mainRoute.length;

        r++

      ) {


        const routePoint =
          mainRoute[r];


        for (

          let i = 0;

          i <
          ways.length;

          i++

        ) {


          const way =
            ways[i];


          if (

            way.id ===
            start.way.id

          ) {

            continue;

          }


          const first =
            way.geometry[0];


          const last =
            way.geometry[

              way.geometry.length - 1

            ];


          const firstDistance =
            distanceMeters(

              routePoint.lat,

              routePoint.lon,

              first.lat,

              first.lon

            );


          const lastDistance =
            distanceMeters(

              routePoint.lat,

              routePoint.lon,

              last.lat,

              last.lon

            );


          if (

            firstDistance <=
            30

          ) {


            return buildBranch(

              way,

              0,

              1

            );

          }


          if (

            lastDistance <=
            30

          ) {


            return buildBranch(

              way,

              way.geometry.length - 1,

              -1

            );

          }

        }

      }


      return [];

    }


    /* =====================================================
       BUILD BRANCH
       ===================================================== */

    function buildBranch(

      way,

      startIndex,

      direction

    ) {


      const result =
        [];


      let accumulated =
        0;


      let lastPoint =
        way.geometry[startIndex];


      for (

        let step = 1;

        step <
        way.geometry.length;

        step++

      ) {


        const index =

          startIndex +

          step *
          direction;


        if (

          index < 0 ||

          index >=
          way.geometry.length

        ) {

          break;

        }


        const point =
          way.geometry[index];


        accumulated +=

          distanceMeters(

            lastPoint.lat,

            lastPoint.lon,

            point.lat,

            point.lon

          );


        if (

          accumulated >=
          COIN_SPACING

        ) {


          result.push({

            lat:
              point.lat,

            lon:
              point.lon

          });


          accumulated =
            0;


          if (

            result.length >=
            BRANCH_COINS

          ) {

            break;

          }

        }


        lastPoint =
          point;

      }


      return result;

    }


    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(

      latitude,

      longitude

    ) {


      const id =
        makeCoinId(

          latitude,

          longitude

        );


      if (

        save.collectedCoins.includes(
          id
        )

      ) {

        return;

      }


      for (

        let i = 0;

        i <
        coins.length;

        i++

      ) {


        const existing =
          coins[i];


        if (

          distanceMeters(

            latitude,

            longitude,

            existing.latitude,

            existing.longitude

          ) < 20

        ) {

          return;

        }

      }


      const coinIcon =
        L.divIcon({

          className: "",

          html:

            '<div class="coin">🪙</div>',

          iconSize:
            [34,34],

          iconAnchor:
            [17,17]

        });


      const marker =
        L.marker(

          [

            latitude,

            longitude

          ],

          {

            icon:
              coinIcon

          }

        ).addTo(map);


      coins.push({

        id:
          id,

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }


    /* =====================================================
       COIN ID
       ===================================================== */

    function makeCoinId(

      latitude,

      longitude

    ) {


      return (

        Math.round(

          latitude * 100000

        ) +

        "_" +

        Math.round(

          longitude * 100000

        )

      );

    }


    /* =====================================================
       REMOVE UNCOLLECTED
       ===================================================== */

    function removeUncollectedCoins() {

      const remaining =
        [];


      coins.forEach(

        function(coin) {


          if (

            coin.collected

          ) {


            remaining.push(
              coin
            );


          } else {


            if (

              map.hasLayer(
                coin.marker
              )

            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }

      );


      coins =
        remaining;

    }


    /* =====================================================
       COLLECTION
       ===================================================== */

    function checkCoinCollection(

      latitude,

      longitude

    ) {


      coins.forEach(

        function(coin) {


          if (

            coin.collected

          ) {

            return;

          }


          const distance =
            distanceMeters(

              latitude,

              longitude,

              coin.latitude,

              coin.longitude

            );


          if (

            distance <=
            COLLECTION_DISTANCE

          ) {

            collectCoin(
              coin
            );

          }

        }

      );

    }


    /* =====================================================
       COLLECT COIN
       ===================================================== */

    async function collectCoin(
      coin
    ) {


      if (

        coin.collected

      ) {

        return;

      }


      coin.collected =
        true;


      if (

        map.hasLayer(
          coin.marker
        )

      ) {

        map.removeLayer(
          coin.marker
        );

      }


      if (

        !save.collectedCoins.includes(
          coin.id
        )

      ) {


        save.collectedCoins.push(
          coin.id
        );

      }


      save.coins +=
        10;


      updateCoinDisplay();


      setStatus(
        "🪙 COIN COLLECTED! +10"
      );


      /*
        Save immediately to Supabase.
      */

      await saveGame();


      setTimeout(

        function() {

          setStatus(
            "🎮 KEEP EXPLORING"
          );

        },

        2000

      );

    }


    /* =====================================================
       DISTANCE
       ===================================================== */

    function distanceMeters(

      lat1,

      lon1,

      lat2,

      lon2

    ) {


      const R =
        6371000;


      const p1 =
        lat1 *
        Math.PI /
        180;


      const p2 =
        lat2 *
        Math.PI /
        180;


      const dLat =

        (

          lat2 -
          lat1

        ) *

        Math.PI /
        180;


      const dLon =

        (

          lon2 -
          lon1

        ) *

        Math.PI /
        180;


      const a =

        Math.sin(
          dLat / 2
        ) ** 2

        +

        Math.cos(p1) *

        Math.cos(p2) *

        Math.sin(
          dLon / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return R * c;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    function setStatus(
      text
    ) {

      document.getElementById(
        "status"
      ).innerText =
        text;

    }


    /* =====================================================
       SHOP
       ===================================================== */

    function openShop() {

      document.getElementById(
        "shopOverlay"
      ).style.display =
        "block";


      renderShop();

    }


    function closeShop() {

      document.getElementById(
        "shopOverlay"
      ).style.display =
        "none";

    }


    function renderShop() {


      document.getElementById(
        "shopBalance"
      ).innerText =

        "🪙 Coins: " +
        save.coins;


      const container =
        document.getElementById(
          "shopItems"
        );


      container.innerHTML =
        "";


      Object.keys(
        SKINS
      ).forEach(

        function(id) {


          const skin =
            SKINS[id];


          const unlocked =
            save.unlockedSkins.includes(
              id
            );


          const equipped =
            save.equippedSkin ===
            id;


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "shopItem";


          item.innerHTML = `

            <div
              class="skinPreview"
              style="
                background:${skin.color};
                color:${skin.color};
              "
            ></div>

            <div class="skinInfo">

              <div class="skinName">
                ${skin.name}
              </div>

              <div class="skinPrice">

                ${
                  skin.price === 0

                    ? "FREE"

                    : "🪙 " +
                      skin.price

                }

              </div>

            </div>

            <button
              class="shopButton"
            ></button>

          `;


          const button =
            item.querySelector(
              ".shopButton"
            );


          if (equipped) {


            button.innerText =
              "EQUIPPED";


            button.disabled =
              true;


          } else if (unlocked) {


            button.innerText =
              "EQUIP";


            button.addEventListener(

              "click",

              function() {

                equipSkin(
                  id
                );

              }

            );


          } else if (

            save.coins >=
            skin.price

          ) {


            button.innerText =
              "BUY";


            button.addEventListener(

              "click",

              function() {

                buySkin(
                  id
                );

              }

            );


          } else {


            button.innerText =
              "NEED COINS";


            button.disabled =
              true;

          }


          container.appendChild(
            item
          );

        }

      );

    }


    /* =====================================================
       BUY SKIN
       ===================================================== */

    async function buySkin(
      id
    ) {


      const skin =
        SKINS[id];


      if (!skin) {

        return;

      }


      if (

        save.unlockedSkins.includes(
          id
        )

      ) {

        return;

      }


      if (

        save.coins <
        skin.price

      ) {

        return;

      }


      save.coins -=
        skin.price;


      save.unlockedSkins.push(
        id
      );


      save.equippedSkin =
        id;


      updateCoinDisplay();


      updatePlayerSkin();


      renderShop();


      setStatus(

        "🎨 " +
        skin.name +
        " unlocked!"

      );


      await saveGame();

    }


    /* =====================================================
       EQUIP SKIN
       ===================================================== */

    async function equipSkin(
      id
    ) {


      if (

        !save.unlockedSkins.includes(
          id
        )

      ) {

        return;

      }


      save.equippedSkin =
        id;


      updatePlayerSkin();


      renderShop();


      setStatus(

        "🎨 " +
        SKINS[id].name +
        " equipped!"

      );


      await saveGame();

    }


    /* =====================================================
       SHOP EVENTS
       ===================================================== */

    document.getElementById(
      "shopButton"
    ).addEventListener(

      "click",

      openShop

    );


    document.getElementById(
      "closeShop"
    ).addEventListener(

      "click",

      closeShop

    );


    /* =====================================================
       ACCOUNT BUTTON
       ===================================================== */

    document.getElementById(
      "accountButton"
    ).addEventListener(

      "click",

      async function() {


        if (!currentUser) {

          authOverlay.style.display =
            "flex";

          return;

        }


        const choice =
          confirm(

            "Log out of your account?"

          );


        if (!choice) {

          return;

        }


        await logoutAccount();

      }

    );


    /* =====================================================
       MODE SWITCH
       ===================================================== */

    document.getElementById(
      "modeButton"
    ).addEventListener(

      "click",

      function() {


        if (

          gameMode ===
          "PUBLIC"

        ) {


          gameMode =
            "UNLIMITED";


          document.getElementById(
            "modeButton"
          ).innerText =
            "🔓 UNLIMITED";


        } else {


          gameMode =
            "PUBLIC";


          document.getElementById(
            "modeButton"
          ).innerText =
            "🌎 PUBLIC";

        }


        if (

          currentLatitude !==
          null &&

          currentLongitude !==
          null

        ) {


          loadTrail(

            currentLatitude,

            currentLongitude

          );

        }

      }

    );


    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(
      error
    ) {


      console.log(
        "GPS error:",
        error
      );


      setStatus(

        "❌ Couldn't get your location."

      );

    }


    /* =====================================================
       START GPS
       ===================================================== */

    if (

      "geolocation" in
      navigator

    ) {


      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );


    } else {


      setStatus(

        "❌ GPS isn't available."

      );

    }


    /* =====================================================
       START AUTH
       ===================================================== */

    checkAuth();


  </script>
