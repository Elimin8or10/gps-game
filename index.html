<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let playerData = null;

let map = null;

let playerMarker = null;

let gpsWatch = null;

let gpsStarted = false;

let gameStarted = false;

let loadingTrail = false;

let lastTrailLatitude = null;

let lastTrailLongitude = null;

let currentLatitude = null;

let currentLongitude = null;

let currentNearestWay = null;

let currentNearestPoint = null;

let coins = [];

let gameMode = "PUBLIC";

let toastTimer = null;


/* =========================================================
   SETTINGS
========================================================= */

const SEARCH_RADIUS = 1200;

const COIN_SPACING = 55;

const MAIN_COINS = 12;

const BRANCH_COINS = 5;

const COLLECTION_DISTANCE = 25;

const TRAIL_REFRESH_DISTANCE = 100;

const MAX_PATH_DISTANCE = 500;

const CONNECT_DISTANCE = 45;


/* =========================================================
   OVERPASS
========================================================= */

const OVERPASS_SERVERS = [

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter"

];


/* =========================================================
   SKINS
========================================================= */

const SKINS = {

  blue: {
    name:"Blue",
    color:"#00aaff",
    price:0
  },

  red: {
    name:"Red",
    color:"#ff3030",
    price:50
  },

  green: {
    name:"Green",
    color:"#22dd55",
    price:100
  },

  purple: {
    name:"Purple",
    color:"#aa55ff",
    price:150
  },

  gold: {
    name:"Gold",
    color:"#ffd000",
    price:250
  },

  pink: {
    name:"Pink",
    color:"#ff4fa3",
    price:350
  }

};


/* =========================================================
   DOM
========================================================= */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const emailInput =
  document.getElementById(
    "emailInput"
  );

const signInButton =
  document.getElementById(
    "signInButton"
  );

const loginMessage =
  document.getElementById(
    "loginMessage"
  );

const modeScreen =
  document.getElementById(
    "modeScreen"
  );

const loadingScreen =
  document.getElementById(
    "loadingScreen"
  );

const loadingText =
  document.getElementById(
    "loadingText"
  );

const loadingBar =
  document.getElementById(
    "loadingBarInner"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const roadNameElement =
  document.getElementById(
    "roadName"
  );

const roadDistanceElement =
  document.getElementById(
    "roadDistance"
  );

const coinsDisplay =
  document.getElementById(
    "coinsDisplay"
  );

const shopOverlay =
  document.getElementById(
    "shopOverlay"
  );

const shopItems =
  document.getElementById(
    "shopItems"
  );

const shopBalance =
  document.getElementById(
    "shopBalance"
  );

const accountOverlay =
  document.getElementById(
    "accountOverlay"
  );

const accountEmail =
  document.getElementById(
    "accountEmail"
  );


/* =========================================================
   HELPERS
========================================================= */

function setLoginMessage(text) {

  loginMessage.textContent =
    text;

}


function loading(text, progress) {

  loadingText.textContent =
    text;

  loadingBar.style.width =
    progress + "%";

}


function setStatus(text) {

  statusElement.textContent =
    text;

}


function showToast(text) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.classList.add("show");

  if (
    toastTimer !== null
  ) {

    clearTimeout(
      toastTimer
    );

  }

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================================
   AUTH
========================================================= */

signInButton.addEventListener(
  "click",
  signIn
);


emailInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      signIn();

    }

  }
);


async function signIn() {

  const email =
    emailInput.value.trim();


  if (!email) {

    setLoginMessage(
      "❌ Enter your email."
    );

    return;

  }


  if (
    !email.includes("@")
  ) {

    setLoginMessage(
      "❌ Enter a valid email."
    );

    return;

  }


  signInButton.disabled =
    true;

  signInButton.textContent =
    "SENDING...";

  setLoginMessage(
    "📨 Sending sign-in link..."
  );


  try {

    const {
      error
    } =
      await supabase.auth.signInWithOtp({

        email,

        options: {

          emailRedirectTo:
            window.location.href

        }

      });


    if (error) {

      console.error(
        "Supabase sign in:",
        error
      );

      setLoginMessage(
        "❌ " + error.message
      );

      signInButton.disabled =
        false;

      signInButton.textContent =
        "SIGN IN";

      return;

    }


    setLoginMessage(
      "✅ Check your email. Tap the sign-in link."
    );

    signInButton.textContent =
      "EMAIL SENT";

  }
  catch(error) {

    console.error(error);

    setLoginMessage(
      "❌ Sign in failed."
    );

    signInButton.disabled =
      false;

    signInButton.textContent =
      "SIGN IN";

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabase.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    console.log(
      "AUTH:",
      event
    );


    if (
      session &&
      (
        event === "SIGNED_IN" ||
        event === "INITIAL_SESSION"
      )
    ) {

      currentUser =
        session.user;

      loginScreen.style.display =
        "none";

      startAfterLogin();

    }


    if (
      event === "SIGNED_OUT"
    ) {

      currentUser =
        null;

      location.reload();

    }

  }
);


/* =========================================================
   INITIAL AUTH CHECK
========================================================= */

async function checkSession() {

  try {

    setLoginMessage(
      "Checking account..."
    );


    const {
      data,
      error
    } =
      await supabase.auth.getSession();


    if (error) {

      console.error(error);

      setLoginMessage(
        "❌ Couldn't check account."
      );

      return;

    }


    if (
      data.session
    ) {

      currentUser =
        data.session.user;

      loginScreen.style.display =
        "none";

      startAfterLogin();

      return;

    }


    loginScreen.style.display =
      "flex";

    setLoginMessage("");

  }
  catch(error) {

    console.error(error);

    loginScreen.style.display =
      "flex";

  }

}


/* =========================================================
   AFTER LOGIN
========================================================= */

async function startAfterLogin() {

  if (
    gameStarted
  ) {

    return;

  }


  gameStarted =
    true;


  try {

    loading(
      "Loading player...",
      15
    );

    await loadPlayer();


    modeScreen.style.display =
      "flex";


    loadingScreen.style.display =
      "none";


  }
  catch(error) {

    console.error(
      "Player error:",
      error
    );

    /*
     * If the players row doesn't exist yet,
     * create it automatically.
     */

    await createPlayer();

    modeScreen.style.display =
      "flex";

  }

}


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer() {

  if (
    !currentUser
  ) {

    return;

  }


  const {
    data,
    error
  } =
    await supabase

      .from("players")

      .select("*")

      .eq(
        "id",
        currentUser.id
      )

      .maybeSingle();


  if (error) {

    throw error;

  }


  if (!data) {

    await createPlayer();

    return;

  }


  playerData =
    data;


  normalizePlayer();

  updateCoinDisplay();

}


async function createPlayer() {

  if (
    !currentUser
  ) {

    return;

  }


  const newPlayer = {

    id:
      currentUser.id,

    username:
      currentUser.email
        ? currentUser.email.split("@")[0]
        : null,

    coins:0,

    xp:0,

    level:1,

    unlocked_skins:["blue"],

    equipped_skin:"blue",

    collected_coins:[],

    created_at:
      new Date().toISOString(),

    updated_at:
      new Date().toISOString()

  };


  const {
    data,
    error
  } =
    await supabase

      .from("players")

      .insert(
        newPlayer
      )

      .select()

      .single();


  if (error) {

    /*
     * If it already exists because of
     * a race condition, try loading it.
     */

    console.error(
      "Create player:",
      error
    );


    const result =
      await supabase

        .from("players")

        .select("*")

        .eq(
          "id",
          currentUser.id
        )

        .maybeSingle();


    if (
      result.data
    ) {

      playerData =
        result.data;

      normalizePlayer();

      updateCoinDisplay();

      return;

    }


    throw error;

  }


  playerData =
    data;

  normalizePlayer();

  updateCoinDisplay();

}


function normalizePlayer() {

  if (!playerData) {
    return;
  }


  if (
    !Array.isArray(
      playerData.unlocked_skins
    )
  ) {

    playerData.unlocked_skins =
      ["blue"];

  }


  if (
    !Array.isArray(
      playerData.collected_coins
    )
  ) {

    playerData.collected_coins =
      [];

  }


  if (
    !playerData.equipped_skin ||
    !SKINS[
      playerData.equipped_skin
    ]
  ) {

    playerData.equipped_skin =
      "blue";

  }


  if (
    typeof playerData.coins !==
    "number"
  ) {

    playerData.coins =
      0;

  }


  if (
    typeof playerData.xp !==
    "number"
  ) {

    playerData.xp =
      0;

  }


  if (
    typeof playerData.level !==
    "number"
  ) {

    playerData.level =
      1;

  }

}


/* =========================================================
   SAVE
========================================================= */

async function savePlayer() {

  if (
    !playerData
  ) {

    return false;

  }


  playerData.updated_at =
    new Date().toISOString();


  const {
    error
  } =
    await supabase

      .from("players")

      .update({

        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        unlocked_skins:
          playerData.unlocked_skins,

        equipped_skin:
          playerData.equipped_skin,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          playerData.updated_at

      })

      .eq(
        "id",
        playerData.id
      );


  if (error) {

    console.error(
      "Save:",
      error
    );

    showToast(
      "⚠️ Couldn't save"
    );

    return false;

  }


  return true;

}

  );

/* =========================================================
   GPS
========================================================= */

function startGPS() {

  if (
    gpsStarted
  ) {

    return;

  }


  gpsStarted =
    true;


  if (
    !navigator.geolocation
  ) {

    setStatus(
      "❌ GPS isn't available on this device."
    );

    loading(
      "GPS unavailable.",
      100
    );

    return;

  }


  /*
   * This call immediately triggers the
   * browser's location permission prompt.
   */

  navigator.geolocation.getCurrentPosition(

    position => {

      handleLocation(
        position
      );

      beginWatching();

    },

    error => {

      locationError(
        error
      );

      /*
       * Still start watchPosition so the
       * phone can recover if GPS becomes
       * available.
       */

      beginWatching();

    },

    {

      enableHighAccuracy:true,

      timeout:20000,

      maximumAge:0

    }

  );

}


function beginWatching() {

  if (
    gpsWatch !== null
  ) {

    return;

  }


  gpsWatch =
    navigator.geolocation.watchPosition(

      position => {

        handleLocation(
          position
        );

      },

      error => {

        locationError(
          error
        );

      },

      {

        enableHighAccuracy:true,

        maximumAge:3000,

        timeout:15000

      }

    );

}


/* =========================================================
   LOCATION
========================================================= */

function handleLocation(
  position
) {

  const latitude =
    position.coords.latitude;

  const longitude =
    position.coords.longitude;


  const accuracy =
    position.coords.accuracy;


  currentLatitude =
    latitude;

  currentLongitude =
    longitude;


  loading(
    "GPS acquired!",
    25
  );


  /*
   * Start map immediately.
   */

  if (!map) {

    startMap(
      latitude,
      longitude
    );

  }
  else {

    updatePlayerMarker(
      latitude,
      longitude
    );

  }


  checkCoinCollection(
    latitude,
    longitude
  );


  /*
   * Find road constantly.
   * This is deliberately separate from
   * trail generation.
   */

  findNearestRoad(
    latitude,
    longitude
  );


  /*
   * Generate/refresh coins before the
   * player reaches the road.
   */

  const shouldRefresh =
    lastTrailLatitude === null ||
    lastTrailLongitude === null ||
    distanceMeters(
      lastTrailLatitude,
      lastTrailLongitude,
      latitude,
      longitude
    ) >= TRAIL_REFRESH_DISTANCE;


  if (
    shouldRefresh
  ) {

    lastTrailLatitude =
      latitude;

    lastTrailLongitude =
      longitude;

    loadTrail(
      latitude,
      longitude
    );

  }


  if (
    accuracy > 100
  ) {

    setStatus(
      `📍 GPS accuracy ~${Math.round(accuracy)}m`
    );

  }

}


/* =========================================================
   MAP
========================================================= */

function startMap(
  latitude,
  longitude
) {

  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    ).setView(
      [
        latitude,
        longitude
      ],
      17
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

      maxZoom:20,

      attribution:
        "© OpenStreetMap contributors"

    }
  ).addTo(map);


  createPlayer(
    latitude,
    longitude
  );


  loading(
    "Finding nearby roads...",
    35
  );


  setStatus(
    "🗺️ Finding nearby road..."
  );


  loadTrail(
    latitude,
    longitude
  );

}


function createPlayer(
  latitude,
  longitude
) {

  if (!map) {
    return;
  }


  if (
    playerMarker
  ) {

    playerMarker.setLatLng(
      [
        latitude,
        longitude
      ]
    );

    return;

  }


  playerMarker =
    L.marker(
      [
        latitude,
        longitude
      ],
      {
        icon:createPlayerIcon(
          getCurrentSkin().color
        ),
        zIndexOffset:10000
      }
    ).addTo(map);

}


function updatePlayerMarker(
  latitude,
  longitude
) {

  if (
    !playerMarker
  ) {

    createPlayer(
      latitude,
      longitude
    );

    return;

  }


  playerMarker.setLatLng(
    [
      latitude,
      longitude
    ]
  );

}


function createPlayerIcon(
  color
) {

  return L.divIcon({

    className:"",

    html:
      `<div class="player"
       style="--player-color:${color}">
       </div>`,

    iconSize:
      [28,28],

    iconAnchor:
      [14,14]

  });

}


function getCurrentSkin() {

  if (
    !playerData
  ) {

    return SKINS.blue;

  }


  return (
    SKINS[
      playerData.equipped_skin
    ] ||
    SKINS.blue
  );

}


/* =========================================================
   NEAREST ROAD
========================================================= */

async function findNearestRoad(
  latitude,
  longitude
) {

  /*
   * We already have ways loaded from
   * loadTrail. Use those first.
   */

  if (
    window.nearbyWays &&
    window.nearbyWays.length
  ) {

    const nearest =
      findClosestNetworkPoint(
        window.nearbyWays,
        latitude,
        longitude
      );


    if (
      nearest
    ) {

      currentNearestWay =
        nearest.way;

      currentNearestPoint =
        nearest;


      updateRoadInfo(
        nearest
      );

      return;

    }

  }

}


/* =========================================================
   ROAD INFO
========================================================= */

function updateRoadInfo(
  nearest
) {

  if (
    !nearest
  ) {

    return;

  }


  const tags =
    nearest.way.tags ||
    {};


  const name =
    tags.name ||
    readableHighway(
      tags.highway
    ) ||
    "Nearby path";


  roadNameElement.textContent =
    "🛣️ " + name;


  const distance =
    Math.round(
      nearest.distance
    );


  if (
    distance <= 10
  ) {

    roadDistanceElement.textContent =
      "You're on/very close to this road";

  }
  else {

    roadDistanceElement.textContent =
      `${distance}m away`;

  }

}


function readableHighway(
  highway
) {

  const names = {

    footway:"Footpath",

    path:"Path",

    pedestrian:"Pedestrian path",

    cycleway:"Cycle path",

    residential:"Residential road",

    living_street:"Living street",

    service:"Service road",

    unclassified:"Road",

    secondary:"Road",

    tertiary:"Road",

    bridleway:"Bridleway",

    steps:"Steps"

  };


  return names[
    highway
  ] || "Mapped road";

}


/* =========================================================
   TRAIL LOADING
========================================================= */

async function loadTrail(
  latitude,
  longitude
) {

  if (
    loadingTrail ||
    !map
  ) {

    return;

  }


  loadingTrail =
    true;


  setStatus(
    "🗺️ Searching nearby connected roads..."
  );


  try {

    const ways =
      await getNearbyWays(
        latitude,
        longitude
      );


    window.nearbyWays =
      ways;


    if (
      !ways.length
    ) {

      setStatus(
        "🔎 No mapped roads found nearby."
      );

      loadingTrail =
        false;

      return;

    }


    const start =
      findClosestNetworkPoint(
        ways,
        latitude,
        longitude
      );


    if (
      !start
    ) {

      loadingTrail =
        false;

      return;

    }


    currentNearestWay =
      start.way;

    currentNearestPoint =
      start;


    updateRoadInfo(
      start
    );


    if (
      start.distance >
      MAX_PATH_DISTANCE
    ) {

      setStatus(
        `🛣️ Nearest mapped road is ${Math.round(start.distance)}m away`
      );

      loadingTrail =
        false;

      return;

    }


    /*
     * IMPORTANT:
     *
     * Instead of choosing a random nearby
     * way, trace from the exact nearest way.
     */

    const network =
      buildConnectedNetwork(
        ways,
        start
      );


    if (
      network.length === 0
    ) {

      setStatus(
        "🔎 Found a road but couldn't trace it yet."
      );

      loadingTrail =
        false;

      return;

    }


    /*
     * Generate coins along the connected
     * network.
     */

    let generated = 0;


    for (
      const point of network
    ) {

      if (
        generated >=
        MAIN_COINS
      ) {

        break;

      }


      if (
        distanceMeters(
          start.point.lat,
          start.point.lon,
          point.lat,
          point.lon
        ) < 15
      ) {

        continue;

      }


      const before =
        coins.length;


      createCoin(
        point.lat,
        point.lon
      );


      if (
        coins.length >
        before
      ) {

        generated++;

      }

    }


    /*
     * Find a branch connected to the
     * SAME network, not a random nearby road.
     */

    const branch =
      findConnectedBranch(
        ways,
        start,
        network
      );


    for (
      const point of branch
    ) {

      createCoin(
        point.lat,
        point.lon
      );

    }


    loading(
      "Coins loaded!",
      100
    );


    loadingScreen.classList.add(
      "hidden"
    );


    setStatus(
      `🪙 ${coins.filter(c => !c.collected).length} coins along your road`
    );


  }
  catch(error) {

    console.error(
      "TRAIL ERROR:",
      error
    );

    setStatus(
      "⚠️ Road search failed. Retrying..."
    );

  }


  loadingTrail =
    false;

}


/* =========================================================
   OVERPASS
========================================================= */

async function getNearbyWays(
  latitude,
  longitude
) {

  const latOffset =
    SEARCH_RADIUS / 111320;


  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        latitude *
        Math.PI /
        180
      )
    );


  const south =
    latitude -
    latOffset;

  const north =
    latitude +
    latOffset;

  const west =
    longitude -
    lonOffset;

  const east =
    longitude +
    lonOffset;


  /*
   * Only request useful ways.
   * This makes Overpass considerably
   * lighter than asking for every highway.
   */

  let highwayFilter;


  if (
    gameMode === "PUBLIC"
  ) {

    highwayFilter = `

      ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|unclassified|service|tertiary|secondary"]

    `;

  }
  else {

    highwayFilter = `

      ["highway"]

    `;

  }


  const query = `

    [out:json]
    [timeout:12];

    way
      ${highwayFilter}
      (${south},${west},${north},${east});

    out tags geom;

  `;


  for (
    const server of
    OVERPASS_SERVERS
  ) {

    try {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () => controller.abort(),
          14000
        );


      const response =
        await fetch(
          server,
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(
                query
              ),

            signal:
              controller.signal

          }
        );


      clearTimeout(
        timeout
      );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      const ways =
        filterWays(
          data.elements || []
        );


      if (
        ways.length
      ) {

        return ways;

      }

    }
    catch(error) {

      console.warn(
        "Overpass failed:",
        server,
        error
      );

    }

  }


  return [];

}


/* =========================================================
   FILTER WAYS
========================================================= */

function filterWays(
  elements
) {

  const result = [];


  for (
    const element of
    elements
  ) {

    if (
      element.type !==
      "way"
    ) {

      continue;

    }


    if (
      !element.geometry ||
      element.geometry.length < 2
    ) {

      continue;

    }


    const tags =
      element.tags ||
      {};


    const highway =
      tags.highway;


    if (
      !highway
    ) {

      continue;

    }


    const access =
      String(
        tags.access ||
        ""
      ).toLowerCase();


    if (
      access === "private" ||
      access === "no" ||
      access === "permit" ||
      access === "customers"
    ) {

      continue;

    }


    if (
      gameMode === "PUBLIC"
    ) {

      const allowed = [

        "footway",
        "path",
        "pedestrian",
        "steps",
        "cycleway",
        "bridleway",
        "living_street",
        "residential",
        "unclassified",
        "service",
        "tertiary",
        "secondary"

      ];


      if (
        !allowed.includes(
          highway
        )
      ) {

        continue;

      }

    }


    if (
      gameMode === "UNLIMITED"
    ) {

      const forbidden = [

        "motorway",
        "motorway_link",
        "trunk",
        "trunk_link",
        "primary",
        "primary_link"

      ];


      if (
        forbidden.includes(
          highway
        )
      ) {

        continue;

      }

    }


    result.push({

      id:
        Number(
          element.id
        ),

      geometry:
        element.geometry,

      tags

    });

  }


  return result;

}


/* =========================================================
   CLOSEST NETWORK POINT
========================================================= */

function findClosestNetworkPoint(
  ways,
  latitude,
  longitude
) {

  let best =
    null;


  for (
    const way of
    ways
  ) {

    /*
     * Check every geometry point.
     * This is more reliable than checking
     * only the endpoints.
     */

    for (
      let i = 0;
      i < way.geometry.length;
      i++
    ) {

      const point =
        way.geometry[i];


      const distance =
        distanceMeters(
          latitude,
          longitude,
          point.lat,
          point.lon
        );


      if (
        !best ||
        distance <
        best.distance
      ) {

        best = {

          way,

          index:i,

          distance,

          point

        };

      }

    }

  }


  return best;

}


/* =========================================================
   CONNECTED NETWORK
========================================================= */

function buildConnectedNetwork(
  ways,
  start
) {

  const route = [];


  let way =
    start.way;

  let index =
    start.index;


  let direction =
    index <
    way.geometry.length - 1
      ? 1
      : -1;


  let lastPoint =
    way.geometry[index];


  let spacing =
    0;


  const visited =
    new Set();


  /*
   * Trace multiple connected ways.
   */

  for (
    let safety = 0;
    safety < 1000 &&
    route.length < 100;
    safety++
  ) {

    const key =
      way.id +
      ":" +
      index +
      ":" +
      direction;


    if (
      visited.has(key)
    ) {

      break;

    }


    visited.add(key);


    const nextIndex =
      index +
      direction;


    if (
      nextIndex < 0 ||
      nextIndex >=
      way.geometry.length
    ) {

      const endpoint =
        way.geometry[
          direction === 1
            ? way.geometry.length - 1
            : 0
        ];


      const next =
        findConnectedWayStrict(
          ways,
          endpoint,
          way.id,
          visited
        );


      if (
        !next
      ) {

        break;

      }


      way =
        next.way;

      index =
        next.index;

      direction =
        next.direction;

      lastPoint =
        way.geometry[index];

      continue;

    }


    const point =
      way.geometry[
        nextIndex
      ];


    const segment =
      distanceMeters(
        lastPoint.lat,
        lastPoint.lon,
        point.lat,
        point.lon
      );


    spacing +=
      segment;


    if (
      spacing >=
      COIN_SPACING
    ) {

      route.push({

        lat:
          point.lat,

        lon:
          point.lon

      });


      spacing =
        0;

    }


    lastPoint =
      point;

    index =
      nextIndex;

  }


  return route;

}


/* =========================================================
   STRICT CONNECTED WAY
========================================================= */

function findConnectedWayStrict(
  ways,
  endpoint,
  currentWayId,
  visited
) {

  let best =
    null;

  let bestDistance =
    CONNECT_DISTANCE;


  for (
    const way of
    ways
  ) {

    if (
      way.id ===
      currentWayId
    ) {

      continue;

    }


    const keyA =
      way.id +
      ":0:1";

    const keyB =
      way.id +
      ":" +
      (
        way.geometry.length - 1
      ) +
      ":-1";


    if (
      visited.has(keyA) &&
      visited.has(keyB)
    ) {

      continue;

    }


    const first =
      way.geometry[0];

    const last =
      way.geometry[
        way.geometry.length - 1
      ];


    const firstDistance =
      distanceMeters(
        endpoint.lat,
        endpoint.lon,
        first.lat,
        first.lon
      );


    const lastDistance =
      distanceMeters(
        endpoint.lat,
        endpoint.lon,
        last.lat,
        last.lon
      );


    if (
      firstDistance <=
      bestDistance
    ) {

      best = {

        way,

        index:0,

        direction:1

      };

      bestDistance =
        firstDistance;

    }


    if (
      lastDistance <=
      bestDistance
    ) {

      best = {

        way,

        index:
          way.geometry.length - 1,

        direction:-1

      };

      bestDistance =
        lastDistance;

    }

  }


  return best;

}


/* =========================================================
   BRANCH
========================================================= */

function findConnectedBranch(
  ways,
  start,
  mainNetwork
) {

  /*
   * Look for an actual connected branch.
   * It must touch a point of the traced
   * network — not merely be nearby.
   */

  for (
    const routePoint of
    mainNetwork
  ) {

    for (
      const way of
      ways
    ) {

      if (
        way.id ===
        start.way.id
      ) {

        continue;

      }


      const first =
        way.geometry[0];

      const last =
        way.geometry[
          way.geometry.length - 1
        ];


      const firstDistance =
        distanceMeters(
          routePoint.lat,
          routePoint.lon,
          first.lat,
          first.lon
        );


      const lastDistance =
        distanceMeters(
          routePoint.lat,
          routePoint.lon,
          last.lat,
          last.lon
        );


      if (
        firstDistance <=
        CONNECT_DISTANCE
      ) {

        return buildBranch(
          way,
          0,
          1
        );

      }


      if (
        lastDistance <=
        CONNECT_DISTANCE
      ) {

        return buildBranch(
          way,
          way.geometry.length - 1,
          -1
        );

      }

    }

  }


  return [];

}


/* =========================================================
   BUILD BRANCH
========================================================= */

function buildBranch(
  way,
  startIndex,
  direction
) {

  const result = [];

  let spacing = 0;

  let last =
    way.geometry[
      startIndex
    ];


  for (
    let step = 1;
    step < way.geometry.length;
    step++
  ) {

    const index =
      startIndex +
      step *
      direction;


    if (
      index < 0 ||
      index >=
      way.geometry.length
    ) {

      break;

    }


    const point =
      way.geometry[index];


    spacing +=
      distanceMeters(
        last.lat,
        last.lon,
        point.lat,
        point.lon
      );


    if (
      spacing >=
      COIN_SPACING
    ) {

      result.push({

        lat:
          point.lat,

        lon:
          point.lon

      });


      spacing =
        0;

    }


    last =
      point;


    if (
      result.length >=
      BRANCH_COINS
    ) {

      break;

    }

  }


  return result;

}


/* =========================================================
   COINS
========================================================= */

function createCoin(
  latitude,
  longitude
) {

  if (
    !map ||
    !playerData
  ) {

    return;

  }


  const id =
    makeCoinId(
      latitude,
      longitude
    );


  /*
   * Never recreate permanently
   * collected coins.
   */

  if (
    playerData.collected_coins.includes(
      id
    )
  ) {

    return;

  }


  /*
   * Don't stack coins.
   */

  for (
    const existing of
    coins
  ) {

    if (
      distanceMeters(
        latitude,
        longitude,
        existing.latitude,
        existing.longitude
      ) < 25
    ) {

      return;

    }

  }


  const marker =
    L.marker(
      [
        latitude,
        longitude
      ],
      {

        icon:
          L.divIcon({

            className:"",

            html:
              `<div class="coin">🪙</div>`,

            iconSize:
              [34,34],

            iconAnchor:
              [17,17]

          }),

        zIndexOffset:500

      }
    ).addTo(map);


  coins.push({

    id,

    marker,

    latitude,

    longitude,

    collected:false

  });

}


function makeCoinId(
  latitude,
  longitude
) {

  return (

    Math.round(
      latitude * 100000
    ) +

    "_" +

    Math.round(
      longitude * 100000
    )

  );

}


/* =========================================================
   COLLECTION
========================================================= */

function checkCoinCollection(
  latitude,
  longitude
) {

  for (
    const coin of
    coins
  ) {

    if (
      coin.collected
    ) {

      continue;

    }


    const distance =
      distanceMeters(
        latitude,
        longitude,
        coin.latitude,
        coin.longitude
      );


    if (
      distance <=
      COLLECTION_DISTANCE
    ) {

      collectCoin(
        coin
      );

    }

  }

}


async function collectCoin(
  coin
) {

  if (
    !playerData ||
    coin.collected
  ) {

    return;

  }


  coin.collected =
    true;


  if (
    map &&
    map.hasLayer(
      coin.marker
    )
  ) {

    map.removeLayer(
      coin.marker
    );

  }


  if (
    !playerData.collected_coins.includes(
      coin.id
    )
  ) {

    playerData.collected_coins.push(
      coin.id
    );

  }


  playerData.coins +=
    10;

  playerData.xp +=
    10;


  checkLevel();

  updateCoinDisplay();


  showToast(
    "🪙 COIN COLLECTED! +10"
  );


  setStatus(
    "🎮 Keep exploring!"
  );


  await savePlayer();

}


function checkLevel() {

  if (
    !playerData
  ) {

    return;

  }


  let leveled =
    false;


  while (
    playerData.xp >=
    playerData.level * 100
  ) {

    playerData.xp -=
      playerData.level * 100;

    playerData.level++;

    leveled =
      true;

  }


  if (
    leveled
  ) {

    showToast(
      `🎉 LEVEL ${playerData.level}!`
    );

  }

}


/* =========================================================
   DISPLAY
========================================================= */

function updateCoinDisplay() {

  if (
    !playerData
  ) {

    coinsDisplay.textContent =
      "🪙 Coins: 0";

    return;

  }


  coinsDisplay.textContent =
    `🪙 Coins: ${playerData.coins}`;

}

document
  .getElementById(
    "shopButton"
  )

function openShop() {

  shopOverlay.style.display =
    "block";

  renderShop();

}


function closeShop() {

  shopOverlay.style.display =
    "none";

}


function renderShop() {

  if (
    !playerData
  ) {

    return;

  }


  shopBalance.textContent =
    `🪙 Coins: ${playerData.coins}`;


  shopItems.innerHTML =
    "";


  Object.entries(
    SKINS
  ).forEach(
    ([id,skin]) => {

      const unlocked =
        playerData.unlocked_skins.includes(
          id
        );


      const equipped =
        playerData.equipped_skin ===
        id;


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "shopItem";


      const preview =
        document.createElement(
          "div"
        );


      preview.className =
        "skinPreview";

      preview.style.background =
        skin.color;

      preview.style.color =
        skin.color;


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "skinInfo";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "skinName";

      name.textContent =
        skin.name;


      const price =
        document.createElement(
          "div"
        );


      price.className =
        "skinPrice";

      price.textContent =
        skin.price === 0
          ? "FREE"
          : `🪙 ${skin.price}`;


      info.appendChild(
        name
      );

      info.appendChild(
        price
      );


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "shopAction";


      if (
        equipped
      ) {

        button.textContent =
          "EQUIPPED";

        button.disabled =
          true;

      }
      else if (
        unlocked
      ) {

        button.textContent =
          "EQUIP";

        button.onclick =
          () => equipSkin(id);

      }
      else if (
        playerData.coins >=
        skin.price
      ) {

        button.textContent =
          "BUY";

        button.onclick =
          () => buySkin(id);

      }
      else {

        button.textContent =
          "NEED COINS";

        button.disabled =
          true;

      }


      item.appendChild(
        preview
      );

      item.appendChild(
        info
      );

      item.appendChild(
        button
      );


      shopItems.appendChild(
        item
      );

    }
  );

}


async function buySkin(
  id
) {

  if (
    !playerData
  ) {

    return;

  }


  const skin =
    SKINS[id];


  if (
    !skin ||
    playerData.unlocked_skins.includes(id)
  ) {

    return;

  }


  if (
    playerData.coins <
    skin.price
  ) {

    showToast(
      "❌ Not enough coins"
    );

    return;

  }


  playerData.coins -=
    skin.price;


  playerData.unlocked_skins.push(
    id
  );


  playerData.equipped_skin =
    id;


  await savePlayer();


  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();


  showToast(
    `🎨 ${skin.name} unlocked!`
  );

}


async function equipSkin(
  id
) {

  if (
    !playerData ||
    !playerData.unlocked_skins.includes(id)
  ) {

    return;

  }


  playerData.equipped_skin =
    id;


  await savePlayer();


  updatePlayerSkin();

  renderShop();


  showToast(
    `🎨 ${SKINS[id].name} equipped!`
  );

}


function updatePlayerSkin() {

  if (
    !playerMarker
  ) {

    return;

  }


  playerMarker.setIcon(
    createPlayerIcon(
      getCurrentSkin().color
    )
  );

}

/* =========================================================
   GPS ERRORS
========================================================= */

function locationError(
  error
) {

  console.error(
    "GPS:",
    error
  );


  if (
    error.code ===
    1
  ) {

    setStatus(
      "📍 Location permission denied. Enable Location for this site."
    );

    loading(
      "Location permission required.",
      100
    );

  }
  else if (
    error.code ===
    2
  ) {

    setStatus(
      "📍 Location unavailable. Trying again..."
    );

  }
  else if (
    error.code ===
    3
  ) {

    setStatus(
      "📍 GPS timed out. Trying again..."
    );

  }
  else {

    setStatus(
      "📍 Couldn't get your location."
    );

  }

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}
