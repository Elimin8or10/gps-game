<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* =========================
       AUTH SCREEN
       ========================= */

    #authScreen {
      position: fixed;
      inset: 0;
      z-index: 10000;

      background: #111;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
      box-sizing: border-box;

      font-family: Arial, sans-serif;
    }

    #authBox {
      width: 100%;
      max-width: 400px;

      background: #181e24;
      color: white;

      padding: 25px;
      box-sizing: border-box;

      border-radius: 20px;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.7);
    }

    #authBox h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
    }

    #authSubtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .authInput {
      width: 100%;
      box-sizing: border-box;

      padding: 13px;

      margin-bottom: 12px;

      border: none;
      border-radius: 10px;

      background: #252c34;
      color: white;

      font-size: 16px;
    }

    .authInput:focus {
      outline: 2px solid #0077cc;
    }

    .authButton {
      width: 100%;

      padding: 13px;

      border: none;
      border-radius: 10px;

      background: #0077cc;
      color: white;

      font-weight: bold;
      font-size: 16px;

      cursor: pointer;

      margin-top: 5px;
    }

    .authButton:disabled {
      opacity: 0.5;
    }

    #authSwitch {
      text-align: center;
      margin-top: 18px;
      color: #aaa;
    }

    #authSwitchButton {
      background: none;
      border: none;
      color: #33aaff;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    #authMessage {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      color: #ff7777;
    }


    /* =========================
       HUD
       ========================= */

    #hud {
      position: absolute;

      top: 15px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      display: flex;
      gap: 8px;

      font-family: Arial, sans-serif;
    }

    .hudBox {
      background: rgba(10,15,20,0.95);

      color: white;

      padding: 10px 12px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.4);

      font-weight: bold;
    }

    #coinsDisplay {
      flex: 1;
    }

    #modeButton,
    #shopButton,
    #accountButton {
      cursor: pointer;
      user-select: none;
    }


    /* =========================
       STATUS
       ========================= */

    #status {
      position: absolute;

      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      background: rgba(10,15,20,0.95);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;
    }


    /* =========================
       PLAYER
       ========================= */

    .player {
      width: 22px;
      height: 22px;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px var(--player-color),
        0 0 18px var(--player-color),
        0 0 30px var(--player-color);

      background:
        var(--player-color);
    }


    /* =========================
       COINS
       ========================= */

    .coin {
      width: 28px;
      height: 28px;

      background: radial-gradient(
        circle at 35% 35%,
        #fffbd0 0%,
        #ffe44d 25%,
        #ffd000 55%,
        #f0a000 80%,
        #c87800 100%
      );

      border: 3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255,190,0,0.7);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;

      animation: coinPulse 1.4s infinite;
    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }


    /* =========================
       SHOP
       ========================= */

    #shopOverlay {

      display: none;

      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 2000;

      background:
        rgba(0,0,0,0.75);

      font-family: Arial, sans-serif;

      overflow-y: auto;

      padding: 20px;

      box-sizing: border-box;
    }

    #shop {

      max-width: 500px;

      margin:
        30px auto;

      background:
        #151a20;

      color: white;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.7);
    }

    #shopHeader {

      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-bottom: 20px;
    }

    #shopHeader h2 {
      margin: 0;
    }

    #closeShop {

      background:
        #333;

      color:
        white;

      border:
        none;

      border-radius:
        10px;

      padding:
        9px 13px;

      font-size:
        18px;

      cursor:
        pointer;
    }

    #shopBalance {

      background:
        rgba(255,215,0,0.12);

      border:
        1px solid
        rgba(255,215,0,0.4);

      border-radius:
        12px;

      padding:
        12px;

      text-align:
        center;

      margin-bottom:
        15px;

      font-weight:
        bold;
    }

    .shopItem {

      background:
        #20262d;

      border-radius:
        15px;

      padding:
        15px;

      margin-bottom:
        12px;

      display:
        flex;

      align-items:
        center;

      gap:
        15px;
    }

    .skinPreview {

      width:
        42px;

      height:
        42px;

      border:
        4px solid white;

      border-radius:
        50%;

      box-shadow:
        0 0 14px currentColor;

      flex-shrink:
        0;
    }

    .skinInfo {
      flex: 1;
    }

    .skinName {

      font-weight:
        bold;

      font-size:
        17px;

      margin-bottom:
        4px;
    }

    .skinPrice {

      color:
        #ffd700;

      font-size:
        14px;
    }

    .shopButton {

      border:
        none;

      border-radius:
        10px;

      padding:
        9px 12px;

      color:
        white;

      background:
        #0077cc;

      font-weight:
        bold;

      cursor:
        pointer;
    }

    .shopButton:disabled {

      opacity:
        0.5;

      cursor:
        default;
    }


    /* =========================
       ACCOUNT
       ========================= */

    #accountOverlay {

      display: none;

      position: absolute;

      inset: 0;

      z-index: 3000;

      background:
        rgba(0,0,0,0.75);

      padding: 20px;

      box-sizing: border-box;

      font-family: Arial, sans-serif;
    }

    #accountBox {

      max-width: 400px;

      margin: 50px auto;

      background: #151a20;

      color: white;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.7);
    }

    #accountBox h2 {
      margin-top: 0;
    }

    .accountInfo {

      background:
        #20262d;

      padding:
        12px;

      border-radius:
        12px;

      margin-bottom:
        12px;

      word-break:
        break-word;
    }

    #logoutButton {

      width: 100%;

      padding: 12px;

      border: none;

      border-radius: 10px;

      background: #cc3333;

      color: white;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;
    }

    #closeAccount {

      width: 100%;

      padding: 12px;

      border: none;

      border-radius: 10px;

      background: #333;

      color: white;

      font-weight: bold;

      cursor: pointer;

      margin-top: 8px;
    }

  </style>

</head>


<body>


  <!-- =========================
       AUTH
       ========================= -->

  <div id="authScreen">

    <div id="authBox">

      <h1>🪙 GPS Game</h1>

      <div id="authSubtitle">
        Create an account to save your progress.
      </div>

      <input
        id="emailInput"
        class="authInput"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="passwordInput"
        class="authInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <input
        id="usernameInput"
        class="authInput"
        type="text"
        placeholder="Username"
        autocomplete="username"
        style="display:none;"
      >

      <button
        id="authButton"
        class="authButton"
      >
        LOG IN
      </button>

      <div id="authSwitch">

        Don't have an account?

        <button id="authSwitchButton">
          Sign up
        </button>

      </div>

      <div id="authMessage"></div>

    </div>

  </div>


  <!-- =========================
       HUD
       ========================= -->

  <div id="hud">

    <div
      class="hudBox"
      id="coinsDisplay"
    >
      🪙 Coins: 0
    </div>

    <div
      class="hudBox"
      id="shopButton"
    >
      🛒 SHOP
    </div>

    <div
      class="hudBox"
      id="modeButton"
    >
      🌎 PUBLIC
    </div>

    <div
      class="hudBox"
      id="accountButton"
    >
      👤
    </div>

  </div>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="status">
    📍 Finding your location...
  </div>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <!-- =========================
       SHOP
       ========================= -->

  <div id="shopOverlay">

    <div id="shop">

      <div id="shopHeader">

        <h2>
          🛒 Player Shop
        </h2>

        <button id="closeShop">
          ✕
        </button>

      </div>

      <div id="shopBalance">
        🪙 Coins: 0
      </div>

      <div id="shopItems"></div>

    </div>

  </div>


  <!-- =========================
       ACCOUNT
       ========================= -->

  <div id="accountOverlay">

    <div id="accountBox">

      <h2>👤 Account</h2>

      <div class="accountInfo">
        <strong>Username</strong>
        <br>
        <span id="accountUsername">Loading...</span>
      </div>

      <div class="accountInfo">
        <strong>Email</strong>
        <br>
        <span id="accountEmail">Loading...</span>
      </div>

      <div class="accountInfo">
        <strong>Level</strong>
        <br>
        <span id="accountLevel">1</span>
      </div>

      <div class="accountInfo">
        <strong>XP</strong>
        <br>
        <span id="accountXP">0</span>
      </div>

      <button id="logoutButton">
        LOG OUT
      </button>

      <button id="closeAccount">
        CLOSE
      </button>

    </div>

  </div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <script>

    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://yrcitnuuskcbiuryyytu.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       PLAYER DATA
       ===================================================== */

    const DEFAULT_SAVE = {

      coins: 0,

      xp: 0,

      level: 1,

      unlockedSkins: [
        "blue"
      ],

      equippedSkin:
        "blue",

      collectedCoins: []

    };


    let save = {
      ...DEFAULT_SAVE
    };


    let currentUser =
      null;


    let playerData =
      null;


    /* =====================================================
       SKINS
       ===================================================== */

    const SKINS = {

      blue: {

        name:
          "Blue",

        color:
          "#00aaff",

        price:
          0

      },

      red: {

        name:
          "Red",

        color:
          "#ff3030",

        price:
          50

      },

      green: {

        name:
          "Green",

        color:
          "#22dd55",

        price:
          100

      },

      purple: {

        name:
          "Purple",

        color:
          "#aa55ff",

        price:
          150

      },

      gold: {

        name:
          "Gold",

        color:
          "#ffd000",

        price:
          250

      },

      pink: {

        name:
          "Pink",

        color:
          "#ff4fa3",

        price:
          350

      }

    };


    /* =====================================================
       AUTH STATE
       ===================================================== */

    let signupMode =
      false;


    const authScreen =
      document.getElementById(
        "authScreen"
      );


    const authButton =
      document.getElementById(
        "authButton"
      );


    const authSwitchButton =
      document.getElementById(
        "authSwitchButton"
      );


    const authMessage =
      document.getElementById(
        "authMessage"
      );


    const usernameInput =
      document.getElementById(
        "usernameInput"
      );


    function showAuthMessage(
      message,
      error = true
    ) {

      authMessage.innerText =
        message;

      authMessage.style.color =
        error
          ? "#ff7777"
          : "#55dd88";

    }


    authSwitchButton.addEventListener(
      "click",
      function() {

        signupMode =
          !signupMode;


        usernameInput.style.display =
          signupMode
            ? "block"
            : "none";


        authButton.innerText =
          signupMode
            ? "CREATE ACCOUNT"
            : "LOG IN";


        authSwitchButton.innerText =
          signupMode
            ? "Log in"
            : "Sign up";


        document.getElementById(
          "authSubtitle"
        ).innerText =
          signupMode
            ? "Create your GPS Game account."
            : "Log in to continue your game.";


        showAuthMessage(
          "",
          false
        );

      }
    );


    authButton.addEventListener(
      "click",
      handleAuth
    );


    async function handleAuth() {

      const email =
        document.getElementById(
          "emailInput"
        ).value.trim();


      const password =
        document.getElementById(
          "passwordInput"
        ).value;


      const username =
        usernameInput.value.trim();


      if (!email) {

        showAuthMessage(
          "Enter your email."
        );

        return;

      }


      if (password.length < 6) {

        showAuthMessage(
          "Password must be at least 6 characters."
        );

        return;

      }


      if (
        signupMode &&
        !username
      ) {

        showAuthMessage(
          "Choose a username."
        );

        return;

      }


      authButton.disabled =
        true;


      authButton.innerText =
        "PLEASE WAIT...";


      try {

        if (signupMode) {

          await signUp(
            email,
            password,
            username
          );

        } else {

          await logIn(
            email,
            password
          );

        }

      } catch (error) {

        console.error(
          error
        );

        showAuthMessage(
          error.message ||
          "Something went wrong."
        );

      }


      authButton.disabled =
        false;


      authButton.innerText =
        signupMode
          ? "CREATE ACCOUNT"
          : "LOG IN";

    }


    /* =====================================================
       SIGN UP
       ===================================================== */

    async function signUp(
      email,
      password,
      username
    ) {

      const result =
        await supabaseClient.auth.signUp({

          email:
            email,

          password:
            password,

          options: {

            data: {

              username:
                username

            }

          }

        });


      if (result.error) {

        throw result.error;

      }


      if (!result.data.user) {

        throw new Error(
          "Account could not be created."
        );

      }


      /*
        If email confirmation is enabled
        in Supabase, the user may need
        to confirm their email first.
      */

      if (!result.data.session) {

        showAuthMessage(
          "Account created! Check your email to confirm your account.",
          false
        );

        return;

      }


      await loadPlayer(
        result.data.user
      );

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    async function logIn(
      email,
      password
    ) {

      const result =
        await supabaseClient.auth.signInWithPassword({

          email:
            email,

          password:
            password

        });


      if (result.error) {

        throw result.error;

      }


      await loadPlayer(
        result.data.user
      );

    }


    /* =====================================================
       LOAD PLAYER
       ===================================================== */

    async function loadPlayer(
      user
    ) {

      currentUser =
        user;


      setStatus(
        "☁️ Loading your account..."
      );


      const result =
        await supabaseClient
          .from("players")
          .select("*")
          .eq(
            "id",
            user.id
          )
          .single();


      if (result.error) {

        console.error(
          result.error
        );


        /*
          The database trigger should
          normally create this row.
        */

        const username =
          user.user_metadata?.username ||
          "Player";


        const insertResult =
          await supabaseClient
            .from("players")
            .insert({

              id:
                user.id,

              username:
                username

            })
            .select()
            .single();


        if (insertResult.error) {

          throw insertResult.error;

        }


        playerData =
          insertResult.data;

      } else {

        playerData =
          result.data;

      }


      save = {

        coins:
          playerData.coins ?? 0,

        xp:
          playerData.xp ?? 0,

        level:
          playerData.level ?? 1,

        unlockedSkins:
          playerData.unlocked_skins || [
            "blue"
          ],

        equippedSkin:
          playerData.equipped_skin ||
          "blue",

        collectedCoins:
          playerData.collected_coins || []

      };


      updateCoinDisplay();


      authScreen.style.display =
        "none";


      updateAccountDisplay();


      setStatus(
        "📍 Finding your location..."
      );

    }


    /* =====================================================
       SAVE PLAYER TO SUPABASE
       ===================================================== */

    async function saveGame() {

      if (!currentUser) {

        return;

      }


      const update = {

        coins:
          save.coins,

        xp:
          save.xp,

        level:
          save.level,

        unlocked_skins:
          save.unlockedSkins,

        equipped_skin:
          save.equippedSkin,

        collected_coins:
          save.collectedCoins,

        updated_at:
          new Date().toISOString()

      };


      const result =
        await supabaseClient
          .from("players")
          .update(update)
          .eq(
            "id",
            currentUser.id
          );


      if (result.error) {

        console.error(
          "Could not save player:",
          result.error
        );

      }

    }


    /* =====================================================
       ACCOUNT
       ===================================================== */

    function updateAccountDisplay() {

      if (!currentUser) {
        return;
      }


      document.getElementById(
        "accountUsername"
      ).innerText =
        playerData?.username ||
        "Player";


      document.getElementById(
        "accountEmail"
      ).innerText =
        currentUser.email ||
        "";


      document.getElementById(
        "accountLevel"
      ).innerText =
        save.level;


      document.getElementById(
        "accountXP"
      ).innerText =
        save.xp;

    }


    document.getElementById(
      "accountButton"
    ).addEventListener(

      "click",

      function() {

        updateAccountDisplay();


        document.getElementById(
          "accountOverlay"
        ).style.display =
          "block";

      }

    );


    document.getElementById(
      "closeAccount"
    ).addEventListener(

      "click",

      function() {

        document.getElementById(
          "accountOverlay"
        ).style.display =
          "none";

      }

    );


    document.getElementById(
      "logoutButton"
    ).addEventListener(

      "click",

      async function() {

        await supabaseClient.auth.signOut();

        location.reload();

      }

    );


    /* =====================================================
       AUTH SESSION CHECK
       ===================================================== */

    async function checkSession() {

      const result =
        await supabaseClient.auth.getSession();


      if (result.error) {

        console.error(
          result.error
        );

        return;

      }


      const session =
        result.data.session;


      if (session?.user) {

        try {

          await loadPlayer(
            session.user
          );

        } catch (error) {

          console.error(
            error
          );

          showAuthMessage(
            "Couldn't load your player data."
          );

        }

      }

    }


    supabaseClient.auth.onAuthStateChange(

      async function(
        event,
        session
      ) {

        if (
          event ===
          "SIGNED_IN"
        ) {

          if (
            session?.user
          ) {

            try {

              await loadPlayer(
                session.user
              );

            } catch (error) {

              console.error(
                error
              );

            }

          }

        }

      }

    );


    /* =====================================================
       GAME VARIABLES
       ===================================================== */

    let map = null;

    let player = null;

    let coins = [];

    let gameMode =
      "PUBLIC";

    let currentLatitude =
      null;

    let currentLongitude =
      null;

    let loadingTrail =
      false;


    /* =====================================================
       SETTINGS
       ===================================================== */

    const SEARCH_RADIUS =
      800;

    const COIN_SPACING =
      65;

    const MAIN_COINS =
      5;

    const BRANCH_COINS =
      3;

    const COLLECTION_DISTANCE =
      15;

    const REFRESH_DISTANCE =
      200;


    const OVERPASS_SERVERS = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];


    /* =====================================================
       HUD
       ===================================================== */

    function updateCoinDisplay() {

      document.getElementById(
        "coinsDisplay"
      ).innerText =

        "🪙 Coins: " +
        save.coins;

    }


    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(
      latitude,
      longitude
    ) {

      if (map) {
        return;
      }


      map =
        L.map("map").setView(

          [
            latitude,
            longitude
          ],

          17

        );


      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

          attribution:
            "© OpenStreetMap contributors"

        }

      ).addTo(map);


      createPlayer(

        latitude,
        longitude

      );


      currentLatitude =
        latitude;

      currentLongitude =
        longitude;


      loadTrail(

        latitude,
        longitude

      );

    }


    /* =====================================================
       CREATE PLAYER
       ===================================================== */

    function createPlayer(
      latitude,
      longitude
    ) {

      const skin =
        SKINS[
          save.equippedSkin
        ] ||
        SKINS.blue;


      const playerIcon =
        L.divIcon({

          className: "",

          html:

            '<div class="player" ' +

            'style="--player-color:' +

            skin.color +

            '"></div>',

          iconSize:
            [28,28],

          iconAnchor:
            [14,14]

        });


      player =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              playerIcon
          }

        ).addTo(map);

    }


    /* =====================================================
       UPDATE PLAYER SKIN
       ===================================================== */

    function updatePlayerSkin() {

      if (!player) {
        return;
      }


      const skin =
        SKINS[
          save.equippedSkin
        ] ||
        SKINS.blue;


      const icon =
        L.divIcon({

          className: "",

          html:

            '<div class="player" ' +

            'style="--player-color:' +

            skin.color +

            '"></div>',

          iconSize:
            [28,28],

          iconAnchor:
            [14,14]

        });


      player.setIcon(
        icon
      );

    }


    /* =====================================================
       GPS
       ===================================================== */

    function updateLocation(
      position
    ) {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      if (!map) {

        startGame(

          latitude,
          longitude

        );

        return;

      }


      player.setLatLng([

        latitude,
        longitude

      ]);


      checkCoinCollection(

        latitude,
        longitude

      );


      if (

        currentLatitude !== null &&

        currentLongitude !== null

      ) {

        const distance =
          distanceMeters(

            currentLatitude,
            currentLongitude,

            latitude,
            longitude

          );


        if (
          distance >=
          REFRESH_DISTANCE
        ) {

          currentLatitude =
            latitude;

          currentLongitude =
            longitude;


          loadTrail(

            latitude,
            longitude

          );

        }

      }

    }


    /* =====================================================
       LOAD TRAIL
       ===================================================== */

    async function loadTrail(
      latitude,
      longitude
    ) {

      if (loadingTrail) {
        return;
      }


      loadingTrail =
        true;


      setStatus(
        "🗺️ Building a path..."
      );


      removeUncollectedCoins();


      const latOffset =
        SEARCH_RADIUS /
        111320;


      const lonOffset =

        SEARCH_RADIUS /

        (

          111320 *

          Math.cos(

            latitude *
            Math.PI /
            180

          )

        );


      const south =
        latitude -
        latOffset;


      const north =
        latitude +
        latOffset;


      const west =
        longitude -
        lonOffset;


      const east =
        longitude +
        lonOffset;


      const query = `

        [out:json]
        [timeout:20];

        way["highway"]
          (${south},${west},${north},${east});

        out tags geom;

      `;


      let data =
        null;


      for (

        let i = 0;

        i <
        OVERPASS_SERVERS.length;

        i++

      ) {

        try {

          const response =
            await fetch(

              OVERPASS_SERVERS[i],

              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/x-www-form-urlencoded"

                },

                body:
                  "data=" +
                  encodeURIComponent(
                    query
                  )

              }

            );


          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }


          data =
            await response.json();


          break;


        } catch (error) {

          console.log(
            "Overpass error:",
            error
          );

        }

      }


      if (!data) {

        setStatus(
          "⚠️ Couldn't load map data."
        );

        loadingTrail =
          false;

        return;

      }


      const ways =
        filterWays(
          data.elements
        );


      if (
        ways.length === 0
      ) {

        setStatus(

          gameMode === "PUBLIC"

            ? "🔎 No suitable public paths nearby."

            : "🔎 No mapped paths nearby."

        );

        loadingTrail =
          false;

        return;

      }


      const start =
        findClosestNetworkPoint(

          ways,

          latitude,
          longitude

        );


      if (!start) {

        setStatus(
          "🔎 Couldn't find a nearby path."
        );

        loadingTrail =
          false;

        return;

      }


      const mainRoute =
        buildNetworkRoute(

          ways,

          start,

          MAIN_COINS

        );


      const branchRoute =
        findNetworkBranch(

          ways,

          mainRoute,

          start

        );


      mainRoute.forEach(

        function(point) {

          createCoin(
            point.lat,
            point.lon
          );

        }

      );


      branchRoute.forEach(

        function(point) {

          createCoin(
            point.lat,
            point.lon
          );

        }

      );


      const total =
        mainRoute.length +
        branchRoute.length;


      setStatus(

        total > 0

          ? "🎮 " +
            total +
            " coins on real mapped paths"

          : "🔎 Path found, but it's too short."

      );


      loadingTrail =
        false;

    }


    /* =====================================================
       FILTER WAYS
       ===================================================== */

    function filterWays(
      elements
    ) {

      const result = [];


      elements.forEach(

        function(element) {

          if (
            element.type !==
            "way"
          ) {
            return;
          }


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {
            return;
          }


          const tags =
            element.tags || {};


          const highway =
            tags.highway;


          if (!highway) {
            return;
          }


          const access =
            String(
              tags.access || ""
            ).toLowerCase();


          if (
            gameMode ===
            "PUBLIC"
          ) {

            if (

              access === "private" ||
              access === "no" ||
              access === "permit" ||
              access === "customers"

            ) {
              return;
            }


            const allowed = [

              "footway",
              "path",
              "pedestrian",
              "steps",
              "cycleway",
              "bridleway",
              "living_street"

            ];


            if (
              !allowed.includes(
                highway
              )
            ) {
              return;
            }

          }


          if (
            gameMode ===
            "UNLIMITED"
          ) {

            const forbidden = [

              "motorway",
              "motorway_link",
              "trunk",
              "trunk_link",
              "primary",
              "primary_link"

            ];


            if (
              forbidden.includes(
                highway
              )
            ) {
              return;
            }

          }


          result.push({

            id:
              element.id,

            geometry:
              element.geometry,

            tags:
              tags

          });

        }

      );


      return result;

    }


    /* =====================================================
       CLOSEST NETWORK POINT
       ===================================================== */

    function findClosestNetworkPoint(
      ways,
      latitude,
      longitude
    ) {

      let best =
        null;


      ways.forEach(

        function(way) {

          way.geometry.forEach(

            function(point,index) {

              const distance =
                distanceMeters(

                  latitude,
                  longitude,

                  point.lat,
                  point.lon

                );


              if (

                best === null ||

                distance <
                best.distance

              ) {

                best = {

                  way:
                    way,

                  index:
                    index,

                  distance:
                    distance,

                  point:
                    point

                };

              }

            }

          );

        }

      );


      return best;

    }


    /* =====================================================
       BUILD NETWORK ROUTE
       ===================================================== */

    function buildNetworkRoute(
      ways,
      start,
      numberOfCoins
    ) {

      const route = [];


      const geometry =
        start.way.geometry;


      let direction =
        1;


      if (
        start.index >=
        geometry.length - 1
      ) {
        direction = -1;
      }


      let currentWay =
        start.way;


      let currentIndex =
        start.index;


      let currentDirection =
        direction;


      let accumulated =
        0;


      let lastPoint =
        start.point;


      const visited =
        new Set();


      while (
        route.length <
        numberOfCoins
      ) {

        const visitKey =

          currentWay.id +
          ":" +
          currentIndex +
          ":" +
          currentDirection;


        if (
          visited.has(
            visitKey
          )
        ) {
          break;
        }


        visited.add(
          visitKey
        );


        const nextIndex =

          currentIndex +
          currentDirection;


        if (

          nextIndex < 0 ||

          nextIndex >=
          currentWay.geometry.length

        ) {

          const endpoint =

            currentWay.geometry[

              currentDirection === 1

                ? currentWay.geometry.length - 1

                : 0

            ];


          const nextWay =
            findConnectedWay(

              ways,

              endpoint,

              currentWay.id

            );


          if (!nextWay) {
            break;
          }


          currentWay =
            nextWay.way;


          currentIndex =
            nextWay.index;


          currentDirection =
            nextWay.direction;


          continue;

        }


        const point =
          currentWay.geometry[
            nextIndex
          ];


        accumulated +=

          distanceMeters(

            lastPoint.lat,
            lastPoint.lon,

            point.lat,
            point.lon

          );


        if (
          accumulated >=
          COIN_SPACING
        ) {

          route.push({

            lat:
              point.lat,

            lon:
              point.lon

          });


          accumulated =
            0;

        }


        lastPoint =
          point;


        currentIndex =
          nextIndex;

      }


      return route;

    }


    /* =====================================================
       CONNECTED WAY
       ===================================================== */

    function findConnectedWay(
      ways,
      endpoint,
      currentWayId
    ) {

      let best =
        null;


      let bestDistance =
        30;


      ways.forEach(

        function(way) {

          if (
            way.id ===
            currentWayId
          ) {
            return;
          }


          const first =
            way.geometry[0];


          const last =
            way.geometry[
              way.geometry.length - 1
            ];


          const d1 =
            distanceMeters(

              endpoint.lat,
              endpoint.lon,

              first.lat,
              first.lon

            );


          const d2 =
            distanceMeters(

              endpoint.lat,
              endpoint.lon,

              last.lat,
              last.lon

            );


          if (
            d1 <=
            bestDistance
          ) {

            best = {

              way:
                way,

              index:
                0,

              direction:
                1

            };


            bestDistance =
              d1;

          }


          if (
            d2 <=
            bestDistance
          ) {

            best = {

              way:
                way,

              index:
                way.geometry.length - 1,

              direction:
                -1

            };


            bestDistance =
              d2;

          }

        }

      );


      return best;

    }


    /* =====================================================
       FIND BRANCH
       ===================================================== */

    function findNetworkBranch(
      ways,
      mainRoute,
      start
    ) {

      if (
        mainRoute.length <
        2
      ) {
        return [];
      }


      for (

        let r = 1;

        r <
        mainRoute.length;

        r++

      ) {

        const routePoint =
          mainRoute[r];


        for (

          let i = 0;

          i <
          ways.length;

          i++

        ) {

          const way =
            ways[i];


          if (
            way.id ===
            start.way.id
          ) {
            continue;
          }


          const first =
            way.geometry[0];


          const last =
            way.geometry[
              way.geometry.length - 1
            ];


          const firstDistance =
            distanceMeters(

              routePoint.lat,
              routePoint.lon,

              first.lat,
              first.lon

            );


          const lastDistance =
            distanceMeters(

              routePoint.lat,
              routePoint.lon,

              last.lat,
              last.lon

            );


          if (
            firstDistance <=
            30
          ) {

            return buildBranch(

              way,
              0,
              1

            );

          }


          if (
            lastDistance <=
            30
          ) {

            return buildBranch(

              way,

              way.geometry.length - 1,

              -1

            );

          }

        }

      }


      return [];

    }


    /* =====================================================
       BUILD BRANCH
       ===================================================== */

    function buildBranch(
      way,
      startIndex,
      direction
    ) {

      const result = [];


      let accumulated =
        0;


      let lastPoint =
        way.geometry[startIndex];


      for (

        let step = 1;

        step <
        way.geometry.length;

        step++

      ) {

        const index =

          startIndex +
          step *
          direction;


        if (

          index < 0 ||

          index >=
          way.geometry.length

        ) {
          break;
        }


        const point =
          way.geometry[index];


        accumulated +=

          distanceMeters(

            lastPoint.lat,
            lastPoint.lon,

            point.lat,
            point.lon

          );


        if (
          accumulated >=
          COIN_SPACING
        ) {

          result.push({

            lat:
              point.lat,

            lon:
              point.lon

          });


          accumulated =
            0;


          if (
            result.length >=
            BRANCH_COINS
          ) {
            break;
          }

        }


        lastPoint =
          point;

      }


      return result;

    }


    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(
      latitude,
      longitude
    ) {

      const id =
        makeCoinId(

          latitude,
          longitude

        );


      if (
        save.collectedCoins.includes(
          id
        )
      ) {
        return;
      }


      for (

        let i = 0;

        i <
        coins.length;

        i++

      ) {

        const existing =
          coins[i];


        if (

          distanceMeters(

            latitude,
            longitude,

            existing.latitude,
            existing.longitude

          ) < 20

        ) {
          return;
        }

      }


      const coinIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="coin">🪙</div>',

          iconSize:
            [34,34],

          iconAnchor:
            [17,17]

        });


      const marker =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              coinIcon
          }

        ).addTo(map);


      coins.push({

        id:
          id,

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }


    /* =====================================================
       COIN ID
       ===================================================== */

    function makeCoinId(
      latitude,
      longitude
    ) {

      return (

        Math.round(
          latitude * 100000
        ) +

        "_" +

        Math.round(
          longitude * 100000
        )

      );

    }


    /* =====================================================
       REMOVE UNCOLLECTED
       ===================================================== */

    function removeUncollectedCoins() {

      const remaining =
        [];


      coins.forEach(

        function(coin) {

          if (
            coin.collected
          ) {

            remaining.push(
              coin
            );

          } else {

            if (
              map.hasLayer(
                coin.marker
              )
            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }

      );


      coins =
        remaining;

    }


    /* =====================================================
       COLLECTION
       ===================================================== */

    function checkCoinCollection(
      latitude,
      longitude
    ) {

      coins.forEach(

        function(coin) {

          if (
            coin.collected
          ) {
            return;
          }


          const distance =
            distanceMeters(

              latitude,
              longitude,

              coin.latitude,
              coin.longitude

            );


          if (
            distance <=
            COLLECTION_DISTANCE
          ) {

            collectCoin(
              coin
            );

          }

        }

      );

    }


    /* =====================================================
       COLLECT COIN
       ===================================================== */

    async function collectCoin(
      coin
    ) {

      if (
        coin.collected
      ) {
        return;
      }


      coin.collected =
        true;


      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );

      }


      if (
        !save.collectedCoins.includes(
          coin.id
        )
      ) {

        save.collectedCoins.push(
          coin.id
        );

      }


      save.coins +=
        10;


      /*
        XP
      */

      save.xp +=
        10;


      /*
        Level up every
        100 XP.
      */

      const newLevel =
        Math.floor(
          save.xp / 100
        ) + 1;


      if (
        newLevel >
        save.level
      ) {

        save.level =
          newLevel;


        setStatus(
          "🎉 LEVEL UP! Level " +
          save.level
        );

      } else {

        setStatus(
          "🪙 COIN COLLECTED! +10"
        );

      }


      updateCoinDisplay();

      updateAccountDisplay();


      /*
        Save everything
        immediately.
      */

      await saveGame();


      setTimeout(

        function() {

          setStatus(
            "🎮 KEEP EXPLORING"
          );

        },

        2000

      );

    }


    /* =====================================================
       DISTANCE
       ===================================================== */

    function distanceMeters(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R =
        6371000;


      const p1 =
        lat1 *
        Math.PI /
        180;


      const p2 =
        lat2 *
        Math.PI /
        180;


      const dLat =

        (
          lat2 -
          lat1
        ) *

        Math.PI /
        180;


      const dLon =

        (
          lon2 -
          lon1
        ) *

        Math.PI /
        180;


      const a =

        Math.sin(
          dLat / 2
        ) ** 2

        +

        Math.cos(p1) *
        Math.cos(p2) *

        Math.sin(
          dLon / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return R * c;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    function setStatus(
      text
    ) {

      document.getElementById(
        "status"
      ).innerText =
        text;

    }


    /* =====================================================
       SHOP
       ===================================================== */

    function openShop() {

      document.getElementById(
        "shopOverlay"
      ).style.display =
        "block";


      renderShop();

    }


    function closeShop() {

      document.getElementById(
        "shopOverlay"
      ).style.display =
        "none";

    }


    function renderShop() {

      document.getElementById(
        "shopBalance"
      ).innerText =

        "🪙 Coins: " +
        save.coins;


      const container =
        document.getElementById(
          "shopItems"
        );


      container.innerHTML =
        "";


      Object.keys(
        SKINS
      ).forEach(

        function(id) {

          const skin =
            SKINS[id];


          const unlocked =
            save.unlockedSkins.includes(
              id
            );


          const equipped =
            save.equippedSkin ===
            id;


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "shopItem";


          item.innerHTML = `

            <div
              class="skinPreview"
              style="
                background:${skin.color};
                color:${skin.color};
              "
            ></div>

            <div class="skinInfo">

              <div class="skinName">
                ${skin.name}
              </div>

              <div class="skinPrice">

                ${
                  skin.price === 0
                    ? "FREE"
                    : "🪙 " +
                      skin.price
                }

              </div>

            </div>

            <button
              class="shopButton"
            ></button>

          `;


          const button =
            item.querySelector(
              ".shopButton"
            );


          if (equipped) {

            button.innerText =
              "EQUIPPED";

            button.disabled =
              true;

          } else if (unlocked) {

            button.innerText =
              "EQUIP";


            button.addEventListener(

              "click",

              function() {

                equipSkin(
                  id
                );

              }

            );

          } else if (
            save.coins >=
            skin.price
          ) {

            button.innerText =
              "BUY";


            button.addEventListener(

              "click",

              function() {

                buySkin(
                  id
                );

              }

            );

          } else {

            button.innerText =
              "NEED COINS";

            button.disabled =
              true;

          }


          container.appendChild(
            item
          );

        }

      );

    }


    /* =====================================================
       BUY SKIN
       ===================================================== */

    async function buySkin(
      id
    ) {

      const skin =
        SKINS[id];


      if (!skin) {
        return;
      }


      if (
        save.unlockedSkins.includes(
          id
        )
      ) {
        return;
      }


      if (
        save.coins <
        skin.price
      ) {
        return;
      }


      save.coins -=
        skin.price;


      save.unlockedSkins.push(
        id
      );


      save.equippedSkin =
        id;


      updateCoinDisplay();

      updatePlayerSkin();

      renderShop();


      await saveGame();


      setStatus(

        "🎨 " +
        skin.name +
        " unlocked!"

      );

    }


    /* =====================================================
       EQUIP SKIN
       ===================================================== */

    async function equipSkin(
      id
    ) {

      if (
        !save.unlockedSkins.includes(
          id
        )
      ) {
        return;
      }


      save.equippedSkin =
        id;


      updatePlayerSkin();

      renderShop();


      await saveGame();


      setStatus(

        "🎨 " +
        SKINS[id].name +
        " equipped!"

      );

    }


    /* =====================================================
       SHOP EVENTS
       ===================================================== */

    document.getElementById(
      "shopButton"
    ).addEventListener(

      "click",

      openShop

    );


    document.getElementById(
      "closeShop"
    ).addEventListener(

      "click",

      closeShop

    );


    /* =====================================================
       MODE SWITCH
       ===================================================== */

    document.getElementById(
      "modeButton"
    ).addEventListener(

      "click",

      function() {

        if (
          gameMode ===
          "PUBLIC"
        ) {

          gameMode =
            "UNLIMITED";


          document.getElementById(
            "modeButton"
          ).innerText =
            "🔓 UNLIMITED";

        } else {

          gameMode =
            "PUBLIC";


          document.getElementById(
            "modeButton"
          ).innerText =
            "🌎 PUBLIC";

        }


        if (

          currentLatitude !== null &&

          currentLongitude !== null

        ) {

          loadTrail(

            currentLatitude,

            currentLongitude

          );

        }

      }

    );


    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(
      error
    ) {

      console.log(
        "GPS error:",
        error
      );


      setStatus(
        "❌ Couldn't get your location."
      );

    }


    /* =====================================================
       START GPS
       ===================================================== */

    if (
      "geolocation" in navigator
    ) {

      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );

    } else {

      setStatus(
        "❌ GPS isn't available."
      );

    }


    /* =====================================================
       START
       ===================================================== */

    checkSession();

  </script>
