/* =========================================================

function setStatus(text){

/* =========================================================
COIN PICKUP SOUND
========================================================= */

function unlockAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

  }catch(e){
    console.log("Audio unavailable");
  }

}


function playCoinSound(){

  try{

    unlockAudio();

    if(!audioContext)
      return;

    const now =
      audioContext.currentTime;

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
      700,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      1300,
      now + .12
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .22,
      now + .015
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .25
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(now);
    osc.stop(now + .26);

  }catch(e){

    console.log(
      "Coin sound error:",
      e
    );

  }

}


/* =========================================================
DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2)**2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


/* =========================================================
AUTH
========================================================= */

async function checkAuth(){

  authStatus.textContent =
    "Checking account...";

  try{

    const {
      data,
      error
    } =
      await supabase.auth.getSession();

    if(error)
      throw error;

    if(data.session){

      currentUser =
        data.session.user;

      await afterLogin();

      return;

    }

    authScreen.style.display =
      "flex";

    authStatus.textContent =
      "Sign in to save your coins.";

  }catch(error){

    console.error(error);

    authScreen.style.display =
      "flex";

    authStatus.textContent =
      "Ready to sign in.";

  }

}


/* =========================================================
SIGN IN
========================================================= */

document
.getElementById("signInButton")
.addEventListener(
  "click",
  async ()=>{
    unlockAudio();
    await signIn();
  }
);


async function signIn(){

  const email =
    document
    .getElementById("emailInput")
    .value
    .trim();

  const password =
    document
    .getElementById("passwordInput")
    .value;

  if(!email){

    authStatus.textContent =
      "Enter your email.";

    return;

  }

  if(!password){

    authStatus.textContent =
      "Enter your password.";

    return;

  }

  const button =
    document.getElementById(
      "signInButton"
    );

  button.disabled = true;

  authStatus.textContent =
    "Signing in...";

  try{

    const {
      data,
      error
    } =
      await supabase.auth.signInWithPassword({

        email,
        password

      });

    if(error)
      throw error;

    currentUser =
      data.user;

    authStatus.textContent =
      "Signed in!";

    await afterLogin();

  }catch(error){

    console.error(
      "SIGN IN ERROR:",
      error
    );

    authStatus.textContent =
      "❌ " + error.message;

  }finally{

    button.disabled = false;

  }

}


/* =========================================================
CREATE ACCOUNT
========================================================= */

document
.getElementById("createAccountButton")
.addEventListener(
  "click",
  async ()=>{
    unlockAudio();
    await createAccount();
  }
);


async function createAccount(){

  const email =
    document
    .getElementById("emailInput")
    .value
    .trim();

  const password =
    document
    .getElementById("passwordInput")
    .value;

  if(!email){

    authStatus.textContent =
      "Enter your email.";

    return;

  }

  if(!password){

    authStatus.textContent =
      "Choose a password.";

    return;

  }

  if(password.length < 6){

    authStatus.textContent =
      "Password must be at least 6 characters.";

    return;

  }

  const button =
    document.getElementById(
      "createAccountButton"
    );

  button.disabled = true;

  authStatus.textContent =
    "Creating account...";

  try{

    const {
      data,
      error
    } =
      await supabase.auth.signUp({

        email,
        password,

        options:{
          emailRedirectTo:
            window.location.origin +
            window.location.pathname
        }

      });

    if(error)
      throw error;

    /*
     * If email confirmation is OFF,
     * Supabase gives us a session immediately.
     */

    if(data.session){

      currentUser =
        data.user;

      authStatus.textContent =
        "Account created!";

      await afterLogin();

    }else{

      authStatus.textContent =
        "Account created. If Supabase requires email confirmation, check your email.";

    }

  }catch(error){

    console.error(
      "CREATE ACCOUNT ERROR:",
      error
    );

    authStatus.textContent =
      "❌ " + error.message;

  }finally{

    button.disabled = false;

  }

}


/* =========================================================
AFTER LOGIN
========================================================= */

async function afterLogin(){

  authScreen.style.display =
    "none";

  try{

    await loadPlayer();

  }catch(error){

    console.error(error);

    authScreen.style.display =
      "flex";

    authStatus.textContent =
      "Couldn't load player data.";

    return;

  }

  modeScreen.style.display =
    "flex";

}


/* =========================================================
PLAYER
========================================================= */

async function loadPlayer(){

  if(!currentUser)
    return;

  let {
    data,
    error
  } =
    await supabase
    .from("players")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error)
    throw error;

  if(!data){

    const newPlayer = {

      id:currentUser.id,

      username:
        currentUser.email
        ?.split("@")[0] ||
        "Player",

      coins:0,

      xp:0,

      level:1,

      unlocked_skins:["blue"],

      equipped_skin:"blue",

      collected_coins:[]

    };

    const result =
      await supabase
      .from("players")
      .insert(newPlayer)
      .select()
      .single();

    if(result.error)
      throw result.error;

    data =
      result.data;

  }

  data.coins =
    Number(data.coins || 0);

  data.xp =
    Number(data.xp || 0);

  data.level =
    Number(data.level || 1);

  data.unlocked_skins =
    Array.isArray(data.unlocked_skins)
    ? data.unlocked_skins
    : ["blue"];

  data.collected_coins =
    Array.isArray(data.collected_coins)
    ? data.collected_coins
    : [];

  data.equipped_skin =
    data.equipped_skin || "blue";

  playerData =
    data;

  updateCoinDisplay();

}

SAVE

async function savePlayer(){

  if(!playerData)
    return;

  const {
    error
  } =
    await supabase
    .from("players")
    .update({

      coins:
        playerData.coins,

      xp:
        playerData.xp,

      level:
        playerData.level,

      unlocked_skins:
        playerData.unlocked_skins,

      equipped_skin:
        playerData.equipped_skin,

      collected_coins:
        playerData.collected_coins,

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      playerData.id
    );

  if(error){

    console.error(
      "Save error:",
      error
    );

  }

}

/* =========================================================
MAP
========================================================= */

function initializeMap(){

  if(map)
    return;

  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    ).setView(
      [42.96,-85.67],
      15
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);

}


/* =========================================================
GPS
========================================================= */

function startGPS(){

  if(!navigator.geolocation){

    setStatus(
      "❌ GPS is not supported."
    );

    return;

  }

  if(watchId !== null){

    navigator.geolocation.clearWatch(
      watchId
    );

  }

  watchId =
    navigator.geolocation.watchPosition(

      onLocation,

      onLocationError,

      {
        enableHighAccuracy:true,
        maximumAge:2000,
        timeout:15000
      }

    );

}


function onLocation(position){

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy || 30;

  setLoading(
    "Location found!",
    65
  );

  if(!playerMarker){

    createPlayer(
      lat,
      lon
    );

    map.setView(
      [lat,lon],
      17
    );

    loadingScreen.style.display =
      "none";

    setStatus(
      "🗺️ Finding your nearest connected road..."
    );

    loadRoadNetwork(
      lat,
      lon
    );

  }else{

    playerMarker.setLatLng(
      [lat,lon]
    );

    if(accuracyCircle){

      accuracyCircle
      .setLatLng([lat,lon])
      .setRadius(accuracy);

    }

  }

  collectNearbyCoins(
    lat,
    lon
  );

  if(
    lastRoadLat === null ||
    lastRoadLon === null
  )
    return;

  const moved =
    distanceMeters(
      lastRoadLat,
      lastRoadLon,
      lat,
      lon
    );

  if(
    moved >=
    ROAD_REFRESH_DISTANCE
  ){

    loadRoadNetwork(
      lat,
      lon
    );

  }

}


function onLocationError(error){

  console.error(
    "GPS error:",
    error
  );

  loadingScreen.style.display =
    "none";

  if(error.code === 1){

    setStatus(
      "📍 Location permission denied. Enable location for this site."
    );

  }else{

    setStatus(
      "📍 Waiting for GPS..."
    );

  }

}

/* =========================================================
ROAD NETWORK
========================================================= */

async function loadRoadNetwork(
  lat,
  lon
){

  if(loadingRoads)
    return;

  loadingRoads =
    true;

  lastRoadLat =
    lat;

  lastRoadLon =
    lon;

  setStatus(
    "🗺️ Searching for nearby roads..."
  );

  try{

    const ways =
      await getNearbyWays(
        lat,
        lon
      );

    if(!ways.length){

      setStatus(
        "🔎 No roads found yet. Retrying..."
      );

      loadingRoads =
        false;

      setTimeout(
        ()=>{
          loadRoadNetwork(
            lat,
            lon
          );
        },
        3000
      );

      return;

    }

    const nearest =
      findNearestRoadPoint(
        ways,
        lat,
        lon
      );

    if(!nearest){

      loadingRoads =
        false;

      return;

    }

    const roadDistance =
      Math.round(
        nearest.distance
      );

    if(
      roadDistance > 300
    ){

      setStatus(
        `🚶 Nearest road: ${roadDistance}m away`
      );

      loadingRoads =
        false;

      return;

    }

    const network =
      buildConnectedNetwork(
        ways,
        nearest.way
      );

    drawRoadNetwork(
      network
    );

    generateNetworkCoins(
      network,
      nearest
    );

    setStatus(
      `🛣️ Road ${roadDistance}m away • ${coins.length} coins nearby`
    );

  }catch(error){

    console.error(
      "Road error:",
      error
    );

    setStatus(
      "⚠️ Road server error. Retrying..."
    );

  }

  loadingRoads =
    false;

}


/* =========================================================
OVERPASS
========================================================= */

async function getNearbyWays(
  lat,
  lon
){

  const latDelta =
    SEARCH_RADIUS / 111320;

  const lonDelta =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat * Math.PI / 180
      )
    );

  const south =
    lat - latDelta;

  const north =
    lat + latDelta;

  const west =
    lon - lonDelta;

  const east =
    lon + lonDelta;

  let filter = `
    way["highway"]
    (${south},${west},${north},${east});
  `;

  if(gameMode === "PUBLIC"){

    filter = `
      way["highway"]
      ["access"!="private"]
      ["access"!="no"]
      ["access"!="customers"]
      ["access"!="permit"]
      (${south},${west},${north},${east});
    `;

  }

  const query = `

    [out:json][timeout:15];

    ${filter}

    out tags geom;

  `;

  for(
    const server of
    OVERPASS_SERVERS
  ){

    try{

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          ()=>{
            controller.abort();
          },
          12000
        );

      const response =
        await fetch(
          server,
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(query),

            signal:
              controller.signal

          }
        );

      clearTimeout(timeout);

      if(!response.ok)
        continue;

      const json =
        await response.json();

      const ways =
        filterWays(
          json.elements || []
        );

      if(ways.length)
        return ways;

    }catch(error){

      console.log(
        "Overpass failed",
        error
      );

    }

  }

  return [];

}


/* =========================================================
FILTER ROADS
========================================================= */

function filterWays(elements){

  const allowedPublic = [

    "footway",
    "path",
    "pedestrian",
    "steps",
    "cycleway",
    "bridleway",
    "living_street",
    "residential",
    "unclassified",
    "service",
    "tertiary",
    "tertiary_link",
    "secondary",
    "secondary_link

  ];

  const result = [];

  for(
    const e of elements
  ){

    if(
      e.type !== "way" ||
      !e.geometry ||
      e.geometry.length < 2
    )
      continue;

    const tags =
      e.tags || {};

    const highway =
      tags.highway;

    if(!highway)
      continue;

    if(gameMode === "PUBLIC"){

      if(
        !allowedPublic.includes(
          highway
        )
      )
        continue;

    }else{

      if(
        [
          "motorway",
          "motorway_link",
          "trunk",
          "trunk_link"
        ].includes(highway)
      )
        continue;

    }

    result.push({

      id:e.id,

      geometry:
        e.geometry.map(
          p=>({
            lat:Number(p.lat),
            lon:Number(p.lon)
          })
        ),

      tags

    });

  }

  return result;

}


/* =========================================================
NEAREST ROAD
========================================================= */

function findNearestRoadPoint(
  ways,
  lat,
  lon
){

  let best =
    null;

  for(
    const way of ways
  ){

    for(
      let i=0;
      i<way.geometry.length-1;
      i++
    ){

      const a =
        way.geometry[i];

      const b =
        way.geometry[i+1];

      const point =
        closestPointOnSegment(
          lat,
          lon,
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );

      const d =
        distanceMeters(
          lat,
          lon,
          point.lat,
          point.lon
        );

      if(
        !best ||
        d < best.distance
      ){

        best = {

          way,

          segmentIndex:i,

          point,

          distance:d

        };

      }

    }

  }

  return best;

}


function closestPointOnSegment(
  lat,
  lon,
  lat1,
  lon1,
  lat2,
  lon2
){

  const cos =
    Math.cos(
      lat * Math.PI / 180
    );

  const x =
    (lon-lon1) *
    111320 *
    cos;

  const y =
    (lat-lat1) *
    111320;

  const dx =
    (lon2-lon1) *
    111320 *
    cos;

  const dy =
    (lat2-lat1) *
    111320;

  const len2 =
    dx*dx + dy*dy;

  let t =
    len2 === 0
    ? 0
    : (x*dx+y*dy)/len2;

  t =
    Math.max(
      0,
      Math.min(1,t)
    );

  return {

    lat:
      lat1 +
      (lat2-lat1)*t,

    lon:
      lon1 +
      (lon2-lon1)*t

  };

}


/* =========================================================
CONNECTED NETWORK
========================================================= */

function buildConnectedNetwork(
  ways,
  startingWay
){

  const network = [];

  const visited =
    new Set();

  const queue =
    [startingWay];

  while(queue.length){

    const way =
      queue.shift();

    if(
      visited.has(way.id)
    )
      continue;

    visited.add(
      way.id
    );

    network.push(
      way
    );

    for(
      const other of ways
    ){

      if(
        visited.has(other.id)
      )
        continue;

      if(
        waysConnected(
          way,
          other
        )
      ){

        queue.push(
          other
        );

      }

    }

  }

  return network;

}


function waysConnected(a,b){

  const a1 =
    a.geometry[0];

  const a2 =
    a.geometry[
      a.geometry.length-1
    ];

  const b1 =
    b.geometry[0];

  const b2 =
    b.geometry[
      b.geometry.length-1
    ];

  const limit =
    28;

  return (

    distanceMeters(
      a1.lat,a1.lon,
      b1.lat,b1.lon
    ) <= limit ||

    distanceMeters(
      a1.lat,a1.lon,
      b2.lat,b2.lon
    ) <= limit ||

    distanceMeters(
      a2.lat,a2.lon,
      b1.lat,b1.lon
    ) <= limit ||

    distanceMeters(
      a2.lat,a2.lon,
      b2.lat,b2.lon
    ) <= limit

  );

}


/* =========================================================
ROAD DISPLAY
========================================================= */

function drawRoadNetwork(network){

  for(
    const line of roadLines
  ){

    if(map.hasLayer(line))
      map.removeLayer(line);

  }

  roadLines = [];

  for(
    const way of network
  ){

    const points =
      way.geometry.map(
        p=>[
          p.lat,
          p.lon
        ]
      );

    const line =
      L.polyline(
        points,
        {
          color:"#008ee6",
          weight:4,
          opacity:.22
        }
      ).addTo(map);

    roadLines.push(
      line
    );

  }

}


/* =========================================================
COINS
========================================================= */

function coinId(lat,lon){

  return (
    Math.round(lat*100000) +
    "_" +
    Math.round(lon*100000)
  );

}


function addCoin(lat,lon){

  if(!map || !playerData)
    return false;

  const id =
    coinId(lat,lon);

  if(
    playerData.collected_coins
    .includes(id)
  )
    return false;

  for(
    const c of coins
  ){

    if(
      distanceMeters(
        lat,lon,
        c.lat,c.lon
      ) < 25
    )
      return false;

  }

  const marker =
    L.marker(
      [lat,lon],
      {

        icon:
          L.divIcon({

            className:"",

            html:
              `<div class="coin">🪙</div>`,

            iconSize:[34,34],

            iconAnchor:[17,17]

          })

      }
    ).addTo(map);

  coins.push({

    id,

    lat,

    lon,

    marker,

    collected:false

  });

  return true;

}


/* =========================================================
GENERATE COINS
========================================================= */

function generateNetworkCoins(
  network,
  nearest
){

  /*
   * IMPORTANT:
   * Never allow the map to become empty.
   * Each road refresh replenishes coins.
   */

  const ordered =
    network
    .slice()
    .sort(
      (a,b)=>
        distanceToWay(
          nearest.point,
          a
        )
        -
        distanceToWay(
          nearest.point,
          b
        )
    );

  /*
   * First generate on the player's
   * actual nearest connected road.
   */

  for(
    const way of ordered
  ){

    if(
      coins.length >=
      MAX_COINS
    )
      break;

    const points =
      pointsAlongWay(
        way,
        nearest.point
      );

    for(
      const p of points
    ){

      if(
        coins.length >=
        MAX_COINS
      )
        break;

      addCoin(
        p.lat,
        p.lon
      );

    }

  }

  /*
   * If the network didn't provide enough,
   * use every connected section again with
   * more spacing.
   */

  if(
    coins.length < 5
  ){

    for(
      const way of ordered
    ){

      if(
        coins.length >=
        MAX_COINS
      )
        break;

      const geometry =
        way.geometry;

      for(
        let i=0;
        i<geometry.length;
        i+=2
      ){

        if(
          coins.length >=
          MAX_COINS
        )
          break;

        addCoin(
          geometry[i].lat,
          geometry[i].lon
        );

      }

    }

  }

}


/* =========================================================
POINTS
========================================================= */

function pointsAlongWay(
  way,
  startingPoint
){

  const result = [];

  const geometry =
    way.geometry.slice();

  let previous =
    startingPoint ||
    geometry[0];

  let accumulated = 0;

  for(
    const p of geometry
  ){

    const d =
      distanceMeters(
        previous.lat,
        previous.lon,
        p.lat,
        p.lon
      );

    accumulated += d;

    if(
      accumulated >=
      COIN_SPACING
    ){

      result.push({

        lat:p.lat,
        lon:p.lon

      });

      accumulated = 0;

    }

    previous =
      p;

  }

  return result;

}


function distanceToWay(
  point,
  way
){

  let best =
    Infinity;

  for(
    const p of way.geometry
  ){

    const d =
      distanceMeters(
        point.lat,
        point.lon,
        p.lat,
        p.lon
      );

    if(d < best)
      best = d;

  }

  return best;

}


/* =========================================================
COLLECTION
========================================================= */

function collectNearbyCoins(
  lat,
  lon
){

  for(
    const c of coins
  ){

    if(c.collected)
      continue;

    const d =
      distanceMeters(
        lat,
        lon,
        c.lat,
        c.lon
      );

    if(
      d <=
      COLLECTION_DISTANCE
    ){

      collectCoin(
        c
      );

    }

  }

}


async function collectCoin(c){

  if(
    !playerData ||
    c.collected
  )
    return;

  c.collected =
    true;

  if(
    map.hasLayer(
      c.marker
    )
  ){

    map.removeLayer(
      c.marker
    );

  }

  if(
    !playerData
    .collected_coins
    .includes(c.id)
  ){

    playerData
      .collected_coins
      .push(c.id);

  }

  playerData.coins +=
    10;

  playerData.xp +=
    10;

  checkLevel();

  updateCoinDisplay();

  /*
   * Play the pickup sound.
   */

  playCoinSound();

  showToast(
    "🪙 COIN COLLECTED! +10"
  );

  setStatus(
    "🎮 Keep exploring!"
  );

  await savePlayer();

  /*
   * If the player has almost run out,
   * immediately request more roads/coins.
   */

  if(
    coins.filter(
      c=>!c.collected
    ).length <= 3 &&
    playerMarker
  ){

    const pos =
      playerMarker.getLatLng();

    lastRoadLat = null;
    lastRoadLon = null;

    loadRoadNetwork(
      pos.lat,
      pos.lng
    );

  }

}


/* =========================================================
LEVEL
========================================================= */

function checkLevel(){

  if(!playerData)
    return;

  let required =
    playerData.level *
    100;

  while(
    playerData.xp >=
    required
  ){

    playerData.xp -=
      required;

    playerData.level++;

    showToast(
      `🎉 LEVEL ${playerData.level}!`
    );

    required =
      playerData.level *
      100;

  }

}

function renderShop(){

  if(!playerData)
    return;

  shopBalance.textContent =
    `🪙 Coins: ${playerData.coins}`;

  shopItems.innerHTML = "";

  for(
    const [id,skin]
    of Object.entries(SKINS)
  ){

    const unlocked =
      playerData
      .unlocked_skins
      .includes(id);

    const equipped =
      playerData.equipped_skin === id;

    const item =
      document.createElement("div");

    item.className =
      "shopItem";

    const preview =
      document.createElement("div");

    preview.className =
      "skinPreview";

    preview.style.background =
      skin.color;

    const info =
      document.createElement("div");

    info.className =
      "skinInfo";

    info.innerHTML = `

      <div class="skinName">
        ${skin.name}
      </div>

      <div class="skinPrice">
        ${
          skin.price === 0
          ? "FREE"
          : "🪙 " + skin.price
        }
      </div>

    `;

    const button =
      document.createElement("button");

    button.className =
      "action";

    if(equipped){

      button.textContent =
        "EQUIPPED";

      button.disabled =
        true;

    }else if(unlocked){

      button.textContent =
        "EQUIP";

      button.onclick =
        ()=>{
          equipSkin(id);
        };

    }else if(
      playerData.coins >=
      skin.price
    ){

      button.textContent =
        "BUY";

      button.onclick =
        ()=>{
          buySkin(id);
        };

    }else{

      button.textContent =
        "NEED COINS";

      button.disabled =
        true;

    }

    item.append(
      preview,
      info,
      button
    );

    shopItems.appendChild(
      item
    );

  }

}


async function buySkin(id){

  const skin =
    SKINS[id];

  if(
    !skin ||
    !playerData
  )
    return;

  if(
    playerData
    .unlocked_skins
    .includes(id)
  )
    return;

  if(
    playerData.coins <
    skin.price
  ){

    showToast(
      "❌ Not enough coins"
    );

    return;

  }

  playerData.coins -=
    skin.price;

  playerData
    .unlocked_skins
    .push(id);

  playerData.equipped_skin =
    id;

  await savePlayer();

  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();

}


async function equipSkin(id){

  if(
    !playerData ||
    !playerData
      .unlocked_skins
      .includes(id)
  )
    return;

  playerData.equipped_skin =
    id;

  await savePlayer();

  updatePlayerSkin();

  renderShop();

}


function updatePlayerSkin(){

  if(!playerMarker)
    return;

  const skin =
    SKINS[
      playerData?.equipped_skin
    ] ||
    SKINS.blue;

  playerMarker.setIcon(

    L.divIcon({

      className:"",

      html:
        `<div class="player"
          style="--player-color:${skin.color}">
        </div>`,

      iconSize:[28,28],

      iconAnchor:[14,14]

    })

  );

}
