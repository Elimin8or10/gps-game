<script type="module">

/* =========================================================

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";


const supabase =
  createClient(

/* =========================================================

const SEARCH_RADIUS = 1000;

const REFRESH_DISTANCE = 150;

const OVERPASS_SERVERS = [

];


/* =========================================================

const SKINS = {

  },

  red:{

  },

};


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let playerData = null;

let map = null;

let playerMarker = null;

let coins = [];

let gameMode = null;

let gpsWatch = null;

let gameStarted = false;

let loadingTrail = false;

let lastTrailLat = null;

let lastTrailLon = null;


/* =========================================================
   DOM
========================================================= */

const authScreen =
  document.getElementById("authScreen");

const modeScreen =
  document.getElementById("modeScreen");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingBar =

const signInButton =
  document.getElementById("signInButton");

const coinsDisplay =

const toast =
  document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function setLoading(text,percent){

  loadingText.textContent = text;

  loadingBar.style.width =
    percent + "%";

}


function setStatus(text){

  statusElement.textContent = text;

}


function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(
    ()=>{
      toast.classList.remove("show");
    },
    2200
  );

}


function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2)**2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


function coinId(lat,lon){

  return (
    Math.round(lat*100000) +
    "_" +
    Math.round(lon*100000)
  );

}


/* =========================================================
   AUTH
========================================================= */

signInButton.addEventListener(
  "click",
  signIn
);


emailInput.addEventListener(
  "keydown",
  event=>{
    if(event.key==="Enter"){
      signIn();
    }
  }
);


async function signIn(){

  const email =
    emailInput.value.trim();

  if(!email){

    authMessage.textContent =
      "Enter your email first.";

    return;

  }

  signInButton.disabled = true;

  signInButton.textContent =
    "SENDING...";

  authMessage.textContent =
    "Sending your sign-in link...";

  try{

    const redirect =
      window.location.origin +
      window.location.pathname;

    const {error} =
      await supabase.auth.signInWithOtp({

        email,

        options:{
          emailRedirectTo:redirect
        }

      });

    if(error)
      throw error;

    authMessage.textContent =
      "✅ Check your email and tap the sign-in link.";

    signInButton.textContent =
      "LINK SENT";

  }
  catch(error){

    console.error(error);

    authMessage.textContent =
      "❌ " +
      (error.message || "Sign-in failed.");

    signInButton.disabled = false;

    signInButton.textContent =
      "SEND SIGN-IN LINK";

  }

}


/* =========================================================
   AUTH SESSION
========================================================= */

async function getSession(){

  const {
    data,
    error
  } =
    await supabase.auth.getSession();

  if(error)
    console.error(error);

  return data.session;

}


supabase.auth.onAuthStateChange(
  (event,session)=>{

    console.log(
      "Auth:",
      event
    );

    if(event==="SIGNED_OUT"){

      location.reload();

    }

  }
);


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  try{

    setStatus(
      "Checking account..."
    );

    const session =
      await getSession();

    if(!session){

      authScreen.style.display =
        "flex";

      return;

    }

    currentUser =
      session.user;

    authScreen.style.display =
      "none";

    await loadPlayer();

    showModeScreen();

  }
  catch(error){

    console.error(error);

    authScreen.style.display =
      "flex";

    authMessage.textContent =
      "❌ " +
      (error.message || "Could not start.");

  }

}


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

  const {
    data,
    error
  } =
    await supabase
      .from("players")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if(error)
    throw error;


  if(!data){

    const {
      data:newPlayer,
      error:createError
    } =
      await supabase
        .from("players")
        .insert({
          id:currentUser.id
        })
        .select()
        .single();

    if(createError)
      throw createError;

    playerData =
      newPlayer;

  }
  else{

    playerData =
      data;

  }


  updateCoinDisplay();

}


/* =========================================================
   MODE
========================================================= */

function showModeScreen(){

  modeScreen.style.display =
    "flex";

}


document
  .getElementById("publicMode")
  .addEventListener(
    "click",
    ()=>{
      chooseMode("PUBLIC");
    }
  );


document
  .getElementById("unlimitedMode")
  .addEventListener(
    "click",
    ()=>{
      chooseMode("UNLIMITED");
    }
  );


function chooseMode(mode){

  gameMode =
    mode;

  modeScreen.style.display =
    "none";

  loadingScreen.style.display =
    "flex";

  setLoading(
    "Preparing GPS...",
    10
  );

  requestLocation();

}


/* =========================================================
   GPS
========================================================= */

function requestLocation(){

  if(!navigator.geolocation){

    setLoading(
      "GPS isn't available.",
      100
    );

    setStatus(
      "❌ This browser doesn't support GPS."
    );

    return;

  }


  setLoading(
    "Please allow location access...",
    20
  );


  navigator.geolocation.getCurrentPosition(
    position=>{
      startGame(
        position.coords.latitude,
        position.coords.longitude
      );

      startWatchingGPS();
    },

    error=>{
      console.error(error);

      setLoading(
        "Location permission is required.",
        100
      );

      setStatus(
        "📍 Allow location access in your browser settings, then reload."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );

}


/* =========================================================
   WATCH GPS
========================================================= */

function startWatchingGPS(){

  if(gpsWatch !== null)
    return;

  gpsWatch =
    navigator.geolocation.watchPosition(

      position=>{

        updatePlayerLocation(
          position.coords.latitude,
          position.coords.longitude
        );

      },

      error=>{

        console.log(
          "GPS watch:",
          error
        );

      },

      {
        enableHighAccuracy:true,
        maximumAge:3000,
        timeout:15000
      }

    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame(lat,lon){

  if(gameStarted)
    return;

  gameStarted = true;

  setLoading(
    "Opening map...",
    35
  );


  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    ).setView(
      [lat,lon],
      17
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:20,
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);


  createPlayerMarker(
    lat,
    lon
  );


  lastTrailLat = lat;

  lastTrailLon = lon;


  setLoading(
    "Finding your nearest connected road...",
    50
  );


  loadTrail(
    lat,
    lon
  );

}


/* =========================================================
   PLAYER
========================================================= */

function currentSkin(){

  return (
    SKINS[
      playerData?.equipped_skin
    ] ||
    SKINS.blue
  );

}


function createPlayerMarker(lat,lon){

  playerMarker =
    L.marker(
      [lat,lon],
      {
        icon:createPlayerIcon()
      }
    ).addTo(map);

}


function createPlayerIcon(){

  const skin =
    currentSkin();

  return L.divIcon({

    className:"",

    html:
      `<div class="player"
       style="--player-color:${skin.color}">
       </div>`,

    iconSize:[24,24],

    iconAnchor:[12,12]

  });

}


function updatePlayerLocation(lat,lon){

  if(!map)
    return;


  if(playerMarker){

    playerMarker.setLatLng(
      [lat,lon]
    );

  }


  collectNearbyCoins(
    lat,
    lon
  );


  if(
    lastTrailLat !== null &&
    lastTrailLon !== null
  ){

    const moved =
      distanceMeters(
        lastTrailLat,
        lastTrailLon,
        lat,
        lon
      );


    if(
      moved >= REFRESH_DISTANCE
    ){

      lastTrailLat = lat;

      lastTrailLon = lon;

      loadTrail(
        lat,
        lon
      );

    }

  }

}


/* =========================================================
   OVERPASS
========================================================= */

async function getWays(lat,lon){

  const latOffset =
    SEARCH_RADIUS / 111320;

  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat*Math.PI/180
      )
    );


  const south =
    lat-latOffset;

  const north =
    lat+latOffset;

  const west =
    lon-lonOffset;

  const east =
    lon+lonOffset;


  let highwayFilter;


  if(gameMode==="PUBLIC"){

    highwayFilter =
      `
      ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|service"]
      `;

  }
  else{

    highwayFilter =
      `
      ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|service|unclassified|tertiary|secondary"]
      `;

  }


  const query = `

    [out:json]
    [timeout:30];

    way
      ${highwayFilter}
      (${south},${west},${north},${east});

    out tags geom;

  `;


  for(
    const server of OVERPASS_SERVERS
  ){

    try{

      const response =
        await fetch(
          server,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(query)
          }
        );


      if(!response.ok)
        throw new Error(
          "HTTP " + response.status
        );


      const data =
        await response.json();


      return data.elements || [];

    }
    catch(error){

      console.log(
        "Overpass failed:",
        error
      );

    }

  }


  return [];

}


/* =========================================================
   FILTER WAYS
========================================================= */

function filterWays(elements){

  const result = [];

  for(
    const element of elements
  ){

    if(
      element.type !== "way" ||
      !element.geometry ||
      element.geometry.length < 2
    )
      continue;


    const tags =
      element.tags || {};


    const highway =
      tags.highway;


    if(!highway)
      continue;


    const access =
      String(
        tags.access || ""
      ).toLowerCase();


    if(
      access==="private" ||
      access==="no" ||
      access==="permit" ||
      access==="customers"
    )
      continue;


    result.push({

      id:element.id,

      geometry:element.geometry,

      tags

    });

  }

  return result;

}


/* =========================================================
   NETWORK GRAPH
========================================================= */

function nodeKey(point){

  return (
    point.lat.toFixed(6) +
    "," +
    point.lon.toFixed(6)
  );

}


/*
 * This is the important part.
 *
 * Instead of:
 *
 * "find a nearby road and use it"
 *
 * we create a graph from the actual OSM
 * road/path geometry.
 *
 * The route can then only travel from
 * one connected OSM node to another.
 */

function buildNetwork(ways){

  const nodes = new Map();

  for(
    const way of ways
  ){

    const geometry =
      way.geometry;


    for(
      let i=0;
      i<geometry.length;
      i++
    ){

      const point =
        geometry[i];

      const key =
        nodeKey(point);


      if(!nodes.has(key)){

        nodes.set(
          key,
          {
            point:{
              lat:point.lat,
              lon:point.lon
            },

            edges:[]
          }
        );

      }

    }

  }


  for(
    const way of ways
  ){

    const geometry =
      way.geometry;


    for(
      let i=0;
      i<geometry.length-1;
      i++
    ){

      const a =
        geometry[i];

      const b =
        geometry[i+1];


      const ka =
        nodeKey(a);

      const kb =
        nodeKey(b);


      const distance =
        distanceMeters(
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );


      nodes
        .get(ka)
        .edges
        .push({
          key:kb,
          distance
        });


      nodes
        .get(kb)
        .edges
        .push({
          key:ka,
          distance
        });

    }

  }


  return nodes;

}


/* =========================================================
   NEAREST NETWORK NODE
========================================================= */

function findNearestNetworkNode(
  nodes,
  lat,
  lon
){

  let best = null;

  let bestDistance =
    Infinity;


  for(
    const [key,node] of nodes
  ){

    const d =
      distanceMeters(
        lat,
        lon,
        node.point.lat,
        node.point.lon
      );


    if(d<bestDistance){

      bestDistance = d;

      best = {
        key,
        node,
        distance:d
      };

    }

  }


  return best;

}


/* =========================================================
   BUILD CONNECTED ROUTE
========================================================= */

function buildConnectedRoute(
  nodes,
  startKey
){

  const route = [];

  let currentKey =
    startKey;

  let previousKey =
    null;

  let distanceSinceCoin =
    0;

  const visitedEdges =
    new Set();


  /*
   * We prefer continuing forward,
   * but at intersections we choose
   * an unvisited connected edge.
   */

  for(
    let step=0;
    step<2500;
    step++
  ){

    const current =
      nodes.get(currentKey);


    if(!current)
      break;


    const possible =
      current.edges.filter(
        edge=>{

          if(
            edge.key===previousKey
          )
            return false;


          const edgeId =
            [currentKey,edge.key]
              .sort()
              .join("|");


          return !visitedEdges.has(
            edgeId
          );

        }
      );


    if(possible.length===0){

      /*
       * Dead end.
       *
       * Try reversing only if we haven't
       * generated enough coins.
       */

      break;

    }


    /*
     * At intersections choose the
     * longest unexplored continuation.
     * This helps avoid immediately taking
     * a tiny driveway or stub.
     */

    possible.sort(
      (a,b)=>
        b.distance-a.distance
    );


    const next =
      possible[0];


    const edgeId =
      [currentKey,next.key]
        .sort()
        .join("|");


    visitedEdges.add(edgeId);


    distanceSinceCoin +=
      next.distance;


    currentKey =
      next.key;


    const currentNode =
      nodes.get(currentKey);


    if(
      distanceSinceCoin >=
      COIN_SPACING
    ){

      route.push({
        lat:
          currentNode.point.lat,

        lon:
          currentNode.point.lon
      });


      distanceSinceCoin = 0;

    }


    if(
      route.length >=
      COIN_COUNT
    )
      break;


    previousKey =
      currentKey;

  }


  return route;

}


/* =========================================================
   BETTER ROUTE WALK
========================================================= */

function walkNetwork(
  nodes,
  startKey
){

  /*
   * A route should not immediately stop
   * because the nearest node happened to
   * be at a dead-end.
   *
   * We try each available starting
   * direction and choose the one that
   * produces the longest connected route.
   */

  const start =
    nodes.get(startKey);


  if(!start)
    return [];


  let bestRoute = [];

  let bestDistance = 0;


  for(
    const firstEdge of start.edges
  ){

    const route = [];

    let currentKey =
      startKey;

    let previousKey =
      null;

    let first =
      true;

    let totalDistance = 0;

    let coinDistance = 0;

    const visited =
      new Set();


    for(
      let step=0;
      step<3000;
      step++
    ){

      const node =
        nodes.get(currentKey);


      if(!node)
        break;


      let edge;


      if(first){

        edge =
          firstEdge;

        first = false;

      }
      else{

        const choices =
          node.edges.filter(
            e=>{

              if(
                e.key===
                previousKey
              )
                return false;


              const id =
                [currentKey,e.key]
                  .sort()
                  .join("|");


              return !visited.has(id);

            }
          );


        if(!choices.length)
          break;


        /*
         * Prefer roads that continue
         * rather than tiny branches.
         */

        choices.sort(
          (a,b)=>
            b.distance-a.distance
        );

        edge =
          choices[0];

      }


      const edgeId =
        [currentKey,edge.key]
          .sort()
          .join("|");


      if(
        visited.has(edgeId)
      )
        break;


      visited.add(edgeId);


      totalDistance +=
        edge.distance;

      coinDistance +=
        edge.distance;


      previousKey =
        currentKey;

      currentKey =
        edge.key;


      const nextNode =
        nodes.get(currentKey);


      if(!nextNode)
        break;


      if(
        coinDistance >=
        COIN_SPACING
      ){

        route.push({
          lat:
            nextNode.point.lat,

          lon:
            nextNode.point.lon
        });

        coinDistance = 0;

      }


      if(
        route.length >=
        COIN_COUNT
      )
        break;

    }


    if(
      totalDistance >
      bestDistance
    ){

      bestDistance =
        totalDistance;

      bestRoute =
        route;

    }

  }


  return bestRoute;

}


/* =========================================================
   LOAD TRAIL
========================================================= */

async function loadTrail(
  lat,
  lon
){

  if(
    loadingTrail ||
    !map
  )
    return;


  loadingTrail = true;


  setLoading(
    "Finding nearby roads...",
    60
  );


  setStatus(
    "🛣️ Searching for your nearest connected road..."
  );


  removeTemporaryCoins();


  try{

    const elements =
      await getWays(
        lat,
        lon
      );


    const ways =
      filterWays(
        elements
      );


    if(!ways.length){

      throw new Error(
        "No mapped paths nearby."
      );

    }


    setLoading(
      "Building connected road network...",
      72
    );


    const nodes =
      buildNetwork(
        ways
      );


    const nearest =
      findNearestNetworkNode(
        nodes,
        lat,
        lon
      );


    if(!nearest){

      throw new Error(
        "No network node found."
      );

    }


    /*
     * This prevents the game from picking
     * some random disconnected path that
     * happens to be nearby.
     */

    if(
      nearest.distance >
      180
    ){

      setLoading(
        "No close connected road found.",
        100
      );

      setStatus(
        `🛣️ Nearest mapped road is ${Math.round(nearest.distance)}m away.`
      );

      loadingScreen.classList.add(
        "hidden"
      );

      loadingTrail = false;

      return;

    }


    setLoading(
      "Following the connected road...",
      82
    );


    const route =
      walkNetwork(
        nodes,
        nearest.key
      );


    if(!route.length){

      throw new Error(
        "Couldn't follow connected network."
      );

    }


    /*
     * Put the first coin at the nearest
     * actual network point.
     */

    createCoin(
      nearest.node.point.lat,
      nearest.node.point.lon
    );


    for(
      const point of route
    ){

      createCoin(
        point.lat,
        point.lon
      );

    }


    setLoading(
      "Route ready!",
      100
    );


    setTimeout(
      ()=>{
        loadingScreen.classList.add(
          "hidden"
        );
      },
      350
    );


    setStatus(
      `🛣️ Connected route found • ${coins.filter(c=>!c.collected).length} coins`
    );

  }
  catch(error){

    console.error(
      "Trail error:",
      error
    );


    setLoading(
      "Couldn't build route.",
      100
    );


    setStatus(
      "⚠️ Couldn't find a connected road. Try moving outside and back in."
    );


    setTimeout(
      ()=>{
        loadingScreen.classList.add(
          "hidden"
        );
      },
      500
    );

  }


  loadingTrail = false;

}


/* =========================================================
   CREATE COIN
========================================================= */

function createCoin(
  lat,
  lon
){

  if(!map)
    return;


  const id =
    coinId(lat,lon);


  if(
    playerData &&
    Array.isArray(
      playerData.collected_coins
    ) &&
    playerData.collected_coins.includes(id)
  )
    return;


  /*
   * Prevent coins from stacking.
   */

  for(
    const existing of coins
  ){

    if(
      distanceMeters(
        lat,
        lon,
        existing.lat,
        existing.lon
      ) < 25
    )
      return;

  }


  const marker =
    L.marker(
      [lat,lon],
      {
        icon:
          L.divIcon({

            className:"",

            html:
              `<div class="coin">🪙</div>`,

            iconSize:[30,30],

            iconAnchor:[15,15]

          })
      }
    ).addTo(map);


  coins.push({

    id,

    marker,

    lat,

    lon,

    collected:false,

    temporary:true

  });

}


/* =========================================================
   REMOVE TEMPORARY COINS
========================================================= */

function removeTemporaryCoins(){

  if(!map)
    return;


  const remaining = [];


  for(
    const coin of coins
  ){

    if(coin.collected){

      remaining.push(
        coin
      );

      continue;

    }


    if(
      map.hasLayer(
        coin.marker
      )
    ){

      map.removeLayer(
        coin.marker
      );

    }

  }


  coins =
    remaining;

}


/* =========================================================
   COLLECT
========================================================= */

function collectNearbyCoins(
  lat,
  lon
){

  for(
    const coin of coins
  ){

    if(coin.collected)
      continue;


    const d =
      distanceMeters(
        lat,
        lon,
        coin.lat,
        coin.lon
      );


    if(
      d <=
      COLLECTION_DISTANCE
    ){

      collectCoin(
        coin
      );

    }

  }

}


async function collectCoin(coin){

  if(
    !playerData ||
    coin.collected
  )
    return;


  coin.collected = true;


  if(
    map &&
    map.hasLayer(
      coin.marker
    )
  ){

    map.removeLayer(
      coin.marker
    );

  }


  if(
    !Array.isArray(
      playerData.collected_coins
    )
  ){

    playerData.collected_coins = [];

  }


  if(
    !playerData.collected_coins.includes(
      coin.id
    )
  ){

    playerData.collected_coins.push(
      coin.id
    );

  }


  playerData.coins += 10;

  playerData.xp += 10;


  checkLevel();

  updateCoinDisplay();

  showToast(
    "🪙 COIN COLLECTED! +10"
  );


  setStatus(
    "🎮 Keep exploring!"
  );


  await savePlayer();

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

  if(!playerData)
    return;


  const required =
    playerData.level * 100;


  while(
    playerData.xp >=
    required
  ){

    playerData.xp -=
      required;

    playerData.level++;

    showToast(
      `🎉 LEVEL ${playerData.level}!`
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

async function savePlayer(){

  if(!playerData)
    return;


  const {
    error
  } =
    await supabase
      .from("players")
      .update({

        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        unlocked_skins:
          playerData.unlocked_skins,

        equipped_skin:
          playerData.equipped_skin,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        playerData.id
      );


  if(error){

    console.error(
      "Save error:",
      error
    );

    showToast(
      "⚠️ Save failed"
    );

  }

}


/* =========================================================
   DISPLAY
========================================================= */

function updateCoinDisplay(){

  coinsDisplay.textContent =
    `🪙 Coins: ${playerData?.coins || 0}`;

}


/* =========================================================
   SHOP
========================================================= */

document
  .getElementById("shopButton")
  .addEventListener(
    "click",
    ()=>{
      document
        .getElementById("shopOverlay")
        .style.display =
        "block";

      renderShop();
    }
  );


document
  .getElementById("closeShop")
  .addEventListener(
    "click",
    ()=>{
      document
        .getElementById("shopOverlay")
        .style.display =
        "none";
    }
  );


function renderShop(){

  if(!playerData)
    return;


  document
    .getElementById("shopBalance")
    .textContent =
    `🪙 Coins: ${playerData.coins}`;


  const container =
    document.getElementById(
      "shopItems"
    );


  container.innerHTML = "";


  for(
    const [id,skin] of
    Object.entries(SKINS)
  ){

    const unlocked =
      playerData.unlocked_skins
        .includes(id);


    const equipped =
      playerData.equipped_skin === id;


    const item =
      document.createElement(
        "div"
      );

    item.className =
      "shopItem";


    const preview =
      document.createElement(
        "div"
      );

    preview.className =
      "skinPreview";

    preview.style.background =
      skin.color;


    const info =
      document.createElement(
        "div"
      );

    info.className =
      "skinInfo";

    info.innerHTML =
      `<div class="skinName">${skin.name}</div>
       <div class="skinPrice">
       ${skin.price===0
          ?"FREE"
          :"🪙 "+skin.price}
       </div>`;


    const button =
      document.createElement(
        "button"
      );

    button.className =
      "shopAction";


    if(equipped){

      button.textContent =
        "EQUIPPED";

      button.disabled = true;

    }
    else if(unlocked){

      button.textContent =
        "EQUIP";

      button.onclick =
        ()=>equipSkin(id);

    }
    else if(
      playerData.coins >=
      skin.price
    ){

      button.textContent =
        "BUY";

      button.onclick =
        ()=>buySkin(id);

    }
    else{

      button.textContent =
        "NEED COINS";

      button.disabled = true;

    }


    item.append(
      preview,
      info,
      button
    );


    container.appendChild(
      item
    );

  }

}


async function buySkin(id){

  const skin =
    SKINS[id];


  if(!skin || !playerData)
    return;


  if(
    playerData.coins <
    skin.price
  )
    return;


  playerData.coins -=
    skin.price;


  playerData.unlocked_skins.push(
    id
  );


  playerData.equipped_skin =
    id;


  await savePlayer();


  updateCoinDisplay();

  updatePlayerIcon();

  renderShop();


  showToast(
    `🎨 ${skin.name} unlocked!`
  );

}


async function equipSkin(id){

  if(!playerData)
    return;


  if(
    !playerData.unlocked_skins.includes(
      id
    )
  )
    return;


  playerData.equipped_skin =
    id;


  await savePlayer();

  updatePlayerIcon();

  renderShop();


  showToast(
    `🎨 ${SKINS[id].name} equipped!`
  );

}


function updatePlayerIcon(){

  if(playerMarker){

    playerMarker.setIcon(
      createPlayerIcon()
    );

  }

}


/* =========================================================
   ACCOUNT
========================================================= */

document
  .getElementById("accountButton")
  .addEventListener(
    "click",
    ()=>{

      document
        .getElementById("accountEmail")
        .textContent =
        currentUser?.email ||
        "Unknown";

      document
        .getElementById("accountOverlay")
        .style.display =
        "block";

    }
  );


document
  .getElementById("closeAccount")
  .addEventListener(
    "click",
    ()=>{
      document
        .getElementById("accountOverlay")
        .style.display =
        "none";
    }
  );


document
  .getElementById("signOutButton")
  .addEventListener(
    "click",
    async ()=>{

      await supabase.auth.signOut();

      location.reload();

    }
  );


/* =========================================================
   START
========================================================= */

boot();

</script>
