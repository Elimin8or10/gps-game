<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>GPS Coin Game</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080b0f;
  font-family: Arial, sans-serif;
}

button,
input {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}


/* =========================================================
   LOADING SCREEN
   ========================================================= */

#loadingScreen {
  position: fixed;
  inset: 0;
  z-index: 99999;

  background:
    radial-gradient(
      circle at center,
      #18212b 0%,
      #080b0f 65%
    );

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 25px;

  transition:
    opacity 0.6s ease,
    visibility 0.6s ease;
}

#loadingScreen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loadingContent {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.gameLogo {
  font-size: 52px;
  margin-bottom: 8px;

  animation:
    logoFloat 2s ease-in-out infinite;
}

@keyframes logoFloat {

  0% {
    transform: translateY(0) scale(1);
  }

  50% {
    transform: translateY(-8px) scale(1.05);
  }

  100% {
    transform: translateY(0) scale(1);
  }

}

.loadingTitle {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 8px;
}

.loadingSubtitle {
  color: #9ba7b3;
  margin-bottom: 30px;
}

.loadingSpinner {
  width: 55px;
  height: 55px;

  margin: 0 auto 25px;

  border-radius: 50%;

  border:
    4px solid rgba(255,255,255,0.12);

  border-top-color: #00aaff;

  animation:
    spin 0.9s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}

.loadingText {
  color: #cbd5df;
  margin-bottom: 25px;
}

.modeChoice {
  display: none;
}

.modeChoice.show {
  display: block;
}

.modeQuestion {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 16px;
}

.modeButtons {
  display: flex;
  gap: 12px;
}

.modeSelect {
  flex: 1;

  border: 1px solid rgba(255,255,255,0.12);

  border-radius: 16px;

  padding: 18px 12px;

  color: white;

  background: #171d24;

  cursor: pointer;

  transition:
    transform 0.15s,
    background 0.15s,
    border 0.15s;
}

.modeSelect:active {
  transform: scale(0.96);
}

.modeSelect:hover {
  background: #202a34;
}

.modeSelect.selected {
  border-color: #00aaff;
  box-shadow:
    0 0 20px rgba(0,170,255,0.25);
}

.modeIcon {
  font-size: 28px;
  display: block;
  margin-bottom: 8px;
}

.modeName {
  font-weight: bold;
  font-size: 17px;
}

.modeDescription {
  display: block;
  color: #8f9ba7;
  font-size: 12px;
  margin-top: 5px;
}

.startButton {
  width: 100%;

  margin-top: 18px;

  padding: 16px;

  border: none;
  border-radius: 15px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #008cff,
      #00c6ff
    );

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 8px 30px rgba(0,150,255,0.3);
}

.startButton:active {
  transform: scale(0.97);
}


/* =========================================================
   AUTH
   ========================================================= */

#authScreen {
  position: fixed;
  inset: 0;
  z-index: 100000;

  background:
    radial-gradient(
      circle at center,
      #18212b,
      #080b0f 70%
    );

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.authBox {
  width: 100%;
  max-width: 390px;

  background: rgba(20,26,33,0.96);

  border:
    1px solid rgba(255,255,255,0.08);

  border-radius: 22px;

  padding: 25px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.6);
}

.authLogo {
  text-align: center;
  font-size: 45px;
  margin-bottom: 5px;
}

.authTitle {
  text-align: center;
  font-size: 27px;
  font-weight: 900;
}

.authSubtitle {
  text-align: center;
  color: #8f9ba7;
  margin:
    8px 0 22px;
}

.authInput {
  width: 100%;

  padding: 14px;

  margin-bottom: 10px;

  color: white;

  background: #0e1318;

  border:
    1px solid #2b343d;

  border-radius: 12px;

  outline: none;

  font-size: 16px;
}

.authInput:focus {
  border-color: #00aaff;
}

.authButton {
  width: 100%;

  padding: 14px;

  margin-top: 5px;

  border: none;
  border-radius: 12px;

  background: #008cff;

  color: white;

  font-weight: bold;
  font-size: 16px;

  cursor: pointer;
}

.authSwitch {
  margin-top: 18px;

  text-align: center;

  color: #8f9ba7;

  font-size: 14px;
}

.authSwitch button {
  border: none;
  background: none;

  color: #00aaff;

  font-weight: bold;

  cursor: pointer;
}

.authMessage {
  min-height: 20px;

  margin-top: 12px;

  text-align: center;

  font-size: 14px;
}


/* =========================================================
   HUD
   ========================================================= */

#hud {
  position: absolute;

  top: 15px;
  left: 15px;
  right: 15px;

  z-index: 1000;

  display: flex;
  gap: 8px;

  pointer-events: none;
}

.hudBox {
  background:
    rgba(10,15,20,0.94);

  color: white;

  padding: 10px 12px;

  border-radius: 12px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.4);

  font-weight: bold;

  pointer-events: auto;
}

#coinsDisplay {
  flex: 1;
}

#shopButton,
#modeButton,
#accountButton {
  cursor: pointer;
  user-select: none;
}


/* =========================================================
   ACCOUNT MENU
   ========================================================= */

#accountOverlay {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 5000;

  background: rgba(0,0,0,0.7);

  padding: 20px;
}

.accountBox {
  max-width: 400px;

  margin:
    80px auto;

  background: #151a20;

  color: white;

  border-radius: 20px;

  padding: 22px;
}

.accountHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.accountHeader h2 {
  margin: 0;
}

.closeButton {
  border: none;

  background: #333;

  color: white;

  border-radius: 10px;

  padding: 9px 13px;

  font-size: 18px;
}

.accountInfo {
  margin-top: 20px;

  background: #20262d;

  padding: 15px;

  border-radius: 14px;

  line-height: 1.7;
}

.signOutButton {
  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: none;

  border-radius: 12px;

  background: #d93636;

  color: white;

  font-weight: bold;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {
  position: absolute;

  bottom: 20px;

  left: 15px;
  right: 15px;

  z-index: 1000;

  background:
    rgba(10,15,20,0.95);

  color: white;

  padding: 12px;

  border-radius: 12px;

  text-align: center;

  font-weight: bold;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.4);

  pointer-events: none;
}


/* =========================================================
   PLAYER
   ========================================================= */

.player {
  width: 22px;
  height: 22px;

  border: 3px solid white;

  border-radius: 50%;

  box-shadow:
    0 0 8px var(--player-color),
    0 0 18px var(--player-color),
    0 0 30px var(--player-color);

  background:
    var(--player-color);
}


/* =========================================================
   COINS
   ========================================================= */

.coin {
  width: 28px;
  height: 28px;

  background:
    radial-gradient(
      circle at 35% 35%,
      #fffbd0 0%,
      #ffe44d 25%,
      #ffd000 55%,
      #f0a000 80%,
      #c87800 100%
    );

  border: 3px solid #fff4a3;

  border-radius: 50%;

  box-shadow:
    0 0 8px #ffd700,
    0 0 18px #ffb000,
    0 0 28px rgba(255,190,0,0.7);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 17px;

  animation:
    coinPulse 1.4s infinite;
}

@keyframes coinPulse {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.12);
  }

  100% {
    transform: scale(1);
  }

}


/* =========================================================
   SHOP
   ========================================================= */

#shopOverlay {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 4000;

  background:
    rgba(0,0,0,0.75);

  overflow-y: auto;

  padding: 20px;
}

#shop {
  max-width: 500px;

  margin:
    30px auto;

  background: #151a20;

  color: white;

  border-radius: 20px;

  padding: 20px;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.7);
}

#shopHeader {
  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom: 20px;
}

#shopHeader h2 {
  margin: 0;
}

#shopBalance {
  background:
    rgba(255,215,0,0.12);

  border:
    1px solid
    rgba(255,215,0,0.4);

  border-radius: 12px;

  padding: 12px;

  text-align: center;

  margin-bottom: 15px;

  font-weight: bold;
}

.shopItem {
  background: #20262d;

  border-radius: 15px;

  padding: 15px;

  margin-bottom: 12px;

  display: flex;

  align-items: center;

  gap: 15px;
}

.skinPreview {
  width: 42px;
  height: 42px;

  border: 4px solid white;

  border-radius: 50%;

  box-shadow:
    0 0 14px currentColor;

  flex-shrink: 0;
}

.skinInfo {
  flex: 1;
}

.skinName {
  font-weight: bold;

  font-size: 17px;

  margin-bottom: 4px;
}

.skinPrice {
  color: #ffd700;

  font-size: 14px;
}

.shopButton {
  border: none;

  border-radius: 10px;

  padding: 9px 12px;

  color: white;

  background: #0077cc;

  font-weight: bold;

  cursor: pointer;
}

.shopButton:disabled {
  opacity: 0.5;

  cursor: default;
}


/* =========================================================
   LEAFLET FIX
   ========================================================= */

/*
  This is the important fix for the zoom buttons.

  Leaflet's default control is moved down,
  below the HUD.
*/

.leaflet-top.leaflet-left {
  top: 82px;
}

.leaflet-control-zoom {
  margin-top: 0 !important;
}

@media (max-width: 600px) {

  .leaflet-top.leaflet-left {
    top: 82px;
  }

  #hud {
    top: 10px;
    left: 10px;
    right: 10px;
  }

  .hudBox {
    padding:
      9px 8px;

    font-size:
      12px;
  }

  #status {
    bottom: 12px;
    left: 10px;
    right: 10px;
  }

}

</style>

</head>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

const {
  createClient
} = supabase;

const supabaseClient =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GAME DATA
   ========================================================= */

const DEFAULT_PLAYER = {

  coins: 0,

  xp: 0,

  level: 1,

  unlocked_skins: [
    "blue"
  ],

  equipped_skin:
    "blue",

  collected_coins: []

};


let playerData = {
  ...DEFAULT_PLAYER
};


let currentUser = null;

let map = null;

let playerMarker = null;

let coins = [];

let gameMode =
  "PUBLIC";

let currentLatitude = null;

let currentLongitude = null;

let loadingTrail = false;

let gameStarted = false;


/* =========================================================
   SETTINGS
   ========================================================= */

const SEARCH_RADIUS =
  1200;

const COIN_SPACING =
  65;

const MAIN_COINS =
  8;

const BRANCH_COINS =
  4;

const COLLECTION_DISTANCE =
  18;

const REFRESH_DISTANCE =
  150;


const OVERPASS_SERVERS = [

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter"

];


/* =========================================================
   SKINS
   ========================================================= */

const SKINS = {

  blue: {
    name: "Blue",
    color: "#00aaff",
    price: 0
  },

  red: {
    name: "Red",
    color: "#ff3030",
    price: 50
  },

  green: {
    name: "Green",
    color: "#22dd55",
    price: 100
  },

  purple: {
    name: "Purple",
    color: "#aa55ff",
    price: 150
  },

  gold: {
    name: "Gold",
    color: "#ffd000",
    price: 250
  },

  pink: {
    name: "Pink",
    color: "#ff4fa3",
    price: 350
  }

};


/* =========================================================
   AUTH MESSAGE
   ========================================================= */

function authMessage(
  message,
  error = false
) {

  const element =
    document.getElementById(
      "authMessage"
    );

  element.innerText =
    message;

  element.style.color =
    error
      ? "#ff6666"
      : "#55dd88";

}


/* =========================================================
   SHOW LOGIN
   ========================================================= */

document.getElementById(
  "showLogin"
).addEventListener(
  "click",
  () => {

    document.getElementById(
      "signupForm"
    ).style.display =
      "none";

    document.getElementById(
      "loginForm"
    ).style.display =
      "block";

    authMessage("");

  }
);


/* =========================================================
   SHOW SIGNUP
   ========================================================= */

document.getElementById(
  "showSignup"
).addEventListener(
  "click",
  () => {

    document.getElementById(
      "loginForm"
    ).style.display =
      "none";

    document.getElementById(
      "signupForm"
    ).style.display =
      "block";

    authMessage("");

  }
);


/* =========================================================
   SIGN UP
   ========================================================= */

document.getElementById(
  "signupButton"
).addEventListener(
  "click",
  async () => {

    const username =
      document.getElementById(
        "signupUsername"
      ).value.trim();

    const email =
      document.getElementById(
        "signupEmail"
      ).value.trim();

    const password =
      document.getElementById(
        "signupPassword"
      ).value;


    if (!username) {

      authMessage(
        "Enter a username.",
        true
      );

      return;

    }


    if (username.length < 3) {

      authMessage(
        "Username must be at least 3 characters.",
        true
      );

      return;

    }


    if (!email) {

      authMessage(
        "Enter your email.",
        true
      );

      return;

    }


    if (password.length < 6) {

      authMessage(
        "Password must be at least 6 characters.",
        true
      );

      return;

    }


    const button =
      document.getElementById(
        "signupButton"
      );

    button.disabled =
      true;

    button.innerText =
      "CREATING...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email,

          password,

          options: {

            data: {
              username
            }

          }

        });


      if (error) {
        throw error;
      }


      /*
        If email confirmation is enabled,
        Supabase sends the email here.
      */

      if (
        data.user &&
        !data.session
      ) {

        authMessage(
          "Account created! Check your email to confirm your account."
        );

      } else {

        authMessage(
          "Account created!"
        );

      }


    } catch (error) {

      console.error(error);

      authMessage(
        error.message,
        true
      );

    }


    button.disabled =
      false;

    button.innerText =
      "CREATE ACCOUNT";

  }
);


/* =========================================================
   SIGN IN
   ========================================================= */

document.getElementById(
  "loginButton"
).addEventListener(
  "click",
  signIn
);


async function signIn() {

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if (!email || !password) {

    authMessage(
      "Enter your email and password.",
      true
    );

    return;

  }


  const button =
    document.getElementById(
      "loginButton"
    );

  button.disabled =
    true;

  button.innerText =
    "SIGNING IN...";


  try {

    const {
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email,

        password

      });


    if (error) {
      throw error;
    }


    authMessage(

}

/* =========================================================
   LOAD PLAYER FROM SUPABASE
   ========================================================= */

async function loadPlayer() {

  if (!currentUser) {
    return;
  }


  try {

    let {
      data,
      error
    } =
      await supabaseClient
        .from("players")
        .select("*")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (error) {
      throw error;
    }


    /*
      Normally your database trigger
      creates this automatically.
    */

    if (!data) {

      const {
        data: created,
        error: createError
      } =
        await supabaseClient
          .from("players")
          .insert({

            id:
              currentUser.id,

            username:
              currentUser.user_metadata?.username ||
              currentUser.email?.split("@")[0]

          })
          .select()
          .single();


      if (createError) {
        throw createError;
      }


      data =
        created;

    }


    playerData = {

      ...DEFAULT_PLAYER,

      ...data

    };


    /*
      Make sure arrays exist.
    */

    if (
      !Array.isArray(
        playerData.unlocked_skins
      )
    ) {

      playerData.unlocked_skins =
        ["blue"];

    }


    if (
      !Array.isArray(
        playerData.collected_coins
      )
    ) {

      playerData.collected_coins =
        [];

    }


    updateCoinDisplay();

    hideAuth();

    showLoadingScreen();

  } catch (error) {

    console.error(
      "Player loading error:",
      error
    );

    authMessage(
      "Couldn't load your player data: " +
      error.message,
      true
    );

  }

}


/* =========================================================
   SAVE PLAYER
   ========================================================= */

async function savePlayer() {

  if (!currentUser) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("players")
      .update({

        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        unlocked_skins:
          playerData.unlocked_skins,

        equipped_skin:
          playerData.equipped_skin,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        currentUser.id
      );


  if (error) {

    console.error(
      "Cloud save error:",
      error
    );

  }

}

/* =========================================================
   START MAP
   ========================================================= */

function startMap(
  latitude,
  longitude
) {

  if (map) {
    return;
  }


  map =
    L.map(
      "map",
      {
        zoomControl: true
      }
    ).setView(
      [
        latitude,
        longitude
      ],
      17
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

      attribution:
        "© OpenStreetMap contributors",

      maxZoom:
        20

    }
  ).addTo(map);


  createPlayer(
    latitude,
    longitude
  );


  currentLatitude =
    latitude;

  currentLongitude =
    longitude;


  /*
    Wait until Leaflet has finished
    rendering before loading paths.
  */

  setTimeout(
    () => {

      map.invalidateSize();

      loadTrail(
        latitude,
        longitude
      );

    },
    300
  );

}


/* =========================================================
   GPS UPDATE
   ========================================================= */

function updateLocation(
  position
) {

  const latitude =
    position.coords.latitude;

  const longitude =
    position.coords.longitude;


  if (!map) {

    startMap(
      latitude,
      longitude
    );

    return;

  }


  if (playerMarker) {

    playerMarker.setLatLng([
      latitude,
      longitude
    ]);

  }


  checkCoinCollection(
    latitude,
    longitude
  );


  if (
    currentLatitude !== null &&
    currentLongitude !== null
  ) {

    const distance =
      distanceMeters(
        currentLatitude,
        currentLongitude,
        latitude,
        longitude
      );


    if (
      distance >=
      REFRESH_DISTANCE
    ) {

      currentLatitude =
        latitude;

      currentLongitude =
        longitude;


      loadTrail(
        latitude,
        longitude
      );

    }

  }

}

/* =========================================================
   LOAD PATH
   ========================================================= */

async function loadTrail(
  latitude,
  longitude
) {

  if (loadingTrail) {
    return;
  }


  loadingTrail =
    true;


  setStatus(
    "🗺️ Finding nearby paths..."
  );


  removeUncollectedCoins();


  const latOffset =
    SEARCH_RADIUS / 111320;


  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        latitude *
        Math.PI /
        180
      )
    );


  const south =
    latitude -
    latOffset;

  const north =
    latitude +
    latOffset;

  const west =
    longitude -
    lonOffset;

  const east =
    longitude +
    lonOffset;


  /*
    This query asks Overpass for ways AND
    their geometry.

    Public mode gets walking-friendly paths.

    Unlimited mode gets almost all usable
    mapped roads while still avoiding highways.
  */

  let highwayFilter;


  if (
    gameMode ===
    "PUBLIC"
  ) {

    highwayFilter =
      `
        ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential"]
      `;

  } else {

    highwayFilter =
      `
        ["highway"]
      `;

  }


  const query = `

    [out:json][timeout:30];

    way
      ${highwayFilter}
      (${south},${west},${north},${east});

    out geom;

  `;


  let data =
    null;


  for (
    const server of
    OVERPASS_SERVERS
  ) {

    try {

      const response =
        await fetch(
          server,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded"

            },

            body:
              "data=" +
              encodeURIComponent(
                query
              )

          }
        );


      if (!response.ok) {
        throw new Error(
          "HTTP " +
          response.status
        );
      }


      data =
        await response.json();

      break;

    } catch (error) {

      console.log(
        "Overpass server failed:",
        server,
        error
      );

    }

  }


  if (!data) {

    setStatus(
      "⚠️ Path service unavailable. Try again."
    );

    loadingTrail =
      false;

    return;

  }


  const ways =
    filterWays(
      data.elements
    );


  if (
    ways.length === 0
  ) {

    setStatus(
      "🔎 No suitable paths nearby."
    );

    loadingTrail =
      false;

    return;

  }


  /*
    Find the nearest point on the
    actual road network.
  */

  const start =
    findClosestNetworkPoint(
      ways,
      latitude,
      longitude
    );


  if (!start) {

    setStatus(
      "🔎 Couldn't find a nearby path."
    );

    loadingTrail =
      false;

    return;

  }


  /*
    If the nearest mapped path is
    too far away, don't generate coins.
  */

  if (
    start.distance >
    150
  ) {

    setStatus(
      "🚶 Move closer to a mapped path."
    );

    loadingTrail =
      false;

    return;

  }


  const mainRoute =
    buildNetworkRoute(
      ways,
      start,
      MAIN_COINS
    );


  const branchRoute =
    findNetworkBranch(
      ways,
      mainRoute,
      start
    );


  let created =
    0;


  mainRoute.forEach(
    point => {

      const before =
        coins.length;

      createCoin(
        point.lat,
        point.lon
      );

      if (
        coins.length >
        before
      ) {
        created++;
      }

    }
  );


  branchRoute.forEach(
    point => {

      const before =
        coins.length;

      createCoin(
        point.lat,
        point.lon
      );

      if (
        coins.length >
        before
      ) {
        created++;
      }

    }
  );


  setStatus(
    created > 0
      ? "🎮 " +
        created +
        " coins discovered!"
      : "🔎 Keep exploring for new coins."
  );


  loadingTrail =
    false;

}


/* =========================================================
   FILTER WAYS
   ========================================================= */

function filterWays(
  elements
) {

  const result =
    [];


  elements.forEach(
    element => {

      if (
        element.type !==
        "way"
      ) {
        return;
      }


      if (
        !element.geometry ||
        element.geometry.length < 2
      ) {
        return;
      }


      const tags =
        element.tags ||
        {};


      const highway =
        tags.highway;


      if (!highway) {
        return;
      }


      const access =
        String(
          tags.access || ""
        ).toLowerCase();


      if (
        access === "private" ||
        access === "no" ||
        access === "permit" ||
        access === "customers"
      ) {
        return;
      }


      /*
        Never create game paths
        on major highways.
      */

      const forbidden = [

        "motorway",
        "motorway_link",
        "trunk",
        "trunk_link",
        "primary",
        "primary_link"

      ];


      if (
        forbidden.includes(
          highway
        )
      ) {
        return;
      }


      if (
        gameMode ===
        "PUBLIC"
      ) {

        const allowed = [

          "footway",
          "path",
          "pedestrian",
          "steps",
          "cycleway",
          "bridleway",
          "living_street",
          "residential"

        ];


        if (
          !allowed.includes(
            highway
          )
        ) {
          return;
        }

      }


      result.push({

        id:
          element.id,

        geometry:
          element.geometry,

        tags

      });

    }
  );


  return result;

}


/* =========================================================
   CLOSEST NETWORK POINT
   ========================================================= */

function findClosestNetworkPoint(
  ways,
  latitude,
  longitude
) {

  let best =
    null;


  ways.forEach(
    way => {

      way.geometry.forEach(
        (point, index) => {

          const distance =
            distanceMeters(
              latitude,
              longitude,
              point.lat,
              point.lon
            );


          if (
            !best ||
            distance <
            best.distance
          ) {

            best = {

              way,
              index,
              distance,
              point

            };

          }

        }
      );

    }
  );


  return best;

}


/* =========================================================
   BUILD ROUTE
   ========================================================= */

function buildNetworkRoute(
  ways,
  start,
  numberOfCoins
) {

  const route =
    [];


  let currentWay =
    start.way;

  let currentIndex =
    start.index;


  let direction =
    currentIndex <
    currentWay.geometry.length - 1
      ? 1
      : -1;


  let lastPoint =
    start.point;


  let accumulated =
    0;


  const visited =
    new Set();


  for (
    let safety = 0;
    safety < 100;
    safety++
  ) {

    if (
      route.length >=
      numberOfCoins
    ) {
      break;
    }


    const key =
      currentWay.id +
      ":" +
      currentIndex +
      ":" +
      direction;


    if (
      visited.has(key)
    ) {
      break;
    }


    visited.add(key);


    const nextIndex =
      currentIndex +
      direction;


    if (
      nextIndex < 0 ||
      nextIndex >=
      currentWay.geometry.length
    ) {

      const endpoint =
        currentWay.geometry[
          direction === 1
            ? currentWay.geometry.length - 1
            : 0
        ];


      const next =
        findConnectedWay(
          ways,
          endpoint,
          currentWay.id
        );


      if (!next) {
        break;
      }


      currentWay =
        next.way;

      currentIndex =
        next.index;

      direction =
        next.direction;

      lastPoint =
        currentWay.geometry[
          currentIndex
        ];

      continue;

    }


    const point =
      currentWay.geometry[
        nextIndex
      ];


    accumulated +=
      distanceMeters(
        lastPoint.lat,
        lastPoint.lon,
        point.lat,
        point.lon
      );


    if (
      accumulated >=
      COIN_SPACING
    ) {

      route.push({

        lat:
          point.lat,

        lon:
          point.lon

      });


      accumulated =
        0;

    }


    lastPoint =
      point;

    currentIndex =
      nextIndex;

  }


  return route;

}


/* =========================================================
   FIND CONNECTED WAY
   ========================================================= */

function findConnectedWay(
  ways,
  endpoint,
  currentWayId
) {

  let best =
    null;

  let bestDistance =
    40;


  ways.forEach(
    way => {

      if (
        way.id ===
        currentWayId
      ) {
        return;
      }


      const first =
        way.geometry[0];

      const last =
        way.geometry[
          way.geometry.length - 1
        ];


      const d1 =
        distanceMeters(
          endpoint.lat,
          endpoint.lon,
          first.lat,
          first.lon
        );


      const d2 =
        distanceMeters(
          endpoint.lat,
          endpoint.lon,
          last.lat,
          last.lon
        );


      if (
        d1 <= bestDistance
      ) {

        best = {

          way,
          index: 0,
          direction: 1

        };

        bestDistance =
          d1;

      }


      if (
        d2 <= bestDistance
      ) {

        best = {

          way,

          index:
            way.geometry.length - 1,

          direction: -1

        };

        bestDistance =
          d2;

      }

    }
  );


  return best;

}


/* =========================================================
   BRANCH
   ========================================================= */

function findNetworkBranch(
  ways,
  mainRoute,
  start
) {

  if (
    mainRoute.length <
    2
  ) {
    return [];
  }


  for (
    const routePoint of
    mainRoute
  ) {

    for (
      const way of
      ways
    ) {

      if (
        way.id ===
        start.way.id
      ) {
        continue;
      }


      const first =
        way.geometry[0];

      const last =
        way.geometry[
          way.geometry.length - 1
        ];


      const firstDistance =
        distanceMeters(
          routePoint.lat,
          routePoint.lon,
          first.lat,
          first.lon
        );


      const lastDistance =
        distanceMeters(
          routePoint.lat,
          routePoint.lon,
          last.lat,
          last.lon
        );


      if (
        firstDistance <=
        40
      ) {

        return buildBranch(
          way,
          0,
          1
        );

      }


      if (
        lastDistance <=
        40
      ) {

        return buildBranch(
          way,
          way.geometry.length - 1,
          -1
        );

      }

    }

  }


  return [];

}


/* =========================================================
   BUILD BRANCH
   ========================================================= */

function buildBranch(
  way,
  startIndex,
  direction
) {

  const result =
    [];


  let accumulated =
    0;


  let lastPoint =
    way.geometry[
      startIndex
    ];


  for (
    let step = 1;
    step < way.geometry.length;
    step++
  ) {

    const index =
      startIndex +
      step *
      direction;


    if (
      index < 0 ||
      index >=
      way.geometry.length
    ) {
      break;
    }


    const point =
      way.geometry[index];


    accumulated +=
      distanceMeters(
        lastPoint.lat,
        lastPoint.lon,
        point.lat,
        point.lon
      );


    if (
      accumulated >=
      COIN_SPACING
    ) {

      result.push({

        lat:
          point.lat,

        lon:
          point.lon

      });


      accumulated =
        0;


      if (
        result.length >=
        BRANCH_COINS
      ) {
        break;
      }

    }


    lastPoint =
      point;

  }


  return result;

}


/* =========================================================
   CREATE COIN
   ========================================================= */

function createCoin(
  latitude,
  longitude
) {

  const id =
    makeCoinId(
      latitude,
      longitude
    );


  if (
    playerData.collected_coins.includes(
      id
    )
  ) {
    return;
  }


  for (
    const existing of
    coins
  ) {

    if (
      distanceMeters(
        latitude,
        longitude,
        existing.latitude,
        existing.longitude
      ) < 20
    ) {
      return;
    }

  }


  const icon =
    L.divIcon({

      className: "",

      html:
        '<div class="coin">🪙</div>',

      iconSize:
        [34,34],

      iconAnchor:
        [17,17]

    });


  const marker =
    L.marker(
      [
        latitude,
        longitude
      ],
      {
        icon
      }
    ).addTo(map);


  coins.push({

    id,

    marker,

    latitude,

    longitude,

    collected:
      false

  });

}


/* =========================================================
   COIN ID
   ========================================================= */

function makeCoinId(
  latitude,
  longitude
) {

  return (

    Math.round(
      latitude * 100000
    ) +

    "_" +

    Math.round(
      longitude * 100000
    )

  );

}


/* =========================================================
   REMOVE UNCOLLECTED
   ========================================================= */

function removeUncollectedCoins() {

  const remaining =
    [];


  coins.forEach(
    coin => {

      if (
        coin.collected
      ) {

        remaining.push(
          coin
        );

      } else {

        if (
          map &&
          map.hasLayer(
            coin.marker
          )
        ) {

          map.removeLayer(
            coin.marker
          );

        }

      }

    }
  );


  coins =
    remaining;

}


/* =========================================================
   CHECK COLLECTION
   ========================================================= */

function checkCoinCollection(
  latitude,
  longitude
) {

  coins.forEach(
    coin => {

      if (
        coin.collected
      ) {
        return;
      }


      const distance =
        distanceMeters(
          latitude,
          longitude,
          coin.latitude,
          coin.longitude
        );


      if (
        distance <=
        COLLECTION_DISTANCE
      ) {

        collectCoin(
          coin
        );

      }

    }
  );

}


/* =========================================================
   COLLECT COIN
   ========================================================= */

async function collectCoin(
  coin
) {

  coin.collected =
    true;


  if (
    map.hasLayer(
      coin.marker
    )
  ) {

    map.removeLayer(
      coin.marker
    );

  }


  if (
    !playerData.collected_coins.includes(
      coin.id
    )
  ) {

    playerData.collected_coins.push(
      coin.id
    );

  }


  playerData.coins +=
    10;


  playerData.xp +=
    10;


  /*
    Every 100 XP = level up.
  */

  const newLevel =
    Math.floor(
      playerData.xp / 100
    ) + 1;


  if (
    newLevel >
    playerData.level
  ) {

    playerData.level =
      newLevel;


    setStatus(
      "🎉 LEVEL " +
      playerData.level +
      "!"
    );

  } else {

    setStatus(
      "🪙 COIN COLLECTED! +10"
    );

  }


  updateCoinDisplay();

  await savePlayer();


  setTimeout(
    () => {

      setStatus(
        "🎮 KEEP EXPLORING"
      );

    },
    2000
  );

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}

/* =========================================================
   RENDER SHOP
   ========================================================= */

function renderShop() {

  document.getElementById(
    "shopBalance"
  ).innerText =
    "🪙 Coins: " +
    playerData.coins;


  const container =
    document.getElementById(
      "shopItems"
    );


  container.innerHTML =
    "";


  Object.keys(
    SKINS
  ).forEach(
    id => {

      const skin =
        SKINS[id];


      const unlocked =
        playerData.unlocked_skins.includes(
          id
        );


      const equipped =
        playerData.equipped_skin ===
        id;


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "shopItem";


      item.innerHTML = `

        <div
          class="skinPreview"
          style="
            background:${skin.color};
            color:${skin.color};
          "
        ></div>

        <div class="skinInfo">

          <div class="skinName">
            ${skin.name}
          </div>

          <div class="skinPrice">

            ${
              skin.price === 0
                ? "FREE"
                : "🪙 " +
                  skin.price
            }

          </div>

        </div>

        <button
          class="shopButton"
        ></button>

      `;


      const button =
        item.querySelector(
          ".shopButton"
        );


      if (
        equipped
      ) {

        button.innerText =
          "EQUIPPED";

        button.disabled =
          true;

      } else if (
        unlocked
      ) {

        button.innerText =
          "EQUIP";


        button.onclick =
          () => {

            equipSkin(
              id
            );

          };

      } else if (
        playerData.coins >=
        skin.price
      ) {

        button.innerText =
          "BUY";


        button.onclick =
          () => {

            buySkin(
              id
            );

          };

      } else {

        button.innerText =
          "NEED COINS";

        button.disabled =
          true;

      }


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   BUY SKIN
   ========================================================= */

async function buySkin(
  id
) {

  const skin =
    SKINS[id];


  if (!skin) {
    return;
  }


  if (
    playerData.unlocked_skins.includes(
      id
    )
  ) {
    return;
  }


  if (
    playerData.coins <
    skin.price
  ) {
    return;
  }


  playerData.coins -=
    skin.price;


  playerData.unlocked_skins.push(
    id
  );


  playerData.equipped_skin =
    id;


  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();

  await savePlayer();


  setStatus(
    "🎨 " +
    skin.name +
    " unlocked!"
  );

}


/* =========================================================
   EQUIP SKIN
   ========================================================= */

async function equipSkin(
  id
) {

  if (
    !playerData.unlocked_skins.includes(
      id
    )
  ) {
    return;
  }


  playerData.equipped_skin =
    id;


  updatePlayerSkin();

  renderShop();

  await savePlayer();


  setStatus(
    "🎨 " +
    SKINS[id].name +
    " equipped!"
  );

}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
