<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GPS Coin Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #080b10;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }

    #map {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;

    }


    /* =====================================================
       LOADING SCREEN
       ===================================================== */

    #loadingScreen {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #172333 0%,
          #080b10 70%
        );

      color: white;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

    }

    #loadingScreen.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }

    .loadingContent {

      width: min(90%, 430px);

      text-align: center;

    }

    .gameLogo {

      font-size: 64px;

      margin-bottom: 8px;

      animation:
        logoFloat 2s ease-in-out infinite;

    }

    @keyframes logoFloat {

      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0);
      }

    }

    .gameTitle {

      margin: 0;

      font-size: 36px;

      font-weight: 900;

      letter-spacing: -1px;

    }

    .gameSubtitle {

      margin-top: 8px;

      color: #9ca9b8;

      font-size: 15px;

    }

    .loadingBar {

      width: 100%;

      height: 7px;

      margin-top: 30px;

      overflow: hidden;

      border-radius: 20px;

      background: #202a35;

    }

    .loadingBarInner {

      width: 20%;

      height: 100%;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #00aaff,
          #66ddff
        );

      transition:
        width 0.4s ease;

      box-shadow:
        0 0 15px #00aaff;

    }

    #loadingText {

      margin-top: 14px;

      min-height: 20px;

      color: #b9c5d2;

      font-size: 14px;

    }


    /* =====================================================
       MODE SELECT
       ===================================================== */

    #modeSelect {

      display: none;

      margin-top: 30px;

      animation:
        modeAppear 0.5s ease;

    }

    @keyframes modeAppear {

      from {

        opacity: 0;

        transform:
          translateY(15px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }

    .modeTitle {

      font-size: 19px;

      font-weight: bold;

      margin-bottom: 15px;

    }

    .modeButtons {

      display: flex;

      gap: 12px;

    }

    .modeChoice {

      flex: 1;

      border: 1px solid #354352;

      border-radius: 18px;

      padding: 18px 12px;

      background: #151d26;

      color: white;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s,
        border 0.15s;

    }

    .modeChoice:active {

      transform: scale(0.96);

    }

    .modeChoice:hover {

      background: #1d2935;

      border-color: #00aaff;

    }

    .modeIcon {

      font-size: 32px;

      margin-bottom: 8px;

    }

    .modeName {

      font-weight: 800;

      font-size: 16px;

    }

    .modeDescription {

      margin-top: 5px;

      color: #8e9aaa;

      font-size: 12px;

      line-height: 1.4;

    }


    /* =====================================================
       HUD
       ===================================================== */

    #hud {

      position: absolute;

      top: env(safe-area-inset-top, 12px);

      left: 12px;
      right: 12px;

      z-index: 1000;

      display: flex;

      gap: 8px;

      pointer-events: none;

    }

    .hudBox {

      min-height: 44px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        10px 13px;

      border-radius: 14px;

      background:
        rgba(8, 13, 19, 0.94);

      color: white;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.35);

      backdrop-filter:
        blur(10px);

      font-weight: bold;

      white-space: nowrap;

      pointer-events: auto;

    }

    #coinsDisplay {

      flex: 1;

      justify-content: flex-start;

    }

    #shopButton,
    #modeButton,
    #accountButton {

      cursor: pointer;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      position: absolute;

      left: 15px;
      right: 15px;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom, 0px)
        );

      z-index: 1000;

      padding: 12px 15px;

      border-radius: 14px;

      background:
        rgba(8,13,19,0.94);

      color: white;

      text-align: center;

      font-size: 14px;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.35);

      pointer-events: none;

    }


    /* =====================================================
       PLAYER
       ===================================================== */

    .player {

      width: 22px;
      height: 22px;

      border: 3px solid white;

      border-radius: 50%;

      background:
        var(--player-color);

      box-shadow:
        0 0 8px var(--player-color),
        0 0 18px var(--player-color),
        0 0 30px var(--player-color);

    }


    /* =====================================================
       COINS
       ===================================================== */

    .coin {

      width: 28px;
      height: 28px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border:
        3px solid #fff4a3;

      background:
        radial-gradient(
          circle at 35% 35%,
          #fffbd0 0%,
          #ffe44d 25%,
          #ffd000 55%,
          #f0a000 80%,
          #c87800 100%
        );

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255,190,0,0.7);

      font-size: 16px;

      animation:
        coinPulse 1.4s infinite;

    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.13);
      }

      100% {
        transform: scale(1);
      }

    }


    /* =====================================================
       SHOP
       ===================================================== */

    #shopOverlay {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 5000;

      padding: 20px;

      overflow-y: auto;

      background:
        rgba(0,0,0,0.78);

    }

    #shop {

      width: min(500px, 100%);

      margin:
        30px auto;

      padding: 20px;

      border-radius: 20px;

      background: #151a20;

      color: white;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.7);

    }

    #shopHeader {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;

    }

    #shopHeader h2 {

      margin: 0;

    }

    #closeShop {

      border: none;

      border-radius: 10px;

      padding: 9px 13px;

      background: #333;

      color: white;

      font-size: 18px;

      cursor: pointer;

    }

    #shopBalance {

      margin-bottom: 15px;

      padding: 12px;

      border-radius: 12px;

      text-align: center;

      font-weight: bold;

      background:
        rgba(255,215,0,0.12);

      border:
        1px solid rgba(255,215,0,0.4);

    }

    .shopItem {

      display: flex;

      align-items: center;

      gap: 15px;

      margin-bottom: 12px;

      padding: 15px;

      border-radius: 15px;

      background: #20262d;

    }

    .skinPreview {

      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border:
        4px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 14px currentColor;

    }

    .skinInfo {

      flex: 1;

    }

    .skinName {

      margin-bottom: 4px;

      font-size: 17px;

      font-weight: bold;

    }

    .skinPrice {

      color: #ffd700;

      font-size: 14px;

    }

    .shopAction {

      border: none;

      border-radius: 10px;

      padding: 9px 12px;

      background: #0077cc;

      color: white;

      font-weight: bold;

      cursor: pointer;

    }

    .shopAction:disabled {

      opacity: .5;

      cursor: default;

    }


    /* =====================================================
       ACCOUNT
       ===================================================== */

    #accountOverlay {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 6000;

      padding: 20px;

      overflow-y: auto;

      background:
        rgba(0,0,0,0.8);

    }

    #accountPanel {

      width: min(450px,100%);

      margin: 40px auto;

      padding: 24px;

      border-radius: 20px;

      background: #151a20;

      color: white;

    }

    #accountPanel h2 {

      margin-top: 0;

    }

    .accountEmail {

      padding: 12px;

      margin-bottom: 15px;

      border-radius: 12px;

      background: #20262d;

      color: #b9c5d2;

      word-break: break-all;

    }

    .accountButton {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 13px;

      margin-top: 10px;

      background: #0077cc;

      color: white;

      font-weight: bold;

      cursor: pointer;

    }

    .accountButton.danger {

      background: #a83232;

    }


    /* =====================================================
       TOAST
       ===================================================== */

    #toast {

      position: fixed;

      left: 50%;

      bottom: 90px;

      z-index: 10000;

      transform:
        translateX(-50%)
        translateY(20px);

      padding: 13px 18px;

      border-radius: 14px;

      background: #101820;

      color: white;

      box-shadow:
        0 8px 30px rgba(0,0,0,.45);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .25s,
        transform .25s;

      font-weight: bold;

      white-space: nowrap;

    }

    #toast.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);

    }


    /* =====================================================
       LEAFLET POSITION
       ===================================================== */

    .leaflet-top {

      top: 75px;

    }

    .leaflet-left {

      left: 12px;

    }

    .leaflet-control-zoom {

      margin-top: 8px !important;

    }

    .leaflet-control-zoom a {

      width: 40px !important;
      height: 40px !important;

      line-height: 40px !important;

      font-size: 20px !important;

    }

    .leaflet-control-attribution {

      font-size: 9px;

    }

  </style>

</head>

<body>


  <!-- =====================================================
       LOADING SCREEN
       ===================================================== -->

  <div id="loadingScreen">

    <div class="loadingContent">

      <div class="gameLogo">
        🪙
      </div>

      <h1 class="gameTitle">
        GPS COIN
      </h1>

      <div class="gameSubtitle">
        Explore. Collect. Level up.
      </div>

      <div class="loadingBar">

        <div
          id="loadingBarInner"
          class="loadingBarInner"
        ></div>

      </div>

      <div id="loadingText">
        Starting game...
      </div>


      <div id="modeSelect">

        <div class="modeTitle">
          Choose your game mode
        </div>

        <div class="modeButtons">

          <button
            class="modeChoice"
            id="publicMode"
          >

            <div class="modeIcon">
              🌎
            </div>

            <div class="modeName">
              PUBLIC
            </div>

            <div class="modeDescription">
              Stay on mapped public paths.
            </div>

          </button>


          <button
            class="modeChoice"
            id="unlimitedMode"
          >

            <div class="modeIcon">
              🔓
            </div>

            <div class="modeName">
              UNLIMITED
            </div>

            <div class="modeDescription">
              Use a wider range of mapped paths.
            </div>

          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       HUD
       ===================================================== -->

  <div id="hud">

    <div
      id="coinsDisplay"
      class="hudBox"
    >
      🪙 Coins: 0
    </div>

    <div
      id="shopButton"
      class="hudBox"
    >
      🛒
    </div>

    <div
      id="accountButton"
      class="hudBox"
    >
      👤
    </div>

  </div>


  <!-- =====================================================
       MAP
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       STATUS
       ===================================================== -->

  <div id="status">
    📍 Finding your location...
  </div>


  <!-- =====================================================
       SHOP
       ===================================================== -->

  <div id="shopOverlay">

    <div id="shop">

      <div id="shopHeader">

        <h2>
          🛒 Player Shop
        </h2>

        <button id="closeShop">
          ✕
        </button>

      </div>

      <div id="shopBalance">
        🪙 Coins: 0
      </div>

      <div id="shopItems"></div>

    </div>

  </div>


  <!-- =====================================================
       ACCOUNT
       ===================================================== -->

  <div id="accountOverlay">

    <div id="accountPanel">

      <h2>
        👤 Account
      </h2>

      <div
        id="accountEmail"
        class="accountEmail"
      >
        Loading...
      </div>

      <button
        id="signOutButton"
        class="accountButton danger"
      >
        Sign Out
      </button>

      <button
        id="closeAccount"
        class="accountButton"
      >
        Close
      </button>

    </div>

  </div>


  <div id="toast"></div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


<script
  type="module"
  src="/src/game.ts"
></script>

</body>

</html>
