import {

from

/* =====================================================

const SUPABASE_KEY =
"sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

"https://elimin8or10.github.io/gps-game/";


const supabase =
createClient(
 SUPABASE_URL,

/* =====================================================

let user=null;
let player=null;

let map=null;
let playerMarker=null;

let gpsWatch=null;

let gameMode="PUBLIC";

let coins=[];

let lastGPSLat=null;
let lastGPSLon=null;

let lastRoadCheck=0;

let loadingTrail=false;

let currentRoad=null;

let roadLayer=null;


/* =====================================================
 SETTINGS
 ===================================================== */

const SEARCH_RADIUS=1000;

/*
 Distance between coins.
 */
const COIN_SPACING=50;

/*
 Player only has to get this close to collect.
 */
const COLLECTION_DISTANCE=25;

/*
 Rebuild road route after moving this far.
 */
const ROUTE_REFRESH_DISTANCE=75;

/*
 IMPORTANT:

 This is how close two OSM road endpoints
 have to be before we consider them connected.

 Increased from the old 18m.

const CONNECTION_DISTANCE=35;


/* =====================================================
 SKINS

const skins={

 blue:{

 },

 red:{
  name:"Red",
  color:"#ff3030",

 green:{

 },

 purple:{

 gold:{

/* =====================================================

const loginScreen=

const modeScreen=

/* =====================================================
 LOGIN

 AUTH
 ===================================================== */

async function checkAuth(){

 setLoading(
  "Checking account...",
  20
 );

 const {
  data,
  error
 }=
 await supabase.auth.getSession();

 if(error)

 if(data.session?.user){

supabase.auth.onAuthStateChange(

/* =====================================================
 PLAYER
 ===================================================== */

async function loadPlayer(){

 if(!user)
 return;

 const {
  data,
  error
 }=
 await supabase

 .from("players")

 .select("*")

 .eq(

  user.id
 )

 if(error){

 }


 if(!data){

  const {
   data:newPlayer,
   error:createError
  }=
  await supabase

  .from("players")

  .insert({

   id:user.id,

   coins:0,

   xp:0,

   level:1,

   unlocked_skins:[
    "blue"
   ],

   equipped_skin:
   "blue",

  })

  .select()

  if(createError){

   );

  }

  player=
  newPlayer;

 }else{

  player=
  data;

 }


 if(!Array.isArray(
  player.collected_coins
 ))
 player.collected_coins=[];


 if(!Array.isArray(
  player.unlocked_skins
 ))
 player.unlocked_skins=[
  "blue"
 ];


 updateCoins();

}


/* =====================================================
 MODE
 ===================================================== */

function showMode(){

 loadingScreen.style.display=
 "none";

 modeScreen.style.display=
 "flex";

}


document
.getElementById("publicMode")

 "click",
 ()=>{
  chooseMode("PUBLIC");

function chooseMode(mode){

 modeScreen.style.display=
 "none";

 loadingScreen.style.display=

 setLoading(
  "Requesting your location...",
  15
 );

/* =====================================================
 LOADING
 ===================================================== */

function setLoading(
 text,
 percent
){

 loadingText.textContent=
 text;

 loadingBar.style.width=

}


/* =====================================================
 GPS
 ===================================================== */

function startGPS(){

 if(gpsWatch!==null)
 return;

 if(!navigator.geolocation){

  status.textContent=
  "❌ GPS isn't supported.";

  return;

 }


 status.textContent=
 "📍 Requesting location permission...";


 /*
 FIRST REQUEST

 This guarantees the browser actually
 prompts for location permission.
 */

 navigator.geolocation.getCurrentPosition(

  position=>{

   handleGPS(
    position
   );

  },

  error=>{

   console.error(
    "Initial GPS error:",
    error
   );

   gpsError(
    error
   );

  },

  {
   enableHighAccuracy:true,
   timeout:20000,
   maximumAge:0
  }

 );


 /*
 CONTINUOUS GPS
 */

 gpsWatch=
 navigator.geolocation.watchPosition(

  handleGPS,

  gpsError,

  {
   enableHighAccuracy:true,
   maximumAge:2000,
   timeout:20000
  }

 );

}


/* =====================================================
 GPS HANDLER
 ===================================================== */

function handleGPS(position){

 const lat=
 position.coords.latitude;

 const lon=
 position.coords.longitude;

 if(
  !Number.isFinite(lat) ||
  !Number.isFinite(lon)
 )
 return;


 if(!map){

  startGame(
   lat,
   lon
  );

  return;

 }


 if(playerMarker){

  playerMarker.setLatLng([
   lat,
   lon
  ]);

 }


 /*
 ALWAYS update road status.
 */

 updateRoadStatus(
  lat,
  lon
 );


 /*
 CHECK COINS EVERY GPS UPDATE.
 */

 checkCollection(
  lat,
  lon
 );


 /*
 Rebuild route after enough movement.
 */

 if(
  lastGPSLat!==null &&
  lastGPSLon!==null
 ){

  const moved=
  distance(
   lastGPSLat,
   lastGPSLon,
   lat,
   lon
  );


  if(
   moved>=
   ROUTE_REFRESH_DISTANCE
  ){

   lastGPSLat=
   lat;

   lastGPSLon=
   lon;

   loadTrail(
    lat,
    lon
   );

  }

 }else{

  lastGPSLat=
  lat;

  lastGPSLon=
  lon;

 }

}


/* =====================================================
 GPS ERROR
 ===================================================== */

function gpsError(error){

 console.error(
  "GPS ERROR:",
  error
 );

 if(
  error.code===1
 ){

  status.textContent=
  "📍 Location denied. Enable Location for this website.";

 }else if(
  error.code===2
 ){

  status.textContent=
  "📍 Location unavailable. Waiting...";

 }else{

  status.textContent=
  "📍 GPS still searching...";

 }

}

 START GAME
 ===================================================== */

function startGame(
 lat,
 lon
){

 if(map)
 return;


 setLoading(
  "Loading map...",
  50
 );


 map=
 L.map(
  "map",
  {

  }
 )

  17

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

   attribution:

  }

 .addTo(map);


 lastGPSLat=
 lat;

 lastGPSLon=

 createPlayer(

 );


 loadingBar.style.width=

 loadingText.textContent=
 "Finding your nearest road...";


 setTimeout(
  ()=>{
   loadingScreen.style.display=
   "none";
  },

 );


 loadTrail(
  lat,
  lon
 );

}

 PLAYER
 ===================================================== */

 lat,

){

 const skin=
 skins[

 ];


 playerMarker=
 L.marker(

    ">

}


/* =====================================================
 OVERPASS
 ===================================================== */

async function getWays(
 lat,
 lon
){

 const latOffset=
 SEARCH_RADIUS/
 111320;


 const lonOffset=
 SEARCH_RADIUS/
 (
  111320*
  Math.cos(
   lat*
   Math.PI/
   180
  )
 );


 const south=
 lat-
 latOffset;

 const north=
 lat+
 latOffset;

 const west=
 lon-
 lonOffset;

 const east=
 lon+
 lonOffset;


 const query=`

 [out:json][timeout:25];

 way["highway"]
 (${south},${west},${north},${east});

 out tags geom;

 `;


 const servers=[

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter"

 ];


 for(
  const server of
  servers
 ){

  try{

   const response=
   await fetch(
    server,
    {
     method:"POST",

     headers:{
      "Content-Type":
      "application/x-www-form-urlencoded"
     },

     body:
     "data="+
     encodeURIComponent(
      query
     )
    }
   );


   if(!response.ok)
   continue;


   const data=
   await response.json();


   return filterWays(
    data.elements||
    []
   );

  }catch(error){

   console.error(
    "Overpass error:",
    error
   );

  }

 }


 return [];

}


/* =====================================================
 ROAD FILTER
 ===================================================== */

function filterWays(
 elements
){

 const publicRoads=[

  "footway",
  "path",
  "pedestrian",
  "steps",
  "cycleway",
  "bridleway",
  "living_street",
  "residential",
  "unclassified",
  "service"

 ];


 const unlimitedRoads=[

  ...publicRoads,

  "tertiary",
  "tertiary_link",
  "secondary",
  "secondary_link"

 ];


 const allowed=
 gameMode==="PUBLIC"
 ?
 publicRoads
 :
 unlimitedRoads;


 return elements

 .filter(
  element=>

   element.type==="way" &&

   Array.isArray(
    element.geometry
   ) &&

   element.geometry.length>=2 &&

   allowed.includes(
    element.tags?.highway
   )

 )

 .filter(
  element=>{

   const access=
   String(
    element.tags?.access||
    ""
   ).toLowerCase();


   return ![
    "private",
    "no",
    "permit",
    "customers"
   ].includes(access);

  }
 )

 .map(
  element=>({

   id:
   element.id,

   geometry:
   element.geometry,

   tags:
   element.tags||{}

  })
 );

}


/* =====================================================
 CLOSEST POINT ON ROAD SEGMENT
 ===================================================== */

/*
 THIS IS THE BIG FIX.

 The old code only checked:

 road vertex -> player

 This checks:

 player -> every actual road segment

 So if you're 20m beside a road,
 the game can still recognize it.
 */

function closestPointOnSegment(
 lat,
 lon,
 a,
 b
){

 const latScale=
 111320;

 const lonScale=
 111320*
  Math.cos(
   lat*
   Math.PI/
   180
  );


 const ax=
 (a.lon-lon)*
 lonScale;

 const ay=
 (a.lat-lat)*
 latScale;

 const bx=
 (b.lon-lon)*
 lonScale;

 const by=
 (b.lat-lat)*
 latScale;


 const dx=
 bx-ax;

 const dy=
 by-ay;


 const lengthSquared=
 dx*dx+
 dy*dy;


 let t=0;


 if(
  lengthSquared>0
 ){

  t=
  -(ax*dx+ay*dy)/
  lengthSquared;

  t=
  Math.max(
   0,
   Math.min(
    1,
    t
   )
  );

 }


 const x=
 ax+
 dx*t;

 const y=
 ay+
 dy*t;


 const resultLat=
 lat+
 y/
 latScale;


 const resultLon=
 lon+
 x/
 lonScale;


 const d=
 Math.sqrt(
  x*x+
  y*y
 );


 return {

  lat:
  resultLat,

  lon:
  resultLon,

  distance:
  d,

  t

 };

}


/* =====================================================
 FIND CLOSEST ROAD
 ===================================================== */

function findClosestRoad(
 ways,
 lat,
 lon
){

 let best=null;


 for(
  const way of
  ways
 ){

  for(
   let i=0;
   i<
   way.geometry.length-1;
   i++
  ){

   const a=
   way.geometry[i];

   const b=
   way.geometry[i+1];


   const point=
   closestPointOnSegment(
    lat,
    lon,
    a,
    b
   );


   if(
    !best ||
    point.distance<
    best.distance
   ){

    best={

     way,

     segmentIndex:i,

     point,

     distance:
     point.distance

    };

   }

  }

 }


 return best;

}


/* =====================================================
 LOAD TRAIL
 ===================================================== */

async function loadTrail(
 lat,
 lon
){

 if(
  loadingTrail
 )
 return;


 loadingTrail=
 true;


 status.textContent=
 "🗺️ Finding your nearest connected road...";


 removeCoins();


 try{

  const ways=
  await getWays(
   lat,
   lon
  );


  if(!ways.length){

   status.textContent=
   "❌ No mapped roads nearby.";

   loadingTrail=
   false;

   return;

  }


  /*
   Find actual closest segment.
  */

  const nearest=
  findClosestRoad(
   ways,
   lat,
   lon
  );


  if(!nearest){

   status.textContent=
   "❌ Couldn't locate a road.";

   loadingTrail=
   false;

   return;

  }


  currentRoad=
  nearest.way;


  /*
   If road is extremely far away,
   tell player instead of putting
   coins somewhere random.
  */

  if(
   nearest.distance>
   300
  ){

   status.textContent=
   `🛣️ Nearest mapped road is ${Math.round(nearest.distance)}m away`;

   loadingTrail=
   false;

   return;

  }


  /*
   Build route starting from the
   exact segment nearest the player.
  */

  const network=
  buildRoadNetwork(
   ways,
   nearest
  );


  if(
   network.length<2
  ){

   status.textContent=
   `🛣️ Road found ${Math.round(nearest.distance)}m away`;

   loadingTrail=
   false;

   return;

  }


  const coinPoints=
  makeCoinPoints(
   network
  );


  for(
   const point of
   coinPoints
  ){

   createCoin(
    point.lat,
    point.lon
   );

  }


  status.textContent=
  `🛣️ Road ${Math.round(nearest.distance)}m away • 🪙 ${coins.length} coins`;


 }catch(error){

  console.error(
   "TRAIL ERROR:",
   error
  );

  status.textContent=
  "⚠️ Couldn't load nearby roads.";

 }


 loadingTrail=
 false;

}


/* =====================================================
 BUILD CONNECTED ROAD NETWORK
 ===================================================== */

function buildRoadNetwork(
 ways,
 start
){

 const result=[];


 const used=
 new Set();


 /*
  Start at the exact point nearest
  to the player.
 */

 result.push({
  lat:start.point.lat,
  lon:start.point.lon
 });


 const way=
 start.way;

 used.add(
  way.id
 );


 /*
  Follow forward from the nearest
  segment.
 */

 followWay(
  result,
  way,
  start.segmentIndex+1,
  1
 );


 /*
  Then follow backward too.

  This means coins can appear in
  both directions on the player's
  actual road.
 */

 const backwards=[];


 backwards.push({
  lat:start.point.lat,
  lon:start.point.lon
 });


 followWayBackward(
  backwards,
  way,
  start.segmentIndex
 );


 /*
  Reverse backwards and combine.
 */

 backwards.reverse();


 const combined=
 [
  ...backwards,
  ...result.slice(1)
 ];


 /*
  Now continue through connected
  road segments.

  We only connect ways whose endpoints
  are physically close.
 */

 let changed=true;

 let loops=0;


 while(
  changed &&
  loops<15
 ){

  changed=false;
  loops++;


  const end=
  combined[
   combined.length-1
  ];


  const connection=
  findConnectedWay(
   ways,
   end,
   used
  );


  if(connection){

   used.add(
    connection.way.id
   );

   followWay(
    combined,
    connection.way,
    connection.index,
    connection.direction
   );

   changed=true;

  }

 }


 return combined;

}


/* =====================================================
 FOLLOW WAY
 ===================================================== */

function followWay(
 result,
 way,
 startIndex,
 direction
){

 let index=
 startIndex;


 let previous=
 result[
  result.length-1
 ];


 for(
  let count=0;
  count<way.geometry.length;
  count++
 ){

  if(
   index<0 ||
   index>=way.geometry.length
  )
  break;


  const point=
  way.geometry[index];


  /*
   Avoid huge jumps.
  */

  const jump=
  distance(
   previous.lat,
   previous.lon,
   point.lat,
   point.lon
  );


  if(
   jump<80
  ){

   result.push({
    lat:point.lat,
    lon:point.lon
   });

  }


  previous=point;

  index+=direction;

 }

}


/* =====================================================
 FOLLOW BACKWARDS
 ===================================================== */

function followWayBackward(
 result,
 way,
 startIndex
){

 let index=
 startIndex;


 let previous=
 result[
  result.length-1
 ];


 for(
  let count=0;
  count<way.geometry.length;
  count++
 ){

  if(
   index<0 ||
   index>=way.geometry.length
  )
  break;


  const point=
  way.geometry[index];


  const jump=
  distance(
   previous.lat,
   previous.lon,
   point.lat,
   point.lon
  );


  if(
   jump<80
  ){

   result.push({
    lat:point.lat,
    lon:point.lon
   });

  }


  previous=point;

  index--;

 }

}


/* =====================================================
 FIND CONNECTED WAY
 ===================================================== */

function findConnectedWay(
 ways,
 point,
 used
){

 let best=null;

 let bestDistance=
 CONNECTION_DISTANCE;


 for(
  const way of
  ways
 ){

  if(
   used.has(way.id)
  )
  continue;


  const first=
  way.geometry[0];

  const last=
  way.geometry[
   way.geometry.length-1
  ];


  const d1=
  distance(
   point.lat,
   point.lon,
   first.lat,
   first.lon
  );


  const d2=
  distance(
   point.lat,
   point.lon,
   last.lat,
   last.lon
  );


  if(
   d1<
   bestDistance
  ){

   best={

    way,

    index:0,

    direction:1

   };

   bestDistance=
   d1;

  }


  if(
   d2<
   bestDistance
  ){

   best={

    way,

    index:
    way.geometry.length-1,

    direction:-1

   };

   bestDistance=
   d2;

  }

 }


 return best;

}


/* =====================================================
 COIN POINTS
 ===================================================== */

function makeCoinPoints(
 network
){

 const result=[];

 let accumulated=0;


 for(
  let i=1;
  i<network.length;
  i++
 ){

  const a=
  network[i-1];

  const b=
  network[i];


  const segmentDistance=
  distance(
   a.lat,
   a.lon,
   b.lat,
   b.lon
  );


  /*
   Ignore weird OSM jumps.
  */

  if(
   segmentDistance>100
  ){

   accumulated=0;
   continue;

  }


  accumulated+=
  segmentDistance;


  if(
   accumulated>=
   COIN_SPACING
  ){

   result.push({

    lat:b.lat,
    lon:b.lon

   });


   accumulated=0;

  }

 }


 return result;

}


/* =====================================================
 CREATE COIN
 ===================================================== */

function createCoin(
 lat,
 lon
){

 if(
  !map ||
  !player
 )
 return;


 const id=
 Math.round(lat*100000)+
 "_"+
 Math.round(lon*100000);


 if(
  player.collected_coins
  .includes(id)
 )
 return;


 /*
  Don't stack coins.
 */

 if(
  coins.some(
   c=>
   distance(
    c.lat,
    c.lon,
    lat,
    lon
   )<25
  )
 )
 return;


 const marker=
 L.marker(
  [lat,lon],
  {

   icon:
   L.divIcon({

    className:"",

    html:
    `<div class="coin">🪙</div>`,

    iconSize:[
     30,
     30
    ],

    iconAnchor:[
     15,
     15
    ]

   })

  }
 )
 .addTo(map);


 coins.push({

  id,

  lat,

  lon,

  marker,

  collected:false

 });

}


/* =====================================================
 REMOVE COINS
 ===================================================== */

function removeCoins(){

 for(
  const coin of
  coins
 ){

  if(
   map &&
   map.hasLayer(
    coin.marker
   )
  ){

   map.removeLayer(
    coin.marker
   );

  }

 }

 coins=[];

}


/* =====================================================
 COLLECTION
 ===================================================== */

function checkCollection(
 lat,
 lon
){

 for(
  const coin of
  coins
 ){

  if(
   coin.collected
  )
  continue;


  const d=
  distance(
   lat,
   lon,
   coin.lat,
   coin.lon
  );


  if(
   d<=
   COLLECTION_DISTANCE
  ){

   collectCoin(
    coin
   );

  }

 }

}


/* =====================================================
 COLLECT
 ===================================================== */

async function collectCoin(
 coin
){

 if(
  coin.collected ||
  !player
 )
 return;


 coin.collected=
 true;


 if(
  map &&
  map.hasLayer(
   coin.marker
  )
 ){

  map.removeLayer(
   coin.marker
  );

 }


 player.coins+=10;

 player.xp+=10;


 if(
  !Array.isArray(
   player.collected_coins
  )
 ){

  player.collected_coins=[];

 }


 if(
  !player.collected_coins
  .includes(
   coin.id
  )
 ){

  player.collected_coins
  .push(
   coin.id
  );

 }


 while(
  player.xp>=
  player.level*100
 ){

  player.xp-=
  player.level*100;

  player.level++;

  toast(
   `🎉 LEVEL ${player.level}!`
  );

 }


 updateCoins();

 toast(
  "🪙 COIN COLLECTED! +10"
 );


 await savePlayer();

}

 })

 );


 if(error){

  );

 }

}

/* =====================================================
 CONTINUOUS ROAD STATUS
 ===================================================== */

async function updateRoadStatus(
 lat,
 lon
){

 /*
  Don't spam Overpass.

  Check at most once every 5 seconds.
 */

 const now=
 Date.now();


 if(
  now-lastRoadCheck<
  5000
 )
 return;


 lastRoadCheck=
 now;


 try{

  const ways=
  await getWays(
   lat,
   lon
  );


  if(!ways.length)
  return;


  const nearest=
  findClosestRoad(
   ways,
   lat,
   lon
  );


  if(!nearest)
  return;


  const meters=
  Math.round(
   nearest.distance
  );


  status.textContent=
  `🛣️ Nearest road: ${meters}m • 🪙 ${player?.coins||0}`;

 }catch(error){

  console.error(
   "ROAD STATUS ERROR:",
   error
  );

 }

}

function renderShop(){

 document.getElementById(
  "shopItems"
 );

 document.getElementById(
  "shopBalance"
 );


 balance.textContent=
 `🪙 Coins: ${player?.coins||0}`;


 items.innerHTML="";


 for(
  const [
   id,
   skin
  ]
  of
  Object.entries(skins)
 ){

  .includes(id);


  const equipped=
  player.equipped_skin===
  id;

  document.createElement(
   "div"
  );


  row.className=
  "shopItem";


  row.innerHTML=`

    class="preview"
    style="
     background:${skin.color};
     box-shadow:
     0 0 12px ${skin.color};
    "
   ></div>

   <div class="info">

    <b>
     ${skin.name}
    </b>

    <br>

    <span
     style="color:#ffd700"
    >
     ${
      skin.price===0
      ?
      "FREE"
      :
      "🪙 "+skin.price
     }
    </span>

   </div>

  `;


  const button=
  document.createElement(
   "button"
  );


  if(equipped){

   button.textContent=
   "EQUIPPED";

   button.disabled=
   true;

  }else if(unlocked){

   button.textContent=
   "EQUIP";

   button.onclick=
   async()=>{

    player.equipped_skin=
    id;

    await savePlayer();

    renderShop();

    toast(
     "🎨 Equipped!"
    );

   };

  }else if(
   player.coins>=
   skin.price
  ){

   button.textContent=
   "BUY";

   button.onclick=
   async()=>{

    player.coins-=
    skin.price;

    player.unlocked_skins
    .push(id);

    player.equipped_skin=
    id;

    await savePlayer();

    updateCoins();

    renderShop();

    toast(
     "🎨 Skin unlocked!"
    );

   };

  }else{

   button.textContent=
   "NEED COINS";

   button.disabled=
   true;

  }


  row.appendChild(
   button
  );


  items.appendChild(
   row
  );

 }

}

/* =====================================================
 DISTANCE
 ===================================================== */

function distance(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R=
 6371000;


 const p1=
 lat1*
 Math.PI/
 180;


 const p2=
 lat2*
 Math.PI/
 180;


 const dLat=
 (
  lat2-lat1
 )*
 Math.PI/
 180;


 const dLon=
 (
  lon2-lon1
 )*
 Math.PI/
 180;


 const a=
 Math.sin(
  dLat/2
 )**2+

  Math.cos(p1)*
  Math.cos(p2)*
  Math.sin(
   dLon/2
  )**2;


 return R*
 2*
 Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

}
