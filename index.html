/* =========================================================

========================================================= */

.player {

/* =========================================================

========================================================= */

.coin {

  align-items: center;

@keyframes coinPulse {

/* =========================================================

.overlay {

/* =========================================================

========================================================= */

#toast {

.leaflet-top {

<script>

"use strict";

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

/* =========================================================
   SETTINGS
========================================================= */

const SEARCH_RADIUS = 1200;

const COIN_SPACING = 60;

const MAIN_COINS = 14;

const BRANCH_COINS = 5;

const COLLECTION_DISTANCE = 25;

const REFRESH_DISTANCE = 100;

const MAX_PATH_DISTANCE = 450;

const OVERPASS_SERVERS = [

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter",

  "https://overpass.private.coffee/api/interpreter"

];

/* =========================================================
   SKINS
========================================================= */

const SKINS = {

  blue: {
    name: "Blue",
    color: "#00aaff",
    price: 0
  },

  red: {
    name: "Red",
    color: "#ff3030",
    price: 50
  },

  green: {
    name: "Green",
    color: "#22dd55",
    price: 100
  },

  purple: {
    name: "Purple",
    color: "#aa55ff",
    price: 150
  },

  gold: {
    name: "Gold",
    color: "#ffd000",
    price: 250
  },

  pink: {
    name: "Pink",
    color: "#ff4fa3",
    price: 350
  }

};

/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let playerData = null;

let map = null;

let playerMarker = null;

let coins = [];

let gameMode = "PUBLIC";

let gpsStarted = false;

let currentLatitude = null;

let currentLongitude = null;

let currentHeading = null;

let loadingTrail = false;

let lastTrailLoad = 0;

let watchId = null;

let ways = [];

let networkEdges = [];

let routePoints = [];

/* =========================================================
   DOM
========================================================= */

const authScreen =
  document.getElementById("authScreen");

const emailInput =
  document.getElementById("emailInput");

const signInButton =
  document.getElementById("signInButton");

const authStatus =
  document.getElementById("authStatus");

const modeScreen =
  document.getElementById("modeScreen");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingBar =
  document.getElementById("loadingBarInner");

const loadingText =
  document.getElementById("loadingText");

const statusElement =
  document.getElementById("status");

const coinsDisplay =
  document.getElementById("coinsDisplay");

/* =========================================================
   LOADING
========================================================= */

function setLoading(text, percent) {

  loadingText.textContent = text;

  loadingBar.style.width =
    percent + "%";

}

/* =========================================================
   AUTH
========================================================= */

function showAuth() {

  authScreen.style.display =
    "flex";

  modeScreen.style.display =
    "none";

  loadingScreen.style.display =
    "none";

}

function hideAuth() {

  authScreen.style.display =
    "none";

}

async function sendMagicLink() {

  const email =
    emailInput.value.trim();

  if (!email) {

    authStatus.textContent =
      "Enter your email.";

    return;

  }

  signInButton.disabled =
    true;

  authStatus.textContent =
    "Sending sign-in link...";

  try {

    const redirectTo =
      window.location.origin +
      window.location.pathname;

    const {
      error
    } =
      await supabase.auth.signInWithOtp({

        email,

        options: {

          emailRedirectTo:
            redirectTo,

          shouldCreateUser:
            true

        }

      });

    if (error)
      throw error;

    authStatus.textContent =
      "✅ Check your email for the sign-in link.";

  } catch (error) {

    console.error(error);

    authStatus.textContent =
      "❌ " +
      (
        error.message ||
        "Sign in failed."
      );

  }

  signInButton.disabled =
    false;

}

signInButton.onclick =
  sendMagicLink;

/* =========================================================
   AUTH STATE
========================================================= */

supabase.auth.onAuthStateChange(
  (event, session) => {

    console.log(
      "Auth:",
      event
    );

    if (
      session &&
      session.user
    ) {

      currentUser =
        session.user;

      hideAuth();

      bootGame();

    }

    if (
      event ===
      "SIGNED_OUT"
    ) {

      currentUser =
        null;

      showAuth();

    }

  }
);

/* =========================================================
   INITIAL BOOT
========================================================= */

async function boot() {

  try {

    setLoading(
      "Checking account...",
      15
    );

    const {
      data
    } =
      await supabase.auth.getSession();

    if (
      data.session &&
      data.session.user
    ) {

      currentUser =
        data.session.user;

      hideAuth();

      await bootGame();

      return;

    }

    showAuth();

  } catch (error) {

    console.error(error);

    showAuth();

  }

}

/* =========================================================
   GAME BOOT
========================================================= */

async function bootGame() {

  if (!currentUser)
    return;

  try {

    setLoading(
      "Loading player...",
      25
    );

    await loadPlayer();

    modeScreen.style.display =
      "flex";

  } catch (error) {

    console.error(error);

    authStatus.textContent =
      "Could not load player.";

    showAuth();

  }

}

/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer() {

  if (!currentUser)
    return;

  let {
    data,
    error
  } =
    await supabase
      .from("players")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

  if (error)
    throw error;

  if (!data) {

    const newPlayer = {

      id:
        currentUser.id,

      username:
        currentUser.email
          ? currentUser.email.split("@")[0]
          : "Player",

      coins:
        0,

      xp:
        0,

      level:
        1,

      unlocked_skins:
        ["blue"],

      equipped_skin:
        "blue",

      collected_coins:
        []

    };

    const result =
      await supabase
        .from("players")
        .insert(newPlayer)
        .select()
        .single();

    if (result.error)
      throw result.error;

    data =
      result.data;

  }

  playerData =
    normalizePlayer(data);

  updateCoinDisplay();

}

function normalizePlayer(data) {

  return {

    id:
      data.id,

    username:
      data.username || null,

    coins:
      Number(data.coins || 0),

    xp:
      Number(data.xp || 0),

    level:
      Number(data.level || 1),

    unlocked_skins:
      Array.isArray(
        data.unlocked_skins
      )
        ? data.unlocked_skins
        : ["blue"],

    equipped_skin:
      data.equipped_skin || "blue",

    collected_coins:
      Array.isArray(
        data.collected_coins
      )
        ? data.collected_coins
        : [],

    created_at:
      data.created_at || "",

    updated_at:
      data.updated_at || ""

  };

}

/* =========================================================
   MODE
========================================================= */

document
  .getElementById("publicMode")
  .onclick = () => {

    gameMode =
      "PUBLIC";

    beginGPS();

  };

document
  .getElementById("unlimitedMode")
  .onclick = () => {

    gameMode =
      "UNLIMITED";

    beginGPS();

  };

/* =========================================================
   START GPS
========================================================= */

function beginGPS() {

  modeScreen.style.display =
    "none";

  loadingScreen.style.display =
    "flex";

  setLoading(
    "Requesting your location...",
    40
  );

  setStatus(
    "📍 Requesting location permission..."
  );

  if (
    !navigator.geolocation
  ) {

    setStatus(
      "❌ GPS isn't available on this device."
    );

    return;

  }

  if (gpsStarted)
    return;

  gpsStarted =
    true;

  watchId =
    navigator.geolocation.watchPosition(

      handlePosition,

      handleLocationError,

      {

        enableHighAccuracy:
          true,

        maximumAge:
          3000,

        timeout:
          20000

      }

    );

}

/* =========================================================
   GPS POSITION
========================================================= */

function handlePosition(position) {

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  if (
    Number.isFinite(
      position.coords.heading
    ) &&
    position.coords.heading >= 0
  ) {

    currentHeading =
      position.coords.heading;

  }

  const firstGPS =
    currentLatitude === null;

  currentLatitude =
    lat;

  currentLongitude =
    lon;

  if (firstGPS) {

    startMap(
      lat,
      lon
    );

    return;

  }

  if (playerMarker) {

    playerMarker.setLatLng([
      lat,
      lon
    ]);

  }

  checkCoinCollection(
    lat,
    lon
  );

  const now =
    Date.now();

  const moved =
    distanceMeters(
      currentLatitude,
      currentLongitude,
      lat,
      lon
    );

  if (
    moved >= REFRESH_DISTANCE ||
    now - lastTrailLoad > 45000
  ) {

    loadTrail(
      lat,
      lon,
      true
    );

  }

}

/* =========================================================
   LOAD TRAIL
========================================================= */

async function loadTrail(
  lat,
  lon,
  force = false
) {

  if (
    loadingTrail &&
    !force
  )
    return;

  const now =
    Date.now();

  if (
    !force &&
    now - lastTrailLoad < 8000
  )
    return;

  loadingTrail =
    true;

  lastTrailLoad =
    now;

  setStatus(
    "🛣️ Finding your nearest connected road..."
  );

  try {

    const fetchedWays =
      await getNearbyWays(
        lat,
        lon
      );

    ways =
      fetchedWays;

    if (
      ways.length === 0
    ) {

      setStatus(
        "🔎 No mapped roads found nearby. Retrying..."
      );

      loadingTrail =
        false;

      setTimeout(
        () => {

          loadTrail(
            lat,
            lon,
            true
          );

        },
        3000
      );

      return;

    }

    setStatus(
      `🛣️ ${ways.length} mapped roads found. Building network...`
    );

    networkEdges =
      buildNetwork(
        ways
      );

    if (
      networkEdges.length === 0
    ) {

      setStatus(
        "⚠️ Couldn't build road network."
      );

      loadingTrail =
        false;

      return;

    }

    const nearest =
      findNearestRoadSegment(
        ways,
        lat,
        lon
      );

    if (!nearest) {

      setStatus(
        "🔎 Couldn't locate a road."
      );

      loadingTrail =
        false;

      return;

    }

    if (
      nearest.distance >
      MAX_PATH_DISTANCE
    ) {

      setStatus(
        `🛣️ Nearest mapped road is ${Math.round(nearest.distance)}m away.`
      );

      loadingTrail =
        false;

      return;

    }

    const route =
      generateConnectedRoute(
        nearest,
        lat,
        lon
      );

    if (
      route.length < 2
    ) {

      setStatus(
        "⚠️ Road found, but couldn't create a connected route."
      );

      loadingTrail =
        false;

      return;

    }

    routePoints =
      route;

    removeGeneratedCoins();

    for (
      const point of route
    ) {

      createCoin(
        point.lat,
        point.lon
      );

    }

    setStatus(
      `🎮 ${route.length} coins loaded on your connected road`
    );

  } catch (error) {

    console.error(
      "Trail error:",
      error
    );

    setStatus(
      "⚠️ Road search failed. Retrying..."
    );

    setTimeout(
      () => {

        if (
          currentLatitude !== null &&
          currentLongitude !== null
        ) {

          loadTrail(
            currentLatitude,
            currentLongitude,
            true
          );

        }

      },
      3000
    );

  }

  loadingTrail =
    false;

}

/* =========================================================
   OVERPASS
========================================================= */

async function getNearbyWays(
  lat,
  lon
) {

  const latOffset =
    SEARCH_RADIUS /
    111320;

  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat *
        Math.PI /
        180
      )
    );

  const south =
    lat -
    latOffset;

  const north =
    lat +
    latOffset;

  const west =
    lon -
    lonOffset;

  const east =
    lon +
    lonOffset;

  let highwayFilter;

  if (
    gameMode ===
    "PUBLIC"
  ) {

    highwayFilter =
      "^(footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|unclassified|tertiary|secondary)$";

  } else {

    highwayFilter =
      "^(footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|unclassified|tertiary|secondary|service)$";

  }

  const query = `

[out:json][timeout:20];

way["highway"~"${highwayFilter}"]
(${south},${west},${north},${east});

out body geom;

`;

  let lastError =
    null;

  for (
    const server of
    OVERPASS_SERVERS
  ) {

    try {

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          25000
        );

      const response =
        await fetch(
          server,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"

            },

            body:
              "data=" +
              encodeURIComponent(
                query
              ),

            signal:
              controller.signal

          }
        );

      clearTimeout(
        timeout
      );

      if (
        !response.ok
      ) {

        throw new Error(
          "Overpass HTTP " +
          response.status
        );

      }

      const json =
        await response.json();

      const result =
        filterWays(
          json.elements || []
        );

      if (
        result.length
      )
        return result;

    } catch (error) {

      console.log(
        "Overpass failed:",
        server,
        error
      );

      lastError =
        error;

    }

  }

  throw (
    lastError ||
    new Error(
      "No Overpass server worked"
    )
  );

}

/* =========================================================
   FILTER ROADS
========================================================= */

function filterWays(elements) {

  const result = [];

  for (
    const element of
    elements
  ) {

    if (
      element.type !==
      "way"
    )
      continue;

    if (
      !Array.isArray(
        element.geometry
      ) ||
      element.geometry.length <
      2
    )
      continue;

    if (
      !Array.isArray(
        element.nodes
      ) ||
      element.nodes.length <
      2
    )
      continue;

    const tags =
      element.tags || {};

    const highway =
      tags.highway;

    if (!highway)
      continue;

    const access =
      String(
        tags.access || ""
      ).toLowerCase();

    const vehicle =
      String(
        tags.vehicle || ""
      ).toLowerCase();

    const foot =
      String(
        tags.foot || ""
      ).toLowerCase();

    if (
      gameMode ===
      "PUBLIC"
    ) {

      if (
        access === "private" ||
        access === "no" ||
        access === "permit" ||
        access === "customers" ||
        vehicle === "private"
      )
        continue;

      if (
        foot === "no"
      )
        continue;

    }

    result.push({

      id:
        element.id,

      nodes:
        element.nodes,

      geometry:
        element.geometry,

      tags

    });

  }

  return result;

}

/* =========================================================
   NETWORK EDGE
========================================================= */

function buildNetwork(ways) {

  const edges = [];

  for (
    const way of
    ways
  ) {

    for (
      let i = 0;
      i < way.nodes.length - 1;
      i++
    ) {

      const nodeA =
        way.nodes[i];

      const nodeB =
        way.nodes[i + 1];

      const pointA =
        way.geometry[i];

      const pointB =
        way.geometry[i + 1];

      if (
        !pointA ||
        !pointB
      )
        continue;

      const length =
        distanceMeters(
          pointA.lat,
          pointA.lon,
          pointB.lat,
          pointB.lon
        );

      if (
        length < .5
      )
        continue;

      edges.push({

        id:
          way.id +
          ":" +
          i,

        wayId:
          way.id,

        a:
          String(nodeA),

        b:
          String(nodeB),

        pointA: {

          lat:
            pointA.lat,

          lon:
            pointA.lon

        },

        pointB: {

          lat:
            pointB.lat,

          lon:
            pointB.lon

        },

        length

      });

    }

  }

  return edges;

}

/* =========================================================
   NEAREST ROAD SEGMENT
========================================================= */

function findNearestRoadSegment(
  ways,
  lat,
  lon
) {

  let best =
    null;

  for (
    const way of
    ways
  ) {

    for (
      let i = 0;
      i <
      way.geometry.length - 1;
      i++
    ) {

      const a =
        way.geometry[i];

      const b =
        way.geometry[i + 1];

      const projected =
        projectPointToSegment(
          lat,
          lon,
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );

      if (
        !best ||
        projected.distance <
        best.distance
      ) {

        best = {

          way,

          segmentIndex:
            i,

          distance:
            projected.distance,

          point: {

            lat:
              projected.lat,

            lon:
              projected.lon

          },

          nodeA:
            String(
              way.nodes[i]
            ),

          nodeB:
            String(
              way.nodes[i + 1
              ]

            ),

          pointA: {

            lat:
              a.lat,

            lon:
              a.lon

          },

          pointB: {

            lat:
              b.lat,

            lon:
              b.lon

          }

        };

      }

    }

  }

  return best;

}

/* =========================================================
   PROJECT GPS ONTO ROAD
========================================================= */

function projectPointToSegment(
  lat,
  lon,
  lat1,
  lon1,
  lat2,
  lon2
) {

  const cosLat =
    Math.cos(
      lat *
      Math.PI /
      180
    );

  const x =
    (lon - lon1) *
    cosLat;

  const y =
    lat - lat1;

  const dx =
    (lon2 - lon1) *
    cosLat;

  const dy =
    lat2 - lat1;

  const lengthSquared =
    dx * dx +
    dy * dy;

  let t =
    lengthSquared === 0
      ? 0
      : (
          x * dx +
          y * dy
        ) /
        lengthSquared;

  t =
    Math.max(
      0,
      Math.min(
        1,
        t
      )
    );

  const pLat =
    lat1 +
    (
      lat2 -
      lat1
    ) *
    t;

  const pLon =
    lon1 +
    (
      lon2 -
      lon1
    ) *
    t;

  return {

    lat:
      pLat,

    lon:
      pLon,

    distance:
      distanceMeters(
        lat,
        lon,
        pLat,
        pLon
      ),

    t

  };

}

/* =========================================================
   CONNECTED ROUTE
========================================================= */

function generateConnectedRoute(
  nearest,
  playerLat,
  playerLon
) {

  const points = [];

  const start =
    nearest.point;

  points.push({
    lat:
      start.lat,
    lon:
      start.lon
  });

  const edge =
    networkEdges.find(
      e =>
        e.wayId ===
          nearest.way.id &&
        (
          (
            e.a ===
            nearest.nodeA &&
            e.b ===
            nearest.nodeB
          ) ||
          (
            e.a ===
            nearest.nodeB &&
            e.b ===
            nearest.nodeA
          )
        )
    );

  if (!edge)
    return points;

  const distToA =
    distanceMeters(
      start.lat,
      start.lon,
      edge.pointA.lat,
      edge.pointA.lon
    );

  const distToB =
    distanceMeters(
      start.lat,
      start.lon,
      edge.pointB.lat,
      edge.pointB.lon
    );

  let startingNode;

  let nextNode;

  if (
    currentHeading !== null
  ) {

    const headingToA =
      bearing(
        start.lat,
        start.lon,
        edge.pointA.lat,
        edge.pointA.lon
      );

    const headingToB =
      bearing(
        start.lat,
        start.lon,
        edge.pointB.lat,
        edge.pointB.lon
      );

    const diffA =
      angleDifference(
        currentHeading,
        headingToA
      );

    const diffB =
      angleDifference(
        currentHeading,
        headingToB
      );

    if (
      diffA <= diffB
    ) {

      startingNode =
        edge.a;

      nextNode =
        edge.b;

    } else {

      startingNode =
        edge.b;

      nextNode =
        edge.a;

    }

  } else {

    if (
      distToA >
      distToB
    ) {

      startingNode =
        edge.a;

      nextNode =
        edge.b;

    } else {

      startingNode =
        edge.b;

      nextNode =
        edge.a;

    }

  }

  const visited =
    new Set();

  visited.add(
    edge.id
  );

  let current =
    nextNode;

  let previous =
    startingNode;

  let accumulated =
    Math.min(
      distToA,
      distToB
    );

  for (
    let count = 0;
    count < MAIN_COINS;
    count++
  ) {

    const next =
      chooseNextEdge(
        current,
        previous,
        visited
      );

    if (!next)
      break;

    visited.add(
      next.id
    );

    accumulated +=
      next.length;

    if (
      accumulated >=
      COIN_SPACING
    ) {

      points.push({

        lat:
          next.pointB.lat,

        lon:
          next.pointB.lon

      });

      accumulated =
        0;

    }

    previous =
      current;

    current =
      next.b;

  }

  return points;

}

/* =========================================================
   CHOOSE CONNECTED EDGE
========================================================= */

function chooseNextEdge(
  node,
  previousNode,
  visited
) {

  const possible =
    networkEdges.filter(
      e =>
        (
          e.a ===
          node ||
          e.b ===
          node
        ) &&
        !visited.has(e.id)
    );

  if (
    possible.length === 0
  )
    return null;

  let best =
    null;

  let bestScore =
    -Infinity;

  for (
    const edge of
    possible
  ) {

    const nextNode =
      edge.a ===
      node
        ? edge.b
        : edge.a;

    const fromPoint =
      getNodePoint(
        node
      );

    const toPoint =
      getNodePoint(
        nextNode
      );

    if (
      !fromPoint ||
      !toPoint
    )
      continue;

    let score =
      0;

    if (
      currentHeading !== null
    ) {

      const dir =
        bearing(
          fromPoint.lat,
          fromPoint.lon,
          toPoint.lat,
          toPoint.lon
        );

      score +=
        180 -
        angleDifference(
          currentHeading,
          dir
        );

    }

    const reversePenalty =
      nextNode ===
      previousNode
        ? 1000
        : 0;

    score -=
      reversePenalty;

    score +=
      Math.min(
        edge.length,
        100
      ) *
      .01;

    if (
      score >
      bestScore
    ) {

      bestScore =
        score;

      best =
        edge;

      if (
        edge.a ===
        node
      ) {

        best = {

          ...edge,

          a:
            edge.b,

          b:
            edge.a,

          pointA:
            edge.pointB,

          pointB:
            edge.pointA

        };

      }

    }

  }

  return best;

}

/* =========================================================
   NODE POINT
========================================================= */

function getNodePoint(nodeId) {

  const id =
    String(nodeId);

  for (
    const edge of
    networkEdges
  ) {

    if (
      edge.a === id
    )
      return edge.pointA;

    if (
      edge.b === id
    )
      return edge.pointB;

  }

  return null;

}

/* =========================================================
   BEARING
========================================================= */

function bearing(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dl =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;

  const y =
    Math.sin(dl) *
    Math.cos(p2);

  const x =
    Math.cos(p1) *
    Math.sin(p2) -
    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);

  return (
    Math.atan2(
      y,
      x
    ) *
    180 /
    Math.PI +
    360
  ) % 360;

}

function angleDifference(
  a,
  b
) {

  let d =
    Math.abs(
      a -
      b
    );

  if (
    d > 180
  )
    d =
      360 -
      d;

  return d;

}

/* =========================================================
   COINS
========================================================= */

function createCoin(
  lat,
  lon
) {

  if (!map)
    return;

  if (!playerData)
    return;

  const id =
    makeCoinId(
      lat,
      lon
    );

  if (
    playerData.collected_coins
      .includes(id)
  )
    return;

  for (
    const coin of
    coins
  ) {

    if (
      distanceMeters(
        lat,
        lon,
        coin.latitude,
        coin.longitude
      ) < 22
    )
      return;

  }

  const marker =
    L.marker(
      [lat, lon],
      {

        icon:
          L.divIcon({

            className:
              "",

            html:
              `<div class="coin">🪙</div>`,

            iconSize:
              [34,34],

            iconAnchor:
              [17,17]

          }),

        zIndexOffset:
          100

      }
    ).addTo(map);

  coins.push({

    id,

    marker,

    latitude:
      lat,

    longitude:
      lon,

    collected:
      false

  });

}

/* =========================================================
   COIN ID
========================================================= */

function makeCoinId(
  lat,
  lon
) {

  return (
    Math.round(
      lat * 100000
    ) +
    "_" +
    Math.round(
      lon * 100000
    )
  );

}

/* =========================================================
   REMOVE GENERATED COINS
========================================================= */

function removeGeneratedCoins() {

  if (!map)
    return;

  const kept = [];

  for (
    const coin of
    coins
  ) {

    if (
      coin.collected
    ) {

      kept.push(
        coin
      );

      continue;

    }

    if (
      map.hasLayer(
        coin.marker
      )
    ) {

      map.removeLayer(
        coin.marker
      );

    }

  }

  coins =
    kept;

}

/* =========================================================
   COLLECTION
========================================================= */

function checkCoinCollection(
  lat,
  lon
) {

  for (
    const coin of
    coins
  ) {

    if (
      coin.collected
    )
      continue;

    const d =
      distanceMeters(
        lat,
        lon,
        coin.latitude,
        coin.longitude
      );

    if (
      d <=
      COLLECTION_DISTANCE
    ) {

      collectCoin(
        coin
      );

    }

  }

}

/* =========================================================
   COLLECT
========================================================= */

async function collectCoin(
  coin
) {

  if (!playerData)
    return;

  if (
    coin.collected
  )
    return;

  coin.collected =
    true;

  if (
    map &&
    map.hasLayer(
      coin.marker
    )
  ) {

    map.removeLayer(
      coin.marker
    );

  }

  if (
    !playerData
      .collected_coins
      .includes(
        coin.id
      )
  ) {

    playerData
      .collected_coins
      .push(
        coin.id
      );

  }

  playerData.coins +=
    10;

  playerData.xp +=
    10;

  checkLevel();

  updateCoinDisplay();

  showToast(
    "🪙 COIN COLLECTED! +10"
  );

  setStatus(
    "🎮 Keep exploring!"
  );

  await savePlayer();

}

/* =========================================================
   LEVEL
========================================================= */

function checkLevel() {

  if (!playerData)
    return;

  let leveled =
    false;

  while (
    playerData.xp >=
    playerData.level * 100
  ) {

    playerData.xp -=
      playerData.level *
      100;

    playerData.level++;

    leveled =
      true;

  }

  if (
    leveled
  ) {

    showToast(
      "🎉 LEVEL " +
      playerData.level +
      "!"
    );

  }

}

/* =========================================================
   SAVE
========================================================= */

async function savePlayer() {

  if (!playerData)
    return;

  const {
    error
  } =
    await supabase
      .from("players")
      .update({

        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        unlocked_skins:
          playerData.unlocked_skins,

        equipped_skin:
          playerData.equipped_skin,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          new Date()
            .toISOString()

      })
      .eq(
        "id",
        playerData.id
      );

  if (error) {

    console.error(
      "Save:",
      error
    );

    showToast(
      "⚠️ Save failed"
    );

  }

}

/* =========================================================
   COIN DISPLAY
========================================================= */

function updateCoinDisplay() {

  coinsDisplay.textContent =
    "🪙 Coins: " +
    (
      playerData
        ? playerData.coins
        : 0
    );

}

/* =========================================================
   SHOP
========================================================= */

document
  .getElementById("shopButton")
  .onclick = () => {

    document
      .getElementById(
        "shopOverlay"
      )
      .style.display =
        "block";

    renderShop();

  };

document
  .getElementById("closeShop")
  .onclick = () => {

    document
      .getElementById(
        "shopOverlay"
      )
      .style.display =
        "none";

  };

function renderShop() {

  if (!playerData)
    return;

  document
    .getElementById(
      "shopBalance"
    )
    .textContent =
      "🪙 Coins: " +
      playerData.coins;

  const container =
    document
      .getElementById(
        "shopItems"
      );

  container.innerHTML =
    "";

  Object.entries(
    SKINS
  ).forEach(
    ([id, skin]) => {

      const unlocked =
        playerData
          .unlocked_skins
          .includes(id);

      const equipped =
        playerData
          .equipped_skin ===
        id;

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "shopItem";

      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "skinPreview";

      preview.style.background =
        skin.color;

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "skinInfo";

      info.innerHTML =
        `
        <div class="skinName">
          ${skin.name}
        </div>

        <div class="skinPrice">
          ${
            skin.price === 0
              ? "FREE"
              : "🪙 " +
                skin.price
          }
        </div>
        `;

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "shopAction";

      if (
        equipped
      ) {

        button.textContent =
          "EQUIPPED";

        button.disabled =
          true;

      } else if (
        unlocked
      ) {

        button.textContent =
          "EQUIP";

        button.onclick =
          () =>
            equipSkin(id);

      } else if (
        playerData.coins >=
        skin.price
      ) {

        button.textContent =
          "BUY";

        button.onclick =
          () =>
            buySkin(id);

      } else {

        button.textContent =
          "NEED COINS";

        button.disabled =
          true;

      }

      item.appendChild(
        preview
      );

      item.appendChild(
        info
      );

      item.appendChild(
        button
      );

      container.appendChild(
        item
      );

    }
  );

}

/* =========================================================
   BUY
========================================================= */

async function buySkin(
  id
) {

  if (!playerData)
    return;

  const skin =
    SKINS[id];

  if (!skin)
    return;

  if (
    playerData
      .unlocked_skins
      .includes(id)
  )
    return;

  if (
    playerData.coins <
    skin.price
  )
    return;

  playerData.coins -=
    skin.price;

  playerData
    .unlocked_skins
    .push(id);

  playerData.equipped_skin =
    id;

  await savePlayer();

  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();

  showToast(
    "🎨 " +
    skin.name +
    " unlocked!"
  );

}

/* =========================================================
   EQUIP
========================================================= */

async function equipSkin(
  id
) {

  if (!playerData)
    return;

  if (
    !playerData
      .unlocked_skins
      .includes(id)
  )
    return;

  playerData.equipped_skin =
    id;

  await savePlayer();

  updatePlayerSkin();

  renderShop();

}

function setStatus(

) {

  statusElement.textContent =

/* =========================================================
   TOAST
========================================================= */

let toastTimer =
  null;

function showToast(
  text
) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  if (
    toastTimer
  )
    clearTimeout(
      toastTimer
    );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}

/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;

  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;

  const a =
    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(
      dLon / 2
    ) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}
