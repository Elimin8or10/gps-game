<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
 createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
 "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

const supabase =
 createClient(
  SUPABASE_URL,
  SUPABASE_KEY
 );


/* =========================================================
   GAME SETTINGS
========================================================= */

const COIN_SPACING = 55;
const COLLECTION_DISTANCE = 22;
const ROAD_SEARCH_RADIUS = 900;
const ROUTE_REFRESH_DISTANCE = 80;

let gameMode = null;
let user = null;
let player = null;

let map = null;
let playerMarker = null;

let coins = [];

let lastLat = null;
let lastLon = null;

let lastRouteLat = null;
let lastRouteLon = null;

let routeLoading = false;


/* =========================================================
   SKINS
========================================================= */

const SKINS = {
 blue:{name:"Blue",color:"#00aaff",price:0},
 red:{name:"Red",color:"#ff3030",price:50},
 green:{name:"Green",color:"#22dd55",price:100},
 purple:{name:"Purple",color:"#aa55ff",price:150},
 gold:{name:"Gold",color:"#ffd000",price:250},
 pink:{name:"Pink",color:"#ff4fa3",price:350}
};


/* =========================================================
   ELEMENTS
========================================================= */

const authScreen =
 document.getElementById("authScreen");

const modeScreen =
 document.getElementById("modeScreen");

const loadingScreen =
 document.getElementById("loadingScreen");

const loadBar =
 document.getElementById("loadBar");

const loadText =
 document.getElementById("loadText");

const authMessage =
 document.getElementById("authMessage");

const hud =
 document.getElementById("hud");

const status =
 document.getElementById("status");

const coinsDisplay =
 document.getElementById("coins");

const toast =
 document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function setStatus(text){
 status.textContent = text;
}

function loading(text,percent){
 loadText.textContent = text;
 loadBar.style.width = percent + "%";
}

function showToast(text){
 toast.textContent = text;
 toast.classList.add("show");

 setTimeout(()=>{
  toast.classList.remove("show");
 },2200);
}

function distanceMeters(a,b,c,d){
 const R=6371000;

 const p1=a*Math.PI/180;
 const p2=c*Math.PI/180;

 const dp=(c-a)*Math.PI/180;
 const dl=(d-b)*Math.PI/180;

 const x=
  Math.sin(dp/2)**2+
  Math.cos(p1)*
  Math.cos(p2)*
  Math.sin(dl/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(x),
  Math.sqrt(1-x)
 );
}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

 loading("Checking account...",15);

 const {
  data
 } = await supabase.auth.getSession();

 if(data.session){
  user=data.session.user;
  await startAfterLogin();
 }else{
  authScreen.classList.remove("hidden");
 }

}

document
 .getElementById("sendLink")
 .onclick=async()=>{

 const email=
  document.getElementById("email")
  .value.trim();

 if(!email){
  authMessage.textContent=
   "Enter your email.";
  return;
 }

 authMessage.textContent=
  "Sending sign-in link...";

 const {
  error
 }=await supabase.auth.signInWithOtp({
  email,
  options:{
   emailRedirectTo:
    "https://elimin8or10.github.io/gps-game/"
  }
 });

 if(error){
  authMessage.textContent=
   error.message;
 }else{
  authMessage.className="success";
  authMessage.textContent=
   "Check your email for the sign-in link.";
 }
};


supabase.auth.onAuthStateChange(
 async(event,session)=>{

  if(event==="SIGNED_IN" && session){

   user=session.user;

   authScreen.classList.add("hidden");

   await startAfterLogin();
  }

  if(event==="SIGNED_OUT"){
   location.reload();
  }
 });


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

 const {
  data,
  error
 }=await supabase
  .from("players")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();

 if(error) throw error;

 if(!data){

  const {
   data:newPlayer,
   error:createError
  }=await supabase
   .from("players")
   .insert({
    id:user.id,
    username:
     user.email?.split("@")[0] || null
   })
   .select()
   .single();

  if(createError) throw createError;

  player=newPlayer;

 }else{

  player=data;

 }

 updateCoins();
}


/* =========================================================
   AFTER LOGIN
========================================================= */

async function startAfterLogin(){

 try{

  loadingScreen.style.display="flex";

  loading("Loading player...",35);

  await loadPlayer();

  loadingScreen.style.display="none";

  modeScreen.style.display="flex";

 }catch(error){

  console.error(error);

  loadingScreen.style.display="none";

  authScreen.classList.remove("hidden");

  authMessage.textContent=
   "Could not load player: "+error.message;
 }
}


/* =========================================================
   MODE
========================================================= */

document
 .getElementById("publicBtn")
 .onclick=()=>chooseMode("PUBLIC");

document
 .getElementById("unlimitedBtn")
 .onclick=()=>chooseMode("UNLIMITED");


function chooseMode(mode){

 gameMode=mode;

 modeScreen.style.display="none";

 loadingScreen.style.display="flex";

 loading(
  "Requesting your location...",
  20
 );

 requestGPS();
}


/* =========================================================
   GPS
========================================================= */

function requestGPS(){

 if(!navigator.geolocation){

  loading(
   "GPS is not available on this device.",
   100
  );

  return;
 }

 navigator.geolocation.getCurrentPosition(
  firstLocation,
  gpsError,
  {
   enableHighAccuracy:true,
   timeout:20000,
   maximumAge:0
  }
 );

 navigator.geolocation.watchPosition(
  updateLocation,
  gpsError,
  {
   enableHighAccuracy:true,
   timeout:20000,
   maximumAge:2000
  }
 );
}


function firstLocation(position){

 const lat=
  position.coords.latitude;

 const lon=
  position.coords.longitude;

 lastLat=lat;
 lastLon=lon;

 loading(
  "Location found!",
  55
 );

 createMap(lat,lon);

 loadRoute(lat,lon);
}


function updateLocation(position){

 const lat=
  position.coords.latitude;

 const lon=
  position.coords.longitude;

 lastLat=lat;
 lastLon=lon;

 if(!map){

  createMap(lat,lon);
  loadRoute(lat,lon);
  return;
 }

 if(playerMarker){

  playerMarker.setLatLng([lat,lon]);
 }

 checkCollections(lat,lon);

 updateRoadDistance(lat,lon);

 const moved=
  lastRouteLat===null
   ? Infinity
   : distanceMeters(
      lat,lon,
      lastRouteLat,lastRouteLon
     );

 if(
  moved>=ROUTE_REFRESH_DISTANCE &&
  !routeLoading
 ){

  loadRoute(lat,lon);
 }
}


function gpsError(error){

 console.log("GPS:",error);

 if(error.code===1){

  loading(
   "Location permission was denied. Enable location access for this site.",
   100
  );

  setStatus(
   "📍 Location permission denied."
  );

 }else{

  setStatus(
   "📍 Waiting for GPS..."
  );
 }
}


/* =========================================================
   MAP
========================================================= */

function createMap(lat,lon){

 if(map) return;

 map=L.map("map",{
  zoomControl:true
 }).setView([lat,lon],17);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   attribution:"© OpenStreetMap contributors"
  }
 ).addTo(map);

 createPlayerMarker(lat,lon);

 hud.classList.remove("hidden");

 loadingScreen.style.display="none";

 setStatus(
  "🛣️ Finding the nearest connected road..."
 );
}


function createPlayerMarker(lat,lon){

 const color=
  SKINS[player?.equipped_skin || "blue"].color;

 playerMarker=L.marker(
  [lat,lon],
  {
   icon:L.divIcon({
    className:"",
    html:
     `<div class="player"
      style="background:${color};
      box-shadow:0 0 9px ${color},0 0 22px ${color}">
      </div>`,
    iconSize:[23,23],
    iconAnchor:[11,11]
   })
  }
 ).addTo(map);
}


/* =========================================================
   ROAD DISTANCE
========================================================= */

let roadDistance=Infinity;

async function updateRoadDistance(lat,lon){

 const nearby=
  await getRoadWays(
   lat,
   lon,
   250
  );

 if(!nearby.length){

  setStatus(
   "🛰️ Looking for a nearby road..."
  );

  return;
 }

 const nearest=
  nearestPointOnWays(
   nearby,
   lat,
   lon
  );

 if(!nearest) return;

 roadDistance=
  nearest.distance;

 setStatus(
  `🛣️ Nearest road: ${Math.round(roadDistance)}m • 🪙 ${coins.filter(c=>!c.collected).length} coins nearby`
 );
}


/* =========================================================
   OVERPASS
========================================================= */

const OVERPASS=[
 "https://overpass-api.de/api/interpreter",
 "https://overpass.kumi.systems/api/interpreter"
];


async function getRoadWays(
 lat,
 lon,
 radius=ROAD_SEARCH_RADIUS
){

 const query=`

 [out:json][timeout:25];

 way["highway"]
 (${lat-radius/111320},
  ${lon-radius/(111320*Math.cos(lat*Math.PI/180))},
  ${lat+radius/111320},
  ${lon+radius/(111320*Math.cos(lat*Math.PI/180))});

 out tags geom;

 `;

 for(const server of OVERPASS){

  try{

   const response=
    await fetch(server,{
     method:"POST",
     headers:{
      "Content-Type":
       "application/x-www-form-urlencoded"
     },
     body:
      "data="+
      encodeURIComponent(query)
    });

   if(!response.ok) continue;

   const json=
    await response.json();

   return filterRoads(
    json.elements || []
   );

  }catch(e){
   console.log(e);
  }
 }

 return [];
}


/* =========================================================
   ROAD FILTER
========================================================= */

function filterRoads(elements){

 const result=[];

 const publicAllowed=[
  "footway",
  "path",
  "pedestrian",
  "steps",
  "cycleway",
  "bridleway",
  "living_street",
  "residential",
  "service",
  "unclassified"
 ];

 const unlimitedForbidden=[
  "motorway",
  "motorway_link",
  "trunk",
  "trunk_link"
 ];

 for(const e of elements){

  if(
   e.type!=="way" ||
   !e.geometry ||
   e.geometry.length<2
  ) continue;

  const highway=
   e.tags?.highway;

  if(!highway) continue;

  const access=
   String(e.tags?.access||"")
    .toLowerCase();

  if(
   access==="private" ||
   access==="no" ||
   access==="customers"
  ) continue;

  if(
   gameMode==="PUBLIC" &&
   !publicAllowed.includes(highway)
  ) continue;

  if(
   gameMode==="UNLIMITED" &&
   unlimitedForbidden.includes(highway)
  ) continue;

  result.push({
   id:e.id,
   geometry:e.geometry,
   tags:e.tags||{}
  });
 }

 return result;
}


/* =========================================================
   NEAREST POINT
========================================================= */

function nearestPointOnWays(
 ways,
 lat,
 lon
){

 let best=null;

 for(const way of ways){

  for(let i=0;i<way.geometry.length;i++){

   const p=way.geometry[i];

   const d=
    distanceMeters(
     lat,lon,
     p.lat,p.lon
    );

   if(!best || d<best.distance){

    best={
     way,
     index:i,
     point:{
      lat:p.lat,
      lon:p.lon
     },
     distance:d
    };
   }
  }
 }

 return best;
}


/* =========================================================
   CONNECTED ROUTE
========================================================= */

async function loadRoute(lat,lon){

 if(routeLoading) return;

 routeLoading=true;

 lastRouteLat=lat;
 lastRouteLon=lon;

 loadingScreen.style.display="flex";

 loading(
  "Finding nearby roads...",
  60
 );

 setStatus(
  "🛣️ Finding the nearest connected road..."
 );

 try{

  const ways=
   await getRoadWays(
    lat,
    lon,
    ROAD_SEARCH_RADIUS
   );

  if(!ways.length){

   setStatus(
    "❌ No suitable mapped roads nearby."
   );

   return;
  }

  const start=
   nearestPointOnWays(
    ways,
    lat,
    lon
   );

  if(!start){

   setStatus(
    "❌ Couldn't find a road."
   );

   return;
  }

  loading(
   "Following connected roads...",
   80
  );

  /*
   IMPORTANT:

   The route starts at the closest
   mapped road segment and then only
   moves to ways whose endpoints
   actually connect.

   This prevents coins from jumping
   onto unrelated nearby roads.
  */

  const route=
   buildConnectedRoute(
    ways,
    start,
    25
   );

  removeTemporaryCoins();

  if(route.length===0){

   createCoin(
    start.point.lat,
    start.point.lon
   );

  }else{

   for(const p of route){

    createCoin(
     p.lat,
     p.lon
    );
   }
  }

  loading(
   "Route ready!",
   100
  );

  setTimeout(()=>{
   loadingScreen.style.display="none";
  },500);

  setStatus(
   `🛣️ Route loaded • ${coins.filter(c=>!c.collected).length} coins`
  );

 }catch(error){

  console.error(error);

  loadingScreen.style.display="none";

  setStatus(
   "⚠️ Couldn't load the road network."
  );

 }finally{

  routeLoading=false;
 }
}


/* =========================================================
   CONNECTED ROAD ROUTING
========================================================= */

function buildConnectedRoute(
 ways,
 start,
 coinCount
){

 const result=[];

 let currentWay=start.way;
 let currentIndex=start.index;

 let direction=
  currentIndex<
  currentWay.geometry.length-1
   ? 1
   : -1;

 let travelled=0;

 let last={
  ...start.point
 };

 const visited=new Set();

 while(result.length<coinCount){

  const key=
   `${currentWay.id}:${currentIndex}:${direction}`;

  if(visited.has(key)) break;

  visited.add(key);

  const nextIndex=
   currentIndex+direction;

  if(
   nextIndex<0 ||
   nextIndex>=currentWay.geometry.length
  ){

   const endpoint=
    currentWay.geometry[
     direction===1
      ? currentWay.geometry.length-1
      : 0
    ];

   const next=
    findConnectedWay(
     ways,
     endpoint,
     currentWay.id,
     visited
    );

   if(!next) break;

   currentWay=next.way;
   currentIndex=next.index;
   direction=next.direction;

   last={
    lat:currentWay.geometry[currentIndex].lat,
    lon:currentWay.geometry[currentIndex].lon
   };

   continue;
  }

  const point=
   currentWay.geometry[nextIndex];

  travelled+=
   distanceMeters(
    last.lat,
    last.lon,
    point.lat,
    point.lon
   );

  if(travelled>=COIN_SPACING){

   result.push({
    lat:point.lat,
    lon:point.lon
   });

   travelled=0;
  }

  last={
   lat:point.lat,
   lon:point.lon
  };

  currentIndex=nextIndex;
 }

 return result;
}


/* =========================================================
   CONNECTED WAY FINDER
========================================================= */

function findConnectedWay(
 ways,
 endpoint,
 currentWayId,
 visited
){

 let best=null;
 let bestDistance=30;

 for(const way of ways){

  if(way.id===currentWayId) continue;

  if(
   visited.has(
    `${way.id}:0:1`
   ) ||
   visited.has(
    `${way.id}:${way.geometry.length-1}:-1`
   )
  ) continue;

  const first=way.geometry[0];

  const last=
   way.geometry[
    way.geometry.length-1
   ];

  const d1=
   distanceMeters(
    endpoint.lat,
    endpoint.lon,
    first.lat,
    first.lon
   );

  const d2=
   distanceMeters(
    endpoint.lat,
    endpoint.lon,
    last.lat,
    last.lon
   );

  if(d1<bestDistance){

   best={
    way,
    index:0,
    direction:1
   };

   bestDistance=d1;
  }

  if(d2<bestDistance){

   best={
    way,
    index:way.geometry.length-1,
    direction:-1
   };

   bestDistance=d2;
  }
 }

 return best;
}


/* =========================================================
   COINS
========================================================= */

function coinId(lat,lon){

 return(
  Math.round(lat*100000)+
  "_" +
  Math.round(lon*100000)
 );
}


function createCoin(lat,lon){

 if(!map || !player) return;

 const id=coinId(lat,lon);

 if(
  player.collected_coins?.includes(id)
 ) return;

 for(const c of coins){

  if(
   distanceMeters(
    lat,lon,
    c.lat,c.lon
   )<20
  ) return;
 }

 const marker=
  L.marker(
   [lat,lon],
   {
    icon:L.divIcon({
     className:"",
     html:`<div class="coin">🪙</div>`,
     iconSize:[31,31],
     iconAnchor:[15,15]
    })
   }
  ).addTo(map);

 coins.push({
  id,
  lat,
  lon,
  marker,
  collected:false,
  temporary:true
 });
}


function removeTemporaryCoins(){

 for(const c of coins){

  if(
   c.temporary &&
   !c.collected &&
   map.hasLayer(c.marker)
  ){
   map.removeLayer(c.marker);
  }
 }

 coins=
  coins.filter(
   c=>c.collected
  );
}


/* =========================================================
   COLLECTION
========================================================= */

function checkCollections(lat,lon){

 for(const coin of coins){

  if(coin.collected) continue;

  const d=
   distanceMeters(
    lat,lon,
    coin.lat,coin.lon
   );

  if(d<=COLLECTION_DISTANCE){

   collectCoin(coin);
  }
 }
}


async function collectCoin(coin){

 if(
  coin.collected ||
  !player
 ) return;

 coin.collected=true;

 if(
  map.hasLayer(coin.marker)
 ){
  map.removeLayer(coin.marker);
 }

 if(
  !player.collected_coins
 ){
  player.collected_coins=[];
 }

 if(
  !player.collected_coins.includes(
   coin.id
  )
 ){
  player.collected_coins.push(
   coin.id
  );
 }

 player.coins=
  (player.coins||0)+10;

 player.xp=
  (player.xp||0)+10;

 checkLevel();

 updateCoins();

 showToast("🪙 +10 COINS!");

 setStatus(
  "🎮 Coin collected! Keep exploring."
 );

 await savePlayer();
}


function checkLevel(){

 if(!player) return;

 while(
  player.xp >=
  player.level*100
 ){

  player.xp-=
   player.level*100;

  player.level++;

  showToast(
   "🎉 LEVEL "+player.level+"!"
  );
 }
}


/* =========================================================
   SAVE
========================================================= */

async function savePlayer(){

 if(!player) return;

 const {error}=
  await supabase
   .from("players")
   .update({
    coins:player.coins,
    xp:player.xp,
    level:player.level,
    unlocked_skins:
     player.unlocked_skins,
    equipped_skin:
     player.equipped_skin,
    collected_coins:
     player.collected_coins,
    updated_at:
     new Date().toISOString()
   })
   .eq("id",user.id);

 if(error){

  console.error(error);

  showToast(
   "⚠️ Save failed"
  );
 }
}


function updateCoins(){

 coinsDisplay.textContent=
  "🪙 Coins: "+
  (player?.coins||0);
}


/* =========================================================
   SHOP
========================================================= */

document
 .getElementById("shopBtn")
 .onclick=()=>{
  document.getElementById(
   "shopModal"
  ).style.display="flex";

  renderShop();
 };


document
 .getElementById("closeShop")
 .onclick=()=>{
  document.getElementById(
   "shopModal"
  ).style.display="none";
 };


function renderShop(){

 const items=
  document.getElementById(
   "shopItems"
  );

 document.getElementById(
  "shopBalance"
 ).textContent=
  "🪙 Coins: "+player.coins;

 items.innerHTML="";

 for(const [id,skin] of Object.entries(SKINS)){

  const unlocked=
   player.unlocked_skins?.includes(id);

  const equipped=
   player.equipped_skin===id;

  const row=
   document.createElement("div");

  row.className="shopItem";

  row.innerHTML=`
   <div class="preview"
    style="background:${skin.color}"></div>

   <div class="shopInfo">
    <div class="shopName">
     ${skin.name}
    </div>
    <div class="price">
     ${skin.price===0
       ?"FREE"
       :"🪙 "+skin.price}
    </div>
   </div>
  `;

  const btn=
   document.createElement("button");

  btn.className="shopAction";

  if(equipped){

   btn.textContent="EQUIPPED";
   btn.disabled=true;

  }else if(unlocked){

   btn.textContent="EQUIP";

   btn.onclick=async()=>{

    player.equipped_skin=id;

    await savePlayer();

    updatePlayerIcon();

    renderShop();

    showToast(
     skin.name+" equipped!"
    );
   };

  }else if(player.coins>=skin.price){

   btn.textContent="BUY";

   btn.onclick=async()=>{

    player.coins-=skin.price;

    player.unlocked_skins.push(id);

    player.equipped_skin=id;

    await savePlayer();

    updateCoins();
    updatePlayerIcon();
    renderShop();

    showToast(
     "🎨 "+skin.name+" unlocked!"
    );
   };

  }else{

   btn.textContent="NEED COINS";
   btn.disabled=true;
  }

  row.appendChild(btn);
  items.appendChild(row);
 }
}


function updatePlayerIcon(){

 if(!playerMarker) return;

 const skin=
  SKINS[player.equipped_skin]||
  SKINS.blue;

 playerMarker.setIcon(
  L.divIcon({
   className:"",
   html:
    `<div class="player"
     style="background:${skin.color};
     box-shadow:0 0 9px ${skin.color},0 0 22px ${skin.color}">
     </div>`,
   iconSize:[23,23],
   iconAnchor:[11,11]
  })
 );
}
