<style>

.small{

/* MODE */

#modeScreen{

  align-items:center;

.modes{

/* HUD */

#hud{

}

.hud{

  background:rgba(7,13,19,.94);

}

}

.hudButton{

  cursor:pointer;
}

/* STATUS */

#status{

  left:12px;
  right:12px;
  bottom:calc(env(safe-area-inset-bottom) + 15px);
  z-index:5000;
  padding:12px;
  border-radius:14px;
  background:rgba(7,13,19,.94);

.player{

  border:3px solid white;

  background:var(--c);

.coin{

}

/* OVERLAYS */

.overlay{

<script type="module">

/* =========================================================
   SUPABASE
   ========================================================= */

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   CONFIG
   ========================================================= */

const INITIAL_RADIUS = 450;

const FALLBACK_RADIUS = 900;

const COIN_SPACING = 55;

const COLLECTION_DISTANCE = 20;

const ROAD_REFRESH_DISTANCE = 75;

const MAX_COINS = 30;


/* =========================================================
   STATE
   ========================================================= */

let user = null;

let player = null;

let map = null;

let playerMarker = null;

let gpsWatch = null;

let currentLat = null;

let currentLon = null;

let lastRoadLat = null;

let lastRoadLon = null;

let loadingRoad = false;

let gameStarted = false;

let mode = "PUBLIC";

let coins = [];


/* =========================================================
   SKINS
   ========================================================= */

const skins = {

  blue:{
    name:"Blue",
    color:"#00aaff",
    price:0
  },

  red:{
    name:"Red",
    color:"#ff3030",
    price:50
  },

  green:{
    name:"Green",
    color:"#22dd55",
    price:100
  },

  purple:{
    name:"Purple",
    color:"#aa55ff",
    price:150
  },

  gold:{
    name:"Gold",
    color:"#ffd000",
    price:250
  },

  pink:{
    name:"Pink",
    color:"#ff4fa3",
    price:350
  }

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const modeScreen =
  document.getElementById("modeScreen");

const loginStatus =
  document.getElementById("loginStatus");

const mapElement =
  document.getElementById("map");

const status =
  document.getElementById("status");

const coinsDisplay =
  document.getElementById("coins");

const toast =
  document.getElementById("toast");


/* =========================================================
   LOGIN
   ========================================================= */

document
  .getElementById("loginButton")
  .onclick = async () => {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    if(!email){

      loginStatus.textContent =
        "Enter your email.";

      return;

    }

    loginStatus.textContent =
      "Sending sign-in link...";

    const redirect =
      window.location.origin +
      window.location.pathname;


    const {
      error
    } =
      await supabase.auth.signInWithOtp({

        email,

        options:{
          emailRedirectTo:redirect
        }

      });


    if(error){

      console.error(error);

      loginStatus.textContent =
        error.message;

      return;

    }


    loginStatus.textContent =
      "✅ Check your email and tap the sign-in link.";

  };


/* =========================================================
   AUTH
   ========================================================= */

async function checkAuth(){

  const {
    data
  } =
    await supabase.auth.getSession();


  if(data.session){

    user =
      data.session.user;

    await startAfterLogin();

    return;

  }


  loginScreen.style.display =
    "flex";

}


supabase.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if(
      event === "SIGNED_IN" &&
      session
    ){

      user =
        session.user;

      await startAfterLogin();

    }


    if(
      event === "SIGNED_OUT"
    ){

      location.reload();

    }

  }
);


/* =========================================================
   PLAYER
   ========================================================= */

async function startAfterLogin(){

  loginScreen.style.display =
    "none";


  const {
    data,
    error
  } =
    await supabase
      .from("players")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();


  if(error){

    console.error(error);

    alert(
      "Player database error: " +
      error.message
    );

    return;

  }


  if(!data){

    const {
      data:newPlayer,
      error:createError
    } =
      await supabase
        .from("players")
        .insert({
          id:user.id
        })
        .select()
        .single();


    if(createError){

      console.error(createError);

      alert(
        "Couldn't create player: " +
        createError.message
      );

      return;

    }


    player =
      newPlayer;

  }else{

    player =
      data;

  }


  updateCoins();

  showMode();

}


/* =========================================================
   MODE
   ========================================================= */

function showMode(){

  modeScreen.style.display =
    "flex";

}


document
  .getElementById("publicMode")
  .onclick = () => {

    mode =
      "PUBLIC";

    beginGame();

  };


document
  .getElementById("unlimitedMode")
  .onclick = () => {

    mode =
      "UNLIMITED";

    beginGame();

  };


/* =========================================================
   BEGIN
   ========================================================= */

function beginGame(){

  modeScreen.style.display =
    "none";

  status.textContent =
    "📍 Getting your GPS location...";


  requestGPS();

}


/* =========================================================
   GPS
   ========================================================= */

function requestGPS(){

  if(!navigator.geolocation){

    status.textContent =
      "❌ Your browser does not support GPS.";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      handleLocation(position);

    },

    error => {

      console.error(error);

      status.textContent =
        "📍 Location permission is needed.";

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );


  gpsWatch =
    navigator.geolocation.watchPosition(

      handleLocation,

      error => {

        console.log(
          "GPS update:",
          error
        );

      },

      {
        enableHighAccuracy:true,
        maximumAge:2000,
        timeout:10000
      }

    );

}


/* =========================================================
   LOCATION
   ========================================================= */

function handleLocation(position){

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;


  currentLat =
    lat;

  currentLon =
    lon;


  if(!gameStarted){

    createMap(
      lat,
      lon
    );

    gameStarted =
      true;

    loadRoads(
      lat,
      lon
    );

    return;

  }


  if(playerMarker){

    playerMarker.setLatLng([
      lat,
      lon
    ]);

  }


  collectNearbyCoins(
    lat,
    lon
  );


  if(
    lastRoadLat !== null &&
    lastRoadLon !== null
  ){

    const moved =
      distance(
        lastRoadLat,
        lastRoadLon,
        lat,
        lon
      );


    if(
      moved >=
      ROAD_REFRESH_DISTANCE
    ){

      loadRoads(
        lat,
        lon
      );

    }

  }

}


/* =========================================================
   MAP
   ========================================================= */

function createMap(
  lat,
  lon
){

  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    ).setView(
      [lat,lon],
      17
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:20,
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);


  createPlayer(
    lat,
    lon
  );

}


/* =========================================================
   PLAYER MARKER
   ========================================================= */

function createPlayer(
  lat,
  lon
){

  const color =
    skins[
      player?.equipped_skin || "blue"
    ]?.color ||
    "#00aaff";


  playerMarker =
    L.marker(
      [lat,lon],
      {
        icon:
          L.divIcon({
            className:"",
            html:
              `<div class="player"
               style="--c:${color}">
               </div>`,
            iconSize:[24,24],
            iconAnchor:[12,12]
          })
      }
    ).addTo(map);

}


/* =========================================================
   ROAD LOADING
   ========================================================= */

async function loadRoads(
  lat,
  lon
){

  if(loadingRoad)
    return;


  loadingRoad =
    true;


  lastRoadLat =
    lat;

  lastRoadLon =
    lon;


  status.textContent =
    "🛣️ Finding your nearest connected road...";


  try{

    let ways =
      await overpass(
        lat,
        lon,
        INITIAL_RADIUS
      );


    if(
      ways.length === 0
    ){

      ways =
        await overpass(
          lat,
          lon,
          FALLBACK_RADIUS
        );

    }


    if(
      ways.length === 0
    ){

      status.textContent =
        "⚠️ No nearby mapped roads found.";

      loadingRoad =
        false;

      return;

    }


    const nearest =
      nearestWay(
        ways,
        lat,
        lon
      );


    if(!nearest){

      loadingRoad =
        false;

      return;

    }


    const connected =
      connectedWays(
        ways,
        nearest.way
      );


    clearUncollectedCoins();


    generateCoins(
      connected,
      nearest,
      lat,
      lon
    );


    status.textContent =
      `🛣️ Road found • ${Math.round(nearest.distance)}m away • ${coins.length} coins`;


  }catch(error){

    console.error(
      "Road loading:",
      error
    );

    status.textContent =
      "⚠️ Road search failed. Retrying...";

  }


  loadingRoad =
    false;

}


/* =========================================================
   OVERPASS
   ========================================================= */

async function overpass(
  lat,
  lon,
  radius
){

  const latDelta =
    radius / 111320;

  const lonDelta =
    radius /
    (
      111320 *
      Math.cos(
        lat *
        Math.PI /
        180
      )
    );


  const south =
    lat - latDelta;

  const north =
    lat + latDelta;

  const west =
    lon - lonDelta;

  const east =
    lon + lonDelta;


  let filter = `way["highway"]`;


  if(mode === "PUBLIC"){

    filter =
      `way["highway"]
      ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|unclassified"]`;

  }else{

    filter =
      `way["highway"]
      ["highway"!~"motorway|motorway_link|trunk|trunk_link"]`;

  }


  const query = `
[out:json][timeout:8];
${filter}(${south},${west},${north},${east});
out geom;
`;


  const servers = [

    "https://overpass-api.de/api/interpreter",

    "https://overpass.kumi.systems/api/interpreter"

  ];


  for(
    const server of servers
  ){

    try{

      const controller =
        new AbortController();

      const timer =
        setTimeout(
          () => controller.abort(),
          9000
        );


      const response =
        await fetch(
          server,
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },
            body:
              "data=" +
              encodeURIComponent(query),
            signal:
              controller.signal
          }
        );


      clearTimeout(timer);


      if(!response.ok)
        continue;


      const data =
        await response.json();


      return (
        data.elements || []
      ).filter(
        way =>
          way.geometry &&
          way.geometry.length >= 2
      );

    }catch(error){

      console.log(
        "Overpass failed",
        error
      );

    }

  }


  return [];

}


/* =========================================================
   NEAREST WAY
   ========================================================= */

function nearestWay(
  ways,
  lat,
  lon
){

  let best =
    null;


  for(
    const way of ways
  ){

    for(
      let i=0;
      i<way.geometry.length-1;
      i++
    ){

      const a =
        way.geometry[i];

      const b =
        way.geometry[i+1];


      const point =
        closestPoint(
          lat,
          lon,
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );


      const d =
        distance(
          lat,
          lon,
          point.lat,
          point.lon
        );


      if(
        !best ||
        d < best.distance
      ){

        best = {
          way,
          segment:i,
          point,
          distance:d
        };

      }

    }

  }


  return best;

}


/* =========================================================
   CLOSEST POINT ON SEGMENT
   ========================================================= */

function closestPoint(
  pLat,
  pLon,
  aLat,
  aLon,
  bLat,
  bLon
){

  const cos =
    Math.cos(
      pLat *
      Math.PI /
      180
    );


  const ax =
    aLon * cos;

  const ay =
    aLat;

  const bx =
    bLon * cos;

  const by =
    bLat;

  const px =
    pLon * cos;

  const py =
    pLat;


  const dx =
    bx - ax;

  const dy =
    by - ay;


  const len =
    dx*dx + dy*dy;


  if(len === 0){

    return {
      lat:aLat,
      lon:aLon
    };

  }


  let t =
    (
      (px-ax)*dx +
      (py-ay)*dy
    ) / len;


  t =
    Math.max(
      0,
      Math.min(
        1,
        t
      )
    );


  return {
    lat:
      aLat +
      (bLat-aLat)*t,

    lon:
      aLon +
      (bLon-aLon)*t
  };

}


/* =========================================================
   CONNECTED ROAD NETWORK
   ========================================================= */

function connectedWays(
  ways,
  startWay
){

  /*
   * OSM normally splits connected roads at
   * intersections. We therefore build a small
   * network using endpoints that are close together.
   */

  const result = [];

  const visited =
    new Set();


  function endpoint(
    way,
    first
  ){

    return first
      ? way.geometry[0]
      : way.geometry[
          way.geometry.length-1
        ];

  }


  function touches(
    a,
    b
  ){

    const a1 =
      endpoint(a,true);

    const a2 =
      endpoint(a,false);

    const b1 =
      endpoint(b,true);

    const b2 =
      endpoint(b,false);


    return (
      distance(
        a1.lat,a1.lon,
        b1.lat,b1.lon
      ) < 35 ||

      distance(
        a1.lat,a1.lon,
        b2.lat,b2.lon
      ) < 35 ||

      distance(
        a2.lat,a2.lon,
        b1.lat,b1.lon
      ) < 35 ||

      distance(
        a2.lat,a2.lon,
        b2.lat,b2.lon
      ) < 35
    );

  }


  function walk(
    way
  ){

    if(
      visited.has(
        way.id
      )
    )
      return;


    visited.add(
      way.id
    );

    result.push(
      way
    );


    for(
      const other of ways
    ){

      if(
        visited.has(
          other.id
        )
      )
        continue;


      if(
        touches(
          way,
          other
        )
      ){

        walk(
          other
        );

      }

    }

  }


  walk(
    startWay
  );


  return result;

}


/* =========================================================
   GENERATE COINS
   ========================================================= */

function generateCoins(
  ways,
  nearest,
  playerLat,
  playerLon
){

  const points = [];

  /*
   * Start exactly on the nearest road segment.
   */

  points.push(
    nearest.point
  );


  /*
   * Follow the nearest way in both directions.
   */

  const main =
    nearest.way.geometry;


  let start =
    nearest.segment;


  let forwardDistance = 0;

  let backwardDistance = 0;


  for(
    let i=start+1;
    i<main.length;
    i++
  ){

    const prev =
      main[i-1];

    const p =
      main[i];


    forwardDistance +=
      distance(
        prev.lat,
        prev.lon,
        p.lat,
        p.lon
      );


    if(
      forwardDistance >=
      COIN_SPACING
    ){

      points.push(p);

      forwardDistance = 0;

    }


    if(
      points.length >=
      MAX_COINS
    )
      break;

  }


  for(
    let i=start-1;
    i>=0 &&
    points.length<MAX_COINS;
    i--
  ){

    const next =
      main[i+1];

    const p =
      main[i];


    backwardDistance +=
      distance(
        next.lat,
        next.lon,
        p.lat,
        p.lon
      );


    if(
      backwardDistance >=
      COIN_SPACING
    ){

      points.push(p);

      backwardDistance = 0;

    }

  }


  /*
   * Add connected roads if there aren't
   * enough coins on the first road.
   */

  if(
    points.length < MAX_COINS
  ){

    for(
      const way of ways
    ){

      if(
        way.id ===
        nearest.way.id
      )
        continue;


      let accumulated = 0;


      for(
        let i=1;
        i<way.geometry.length;
        i++
      ){

        const a =
          way.geometry[i-1];

        const b =
          way.geometry[i];


        accumulated +=
          distance(
            a.lat,
            a.lon,
            b.lat,
            b.lon
          );


        if(
          accumulated >=
          COIN_SPACING
        ){

          points.push(b);

          accumulated = 0;

        }


        if(
          points.length >=
          MAX_COINS
        )
          break;

      }


      if(
        points.length >=
        MAX_COINS
      )
        break;

    }

  }


  /*
   * Remove duplicates and roads that are
   * obviously extremely far from the player.
   */

  const unique = [];


  for(
    const p of points
  ){

    if(
      distance(
        playerLat,
        playerLon,
        p.lat,
        p.lon
      ) > 1200
    )
      continue;


    const duplicate =
      unique.some(
        x =>
          distance(
            x.lat,
            x.lon,
            p.lat,
            p.lon
          ) < 20
      );


    if(!duplicate)
      unique.push(p);

  }


  for(
    const p of unique
  ){

    createCoin(
      p.lat,
      p.lon
    );

  }

}


/* =========================================================
   CREATE COIN
   ========================================================= */

function createCoin(
  lat,
  lon
){

  if(!map || !player)
    return;


  const id =
    Math.round(lat*100000) +
    "_" +
    Math.round(lon*100000);


  if(
    player.collected_coins &&
    player.collected_coins.includes(id)
  )
    return;


  if(
    coins.some(
      c =>
        distance(
          c.lat,
          c.lon,
          lat,
          lon
        ) < 20
    )
  )
    return;


  const marker =
    L.marker(
      [lat,lon],
      {
        icon:
          L.divIcon({
            className:"",
            html:
              `<div class="coin">🪙</div>`,
            iconSize:[31,31],
            iconAnchor:[15,15]
          })
      }
    ).addTo(map);


  coins.push({
    id,
    lat,
    lon,
    marker
  });

}


/* =========================================================
   REMOVE OLD COINS
   ========================================================= */

function clearUncollectedCoins(){

  for(
    const coin of coins
  ){

    if(
      map &&
      map.hasLayer(
        coin.marker
      )
    ){

      map.removeLayer(
        coin.marker
      );

    }

  }


  coins = [];

}


/* =========================================================
   COLLECT
   ========================================================= */

function collectNearbyCoins(
  lat,
  lon
){

  const found = [];


  for(
    const coin of coins
  ){

    const d =
      distance(
        lat,
        lon,
        coin.lat,
        coin.lon
      );


    if(
      d <=
      COLLECTION_DISTANCE
    ){

      found.push(
        coin
      );

    }

  }


  for(
    const coin of found
  ){

    collectCoin(
      coin
    );

  }

}


/* =========================================================
   COLLECT COIN
   ========================================================= */

async function collectCoin(
  coin
){

  if(!player)
    return;


  if(
    !player.collected_coins
  ){

    player.collected_coins =
      [];

  }


  if(
    player.collected_coins.includes(
      coin.id
    )
  )
    return;


  if(
    map &&
    map.hasLayer(
      coin.marker
    )
  ){

    map.removeLayer(
      coin.marker
    );

  }


  coins =
    coins.filter(
      c =>
        c.id !==
        coin.id
    );


  player.collected_coins.push(
    coin.id
  );


  player.coins =
    Number(
      player.coins || 0
    ) + 10;


  player.xp =
    Number(
      player.xp || 0
    ) + 10;


  checkLevel();


  updateCoins();


  toastMessage(
    "🪙 COIN COLLECTED! +10"
  );


  await savePlayer();

}


/* =========================================================
   LEVEL
   ========================================================= */

function checkLevel(){

  const needed =
    Number(player.level || 1) *
    100;


  if(
    player.xp >=
    needed
  ){

    player.xp -=
      needed;

    player.level =
      Number(player.level || 1) +
      1;


    toastMessage(
      "🎉 LEVEL " +
      player.level +
      "!"
    );

  }

}


/* =========================================================
   SAVE
   ========================================================= */

async function savePlayer(){

  if(!player)
    return;


  const {
    error
  } =
    await supabase
      .from("players")
      .update({

        coins:
          player.coins,

        xp:
          player.xp,

        level:
          player.level,

        unlocked_skins:
          player.unlocked_skins,

        equipped_skin:
          player.equipped_skin,

        collected_coins:
          player.collected_coins,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        player.id
      );


  if(error)
    console.error(
      "Save error:",
      error
    );

}

   ========================================================= */

function updateCoins(){

  coinsDisplay.textContent =
    "🪙 Coins: " +
    Number(

    );

}


/* =========================================================
   SHOP
   ========================================================= */

document
  .getElementById("shopButton")
  .onclick = () => {

    document
      .getElementById("shopOverlay")
      .style.display =
      "block";

    renderShop();

  };


document
  .getElementById("closeShop")
  .onclick = () => {

    document
      .getElementById("shopOverlay")
      .style.display =
      "none";

  };


function renderShop(){

  const container =
    document.getElementById(
      "shopItems"
    );

  const balance =
    document.getElementById(
      "shopBalance"
    );


  balance.textContent =
    "🪙 Coins: " +
    Number(
      player?.coins || 0
    );


  container.innerHTML =
    "";


  for(
    const [
      id,
      skin
    ] of Object.entries(skins)
  ){

    const unlocked =
      player.unlocked_skins
      ?.includes(id);


    const equipped =
      player.equipped_skin === id;


    const item =
      document.createElement(
        "div"
      );

    item.className =
      "shopItem";


    const preview =
      document.createElement(
        "div"
      );

    preview.className =
      "skin";

    preview.style.background =
      skin.color;


    const info =
      document.createElement(
        "div"
      );

    info.className =
      "skinInfo";

    info.innerHTML =
      `<strong>${skin.name}</strong>
       <br>
       <span style="color:#ffd700">
       ${
         skin.price === 0
         ? "FREE"
         : "🪙 " + skin.price
       }
       </span>`;


    const button =
      document.createElement(
        "button"
      );

    button.className =
      "buy";


    if(equipped){

      button.textContent =
        "EQUIPPED";

      button.disabled =
        true;

    }else if(unlocked){

      button.textContent =
        "EQUIP";

      button.onclick =
        () => equipSkin(id);

    }else{

      button.textContent =
        "BUY";

      button.disabled =
        player.coins <
        skin.price;

      button.onclick =
        () => buySkin(id);

    }


    item.append(
      preview,
      info,
      button
    );


    container.appendChild(
      item
    );

  }

}


/* =========================================================
   BUY SKIN
   ========================================================= */

async function buySkin(
  id
){

  const skin =
    skins[id];


  if(
    !skin ||
    player.coins <
    skin.price
  )
    return;


  if(
    !player.unlocked_skins
  ){

    player.unlocked_skins =
      ["blue"];

  }


  player.coins -=
    skin.price;


  player.unlocked_skins.push(
    id
  );


  player.equipped_skin =
    id;


  await savePlayer();

  updateCoins();

  updatePlayerIcon();

  renderShop();


  toastMessage(
    "🎨 " +
    skin.name +
    " unlocked!"
  );

}


/* =========================================================
   EQUIP
   ========================================================= */

async function equipSkin(
  id
){

  if(
    !player.unlocked_skins
      ?.includes(id)
  )
    return;


  player.equipped_skin =
    id;


  await savePlayer();

  updatePlayerIcon();

  renderShop();

}


/* =========================================================
   PLAYER SKIN
   ========================================================= */

function updatePlayerIcon(){

  if(!playerMarker)
    return;


  const color =
    skins[
      player.equipped_skin
    ]?.color ||
    "#00aaff";


  playerMarker.setIcon(
    L.divIcon({
      className:"",
      html:
        `<div class="player"
        style="--c:${color}">
        </div>`,
      iconSize:[24,24],
      iconAnchor:[12,12]
    })
  );

}

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;


function toastMessage(
  text
){

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;


  const dLat =
    (
      lat2-lat1
    ) *
    Math.PI /
    180;


  const dLon =
    (
      lon2-lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2)**2;


  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}
