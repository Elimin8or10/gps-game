<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font:inherit}

 <div class="authBox">

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL="https://yrcitnuuskcbiuryyytu.supabase.co";
const SUPABASE_KEY="sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const OVERPASS_SERVERS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];
const SEARCH_RADIUS=1200,ROAD_REFRESH_DISTANCE=75,COIN_SPACING=55,MAX_COINS=20,COLLECTION_DISTANCE=25,MIN_NEW_LOCATION_DISTANCE=40,RESPAWN_CHECK_MS=2500;
const SKINS={blue:{name:"Blue",color:"#00aaff",price:0},red:{name:"Red",color:"#ff3030",price:50},green:{name:"Green",color:"#22dd55",price:100},purple:{name:"Purple",color:"#aa55ff",price:150},gold:{name:"Gold",color:"#ffd000",price:250},pink:{name:"Pink",color:"#ff4fa3",price:350}};

let currentUser=null,playerData=null,gameMode=null,map=null,playerMarker=null,accuracyCircle=null,coins=[],roadNetwork=[],lastRoadLat=null,lastRoadLon=null,loadingRoads=false,watchId=null,toastTimer=null,deviceHeading=null,gpsHeading=null,lastGPSLat=null,lastGPSLon=null,compassListening=false;
const $=id=>document.getElementById(id);

function setStatus(t){$("status").textContent=t}
function setLoading(t,p){$("loadingText").textContent=t;$("loadingBar").style.width=p+"%"}
function showToast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200)}
function distanceMeters(lat1,lon1,lat2,lon2){const R=6371000,p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function normalizeHeading(v){if(typeof v!=="number"||Number.isNaN(v))return null;return((v%360)+360)%360}
function getBestHeading(){return deviceHeading!==null?deviceHeading:gpsHeading}
function updatePlayerHeading(){if(!playerMarker)return;const p=document.querySelector(".playerPointer"),h=getBestHeading();if(!p)return;if(h===null){p.style.opacity=".45";return}p.style.opacity="1";p.style.transform=`translateX(-50%) rotate(${h}deg)`}
function handleDeviceOrientation(e){let h=typeof e.webkitCompassHeading==="number"?e.webkitCompassHeading:typeof e.alpha==="number"?360-e.alpha:null;h=normalizeHeading(h);if(h!==null){deviceHeading=h;updatePlayerHeading()}}
async function enableCompass(){if(compassListening)return;try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){const p=await DeviceOrientationEvent.requestPermission();if(p!=="granted"){showToast("🧭 Compass permission not granted");return}}window.addEventListener("deviceorientation",handleDeviceOrientation,true);compassListening=true}catch(e){console.log("Compass:",e)}}

let musicEnabled=localStorage.getItem("gps_music")!=="off",sfxEnabled=localStorage.getItem("gps_sfx")!=="off",audioCtx=null,musicTimer=null,musicStep=0;
function startAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();startMusic()}
function playCoinSound(){if(!sfxEnabled)return;startAudio();const now=audioCtx.currentTime;[880,1175,1568].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.055);g.gain.exponentialRampToValueAtTime(.16,now+i*.055+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.055+.18);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.055);o.stop(now+i*.055+.2)})}
function startMusic(){if(!musicEnabled||musicTimer)return;if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();const notes=[220,277.18,329.63,277.18,246.94,329.63,369.99,329.63];musicTimer=setInterval(()=>{if(!musicEnabled)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type="triangle";o.frequency.value=notes[musicStep++%notes.length];g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.025,now+.03);g.gain.exponentialRampToValueAtTime(.0001,now+.42);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.45)},520)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function toggleMusic(){musicEnabled=!musicEnabled;localStorage.setItem("gps_music",musicEnabled?"on":"off");if(musicEnabled){startAudio();startMusic()}else stopMusic();updateAudioButtons()}
function toggleSfx(){sfxEnabled=!sfxEnabled;localStorage.setItem("gps_sfx",sfxEnabled?"on":"off");updateAudioButtons()}
function updateAudioButtons(){$("musicButton").textContent=musicEnabled?"🔊":"🔇";$("sfxButton").textContent=sfxEnabled?"🔔":"🔕";$("musicSetting").textContent=musicEnabled?"ON":"OFF";$("sfxSetting").textContent=sfxEnabled?"ON":"OFF"}
$("musicButton").onclick=toggleMusic;$("sfxButton").onclick=toggleSfx;$("musicSetting").onclick=toggleMusic;$("sfxSetting").onclick=toggleSfx;updateAudioButtons();

/* AUTH FIX:
   The old code used signInWithOtp(), which ALWAYS sends an email.
   This version uses anonymous authentication, so there is no email,
   no verification link, and the player can enter immediately.
*/
async function checkAuth(){
 try{
  const {data,error}=await supabase.auth.getSession();
  if(error)throw error;
  if(data.session){currentUser=data.session.user;await afterLogin()}
  else $("authScreen").style.display="flex";
 }catch(e){console.error(e);$("authStatus").textContent="❌ "+e.message}
}
$("signInButton").onclick=signIn;
$("emailInput").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});

async function signIn(){
 const btn=$("signInButton");btn.disabled=true;$("authStatus").textContent="Creating player...";
 try{
  let {data,error}=await supabase.auth.signInAnonymously();
  if(error)throw error;
  if(!data.session)throw new Error("Anonymous sign-in did not create a session.");
  currentUser=data.session.user;
  await afterLogin();
 }catch(e){
  console.error(e);
  $("authStatus").textContent="❌ "+e.message;
 }finally{btn.disabled=false}
}
async function afterLogin(){
 $("authScreen").style.display="none";
 try{await loadPlayer()}catch(e){console.error(e);$("authScreen").style.display="flex";$("authStatus").textContent="❌ Couldn't load player data: "+e.message;return}
 $("modeScreen").style.display="flex";
}
async function loadPlayer(){
 if(!currentUser)return;
 let {data,error}=await supabase.from("players").select("*").eq("id",currentUser.id).maybeSingle();
 if(error)throw error;
 if(!data){
  const newPlayer={id:currentUser.id,username:"Player",coins:0,xp:0,level:1,unlocked_skins:["blue"],equipped_skin:"blue",collected_coins:[]};
  const r=await supabase.from("players").insert(newPlayer).select().single();if(r.error)throw r.error;data=r.data;
 }
 data.coins=Number(data.coins||0);data.xp=Number(data.xp||0);data.level=Number(data.level||1);data.unlocked_skins=Array.isArray(data.unlocked_skins)?data.unlocked_skins:["blue"];data.collected_coins=Array.isArray(data.collected_coins)?data.collected_coins:[];data.equipped_skin=data.equipped_skin||"blue";playerData=data;updateCoinDisplay()
}
async function savePlayer(){if(!playerData)return;const{error}=await supabase.from("players").update({coins:playerData.coins,xp:playerData.xp,level:playerData.level,unlocked_skins:playerData.unlocked_skins,equipped_skin:playerData.equipped_skin,collected_coins:playerData.collected_coins,updated_at:new Date().toISOString()}).eq("id",playerData.id);if(error)console.error("Save:",error)}

$("publicMode").onclick=()=>chooseMode("PUBLIC");$("unlimitedMode").onclick=()=>chooseMode("UNLIMITED");
async function chooseMode(mode){gameMode=mode;$("modeScreen").style.display="none";$("loadingScreen").style.display="flex";initializeMap();await enableCompass();startAudio();setLoading("Requesting location...",30);startGPS()}
function initializeMap(){if(map)return;map=L.map("map").setView([42.96,-85.67],15);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map)}
function startGPS(){if(!navigator.geolocation){setStatus("❌ GPS is not supported.");return}watchId=navigator.geolocation.watchPosition(onLocation,onLocationError,{enableHighAccuracy:true,maximumAge:2000,timeout:15000})}
function onLocation(position){
 const lat=position.coords.latitude,lon=position.coords.longitude,accuracy=position.coords.accuracy||30;
 if(lastGPSLat!==null&&lastGPSLon!==null){const moved=distanceMeters(lastGPSLat,lastGPSLon,lat,lon);if(moved>=3){const lat1=lastGPSLat*Math.PI/180,lat2=lat*Math.PI/180,dLon=(lon-lastGPSLon)*Math.PI/180,y=Math.sin(dLon)*Math.cos(lat2),x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);gpsHeading=normalizeHeading(Math.atan2(y,x)*180/Math.PI);updatePlayerHeading()}}
 lastGPSLat=lat;lastGPSLon=lon;
 if(typeof position.coords.heading==="number"&&!Number.isNaN(position.coords.heading)&&position.coords.heading>=0){gpsHeading=normalizeHeading(position.coords.heading);updatePlayerHeading()}
 setLoading("Location found!",60);
 if(!playerMarker){createPlayer(lat,lon);map.setView([lat,lon],17);$("loadingScreen").style.display="none";setStatus("🗺️ Finding your connected road...");loadRoadNetwork(lat,lon)}
 else{playerMarker.setLatLng([lat,lon]);if(accuracyCircle)accuracyCircle.setLatLng([lat,lon]).setRadius(accuracy)}
 collectNearbyCoins(lat,lon);
 if(lastRoadLat===null||distanceMeters(lastRoadLat,lastRoadLon,lat,lon)>=ROAD_REFRESH_DISTANCE)loadRoadNetwork(lat,lon)
}
function onLocationError(error){console.error(error);$("loadingScreen").style.display="none";if(error.code===1)setStatus("📍 Location permission denied. Enable Location for this site.");else if(error.code===2)setStatus("📍 Location unavailable. Move somewhere with a clearer GPS signal.");else setStatus("📍 Waiting for a better GPS signal...")}
function createPlayer(lat,lon){
 const skin=SKINS[playerData?.equipped_skin]||SKINS.blue;
 playerMarker=L.marker([lat,lon],{icon:L.divIcon({className:"",html:`<div class="player" style="--player-color:${skin.color}"><div class="playerPointer"><div class="playerPointerInner"></div></div></div>`,iconSize:[28,50],iconAnchor:[14,25]}),zIndexOffset:1000}).addTo(map);
 accuracyCircle=L.circle([lat,lon],{radius:30,color:"#008ee6",weight:1,fillOpacity:.08}).addTo(map);updatePlayerHeading()
}

/* ROAD / COIN CODE */
async function loadRoadNetwork(lat,lon){if(loadingRoads)return;loadingRoads=true;lastRoadLat=lat;lastRoadLon=lon;setStatus("🗺️ Searching nearby roads...");try{const ways=await getNearbyWays(lat,lon);if(!ways.length){setStatus("🔎 No mapped roads found. Retrying...");loadingRoads=false;setTimeout(()=>loadRoadNetwork(lat,lon),4000);return}const nearest=findNearestRoadPoint(ways,lat,lon);if(!nearest){loadingRoads=false;return}if(nearest.distance>400){setStatus(`🚶 Nearest mapped road: ${Math.round(nearest.distance)}m away`);loadingRoads=false;return}roadNetwork=buildConnectedNetwork(ways,nearest.way);generateNetworkCoins(roadNetwork,nearest);setStatus(`🛣️ Road ${Math.round(nearest.distance)}m away • ${coins.length} coins`)}catch(e){console.error(e);setStatus("⚠️ Road server failed. Retrying...")}loadingRoads=false}
async function getNearbyWays(lat,lon){const ld=SEARCH_RADIUS/111320,lo=SEARCH_RADIUS/(111320*Math.cos(lat*Math.PI/180)),south=lat-ld,north=lat+ld,west=lon-lo,east=lon+lo;let filter=`way["highway"](${south},${west},${north},${east});`;if(gameMode==="PUBLIC")filter=`way["highway"]["access"!="private"]["access"!="no"]["access"!="customers"]["access"!="permit"](${south},${west},${north},${east});`;const query=`[out:json][timeout:20];${filter}out tags geom;`;for(const server of OVERPASS_SERVERS){try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),14000),response=await fetch(server,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(query),signal:controller.signal});clearTimeout(timeout);if(!response.ok)continue;const json=await response.json(),ways=filterWays(json.elements||[]);if(ways.length)return ways}catch(e){console.log("Overpass failed",server)}}return []}
function filterWays(elements){const publicRoads=["footway","path","pedestrian","steps","cycleway","bridleway","living_street","residential","unclassified","service","tertiary","tertiary_link","secondary","secondary_link"],result=[];for(const e of elements){if(e.type!=="way"||!e.geometry||e.geometry.length<2)continue;const highway=e.tags?.highway;if(!highway)continue;if(gameMode==="PUBLIC"? !publicRoads.includes(highway):["motorway","motorway_link","trunk","trunk_link"].includes(highway))continue;result.push({id:e.id,geometry:e.geometry.map(p=>({lat:+p.lat,lon:+p.lon})),tags:e.tags||{}})}return result}
function findNearestRoadPoint(ways,lat,lon){let best=null;for(const way of ways)for(let i=0;i<way.geometry.length-1;i++){const a=way.geometry[i],b=way.geometry[i+1],point=closestPointOnSegment(lat,lon,a.lat,a.lon,b.lat,b.lon),d=distanceMeters(lat,lon,point.lat,point.lon);if(!best||d<best.distance)best={way,segmentIndex:i,point,distance:d}}return best}
function closestPointOnSegment(lat,lon,lat1,lon1,lat2,lon2){const cos=Math.cos(lat*Math.PI/180),x=(lon-lon1)*111320*cos,y=(lat-lat1)*111320,dx=(lon2-lon1)*111320*cos,dy=(lat2-lat1)*111320,len2=dx*dx+dy*dy;let t=len2===0?0:(x*dx+y*dy)/len2;t=Math.max(0,Math.min(1,t));return{lat:lat1+(lat2-lat1)*t,lon:lon1+(lon2-lon1)*t}}
function buildConnectedNetwork(ways,start){const network=[],visited=new Set(),queue=[start];while(queue.length){const way=queue.shift();if(visited.has(way.id))continue;visited.add(way.id);network.push(way);for(const other of ways)if(!visited.has(other.id)&&waysConnected(way,other))queue.push(other)}return network}
function waysConnected(a,b){const a1=a.geometry[0],a2=a.geometry[a.geometry.length-1],b1=b.geometry[0],b2=b.geometry[b.geometry.length-1];return[[a1,b1],[a1,b2],[a2,b1],[a2,b2]].some(([x,y])=>distanceMeters(x.lat,x.lon,y.lat,y.lon)<=30)}
function coinId(lat,lon){return Math.round(lat*100000)+"_"+Math.round(lon*100000)}
function generateNetworkCoins(network,nearest){if(!network.length||coins.length>=MAX_COINS)return;const candidates=[];const ordered=network.slice().sort((a,b)=>distanceToWay(nearest.point,a)-distanceToWay(nearest.point,b));for(const way of ordered)candidates.push(...pointsAlongWay(way));for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}let added=0;for(const p of candidates){if(coins.length>=MAX_COINS)break;if(isFarFromActiveCoins(p)&&!wasCollected(p)&&addCoin(p.lat,p.lon))added++}if(coins.length<MAX_COINS)for(const p of candidates){if(coins.length>=MAX_COINS)break;if(isFarFromActiveCoins(p)&&addCoin(p.lat,p.lon))added++}if(added)setStatus(`🪙 ${coins.length} coins available nearby`)}
function pointsAlongWay(way){const result=[];for(let i=1;i<way.geometry.length;i++){const a=way.geometry[i-1],b=way.geometry[i],d=distanceMeters(a.lat,a.lon,b.lat,b.lon);if(d>0){const steps=Math.max(1,Math.floor(d/COIN_SPACING));for(let s=1;s<=steps;s++){const t=s/steps;result.push({lat:a.lat+(b.lat-a.lat)*t,lon:a.lon+(b.lon-a.lon)*t})}}}return result}
function distanceToWay(point,way){let best=Infinity;for(const p of way.geometry)best=Math.min(best,distanceMeters(point.lat,point.lon,p.lat,p.lon));return best}
function isFarFromActiveCoins(p){return coins.every(c=>distanceMeters(p.lat,p.lon,c.lat,c.lon)>=MIN_NEW_LOCATION_DISTANCE)}
function wasCollected(p){return playerData?.collected_coins?.includes(coinId(p.lat,p.lon))}
function addCoin(lat,lon){if(!map||!playerData)return false;const id=coinId(lat,lon);if(coins.some(c=>distanceMeters(lat,lon,c.lat,c.lon)<MIN_NEW_LOCATION_DISTANCE))return false;const marker=L.marker([lat,lon],{icon:L.divIcon({className:"",html:`<div class="coin">🪙</div>`,iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map);coins.push({id,lat,lon,marker,collected:false});return true}
function collectNearbyCoins(lat,lon){for(const c of [...coins])if(!c.collected&&distanceMeters(lat,lon,c.lat,c.lon)<=COLLECTION_DISTANCE)collectCoin(c)}
async function collectCoin(c){if(!playerData||c.collected)return;c.collected=true;if(map.hasLayer(c.marker))map.removeLayer(c.marker);coins=coins.filter(x=>x!==c);if(!playerData.collected_coins.includes(c.id))playerData.collected_coins.push(c.id);playerData.coins+=10;playerData.xp+=10;checkLevel();updateCoinDisplay();playCoinSound();showToast("🪙 COIN COLLECTED! +10");setStatus("🎮 Keep exploring!");await savePlayer();if(coins.length===0&&roadNetwork.length&&lastRoadLat!==null){const n=findNearestRoadPoint(roadNetwork,lastRoadLat,lastRoadLon);if(n)generateNetworkCoins(roadNetwork,n)}}
function checkLevel(){let required=playerData.level*100;while(playerData.xp>=required){playerData.xp-=required;playerData.level++;showToast(`🎉 LEVEL ${playerData.level}!`);required=playerData.level*100}}
function updateCoinDisplay(){$("coinsDisplay").textContent=`🪙 Coins: ${playerData?.coins||0}`}
setInterval(()=>{if(!playerData||!roadNetwork.length||lastRoadLat===null)return;const n=findNearestRoadPoint(roadNetwork,lastRoadLat,lastRoadLon);if(n&&(coins.length===0||coins.length<Math.min(5,MAX_COINS)))generateNetworkCoins(roadNetwork,n)},RESPAWN_CHECK_MS);

/* SHOP */
$("shopButton").onclick=()=>{$("shopOverlay").style.display="block";renderShop()};$("closeShop").onclick=()=>$("shopOverlay").style.display="none";
function renderShop(){if(!playerData)return;$("shopBalance").textContent=`🪙 Coins: ${playerData.coins}`;$("shopItems").innerHTML="";for(const[id,skin]of Object.entries(SKINS)){const unlocked=playerData.unlocked_skins.includes(id),equipped=playerData.equipped_skin===id,item=document.createElement("div");item.className="shopItem";const preview=document.createElement("div");preview.className="skinPreview";preview.style.background=skin.color;const info=document.createElement("div");info.className="skinInfo";info.innerHTML=`<div class="skinName">${skin.name}</div><div class="skinPrice">${skin.price===0?"FREE":"🪙 "+skin.price}</div>`;const button=document.createElement("button");button.className="action";if(equipped){button.textContent="EQUIPPED";button.disabled=true}else if(unlocked){button.textContent="EQUIP";button.onclick=()=>equipSkin(id)}else if(playerData.coins>=skin.price){button.textContent="BUY";button.onclick=()=>buySkin(id)}else{button.textContent="NEED COINS";button.disabled=true}item.append(preview,info,button);$("shopItems").appendChild(item)}}
async function buySkin(id){const skin=SKINS[id];if(!skin||playerData.unlocked_skins.includes(id))return;if(playerData.coins<skin.price){showToast("❌ Not enough coins");return}playerData.coins-=skin.price;playerData.unlocked_skins.push(id);playerData.equipped_skin=id;await savePlayer();updateCoinDisplay();updatePlayerSkin();renderShop();showToast(`🎨 ${skin.name} unlocked!`)}
async function equipSkin(id){if(!playerData.unlocked_skins.includes(id))return;playerData.equipped_skin=id;await savePlayer();updatePlayerSkin();renderShop()}
function updatePlayerSkin(){if(!playerMarker)return;const skin=SKINS[playerData.equipped_skin]||SKINS.blue;playerMarker.setIcon(L.divIcon({className:"",html:`<div class="player" style="--player-color:${skin.color}"><div class="playerPointer"><div class="playerPointerInner"></div></div></div>`,iconSize:[28,50],iconAnchor:[14,25]}));updatePlayerHeading()}

/* ACCOUNT */
$("accountButton").onclick=()=>{$("accountOverlay").style.display="block";$("accountEmail").textContent="Player account • No email required"};
$("closeAccount").onclick=()=>$("accountOverlay").style.display="none";
$("signOutButton").onclick=async()=>{stopMusic();if(watchId!==null)navigator.geolocation.clearWatch(watchId);await supabase.auth.signOut();location.reload()};
supabase.auth.onAuthStateChange((event,session)=>{console.log("Auth:",event);if(event==="SIGNED_OUT")location.reload()});
checkAuth();
</script>
