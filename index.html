<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* =========================
       HUD
       ========================= */

    #hud {
      position: absolute;

      top: 15px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      display: flex;
      gap: 10px;

      font-family: Arial, sans-serif;
    }

    .hudBox {
      background: rgba(10, 15, 20, 0.94);

      color: white;

      padding: 10px 14px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.4);

      font-weight: bold;
    }

    #coins {
      flex: 1;
    }

    #mode {
      cursor: pointer;
      user-select: none;
    }

    /* =========================
       STATUS
       ========================= */

    #status {
      position: absolute;

      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      background: rgba(10, 15, 20, 0.94);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;
    }

    /* =========================
       PLAYER
       ========================= */

    .player {
      width: 22px;
      height: 22px;

      background: #00aaff;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px #00aaff,
        0 0 18px #00aaff;
    }

    /* =========================
       COIN
       ========================= */

    .coin {
      width: 28px;
      height: 28px;

      background: radial-gradient(
        circle at 35% 35%,
        #fffbd0 0%,
        #ffe44d 25%,
        #ffd000 55%,
        #f0a000 80%,
        #c87800 100%
      );

      border: 3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255, 190, 0, 0.7);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 17px;

      animation: coinPulse 1.4s infinite;
    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>

</head>

<body>


  <!-- =========================
       HUD
       ========================= -->

  <div id="hud">

    <div
      class="hudBox"
      id="coins"
    >
      🪙 Coins: 0
    </div>

    <div
      class="hudBox"
      id="mode"
    >
      🌎 PUBLIC
    </div>

  </div>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="status">
    📍 Finding your location...
  </div>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>

    /* =====================================================
       GAME VARIABLES
       ===================================================== */

    let map = null;

    let player = null;

    let coins = [];

    let coinCount = 0;

    let gameMode = "PUBLIC";

    let lastLatitude = null;

    let lastLongitude = null;

    let loadingCoins = false;


    /* =====================================================
       SETTINGS
       ===================================================== */

    const NUMBER_OF_COINS = 8;

    const SEARCH_DISTANCE_METERS = 500;

    const MIN_COIN_DISTANCE = 50;

    const COIN_REFRESH_DISTANCE = 100;

    const COLLECTION_DISTANCE = 15;

    const COIN_VALUE = 10;


    /*
      OSM servers.
    */

    const OVERPASS_SERVERS = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];



    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(
      latitude,
      longitude
    ) {

      /*
        IMPORTANT:

        The map is centered ONCE.

        GPS updates never call setView().
      */

      map =
        L.map("map").setView(

          [
            latitude,
            longitude
          ],

          17

        );


      /*
        OpenStreetMap tiles.
      */

      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

          attribution:
            "© OpenStreetMap contributors"

        }

      ).addTo(map);


      /*
        Player icon.
      */

      const playerIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="player"></div>',

          iconSize:
            [28, 28],

          iconAnchor:
            [14, 14]

        });


      player =
        L.marker(

          [
            latitude,
            longitude
          ],

          {

            icon:
              playerIcon

          }

        ).addTo(map);


      lastLatitude =
        latitude;

      lastLongitude =
        longitude;


      /*
        Find coins.
      */

      loadCoinsFromOSM(

        latitude,

        longitude

      );

    }



    /* =====================================================
       GPS UPDATE
       ===================================================== */

    function updateLocation(
      position
    ) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      /*
        First GPS reading.
      */

      if (!map) {

        startGame(

          latitude,

          longitude

        );

        return;

      }


      /*
        Move player.

        NO map.setView() HERE.
      */

      player.setLatLng([

        latitude,

        longitude

      ]);


      /*
        Check nearby coins.
      */

      checkCoinCollection(

        latitude,

        longitude

      );


      /*
        Only refresh coins after
        traveling 100 meters.
      */

      if (

        lastLatitude !== null &&

        lastLongitude !== null

      ) {

        const moved =
          getDistanceMeters(

            lastLatitude,

            lastLongitude,

            latitude,

            longitude

          );


        if (
          moved >=
          COIN_REFRESH_DISTANCE
        ) {

          lastLatitude =
            latitude;

          lastLongitude =
            longitude;


          loadCoinsFromOSM(

            latitude,

            longitude

          );

        }

      }

    }



    /* =====================================================
       LOAD OSM DATA
       ===================================================== */

    async function loadCoinsFromOSM(

      latitude,

      longitude

    ) {

      if (loadingCoins) {
        return;
      }


      loadingCoins = true;


      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Finding coin locations...";


      /*
        Remove old uncollected coins.
      */

      removeUncollectedCoins();


      /*
        Convert 500m to coordinates.
      */

      const latOffset =
        SEARCH_DISTANCE_METERS /
        111320;


      const lonOffset =
        SEARCH_DISTANCE_METERS /
        (
          111320 *
          Math.cos(
            latitude *
            Math.PI /
            180
          )
        );


      const south =
        latitude -
        latOffset;


      const north =
        latitude +
        latOffset;


      const west =
        longitude -
        lonOffset;


      const east =
        longitude +
        lonOffset;


      /*
        Ask OSM for highway/path ways.
      */

      const query = `

        [out:json]
        [timeout:15];

        way
          ["highway"]
          (${south},${west},${north},${east});

        out tags geom;

      `;


      let data = null;


      /*
        Try first server, then backup.
      */

      for (

        let i = 0;

        i <
        OVERPASS_SERVERS.length;

        i++

      ) {

        try {

          const response =
            await fetch(

              OVERPASS_SERVERS[i],

              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/x-www-form-urlencoded"

                },

                body:
                  "data=" +
                  encodeURIComponent(
                    query
                  )

              }

            );


          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }


          data =
            await response.json();


          break;


        } catch (error) {

          console.log(
            "OSM error:",
            error
          );

        }

      }


      if (!data) {

        document.getElementById(
          "status"
        ).innerText =
          "⚠️ Couldn't load map data.";

        loadingCoins = false;

        return;

      }


      /*
        Get candidate locations.
      */

      const candidates =
        getCoinCandidates(

          data,

          latitude,

          longitude

        );


      /*
        Sort by distance.

        This makes placement
        predictable.
      */

      candidates.sort(

        function(a, b) {

          return (
            a.distance -
            b.distance
          );

        }

      );


      /*
        Choose evenly spaced
        locations.

        No random selection.
      */

      const selected =
        chooseCoinLocations(
          candidates
        );


      /*
        Create coins.
      */

      selected.forEach(

        function(location) {

          createCoin(

            location.latitude,

            location.longitude

          );

        }

      );


      document.getElementById(
        "status"
      ).innerText =

        "🎮 " +
        selected.length +
        " coins found!";


      loadingCoins = false;

    }



    /* =====================================================
       FIND CANDIDATES
       ===================================================== */

    function getCoinCandidates(

      data,

      playerLatitude,

      playerLongitude

    ) {

      const candidates = [];


      if (
        !data ||
        !data.elements
      ) {

        return candidates;

      }


      data.elements.forEach(

        function(element) {


          if (
            element.type !== "way"
          ) {

            return;

          }


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {

            return;

          }


          const tags =
            element.tags || {};


          const highway =
            tags.highway;


          if (!highway) {
            return;
          }


          const access =
            String(
              tags.access || ""
            ).toLowerCase();


          const motorVehicle =
            String(
              tags.motor_vehicle || ""
            ).toLowerCase();


          const vehicle =
            String(
              tags.vehicle || ""
            ).toLowerCase();



          /* =========================================
             PUBLIC MODE
             ========================================= */

          if (
            gameMode === "PUBLIC"
          ) {


            /*
              Explicitly restricted
              ways are rejected.
            */

            if (

              access === "private" ||

              access === "no" ||

              access === "customers" ||

              access === "permit"

            ) {

              return;

            }


            if (

              motorVehicle === "private" ||

              motorVehicle === "no" ||

              vehicle === "private" ||

              vehicle === "no"

            ) {

              return;

            }


            /*
              Favor pedestrian-oriented
              ways.
            */

            const publicWays = [

              "footway",

              "path",

              "pedestrian",

              "steps",

              "cycleway",

              "bridleway",

              "corridor"

            ];


            if (
              !publicWays.includes(
                highway
              )
            ) {

              return;

            }

          }



          /* =========================================
             UNLIMITED MODE
             ========================================= */

          if (
            gameMode === "UNLIMITED"
          ) {


            /*
              Still avoid major
              high-speed roads.
            */

            const dangerousWays = [

              "motorway",

              "motorway_link",

              "trunk",

              "trunk_link",

              "primary",

              "primary_link"

            ];


            if (
              dangerousWays.includes(
                highway
              )
            ) {

              return;

            }

          }



          /*
            Pick midpoint instead of random
            point.

            This makes it consistent.
          */

          const midpoint =
            getGeometryMidpoint(

              element.geometry

            );


          if (!midpoint) {
            return;
          }


          const distance =
            getDistanceMeters(

              playerLatitude,

              playerLongitude,

              midpoint.lat,

              midpoint.lon

            );


          if (
            distance <
            MIN_COIN_DISTANCE
          ) {

            return;

          }


          if (
            distance >
            SEARCH_DISTANCE_METERS
          ) {

            return;

          }


          candidates.push({

            latitude:
              midpoint.lat,

            longitude:
              midpoint.lon,

            distance:
              distance,

            highway:
              highway

          });

        }

      );


      return candidates;

    }



    /* =====================================================
       GET MIDPOINT
       ===================================================== */

    function getGeometryMidpoint(
      geometry
    ) {

      if (
        !geometry ||
        geometry.length === 0
      ) {

        return null;

      }


      /*
        Use the middle OSM node.

        Unlike Math.random(),
        this is repeatable.
      */

      const index =
        Math.floor(
          geometry.length / 2
        );


      const point =
        geometry[index];


      if (
        !point ||
        typeof point.lat !== "number" ||
        typeof point.lon !== "number"
      ) {

        return null;

      }


      return point;

    }



    /* =====================================================
       CHOOSE COIN LOCATIONS
       ===================================================== */

    function chooseCoinLocations(
      candidates
    ) {

      const selected = [];


      /*
        Coins need space between them.
      */

      const MIN_SEPARATION = 60;


      for (

        let i = 0;

        i <
        candidates.length;

        i++

      ) {


        const candidate =
          candidates[i];


        let tooClose =
          false;


        for (

          let j = 0;

          j <
          selected.length;

          j++

        ) {


          const existing =
            selected[j];


          const distance =
            getDistanceMeters(

              candidate.latitude,

              candidate.longitude,

              existing.latitude,

              existing.longitude

            );


          if (
            distance <
            MIN_SEPARATION
          ) {

            tooClose =
              true;

            break;

          }

        }


        if (
          !tooClose
        ) {

          selected.push(
            candidate
          );

        }


        /*
          We have enough.
        */

        if (
          selected.length >=
          NUMBER_OF_COINS
        ) {

          break;

        }

      }


      return selected;

    }



    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(

      latitude,

      longitude

    ) {


      const coinIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="coin">🪙</div>',

          iconSize:
            [34, 34],

          iconAnchor:
            [17, 17]

        });


      const marker =
        L.marker(

          [
            latitude,

            longitude

          ],

          {

            icon:
              coinIcon

          }

        ).addTo(map);


      coins.push({

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }



    /* =====================================================
       REMOVE OLD COINS
       ===================================================== */

    function removeUncollectedCoins() {

      const remaining = [];


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {

            remaining.push(
              coin
            );

          } else {


            if (
              map.hasLayer(
                coin.marker
              )
            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }

      );


      coins =
        remaining;

    }



    /* =====================================================
       CHECK COLLECTION
       ===================================================== */

    function checkCoinCollection(

      latitude,

      longitude

    ) {


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {

            return;

          }


          const distance =
            getDistanceMeters(

              latitude,

              longitude,

              coin.latitude,

              coin.longitude

            );


          if (
            distance <=
            COLLECTION_DISTANCE
          ) {

            collectCoin(
              coin
            );

          }

        }

      );

    }



    /* =====================================================
       COLLECT COIN
       ===================================================== */

    function collectCoin(
      coin
    ) {


      coin.collected =
        true;


      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );

      }


      coinCount +=
        COIN_VALUE;


      document.getElementById(
        "coins"
      ).innerText =

        "🪙 Coins: " +
        coinCount;


      document.getElementById(
        "status"
      ).innerText =

        "🪙 COIN COLLECTED! +10";


      setTimeout(

        function() {

          document.getElementById(
            "status"
          ).innerText =
            "🎮 KEEP EXPLORING";

        },

        2000

      );

    }



    /* =====================================================
       DISTANCE
       ===================================================== */

    function getDistanceMeters(

      latitude1,
      longitude1,

      latitude2,
      longitude2

    ) {


      const R =
        6371000;


      const lat1 =
        latitude1 *
        Math.PI /
        180;


      const lat2 =
        latitude2 *
        Math.PI /
        180;


      const dLat =
        (
          latitude2 -
          latitude1
        ) *
        Math.PI /
        180;


      const dLon =
        (
          longitude2 -
          longitude1
        ) *
        Math.PI /
        180;


      const a =

        Math.sin(
          dLat / 2
        ) ** 2

        +

        Math.cos(lat1) *

        Math.cos(lat2) *

        Math.sin(
          dLon / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return R * c;

    }



    /* =====================================================
       MODE SWITCH
       ===================================================== */

    document.getElementById(
      "mode"
    ).addEventListener(

      "click",

      function() {


        if (
          gameMode === "PUBLIC"
        ) {


          gameMode =
            "UNLIMITED";


          document.getElementById(
            "mode"
          ).innerText =
            "🔓 UNLIMITED";


        } else {


          gameMode =
            "PUBLIC";


          document.getElementById(
            "mode"
          ).innerText =
            "🌎 PUBLIC";

        }


        /*
          Reload coins using the
          new mode.
        */

        if (

          lastLatitude !== null &&

          lastLongitude !== null

        ) {

          loadCoinsFromOSM(

            lastLatitude,

            lastLongitude

          );

        }

      }

    );



    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(
      error
    ) {

      console.log(
        "GPS error:",
        error
      );


      document.getElementById(
        "status"
      ).innerText =
        "❌ Couldn't get your location.";

    }



    /* =====================================================
       START GPS
       ===================================================== */

    if (
      "geolocation" in navigator
    ) {


      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );


    } else {


      document.getElementById(
        "status"
      ).innerText =
        "❌ GPS isn't available.";

    }

  </script>

</body>
</html>
