<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* HUD */

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      display: flex;
      gap: 10px;

      font-family: Arial, sans-serif;
    }

    .hudBox {
      background: rgba(10, 15, 20, 0.94);
      color: white;

      padding: 10px 14px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.4);

      font-weight: bold;
    }

    #coins {
      flex: 1;
    }

    #mode {
      cursor: pointer;
      user-select: none;
    }

    /* STATUS */

    #status {
      position: absolute;

      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      background: rgba(10, 15, 20, 0.94);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;
    }

    /* PLAYER */

    .player {
      width: 22px;
      height: 22px;

      background: #00aaff;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px #00aaff,
        0 0 18px #00aaff;
    }

    /* COIN */

    .coin {
      width: 28px;
      height: 28px;

      background: radial-gradient(
        circle at 35% 35%,
        #fffbd0 0%,
        #ffe44d 25%,
        #ffd000 55%,
        #f0a000 80%,
        #c87800 100%
      );

      border: 3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255, 190, 0, 0.7);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;

      animation: coinPulse 1.4s infinite;
    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>

</head>

<body>


  <!-- HUD -->

  <div id="hud">

    <div
      class="hudBox"
      id="coins"
    >
      🪙 Coins: 0
    </div>

    <div
      class="hudBox"
      id="mode"
    >
      🌎 PUBLIC
    </div>

  </div>


  <!-- STATUS -->

  <div id="status">
    📍 Finding your location...
  </div>


  <!-- MAP -->

  <div id="map"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>


    /* =====================================================
       GAME SETTINGS
       ===================================================== */

    let map = null;

    let player = null;

    let coins = [];

    let coinCount = 0;

    let gameMode = "PUBLIC";

    let lastLatitude = null;

    let lastLongitude = null;

    let loadingCoins = false;


    /*
      Distance required to collect a coin.
    */

    const COLLECTION_DISTANCE = 15;


    /*
      Number of coins we want.
    */

    const NUMBER_OF_COINS = 8;


    /*
      Search around player.
    */

    const SEARCH_DISTANCE_METERS = 500;


    /*
      Don't place coins directly beside player.
    */

    const MIN_COIN_DISTANCE = 40;


    /*
      Refresh after moving this far.
    */

    const COIN_REFRESH_DISTANCE = 100;


    /*
      Coin reward.
    */

    const COIN_VALUE = 10;


    /*
      OSM servers.
    */

    const OVERPASS_SERVERS = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];



    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(
      latitude,
      longitude
    ) {


      /*
        Initial map centering ONLY.

        GPS updates will NOT call setView().
      */

      map = L.map("map").setView(
        [latitude, longitude],
        17
      );


      /*
        OpenStreetMap.
      */

      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          attribution:
            "© OpenStreetMap contributors"
        }

      ).addTo(map);


      /*
        Player.
      */

      const playerIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="player"></div>',

          iconSize:
            [28, 28],

          iconAnchor:
            [14, 14]

        });


      player =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              playerIcon
          }

        ).addTo(map);


      lastLatitude =
        latitude;

      lastLongitude =
        longitude;


      /*
        Find coins.
      */

      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Finding nearby locations...";


      loadCoinsFromOSM(
        latitude,
        longitude
      );

    }



    /* =====================================================
       GPS UPDATE
       ===================================================== */

    function updateLocation(
      position
    ) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      /*
        First GPS update.
      */

      if (!map) {

        startGame(
          latitude,
          longitude
        );

        return;

      }


      /*
        ONLY move player.

        IMPORTANT:

        No map.setView().
      */

      player.setLatLng([

        latitude,
        longitude

      ]);


      /*
        Check coins.
      */

      checkCoinCollection(

        latitude,
        longitude

      );


      /*
        Refresh coin field after traveling.
      */

      if (

        lastLatitude !== null &&

        lastLongitude !== null

      ) {


        const moved =
          getDistanceMeters(

            lastLatitude,
            lastLongitude,

            latitude,
            longitude

          );


        if (

          moved >=
          COIN_REFRESH_DISTANCE

        ) {


          lastLatitude =
            latitude;

          lastLongitude =
            longitude;


          loadCoinsFromOSM(

            latitude,
            longitude

          );

        }

      }

    }



    /* =====================================================
       LOAD COINS
       ===================================================== */

    async function loadCoinsFromOSM(

      latitude,
      longitude

    ) {


      if (loadingCoins) {
        return;
      }


      loadingCoins = true;


      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Loading nearby map data...";


      removeUncollectedCoins();


      /*
        Convert meters to coordinates.
      */

      const latOffset =
        SEARCH_DISTANCE_METERS /
        111320;


      const lonOffset =
        SEARCH_DISTANCE_METERS /
        (
          111320 *
          Math.cos(
            latitude *
            Math.PI /
            180
          )
        );


      const south =
        latitude -
        latOffset;


      const north =
        latitude +
        latOffset;


      const west =
        longitude -
        lonOffset;


      const east =
        longitude +
        lonOffset;


      /*
        Broad OSM query.

        We filter locally.
      */

      const query = `

        [out:json]
        [timeout:25];

        way
          ["highway"]
          (${south},${west},${north},${east});

        out tags geom;

      `;


      let data = null;


      /*
        Try multiple servers.
      */

      for (

        let i = 0;

        i <
        OVERPASS_SERVERS.length;

        i++

      ) {


        try {


          const response =
            await fetch(

              OVERPASS_SERVERS[i],

              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/x-www-form-urlencoded"

                },

                body:
                  "data=" +
                  encodeURIComponent(
                    query
                  )

              }

            );


          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }


          data =
            await response.json();


          break;


        } catch (error) {


          console.log(
            "OSM server failed:",
            error
          );

        }

      }


      /*
        Couldn't load OSM.
      */

      if (!data) {


        document.getElementById(
          "status"
        ).innerText =
          "⚠️ Couldn't load map data.";


        loadingCoins = false;

        return;

      }


      /*
        Create candidate locations.
      */

      const candidates =
        getCoinCandidates(

          data,

          latitude,

          longitude

        );


      if (
        candidates.length === 0
      ) {


        document.getElementById(
          "status"
        ).innerText =

          gameMode === "PUBLIC"

            ? "🔎 No suitable public paths nearby."

            : "🔎 No mapped roads or paths nearby.";


        loadingCoins = false;

        return;

      }


      /*
        Randomize.
      */

      shuffleArray(
        candidates
      );


      /*
        Choose spread-out locations.
      */

      const selected =
        chooseSpreadOutCoins(
          candidates
        );


      /*
        Add coins.
      */

      selected.forEach(

        function(location) {

          createCoin(

            location.latitude,

            location.longitude

          );

        }

      );


      document.getElementById(
        "status"
      ).innerText =

        "🎮 " +
        selected.length +
        " coins found nearby!";


      loadingCoins = false;

    }



    /* =====================================================
       GET CANDIDATES
       ===================================================== */

    function getCoinCandidates(

      data,

      playerLatitude,

      playerLongitude

    ) {


      const candidates = [];


      if (
        !data ||
        !data.elements
      ) {

        return candidates;

      }


      data.elements.forEach(

        function(element) {


          if (
            element.type !== "way"
          ) {

            return;

          }


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {

            return;

          }


          const tags =
            element.tags || {};


          const highway =
            tags.highway;


          if (!highway) {
            return;
          }


          const access =
            String(
              tags.access || ""
            ).toLowerCase();


          const motorVehicle =
            String(
              tags.motor_vehicle || ""
            ).toLowerCase();


          const vehicle =
            String(
              tags.vehicle || ""
            ).toLowerCase();



          /* =========================================
             PUBLIC MODE
             ========================================= */

          if (
            gameMode === "PUBLIC"
          ) {


            /*
              Explicitly restricted.
            */

            if (

              access === "private" ||

              access === "no" ||

              access === "customers" ||

              access === "permit"

            ) {

              return;

            }


            if (

              motorVehicle === "private" ||

              motorVehicle === "no" ||

              vehicle === "private" ||

              vehicle === "no"

            ) {

              return;

            }


            /*
              Pedestrian-oriented ways.
            */

            const publicWays = [

              "footway",

              "path",

              "pedestrian",

              "steps",

              "cycleway",

              "bridleway",

              "corridor"

            ];


            if (
              !publicWays.includes(
                highway
              )
            ) {

              return;

            }

          }



          /* =========================================
             UNLIMITED MODE
             ========================================= */

          if (
            gameMode === "UNLIMITED"
          ) {


            /*
              Still don't place coins on
              major highways.
            */

            const dangerousWays = [

              "motorway",

              "motorway_link",

              "trunk",

              "trunk_link",

              "primary",

              "primary_link"

            ];


            if (
              dangerousWays.includes(
                highway
              )
            ) {

              return;

            }

          }



          /*
            Pick an actual point from
            the OSM geometry.
          */

          const point =
            chooseGeometryPoint(

              element.geometry

            );


          if (!point) {
            return;
          }


          /*
            Straight-line distance.
          */

          const distance =
            getDistanceMeters(

              playerLatitude,
              playerLongitude,

              point.lat,
              point.lon

            );


          if (
            distance <
            MIN_COIN_DISTANCE
          ) {

            return;

          }


          if (
            distance >
            SEARCH_DISTANCE_METERS
          ) {

            return;

          }


          candidates.push({

            latitude:
              point.lat,

            longitude:
              point.lon,

            highway:
              highway,

            distance:
              distance

          });

        }

      );


      return candidates;

    }



    /* =====================================================
       SPREAD COINS OUT
       ===================================================== */

    function chooseSpreadOutCoins(
      candidates
    ) {


      const selected = [];


      const MIN_SEPARATION = 45;


      for (

        let i = 0;

        i <
        candidates.length;

        i++

      ) {


        const candidate =
          candidates[i];


        let tooClose =
          false;


        for (

          let j = 0;

          j <
          selected.length;

          j++

        ) {


          const existing =
            selected[j];


          const distance =
            getDistanceMeters(

              candidate.latitude,

              candidate.longitude,

              existing.latitude,

              existing.longitude

            );


          if (
            distance <
            MIN_SEPARATION
          ) {

            tooClose =
              true;

            break;

          }

        }


        if (
          !tooClose
        ) {

          selected.push(
            candidate
          );

        }


        if (
          selected.length >=
          NUMBER_OF_COINS
        ) {

          break;

        }

      }


      return selected;

    }



    /* =====================================================
       PICK OSM POINT
       ===================================================== */

    function chooseGeometryPoint(
      geometry
    ) {


      if (
        !geometry ||
        geometry.length === 0
      ) {

        return null;

      }


      const index =
        Math.floor(

          Math.random() *
          geometry.length

        );


      const point =
        geometry[index];


      if (
        !point ||
        typeof point.lat !== "number" ||
        typeof point.lon !== "number"
      ) {

        return null;

      }


      return point;

    }



    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(

      latitude,

      longitude

    ) {


      const coinIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="coin">🪙</div>',

          iconSize:
            [34, 34],

          iconAnchor:
            [17, 17]

        });


      const marker =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              coinIcon
          }

        ).addTo(map);


      coins.push({

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }



    /* =====================================================
       REMOVE UNCOLLECTED COINS
       ===================================================== */

    function removeUncollectedCoins() {


      const remaining = [];


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {


            remaining.push(
              coin
            );


          } else {


            if (
              map.hasLayer(
                coin.marker
              )
            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }

      );


      coins =
        remaining;

    }



    /* =====================================================
       CHECK COINS
       ===================================================== */

    function checkCoinCollection(

      latitude,

      longitude

    ) {


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {

            return;

          }


          const distance =
            getDistanceMeters(

              latitude,
              longitude,

              coin.latitude,
              coin.longitude

            );


          if (
            distance <=
            COLLECTION_DISTANCE
          ) {

            collectCoin(
              coin
            );

          }

        }

      );

    }



    /* =====================================================
       COLLECT
       ===================================================== */

    function collectCoin(
      coin
    ) {


      coin.collected =
        true;


      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );

      }


      coinCount +=
        COIN_VALUE;


      document.getElementById(
        "coins"
      ).innerText =

        "🪙 Coins: " +
        coinCount;


      document.getElementById(
        "status"
      ).innerText =

        "🪙 COIN COLLECTED! +10";


      setTimeout(

        function() {

          document.getElementById(
            "status"
          ).innerText =
            "🎮 KEEP EXPLORING";

        },

        2000

      );

    }



    /* =====================================================
       DISTANCE
       ===================================================== */

    function getDistanceMeters(

      latitude1,
      longitude1,

      latitude2,
      longitude2

    ) {


      const R =
        6371000;


      const lat1 =
        latitude1 *
        Math.PI /
        180;


      const lat2 =
        latitude2 *
        Math.PI /
        180;


      const dLat =
        (
          latitude2 -
          latitude1
        ) *
        Math.PI /
        180;


      const dLon =
        (
          longitude2 -
          longitude1
        ) *
        Math.PI /
        180;


      const a =

        Math.sin(
          dLat / 2
        ) ** 2

        +

        Math.cos(lat1) *

        Math.cos(lat2) *

        Math.sin(
          dLon / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return R * c;

    }



    /* =====================================================
       SHUFFLE
       ===================================================== */

    function shuffleArray(
      array
    ) {


      for (

        let i =
          array.length - 1;

        i > 0;

        i--

      ) {


        const j =
          Math.floor(

            Math.random() *
            (i + 1)

          );


        const temp =
          array[i];


        array[i] =
          array[j];


        array[j] =
          temp;

      }

    }



    /* =====================================================
       MODE BUTTON
       ===================================================== */

    document.getElementById(
      "mode"
    ).addEventListener(

      "click",

      function() {


        if (
          gameMode === "PUBLIC"
        ) {


          gameMode =
            "UNLIMITED";


          document.getElementById(
            "mode"
          ).innerText =
            "🔓 UNLIMITED";


        } else {


          gameMode =
            "PUBLIC";


          document.getElementById(
            "mode"
          ).innerText =
            "🌎 PUBLIC";

        }


        /*
          Reload nearby coins
          under the new rules.
        */

        if (

          lastLatitude !== null &&

          lastLongitude !== null

        ) {

          loadCoinsFromOSM(

            lastLatitude,

            lastLongitude

          );

        }

      }

    );



    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(
      error
    ) {


      console.log(
        "GPS error:",
        error
      );


      document.getElementById(
        "status"
      ).innerText =
        "❌ Couldn't get your location.";

    }



    /* =====================================================
       START GPS
       ===================================================== */

    if (
      "geolocation" in navigator
    ) {


      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );


    } else {


      document.getElementById(
        "status"
      ).innerText =
        "❌ GPS isn't available.";

    }

  </script>

</body>
</html>
