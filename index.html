<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;

      display: flex;
      gap: 10px;

      font-family: Arial, sans-serif;
    }

    .hudBox {
      background: rgba(10, 15, 20, 0.94);
      color: white;

      padding: 10px 14px;

      border-radius: 12px;

      box-shadow: 0 3px 12px rgba(0,0,0,0.4);

      font-weight: bold;
    }

    #coins {
      flex: 1;
    }

    #mode {
      cursor: pointer;
      user-select: none;
    }

    #status {
      position: absolute;

      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      background: rgba(10,15,20,0.94);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;
    }

    .player {
      width: 22px;
      height: 22px;

      background: #00aaff;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px #00aaff,
        0 0 18px #00aaff;
    }

    .coin {
      width: 28px;
      height: 28px;

      background: radial-gradient(
        circle at 35% 35%,
        #fffbd0 0%,
        #ffe44d 25%,
        #ffd000 55%,
        #f0a000 80%,
        #c87800 100%
      );

      border: 3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255,190,0,0.7);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;

      animation: coinPulse 1.4s infinite;
    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>

</head>

<body>

  <div id="hud">

    <div
      class="hudBox"
      id="coins"
    >
      🪙 Coins: 0
    </div>

    <div
      class="hudBox"
      id="mode"
    >
      🌎 PUBLIC
    </div>

  </div>


  <div id="status">
    📍 Finding your location...
  </div>


  <div id="map"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>


    /* =====================================================
       GAME STATE
       ===================================================== */

    let map = null;

    let player = null;

    let coins = [];

    let coinCount = 0;

    let gameMode = "PUBLIC";

    let currentLatitude = null;

    let currentLongitude = null;

    let loadingTrail = false;


    /* =====================================================
       SETTINGS
       ===================================================== */

    const SEARCH_RADIUS = 800;

    const COIN_SPACING = 65;

    const MAIN_COINS = 5;

    const BRANCH_COINS = 3;

    const COLLECTION_DISTANCE = 15;

    const REFRESH_DISTANCE = 200;


    const OVERPASS_SERVERS = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];


    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(latitude, longitude) {

      map =
        L.map("map").setView(

          [
            latitude,
            longitude
          ],

          17

        );


      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          attribution:
            "© OpenStreetMap contributors"
        }

      ).addTo(map);


      const playerIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="player"></div>',

          iconSize:
            [28, 28],

          iconAnchor:
            [14, 14]

        });


      player =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              playerIcon
          }

        ).addTo(map);


      currentLatitude =
        latitude;

      currentLongitude =
        longitude;


      loadTrail(

        latitude,

        longitude

      );

    }


    /* =====================================================
       GPS UPDATE

       IMPORTANT:
       NO map.setView()
       ===================================================== */

    function updateLocation(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      if (!map) {

        startGame(
          latitude,
          longitude
        );

        return;

      }


      player.setLatLng([

        latitude,
        longitude

      ]);


      checkCoinCollection(

        latitude,
        longitude

      );


      if (

        currentLatitude !== null &&

        currentLongitude !== null

      ) {

        const distance =
          distanceMeters(

            currentLatitude,
            currentLongitude,

            latitude,
            longitude

          );


        if (
          distance >=
          REFRESH_DISTANCE
        ) {

          currentLatitude =
            latitude;

          currentLongitude =
            longitude;

          loadTrail(

            latitude,
            longitude

          );

        }

      }

    }


    /* =====================================================
       LOAD OSM ROAD/PATH NETWORK
       ===================================================== */

    async function loadTrail(

      latitude,
      longitude

    ) {

      if (loadingTrail) {
        return;
      }

      loadingTrail = true;


      setStatus(
        "🗺️ Building a path..."
      );


      removeUncollectedCoins();


      const latOffset =
        SEARCH_RADIUS / 111320;


      const lonOffset =
        SEARCH_RADIUS /
        (
          111320 *
          Math.cos(
            latitude *
            Math.PI /
            180
          )
        );


      const south =
        latitude -
        latOffset;

      const north =
        latitude +
        latOffset;

      const west =
        longitude -
        lonOffset;

      const east =
        longitude +
        lonOffset;


      /*
        Get OSM ways and their complete geometry.

        We are intentionally getting the geometry,
        not just random nearby points.
      */

      const query = `

        [out:json]
        [timeout:20];

        way["highway"]
          (${south},${west},${north},${east});

        out tags geom;

      `;


      let data = null;


      for (
        let i = 0;
        i < OVERPASS_SERVERS.length;
        i++
      ) {

        try {

          const response =
            await fetch(

              OVERPASS_SERVERS[i],

              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/x-www-form-urlencoded"

                },

                body:
                  "data=" +
                  encodeURIComponent(
                    query
                  )

              }

            );


          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }


          data =
            await response.json();


          break;

        } catch (error) {

          console.log(
            "Overpass error:",
            error
          );

        }

      }


      if (!data) {

        setStatus(
          "⚠️ Couldn't load map data."
        );

        loadingTrail = false;

        return;

      }


      /*
        Convert OSM ways into network segments.
      */

      const ways =
        filterWays(

          data.elements

        );


      if (
        ways.length === 0
      ) {

        setStatus(

          gameMode === "PUBLIC"

            ? "🔎 No suitable public paths nearby."

            : "🔎 No mapped paths nearby."

        );

        loadingTrail = false;

        return;

      }


      /*
        Find the closest actual point
        on the OSM network.
      */

      const start =
        findClosestNetworkPoint(

          ways,

          latitude,

          longitude

        );


      if (!start) {

        setStatus(
          "🔎 Couldn't find a nearby path."
        );

        loadingTrail = false;

        return;

      }


      /*
        Build the main route by following
        connected OSM geometry.
      */

      const mainRoute =
        buildNetworkRoute(

          ways,

          start,

          MAIN_COINS

        );


      /*
        Find a branch off the route.

        This is a REAL network branch,
        not merely a nearby line.
      */

      const branchRoute =
        findNetworkBranch(

          ways,

          mainRoute,

          start

        );


      /*
        Put coins on main route.
      */

      mainRoute.forEach(

        function(point) {

          createCoin(

            point.lat,
            point.lon

          );

        }

      );


      /*
        Put coins on branch.
      */

      branchRoute.forEach(

        function(point) {

          createCoin(

            point.lat,
            point.lon

          );

        }

      );


      const total =
        mainRoute.length +
        branchRoute.length;


      if (total === 0) {

        setStatus(
          "🔎 Path found, but it was too short for coins."
        );

      } else {

        setStatus(

          "🎮 " +
          total +
          " coins on real mapped paths"

        );

      }


      loadingTrail = false;

    }


    /* =====================================================
       FILTER OSM WAYS
       ===================================================== */

    function filterWays(elements) {

      const result = [];


      elements.forEach(

        function(element) {

          if (
            element.type !== "way"
          ) {
            return;
          }


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {
            return;
          }


          const tags =
            element.tags || {};


          const highway =
            tags.highway;


          if (!highway) {
            return;
          }


          const access =
            String(
              tags.access || ""
            ).toLowerCase();


          /*
            PUBLIC MODE

            Only use ways intended
            for walking/cycling/etc.
          */

          if (
            gameMode === "PUBLIC"
          ) {

            if (

              access === "private" ||

              access === "no" ||

              access === "permit" ||

              access === "customers"

            ) {

              return;

            }


            const allowed = [

              "footway",

              "path",

              "pedestrian",

              "steps",

              "cycleway",

              "bridleway",

              "living_street"

            ];


            if (
              !allowed.includes(
                highway
              )
            ) {

              return;

            }

          }


          /*
            UNLIMITED MODE

            Private roads can be used.

            Major highways are still excluded.
          */

          if (
            gameMode === "UNLIMITED"
          ) {

            const forbidden = [

              "motorway",

              "motorway_link",

              "trunk",

              "trunk_link",

              "primary",

              "primary_link"

            ];


            if (
              forbidden.includes(
                highway
              )
            ) {

              return;

            }

          }


          result.push({

            id:
              element.id,

            geometry:
              element.geometry,

            tags:
              tags

          });

        }

      );


      return result;

    }


    /* =====================================================
       FIND CLOSEST NETWORK POINT
       ===================================================== */

    function findClosestNetworkPoint(

      ways,

      latitude,
      longitude

    ) {

      let best = null;


      ways.forEach(

        function(way) {

          way.geometry.forEach(

            function(point, index) {

              const distance =
                distanceMeters(

                  latitude,
                  longitude,

                  point.lat,
                  point.lon

                );


              if (

                best === null ||

                distance <
                best.distance

              ) {

                best = {

                  way:
                    way,

                  index:
                    index,

                  distance:
                    distance,

                  point:
                    point

                };

              }

            }

          );

        }

      );


      return best;

    }


    /* =====================================================
       BUILD NETWORK ROUTE
       ===================================================== */

    function buildNetworkRoute(

      ways,

      start,

      numberOfCoins

    ) {

      const route = [];


      /*
        Start at the closest way.

        Determine which direction to follow.
      */

      const geometry =
        start.way.geometry;


      let direction = 1;


      if (
        start.index >=
        geometry.length - 1
      ) {

        direction = -1;

      } else if (
        start.index > 0
      ) {

        const before =
          geometry[
            start.index - 1
          ];

        const after =
          geometry[
            start.index + 1
          ];


        const beforeDistance =
          distanceMeters(

            start.point.lat,
            start.point.lon,

            before.lat,
            before.lon

          );


        const afterDistance =
          distanceMeters(

            start.point.lat,
            start.point.lon,

            after.lat,
            after.lon

          );


        /*
          Pick the direction that goes
          farther away from the player.
        */

        if (
          beforeDistance >
          afterDistance
        ) {

          direction = -1;

        }

      }


      /*
        Follow connected ways.
      */

      let currentWay =
        start.way;

      let currentIndex =
        start.index;

      let currentDirection =
        direction;


      let previousWayId =
        null;


      let accumulated =
        0;


      let lastPoint =
        start.point;


      const visited =
        new Set();


      while (
        route.length <
        numberOfCoins
      ) {


        /*
          Prevent infinite loops.
        */

        const visitKey =
          currentWay.id +
          ":" +
          currentIndex +
          ":" +
          currentDirection;


        if (
          visited.has(
            visitKey
          )
        ) {

          break;

        }


        visited.add(
          visitKey
        );


        const nextIndex =
          currentIndex +
          currentDirection;


        /*
          We've reached the end
          of this OSM way.

          Find a connected way.
        */

        if (

          nextIndex < 0 ||

          nextIndex >=
          currentWay.geometry.length

        ) {


          const endpoint =

            currentWay.geometry[
              currentDirection === 1

                ? currentWay.geometry.length - 1

                : 0
            ];


          const nextWay =
            findConnectedWay(

              ways,

              endpoint,

              currentWay.id,

              visited

            );


          if (!nextWay) {

            break;

          }


          currentWay =
            nextWay.way;

          currentIndex =
            nextWay.index;

          currentDirection =
            nextWay.direction;

          continue;

        }


        const point =
          currentWay.geometry[
            nextIndex
          ];


        const segment =
          distanceMeters(

            lastPoint.lat,
            lastPoint.lon,

            point.lat,
            point.lon

          );


        accumulated +=
          segment;


        if (
          accumulated >=
          COIN_SPACING
        ) {


          route.push({

            lat:
              point.lat,

            lon:
              point.lon

          });


          accumulated = 0;

        }


        lastPoint =
          point;

        currentIndex =
          nextIndex;

      }


      return route;

    }


    /* =====================================================
       FIND CONNECTED WAY
       ===================================================== */

    function findConnectedWay(

      ways,

      endpoint,

      currentWayId,

      visited

    ) {


      let best = null;

      let bestDistance =
        30;


      ways.forEach(

        function(way) {

          if (
            way.id ===
            currentWayId
          ) {
            return;
          }


          /*
            Look at BOTH ends of each way.

            A connection occurs when
            endpoints are close together.
          */

          const first =
            way.geometry[0];

          const last =
            way.geometry[
              way.geometry.length - 1
            ];


          const firstDistance =
            distanceMeters(

              endpoint.lat,
              endpoint.lon,

              first.lat,
              first.lon

            );


          const lastDistance =
            distanceMeters(

              endpoint.lat,
              endpoint.lon,

              last.lat,
              last.lon

            );


          if (
            firstDistance <=
            bestDistance
          ) {

            best = {

              way:
                way,

              index:
                0,

              direction:
                1

            };

            bestDistance =
              firstDistance;

          }


          if (
            lastDistance <=
            bestDistance
          ) {

            best = {

              way:
                way,

              index:
                way.geometry.length - 1,

              direction:
                -1

            };

            bestDistance =
              lastDistance;

          }

        }

      );


      return best;

    }


    /* =====================================================
       FIND A REAL NETWORK BRANCH
       ===================================================== */

    function findNetworkBranch(

      ways,

      mainRoute,

      start

    ) {

      if (
        mainRoute.length <
        2
      ) {

        return [];

      }


      /*
        Find a way connected to
        a point along the main route
        but NOT simply continuing
        the same way.
      */

      for (

        let r = 1;

        r <
        mainRoute.length;

        r++

      ) {


        const routePoint =
          mainRoute[r];


        for (

          let i = 0;

          i <
          ways.length;

          i++

        ) {


          const way =
            ways[i];


          /*
            Skip the starting way.

            We want an actual branch.
          */

          if (
            way.id ===
            start.way.id
          ) {

            continue;

          }


          const first =
            way.geometry[0];

          const last =
            way.geometry[
              way.geometry.length - 1
            ];


          const firstDistance =
            distanceMeters(

              routePoint.lat,
              routePoint.lon,

              first.lat,
              first.lon

            );


          const lastDistance =
            distanceMeters(

              routePoint.lat,
              routePoint.lon,

              last.lat,
              last.lon

            );


          /*
            30 meters is close enough
            to count as a mapped connection.

            This accommodates small OSM
            geometry differences.
          */

          if (
            firstDistance <= 30
          ) {

            return buildBranch(

              way,

              0,

              1

            );

          }


          if (
            lastDistance <= 30
          ) {

            return buildBranch(

              way,

              way.geometry.length - 1,

              -1

            );

          }

        }

      }


      return [];

    }


    /* =====================================================
       BUILD BRANCH
       ===================================================== */

    function buildBranch(

      way,

      startIndex,

      direction

    ) {

      const result = [];


      let accumulated = 0;


      let lastPoint =
        way.geometry[startIndex];


      for (

        let step = 1;

        step <
        way.geometry.length;

        step++

      ) {


        const index =
          startIndex +
          step *
          direction;


        if (
          index < 0 ||

          index >=
          way.geometry.length

        ) {

          break;

        }


        const point =
          way.geometry[index];


        accumulated +=
          distanceMeters(

            lastPoint.lat,
            lastPoint.lon,

            point.lat,
            point.lon

          );


        if (
          accumulated >=
          COIN_SPACING
        ) {


          result.push({

            lat:
              point.lat,

            lon:
              point.lon

          });


          accumulated = 0;


          if (
            result.length >=
            BRANCH_COINS
          ) {

            break;

          }

        }


        lastPoint =
          point;

      }


      return result;

    }


    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(

      latitude,
      longitude

    ) {


      /*
        Don't stack coins.
      */

      for (
        let i = 0;
        i < coins.length;
        i++
      ) {


        const existing =
          coins[i];


        if (

          distanceMeters(

            latitude,
            longitude,

            existing.latitude,
            existing.longitude

          ) < 20

        ) {

          return;

        }

      }


      const coinIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="coin">🪙</div>',

          iconSize:
            [34,34],

          iconAnchor:
            [17,17]

        });


      const marker =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              coinIcon
          }

        ).addTo(map);


      coins.push({

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }


    /* =====================================================
       REMOVE UNCOLLECTED COINS
       ===================================================== */

    function removeUncollectedCoins() {

      const remaining = [];


      coins.forEach(

        function(coin) {

          if (
            coin.collected
          ) {

            remaining.push(
              coin
            );

          } else {

            if (
              map.hasLayer(
                coin.marker
              )
            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }

      );


      coins =
        remaining;

    }


    /* =====================================================
       CHECK COLLECTION
       ===================================================== */

    function checkCoinCollection(

      latitude,
      longitude

    ) {

      coins.forEach(

        function(coin) {

          if (
            coin.collected
          ) {
            return;
          }


          const distance =
            distanceMeters(

              latitude,
              longitude,

              coin.latitude,
              coin.longitude

            );


          if (
            distance <=
            COLLECTION_DISTANCE
          ) {

            collectCoin(
              coin
            );

          }

        }

      );

    }


    /* =====================================================
       COLLECT
       ===================================================== */

    function collectCoin(
      coin
    ) {

      coin.collected =
        true;


      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );

      }


      coinCount +=
        10;


      document.getElementById(
        "coins"
      ).innerText =

        "🪙 Coins: " +
        coinCount;


      setStatus(
        "🪙 COIN COLLECTED! +10"
      );


      setTimeout(

        function() {

          setStatus(
            "🎮 KEEP EXPLORING"
          );

        },

        2000

      );

    }


    /* =====================================================
       DISTANCE CALCULATOR
       ===================================================== */

    function distanceMeters(

      lat1,
      lon1,

      lat2,
      lon2

    ) {

      const R =
        6371000;


      const p1 =
        lat1 *
        Math.PI /
        180;


      const p2 =
        lat2 *
        Math.PI /
        180;


      const dLat =
        (
          lat2 -
          lat1
        ) *
        Math.PI /
        180;


      const dLon =
        (
          lon2 -
          lon1
        ) *
        Math.PI /
        180;


      const a =

        Math.sin(
          dLat / 2
        ) ** 2

        +

        Math.cos(p1) *
        Math.cos(p2) *

        Math.sin(
          dLon / 2
        ) ** 2;


      const c =
        2 *
        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return R * c;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    function setStatus(text) {

      document.getElementById(
        "status"
      ).innerText =
        text;

    }


    /* =====================================================
       MODE BUTTON
       ===================================================== */

    document.getElementById(
      "mode"
    ).addEventListener(

      "click",

      function() {


        if (
          gameMode ===
          "PUBLIC"
        ) {


          gameMode =
            "UNLIMITED";


          document.getElementById(
            "mode"
          ).innerText =
            "🔓 UNLIMITED";


        } else {


          gameMode =
            "PUBLIC";


          document.getElementById(
            "mode"
          ).innerText =
            "🌎 PUBLIC";

        }


        if (

          currentLatitude !== null &&

          currentLongitude !== null

        ) {

          loadTrail(

            currentLatitude,

            currentLongitude

          );

        }

      }

    );


    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(error) {

      console.log(
        "GPS error:",
        error
      );


      setStatus(
        "❌ Couldn't get your location."
      );

    }


    /* =====================================================
       START GPS
       ===================================================== */

    if (
      "geolocation" in navigator
    ) {


      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );


    } else {

      setStatus(
        "❌ GPS isn't available."
      );

    }


  </script>

</body>
</html>
