<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* =========================
       HUD
       ========================= */

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;

      display: flex;
      gap: 10px;

      font-family: Arial, sans-serif;
    }

    .hudBox {
      background: rgba(10, 15, 20, 0.94);
      color: white;

      padding: 10px 14px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.4);

      font-weight: bold;
    }

    #coins {
      flex: 1;
    }

    #mode {
      cursor: pointer;
      user-select: none;
    }

    /* =========================
       STATUS
       ========================= */

    #status {
      position: absolute;

      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      background: rgba(10, 15, 20, 0.94);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;
    }

    /* =========================
       PLAYER
       ========================= */

    .player {
      width: 22px;
      height: 22px;

      background: #00aaff;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px #00aaff,
        0 0 18px #00aaff;
    }

    /* =========================
       COIN
       ========================= */

    .coin {
      width: 28px;
      height: 28px;

      background: radial-gradient(
        circle at 35% 35%,
        #fffbd0 0%,
        #ffe44d 25%,
        #ffd000 55%,
        #f0a000 80%,
        #c87800 100%
      );

      border: 3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255, 190, 0, 0.7);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;

      animation: coinPulse 1.4s infinite;
    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>

</head>

<body>

  <!-- =========================
       HUD
       ========================= -->

  <div id="hud">

    <div
      class="hudBox"
      id="coins"
    >
      🪙 Coins: 0
    </div>

    <div
      class="hudBox"
      id="mode"
    >
      🌎 PUBLIC
    </div>

  </div>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="status">
    📍 Finding your location...
  </div>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>

    /* =====================================================
       GAME VARIABLES
       ===================================================== */

    let map = null;

    let player = null;

    let coins = [];

    let coinCount = 0;

    let gameMode = "PUBLIC";

    let lastLatitude = null;

    let lastLongitude = null;

    let loadingCoins = false;


    /*
      Player must get this close to collect.
    */

    const COLLECTION_DISTANCE = 15;


    /*
      Number of coins we want.
    */

    const NUMBER_OF_COINS = 6;


    /*
      Search radius around player.
    */

    const SEARCH_DISTANCE_METERS = 500;


    /*
      Minimum walking distance to a coin.
    */

    const MIN_WALK_DISTANCE = 50;


    /*
      Maximum walking distance we prefer.
    */

    const MAX_WALK_DISTANCE = 350;


    /*
      Refresh coin locations after
      moving this many meters.
    */

    const COIN_REFRESH_DISTANCE = 100;


    /*
      Reward.
    */

    const COIN_VALUE = 10;


    /*
      Overpass servers for OSM data.
    */

    const OVERPASS_SERVERS = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];


    /*
      OSRM routing server.

      We request a FOOT route.
    */

    const ROUTING_SERVER =
      "https://router.project-osrm.org";



    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(
      latitude,
      longitude
    ) {

      /*
        Initial map centering.

        IMPORTANT:
        This is the ONLY automatic setView().
      */

      map = L.map("map").setView(
        [latitude, longitude],
        17
      );


      /*
        OpenStreetMap tiles.
      */

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution:
            "© OpenStreetMap contributors"
        }
      ).addTo(map);


      /*
        Player icon.
      */

      const playerIcon = L.divIcon({

        className: "",

        html:
          '<div class="player"></div>',

        iconSize:
          [28, 28],

        iconAnchor:
          [14, 14]

      });


      player = L.marker(

        [
          latitude,
          longitude
        ],

        {
          icon:
            playerIcon
        }

      ).addTo(map);


      /*
        Remember player position.
      */

      lastLatitude =
        latitude;

      lastLongitude =
        longitude;


      /*
        Start coin search.
      */

      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Finding walkable locations...";


      loadCoinsFromOSM(
        latitude,
        longitude
      );

    }



    /* =====================================================
       GPS UPDATE
       ===================================================== */

    function updateLocation(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      /*
        First GPS reading.
      */

      if (!map) {

        startGame(
          latitude,
          longitude
        );

        return;
      }


      /*
        Move player marker only.

        NO map.setView().

        This preserves smooth scrolling.
      */

      player.setLatLng([
        latitude,
        longitude
      ]);


      /*
        Check coin collection.
      */

      checkCoinCollection(
        latitude,
        longitude
      );


      /*
        Refresh the coin field
        when the player has moved enough.
      */

      if (
        lastLatitude !== null &&
        lastLongitude !== null
      ) {

        const movedDistance =
          getDistanceMeters(

            lastLatitude,
            lastLongitude,

            latitude,
            longitude

          );


        if (
          movedDistance >=
          COIN_REFRESH_DISTANCE
        ) {

          lastLatitude =
            latitude;

          lastLongitude =
            longitude;

          loadCoinsFromOSM(
            latitude,
            longitude
          );

        }

      }

    }



    /* =====================================================
       LOAD OSM CANDIDATES
       ===================================================== */

    async function loadCoinsFromOSM(
      latitude,
      longitude
    ) {

      if (loadingCoins) {
        return;
      }

      loadingCoins = true;


      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Finding walkable routes...";


      /*
        Remove old uncollected coins.
      */

      removeUncollectedCoins();


      /*
        Convert search radius into
        latitude/longitude offsets.
      */

      const latitudeOffset =
        SEARCH_DISTANCE_METERS /
        111320;


      const longitudeOffset =
        SEARCH_DISTANCE_METERS /
        (
          111320 *
          Math.cos(
            latitude *
            Math.PI /
            180
          )
        );


      const south =
        latitude -
        latitudeOffset;

      const north =
        latitude +
        latitudeOffset;

      const west =
        longitude -
        longitudeOffset;

      const east =
        longitude +
        longitudeOffset;


      /*
        Get nearby highway ways.

        We filter them after receiving
        the OSM data.
      */

      const query = `

        [out:json]
        [timeout:25];

        way
          ["highway"]
          (${south},${west},${north},${east});

        out tags geom;

      `;


      let data = null;


      /*
        Try both Overpass servers.
      */

      for (
        let i = 0;
        i < OVERPASS_SERVERS.length;
        i++
      ) {

        try {

          const response =
            await fetch(

              OVERPASS_SERVERS[i],

              {
                method:
                  "POST",

                headers: {
                  "Content-Type":
                    "application/x-www-form-urlencoded"
                },

                body:
                  "data=" +
                  encodeURIComponent(query)
              }

            );


          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }


          data =
            await response.json();


          break;

        } catch (error) {

          console.log(
            "Overpass failed:",
            error
          );

        }

      }


      /*
        OSM failed.
      */

      if (!data) {

        document.getElementById(
          "status"
        ).innerText =
          "⚠️ Couldn't load map data.";

        loadingCoins = false;

        return;

      }


      /*
        Extract candidate locations.
      */

      const candidates =
        getCoinCandidates(
          data,
          latitude,
          longitude
        );


      if (
        candidates.length === 0
      ) {

        document.getElementById(
          "status"
        ).innerText =
          gameMode === "PUBLIC"
            ? "🔎 No suitable public paths nearby."
            : "🔎 No mapped routes nearby.";

        loadingCoins = false;

        return;

      }


      /*
        Randomize candidates.
      */

      shuffleArray(
        candidates
      );


      /*
        Now test the candidates
        using actual walking routes.
      */

      const reachableCoins =
        await findReachableCoins(
          latitude,
          longitude,
          candidates
        );


      /*
        No reachable candidates.
      */

      if (
        reachableCoins.length === 0
      ) {

        document.getElementById(
          "status"
        ).innerText =
          "🚶 No reachable coin locations found nearby.";

        loadingCoins = false;

        return;

      }


      /*
        Create the reachable coins.
      */

      reachableCoins.forEach(
        function(location) {

          createCoin(
            location.latitude,
            location.longitude
          );

        }
      );


      document.getElementById(
        "status"
      ).innerText =
        "🎮 " +
        reachableCoins.length +
        " reachable coins found!";


      loadingCoins = false;

    }



    /* =====================================================
       FILTER OSM FEATURES
       ===================================================== */

    function getCoinCandidates(
      data,
      playerLatitude,
      playerLongitude
    ) {

      const candidates = [];


      if (
        !data ||
        !data.elements
      ) {

        return candidates;

      }


      data.elements.forEach(
        function(element) {

          if (
            element.type !== "way"
          ) {
            return;
          }


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {
            return;
          }


          const tags =
            element.tags || {};


          const highway =
            tags.highway;


          if (!highway) {
            return;
          }


          const access =
            String(
              tags.access || ""
            ).toLowerCase();


          const motorVehicle =
            String(
              tags.motor_vehicle || ""
            ).toLowerCase();


          const vehicle =
            String(
              tags.vehicle || ""
            ).toLowerCase();


          /*
            Explicit restrictions.

            We do not treat absence of a tag
            as proof of public accessibility.
          */

          if (
            gameMode === "PUBLIC"
          ) {

            if (
              access === "private" ||
              access === "no" ||
              access === "customers" ||
              access === "permit"
            ) {
              return;
            }


            if (
              motorVehicle === "private" ||
              motorVehicle === "no" ||
              vehicle === "private" ||
              vehicle === "no"
            ) {
              return;
            }


            /*
              PUBLIC candidates.

              We favor ways designed for
              pedestrians/non-motorized travel.
            */

            const publicWays = [

              "footway",
              "path",
              "pedestrian",
              "steps",
              "cycleway",
              "bridleway",
              "corridor"

            ];


            if (
              !publicWays.includes(
                highway
              )
            ) {
              return;
            }

          }


          /*
            UNLIMITED mode.

            Allow more types, but still avoid
            major dangerous highways.
          */

          if (
            gameMode === "UNLIMITED"
          ) {

            const dangerousWays = [

              "motorway",
              "motorway_link",
              "trunk",
              "trunk_link",
              "primary",
              "primary_link"

            ];


            if (
              dangerousWays.includes(
                highway
              )
            ) {
              return;
            }

          }


          /*
            Choose a point from the actual
            OSM geometry.
          */

          const point =
            chooseGeometryPoint(
              element.geometry
            );


          if (!point) {
            return;
          }


          /*
            Straight-line distance is only
            a preliminary filter.

            The actual route is checked later.
          */

          const straightDistance =
            getDistanceMeters(

              playerLatitude,
              playerLongitude,

              point.lat,
              point.lon

            );


          if (
            straightDistance < 30
          ) {
            return;
          }


          if (
            straightDistance >
            SEARCH_DISTANCE_METERS
          ) {
            return;
          }


          candidates.push({

            latitude:
              point.lat,

            longitude:
              point.lon,

            highway:
              highway

          });

        }
      );


      return candidates;

    }



    /* =====================================================
       FIND REACHABLE COINS
       ===================================================== */

    async function findReachableCoins(
      playerLatitude,
      playerLongitude,
      candidates
    ) {

      const reachable = [];


      /*
        Don't route hundreds of candidates.

        We test a manageable number.
      */

      const candidatesToTest =
        candidates.slice(0, 18);


      for (
        let i = 0;
        i < candidatesToTest.length;
        i++
      ) {

        const candidate =
          candidatesToTest[i];


        document.getElementById(
          "status"
        ).innerText =
          "🚶 Checking route " +
          (i + 1) +
          " of " +
          candidatesToTest.length +
          "...";


        const route =
          await getWalkingRoute(

            playerLatitude,
            playerLongitude,

            candidate.latitude,
            candidate.longitude

          );


        if (!route) {
          continue;
        }


        /*
          Require a meaningful walk.

          This prevents coins from appearing
          almost directly on top of the player.
        */

        if (
          route.distance <
          MIN_WALK_DISTANCE
        ) {
          continue;
        }


        /*
          Don't place coins extremely far away
          by walking distance.
        */

        if (
          route.distance >
          MAX_WALK_DISTANCE
        ) {
          continue;
        }


        /*
          Keep route distance for future
          gameplay features.
        */

        candidate.walkDistance =
          route.distance;


        candidate.walkDuration =
          route.duration;


        reachable.push(
          candidate
        );


        /*
          Stop once we have enough.
        */

        if (
          reachable.length >=
          NUMBER_OF_COINS
        ) {
          break;
        }

      }


      return reachable;

    }



    /* =====================================================
       GET WALKING ROUTE
       ===================================================== */

    async function getWalkingRoute(

      startLatitude,
      startLongitude,

      endLatitude,
      endLongitude

    ) {

      try {


        /*
          OSRM expects:

          longitude,latitude

          not latitude,longitude.
        */

        const coordinates =

          startLongitude +
          "," +
          startLatitude +
          ";" +

          endLongitude +
          "," +
          endLatitude;


        /*
          Ask for a FOOT route.

          GeoJSON gives us route geometry,
          which we can later use for quests.
        */

        const url =

          ROUTING_SERVER +

          "/route/v1/foot/" +

          coordinates +

          "?overview=false";


        const response =
          await fetch(url);


        if (
          !response.ok
        ) {
          return null;
        }


        const data =
          await response.json();


        if (
          data.code !== "Ok"
        ) {
          return null;
        }


        if (
          !data.routes ||
          data.routes.length === 0
        ) {
          return null;
        }


        const route =
          data.routes[0];


        return {

          distance:
            route.distance,

          duration:
            route.duration

        };


      } catch (error) {

        console.log(
          "Routing error:",
          error
        );

        return null;

      }

    }



    /* =====================================================
       CHOOSE OSM GEOMETRY POINT
       ===================================================== */

    function chooseGeometryPoint(
      geometry
    ) {

      if (
        !geometry ||
        geometry.length === 0
      ) {
        return null;
      }


      /*
        Pick a random actual OSM node.
      */

      const index =
        Math.floor(

          Math.random() *
          geometry.length

        );


      const point =
        geometry[index];


      if (
        !point ||
        typeof point.lat !== "number" ||
        typeof point.lon !== "number"
      ) {
        return null;
      }


      return point;

    }



    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(
      latitude,
      longitude
    ) {

      const coinIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="coin">🪙</div>',

          iconSize:
            [34, 34],

          iconAnchor:
            [17, 17]

        });


      const marker =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              coinIcon
          }

        ).addTo(map);


      coins.push({

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }



    /* =====================================================
       REMOVE OLD COINS
       ===================================================== */

    function removeUncollectedCoins() {

      const remaining = [];


      coins.forEach(
        function(coin) {

          if (
            coin.collected
          ) {

            remaining.push(
              coin
            );

          } else {

            if (
              map.hasLayer(
                coin.marker
              )
            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }
      );


      coins =
        remaining;

    }



    /* =====================================================
       CHECK COLLECTION
       ===================================================== */

    function checkCoinCollection(

      playerLatitude,
      playerLongitude

    ) {

      coins.forEach(
        function(coin) {

          if (
            coin.collected
          ) {
            return;
          }


          const distance =
            getDistanceMeters(

              playerLatitude,
              playerLongitude,

              coin.latitude,
              coin.longitude

            );


          if (
            distance <=
            COLLECTION_DISTANCE
          ) {

            collectCoin(
              coin
            );

          }

        }
      );

    }



    /* =====================================================
       COLLECT COIN
       ===================================================== */

    function collectCoin(
      coin
    ) {

      coin.collected =
        true;


      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );

      }


      coinCount +=
        COIN_VALUE;


      document.getElementById(
        "coins"
      ).innerText =
        "🪙 Coins: " +
        coinCount;


      document.getElementById(
        "status"
      ).innerText =
        "🪙 COIN COLLECTED! +10";


      setTimeout(
        function() {

          document.getElementById(
            "status"
          ).innerText =
            "🎮 KEEP EXPLORING";

        },
        2000
      );

    }



    /* =====================================================
       DISTANCE CALCULATION
       ===================================================== */

    function getDistanceMeters(

      latitude1,
      longitude1,

      latitude2,
      longitude2

    ) {

      const earthRadius =
        6371000;


      const lat1 =
        latitude1 *
        Math.PI /
        180;


      const lat2 =
        latitude2 *
        Math.PI /
        180;


      const deltaLatitude =
        (
          latitude2 -
          latitude1
        ) *
        Math.PI /
        180;


      const deltaLongitude =
        (
          longitude2 -
          longitude1
        ) *
        Math.PI /
        180;


      const a =

        Math.sin(
          deltaLatitude / 2
        ) ** 2

        +

        Math.cos(lat1) *
        Math.cos(lat2) *

        Math.sin(
          deltaLongitude / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return (
        earthRadius *
        c
      );

    }



    /* =====================================================
       SHUFFLE
       ===================================================== */

    function shuffleArray(
      array
    ) {

      for (
        let i =
          array.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(

            Math.random() *
            (i + 1)

          );


        const temp =
          array[i];


        array[i] =
          array[j];

        array[j] =
          temp;

      }

    }



    /* =====================================================
       PUBLIC / UNLIMITED
       ===================================================== */

    document.getElementById(
      "mode"
    ).addEventListener(

      "click",

      function() {

        if (
          gameMode === "PUBLIC"
        ) {

          gameMode =
            "UNLIMITED";


          document.getElementById(
            "mode"
          ).innerText =
            "🔓 UNLIMITED";

        } else {

          gameMode =
            "PUBLIC";


          document.getElementById(
            "mode"
          ).innerText =
            "🌎 PUBLIC";

        }


        /*
          Reload coin locations.
        */

        if (
          lastLatitude !== null &&
          lastLongitude !== null
        ) {

          loadCoinsFromOSM(

            lastLatitude,
            lastLongitude

          );

        }

      }

    );



    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(error) {

      console.log(
        "GPS error:",
        error
      );


      document.getElementById(
        "status"
      ).innerText =
        "❌ Couldn't get your location.";

    }



    /* =====================================================
       START GPS
       ===================================================== */

    if (
      "geolocation" in navigator
    ) {

      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );

    } else {

      document.getElementById(
        "status"
      ).innerText =
        "❌ GPS isn't available.";

    }

  </script>

</body>
</html>
