<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

const supabase =
createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true
  }
 }
);


/* =====================================================
   IMPORTANT REDIRECT
   ===================================================== */

const REDIRECT_URL =
"https://elimin8or10.github.io/gps-game/";


/* =====================================================
   STATE
   ===================================================== */

let user=null;
let player=null;
let map=null;
let playerMarker=null;
let watchId=null;

let mode="PUBLIC";

let coins=[];

let lastLat=null;
let lastLon=null;

let loadingTrail=false;

const SEARCH_RADIUS=1000;
const COIN_SPACING=55;
const COLLECTION_DISTANCE=25;
const REFRESH_DISTANCE=100;


/* =====================================================
   SKINS
   ===================================================== */

const skins={
 blue:{name:"Blue",color:"#00aaff",price:0},
 red:{name:"Red",color:"#ff3030",price:50},
 green:{name:"Green",color:"#22dd55",price:100},
 purple:{name:"Purple",color:"#aa55ff",price:150},
 gold:{name:"Gold",color:"#ffd000",price:250},
 pink:{name:"Pink",color:"#ff4fa3",price:350}
};


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginScreen=
document.getElementById("loginScreen");

const modeScreen=
document.getElementById("modeScreen");

const loadingScreen=
document.getElementById("loadingScreen");

const loadingText=
document.getElementById("loadingText");

const loadingBar=
document.getElementById("loadingBarInner");

const status=
document.getElementById("status");

const coinsDisplay=
document.getElementById("coinsDisplay");


/* =====================================================
   LOGIN
   ===================================================== */

document
.getElementById("loginButton")
.addEventListener("click",sendLogin);


async function sendLogin(){

 const input=
 document.getElementById("emailInput");

 const message=
 document.getElementById("loginMessage");

 const email=
 input.value.trim();

 if(!email){
  message.textContent="Enter your email.";
  return;
 }

 message.textContent="Sending...";

 const {error}=
 await supabase.auth.signInWithOtp({
  email,
  options:{
   emailRedirectTo:REDIRECT_URL,
   shouldCreateUser:true
  }
 });

 if(error){
  console.error(error);
  message.textContent=
   "❌ "+error.message;
  return;
 }

 message.textContent=
 "✅ Check your email for the sign-in link.";
}


/* =====================================================
   AUTH
   ===================================================== */

async function checkAuth(){

 setLoading("Checking account...",20);

 const {data,error}=
 await supabase.auth.getSession();

 if(error){
  console.error(error);
 }

 if(data.session?.user){

  user=data.session.user;

  loginScreen.style.display="none";

  await loadPlayer();

  showMode();

 }else{

  loginScreen.style.display="flex";
  modeScreen.style.display="none";
  loadingScreen.style.display="none";

 }

}


/* =====================================================
   AUTH STATE
   ===================================================== */

supabase.auth.onAuthStateChange(
(event,session)=>{

 console.log("AUTH:",event);

 if(event==="SIGNED_IN" && session){

  user=session.user;

  loginScreen.style.display="none";

  setTimeout(async()=>{
   await loadPlayer();
   showMode();
  },0);
 }

 if(event==="SIGNED_OUT"){

  user=null;
  player=null;

  location.reload();

 }

 });


/* =====================================================
   PLAYER
   ===================================================== */

async function loadPlayer(){

 if(!user)return;

 const {data,error}=
 await supabase
 .from("players")
 .select("*")
 .eq("id",user.id)
 .maybeSingle();

 if(error){
  console.error(error);
  alert("Player database error: "+error.message);
  return;
 }

 if(!data){

  const {data:newPlayer,error:createError}=
  await supabase
  .from("players")
  .insert({
   id:user.id,
   coins:0,
   xp:0,
   level:1,
   unlocked_skins:["blue"],
   equipped_skin:"blue",
   collected_coins:[]
  })
  .select()
  .single();

  if(createError){
   console.error(createError);
   return;
  }

  player=newPlayer;

 }else{

  player=data;

 }

 updateCoins();
}


/* =====================================================
   MODE
   ===================================================== */

function showMode(){

 loadingScreen.style.display="none";
 modeScreen.style.display="flex";

}

document
.getElementById("publicMode")
.addEventListener("click",()=>chooseMode("PUBLIC"));

document
.getElementById("unlimitedMode")
.addEventListener("click",()=>chooseMode("UNLIMITED"));


function chooseMode(selected){

 mode=selected;

 modeScreen.style.display="none";
 loadingScreen.style.display="flex";

 setLoading("Requesting your location...",20);

 startGPS();

}


/* =====================================================
   LOADING
   ===================================================== */

function setLoading(text,percent){

 loadingText.textContent=text;
 loadingBar.style.width=percent+"%";

}


/* =====================================================
   GPS
   ===================================================== */

function startGPS(){

 if(watchId!==null)return;

 if(!navigator.geolocation){

  status.textContent=
  "❌ GPS is not supported.";

  return;
 }

 status.textContent=
 "📍 Requesting location permission...";

 navigator.geolocation.getCurrentPosition(
  firstLocation,
  gpsError,
  {
   enableHighAccuracy:true,
   timeout:20000,
   maximumAge:0
  }
 );

 watchId=
 navigator.geolocation.watchPosition(
  updateLocation,
  gpsError,
  {
   enableHighAccuracy:true,
   timeout:20000,
   maximumAge:2000
  }
 );

}


function firstLocation(position){

 const lat=position.coords.latitude;
 const lon=position.coords.longitude;

 startGame(lat,lon);

}


function updateLocation(position){

 const lat=position.coords.latitude;
 const lon=position.coords.longitude;

 if(!map){

  startGame(lat,lon);
  return;

 }

 if(playerMarker){

  playerMarker.setLatLng([lat,lon]);

 }

 checkCollection(lat,lon);

 if(lastLat!==null){

  const moved=
  distance(lastLat,lastLon,lat,lon);

  if(moved>=REFRESH_DISTANCE){

   lastLat=lat;
   lastLon=lon;

   loadTrail(lat,lon);

  }

 }

 updateRoadDistance(lat,lon);

}


function gpsError(error){

 console.error(error);

 if(error.code===1){

  status.textContent=
  "📍 Location permission denied. Enable Location for Safari.";

 }else{

  status.textContent=
  "📍 Waiting for GPS...";

 }

}


/* =====================================================
   GAME START
   ===================================================== */

function startGame(lat,lon){

 if(map)return;

 setLoading("Loading map...",50);

 map=
 L.map("map",{zoomControl:true})
 .setView([lat,lon],17);

 L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  attribution:"© OpenStreetMap contributors"
 }
 ).addTo(map);

 lastLat=lat;
 lastLon=lon;

 createPlayer(lat,lon);

 loadingScreen.classList.add("hidden");

 setTimeout(()=>{
  loadingScreen.style.display="none";
 },700);

 status.textContent=
 "🗺️ Finding your nearest connected road...";

 loadTrail(lat,lon);

}


/* =====================================================
   PLAYER
   ===================================================== */

function createPlayer(lat,lon){

 const color=
 skins[player?.equipped_skin||"blue"].color;

 playerMarker=
 L.marker(
 [lat,lon],
 {
  icon:L.divIcon({
   className:"",
   html:`<div class="player"
   style="background:${color};box-shadow:0 0 10px ${color},0 0 25px ${color}"></div>`,
   iconSize:[24,24],
   iconAnchor:[12,12]
  })
 }
 ).addTo(map);

}


/* =====================================================
   OVERPASS
   ===================================================== */

async function getWays(lat,lon){

 const dLat=SEARCH_RADIUS/111320;

 const dLon=
 SEARCH_RADIUS/
 (111320*Math.cos(lat*Math.PI/180));

 const south=lat-dLat;
 const north=lat+dLat;
 const west=lon-dLon;
 const east=lon+dLon;

 const query=`

 [out:json][timeout:25];

 way["highway"]
 (${south},${west},${north},${east});

 out tags geom;

 `;

 const servers=[
 "https://overpass-api.de/api/interpreter",
 "https://overpass.kumi.systems/api/interpreter"
 ];

 for(const server of servers){

  try{

   const response=
   await fetch(server,{
    method:"POST",
    headers:{
     "Content-Type":
     "application/x-www-form-urlencoded"
    },
    body:
    "data="+encodeURIComponent(query)
   });

   if(!response.ok)continue;

   const data=await response.json();

   return filterWays(data.elements||[]);

  }catch(e){

   console.log(e);

  }

 }

 return [];

}


/* =====================================================
   ROAD FILTER
   ===================================================== */

function filterWays(elements){

 const allowedPublic=[
  "footway",
  "path",
  "pedestrian",
  "steps",
  "cycleway",
  "bridleway",
  "living_street",
  "residential",
  "unclassified",
  "service"
 ];

 const allowedUnlimited=[
  ...allowedPublic,
  "tertiary",
  "tertiary_link",
  "secondary",
  "secondary_link"
 ];

 const allowed=
 mode==="PUBLIC"
 ?allowedPublic
 :allowedUnlimited;

 return elements
 .filter(e=>
  e.type==="way" &&
  e.geometry?.length>=2 &&
  allowed.includes(e.tags?.highway)
 )
 .filter(e=>{
  const access=
  String(e.tags?.access||"").toLowerCase();

  return ![
   "private",
   "no",
   "permit",
   "customers"
  ].includes(access);
 })
 .map(e=>({
  id:e.id,
  geometry:e.geometry,
  tags:e.tags||{}
 }));

}


/* =====================================================
   CONNECTED ROAD GENERATION
   ===================================================== */

/*
 IMPORTANT:

 We don't simply choose the closest random
 road and generate coins there.

 We first find the closest road point,
 then only follow road segments that are
 actually connected to that starting road.

 This prevents coins appearing on a nearby
 disconnected road.
*/

async function loadTrail(lat,lon){

 if(loadingTrail)return;

 loadingTrail=true;

 status.textContent=
 "🗺️ Finding connected roads near you...";

 removeCoins();

 try{

  const ways=
  await getWays(lat,lon);

  if(!ways.length){

   status.textContent=
   "No suitable roads nearby.";

   loadingTrail=false;
   return;
  }

  const start=
  closestPoint(ways,lat,lon);

  if(!start){

   loadingTrail=false;
   return;
  }

  const network=
  buildConnectedNetwork(
   ways,
   start
  );

  if(!network.length){

   status.textContent=
   "Couldn't find a connected road.";

   loadingTrail=false;
   return;
  }

  const points=
  generateCoinsAlongNetwork(
   network
  );

  points.forEach(p=>
   createCoin(p.lat,p.lon)
  );

  const dist=Math.round(start.distance);

  status.textContent=
  `🛣️ Nearest road: ${dist}m away • ${points.length} coins`;

 }catch(e){

  console.error(e);

  status.textContent=
  "⚠️ Couldn't load roads.";

 }

 loadingTrail=false;

}


/* =====================================================
   CLOSEST ROAD POINT
   ===================================================== */

function closestPoint(ways,lat,lon){

 let best=null;

 for(const way of ways){

  for(let i=0;i<way.geometry.length;i++){

   const p=way.geometry[i];

   const d=
   distance(lat,lon,p.lat,p.lon);

   if(!best||d<best.distance){

    best={
     way,
     index:i,
     point:p,
     distance:d
    };

   }

  }

 }

 return best;

}


/* =====================================================
   CONNECTED NETWORK
   ===================================================== */

function buildConnectedNetwork(ways,start){

 const network=[];

 const used=new Set();

 let currentWay=start.way;
 let currentIndex=start.index;
 let direction=1;

 let current=
 currentWay.geometry[currentIndex];

 network.push(current);

 for(let steps=0;steps<250;steps++){

  const nextIndex=
  currentIndex+direction;

  if(
   nextIndex>=0 &&
   nextIndex<currentWay.geometry.length
  ){

   const next=
   currentWay.geometry[nextIndex];

   network.push(next);

   current=next;
   currentIndex=nextIndex;

   continue;
  }

  /*
   At an endpoint, ONLY jump to another
   way whose endpoint is physically close.
  */

  const connection=
  findConnection(
   ways,
   current,
   currentWay.id,
   used
  );

  if(!connection)break;

  used.add(connection.way.id);

  currentWay=connection.way;
  currentIndex=connection.index;
  direction=connection.direction;

 }

 return network;

}


/* =====================================================
   FIND REAL CONNECTION
   ===================================================== */

function findConnection(
 ways,
 point,
 currentId,
 used
){

 let best=null;
 let bestDistance=18;

 for(const way of ways){

  if(
   way.id===currentId ||
   used.has(way.id)
  )continue;

  const first=way.geometry[0];

  const last=
  way.geometry[way.geometry.length-1];

  const d1=
  distance(
   point.lat,point.lon,
   first.lat,first.lon
  );

  const d2=
  distance(
   point.lat,point.lon,
   last.lat,last.lon
  );

  if(d1<bestDistance){

   best={
    way,
    index:0,
    direction:1
   };

   bestDistance=d1;

  }

  if(d2<bestDistance){

   best={
    way,
    index:way.geometry.length-1,
    direction:-1
   };

   bestDistance=d2;

  }

 }

 return best;

}


/* =====================================================
   GENERATE COINS
   ===================================================== */

function generateCoinsAlongNetwork(points){

 const result=[];

 let accumulated=0;

 for(let i=1;i<points.length;i++){

  const a=points[i-1];
  const b=points[i];

  accumulated+=
  distance(
   a.lat,a.lon,
   b.lat,b.lon
  );

  if(accumulated>=COIN_SPACING){

   result.push({
    lat:b.lat,
    lon:b.lon
   });

   accumulated=0;

  }

 }

 return result;

}


/* =====================================================
   COINS
   ===================================================== */

function createCoin(lat,lon){

 if(!map||!player)return;

 const id=
 Math.round(lat*100000)+
 "_"+
 Math.round(lon*100000);

 if(
 player.collected_coins?.includes(id)
 )return;

 if(
 coins.some(c=>
  distance(
   c.lat,c.lon,
   lat,lon
  )<25
 )
 )return;

 const marker=
 L.marker(
 [lat,lon],
 {
  icon:L.divIcon({
   className:"",
   html:`<div class="coin">🪙</div>`,
   iconSize:[30,30],
   iconAnchor:[15,15]
  })
 }
 ).addTo(map);

 coins.push({
  id,
  lat,
  lon,
  marker,
  collected:false
 });

}


function removeCoins(){

 for(const coin of coins){

  if(
   map?.hasLayer(coin.marker)
  ){
   map.removeLayer(coin.marker);
  }

 }

 coins=[];

}


/* =====================================================
   COLLECTION
   ===================================================== */

function checkCollection(lat,lon){

 for(const coin of coins){

  if(coin.collected)continue;

  const d=
  distance(
   lat,lon,
   coin.lat,coin.lon
  );

  if(d<=COLLECTION_DISTANCE){

   collectCoin(coin);

  }

 }

}


async function collectCoin(coin){

 if(
  coin.collected ||
  !player
 )return;

 coin.collected=true;

 if(map.hasLayer(coin.marker))
 map.removeLayer(coin.marker);

 player.coins+=10;
 player.xp+=10;

 if(!player.collected_coins)
 player.collected_coins=[];

 if(!player.collected_coins.includes(coin.id))
 player.collected_coins.push(coin.id);

 while(player.xp>=player.level*100){

  player.xp-=player.level*100;
  player.level++;

  toast(
   `🎉 LEVEL ${player.level}!`
  );

 }

 updateCoins();

 toast("🪙 COIN COLLECTED! +10");

 await savePlayer();

}


/* =====================================================
   SAVE
   ===================================================== */

async function savePlayer(){

 if(!player||!user)return;

 const {error}=
 await supabase
 .from("players")
 .update({
  coins:player.coins,
  xp:player.xp,
  level:player.level,
  unlocked_skins:player.unlocked_skins,
  equipped_skin:player.equipped_skin,
  collected_coins:player.collected_coins,
  updated_at:new Date().toISOString()
 })
 .eq("id",user.id);

 if(error)
 console.error("SAVE ERROR",error);

}

/* =====================================================
   ROAD DISTANCE
   ===================================================== */

async function updateRoadDistance(lat,lon){

 if(!map)return;

 /*
   This updates continuously as the player moves.
 */

 const ways=
 await getWays(lat,lon);

 if(!ways.length)return;

 const nearest=
 closestPoint(ways,lat,lon);

 if(nearest){

  status.textContent=
  `🛣️ Nearest road: ${Math.round(nearest.distance)}m • 🪙 ${player?.coins||0}`;

 }

}


/* =====================================================
   SHOP
   ===================================================== */

document
.getElementById("shopButton")
.addEventListener("click",openShop);

document
.getElementById("closeShop")
.addEventListener("click",()=>{
 document.getElementById("shopOverlay").style.display="none";
});


function openShop(){

 document.getElementById("shopOverlay").style.display="block";

 renderShop();

}


function renderShop(){

 const items=
 document.getElementById("shopItems");

 const balance=
 document.getElementById("shopBalance");

 balance.textContent=
 `🪙 Coins: ${player?.coins||0}`;

 items.innerHTML="";

 for(const [id,skin] of Object.entries(skins)){

  const unlocked=
  player.unlocked_skins.includes(id);

  const equipped=
  player.equipped_skin===id;

  const row=
  document.createElement("div");

  row.className="shopItem";

  row.innerHTML=`
   <div class="preview"
   style="background:${skin.color};box-shadow:0 0 12px ${skin.color}">
   </div>

   <div class="info">
    <b>${skin.name}</b><br>
    <span style="color:#ffd700">
    ${skin.price===0?"FREE":"🪙 "+skin.price}
    </span>
   </div>
  `;

  const button=
  document.createElement("button");

  if(equipped){

   button.textContent="EQUIPPED";
   button.disabled=true;

  }else if(unlocked){

   button.textContent="EQUIP";

   button.onclick=async()=>{

    player.equipped_skin=id;

    await savePlayer();

    renderShop();

    toast("🎨 Equipped!");

   };

  }else if(player.coins>=skin.price){

   button.textContent="BUY";

   button.onclick=async()=>{

    player.coins-=skin.price;

    player.unlocked_skins.push(id);
    player.equipped_skin=id;

    await savePlayer();

    updateCoins();
    renderShop();

    toast("🎨 Skin unlocked!");

   };

  }else{

   button.textContent="NEED COINS";
   button.disabled=true;

  }

  row.appendChild(button);
  items.appendChild(row);

 }

}

/* =====================================================

   ===================================================== */

let toastTimer;

function toast(text){

 const el=
 document.getElementById("toast");

 el.textContent=text;
 el.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=
 setTimeout(
  ()=>el.classList.remove("show"),
  2200
 );

}


/* =====================================================
   DISTANCE
   ===================================================== */

function distance(lat1,lon1,lat2,lon2){

 const R=6371000;

 const p1=lat1*Math.PI/180;
 const p2=lat2*Math.PI/180;

 const dLat=
 (lat2-lat1)*Math.PI/180;

 const dLon=
 (lon2-lon1)*Math.PI/180;

 const a=
 Math.sin(dLat/2)**2+
 Math.cos(p1)*
 Math.cos(p2)*
 Math.sin(dLon/2)**2;

 return R*
 2*
 Math.atan2(
   Math.sqrt(a),
   Math.sqrt(1-a)
  );

}
