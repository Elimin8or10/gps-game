function normalizeHeading(value){

 if(
  typeof value!=="number"||
  Number.isNaN(value)
 )
  return null;

 return ((value%360)+360)%360;

}


function getBestHeading(){

 if(deviceHeading!==null)
  return deviceHeading;

 if(gpsHeading!==null)
  return gpsHeading;

 return null;

}


function updatePlayerHeading(){

 if(!playerMarker)return;

 const heading=
  getBestHeading();

 const pointer=
  document.querySelector(
   ".playerPointer"
  );

 if(!pointer)return;

 if(heading===null){

  pointer.style.opacity="0.45";

  return;

 }

 pointer.style.opacity="1";

 pointer.style.transform=
  `translateX(-50%) rotate(${heading}deg)`;

}


function handleDeviceOrientation(event){

 let heading=null;

 if(
  typeof event.webkitCompassHeading==="number"
 ){

  heading=
   event.webkitCompassHeading;

 }

 else if(
  typeof event.alpha==="number"
 ){

  heading=
   360-event.alpha;

 }

 heading=
  normalizeHeading(heading);

 if(heading!==null){

  deviceHeading=heading;

  updatePlayerHeading();

 }

}


async function enableCompass(){

 if(compassListening)
  return;

 try{

  if(
   typeof DeviceOrientationEvent!=="undefined"&&
   typeof DeviceOrientationEvent.requestPermission==="function"
  ){

   const permission=
    await DeviceOrientationEvent.requestPermission();

   if(permission!=="granted"){

    showToast(
     "🧭 Compass permission not granted"

    setStatus(
     "🧭 Direction pointer using GPS direction"
    );

    return;

   }

  }

  window.addEventListener(
   "deviceorientation",
   handleDeviceOrientation,
   true

  compassListening=true;

function distanceMeters(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R=6371000;

 const p1=
  lat1*Math.PI/180;

 const p2=
  lat2*Math.PI/180;

 const dLat=
  (lat2-lat1)*Math.PI/180;

 const dLon=
  (lon2-lon1)*Math.PI/180;

 const a=
  Math.sin(dLat/2)**2+
  Math.cos(p1)*
  Math.cos(p2)*
  Math.sin(dLon/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

}


/* ================= MUSIC / SFX ================= */

let musicEnabled=
 localStorage.getItem("gps_music")!=="off";

let sfxEnabled=
 localStorage.getItem("gps_sfx")!=="off";

let audioCtx=null;
let musicTimer=null;
let musicStep=0;


function startAudio(){

 if(!audioCtx){

  audioCtx=
   new(
    window.AudioContext||
    window.webkitAudioContext
   )();

 }

 if(audioCtx.state==="suspended")
  audioCtx.resume();

 startMusic();

}


function playCoinSound(){

 if(!sfxEnabled)return;

 startAudio();

 const now=
  audioCtx.currentTime;

 [880,1175,1568].forEach(
  (freq,i)=>{

   const osc=
    audioCtx.createOscillator();

   const gain=
    audioCtx.createGain();

   osc.type="sine";

   osc.frequency.value=freq;

   gain.gain.setValueAtTime(
    .0001,
    now+i*.055
   );

   gain.gain.exponentialRampToValueAtTime(
    .16,
    now+i*.055+.015
   );

   gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+i*.055+.18
   );

   osc.connect(gain);

   gain.connect(
    audioCtx.destination
   );

   osc.start(
    now+i*.055
   );

   osc.stop(
    now+i*.055+.2
   );

  }
 );

}


function startMusic(){

 if(!musicEnabled||
    musicTimer)
  return;

 if(!audioCtx)
  audioCtx=
   new(
    window.AudioContext||
    window.webkitAudioContext
   )();

 if(audioCtx.state==="suspended")
  audioCtx.resume();

 const notes=[
  220,
  277.18,
  329.63,
  277.18,
  246.94,
  329.63,
  369.99,
  329.63
 ];

 musicTimer=
  setInterval(()=>{

   if(!musicEnabled)
    return;

   const osc=
    audioCtx.createOscillator();

   const gain=
    audioCtx.createGain();

   osc.type="triangle";

   osc.frequency.value=
    notes[
     musicStep++%
     notes.length
    ];

   const now=
    audioCtx.currentTime;

   gain.gain.setValueAtTime(
    .0001,
    now
   );

   gain.gain.exponentialRampToValueAtTime(
    .025,
    now+.03
   );

   gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.42
   );

   osc.connect(gain);

   gain.connect(
    audioCtx.destination
   );

   osc.start(now);

   osc.stop(now+.45);

  },520);

}


function stopMusic(){

 if(musicTimer){

  clearInterval(musicTimer);

  musicTimer=null;

 }

}

 musicEnabled=!musicEnabled;

 localStorage.setItem(

function startGPS(){

 /*
  * NEW:
  * Browser geolocation requires a
  * secure context such as HTTPS.
  */

 if(!window.isSecureContext){

  $("loadingScreen").style.display=
   "none";

  );

  showToast(

  );

  console.error(
   "Geolocation blocked because page is not a secure context."
  );

  return;

 }


 if(!navigator.geolocation){

  $("loadingScreen").style.display=
   "none";

  setStatus(
   "❌ GPS is not supported."
  );

  return;

 }


 setStatus(
  "📍 Requesting your location..."
 );


 console.log(
  "Secure context:",
  window.isSecureContext
 );

 console.log(
  "Geolocation available:",
  !!navigator.geolocation
 );


 watchId=
  navigator.geolocation.watchPosition(
   onLocation,
   onLocationError,
   {
    enableHighAccuracy:true,
    maximumAge:2000,
    timeout:15000
   }
  );

}


function onLocation(position){

 const lat=
  position.coords.latitude;

 const lon=
  position.coords.longitude;

 const accuracy=
  position.coords.accuracy||30;


 if(
  lastGPSLat!==null&&
  lastGPSLon!==null
 ){

  const moved=
   distanceMeters(
    lastGPSLat,
    lastGPSLon,
    lat,
    lon
   );

  if(moved>=3){

   const lat1=
    lastGPSLat*Math.PI/180;

   const lat2=
    lat*Math.PI/180;

   const dLon=
    (lon-lastGPSLon)*
    Math.PI/180;

   const y=
    Math.sin(dLon)*
    Math.cos(lat2);

   const x=
    Math.cos(lat1)*
    Math.sin(lat2)-
    Math.sin(lat1)*
    Math.cos(lat2)*
    Math.cos(dLon);

   const bearing=
    Math.atan2(y,x)*
    180/Math.PI;

   gpsHeading=
    normalizeHeading(
     bearing
    );

   updatePlayerHeading();

  }

 }

 lastGPSLat=lat;
 lastGPSLon=lon;


 if(
  typeof position.coords.heading===
   "number"&&
  !Number.isNaN(
   position.coords.heading
  )&&
  position.coords.heading>=0
 ){

  gpsHeading=
   normalizeHeading(
    position.coords.heading
   );

  updatePlayerHeading();

 }


 setLoading(
  "Location found!",
  60
 );


 if(!playerMarker){

  createPlayer(
   lat,
   lon
  );

  map.setView(
   [lat,lon],
   17
  );

  $("loadingScreen").style.display=
   "none";

  setStatus(
   "🗺️ Finding your connected road..."
  );

  loadRoadNetwork(
   lat,
   lon
  );

 }else{

  playerMarker.setLatLng(
   [lat,lon]
  );

  if(accuracyCircle){

   accuracyCircle
    .setLatLng(
     [lat,lon]
    )
    .setRadius(
     accuracy
    );

  }

 }


 collectNearbyCoins(
  lat,
  lon
 );


 if(
  lastRoadLat===null||
  distanceMeters(
   lastRoadLat,
   lastRoadLon,
   lat,
   lon
  )>=ROAD_REFRESH_DISTANCE
 ){

  loadRoadNetwork(
   lat,
   lon
  );

 }

}

async function loadRoadNetwork(lat,lon){

 if(loadingRoads)return;

 loadingRoads=true;

 lastRoadLat=lat;
 lastRoadLon=lon;

 setStatus(
  "🗺️ Searching nearby roads..."
 );

 try{

  const ways=
   await getNearbyWays(
    lat,
    lon
   );

  if(!ways.length){

   setStatus(
    "🔎 No mapped roads found. Retrying..."
   );

   loadingRoads=false;

   setTimeout(
    ()=>loadRoadNetwork(
     lat,
     lon
    ),
    4000
   );

   return;

  }

  const nearest=
   findNearestRoadPoint(
    ways,
    lat,
    lon
   );

  if(!nearest){

   loadingRoads=false;

   return;

  }

  if(nearest.distance>400){

   setStatus(
    `🚶 Nearest mapped road: ${Math.round(nearest.distance)}m away`
   );

   loadingRoads=false;

   return;

  }

  roadNetwork=
   buildConnectedNetwork(
    ways,
    nearest.way
   );

  generateNetworkCoins(
   roadNetwork,
   nearest
  );

  setStatus(
   `🛣️ Road ${Math.round(nearest.distance)}m away • ${coins.length} coins`
  );

 }catch(e){

  console.error(e);

  setStatus(
   "⚠️ Road server failed. Retrying..."
  );

 }

 loadingRoads=false;

}


async function getNearbyWays(lat,lon){

 const latDelta=
  SEARCH_RADIUS/111320;

 const lonDelta=
  SEARCH_RADIUS/
  (
   111320*
   Math.cos(
    lat*Math.PI/180
   )
  );

 const south=
  lat-latDelta;

 const north=
  lat+latDelta;

 const west=
  lon-lonDelta;

 const east=
  lon+lonDelta;

 let filter=
  `way["highway"](${south},${west},${north},${east});`;

 if(gameMode==="PUBLIC"){

  filter=
   `way["highway"]["access"!="private"]["access"!="no"]["access"!="customers"]["access"!="permit"](${south},${west},${north},${east});`;

 }

 const query=
  `[out:json][timeout:20];${filter}out tags geom;`;

 for(
  const server of OVERPASS_SERVERS
 ){

  try{

   const controller=
    new AbortController();

   const timeout=
    setTimeout(
     ()=>controller.abort(),
     14000
    );

   const response=
    await fetch(
     server,
     {
      method:"POST",
      headers:{
       "Content-Type":
        "application/x-www-form-urlencoded"
      },
      body:
       "data="+
       encodeURIComponent(query),
      signal:
       controller.signal
     }
    );

   clearTimeout(timeout);

   if(!response.ok)
    continue;

   const json=
    await response.json();

   const ways=
    filterWays(
     json.elements||[]
    );

   if(ways.length)
    return ways;

  }catch(e){

   console.log(
    "Overpass failed",
    server
   );

  }

 }

 return [];

}


function filterWays(elements){

 const publicRoads=[
  "footway",
  "path",
  "pedestrian",
  "steps",
  "cycleway",
  "bridleway",
  "living_street",
  "residential",
  "unclassified",
  "service",
  "tertiary",
  "tertiary_link",
  "secondary",
  "secondary_link"
 ];

 const result=[];

 for(
  const e of elements
 ){

  if(
   e.type!=="way"||
   !e.geometry||
   e.geometry.length<2
  )
   continue;

  const highway=
   e.tags?.highway;

  if(!highway)
   continue;

  if(gameMode==="PUBLIC"){

   if(
    !publicRoads.includes(
     highway
    )
   )
    continue;

  }else{

   if([
    "motorway",
    "motorway_link",
    "trunk",
    "trunk_link"
   ].includes(highway))
    continue;

  }

  result.push({

   id:e.id,

   geometry:
    e.geometry.map(
     p=>({
      lat:+p.lat,
      lon:+p.lon
     })
    ),

   tags:e.tags||{}

  });

 }

 return result;

}


function findNearestRoadPoint(
 ways,
 lat,
 lon
){

 let best=null;

 for(
  const way of ways
 ){

  for(
   let i=0;
   i<way.geometry.length-1;
   i++
  ){

   const a=
    way.geometry[i];

   const b=
    way.geometry[i+1];

   const point=
    closestPointOnSegment(
     lat,
     lon,
     a.lat,
     a.lon,
     b.lat,
     b.lon
    );

   const d=
    distanceMeters(
     lat,
     lon,
     point.lat,
     point.lon
    );

   if(
    !best||
    d<best.distance
   ){

    best={
     way,
     segmentIndex:i,
     point,
     distance:d
    };

   }

  }

 }

 return best;

}


function closestPointOnSegment(
 lat,
 lon,
 lat1,
 lon1,
 lat2,
 lon2
){

 const cos=
  Math.cos(
   lat*Math.PI/180
  );

 const x=
  (lon-lon1)*
  111320*
  cos;

 const y=
  (lat-lat1)*
  111320;

 const dx=
  (lon2-lon1)*
  111320*
  cos;

 const dy=
  (lat2-lat1)*
  111320;

 const len2=
  dx*dx+
  dy*dy;

 let t=
  len2===0?
   0:
   (x*dx+y*dy)/len2;

 t=
  Math.max(
   0,
   Math.min(1,t)
  );

 return{

  lat:
   lat1+
   (lat2-lat1)*t,

  lon:
   lon1+
   (lon2-lon1)*t

 };

}


function buildConnectedNetwork(
 ways,
 start
){

 const network=[];
 const visited=new Set();
 const queue=[start];

 while(queue.length){

  const way=
   queue.shift();

  if(visited.has(way.id))
   continue;

  visited.add(way.id);

  network.push(way);

  for(
   const other of ways
  ){

   if(visited.has(other.id))
    continue;

   if(
    waysConnected(
     way,
     other
    )
   )
    queue.push(other);

  }

 }

 return network;

}


function waysConnected(a,b){

 const a1=
  a.geometry[0];

 const a2=
  a.geometry[
   a.geometry.length-1
  ];

 const b1=
  b.geometry[0];

 const b2=
  b.geometry[
   b.geometry.length-1
  ];

 return[
  [a1,b1],
  [a1,b2],
  [a2,b1],
  [a2,b2]
 ].some(
  ([x,y])=>
   distanceMeters(
    x.lat,
    x.lon,
    y.lat,
    y.lon
   )<=30
 );

}


/* ================= COINS ================= */

function coinId(lat,lon){

 return Math.round(lat*100000)+
 "_"+
 Math.round(lon*100000);

}


function generateNetworkCoins(
 network,
 nearest
){

 if(!network.length)
  return;

 if(coins.length>=MAX_COINS)
  return;

 const candidates=[];

 const ordered=
  network.slice().sort(
   (a,b)=>
    distanceToWay(
     nearest.point,
     a
    )-
    distanceToWay(
     nearest.point,
     b
    )
  );

 for(
  const way of ordered
 ){

  const points=
   pointsAlongWay(way);

  for(
   const p of points
  ){

   candidates.push(p);

  }

 }

 for(
  let i=candidates.length-1;
  i>0;
  i--
 ){

  const j=
   Math.floor(
    Math.random()*(i+1)
   );

  [
   candidates[i],
   candidates[j]
  ]=[
   candidates[j],
   candidates[i]
  ];

 }

 let added=0;

 for(
  const p of candidates
 ){

  if(coins.length>=MAX_COINS)
   break;

  if(
   isFarFromActiveCoins(p)&&
   !wasCollected(p)
  ){

   if(
    addCoin(
     p.lat,
     p.lon
    )
   )
    added++;

  }

 }

 if(coins.length<MAX_COINS){

  for(
   const p of candidates
  ){

   if(coins.length>=MAX_COINS)
    break;

   if(
    isFarFromActiveCoins(p)
   ){

    if(
     addCoin(
      p.lat,
      p.lon
     )
    )
     added++;

   }

  }

 }

 if(added>0){

  setStatus(
   `🪙 ${coins.length} coins available nearby`
  );

 }

}


function pointsAlongWay(way){

 const result=[];

 for(
  let i=1;
  i<way.geometry.length;
  i++
 ){

  const a=
   way.geometry[i-1];

  const b=
   way.geometry[i];

  const d=
   distanceMeters(
    a.lat,
    a.lon,
    b.lat,
    b.lon
   );

  if(d>0){

   const steps=
    Math.max(
     1,
     Math.floor(
      d/COIN_SPACING
     )
    );

   for(
    let s=1;
    s<=steps;
    s++
   ){

    const t=
     s/steps;

    result.push({

     lat:
      a.lat+
      (b.lat-a.lat)*t,

     lon:
      a.lon+
      (b.lon-a.lon)*t

    });

   }

  }

 }

 return result;

}


function distanceToWay(
 point,
 way
){

 let best=Infinity;

 for(
  const p of way.geometry
 ){

  const d=
   distanceMeters(
    point.lat,
    point.lon,
    p.lat,
    p.lon
   );

  if(d<best)
   best=d;

 }

 return best;

}


function isFarFromActiveCoins(p){

 return coins.every(
  c=>
   distanceMeters(
    p.lat,
    p.lon,
    c.lat,
    c.lon
   )>=MIN_NEW_LOCATION_DISTANCE
 );

}


function wasCollected(p){

 const id=
  coinId(
   p.lat,
   p.lon
  );

 return playerData?.
  collected_coins?.
  includes(id);

}


function addCoin(lat,lon){

 if(!map||!playerData)
  return false;

 const id=
  coinId(
   lat,
   lon
  );

 if(
  coins.some(
   c=>
    distanceMeters(
     lat,
     lon,
     c.lat,
     c.lon
    )<
    MIN_NEW_LOCATION_DISTANCE
  )
 )
  return false;

 const marker=
  L.marker(
   [lat,lon],
   {
    icon:
     L.divIcon({

      className:"",

      html:
       `<div class="coin">🪙</div>`,

      iconSize:[34,34],

      iconAnchor:[17,17]

     })
   }
  ).addTo(map);

 coins.push({

  id,

  lat,

  lon,

  marker,

  collected:false

 });

 return true;

}


/* ================= COLLECTION ================= */

function collectNearbyCoins(
 lat,
 lon
){

 for(
  const c of [...coins]
 ){

  if(c.collected)
   continue;

  const d=
   distanceMeters(
    lat,
    lon,
    c.lat,
    c.lon
   );

  if(
   d<=COLLECTION_DISTANCE
  )
   collectCoin(c);

 }

}


async function collectCoin(c){

 if(!playerData||
    c.collected)
  return;

 c.collected=true;

 if(
  map.hasLayer(c.marker)
 )
  map.removeLayer(c.marker);

 coins=
  coins.filter(
   x=>x!==c
  );

 if(
  !playerData.collected_coins.includes(
   c.id
  )
 ){

  playerData.collected_coins.push(
   c.id
  );

 }

 playerData.coins+=10;

 playerData.xp+=10;

 checkLevel();

 updateCoinDisplay();

 playCoinSound();

 showToast(
  "🪙 COIN COLLECTED! +10"
 );

 setStatus(
  "🎮 Keep exploring!"
 );

 await savePlayer();

 if(coins.length===0){

  setStatus(
   "✨ All coins collected! Generating more..."
  );

  if(
   roadNetwork.length&&
   lastRoadLat!==null
  ){

   const nearest=
    findNearestRoadPoint(
     roadNetwork,
     lastRoadLat,
     lastRoadLon
    );

   if(nearest){

    generateNetworkCoins(
     roadNetwork,
     nearest
    );

   }

  }

 }

}


function checkLevel(){

 let required=
  playerData.level*100;

 while(
  playerData.xp>=required
 ){

  playerData.xp-=required;

  playerData.level++;

  showToast(
   `🎉 LEVEL ${playerData.level}!`
  );

  required=
   playerData.level*100;

 }

}


function updateCoinDisplay(){

 $("coinsDisplay").textContent=
  `🪙 Coins: ${playerData?.coins||0}`;

}


/* ================= AUTO RESPAWN ================= */

setInterval(()=>{

 if(
  !playerData||
  !roadNetwork.length
 )
  return;

 if(

  lastRoadLat!==null
 ){

   );

 }

 ){

   );

 }

async function buySkin(id){

 const skin=
  SKINS[id];

 if(
  !skin||
  playerData.unlocked_skins
   .includes(id)
 )
  return;

 if(
  playerData.coins<
  skin.price
 ){

  showToast(
   "❌ Not enough coins"
  );

  return;

 }

 playerData.coins-=
  skin.price;

 playerData.unlocked_skins
  .push(id);

 playerData.equipped_skin=
  id;

 await savePlayer();

 updateCoinDisplay();

 updatePlayerSkin();

 renderShop();

 showToast(
  `🎨 ${skin.name} unlocked!`
 );

}


async function equipSkin(id){

 if(
  !playerData.unlocked_skins
   .includes(id)
 )
  return;

 playerData.equipped_skin=
  id;

 await savePlayer();

 updatePlayerSkin();

 renderShop();

}


function updatePlayerSkin(){

 if(!playerMarker)
  return;

 const skin=
  SKINS[
   playerData.equipped_skin
  ]||SKINS.blue;

 playerMarker.setIcon(

  L.divIcon({

   className:"",

   html:`
    <div
     class="player"
     style="--player-color:${skin.color}"
    >
     <div class="playerPointer">
      <div class="playerPointerInner"></div>
     </div>
    </div>
   `,

   iconSize:[28,50],

   iconAnchor:[14,25]

  })

 );

 updatePlayerHeading();

}


/* ================= ACCOUNT ================= */

$("accountButton").onclick=()=>{

 $("accountOverlay").style.display=
  "block";

 $("accountEmail").textContent=
  currentUser?.email||
  "No email";

};


$("closeAccount").onclick=()=>{

 $("accountOverlay").style.display=
  "none";

};


$("signOutButton").onclick=
 async()=>{

  stopMusic();

  if(watchId!==null){

   navigator.geolocation
    .clearWatch(
     watchId
    );

  }

  await supabase.auth.signOut();

  location.reload();

 };

supabase.auth.onAuthStateChange(
 (event,session)=>{

  console.log(
   "Auth:",
   event
  );

  if(event==="SIGNED_OUT")
   location.reload();

 }
);

checkAuth();
