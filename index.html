<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPS COIN</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:#080b10;
}

#map{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:1;
}

/* =========================
MODE SCREEN
========================= */

#modeScreen{
position:fixed;
inset:0;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at center,#172b3c 0%,#080b10 70%);
color:white;
}

.modeContent{
width:min(92%,430px);
text-align:center;
}

.logo{
font-size:70px;
animation:float 2s infinite ease-in-out;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.title{
font-size:38px;
font-weight:900;
margin:5px 0;
}

.subtitle{
color:#9eabb8;
margin-bottom:30px;
}

.choose{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}

.modeButtons{
display:flex;
gap:12px;
}

.mode{
flex:1;
padding:20px 10px;
border-radius:20px;
border:1px solid #354352;
background:#151d26;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.mode:active{
transform:scale(.96);
}

.mode:hover{
border-color:#00aaff;
background:#1d2935;
}

.modeIcon{
font-size:34px;
margin-bottom:8px;
}

.modeDesc{
font-size:12px;
font-weight:normal;
color:#8996a5;
margin-top:6px;
line-height:1.4;
}

/* =========================
LOADING
========================= */

#loadingScreen{
position:fixed;
inset:0;
z-index:99998;
display:none;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at center,#172333 0%,#080b10 70%);
color:white;
}

.loadingContent{
width:min(90%,430px);
text-align:center;
}

.loadingLogo{
font-size:65px;
animation:float 2s infinite ease-in-out;
}

.loadingTitle{
font-size:34px;
font-weight:900;
margin:5px 0;
}

.loadingSubtitle{
color:#9ca9b8;
font-size:14px;
}

.bar{
height:8px;
width:100%;
margin-top:30px;
background:#202a35;
border-radius:20px;
overflow:hidden;
}

.barInner{
width:0%;
height:100%;
background:linear-gradient(90deg,#00aaff,#66ddff);
box-shadow:0 0 15px #00aaff;
transition:width .4s;
}

#loadingText{
margin-top:14px;
color:#b9c5d2;
}

/* =========================
HUD
========================= */

#hud{
position:absolute;
top:calc(env(safe-area-inset-top) + 10px);
left:10px;
right:10px;
z-index:1000;
display:flex;
gap:8px;
align-items:center;
}

.hud{
height:46px;
padding:0 13px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(8,13,19,.94);
color:white;
border-radius:14px;
font-weight:bold;
box-shadow:0 4px 18px rgba(0,0,0,.35);
backdrop-filter:blur(10px);
}

#coins{
flex:1;
justify-content:flex-start;
}

.hudButton{
min-width:46px;
cursor:pointer;
}

/* =========================
STATUS
========================= */

#status{
position:absolute;
left:15px;
right:15px;
bottom:calc(18px + env(safe-area-inset-bottom));
z-index:1000;
padding:12px 15px;
border-radius:14px;
background:rgba(8,13,19,.94);
color:white;
text-align:center;
font-size:14px;
box-shadow:0 4px 18px rgba(0,0,0,.35);
}

/* =========================
PLAYER
========================= */

.player{
width:22px;
height:22px;
border:3px solid white;
border-radius:50%;
background:#00aaff;
box-shadow:
0 0 8px #00aaff,
0 0 18px #00aaff,
0 0 30px #00aaff;
}

/* =========================
COINS
========================= */

.coin{
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
border:3px solid #fff4a3;
background:radial-gradient(
circle at 35% 35%,
#fffbd0,
#ffe44d 25%,
#ffd000 55%,
#f0a000 80%,
#c87800
);
box-shadow:
0 0 8px #ffd700,
0 0 18px #ffb000,
0 0 28px rgba(255,190,0,.7);
animation:pulse 1.4s infinite;
}

@keyframes pulse{
50%{transform:scale(1.13)}
}

/* =========================
OVERLAYS
========================= */

.overlay{
display:none;
position:fixed;
inset:0;
z-index:5000;
padding:20px;
overflow:auto;
background:rgba(0,0,0,.8);
}

.panel{
width:min(500px,100%);
margin:30px auto;
padding:20px;
border-radius:20px;
background:#151a20;
color:white;
}

.panelHeader{
display:flex;
justify-content:space-between;
align-items:center;
}

.close{
border:0;
background:#333;
color:white;
padding:9px 13px;
border-radius:10px;
font-size:18px;
}

.shopItem{
display:flex;
align-items:center;
gap:14px;
padding:14px;
margin-bottom:10px;
background:#20262d;
border-radius:15px;
}

.preview{
width:42px;
height:42px;
border:4px solid white;
border-radius:50%;
}

.skinInfo{
flex:1;
}

.buy{
border:0;
border-radius:10px;
padding:9px 12px;
background:#0077cc;
color:white;
font-weight:bold;
}

.accountEmail{
background:#20262d;
padding:12px;
border-radius:12px;
word-break:break-all;
margin:15px 0;
}

.accountButton{
width:100%;
padding:13px;
margin-top:10px;
border:0;
border-radius:12px;
background:#0077cc;
color:white;
font-weight:bold;
}

.danger{
background:#a83232;
}

/* =========================
TOAST
========================= */

#toast{
position:fixed;
left:50%;
bottom:90px;
z-index:10000;
transform:translate(-50%,20px);
padding:13px 18px;
border-radius:14px;
background:#101820;
color:white;
font-weight:bold;
opacity:0;
pointer-events:none;
transition:.25s;
}

#toast.show{
opacity:1;
transform:translate(-50%,0);
}

/* =========================
LEAFLET
========================= */

.leaflet-top{
top:75px;
}

.leaflet-left{
left:10px;
}

.leaflet-control-zoom{
margin-top:8px!important;
}

.leaflet-control-zoom a{
width:40px!important;
height:40px!important;
line-height:40px!important;
font-size:20px!important;
}

.leaflet-control-attribution{
font-size:9px;
}

</style>
</head>

<body>

<!-- =========================
MODE CHOICE FIRST
========================= -->

<div id="modeScreen">

<div class="modeContent">

<div class="logo">🪙</div>

<div class="title">GPS COIN</div>

<div class="subtitle">
Explore. Collect. Level up.
</div>

<div class="choose">
Choose your game mode
</div>

<div class="modeButtons">

<button class="mode" onclick="chooseMode('PUBLIC')">

<div class="modeIcon">🌎</div>

PUBLIC

<div class="modeDesc">
Public mapped paths only
</div>

</button>

<button class="mode" onclick="chooseMode('UNLIMITED')">

<div class="modeIcon">🔓</div>

UNLIMITED

<div class="modeDesc">
More mapped paths available
</div>

</button>

</div>

</div>

</div>


<!-- =========================
LOADING
========================= -->

<div id="loadingScreen">

<div class="loadingContent">

<div class="loadingLogo">🪙</div>

<div class="loadingTitle">
GPS COIN
</div>

<div class="loadingSubtitle">
Preparing your adventure...
</div>

<div class="bar">

<div
id="barInner"
class="barInner">
</div>

</div>

<div id="loadingText">
Starting...
</div>

</div>

</div>


<!-- =========================
HUD
========================= -->

<div id="hud">

<div
id="coins"
class="hud">
🪙 Coins: 0
</div>

<div
class="hud hudButton"
onclick="openShop()">
🛒
</div>

<div
class="hud hudButton"
onclick="openAccount()">
👤
</div>

</div>


<div id="map"></div>


<div id="status">
📍 Choose a game mode
</div>


<!-- =========================
SHOP
========================= -->

<div id="shopOverlay" class="overlay">

<div class="panel">

<div class="panelHeader">

<h2>🛒 Shop</h2>

<button
class="close"
onclick="closeShop()">
✕
</button>

</div>

<div id="shopBalance">
🪙 Coins: 0
</div>

<div id="shopItems"></div>

</div>

</div>


<!-- =========================
ACCOUNT
========================= -->

<div id="accountOverlay" class="overlay">

<div class="panel">

<div class="panelHeader">

<h2>👤 Account</h2>

<button
class="close"
onclick="closeAccount()">
✕
</button>

</div>

<div
id="accountEmail"
class="accountEmail">
Loading...
</div>

<button
class="accountButton danger"
onclick="signOut()">
Sign Out
</button>

</div>

</div>


<div id="toast"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
CONFIG
========================================================= */

const SUPABASE_URL =
"https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";


/* =========================================================
GAME SETTINGS
========================================================= */

const SEARCH_RADIUS = 800;

const COIN_SPACING = 65;

const COINS_TO_GENERATE = 12;

const COLLECTION_DISTANCE = 20;

const OVERPASS = [
"https://overpass-api.de/api/interpreter",
"https://overpass.kumi.systems/api/interpreter"
];

let mode = null;

let map = null;

let playerMarker = null;

let playerLat = null;

let playerLon = null;

let coins = [];

let playerData = {
coins:0,
collected_coins:[]
};


/* =========================================================
MODE
========================================================= */

function chooseMode(selected){

mode = selected;

document.getElementById("modeScreen").style.display="none";

document.getElementById("loadingScreen").style.display="flex";

loadProgress("Loading game...",10);

setTimeout(startGPS,500);

}


/* =========================================================
LOADING
========================================================= */

function loadProgress(text,percent){

document.getElementById("loadingText").innerText=text;

document.getElementById("barInner").style.width=percent+"%";

}


/* =========================================================
GPS
========================================================= */

function startGPS(){

loadProgress("Requesting your location...",30);

if(!navigator.geolocation){

fail("GPS is not supported by this browser.");

return;

}

navigator.geolocation.getCurrentPosition(

position=>{

const lat=position.coords.latitude;

const lon=position.coords.longitude;

playerLat=lat;

playerLon=lon;

loadProgress("Creating map...",60);

setTimeout(()=>startGame(lat,lon),400);

},

error=>{

console.error(error);

fail("Location permission is required to play.");

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}


/* =========================================================
START GAME
========================================================= */

function startGame(lat,lon){

map=L.map("map",{
zoomControl:true
}).setView([lat,lon],17);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

createPlayer(lat,lon);

loadProgress("Finding nearest road...",80);

setTimeout(()=>{

document.getElementById("loadingScreen").style.display="none";

document.getElementById("status").innerText=
mode==="PUBLIC"
?"🌎 Public mode — finding a path..."
:"🔓 Unlimited mode — finding a path...";

loadTrail(lat,lon);

},600);

}


/* =========================================================
PLAYER
========================================================= */

function createPlayer(lat,lon){

const icon=L.divIcon({

className:"",

html:'<div class="player"></div>',

iconSize:[28,28],

iconAnchor:[14,14]

});

playerMarker=L.marker(
[lat,lon],
{icon}
).addTo(map);

}


/* =========================================================
OVERPASS
========================================================= */

async function getWays(lat,lon){

const latOffset=SEARCH_RADIUS/111320;

const lonOffset=
SEARCH_RADIUS/
(111320*Math.cos(lat*Math.PI/180));

const south=lat-latOffset;

const north=lat+latOffset;

const west=lon-lonOffset;

const east=lon+lonOffset;

let query=`

[out:json][timeout:20];

way["highway"]
(${south},${west},${north},${east});

out geom tags;

`;

for(const server of OVERPASS){

try{

const response=await fetch(
server,
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body:
"data="+encodeURIComponent(query)
}
);

if(!response.ok) continue;

const data=await response.json();

return filterWays(data.elements);

}catch(e){

console.log(e);

}

}

return [];

}


/* =========================================================
FILTER
========================================================= */

function filterWays(elements){

const allowedPublic=[
"footway",
"path",
"pedestrian",
"steps",
"cycleway",
"bridleway",
"living_street",
"residential"
];

const forbidden=[
"motorway",
"motorway_link",
"trunk",
"trunk_link",
"primary",
"primary_link"
];

return elements.filter(w=>{

if(!w.geometry) return false;

const highway=w.tags?.highway;

if(!highway) return false;

const access=
String(w.tags?.access||"").toLowerCase();

if(
access==="private"||
access==="no"||
access==="permit"||
access==="customers"
) return false;

if(mode==="PUBLIC"){

return allowedPublic.includes(highway);

}

return !forbidden.includes(highway);

});

}


/* =========================================================
NEAREST ROAD POINT
========================================================= */

function nearestPoint(ways,lat,lon){

let best=null;

for(const way of ways){

for(let i=0;i<way.geometry.length;i++){

const p=way.geometry[i];

const d=distance(
lat,
lon,
p.lat,
p.lon
);

if(!best || d<best.distance){

best={
way,
index:i,
point:p,
distance:d
};

}

}

}

return best;

}


/* =========================================================
LOAD TRAIL
========================================================= */

async function loadTrail(lat,lon){

try{

const ways=await getWays(lat,lon);

if(!ways.length){

document.getElementById("status").innerText=
"⚠️ No suitable path found nearby.";

return;

}

const start=nearestPoint(
ways,
lat,
lon
);

if(!start){

document.getElementById("status").innerText=
"⚠️ Couldn't find a nearby road.";

return;

}

if(start.distance>300){

document.getElementById("status").innerText=
"🚶 Nearest mapped path is "+
Math.round(start.distance)+"m away.";

return;

}

const route=buildRoute(
start.way,
start.index
);

createCoin(
start.point.lat,
start.point.lon
);

route.forEach(p=>{
createCoin(p.lat,p.lon);
});

document.getElementById("status").innerText=
"🎮 Follow the path and collect the coins!";

}catch(error){

console.error(error);

document.getElementById("status").innerText=
"⚠️ Couldn't load the path.";

}

}


/* =========================================================
ROUTE
========================================================= */

function buildRoute(way,startIndex){

const result=[];

let distanceSinceCoin=0;

let last=
way.geometry[startIndex];

for(
let i=startIndex+1;
i<way.geometry.length;
i++
){

const p=way.geometry[i];

distanceSinceCoin+=distance(
last.lat,
last.lon,
p.lat,
p.lon
);

if(distanceSinceCoin>=COIN_SPACING){

result.push({
lat:p.lat,
lon:p.lon
});

distanceSinceCoin=0;

if(result.length>=COINS_TO_GENERATE)
break;

}

last=p;

}

return result;

}


/* =========================================================
COINS
========================================================= */

function createCoin(lat,lon){

const id=
Math.round(lat*100000)+
"_"+Math.round(lon*100000);

if(
playerData.collected_coins.includes(id)
)
return;

for(const existing of coins){

if(
distance(
lat,
lon,
existing.lat,
existing.lon
)<20
)
return;

}

const icon=L.divIcon({

className:"",

html:'<div class="coin">🪙</div>',

iconSize:[34,34],

iconAnchor:[17,17]

});

const marker=L.marker(
[lat,lon],
{icon}
).addTo(map);

coins.push({
id,
lat,
lon,
marker,
collected:false
});

}


/* =========================================================
GPS TRACKING
========================================================= */

navigator.geolocation.watchPosition(

position=>{

const lat=position.coords.latitude;

const lon=position.coords.longitude;

playerLat=lat;

playerLon=lon;

if(playerMarker){

playerMarker.setLatLng([lat,lon]);

}

checkCoins(lat,lon);

},

error=>console.log(error),

{
enableHighAccuracy:true,
maximumAge:2000,
timeout:15000
}

);


/* =========================================================
COLLECT
========================================================= */

function checkCoins(lat,lon){

for(const coin of coins){

if(coin.collected)
continue;

if(
distance(
lat,
lon,
coin.lat,
coin.lon
)<=COLLECTION_DISTANCE
){

collect(coin);

}

}

}


function collect(coin){

if(coin.collected)
return;

coin.collected=true;

map.removeLayer(coin.marker);

playerData.coins+=10;

playerData.collected_coins.push(
coin.id
);

updateCoins();

toast("🪙 +10 COINS!");

savePlayer();

}


/* =========================================================
SUPABASE
========================================================= */

async function supabaseRequest(path,options={}){

const response=await fetch(
SUPABASE_URL+"/rest/v1/"+path,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY,
"Content-Type":
"application/json",
...(options.headers||{})
}
}
);

return response;

}


/* =========================================================
LOAD PLAYER
========================================================= */

async function loadPlayer(){

try{

const token=localStorage.getItem("sb-access-token");

if(!token)return;

const response=await fetch(
SUPABASE_URL+
"/rest/v1/players?select=*&id=eq."+token,
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+token
}
}
);

if(!response.ok)return;

const data=await response.json();

if(data.length){

playerData=data[0];

updateCoins();

}

}catch(e){

console.log(e);

}

}


/* =========================================================
SAVE
========================================================= */

async function savePlayer(){

/*
This version keeps the game playable
even if authentication isn't configured
yet.
*/

console.log(
"Player data:",
playerData
);

}


/* =========================================================
SHOP
========================================================= */

const skins={

blue:{name:"Blue",color:"#00aaff",price:0},

red:{name:"Red",color:"#ff3030",price:50},

green:{name:"Green",color:"#22dd55",price:100},

purple:{name:"Purple",color:"#aa55ff",price:150},

gold:{name:"Gold",color:"#ffd000",price:250},

pink:{name:"Pink",color:"#ff4fa3",price:350}

};

function openShop(){

document.getElementById(
"shopOverlay"
).style.display="block";

renderShop();

}

function closeShop(){

document.getElementById(
"shopOverlay"
).style.display="none";

}

function renderShop(){

const container=
document.getElementById("shopItems");

container.innerHTML="";

document.getElementById(
"shopBalance"
).innerText=
"🪙 Coins: "+playerData.coins;

for(const id in skins){

const skin=skins[id];

const item=document.createElement("div");

item.className="shopItem";

item.innerHTML=`

<div
class="preview"
style="background:${skin.color}">
</div>

<div class="skinInfo">

<b>${skin.name}</b>

<div>
${skin.price===0?"FREE":"🪙 "+skin.price}
</div>

</div>

<button
class="buy"
onclick="buySkin('${id}')">

${skin.price===0?"EQUIP":"BUY"}

</button>

`;

container.appendChild(item);

}

}

function buySkin(id){

const skin=skins[id];

if(!skin)return;

if(skin.price>playerData.coins){

toast("❌ Not enough coins");

return;

}

playerData.coins-=skin.price;

updateCoins();

toast("🎨 "+skin.name+" equipped!");

}


/* =========================================================
ACCOUNT
========================================================= */

function openAccount(){

document.getElementById(
"accountOverlay"
).style.display="block";

}

function closeAccount(){

document.getElementById(
"accountOverlay"
).style.display="none";

}

function signOut(){

localStorage.clear();

location.reload();

}


/* =========================================================
UI
========================================================= */

function updateCoins(){

document.getElementById("coins").innerText=
"🪙 Coins: "+playerData.coins;

}

let toastTimer;

function toast(text){

const el=
document.getElementById("toast");

el.innerText=text;

el.classList.add("show");

clearTimeout(toastTimer);

toastTimer=setTimeout(
()=>el.classList.remove("show"),
2200
);

}


/* =========================================================
DISTANCE
========================================================= */

function distance(
lat1,
lon1,
lat2,
lon2
){

const R=6371000;

const p1=lat1*Math.PI/180;

const p2=lat2*Math.PI/180;

const dLat=
(lat2-lat1)*Math.PI/180;

const dLon=
(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(p1)*
Math.cos(p2)*
Math.sin(dLon/2)**2;

const c=
2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

return R*c;

}


/* =========================================================
FAIL
========================================================= */

function fail(message){

document.getElementById(
"loadingScreen"
).style.display="none";

document.getElementById(
"modeScreen"
).style.display="flex";

alert(message);

}

</script>

</html>
