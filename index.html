/* =========================================================

function setStatus(text){

function setLoading(text,percent){

  loadingBar.style.width =
    percent + "%";

}


function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  if(toastTimer)
    clearTimeout(toastTimer);

  toastTimer =
    setTimeout(

        toast.classList.remove("show");
      },

    );

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dLat =
    (lat2-lat1) * Math.PI / 180;

  const dLon =
    (lon2-lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2)**2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

  authStatus.textContent =
    "Checking account...";

  const {
    data,
    error
  } =
    await supabase.auth.getSession();

  if(error){

    console.error(error);

  }

  if(data.session){

    currentUser =
      data.session.user;

    await afterLogin();

    return;

  }

  authScreen.style.display =
    "flex";

  authStatus.textContent =
    "Sign in to save your coins.";

}


document
.getElementById("signInButton")
.addEventListener(
  "click",
  signIn
);


async function signIn(){

  const email =
    document
      .getElementById("emailInput")
      .value
      .trim();

  if(!email){

    authStatus.textContent =
      "Enter your email.";

    return;

  }

  if(!email.includes("@")){

    authStatus.textContent =
      "That doesn't look like an email.";

    return;

  }

  const button =
    document.getElementById(
      "signInButton"
    );

  button.disabled = true;

  authStatus.textContent =
    "Sending sign-in link...";

  const redirect =
    window.location.origin +
    window.location.pathname;

  const {
    error
  } =
    await supabase.auth.signInWithOtp({

      email,

      options:{
        emailRedirectTo:redirect,
        shouldCreateUser:true
      }

    });

  button.disabled = false;

  if(error){

    console.error(error);

    authStatus.textContent =
      "❌ " + error.message;

    return;

  }

  authStatus.textContent =
    "✅ Check your email. Tap the sign-in link.";

}


/* =========================================================
   AFTER LOGIN
========================================================= */

async function afterLogin(){

  authScreen.style.display =
    "none";

  try{

    await loadPlayer();

  }catch(error){

    console.error(error);

    authScreen.style.display =
      "flex";

    authStatus.textContent =
      "Couldn't load your player data.";

    return;

  }

  modeScreen.style.display =
    "flex";

}


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

  if(!currentUser)
    return;

  let {
    data,
    error
  } =
    await supabase
      .from("players")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error)
    throw error;

  if(!data){

    const newPlayer = {

      id:currentUser.id,

      username:
        currentUser.email
          ?.split("@")[0] ||
        "Player",

      coins:0,

      xp:0,

      level:1,

      unlocked_skins:["blue"],

      equipped_skin:"blue",

      collected_coins:[]

    };

    const result =
      await supabase
        .from("players")
        .insert(newPlayer)
        .select()
        .single();

    if(result.error)
      throw result.error;

    data =
      result.data;

  }

  data.coins =
    Number(data.coins || 0);

  data.xp =
    Number(data.xp || 0);

  data.level =
    Number(data.level || 1);

  data.unlocked_skins =
    Array.isArray(data.unlocked_skins)
      ? data.unlocked_skins
      : ["blue"];

  data.collected_coins =
    Array.isArray(data.collected_coins)
      ? data.collected_coins
      : [];

  data.equipped_skin =
    data.equipped_skin ||
    "blue";

  playerData =
    data;

  updateCoinDisplay();

}


/* =========================================================
   SAVE
========================================================= */

async function savePlayer(){

  if(!playerData)
    return;

  const {
    error
  } =
    await supabase
      .from("players")
      .update({

        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        unlocked_skins:
          playerData.unlocked_skins,

        equipped_skin:
          playerData.equipped_skin,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          new Date().toISOString()

      })

      );

  if(error){

    console.error(
      "Save error:",
      error
    );

    showToast(
      "⚠️ Couldn't save"
    );

  }

}

/* =========================================================
   MAP
========================================================= */

function initializeMap(){

  if(map)
    return;

  map =
    L.map("map",{
      zoomControl:true
    }).setView(
      [42.96,-85.67],
      15
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);

}


/* =========================================================
   GPS
========================================================= */

function startGPS(){

  if(!navigator.geolocation){

    setStatus(
      "❌ This browser doesn't support GPS."
    );

    return;

  }

  watchId =
    navigator.geolocation.watchPosition(

      onLocation,

      onLocationError,

      {
        enableHighAccuracy:true,
        maximumAge:3000,
        timeout:12000
      }

    );

}


function onLocation(position){

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy || 30;

  setLoading(
    "Location found!",
    55

  if(!playerMarker){

    createPlayer(
      lat,
      lon
    );

    map.setView(
      [lat,lon],
      17
    );

    firstLocation = false;

    loadingScreen.style.display =
      "none";

    setStatus(
      "🗺️ Finding your nearest connected road..."
    );

    loadRoadNetwork(
      lat,
      lon
    );

  }else{

    playerMarker.setLatLng(
      [lat,lon]
    );

    if(accuracyCircle){

      accuracyCircle
        .setLatLng([lat,lon])
        .setRadius(accuracy);

    }

  }

  collectNearbyCoins(
    lat,
    lon
  );

  if(
    lastRoadLat === null ||
    lastRoadLon === null
  ){

    return;

  }

  const moved =
    distanceMeters(
      lastRoadLat,
      lastRoadLon,
      lat,
      lon
    );

  if(
    moved >=
    ROAD_REFRESH_DISTANCE
  ){

    loadRoadNetwork(
      lat,
      lon
    );

  }

}


function onLocationError(error){

  console.error(
    "GPS:",
    error
  );

  loadingScreen.style.display =
    "none";

  if(error.code === 1){

    setStatus(
      "📍 Location permission denied. Enable Location for this site."
    );

  }else if(error.code === 2){

    setStatus(
      "📍 GPS unavailable. Waiting for a better signal..."
    );

  }else if(error.code === 3){

    setStatus(
      "📍 GPS timeout. Still trying..."
    );

  }else{

    setStatus(
      "📍 Waiting for GPS..."
    );

  }

}

/* =========================================================
   ROAD LOADING
========================================================= */

async function loadRoadNetwork(
  lat,
  lon
){

  if(loadingRoads)
    return;

  loadingRoads = true;

  lastRoadLat = lat;

  lastRoadLon = lon;

  setStatus(
    "🗺️ Searching for nearby roads..."
  );

  try{

    const ways =
      await getNearbyWays(
        lat,
        lon
      );

    if(!ways.length){

      setStatus(
        "🔎 No mapped roads found nearby. Retrying..."
      );

      loadingRoads = false;

      setTimeout(
        ()=>{
          loadRoadNetwork(
            lat,
            lon
          );
        },
        5000
      );

      return;

    }

    const nearest =
      findNearestRoadPoint(
        ways,
        lat,
        lon
      );

    if(!nearest){

      setStatus(
        "🔎 Couldn't locate a nearby road."
      );

      loadingRoads = false;

      return;

    }

    const roadDistance =
      Math.round(
        nearest.distance
      );

    if(
      roadDistance >
      ROAD_MAX_DISTANCE
    ){

      setStatus(
        `🚶 Nearest road: ${roadDistance}m away`
      );

      loadingRoads = false;

      return;

    }

    const network =
      buildConnectedNetwork(
        ways,
        nearest.way
      );

    lastRoadNetwork =
      network;

    generateNetworkCoins(
      network,
      nearest,
      lat,
      lon
    );

    const activeCoins =
      coins.filter(
        c=>!c.collected
      ).length;

    setStatus(
      `🛣️ Road ${roadDistance}m away • ${network.length} connected sections • ${activeCoins} coins`
    );

  }catch(error){

    console.error(
      "Road loading error:",
      error
    );

    setStatus(
      "⚠️ Road server failed. Trying again..."
    );

  }

  loadingRoads = false;

}


/* =========================================================
   OVERPASS
========================================================= */

async function getNearbyWays(
  lat,
  lon
){

  const latDelta =
    SEARCH_RADIUS / 111320;

  const lonDelta =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat * Math.PI / 180
      )
    );

  const south =
    lat - latDelta;

  const north =
    lat + latDelta;

  const west =
    lon - lonDelta;

  const east =
    lon + lonDelta;

  let filter = `
    way["highway"]
    (${south},${west},${north},${east});
  `;

  if(gameMode === "PUBLIC"){

    filter = `
      way["highway"]
      ["access"!="private"]
      ["access"!="no"]
      ["access"!="customers"]
      ["access"!="permit"]
      (${south},${west},${north},${east});
    `;

  }

  const query = `

    [out:json][timeout:15];

    ${filter}

    out tags geom;

  `;

  for(
    const server of
    OVERPASS_SERVERS
  ){

    try{

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          ()=>{
            controller.abort();
          },
          12000
        );

      const response =
        await fetch(
          server,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(query),

            signal:
              controller.signal
          }
        );

      clearTimeout(timeout);

      if(!response.ok)
        continue;

      const json =
        await response.json();

      const ways =
        filterWays(
          json.elements || []
        );

      if(ways.length)
        return ways;

    }catch(error){

      console.log(
        "Overpass failed:",
        server,
        error
      );

    }

  }

  return [];

}


/* =========================================================
   FILTER
========================================================= */

function filterWays(elements){

  const allowedPublic = [

    "footway",
    "path",
    "pedestrian",
    "steps",
    "cycleway",
    "bridleway",
    "living_street",
    "residential",
    "unclassified",
    "service",
    "tertiary",
    "tertiary_link",
    "secondary",
    "secondary_link"

  ];

  const result = [];

  for(
    const e of elements
  ){

    if(
      e.type !== "way" ||
      !e.geometry ||
      e.geometry.length < 2
    )
      continue;

    const tags =
      e.tags || {};

    const highway =
      tags.highway;

    if(!highway)
      continue;

    if(gameMode === "PUBLIC"){

      if(
        !allowedPublic.includes(
          highway
        )
      )
        continue;

    }else{

      const forbidden = [

        "motorway",
        "motorway_link",
        "trunk",
        "trunk_link"

      ];

      if(
        forbidden.includes(
          highway
        )
      )
        continue;

    }

    result.push({

      id:e.id,

      geometry:
        e.geometry.map(
          p=>({
            lat:Number(p.lat),
            lon:Number(p.lon)
          })
        ),

      tags

    });

  }

  return result;

}


/* =========================================================
   NEAREST ROAD POINT
========================================================= */

function findNearestRoadPoint(
  ways,
  lat,
  lon
){

  let best = null;

  for(
    const way of ways
  ){

    for(
      let i=0;
      i<way.geometry.length-1;
      i++
    ){

      const a =
        way.geometry[i];

      const b =
        way.geometry[i+1];

      const point =
        closestPointOnSegment(
          lat,
          lon,
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );

      const d =
        distanceMeters(
          lat,
          lon,
          point.lat,
          point.lon
        );

      if(
        !best ||
        d < best.distance
      ){

        best = {

          way,

          segmentIndex:i,

          point,

          distance:d

        };

      }

    }

  }

  return best;

}


/* =========================================================
   CLOSEST POINT
========================================================= */

function closestPointOnSegment(
  lat,
  lon,
  lat1,
  lon1,
  lat2,
  lon2
){

  const cos =
    Math.cos(
      lat * Math.PI / 180
    );

  const x =
    (lon-lon1) *
    111320 *
    cos;

  const y =
    (lat-lat1) *
    111320;

  const dx =
    (lon2-lon1) *
    111320 *
    cos;

  const dy =
    (lat2-lat1) *
    111320;

  const len2 =
    dx*dx + dy*dy;

  let t =
    len2 === 0
      ? 0
      : (x*dx+y*dy)/len2;

  t =
    Math.max(
      0,
      Math.min(1,t)
    );

  return {

    lat:
      lat1 +
      (lat2-lat1)*t,

    lon:
      lon1 +
      (lon2-lon1)*t

  };

}


/* =========================================================
   CONNECTED NETWORK
========================================================= */

function buildConnectedNetwork(
  ways,
  startingWay
){

  const network = [];

  const visited =
    new Set();

  const queue =
    [startingWay];

  while(queue.length){

    const way =
      queue.shift();

    if(
      visited.has(
        way.id
      )
    )
      continue;

    visited.add(
      way.id
    );

    network.push(
      way
    );

    for(
      const other of ways
    ){

      if(
        visited.has(
          other.id
        )
      )
        continue;

      if(
        waysConnected(
          way,
          other
        )
      ){

        queue.push(
          other
        );

      }

    }

  }

  return network;

}


function waysConnected(
  a,
  b
){

  const a1 =
    a.geometry[0];

  const a2 =
    a.geometry[
      a.geometry.length-1
    ];

  const b1 =
    b.geometry[0];

  const b2 =
    b.geometry[
      b.geometry.length-1
    ];

  const limit = 28;

  return (

    distanceMeters(
      a1.lat,a1.lon,
      b1.lat,b1.lon
    ) <= limit ||

    distanceMeters(
      a1.lat,a1.lon,
      b2.lat,b2.lon
    ) <= limit ||

    distanceMeters(
      a2.lat,a2.lon,
      b1.lat,b1.lon
    ) <= limit ||

    distanceMeters(
      a2.lat,a2.lon,
      b2.lat,b2.lon
    ) <= limit

  );

}


/* =========================================================
   GENERATE COINS
========================================================= */

function generateNetworkCoins(
  network,
  nearest,
  playerLat,
  playerLon
){

  if(
    !network ||
    !network.length
  )
    return;

  /*
   * IMPORTANT:
   * Do NOT remove existing uncollected coins.
   *
   * Coins remain in the world until the
   * player collects them.
   */

  const ordered =
    network.slice().sort(
      (a,b)=>{

        const da =
          distanceToWay(
            nearest.point,
            a
          );

        const db =
          distanceToWay(
            nearest.point,
            b
          );

        return da-db;

      }
    );

  let generated = 0;

  const currentActive =
    coins.filter(
      c=>!c.collected
    ).length;

  /*
   * Start from the nearest road.
   */

  const first =
    ordered[0];

  if(first){

    const points =
      pointsAlongWay(
        first,
        nearest.point,
        true
      );

    for(
      const p of points
    ){

      if(
        coins.filter(
          c=>!c.collected
        ).length >= TARGET_COINS
      )
        break;

      if(
        addCoin(
          p.lat,
          p.lon
        )
      ){

        generated++;

      }

    }

  }

  /*
   * Continue along connected roads.
   */

  for(
    let i=1;
    i<ordered.length &&
    coins.filter(
      c=>!c.collected
    ).length < TARGET_COINS;
    i++
  ){

    const points =
      pointsAlongWay(
        ordered[i],
        null,
        false
      );

    for(
      const p of points
    ){

      if(
        coins.filter(
          c=>!c.collected
        ).length >= TARGET_COINS
      )
        break;

      if(
        addCoin(
          p.lat,
          p.lon
        )
      ){

        generated++;

      }

    }

  }

  /*
   * Save the last location where we
   * generated coins.
   */

  lastCoinSpawnLat =
    playerLat;

  lastCoinSpawnLon =
    playerLon;

}


/* =========================================================
   POINTS ALONG WAY
========================================================= */

function pointsAlongWay(
  way,
  startingPoint,
  fromNearest
){

  const result = [];

  let geometry =
    way.geometry.slice();

  if(
    fromNearest &&
    startingPoint
  ){

    const first =
      geometry[0];

    const last =
      geometry[
        geometry.length-1
      ];

    const dFirst =
      distanceMeters(
        startingPoint.lat,
        startingPoint.lon,
        first.lat,
        first.lon
      );

    const dLast =
      distanceMeters(
        startingPoint.lat,
        startingPoint.lon,
        last.lat,
        last.lon
      );

    if(
      dLast < dFirst
    ){

      geometry.reverse();

    }

  }

  let accumulated = 0;

  let previous =
    startingPoint ||
    geometry[0];

  for(
    let i=0;
    i<geometry.length;
    i++
  ){

    const p =
      geometry[i];

    const d =
      distanceMeters(
        previous.lat,
        previous.lon,
        p.lat,
        p.lon
      );

    accumulated += d;

    if(
      accumulated >=
      COIN_SPACING
    ){

      result.push({

        lat:p.lat,

        lon:p.lon

      });

      accumulated = 0;

    }

    previous = p;

  }

  return result;

}


/* =========================================================
   DISTANCE TO WAY
========================================================= */

function distanceToWay(
  point,
  way
){

  let best = Infinity;

  for(
    let i=0;
    i<way.geometry.length;
    i++
  ){

    const p =
      way.geometry[i];

    const d =
      distanceMeters(
        point.lat,
        point.lon,
        p.lat,
        p.lon
      );

    if(d<best)
      best=d;

  }

  return best;

}


/* =========================================================
   COIN ID
========================================================= */

function coinId(
  lat,
  lon
){

  return (
    Math.round(lat*100000)
    +
    "_" +
    Math.round(lon*100000)
  );

}


/* =========================================================
   ADD COIN
========================================================= */

function addCoin(
  lat,
  lon
){

  if(
    !map ||
    !playerData
  )
    return false;

  const id =
    coinId(
      lat,
      lon
    );

  /*
   * Permanently collected coins
   * never respawn.
   */

  if(
    playerData.collected_coins
      .includes(id)
  ){

    return false;

  }

  /*
   * Don't duplicate nearby coins.
   */

  for(
    const c of coins
  ){

    if(
      !c.collected &&
      distanceMeters(
        lat,
        lon,
        c.lat,
        c.lon
      ) < 25
    ){

      return false;

    }

  }

  const marker =
    L.marker(
      [lat,lon],
      {
        icon:
          L.divIcon({

            className:"",

            html:
              `<div class="coin">🪙</div>`,

            iconSize:[34,34],

            iconAnchor:[17,17]

          })
      }
    ).addTo(map);

  coins.push({

    id,

    lat,

    lon,

    marker,

    collected:false

  });

  return true;

}


/* =========================================================
   COIN COUNT
========================================================= */

function activeCoinCount(){

  return coins.filter(
    c=>!c.collected
  ).length;

}


/* =========================================================
   KEEP COINS AVAILABLE
========================================================= */

function ensureCoinsAvailable(
  lat,
  lon
){

  if(
    !map ||
    !playerData
  )
    return;

  const active =
    activeCoinCount();

  /*
   * If we have plenty, do nothing.
   */

  if(
    active >= TARGET_COINS
  )
    return;

  /*
   * If we're already loading roads,
   * let that request finish.
   */

  if(loadingRoads)
    return;

  /*
   * Don't constantly hammer Overpass
   * on every GPS update.
   */

  if(
    lastCoinSpawnLat !== null &&
    lastCoinSpawnLon !== null
  ){

    const moved =
      distanceMeters(
        lastCoinSpawnLat,
        lastCoinSpawnLon,
        lat,
        lon
      );

    if(moved < 35)
      return;

  }

  lastCoinSpawnLat =
    lat;

  lastCoinSpawnLon =
    lon;

  /*
   * Generate more from the current
   * connected road network first.
   */

  if(
    lastRoadNetwork.length
  ){

    const nearest =
      findNearestRoadPoint(
        lastRoadNetwork,
        lat,
        lon
      );

    if(nearest){

      generateNetworkCoins(
        lastRoadNetwork,
        nearest,
        lat,
        lon
      );

    }

  }

  /*
   * If that wasn't enough, refresh
   * the road network.
   */

  if(
    activeCoinCount() <
    TARGET_COINS
  ){

    loadRoadNetwork(
      lat,
      lon
    );

  }

}


/* =========================================================
   COLLECT NEARBY COINS
========================================================= */

function collectNearbyCoins(
  lat,
  lon
){

  for(
    const c of coins
  ){

    if(
      c.collected
    )
      continue;

    const d =
      distanceMeters(
        lat,
        lon,
        c.lat,
        c.lon
      );

    if(
      d <=
      COLLECTION_DISTANCE
    ){

      collectCoin(
        c
      );

    }

  }

  /*
   * Always make sure more coins
   * are available.
   */

  ensureCoinsAvailable(
    lat,
    lon
  );

}


/* =========================================================
   COLLECT COIN
========================================================= */

async function collectCoin(c){

  if(
    !playerData ||
    c.collected
  )
    return;

  c.collected = true;

  if(
    map.hasLayer(
      c.marker
    )
  ){

    map.removeLayer(
      c.marker
    );

  }

  if(
    !playerData.collected_coins
      .includes(c.id)
  ){

    playerData.collected_coins.push(
      c.id
    );

  }

  playerData.coins += 10;

  playerData.xp += 10;

  checkLevel();

  updateCoinDisplay();

  showToast(
    "🪙 COIN COLLECTED! +10"
  );

  setStatus(
    "🎮 Keep exploring!"
  );

  /*
   * Save immediately.
   */

  await savePlayer();

  /*
   * Give the player another coin
   * supply after collection.
   */

  if(
    playerMarker
  ){

    const pos =
      playerMarker.getLatLng();

    ensureCoinsAvailable(
      pos.lat,
      pos.lng
    );

  }

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

  if(!playerData)
    return;

  let required =
    playerData.level * 100;

  while(
    playerData.xp >= required
  ){

    playerData.xp -=
      required;

    playerData.level++;

    showToast(
      `🎉 LEVEL ${playerData.level}!`
    );

    required =
      playerData.level * 100;

  }

}


/* =========================================================
   DISPLAY
========================================================= */

function updateCoinDisplay(){

  coinsDisplay.textContent =
    `🪙 Coins: ${
      playerData?.coins || 0
    }`;

}

function renderShop(){

  if(!playerData)
    return;

  shopBalance.textContent =
    `🪙 Coins: ${playerData.coins}`;

  shopItems.innerHTML = "";

  for(
    const [id,skin]
    of Object.entries(SKINS)
  ){

    const unlocked =
      playerData.unlocked_skins
        .includes(id);

    const equipped =
      playerData.equipped_skin === id;

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "shopItem";

    const preview =
      document.createElement(
        "div"
      );

    preview.className =
      "skinPreview";

    preview.style.background =
      skin.color;

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "skinInfo";

    info.innerHTML = `

      <div class="skinName">
        ${skin.name}
      </div>

      <div class="skinPrice">
        ${
          skin.price === 0
            ? "FREE"
            : "🪙 " + skin.price
        }
      </div>

    `;

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "action";

    if(equipped){

      button.textContent =
        "EQUIPPED";

      button.disabled = true;

    }else if(unlocked){

      button.textContent =
        "EQUIP";

      button.onclick =
        ()=>{
          equipSkin(id);
        };

    }else if(
      playerData.coins >=
      skin.price
    ){

      button.textContent =
        "BUY";

      button.onclick =
        ()=>{
          buySkin(id);
        };

    }else{

      button.textContent =
        "NEED COINS";

      button.disabled = true;

    }

    item.append(
      preview,
      info,
      button
    );

    shopItems.appendChild(
      item
    );

  }

}


async function buySkin(id){

  const skin =
    SKINS[id];

  if(
    !skin ||
    !playerData
  )
    return;

  if(
    playerData.unlocked_skins
      .includes(id)
  )
    return;

  if(
    playerData.coins <
    skin.price
  ){

    showToast(
      "❌ Not enough coins"
    );

    return;

  }

  playerData.coins -=
    skin.price;

  playerData.unlocked_skins.push(
    id
  );

  playerData.equipped_skin =
    id;

  await savePlayer();

  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();

  showToast(
    `🎨 ${skin.name} unlocked!`
  );

}


async function equipSkin(id){

  if(
    !playerData ||
    !playerData.unlocked_skins
      .includes(id)
  )
    return;

  playerData.equipped_skin =
    id;

  await savePlayer();

  updatePlayerSkin();

  renderShop();

}


function updatePlayerSkin(){

  if(!playerMarker)
    return;

  const skin =
    SKINS[
      playerData?.equipped_skin
    ] ||
    SKINS.blue;

  playerMarker.setIcon(

    L.divIcon({

      className:"",

      html:
        `<div class="player"
          style="--player-color:${skin.color}">
        </div>`,

      iconSize:[28,28],

      iconAnchor:[14,14]

    })

  );

}

/* =========================================================
   BACKGROUND MUSIC
========================================================= */

/*
 * iPhone/Safari blocks audio autoplay.
 * The first tap anywhere starts the music.
 *
 * This generates the music locally, so you
 * don't need another music file.
 */

function startMusic(){

  if(musicStarted)
    return;

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext)
      return;

    musicContext =
      new AudioContext();

    musicMaster =
      musicContext.createGain();

    musicMaster.gain.value =
      0.035;

    musicMaster.connect(
      musicContext.destination
    );

    if(
      musicContext.state ===
      "suspended"
    ){

      musicContext.resume();

    }

    musicStarted = true;

    playMusicLoop();

  }catch(error){

    console.log(
      "Music unavailable:",
      error
    );

  }

}


function playMusicLoop(){

  if(
    !musicContext ||
    !musicMaster
  )
    return;

  const now =
    musicContext.currentTime;

  /*
   * Chill repeating melody.
   */

  const notes = [

    220.00,
    261.63,
    329.63,
    293.66,

    246.94,
    329.63,
    392.00,
    329.63

  ];

  notes.forEach(
    (
      frequency,
      index
    )=>{

      const oscillator =
        musicContext
          .createOscillator();

      const gain =
        musicContext
          .createGain();

      oscillator.type =
        "sine";

      oscillator.frequency.value =
        frequency;

      const start =
        now +
        index * 0.7;

      const end =
        start + 1.4;

      gain.gain.setValueAtTime(
        0,
        start
      );

      gain.gain.linearRampToValueAtTime(
        0.12,
        start + 0.15
      );

      gain.gain.linearRampToValueAtTime(
        0,
        end
      );

      oscillator.connect(
        gain
      );

      gain.connect(
        musicMaster
      );

      oscillator.start(
        start
      );

      oscillator.stop(
        end
      );

    }
  );

  musicTimer =
    setTimeout(
      playMusicLoop,
      5200
    );

}


/*
 * Any first interaction starts music.
 */

function activateMusic(){

  startMusic();

}

document.addEventListener(
  "click",
  activateMusic,
  {
    once:true,
    passive:true
  }
);

document.addEventListener(
  "touchstart",
  activateMusic,
  {
    once:true,
    passive:true
  }
);

document.addEventListener(
  "pointerdown",
  activateMusic,
  {
    once:true,
    passive:true
  }
);
