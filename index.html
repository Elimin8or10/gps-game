<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPS Coin</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#080b10;
}

button{
  font:inherit;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}


/* =========================
   MODE SCREEN
========================= */

#modeScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at center,#172b40 0%,#080b10 70%);
  color:white;
}

.modePanel{
  width:min(440px,100%);
  text-align:center;
}

.logo{
  font-size:70px;
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

.modeTitle{
  margin:5px 0;
  font-size:38px;
  font-weight:900;
}

.modeSubtitle{
  color:#9eacba;
  margin-bottom:30px;
}

.modeButtons{
  display:flex;
  gap:12px;
}

.modeButton{
  flex:1;
  padding:20px 12px;
  border-radius:20px;
  border:1px solid #36485a;
  background:#151e28;
  color:white;
  cursor:pointer;
  transition:.15s;
}

.modeButton:active{
  transform:scale(.96);
}

.modeButton:hover{
  border-color:#00aaff;
  background:#1c2a38;
}

.modeIcon{
  font-size:35px;
}

.modeName{
  margin-top:8px;
  font-size:17px;
  font-weight:900;
}

.modeDescription{
  margin-top:6px;
  font-size:12px;
  line-height:1.4;
  color:#8e9baa;
}


/* =========================
   LOADING
========================= */

#loadingScreen{
  position:fixed;
  inset:0;
  z-index:99998;
  display:none;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#172333 0%,#080b10 70%);
  color:white;
  opacity:1;
  transition:.6s;
}

#loadingScreen.hidden{
  opacity:0;
  pointer-events:none;
}

.loadingContent{
  width:min(90%,430px);
  text-align:center;
}

.loadingLogo{
  font-size:65px;
  animation:float 2s ease-in-out infinite;
}

.loadingTitle{
  margin:5px 0;
  font-size:36px;
  font-weight:900;
}

.loadingSubtitle{
  color:#9ca9b8;
}

.loadingBar{
  width:100%;
  height:8px;
  margin-top:30px;
  border-radius:20px;
  overflow:hidden;
  background:#202a35;
}

.loadingBarInner{
  width:5%;
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,#00aaff,#66ddff);
  box-shadow:0 0 15px #00aaff;
  transition:.4s;
}

#loadingText{
  margin-top:14px;
  color:#b9c5d2;
  font-size:14px;
}


/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  left:10px;
  right:10px;
  z-index:1000;

  display:flex;
  gap:7px;

  pointer-events:none;
}

.hudBox{
  min-height:44px;
  padding:10px 12px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:rgba(8,13,19,.94);
  color:white;

  box-shadow:0 4px 18px rgba(0,0,0,.35);

  backdrop-filter:blur(10px);

  font-weight:bold;
  white-space:nowrap;

  pointer-events:auto;
}

#coinsDisplay{
  flex:1;
  justify-content:flex-start;
}

#shopButton,
#accountButton{
  cursor:pointer;
}


/* =========================
   STATUS
========================= */

#status{
  position:absolute;

  left:12px;
  right:12px;

  bottom:calc(15px + env(safe-area-inset-bottom,0px));

  z-index:1000;

  padding:12px 15px;

  border-radius:14px;

  background:rgba(8,13,19,.94);

  color:white;

  text-align:center;

  font-size:13px;

  box-shadow:0 4px 18px rgba(0,0,0,.35);

  pointer-events:none;
}


/* =========================
   PLAYER
========================= */

.player{
  width:23px;
  height:23px;

  border:3px solid white;
  border-radius:50%;

  background:var(--player-color);

  box-shadow:
    0 0 8px var(--player-color),
    0 0 18px var(--player-color),
    0 0 30px var(--player-color);
}


/* =========================
   COINS
========================= */

.coin{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:3px solid #fff4a3;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 35%,
      #fffbd0,
      #ffe44d 25%,
      #ffd000 55%,
      #f0a000 80%,
      #c87800
    );

  box-shadow:
    0 0 8px #ffd700,
    0 0 18px #ffb000,
    0 0 28px rgba(255,190,0,.7);

  font-size:15px;

  animation:coinPulse 1.4s infinite;
}

@keyframes coinPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.13)}
}


/* =========================
   PLAYER PULSE
========================= */

.playerPulse{
  animation:playerPulse 1.5s infinite;
}

@keyframes playerPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.15)}
  100%{transform:scale(1)}
}


/* =========================
   OVERLAYS
========================= */

.overlay{
  display:none;

  position:fixed;
  inset:0;

  z-index:5000;

  padding:20px;

  overflow-y:auto;

  background:rgba(0,0,0,.8);
}

.panel{
  width:min(500px,100%);

  margin:30px auto;

  padding:20px;

  border-radius:20px;

  background:#151a20;

  color:white;

  box-shadow:0 10px 40px rgba(0,0,0,.7);
}

.panelHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panelHeader h2{
  margin:0;
}

.close{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  background:#333;
  color:white;
  cursor:pointer;
}


/* =========================
   SHOP
========================= */

#shopBalance{
  margin:15px 0;
  padding:12px;

  border-radius:12px;

  text-align:center;
  font-weight:bold;

  background:rgba(255,215,0,.12);
  border:1px solid rgba(255,215,0,.4);
}

.shopItem{
  display:flex;
  align-items:center;
  gap:15px;

  margin-bottom:12px;
  padding:15px;

  border-radius:15px;

  background:#20262d;
}

.skinPreview{
  width:42px;
  height:42px;

  flex-shrink:0;

  border:4px solid white;
  border-radius:50%;
}

.skinInfo{
  flex:1;
}

.skinName{
  font-weight:bold;
}

.skinPrice{
  margin-top:4px;
  color:#ffd700;
  font-size:13px;
}

.shopAction{
  border:0;
  border-radius:10px;
  padding:9px 12px;

  background:#0077cc;
  color:white;

  font-weight:bold;
}

.shopAction:disabled{
  opacity:.5;
}


/* =========================
   ACCOUNT
========================= */

.accountEmail{
  margin:15px 0;
  padding:12px;

  border-radius:12px;

  background:#20262d;
  color:#b9c5d2;

  word-break:break-all;
}

.accountButton{
  width:100%;

  border:0;
  border-radius:12px;

  padding:13px;
  margin-top:10px;

  background:#0077cc;
  color:white;

  font-weight:bold;
}

.accountButton.danger{
  background:#a83232;
}


/* =========================
   TOAST
========================= */

#toast{
  position:fixed;

  left:50%;
  bottom:90px;

  z-index:10000;

  transform:
    translateX(-50%)
    translateY(20px);

  padding:13px 18px;

  border-radius:14px;

  background:#101820;
  color:white;

  box-shadow:0 8px 30px rgba(0,0,0,.45);

  opacity:0;
  pointer-events:none;

  transition:.25s;

  font-weight:bold;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================
   LEAFLET
========================= */

/*
   Push zoom buttons BELOW the HUD.
*/

.leaflet-top.leaflet-left{
  top:70px;
  left:10px;
}

.leaflet-control-zoom{
  margin-top:8px!important;
}

.leaflet-control-zoom a{
  width:40px!important;
  height:40px!important;
  line-height:40px!important;
  font-size:20px!important;
}

.leaflet-control-attribution{
  font-size:9px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .modeButtons{
    flex-direction:column;
  }

  .modeButton{
    padding:17px;
  }

  .modeTitle{
    font-size:32px;
  }

  .hudBox{
    padding:9px 10px;
  }

}
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   SKINS
========================================================= */

const SKINS = {

  blue:{
    name:"Blue",
    color:"#00aaff",
    price:0
  },

  red:{
    name:"Red",
    color:"#ff3030",
    price:50
  },

  green:{
    name:"Green",
    color:"#22dd55",
    price:100
  },

  purple:{
    name:"Purple",
    color:"#aa55ff",
    price:150
  },

  gold:{
    name:"Gold",
    color:"#ffd000",
    price:250
  },

  pink:{
    name:"Pink",
    color:"#ff4fa3",
    price:350
  }

};


/* =========================================================
   SETTINGS
========================================================= */

const SEARCH_RADIUS = 1000;

/*
   Coins every 45 meters.

   This gives MANY more coins on a route.
*/

const COIN_SPACING = 45;

const COLLECTION_DISTANCE = 18;

const REFRESH_DISTANCE = 150;


/*
   How many coins the initial road gets.
*/

const MAIN_COINS = 30;


/*
   Branch roads get coins too.
*/

const BRANCH_COINS = 10;


/* =========================================================
   OVERPASS
========================================================= */

const OVERPASS_SERVERS = [

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter",

  "https://overpass.private.coffee/api/interpreter"

];


/* =========================================================
   STATE
========================================================= */

let user = null;

let player = null;

let map = null;

let playerMarker = null;

let gameMode = "PUBLIC";

let currentLat = null;

let currentLon = null;

let loadingTrail = false;

let gpsWatch = null;

let coins = [];


/* =========================================================
   DOM
========================================================= */

const modeScreen =
  document.getElementById("modeScreen");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingText =
  document.getElementById("loadingText");

const loadingBar =
  document.getElementById("loadingBarInner");

const status =
  document.getElementById("status");

const coinsDisplay =
  document.getElementById("coinsDisplay");

const toast =
  document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function setStatus(text){

  status.innerText = text;

}


function loading(text,percent){

  loadingText.innerText = text;

  loadingBar.style.width =
    percent + "%";

}


function showToast(text){

  toast.innerText = text;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2)**2 +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2)**2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


/* =========================================================
   MODE
========================================================= */

document
  .getElementById("publicMode")
  .onclick = () => {

    gameMode = "PUBLIC";

    beginGame();

  };


document
  .getElementById("unlimitedMode")
  .onclick = () => {

    gameMode = "UNLIMITED";

    beginGame();

  };


/* =========================================================
   START
========================================================= */

async function beginGame(){

  modeScreen.style.display =
    "none";

  loadingScreen.style.display =
    "flex";

  loading(
    "Connecting...",
    10
  );


  try{

    const {
      data,
      error
    } =
      await supabase.auth.getUser();


    if(error){
      console.log(error);
    }


    user =
      data.user;


    if(user){

      loading(
        "Loading your player...",
        25
      );

      await loadPlayer();

    }


    loading(
      "Requesting your location...",
      45
    );


    requestLocation();


  }catch(error){

    console.error(error);

    loading(
      "Starting without account...",
      100
    );

    requestLocation();

  }

}


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

  if(!user){
    return;
  }


  const {
    data,
    error
  } =
    await supabase
      .from("players")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();


  if(error){

    console.error(
      "Player error:",
      error
    );

    return;

  }


  player = data;


  updateCoinDisplay();

}


/* =========================================================
   LOCATION REQUEST
========================================================= */

function requestLocation(){

  if(!navigator.geolocation){

    setStatus(
      "❌ Your browser doesn't support GPS."
    );

    loading(
      "GPS unavailable",
      100
    );

    return;

  }


  /*
     THIS directly triggers the browser
     location permission.
  */

  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      loading(
        "Location found!",
        65
      );


      startMap(
        lat,
        lon
      );


      /*
         Now start continuous GPS.
      */

      gpsWatch =
        navigator.geolocation.watchPosition(

          updateGPS,

          gpsError,

          {
            enableHighAccuracy:true,
            maximumAge:2000,
            timeout:15000
          }

        );

    },

    error => {

      console.error(
        "Location permission:",
        error
      );


      if(error.code === 1){

        setStatus(
          "📍 Location permission was denied. Enable Location for this site in your browser settings."
        );

      }else{

        setStatus(
          "📍 Couldn't get your location. Try again."
        );

      }


      loading(
        "Location unavailable",
        100
      );

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }

  );

}


/* =========================================================
   GPS UPDATE
========================================================= */

function updateGPS(position){

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;


  if(playerMarker){

    playerMarker.setLatLng([
      lat,
      lon
    ]);

  }


  collectNearbyCoins(
    lat,
    lon
  );


  if(
    currentLat !== null &&
    currentLon !== null
  ){

    const moved =
      distanceMeters(
        currentLat,
        currentLon,
        lat,
        lon
      );


    if(
      moved >=
      REFRESH_DISTANCE
    ){

      currentLat = lat;

      currentLon = lon;

      loadTrail(
        lat,
        lon
      );

    }

  }

}


/* =========================================================
   GPS ERROR
========================================================= */

function gpsError(error){

  console.log(
    "GPS error",
    error
  );

  if(error.code === 1){

    setStatus(
      "📍 Location permission denied."
    );

  }else{

    setStatus(
      "📍 GPS signal unavailable. Trying again..."
    );

  }

}


/* =========================================================
   MAP
========================================================= */

function startMap(lat,lon){

  if(map){
    return;
  }


  map =
    L.map("map",{
      zoomControl:true
    })
    .setView(
      [lat,lon],
      17
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);


  currentLat = lat;

  currentLon = lon;


  createPlayerMarker(
    lat,
    lon
  );


  setStatus(
    "🗺️ Finding the nearest road..."
  );


  loadTrail(
    lat,
    lon
  );

}


/* =========================================================
   PLAYER MARKER
========================================================= */

function createPlayerMarker(lat,lon){

  const color =
    SKINS[
      player?.equipped_skin || "blue"
    ]?.color ||
    "#00aaff";


  const icon =
    L.divIcon({

      className:"",

      html:
        `<div class="player playerPulse"
          style="--player-color:${color}">
        </div>`,

      iconSize:[28,28],

      iconAnchor:[14,14]

    });


  playerMarker =
    L.marker(
      [lat,lon],
      {icon}
    )
    .addTo(map);

}


/* =========================================================
   TRAIL
========================================================= */

async function loadTrail(lat,lon){

  if(
    loadingTrail ||
    !map
  ){
    return;
  }


  loadingTrail = true;


  setStatus(
    "🗺️ Searching nearby roads..."
  );


  /*
     Remove only currently generated
     uncollected coins.
  */

  removeUncollectedCoins();


  try{

    const ways =
      await getNearbyWays(
        lat,
        lon
      );


    if(!ways.length){

      setStatus(
        "😕 No mapped paths found nearby."
      );

      loadingTrail = false;

      return;

    }


    /*
       Find closest POINT on the road
       network, not just closest road.
    */

    const nearest =
      findClosestPoint(
        ways,
        lat,
        lon
      );


    if(!nearest){

      setStatus(
        "😕 Couldn't find a nearby road."
      );

      loadingTrail = false;

      return;

    }


    const distance =
      nearest.distance;


    if(distance > 300){

      setStatus(
        "🚶 Nearest mapped path is " +
        Math.round(distance) +
        "m away."
      );

      loadingTrail = false;

      return;

    }


    /*
       Create the main route.

       IMPORTANT:
       This walks through the actual
       OSM geometry, putting coins
       every ~45 meters.
    */

    const main =
      buildRoute(
        ways,
        nearest,
        MAIN_COINS
      );


    /*
       FIRST COIN IS THE NEAREST ROAD
       POINT.
    */

    createCoin(
      nearest.point.lat,
      nearest.point.lon
    );


    for(const point of main){

      createCoin(
        point.lat,
        point.lon
      );

    }


    /*
       Add branches/intersections.
    */

    const branches =
      findBranches(
        ways,
        main,
        nearest
      );


    for(
      const branch of branches
    ){

      for(
        const point of branch
      ){

        createCoin(
          point.lat,
          point.lon
        );

      }

    }


    setStatus(
      "🎮 " +
      coins.length +
      " coins found along nearby paths!"
    );


    loading(
      "Trail ready!",
      100
    );


    setTimeout(()=>{

      loadingScreen.classList.add(
        "hidden"
      );

    },400);


  }catch(error){

    console.error(
      "Trail error:",
      error
    );

    setStatus(
      "⚠️ Couldn't load nearby roads."
    );

  }


  loadingTrail = false;

}


/* =========================================================
   OVERPASS
========================================================= */

async function getNearbyWays(lat,lon){

  const latOffset =
    SEARCH_RADIUS / 111320;

  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat*Math.PI/180
      )
    );


  const south =
    lat-latOffset;

  const north =
    lat+latOffset;

  const west =
    lon-lonOffset;

  const east =
    lon+lonOffset;


  const query = `

[out:json][timeout:25];

way["highway"]
(${south},${west},${north},${east});

out tags geom;

`;


  for(
    const server of
    OVERPASS_SERVERS
  ){

    try{

      const response =
        await fetch(
          server,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data="+
              encodeURIComponent(query)
          }
        );


      if(!response.ok){
        throw new Error(
          "HTTP "+response.status
        );
      }


      const data =
        await response.json();


      return filterWays(
        data.elements || []
      );


    }catch(error){

      console.log(
        "Overpass failed",
        server,
        error
      );

    }

  }


  return [];

}


/* =========================================================
   FILTER ROADS
========================================================= */

function filterWays(elements){

  const allowedPublic = [

    "footway",
    "path",
    "pedestrian",
    "steps",
    "cycleway",
    "bridleway",
    "living_street",
    "residential",
    "unclassified",
    "service"

  ];


  const allowedUnlimited = [

    "footway",
    "path",
    "pedestrian",
    "steps",
    "cycleway",
    "bridleway",
    "living_street",
    "residential",
    "unclassified",
    "service",
    "tertiary",
    "tertiary_link",
    "secondary",
    "secondary_link"

  ];


  const result = [];


  for(
    const element of
    elements
  ){

    if(
      element.type !== "way" ||
      !element.geometry ||
      element.geometry.length < 2
    ){
      continue;
    }


    const tags =
      element.tags || {};


    const highway =
      tags.highway;


    if(!highway){
      continue;
    }


    const access =
      String(
        tags.access || ""
      ).toLowerCase();


    /*
       Never put the player on obviously
       dangerous/private roads.
    */

    if(
      access === "private" ||
      access === "no" ||
      access === "permit" ||
      access === "customers"
    ){
      continue;
    }


    const allowed =
      gameMode === "PUBLIC"
        ? allowedPublic
        : allowedUnlimited;


    if(
      !allowed.includes(highway)
    ){
      continue;
    }


    result.push({
      id:element.id,
      geometry:element.geometry,
      tags
    });

  }


  return result;

}


/* =========================================================
   CLOSEST POINT
========================================================= */

function findClosestPoint(
  ways,
  lat,
  lon
){

  let best = null;


  for(
    const way of ways
  ){

    for(
      let i=0;
      i<way.geometry.length;
      i++
    ){

      const point =
        way.geometry[i];


      const distance =
        distanceMeters(
          lat,
          lon,
          point.lat,
          point.lon
        );


      if(
        !best ||
        distance < best.distance
      ){

        best = {

          way:way,

          index:i,

          point:point,

          distance:distance

        };

      }

    }

  }


  return best;

}


/* =========================================================
   ROUTE BUILDER
========================================================= */

function buildRoute(
  ways,
  start,
  maxCoins
){

  const route = [];


  let way =
    start.way;

  let index =
    start.index;


  let direction =
    index <
    way.geometry.length-1
      ? 1
      : -1;


  let accumulated = 0;


  let last =
    way.geometry[index];


  const visited =
    new Set();


  /*
     Continue until we have enough
     coins OR the road network ends.
  */

  while(
    route.length <
    maxCoins
  ){

    const key =
      way.id+
      ":"+
      index+
      ":"+
      direction;


    if(visited.has(key)){
      break;
    }


    visited.add(key);


    const nextIndex =
      index+
      direction;


    /*
       End of current road.
       Try to jump to a connected
       road.
    */

    if(
      nextIndex < 0 ||
      nextIndex >=
      way.geometry.length
    ){

      const endpoint =
        way.geometry[
          direction === 1
            ? way.geometry.length-1
            : 0
        ];


      const connected =
        findConnectedWay(
          ways,
          endpoint,
          way.id
        );


      if(!connected){
        break;
      }


      way =
        connected.way;

      index =
        connected.index;

      direction =
        connected.direction;

      last =
        way.geometry[index];

      continue;

    }


    const point =
      way.geometry[nextIndex];


    const segment =
      distanceMeters(
        last.lat,
        last.lon,
        point.lat,
        point.lon
      );


    accumulated +=
      segment;


    /*
       Put a coin roughly every
       COIN_SPACING meters.
    */

    if(
      accumulated >=
      COIN_SPACING
    ){

      route.push({

        lat:point.lat,

        lon:point.lon

      });


      accumulated = 0;

    }


    last = point;

    index = nextIndex;

  }


  return route;

}


/* =========================================================
   CONNECTED ROAD
========================================================= */

function findConnectedWay(
  ways,
  endpoint,
  currentId
){

  let best = null;

  let bestDistance = 35;


  for(
    const way of ways
  ){

    if(
      way.id === currentId
    ){
      continue;
    }


    const first =
      way.geometry[0];

    const last =
      way.geometry[
        way.geometry.length-1
      ];


    const d1 =
      distanceMeters(
        endpoint.lat,
        endpoint.lon,
        first.lat,
        first.lon
      );


    const d2 =
      distanceMeters(
        endpoint.lat,
        endpoint.lon,
        last.lat,
        last.lon
      );


    if(d1 < bestDistance){

      best = {

        way:way,

        index:0,

        direction:1

      };

      bestDistance=d1;

    }


    if(d2 < bestDistance){

      best = {

        way:way,

        index:
          way.geometry.length-1,

        direction:-1

      };

      bestDistance=d2;

    }

  }


  return best;

}


/* =========================================================
   BRANCHES
========================================================= */

function findBranches(
  ways,
  mainRoute,
  start
){

  const result = [];

  let count = 0;


  /*
     Only check a handful of route points
     to keep the map from becoming insane.
  */

  for(
    let r=0;
    r<mainRoute.length &&
    count<3;
    r+=4
  ){

    const routePoint =
      mainRoute[r];


    for(
      const way of ways
    ){

      if(
        way.id === start.way.id
      ){
        continue;
      }


      const first =
        way.geometry[0];

      const last =
        way.geometry[
          way.geometry.length-1
        ];


      const d1 =
        distanceMeters(
          routePoint.lat,
          routePoint.lon,
          first.lat,
          first.lon
        );


      const d2 =
        distanceMeters(
          routePoint.lat,
          routePoint.lon,
          last.lat,
          last.lon
        );


      if(d1 <= 25){

        result.push(
          buildBranch(
            way,
            0,
            1
          )
        );

        count++;

        break;

      }


      if(d2 <= 25){

        result.push(
          buildBranch(
            way,
            way.geometry.length-1,
            -1
          )
        );

        count++;

        break;

      }

    }

  }


  return result;

}


/* =========================================================
   BUILD BRANCH
========================================================= */

function buildBranch(
  way,
  startIndex,
  direction
){

  const result = [];

  let accumulated = 0;


  let last =
    way.geometry[startIndex];


  for(
    let step=1;
    step<way.geometry.length;
    step++
  ){

    const index =
      startIndex+
      step*direction;


    if(
      index<0 ||
      index>=way.geometry.length
    ){
      break;
    }


    const point =
      way.geometry[index];


    accumulated +=
      distanceMeters(
        last.lat,
        last.lon,
        point.lat,
        point.lon
      );


    if(
      accumulated >=
      COIN_SPACING
    ){

      result.push({

        lat:point.lat,

        lon:point.lon

      });


      accumulated=0;


      if(
        result.length>=
        BRANCH_COINS
      ){
        break;
      }

    }


    last=point;

  }


  return result;

}


/* =========================================================
   CREATE COIN
========================================================= */

function createCoin(
  lat,
  lon
){

  if(!map){
    return;
  }


  const id =
    makeCoinId(
      lat,
      lon
    );


  /*
     Don't generate a coin we've
     permanently collected.
  */

  if(
    player &&
    Array.isArray(
      player.collected_coins
    ) &&
    player.collected_coins.includes(id)
  ){
    return;
  }


  /*
     Don't stack coins.
  */

  for(
    const existing of coins
  ){

    if(
      distanceMeters(
        lat,
        lon,
        existing.lat,
        existing.lon
      ) < 20
    ){
      return;
    }

  }


  const icon =
    L.divIcon({

      className:"",

      html:
        `<div class="coin">🪙</div>`,

      iconSize:[34,34],

      iconAnchor:[17,17]

    });


  const marker =
    L.marker(
      [lat,lon],
      {icon}
    )
    .addTo(map);


  coins.push({

    id:id,

    marker:marker,

    lat:lat,

    lon:lon,

    collected:false

  });

}


/* =========================================================
   COIN ID
========================================================= */

function makeCoinId(
  lat,
  lon
){

  return (
    Math.round(lat*100000)+
    "_"+
    Math.round(lon*100000)
  );

}


/* =========================================================
   REMOVE UNCOLLECTED
========================================================= */

function removeUncollectedCoins(){

  if(!map){
    return;
  }


  const remaining=[];


  for(
    const coin of coins
  ){

    if(
      coin.collected
    ){

      remaining.push(coin);

    }else{

      if(
        map.hasLayer(
          coin.marker
        )
      ){

        map.removeLayer(
          coin.marker
        );

      }

    }

  }


  coins=remaining;

}


/* =========================================================
   COLLECTION
========================================================= */

function collectNearbyCoins(
  lat,
  lon
){

  for(
    const coin of coins
  ){

    if(
      coin.collected
    ){
      continue;
    }


    const distance =
      distanceMeters(
        lat,
        lon,
        coin.lat,
        coin.lon
      );


    if(
      distance <=
      COLLECTION_DISTANCE
    ){

      collectCoin(
        coin
      );

    }

  }

}


/* =========================================================
   COLLECT
========================================================= */

async function collectCoin(
  coin
){

  if(
    coin.collected
  ){
    return;
  }


  coin.collected=true;


  if(
    map &&
    map.hasLayer(
      coin.marker
    )
  ){

    map.removeLayer(
      coin.marker
    );

  }


  /*
     If the user isn't logged in,
     show the collection but don't
     save it.
  */

  if(!player){

    showToast(
      "🪙 +10"
    );

    return;

  }


  if(
    !Array.isArray(
      player.collected_coins
    )
  ){

    player.collected_coins=[];

  }


  if(
    !player.collected_coins.includes(
      coin.id
    )
  ){

    player.collected_coins.push(
      coin.id
    );

  }


  player.coins =
    (player.coins || 0)+10;


  player.xp =
    (player.xp || 0)+10;


  checkLevel();

  updateCoinDisplay();


  showToast(
    "🪙 COIN COLLECTED! +10"
  );


  setStatus(
    "🎮 Keep exploring!"
  );


  await savePlayer();

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

  if(!player){
    return;
  }


  const required =
    (player.level || 1)*100;


  if(
    player.xp >= required
  ){

    player.xp -= required;

    player.level =
      (player.level || 1)+1;


    showToast(
      "🎉 LEVEL "+
      player.level+
      "!"
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

async function savePlayer(){

  if(!player || !user){
    return;
  }


  const {
    error
  } =
    await supabase
      .from("players")
      .update({

        coins:
          player.coins,

        xp:
          player.xp,

        level:
          player.level,

        unlocked_skins:
          player.unlocked_skins,

        equipped_skin:
          player.equipped_skin,

        collected_coins:
          player.collected_coins,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        user.id
      );


  if(error){

    console.error(
      "Save error",
      error
    );

  }

}


/* =========================================================
   DISPLAY
========================================================= */

function updateCoinDisplay(){

  coinsDisplay.innerText =
    "🪙 Coins: "+
    (player?.coins || 0);

}


/* =========================================================
   SHOP
========================================================= */

document
  .getElementById("shopButton")
  .onclick=()=>{

    document
      .getElementById("shopOverlay")
      .style.display="block";

    renderShop();

  };


document
  .getElementById("closeShop")
  .onclick=()=>{

    document
      .getElementById("shopOverlay")
      .style.display="none";

  };


function renderShop(){

  const items =
    document.getElementById(
      "shopItems"
    );

  const balance =
    document.getElementById(
      "shopBalance"
    );


  balance.innerText =
    "🪙 Coins: "+
    (player?.coins || 0);


  items.innerHTML="";


  for(
    const [id,skin]
    of Object.entries(SKINS)
  ){

    const unlocked =
      player?.unlocked_skins?.includes(id);


    const equipped =
      player?.equipped_skin === id;


    const item =
      document.createElement("div");

    item.className="shopItem";


    const preview =
      document.createElement("div");

    preview.className="skinPreview";

    preview.style.background =
      skin.color;


    const info =
      document.createElement("div");

    info.className="skinInfo";

    info.innerHTML =
      `<div class="skinName">
        ${skin.name}
      </div>
      <div class="skinPrice">
        ${
          skin.price===0
            ? "FREE"
            : "🪙 "+skin.price
        }
      </div>`;


    const button =
      document.createElement("button");

    button.className="shopAction";


    if(equipped){

      button.innerText="EQUIPPED";

      button.disabled=true;

    }else if(unlocked){

      button.innerText="EQUIP";

      button.onclick=()=>equipSkin(id);

    }else if(
      (player?.coins || 0)>=skin.price
    ){

      button.innerText="BUY";

      button.onclick=()=>buySkin(id);

    }else{

      button.innerText="NEED COINS";

      button.disabled=true;

    }


    item.append(
      preview,
      info,
      button
    );


    items.appendChild(item);

  }

}


/* =========================================================
   BUY
========================================================= */

async function buySkin(id){

  if(!player){
    showToast("Login required.");
    return;
  }


  const skin =
    SKINS[id];


  if(
    !skin ||
    player.unlocked_skins.includes(id) ||
    player.coins < skin.price
  ){
    return;
  }


  player.coins -=
    skin.price;


  player.unlocked_skins.push(id);

  player.equipped_skin=id;


  await savePlayer();

  updateCoinDisplay();

  renderShop();


  showToast(
    "🎨 "+
    skin.name+
    " unlocked!"
  );

}


/* =========================================================
   EQUIP
========================================================= */

async function equipSkin(id){

  if(!player){
    return;
  }


  if(
    !player.unlocked_skins.includes(id)
  ){
    return;
  }


  player.equipped_skin=id;


  await savePlayer();


  if(playerMarker){

    createPlayerMarker(
      currentLat,
      currentLon
    );

  }


  renderShop();


  showToast(
    "🎨 "+
    SKINS[id].name+
    " equipped!"
  );

}

   ACCOUNT
========================================================= */

document
  .getElementById("accountButton")
  .onclick=()=>{

    document
      .getElementById("accountOverlay")
      .style.display="block";


    document
      .getElementById("accountEmail")
      .innerText =
        user?.email ||
        "Not signed in";

  };


document
  .getElementById("closeAccount")
  .onclick=()=>{

    document
      .getElementById("accountOverlay")
      .style.display="none";

  };


document
  .getElementById("signOutButton")
  .onclick=async()=>{

    await supabase.auth.signOut();

    location.reload();

  };

   AUTH
========================================================= */

supabase.auth.onAuthStateChange(
  (event,session)=>{

    console.log(
      "Auth:",
      event
    );


    if(
      event === "SIGNED_OUT"
    ){

      user=null;

      player=null;

      updateCoinDisplay();

    }

);
