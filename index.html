/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2)**2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

  authStatus.textContent =
    "Checking account...";

  try{

    const {
      data,
      error
    } =
      await supabase.auth.getSession();

    if(error)
      console.error(error);

    if(data.session){

      currentUser =
        data.session.user;

      await afterLogin();

      return;

    }

  }catch(error){

    console.error(error);

  }

  authScreen.style.display =
    "flex";

  authStatus.textContent =
    "Sign in or create your account.";

}


/* =========================================================
   SIGN IN
========================================================= */

document
.getElementById("signInButton")
.addEventListener(
  "click",
  signIn
);

async function signIn(){

  const email =
    document
      .getElementById("emailInput")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("passwordInput")
      .value;

  const button =
    document.getElementById(
      "signInButton"
    );

  if(!email){

    authStatus.textContent =
      "Enter your email.";

    return;

  }

  if(!password){

    authStatus.textContent =
      "Enter your password.";

    return;

  }

  button.disabled = true;

  button.textContent =
    "SIGNING IN...";

  authStatus.textContent =
    "Signing in...";

  try{

    const {
      data,
      error
    } =
      await supabase.auth.signInWithPassword({

        email,

        password

      });

    if(error){

      console.error(
        "Sign in:",
        error
      );

      authStatus.textContent =
        "❌ " + error.message;

      button.disabled = false;

      button.textContent =
        "SIGN IN";

      return;

    }

    if(!data.session){

      authStatus.textContent =
        "❌ No login session created.";

      button.disabled = false;

      button.textContent =
        "SIGN IN";

      return;

    }

    currentUser =
      data.user;

    authStatus.textContent =
      "✅ Signed in!";

    await afterLogin();

  }catch(error){

    console.error(error);

    authStatus.textContent =
      "❌ " + error.message;

    button.disabled = false;

    button.textContent =
      "SIGN IN";

  }

}


/* =========================================================
   CREATE ACCOUNT
========================================================= */

document
.getElementById("createAccountButton")
.addEventListener(

  createAccount
);

async function createAccount(){

  const email =
    document
      .getElementById("emailInput")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("passwordInput")
      .value;

  const button =
    document.getElementById(
      "createAccountButton"
    );

  if(!email){

    authStatus.textContent =
      "Enter your email.";

    return;

  }

  if(password.length < 6){

    authStatus.textContent =
      "Password must be at least 6 characters.";

    return;

  }

  button.disabled = true;

  button.textContent =
    "CREATING...";

  authStatus.textContent =
    "Creating account...";

  try{

    const {
      data,
      error
    } =
      await supabase.auth.signUp({

        email,

        password

      });

    if(error){

      console.error(error);

      authStatus.textContent =
        "❌ " + error.message;

      button.disabled = false;

      button.textContent =
        "CREATE ACCOUNT";

      return;

    }

    /*
     * With Confirm Email OFF,
     * Supabase should return a session.
     */

    if(data.session){

      currentUser =
        data.user;

      authStatus.textContent =
        "✅ Account created!";

      await afterLogin();

      return;

    }

    authStatus.textContent =
      "⚠️ Account created. If Supabase still has email confirmation enabled, turn it off in Authentication → Providers → Email.";

    button.disabled = false;

    button.textContent =
      "CREATE ACCOUNT";

  }catch(error){

    console.error(error);

    authStatus.textContent =
      "❌ " + error.message;

    button.disabled = false;

    button.textContent =
      "CREATE ACCOUNT";

  }

}

/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

  if(!currentUser)
    return;

  let {
    data,
    error
  } =
    await supabase
      .from("players")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error)
    throw error;

  if(!data){

    const newPlayer = {

      id:currentUser.id,

      username:
        currentUser.email
          ?.split("@")[0] ||
        "Player",

      coins:0,

      xp:0,

      level:1,

      unlocked_skins:["blue"],

      equipped_skin:"blue",

      collected_coins:[]

    };

    const result =
      await supabase
        .from("players")
        .insert(newPlayer)
        .select()
        .single();

    if(result.error)
      throw result.error;

    data =
      result.data;

  }

  data.coins =
    Number(data.coins || 0);

  data.xp =
    Number(data.xp || 0);

  data.level =
    Number(data.level || 1);

  data.unlocked_skins =
    Array.isArray(
      data.unlocked_skins
    )
      ? data.unlocked_skins
      : ["blue"];

  data.collected_coins =
    Array.isArray(
      data.collected_coins
    )
      ? data.collected_coins
      : [];

  data.equipped_skin =
    data.equipped_skin ||
    "blue";

  playerData =
    data;

  updateCoinDisplay();

}

  const {
    error

    await supabase
      .from("players")
      .update({

        coins:

        xp:

        level:

        unlocked_skins:

        equipped_skin:

        collected_coins:
          playerData.collected_coins,

        updated_at:

      })

        "id",
        playerData.id
      );

  if(error){

    console.error(
      "Save error:",
      error

  }

}

    "Starting map...",
    15
  );

  initializeMap();

  setLoading(
    "Requesting GPS...",
    30
  );

  startGPS();

  startMusic();

}


/* =========================================================
   MAP
========================================================= */

function initializeMap(){

  if(map)
    return;

  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    ).setView(
      [42.96,-85.67],
      15
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);

}


/* =========================================================
   GPS
========================================================= */

function startGPS(){

  if(!navigator.geolocation){

    setStatus(
      "❌ GPS is not supported."
    );

    loadingScreen.style.display =
      "none";

    return;

  }

  watchId =
    navigator.geolocation.watchPosition(

      onLocation,

      onLocationError,

      {
        enableHighAccuracy:true,

        maximumAge:2000,

        timeout:15000

      }

    );

}


function onLocation(position){

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy || 30;

  setLoading(
    "Location found!",
    60
  );

  if(!playerMarker){

    createPlayer(
      lat,
      lon
    );

    map.setView(
      [lat,lon],
      17
    );

    loadingScreen.style.display =
      "none";

    setStatus(
      "🗺️ Finding your nearest connected road..."
    );

    loadRoadNetwork(
      lat,
      lon
    );

  }else{

    playerMarker.setLatLng(
      [lat,lon]
    );

    if(accuracyCircle){

      accuracyCircle
        .setLatLng([lat,lon])
        .setRadius(
          accuracy
        );

    }

  }

  collectNearbyCoins(
    lat,
    lon
  );

  /*
   * If the player has collected everything,
   * immediately try to create more coins.
   */

  if(
    coins.filter(
      c=>!c.collected
    ).length === 0
  ){

    loadRoadNetwork(
      lat,
      lon
    );

  }

  if(
    lastRoadLat !== null &&
    lastRoadLon !== null
  ){

    const moved =
      distanceMeters(
        lastRoadLat,
        lastRoadLon,
        lat,
        lon
      );

    if(
      moved >=
      ROAD_REFRESH_DISTANCE
    ){

      loadRoadNetwork(
        lat,
        lon
      );

    }

  }

}


function onLocationError(error){

  console.error(
    "GPS:",
    error
  );

  loadingScreen.style.display =
    "none";

  if(error.code === 1){

    setStatus(
      "📍 Location denied. Enable Location for this site."
    );

  }else{

    setStatus(
      "📍 Waiting for GPS..."
    );

  }

}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(lat,lon){

  const skin =
    SKINS[
      playerData?.equipped_skin
    ] ||
    SKINS.blue;

  playerMarker =
    L.marker(
      [lat,lon],
      {

        icon:
          L.divIcon({

            className:"",

            html:
              `<div class="player"
                style="--player-color:${skin.color}">
              </div>`,

            iconSize:[28,28],

            iconAnchor:[14,14]

          }),

        zIndexOffset:1000

      }
    ).addTo(map);

  accuracyCircle =
    L.circle(
      [lat,lon],
      {

        radius:30,

        color:"#008ee6",

        weight:1,

        fillOpacity:.08

      }
    ).addTo(map);

}


/* =========================================================
   ROAD NETWORK
========================================================= */

async function loadRoadNetwork(
  lat,
  lon
){

  if(loadingRoads)
    return;

  loadingRoads = true;

  lastRoadLat =
    lat;

  lastRoadLon =
    lon;

  setStatus(
    "🗺️ Searching nearby roads..."
  );

  try{

    const ways =
      await getNearbyWays(
        lat,
        lon
      );

    if(!ways.length){

      setStatus(
        "🔎 No roads found. Retrying..."
      );

      loadingRoads = false;

      if(roadRetryTimer)
        clearTimeout(
          roadRetryTimer
        );

      roadRetryTimer =
        setTimeout(
          ()=>{
            loadRoadNetwork(
              lat,
              lon
            );
          },
          4000
        );

      return;

    }

    const nearest =
      findNearestRoadPoint(
        ways,
        lat,
        lon
      );

    if(!nearest){

      loadingRoads = false;

      return;

    }

    const roadDistance =
      Math.round(
        nearest.distance
      );

    /*
     * Don't require the player to physically
     * touch the road.
     */

    if(
      roadDistance > 350
    ){

      setStatus(
        `🛣️ Nearest mapped road: ${roadDistance}m`
      );

      loadingRoads = false;

      return;

    }

    const network =
      buildConnectedNetwork(
        ways,
        nearest.way
      );

    drawRoadNetwork(
      network
    );

    generateNetworkCoins(
      network,
      nearest
    );

    setStatus(
      `🛣️ Road ${roadDistance}m away • ${network.length} connected sections • ${coins.filter(c=>!c.collected).length} coins`
    );

  }catch(error){

    console.error(
      "Road error:",
      error
    );

    setStatus(
      "⚠️ Road server busy. Retrying..."
    );

  }

  loadingRoads = false;

}


/* =========================================================
   OVERPASS
========================================================= */

async function getNearbyWays(
  lat,
  lon
){

  const latDelta =
    SEARCH_RADIUS / 111320;

  const lonDelta =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat *
        Math.PI /
        180
      )
    );

  const south =
    lat-latDelta;

  const north =
    lat+latDelta;

  const west =
    lon-lonDelta;

  const east =
    lon+lonDelta;

  let filter = `
    way["highway"]
    (${south},${west},${north},${east});
  `;

  if(
    gameMode === "PUBLIC"
  ){

    filter = `
      way["highway"]
      ["access"!="private"]
      ["access"!="no"]
      ["access"!="customers"]
      ["access"!="permit"]
      (${south},${west},${north},${east});
    `;

  }

  const query = `

    [out:json][timeout:20];

    ${filter}

    out tags geom;

  `;

  for(
    const server
    of OVERPASS_SERVERS
  ){

    try{

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          ()=>{
            controller.abort();
          },
          14000
        );

      const response =
        await fetch(
          server,
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(
                query
              ),

            signal:
              controller.signal

          }
        );

      clearTimeout(timeout);

      if(!response.ok)
        continue;

      const json =
        await response.json();

      const ways =
        filterWays(
          json.elements || []
        );

      if(ways.length)
        return ways;

    }catch(error){

      console.log(
        "Overpass failed:",
        server
      );

    }

  }

  return [];

}


/* =========================================================
   FILTER ROADS
========================================================= */

function filterWays(elements){

  const publicRoads = [

    "footway",
    "path",
    "pedestrian",
    "steps",
    "cycleway",
    "bridleway",
    "living_street",
    "residential",
    "unclassified",
    "service",
    "tertiary",
    "tertiary_link",
    "secondary",
    "secondary_link",
    "primary",
    "primary_link"

  ];

  const result = [];

  for(
    const e of elements
  ){

    if(
      e.type !== "way" ||
      !e.geometry ||
      e.geometry.length < 2
    )
      continue;

    const tags =
      e.tags || {};

    const highway =
      tags.highway;

    if(!highway)
      continue;

    if(
      gameMode === "PUBLIC" &&
      !publicRoads.includes(
        highway
      )
    )
      continue;

    if(
      gameMode === "UNLIMITED"
    ){

      const forbidden = [

        "motorway",
        "motorway_link",
        "trunk",
        "trunk_link"

      ];

      if(
        forbidden.includes(
          highway
        )
      )
        continue;

    }

    result.push({

      id:e.id,

      geometry:
        e.geometry.map(
          p=>({
            lat:Number(p.lat),
            lon:Number(p.lon)
          })
        ),

      tags

    });

  }

  return result;

}


/* =========================================================
   NEAREST ROAD POINT
========================================================= */

function findNearestRoadPoint(
  ways,
  lat,
  lon
){

  let best = null;

  for(
    const way of ways
  ){

    for(
      let i=0;
      i<way.geometry.length-1;
      i++
    ){

      const a =
        way.geometry[i];

      const b =
        way.geometry[i+1];

      const point =
        closestPointOnSegment(
          lat,
          lon,
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );

      const d =
        distanceMeters(
          lat,
          lon,
          point.lat,
          point.lon
        );

      if(
        !best ||
        d < best.distance
      ){

        best = {

          way,

          segmentIndex:i,

          point,

          distance:d

        };

      }

    }

  }

  return best;

}


function closestPointOnSegment(
  lat,
  lon,
  lat1,
  lon1,
  lat2,
  lon2
){

  const cos =
    Math.cos(
      lat *
      Math.PI /
      180
    );

  const x =
    (lon-lon1) *
    111320 *
    cos;

  const y =
    (lat-lat1) *
    111320;

  const dx =
    (lon2-lon1) *
    111320 *
    cos;

  const dy =
    (lat2-lat1) *
    111320;

  const len2 =
    dx*dx +
    dy*dy;

  let t =
    len2 === 0
      ? 0
      : (x*dx+y*dy)/len2;

  t =
    Math.max(
      0,
      Math.min(1,t)
    );

  return {

    lat:
      lat1 +
      (lat2-lat1)*t,

    lon:
      lon1 +
      (lon2-lon1)*t

  };

}


/* =========================================================
   CONNECTED ROADS
========================================================= */

function buildConnectedNetwork(
  ways,
  startingWay
){

  const network = [];

  const visited =
    new Set();

  const queue =
    [startingWay];

  while(queue.length){

    const way =
      queue.shift();

    if(
      visited.has(
        way.id
      )
    )
      continue;

    visited.add(
      way.id
    );

    network.push(
      way
    );

    for(
      const other
      of ways
    ){

      if(
        visited.has(
          other.id
        )
      )
        continue;

      if(
        waysConnected(
          way,
          other
        )
      ){

        queue.push(
          other
        );

      }

    }

  }

  return network;

}


function waysConnected(
  a,
  b
){

  const a1 =
    a.geometry[0];

  const a2 =
    a.geometry[
      a.geometry.length-1
    ];

  const b1 =
    b.geometry[0];

  const b2 =
    b.geometry[
      b.geometry.length-1
    ];

  const limit = 30;

  return (

    distanceMeters(
      a1.lat,a1.lon,
      b1.lat,b1.lon
    ) <= limit ||

    distanceMeters(
      a1.lat,a1.lon,
      b2.lat,b2.lon
    ) <= limit ||

    distanceMeters(
      a2.lat,a2.lon,
      b1.lat,b1.lon
    ) <= limit ||

    distanceMeters(
      a2.lat,a2.lon,
      b2.lat,b2.lon
    ) <= limit

  );

}


/* =========================================================
   DRAW ROADS
========================================================= */

function drawRoadNetwork(
  network
){

  /*
   * Remove old road lines.
   */

  for(
    const line of roadLines
  ){

    if(
      map.hasLayer(line)
    ){

      map.removeLayer(
        line
      );

    }

  }

  roadLines = [];

  /*
   * Draw the connected network.
   */

  for(
    const way of network
  ){

    const points =
      way.geometry.map(
        p=>[
          p.lat,
          p.lon
        ]
      );

    const line =
      L.polyline(
        points,
        {
          color:"#00aaff",
          weight:4,
          opacity:.35
        }
      ).addTo(map);

    roadLines.push(
      line
    );

  }

}


/* =========================================================
   COINS
========================================================= */

function coinId(
  lat,
  lon
){

  return (
    Math.round(lat*100000)
    +
    "_" +
    Math.round(lon*100000)
  );

}


function addCoin(
  lat,
  lon
){

  if(
    !map ||
    !playerData
  )
    return false;

  const id =
    coinId(
      lat,
      lon
    );

  if(
    playerData
      .collected_coins
      .includes(id)
  )
    return false;

  for(
    const c of coins
  ){

    if(
      !c.collected &&
      distanceMeters(
        lat,
        lon,
        c.lat,
        c.lon
      ) < 35
    )
      return false;

  }

  const marker =
    L.marker(
      [lat,lon],
      {

        icon:
          L.divIcon({

            className:"",

            html:
              `<div class="coin">🪙</div>`,

            iconSize:[34,34],

            iconAnchor:[17,17]

          })

      }
    ).addTo(map);

  coins.push({

    id,

    lat,

    lon,

    marker,

    collected:false

  });

  return true;

}


/* =========================================================
   GENERATE COINS
========================================================= */

function generateNetworkCoins(
  network,
  nearest
){

  /*
   * Keep collected coins out.
   * Remove old uncollected coins before
   * rebuilding the nearby network.
   */

  removeUncollectedCoins();

  let generated = 0;

  /*
   * Put the nearest road first.
   */

  const ordered =
    network.slice().sort(
      (a,b)=>{

        return (
          distanceToWay(
            nearest.point,
            a
          )
          -
          distanceToWay(
            nearest.point,
            b
          )
        );

      }
    );

  /*
   * Generate from every connected section,
   * not just one road.
   */

  for(
    const way of ordered
  ){

    if(
      generated >= MAX_COINS
    )
      break;

    const points =
      pointsAlongWay(
        way,
        nearest.point
      );

    for(
      const p of points
    ){

      if(
        generated >= MAX_COINS
      )
        break;

      if(
        addCoin(
          p.lat,
          p.lon
        )
      ){

        generated++;

      }

    }

  }

  /*
   * If the network produced too few coins,
   * create a second pass using a smaller
   * spacing. This prevents empty areas.
   */

  if(
    coins.filter(
      c=>!c.collected
    ).length < 5
  ){

    for(
      const way of ordered
    ){

      if(
        coins.filter(
          c=>!c.collected
        ).length >= MAX_COINS
      )
        break;

      const points =
        pointsAlongWay(
          way,
          null,
          30
        );

      for(
        const p of points
      ){

        if(
          coins.filter(
            c=>!c.collected
          ).length >= MAX_COINS
        )
          break;

        addCoin(
          p.lat,
          p.lon
        );

      }

    }

  }

}


/* =========================================================
   POINTS ALONG ROADS
========================================================= */

function pointsAlongWay(
  way,
  startingPoint,
  spacing=COIN_SPACING
){

  const result = [];

  const geometry =
    way.geometry.slice();

  if(
    startingPoint &&
    geometry.length > 1
  ){

    const first =
      geometry[0];

    const last =
      geometry[
        geometry.length-1
      ];

    const dFirst =
      distanceMeters(
        startingPoint.lat,
        startingPoint.lon,
        first.lat,
        first.lon
      );

    const dLast =
      distanceMeters(
        startingPoint.lat,
        startingPoint.lon,
        last.lat,
        last.lon
      );

    if(
      dLast < dFirst
    ){

      geometry.reverse();

    }

  }

  let accumulated = 0;

  let previous =
    startingPoint ||
    geometry[0];

  for(
    const p of geometry
  ){

    const d =
      distanceMeters(
        previous.lat,
        previous.lon,
        p.lat,
        p.lon
      );

    accumulated += d;

    if(
      accumulated >= spacing
    ){

      result.push({

        lat:p.lat,

        lon:p.lon

      });

      accumulated = 0;

    }

    previous = p;

  }

  return result;

}


function distanceToWay(
  point,
  way
){

  let best =
    Infinity;

  for(
    const p of way.geometry
  ){

    const d =
      distanceMeters(
        point.lat,
        point.lon,
        p.lat,
        p.lon
      );

    if(d < best)
      best = d;

  }

  return best;

}


/* =========================================================
   REMOVE COINS
========================================================= */

function removeUncollectedCoins(){

  for(
    const c of coins
  ){

    if(
      !c.collected &&
      map.hasLayer(
        c.marker
      )
    ){

      map.removeLayer(
        c.marker
      );

    }

  }

  coins =
    coins.filter(
      c=>c.collected
    );

}


/* =========================================================
   COLLECT COINS
========================================================= */

function collectNearbyCoins(
  lat,
  lon
){

  for(
    const c of coins
  ){

    if(c.collected)
      continue;

    const d =
      distanceMeters(
        lat,
        lon,
        c.lat,
        c.lon
      );

    if(
      d <=
      COLLECTION_DISTANCE
    ){

      collectCoin(
        c
      );

    }

  }

}


async function collectCoin(c){

  if(
    !playerData ||
    c.collected
  )
    return;

  c.collected =
    true;

  if(
    map.hasLayer(
      c.marker
    )
  ){

    map.removeLayer(
      c.marker
    );

  }

  if(
    !playerData
      .collected_coins
      .includes(c.id)
  ){

    playerData
      .collected_coins
      .push(
        c.id
      );

  }

  playerData.coins +=
    10;

  playerData.xp +=
    10;

  checkLevel();

  updateCoinDisplay();

  /*
   * Coin pickup sound.
   */

  playCoinSound();

  showToast(
    "🪙 COIN COLLECTED! +10"
  );

  setStatus(
    "🎮 Keep exploring!"
  );

  await savePlayer();

  /*
   * IMPORTANT:
   * If this was the final coin,
   * immediately generate another batch.
   */

  const remaining =
    coins.filter(
      x=>!x.collected
    ).length;

  if(
    remaining === 0 &&
    playerMarker
  ){

    const pos =
      playerMarker.getLatLng();

    setStatus(
      "🪙 All coins collected! Generating more..."
    );

    setTimeout(
      ()=>{
        loadRoadNetwork(
          pos.lat,
          pos.lng
        );
      },
      300
    );

  }

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

  if(!playerData)
    return;

  let required =
    playerData.level *
    100;

  while(
    playerData.xp >= required
  ){

    playerData.xp -=
      required;

    playerData.level++;

    showToast(
      `🎉 LEVEL ${playerData.level}!`
    );

    required =
      playerData.level *
      100;

  }

}


/* =========================================================
   DISPLAY
========================================================= */

function updateCoinDisplay(){

  coinsDisplay.textContent =
    `🪙 Coins: ${
      playerData?.coins || 0
    }`;

}


/* =========================================================
   SHOP
========================================================= */

document
.getElementById("shopButton")
.addEventListener(
  "click",
  ()=>{
    shopOverlay.style.display =
      "block";

    renderShop();

  }
);

document
.getElementById("closeShop")
.addEventListener(
  "click",
  ()=>{
    shopOverlay.style.display =
      "none";
  }
);


function renderShop(){

  if(!playerData)
    return;

  shopBalance.textContent =
    `🪙 Coins: ${playerData.coins}`;

  shopItems.innerHTML = "";

  for(
    const [id,skin]
    of Object.entries(SKINS)
  ){

    const unlocked =
      playerData
        .unlocked_skins
        .includes(id);

    const equipped =
      playerData.equipped_skin ===
      id;

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "shopItem";

    const preview =
      document.createElement(
        "div"
      );

    preview.className =
      "skinPreview";

    preview.style.background =
      skin.color;

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "skinInfo";

    info.innerHTML = `

      <div class="skinName">
        ${skin.name}
      </div>

      <div class="skinPrice">
        ${
          skin.price === 0
          ? "FREE"
          : "🪙 " + skin.price
        }
      </div>

    `;

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "action";

    if(equipped){

      button.textContent =
        "EQUIPPED";

      button.disabled =
        true;

    }else if(unlocked){

      button.textContent =
        "EQUIP";

      button.onclick =
        ()=>{
          equipSkin(id);
        };

    }else if(
      playerData.coins >=
      skin.price
    ){

      button.textContent =
        "BUY";

      button.onclick =
        ()=>{
          buySkin(id);
        };

    }else{

      button.textContent =
        "NEED COINS";

      button.disabled =
        true;

    }

    item.append(
      preview,
      info,
      button
    );

    shopItems.appendChild(
      item
    );

  }

}


async function buySkin(id){

  const skin =
    SKINS[id];

  if(
    !skin ||
    !playerData
  )
    return;

  if(
    playerData
      .unlocked_skins
      .includes(id)
  )
    return;

  if(
    playerData.coins <
    skin.price
  ){

    showToast(
      "❌ Not enough coins"
    );

    return;

  }

  playerData.coins -=
    skin.price;

  playerData
    .unlocked_skins
    .push(id);

  playerData.equipped_skin =
    id;

  await savePlayer();

  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();

  showToast(
    `🎨 ${skin.name} unlocked!`
  );

}


async function equipSkin(id){

  if(
    !playerData ||
    !playerData
      .unlocked_skins
      .includes(id)
  )
    return;

  playerData.equipped_skin =
    id;

  await savePlayer();

  updatePlayerSkin();

  renderShop();

}


function updatePlayerSkin(){

  if(!playerMarker)
    return;

  const skin =
    SKINS[
      playerData?.equipped_skin
    ] ||
    SKINS.blue;

  playerMarker.setIcon(

    L.divIcon({

      className:"",

      html:
        `<div class="player"
          style="--player-color:${skin.color}">
        </div>`,

      iconSize:[28,28],

      iconAnchor:[14,14]

    })

  );

}

/* =========================================================
   PICKUP SOUND
========================================================= */

function startAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(error){

    console.log(
      "Audio unavailable"
    );

  }

}


function playCoinSound(){

  try{

    startAudio();

    if(!audioContext)
      return;

    const now =
      audioContext.currentTime;

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.type =
      "sine";

    osc.frequency.setValueAtTime(
      700,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      1300,
      now + .12
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .25,
      now + .015
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .18
    );

    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );

    osc.start(now);

    osc.stop(
      now + .2
    );

  }catch(error){

    console.log(
      "Coin sound failed"
    );

  }

}


/* =========================================================
   BACKGROUND MUSIC
========================================================= */

function startMusic(){

  try{

    startAudio();

    if(
      !audioContext ||
      musicTimer
    )
      return;

    const notes = [

      261.63,
      329.63,
      392.00,
      523.25,
      392.00,
      329.63,
      293.66,
      349.23

    ];

    let index = 0;

    function playNote(){

      if(
        !audioContext
      )
        return;

      const now =
        audioContext.currentTime;

      const osc =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      osc.type =
        "triangle";

      osc.frequency.value =
        notes[index];

      gain.gain.setValueAtTime(
        .0001,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        .025,
        now + .03
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .45
      );

      osc.connect(gain);

      gain.connect(
        audioContext.destination
      );

      osc.start(now);

      osc.stop(
        now + .5
      );

      index =
        (index + 1) %
        notes.length;

    }

    playNote();

    musicTimer =
      setInterval(
        playNote,
        520
      );

  }catch(error){

    console.log(
      "Music unavailable"
    );

  }

}


/*
 * Mobile browsers require a user interaction
 * before audio can start.
 */

document.addEventListener(
  "pointerdown",
  ()=>{
    startAudio();

    if(
      !musicTimer &&
      gameMode
    ){

      startMusic();

    }

  },
  {
    once:false
  }
);
