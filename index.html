<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>GPS COIN</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #070a0f;
  color: white;
}

button,
input {
  font: inherit;
}


/* =========================================================
   MAP
========================================================= */

#map {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 1;
}


/* =========================================================
   LOADING / START SCREEN
========================================================= */

#startScreen {

  position: fixed;

  inset: 0;

  z-index: 10000;

  display: flex;

  align-items: center;
  justify-content: center;

  padding:
    24px;

  background:
    radial-gradient(
      circle at 50% 25%,
      #1b3046 0%,
      #0b1119 45%,
      #05070a 100%
    );

  overflow-y: auto;

}

.startCard {

  width: min(
    440px,
    100%
  );

  text-align: center;

  padding:
    28px 20px;

  animation:
    cardIn .5s ease;

}

@keyframes cardIn {

  from {
    opacity: 0;
    transform:
      translateY(20px)
      scale(.97);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }

}

.logo {

  width: 90px;
  height: 90px;

  margin:
    0 auto 15px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 28px;

  font-size: 48px;

  background:
    linear-gradient(
      145deg,
      #ffd83d,
      #ff9d00
    );

  box-shadow:
    0 15px 50px
    rgba(255,180,0,.35);

  animation:
    floatLogo 2.5s ease-in-out infinite;

}

@keyframes floatLogo {

  0%,
  100% {
    transform:
      translateY(0)
      rotate(-2deg);
  }

  50% {
    transform:
      translateY(-8px)
      rotate(2deg);
  }

}

h1 {

  margin:
    0;

  font-size:
    40px;

  font-weight:
    950;

  letter-spacing:
    -2px;

}

.subtitle {

  margin:
    8px 0 25px;

  color:
    #9ba9b9;

  font-size:
    15px;

}

.step {

  margin-top:
    18px;

  text-align:
    left;

}

.stepTitle {

  margin-bottom:
    10px;

  color:
    #d9e3ed;

  font-size:
    14px;

  font-weight:
    800;

  text-transform:
    uppercase;

  letter-spacing:
    .7px;

}

.modeGrid {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

}

.mode {

  padding:
    18px 10px;

  border:
    1px solid #2d3b49;

  border-radius:
    18px;

  background:
    rgba(20,29,39,.85);

  color:
    white;

  cursor:
    pointer;

  transition:
    .18s ease;

}

.mode:active {

  transform:
    scale(.97);

}

.mode.selected {

  border-color:
    #00bfff;

  background:
    rgba(0,170,255,.16);

  box-shadow:
    0 0 0 2px
    rgba(0,190,255,.12);

}

.modeIcon {

  font-size:
    30px;

  margin-bottom:
    7px;

}

.modeName {

  font-weight:
    900;

}

.modeDescription {

  margin-top:
    5px;

  color:
    #8997a6;

  font-size:
    11px;

  line-height:
    1.35;

}


/* =========================================================
   AUTH
========================================================= */

#authArea {

  display:
    none;

  margin-top:
    20px;

  padding:
    18px;

  border:
    1px solid #283541;

  border-radius:
    18px;

  background:
    rgba(13,20,28,.9);

}

.authTitle {

  font-size:
    18px;

  font-weight:
    900;

  margin-bottom:
    5px;

}

.authSubtitle {

  color:
    #8997a6;

  font-size:
    12px;

  margin-bottom:
    14px;

}

#email {

  width:
    100%;

  padding:
    14px;

  border:
    1px solid #344452;

  border-radius:
    12px;

  outline:
    none;

  background:
    #0a1017;

  color:
    white;

}

#email:focus {

  border-color:
    #00aaff;

}

.primaryButton {

  width:
    100%;

  margin-top:
    10px;

  padding:
    14px;

  border:
    none;

  border-radius:
    13px;

  background:
    linear-gradient(
      135deg,
      #00aaff,
      #0075ff
    );

  color:
    white;

  font-weight:
    900;

  cursor:
    pointer;

}

.primaryButton:disabled {

  opacity:
    .5;

}

#authMessage {

  min-height:
    18px;

  margin-top:
    10px;

  color:
    #9eacba;

  font-size:
    12px;

}


/* =========================================================
   START GAME BUTTON
========================================================= */

#startGameButton {

  display:
    none;

  width:
    100%;

  margin-top:
    15px;

  padding:
    16px;

  border:
    none;

  border-radius:
    15px;

  background:
    linear-gradient(
      135deg,
      #21dd73,
      #00a958
    );

  color:
    white;

  font-size:
    16px;

  font-weight:
    950;

  cursor:
    pointer;

  box-shadow:
    0 8px 25px
    rgba(0,190,100,.25);

}


/* =========================================================
   LOADING SCREEN
========================================================= */

#loadingPanel {

  display:
    none;

  margin-top:
    20px;

}

.loadingRing {

  width:
    42px;

  height:
    42px;

  margin:
    0 auto 12px;

  border:
    4px solid
    #263441;

  border-top-color:
    #00bfff;

  border-radius:
    50%;

  animation:
    spin 0.8s linear infinite;

}

@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}

#loadingText {

  color:
    #b9c7d5;

  font-size:
    13px;

}

.progress {

  height:
    6px;

  margin-top:
    12px;

  overflow:
    hidden;

  border-radius:
    20px;

  background:
    #202c37;

}

#progressBar {

  width:
    0%;

  height:
    100%;

  border-radius:
    20px;

  background:
    linear-gradient(
      90deg,
      #00aaff,
      #5ce1ff
    );

  transition:
    width .3s ease;

}


/* =========================================================
   HUD
========================================================= */

#hud {

  position:
    fixed;

  top:
    calc(
      10px +
      env(safe-area-inset-top)
    );

  left:
    10px;

  right:
    10px;

  z-index:
    2000;

  display:
    flex;

  align-items:
    center;

  gap:
    7px;

  pointer-events:
    none;

}

.hudBox {

  min-height:
    43px;

  padding:
    10px 12px;

  border-radius:
    14px;

  background:
    rgba(6,11,17,.93);

  border:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.35);

  backdrop-filter:
    blur(12px);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  color:
    white;

  font-size:
    13px;

  font-weight:
    850;

}

#coinsDisplay {

  flex:
    1;

  justify-content:
    flex-start;

}

.hudButton {

  width:
    43px;

  padding:
    0;

  cursor:
    pointer;

  pointer-events:
    auto;

  font-size:
    18px;

}


/* =========================================================
   GPS INFO
========================================================= */

#gpsInfo {

  position:
    fixed;

  top:
    calc(
      65px +
      env(safe-area-inset-top)
    );

  left:
    12px;

  z-index:
    1900;

  padding:
    7px 10px;

  border-radius:
    10px;

  background:
    rgba(6,11,17,.82);

  color:
    #b7c4d0;

  font-size:
    11px;

  pointer-events:
    none;

}


/* =========================================================
   STATUS
========================================================= */

#status {

  position:
    fixed;

  left:
    12px;

  right:
    12px;

  bottom:
    calc(
      14px +
      env(safe-area-inset-bottom)
    );

  z-index:
    1900;

  padding:
    12px 15px;

  border-radius:
    14px;

  background:
    rgba(6,11,17,.94);

  border:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.4);

  color:
    white;

  text-align:
    center;

  font-size:
    13px;

  font-weight:
    700;

  pointer-events:
    none;

}


/* =========================================================
   RECENTER
========================================================= */

#recenterButton {

  position:
    fixed;

  right:
    12px;

  bottom:
    calc(
      72px +
      env(safe-area-inset-bottom)
    );

  z-index:
    1900;

  width:
    47px;

  height:
    47px;

  border:
    none;

  border-radius:
    15px;

  background:
    rgba(6,11,17,.94);

  color:
    white;

  font-size:
    21px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.4);

}


/* =========================================================
   PLAYER
========================================================= */

.playerDot {

  width:
    22px;

  height:
    22px;

  border:
    3px solid white;

  border-radius:
    50%;

  background:
    #00aaff;

  box-shadow:
    0 0 10px #00aaff,
    0 0 22px #00aaff;

}


/* =========================================================
   COIN
========================================================= */

.coin {

  width:
    31px;

  height:
    31px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    50%;

  border:
    3px solid
    #fff5a0;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fffedc,
      #ffe33f 28%,
      #ffbf00 60%,
      #db8b00
    );

  box-shadow:
    0 0 8px #ffd700,
    0 0 20px #ffb000;

  animation:
    coinPulse 1.2s infinite;

  font-size:
    15px;

}

@keyframes coinPulse {

  0%,
  100% {
    transform:
      scale(1);
  }

  50% {
    transform:
      scale(1.12);
  }

}


/* =========================================================
   MODALS
========================================================= */

.overlay {

  display:
    none;

  position:
    fixed;

  inset:
    0;

  z-index:
    7000;

  padding:
    18px;

  overflow-y:
    auto;

  background:
    rgba(0,0,0,.78);

}

.panel {

  width:
    min(470px,100%);

  margin:
    25px auto;

  padding:
    20px;

  border-radius:
    20px;

  background:
    #121920;

  border:
    1px solid
    #283540;

  color:
    white;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.6);

}

.panelHeader {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  margin-bottom:
    18px;

}

.panelHeader h2 {

  margin:
    0;

}

.closeButton {

  border:
    none;

  border-radius:
    10px;

  padding:
    9px 12px;

  background:
    #2b343c;

  color:
    white;

}


/* =========================================================
   SHOP
========================================================= */

#shopBalance {

  padding:
    12px;

  margin-bottom:
    13px;

  border-radius:
    12px;

  background:
    rgba(255,210,0,.1);

  color:
    #ffe05c;

  text-align:
    center;

  font-weight:
    900;

}

.shopItem {

  display:
    flex;

  align-items:
    center;

  gap:
    12px;

  padding:
    12px;

  margin-bottom:
    9px;

  border-radius:
    14px;

  background:
    #1b242d;

}

.skinPreview {

  width:
    40px;

  height:
    40px;

  border:
    3px solid white;

  border-radius:
    50%;

  box-shadow:
    0 0 12px currentColor;

}

.skinInfo {

  flex:
    1;

}

.skinName {

  font-weight:
    900;

}

.skinPrice {

  margin-top:
    3px;

  color:
    #ffd63d;

  font-size:
    12px;

}

.shopAction {

  border:
    none;

  border-radius:
    9px;

  padding:
    9px 11px;

  background:
    #007dd1;

  color:
    white;

  font-weight:
    800;

}

.shopAction:disabled {

  opacity:
    .45;

}


/* =========================================================
   ACCOUNT
========================================================= */

.accountEmail {

  padding:
    12px;

  border-radius:
    12px;

  background:
    #1d252d;

  color:
    #aab7c4;

  word-break:
    break-all;

}

.accountButton {

  width:
    100%;

  padding:
    13px;

  margin-top:
    9px;

  border:
    none;

  border-radius:
    12px;

  background:
    #007dd1;

  color:
    white;

  font-weight:
    850;

}

.accountButton.danger {

  background:
    #a83232;

}


/* =========================================================
   TOAST
========================================================= */

#toast {

  position:
    fixed;

  left:
    50%;

  bottom:
    100px;

  z-index:
    9999;

  max-width:
    90%;

  padding:
    13px 17px;

  border-radius:
    14px;

  background:
    #101820;

  color:
    white;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.5);

  transform:
    translate(-50%,20px);

  opacity:
    0;

  pointer-events:
    none;

  transition:
    .25s ease;

  font-weight:
    850;

}

#toast.show {

  opacity:
    1;

  transform:
    translate(-50%,0);

}


/* =========================================================
   LEAFLET
========================================================= */

/*
   THIS FIXES THE OLD OVERLAP.
   Zoom controls are below the HUD.
*/

.leaflet-top {

  top:
    125px !important;

}

.leaflet-left {

  left:
    10px !important;

}

.leaflet-control-zoom {

  margin:
    0 !important;

  border:
    none !important;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.35) !important;

}

.leaflet-control-zoom a {

  width:
    42px !important;

  height:
    42px !important;

  line-height:
    42px !important;

  font-size:
    20px !important;

}

.leaflet-control-attribution {

  font-size:
    8px !important;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:420px) {

  h1 {
    font-size:
      34px;
  }

  .mode {
    padding:
      15px 8px;
  }

  .hudBox {
    min-height:
      40px;

    padding:
      9px;
  }

}

</style>

</head>

<body>


<!-- =======================================================
     START SCREEN
======================================================= -->

<div id="startScreen">

  <div class="startCard">

    <div class="logo">
      🪙
    </div>

    <h1>
      GPS COIN
    </h1>

    <div class="subtitle">
      Explore. Collect. Level up.
    </div>


    <!-- MODE -->

    <div class="step">

      <div class="stepTitle">
        1. Choose your world
      </div>

      <div class="modeGrid">

        <button
          class="mode"
          id="privateMode"
        >

          <div class="modeIcon">
            🔒
          </div>

          <div class="modeName">
            PRIVATE
          </div>

          <div class="modeDescription">
            Safer mapped paths and normal roads.
          </div>

        </button>


        <button
          class="mode"
          id="unlimitedMode"
        >

          <div class="modeIcon">
            ♾️
          </div>

          <div class="modeName">
            UNLIMITED
          </div>

          <div class="modeDescription">
            Wider selection of mapped paths.
          </div>

        </button>

      </div>

    </div>


    <!-- AUTH -->

    <div
      id="authArea"
      class="step"
    >

      <div class="authTitle">
        2. Sign in
      </div>

      <div class="authSubtitle">
        Your coins and progress are saved to your account.
      </div>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
      >

      <button
        id="signInButton"
        class="primaryButton"
      >
        Send sign-in link
      </button>

      <div id="authMessage"></div>

    </div>


    <!-- START -->

    <button
      id="startGameButton"
    >
      📍 START GAME
    </button>


    <!-- LOADING -->

    <div id="loadingPanel">

      <div class="loadingRing"></div>

      <div id="loadingText">
        Starting...
      </div>

      <div class="progress">

        <div id="progressBar"></div>

      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     HUD
======================================================= -->

<div id="hud">

  <div
    id="coinsDisplay"
    class="hudBox"
  >
    🪙 0
  </div>

  <button
    id="shopButton"
    class="hudBox hudButton"
  >
    🛒
  </button>

  <button
    id="accountButton"
    class="hudBox hudButton"
  >
    👤
  </button>

</div>


<div id="gpsInfo">
  📍 GPS: waiting
</div>


<div id="map"></div>


<button
  id="recenterButton"
  title="Recenter"
>
  ◎
</button>


<div id="status">
  📍 Waiting for GPS...
</div>


<!-- =======================================================
     SHOP
======================================================= -->

<div
  id="shopOverlay"
  class="overlay"
>

  <div class="panel">

    <div class="panelHeader">

      <h2>
        🛒 Shop
      </h2>

      <button
        id="closeShop"
        class="closeButton"
      >
        ✕
      </button>

    </div>

    <div id="shopBalance">
      🪙 Coins: 0
    </div>

    <div id="shopItems"></div>

  </div>

</div>


<!-- =======================================================
     ACCOUNT
======================================================= -->

<div
  id="accountOverlay"
  class="overlay"
>

  <div class="panel">

    <div class="panelHeader">

      <h2>
        👤 Account
      </h2>

      <button
        id="closeAccount"
        class="closeButton"
      >
        ✕
      </button>

    </div>

    <div
      id="accountEmail"
      class="accountEmail"
    >
      Loading...
    </div>

    <button
      id="signOutButton"
      class="accountButton danger"
    >
      Sign out
    </button>

  </div>

</div>


<div id="toast"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* =========================================================

/* =========================================================
   LOAD PLAYER
========================================================= */

async function loadPlayer() {

  if (!currentUser)
    return;


  const {
    data,
    error
  } =
    await supabase

      .from("players")

      .select("*")

      .eq(
        "id",
        currentUser.id
      )

      .maybeSingle();


  if (error) {

    console.error(
      error
    );

    /*
      If the player row does not exist,
      try creating it.
    */

    await createPlayer();

    return;

  }


  if (!data) {

    await createPlayer();

    return;

  }


  playerData =
    normalizePlayer(
      data
    );


  updateCoinDisplay();

}


function normalizePlayer(
  data
) {

  return {

    id:
      data.id,

    username:
      data.username ||
      null,

    coins:
      Number(
        data.coins || 0
      ),

    xp:
      Number(
        data.xp || 0
      ),

    level:
      Number(
        data.level || 1
      ),

    unlocked_skins:
      Array.isArray(
        data.unlocked_skins
      )
        ? data.unlocked_skins
        : ["blue"],

    equipped_skin:
      data.equipped_skin ||
      "blue",

    collected_coins:
      Array.isArray(
        data.collected_coins
      )
        ? data.collected_coins
        : [],

    created_at:
      data.created_at ||
      new Date().toISOString(),

    updated_at:
      data.updated_at ||
      new Date().toISOString()

  };

}


/* =========================================================
   CREATE PLAYER
========================================================= */

async function createPlayer() {

  if (!currentUser)
    return;


  const newPlayer = {

    id:
      currentUser.id,

    username:
      currentUser.email
        ?.split("@")[0] ||
      "Player",

    coins:
      0,

    xp:
      0,

    level:
      1,

    unlocked_skins:
      ["blue"],

    equipped_skin:
      "blue",

    collected_coins:
      []

  };


  const {
    data,
    error
  } =
    await supabase

      .from("players")

      .insert(
        newPlayer
      )

      .select()

      .single();


  if (error) {

    console.error(
      "Create player:",
      error
    );

    /*
      Another tab may have created
      it already. Try loading again.
    */

    const retry =
      await supabase

        .from("players")

        .select("*")

        .eq(
          "id",
          currentUser.id
        )

        .maybeSingle();


    if (
      retry.data
    ) {

      playerData =
        normalizePlayer(
          retry.data
        );

      updateCoinDisplay();

    }

    return;

  }


  playerData =
    normalizePlayer(
      data
    );


  updateCoinDisplay();

}

/* =========================================================
   MAP
========================================================= */

function initializeMap(
  latitude = 39.8283,
  longitude = -98.5795
) {

  if (map)
    return;


  map =
    L.map(
      "map",
      {

        zoomControl:
          true,

        preferCanvas:
          true

      }
    ).setView(
      [
        latitude,
        longitude
      ],
      16
    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom:
        20,

      attribution:
        "© OpenStreetMap contributors"

    }

  ).addTo(
    map
  );


  setTimeout(
    () => {

      map.invalidateSize();

    },
    200
  );

}


/* =========================================================
   GPS
========================================================= */

function requestGPS() {

  if (
    !navigator.geolocation
  ) {

    setStatus(
      "❌ This browser doesn't support GPS."
    );

    return;

  }


  setStatus(
    "📍 Allow location access..."
  );


  watchId =
    navigator.geolocation.watchPosition(

      handlePosition,

      handleGPSError,

      {

        enableHighAccuracy:
          true,

        timeout:
          20000,

        maximumAge:
          1000

      }

    );

}


/* =========================================================
   GPS POSITION
========================================================= */

async function handlePosition(
  position
) {

  const {
    latitude,
    longitude,
    accuracy
  } =
    position.coords;


  gpsInfo.innerText =
    `📍 GPS ±${Math.round(
      accuracy
    )}m`;


  const newPosition = {

    latitude,

    longitude,

    accuracy

  };


  lastPosition =
    newPosition;


  if (!gameStarted) {

    gameStarted =
      true;


    if (!map) {

      initializeMap(
        latitude,
        longitude
      );

    }


    map.setView(
      [
        latitude,
        longitude
      ],
      17,
      {
        animate:
          true
      }
    );


    createPlayerMarker(
      latitude,
      longitude
    );


    setStatus(
      "🗺️ Finding nearby connected roads..."
    );


    await loadRoadNetwork(
      latitude,
      longitude
    );


    return;

  }


  updatePlayerMarker(
    latitude,
    longitude,
    accuracy
  );


  checkCoins(
    latitude,
    longitude
  );


  const distanceMoved =
    lastRoadRefresh
      ? distanceMeters(
          lastRoadRefresh.latitude,
          lastRoadRefresh.longitude,
          latitude,
          longitude
        )
      : Infinity;


  if (
    distanceMoved >=
    REFRESH_DISTANCE
  ) {

    lastRoadRefresh =
      newPosition;


    /*
      Refresh the road network.
      It happens in the background so
      GPS movement remains responsive.
    */

    loadRoadNetwork(
      latitude,
      longitude
    );

  }

}


/* =========================================================
   GPS ERROR
========================================================= */

function handleGPSError(
  error
) {

  console.error(
    "GPS:",
    error
  );


  if (
    error.code ===
    error.PERMISSION_DENIED
  ) {

    setStatus(
      "❌ Location permission denied. Enable Location for this site in your browser settings."
    );

    return;

  }


  if (
    error.code ===
    error.POSITION_UNAVAILABLE
  ) {

    setStatus(
      "📍 GPS unavailable. Move somewhere with a clearer GPS signal."
    );

    return;

  }


  setStatus(
    "📍 GPS is taking a moment... retrying."
  );

}

function createPlayerMarker(

    ).addTo(

    );

function updatePlayerMarker(
  lat,
  lon,
  accuracy
) {

  if (!playerMarker)
    return;


  playerMarker.setLatLng(
    [
      lat,
      lon
    ]
  );


  if (accuracyCircle) {

    accuracyCircle.setLatLng(
      [
        lat,
        lon
      ]
    );

    accuracyCircle.setRadius(
      Math.min(
        Math.max(
          accuracy,
          8
        ),
        80
      )
    );

  }

}


/* =========================================================
   LOAD ROADS
========================================================= */

async function loadRoadNetwork(
  latitude,
  longitude
) {

  if (
    loadingRoads
  )
    return;


  loadingRoads =
    true;


  setStatus(
    "🗺️ Searching nearby roads..."
  );


  try {

    const ways =
      await fetchRoads(
        latitude,
        longitude
      );


    if (
      !ways.length
    ) {

      setStatus(
        "🔎 No usable roads found within 1 km. Searching again..."
      );

      loadingRoads =
        false;

      /*
        Try a larger search once.
      */

      const bigger =
        await fetchRoads(
          latitude,
          longitude,
          1600
        );


      if (
        bigger.length
      ) {

        await processRoads(
          bigger,
          latitude,
          longitude
        );

      }

      loadingRoads =
        false;

      return;

    }


    await processRoads(
      ways,
      latitude,
      longitude
    );


  } catch (error) {

    console.error(
      "Road loading:",
      error
    );

    setStatus(
      "⚠️ Road server busy. Retrying..."
    );

  }


  loadingRoads =
    false;

}


/* =========================================================
   FETCH ROADS
========================================================= */

async function fetchRoads(
  latitude,
  longitude,
  radius =
    SEARCH_RADIUS
) {

  const query = `

[out:json][timeout:12];

(
  way["highway"]
    (around:${radius},${latitude},${longitude});

);

out tags geom;

`;


  for (
    const server of
    OVERPASS_SERVERS
  ) {

    try {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          13000
        );


      const response =
        await fetch(
          server,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded"

            },

            body:
              "data=" +
              encodeURIComponent(
                query
              ),

            signal:
              controller.signal

          }
        );


      clearTimeout(
        timeout
      );


      if (
        !response.ok
      )
        continue;


      const data =
        await response.json();


      return filterRoads(
        data.elements ||
        []
      );


    } catch (error) {

      console.log(
        "Overpass failed:",
        server
      );

    }

  }


  return [];

}


/* =========================================================
   FILTER ROADS
========================================================= */

function filterRoads(
  elements
) {

  const allowedPrivate = [

    "footway",
    "path",
    "pedestrian",
    "cycleway",
    "bridleway",
    "living_street",
    "residential",
    "unclassified",
    "service",
    "track"

  ];


  const allowedUnlimited = [

    ...allowedPrivate,

    "tertiary",
    "tertiary_link",
    "secondary",
    "secondary_link"

  ];


  const blocked = [

    "motorway",
    "motorway_link",
    "trunk",
    "trunk_link",
    "construction",
    "proposed"

  ];


  const result =
    [];


  for (
    const e of
    elements
  ) {

    if (
      e.type !==
      "way"
    )
      continue;


    if (
      !e.geometry ||
      e.geometry.length <
      2
    )
      continue;


    const highway =
      String(
        e.tags?.highway ||
        ""
      );


    if (
      blocked.includes(
        highway
      )
    )
      continue;


    if (
      gameMode ===
      "PRIVATE" &&
      !allowedPrivate.includes(
        highway
      )
    )
      continue;


    if (
      gameMode ===
      "UNLIMITED" &&
      !allowedUnlimited.includes(
        highway
      )
    )
      continue;


    const access =
      String(
        e.tags?.access ||
        ""
      ).toLowerCase();


    if (

      access ===
        "private" ||

      access ===
        "no" ||

      access ===
        "permit" ||

      access ===
        "customers"

    )
      continue;


    result.push({

      id:
        Number(
          e.id
        ),

      geometry:
        e.geometry.map(
          p => ({
            lat:
              Number(
                p.lat
              ),

            lon:
              Number(
                p.lon
              )
          })
        ),

      tags:
        e.tags ||
        {}

    });

  }


  return result;

}


/* =========================================================
   PROCESS ROAD NETWORK
========================================================= */

async function processRoads(
  ways,
  latitude,
  longitude
) {

  roads =
    ways;


  /*
    Find the nearest actual point on
    any road segment.

    IMPORTANT:
    This is not just nearest endpoint.
    It checks every segment.
  */

  const nearest =
    findNearestRoadPoint(
      ways,
      latitude,
      longitude
    );


  if (!nearest) {

    setStatus(
      "🔎 Couldn't locate a nearby road."
    );

    return;

  }


  nearestRoad =
    nearest;


  const distance =
    nearest.distance;


  if (
    distance >
    MAX_ROAD_DISTANCE
  ) {

    setStatus(
      `🚶 Nearest usable road is ${Math.round(
        distance
      )}m away.`
    );

    return;

  }


  /*
    Build a graph from the actual road
    geometry.
  */

  roadGraph =
    buildRoadGraph(
      ways
    );


  /*
    Find the connected component containing
    the nearest road.

    This is the key fix for the old bug:
    nearby disconnected roads are ignored.
  */

  const component =
    findConnectedComponent(
      roadGraph,
      nearest
    );


  if (
    component.length <
    2
  ) {

    setStatus(
      "🔎 Found a road, but couldn't find its connected network."
    );

    return;

  }


  /*
    Generate coins along this exact network.
  */

  generateNetworkCoins(
    component,
    nearest
  );


  lastRoadRefresh =
    {
      latitude,
      longitude
    };


  setStatus(
    `🛣️ Road ${Math.round(
      distance
    )}m away • ${coins.filter(
      c => !c.collected
    ).length} coins ahead`
  );

}


/* =========================================================
   NEAREST ROAD POINT
========================================================= */

function findNearestRoadPoint(
  ways,
  lat,
  lon
) {

  let best =
    null;


  for (
    let wi = 0;
    wi < ways.length;
    wi++
  ) {

    const way =
      ways[wi];


    for (
      let i = 0;
      i <
      way.geometry.length - 1;
      i++
    ) {

      const a =
        way.geometry[i];

      const b =
        way.geometry[
          i + 1
        ];


      const projection =
        projectPoint(
          lat,
          lon,
          a,
          b
        );


      const distance =
        distanceMeters(
          lat,
          lon,
          projection.lat,
          projection.lon
        );


      if (
        !best ||
        distance <
        best.distance
      ) {

        best = {

          way,

          wayIndex:
            wi,

          segmentIndex:
            i,

          point:
            projection,

          distance

        };

      }

    }

  }


  return best;

}


/* =========================================================
   PROJECT GPS ONTO ROAD SEGMENT
========================================================= */

function projectPoint(
  lat,
  lon,
  a,
  b
) {

  const meanLat =
    (
      lat +
      a.lat +
      b.lat
    ) / 3;


  const metersPerLat =
    111320;


  const metersPerLon =
    111320 *
    Math.cos(
      meanLat *
      Math.PI /
      180
    );


  const ax =
    a.lon *
    metersPerLon;


  const ay =
    a.lat *
    metersPerLat;


  const bx =
    b.lon *
    metersPerLon;


  const by =
    b.lat *
    metersPerLat;


  const px =
    lon *
    metersPerLon;


  const py =
    lat *
    metersPerLat;


  const dx =
    bx - ax;


  const dy =
    by - ay;


  const lengthSquared =
    dx * dx +
    dy * dy;


  let t =
    lengthSquared === 0
      ? 0
      : (
          (
            px - ax
          ) * dx +
          (
            py - ay
          ) * dy
        ) /
        lengthSquared;


  t =
    Math.max(
      0,
      Math.min(
        1,
        t
      )
    );


  return {

    lat:
      a.lat +
      (
        b.lat -
        a.lat
      ) * t,

    lon:
      a.lon +
      (
        b.lon -
        a.lon
      ) * t

  };

}


/* =========================================================
   ROAD GRAPH
========================================================= */

function buildRoadGraph(
  ways
) {

  const nodes =
    new Map();


  const edges =
    [];


  function nodeKey(
    lat,
    lon
  ) {

    /*
      ~10m-ish coordinate buckets.
      This allows tiny OSM coordinate differences
      at intersections to still connect.
    */

    return (
      Math.round(
        lat * 100000
      ) +
      ":" +
      Math.round(
        lon * 100000
      )
    );

  }


  function getNode(
    point
  ) {

    const key =
      nodeKey(
        point.lat,
        point.lon
      );


    if (
      !nodes.has(
        key
      )
    ) {

      nodes.set(
        key,
        {

          key,

          lat:
            point.lat,

          lon:
            point.lon,

          edges:
            []

        }
      );

    }


    return nodes.get(
      key
    );

  }


  for (
    const way of
    ways
  ) {

    const geometry =
      way.geometry;


    for (
      let i = 0;
      i <
      geometry.length - 1;
      i++
    ) {

      const a =
        getNode(
          geometry[i]
        );


      const b =
        getNode(
          geometry[
            i + 1
          ]
        );


      if (
        a.key ===
        b.key
      )
        continue;


      const distance =
        distanceMeters(
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );


      const edge = {

        a,

        b,

        way,

        distance

      };


      edges.push(
        edge
      );


      a.edges.push(
        edge
      );

      b.edges.push(
        edge
      );

    }

  }


  /*
    Extra intersection snapping.

    Some OSM roads intersect without sharing
    the exact same coordinate in the downloaded
    geometry. Snap nearby nodes together.
  */

  const nodeArray =
    [...nodes.values()];


  for (
    let i = 0;
    i < nodeArray.length;
    i++
  ) {

    const a =
      nodeArray[i];


    for (
      let j = i + 1;
      j < nodeArray.length;
      j++
    ) {

      const b =
        nodeArray[j];


      if (
        distanceMeters(
          a.lat,
          a.lon,
          b.lat,
          b.lon
        ) <=
        NODE_SNAP_DISTANCE
      ) {

        /*
          Connect them virtually.
        */

        const distance =
          distanceMeters(
            a.lat,
            a.lon,
            b.lat,
            b.lon
          );


        const edge = {

          a,

          b,

          way:
            null,

          distance,

          virtual:
            true

        };


        a.edges.push(
          edge
        );

        b.edges.push(
          edge
        );

      }

    }

  }


  return {

    nodes,

    edges

  };

}


/* =========================================================
   FIND CONNECTED COMPONENT
========================================================= */

function findConnectedComponent(
  graph,
  nearest
) {

  if (!graph)
    return [];


  /*
    Find the graph node closest to the
    nearest road point.
  */

  let startNode =
    null;

  let startDistance =
    Infinity;


  for (
    const node of
    graph.nodes.values()
  ) {

    const d =
      distanceMeters(
        nearest.point.lat,
        nearest.point.lon,
        node.lat,
        node.lon
      );


    if (
      d <
      startDistance
    ) {

      startDistance =
        d;

      startNode =
        node;

    }

  }


  if (!startNode)
    return [];


  const visited =
    new Set();


  const queue =
    [startNode];


  while (
    queue.length
  ) {

    const node =
      queue.shift();


    if (
      visited.has(
        node.key
      )
    )
      continue;


    visited.add(
      node.key
    );


    for (
      const edge of
      node.edges
    ) {

      const next =
        edge.a === node
          ? edge.b
          : edge.a;


      if (
        !visited.has(
          next.key
        )
      ) {

        queue.push(
          next
        );

      }

    }

  }


  return [
    ...visited
  ];

}


/* =========================================================
   NETWORK COIN GENERATION
========================================================= */

function generateNetworkCoins(
  component,
  nearest
) {

  if (!component.length)
    return;


  const componentSet =
    new Set(
      component.map(
        n => n.key
      )
    );


  /*
    Remove only future coins.
    Collected coins remain gone.
  */

  removeFutureCoins();


  /*
    Find starting graph node.
  */

  let startNode =
    null;

  let bestDistance =
    Infinity;


  for (
    const node of
    component
  ) {

    const d =
      distanceMeters(
        nearest.point.lat,
        nearest.point.lon,
        node.lat,
        node.lon
      );


    if (
      d <
      bestDistance
    ) {

      bestDistance =
        d;

      startNode =
        node;

    }

  }


  if (!startNode)
    return;


  /*
    Build a long walk through the network.

    We deliberately prefer roads that continue
    in the direction away from the player.
  */

  const points =
    [];


  const visitedEdges =
    new Set();


  let current =
    startNode;


  let previous =
    null;


  /*
    First coin should be on/near the actual
    nearest road point.
  */

  points.push({

    lat:
      nearest.point.lat,

    lon:
      nearest.point.lon

  });


  let accumulated =
    0;


  for (
    let step = 0;
    step < 250;
    step++
  ) {

    const candidates =
      current.edges.filter(
        edge => {

          const other =
            edge.a === current
              ? edge.b
              : edge.a;


          return (
            componentSet.has(
              other.key
            ) &&
            !visitedEdges.has(
              edge
            )
          );

        }
      );


    if (
      !candidates.length
    ) {

      break;

    }


    /*
      Prefer the longest available continuation.
      This prevents the route from getting stuck
      in tiny geometry fragments.
    */

    candidates.sort(
      (
        a,
        b
      ) =>
        b.distance -
        a.distance
    );


    let chosen =
      candidates[0];


    /*
      If there are multiple choices, avoid
      immediately reversing back toward the
      previous node.
    */

    if (
      previous
    ) {

      const nonReverse =
        candidates.find(
          edge => {

            const other =
              edge.a === current
                ? edge.b
                : edge.a;

            return (
              other.key !==
              previous.key
            );

          }
        );


      if (
        nonReverse
      ) {

        chosen =
          nonReverse;

      }

    }


    visitedEdges.add(
      chosen
    );


    const next =
      chosen.a === current
        ? chosen.b
        : chosen.a;


    accumulated +=
      chosen.distance;


    if (
      accumulated >=
      COIN_SPACING
    ) {

      points.push({

        lat:
          next.lat,

        lon:
          next.lon

      });


      accumulated =
        0;

    }


    previous =
      current;

    current =
      next;


    if (
      points.length >=
      COINS_AHEAD
    ) {

      break;

    }

  }


  /*
    If graph-node traversal didn't produce enough
    points, add geometry points from the same
    connected component as a fallback.
  */

  if (
    points.length <
    6
  ) {

    for (
      const way of
      roads
    ) {

      let belongs =
        false;


      for (
        const p of
        way.geometry
      ) {

        for (
          const node of
          component
        ) {

          if (
            distanceMeters(
              p.lat,
              p.lon,
              node.lat,
              node.lon
            ) <
            NODE_SNAP_DISTANCE
          ) {

            belongs =
              true;

            break;

          }

        }

        if (belongs)
          break;

      }


      if (!belongs)
        continue;


      for (
        const p of
        way.geometry
      ) {

        if (
          points.length >=
          COINS_AHEAD
        )
          break;


        if (
          distanceMeters(
            nearest.point.lat,
            nearest.point.lon,
            p.lat,
            p.lon
          ) >
          COIN_SPACING
        ) {

          points.push({

            lat:
              p.lat,

            lon:
              p.lon

          });

        }

      }

    }

  }


  /*
    Create markers.
  */

  for (
    const point of
    points
  ) {

    createCoin(
      point.lat,
      point.lon
    );

  }


  /*
    Sort nearest coins first.
  */

  coins.sort(
    (
      a,
      b
    ) => {

      if (
        !lastPosition
      )
        return 0;


      const da =
        distanceMeters(
          lastPosition.latitude,
          lastPosition.longitude,
          a.latitude,
          a.longitude
        );


      const db =
        distanceMeters(
          lastPosition.latitude,
          lastPosition.longitude,
          b.latitude,
          b.longitude
        );


      return da - db;

    }
  );


  const activeCoins =
    coins.filter(
      c => !c.collected
    ).length;


  setStatus(
    `🛣️ Road ${Math.round(
      nearest.distance
    )}m away • ${activeCoins} coins loaded`
  );

}


/* =========================================================
   REMOVE FUTURE COINS
========================================================= */

function removeFutureCoins() {

  if (!map)
    return;


  const keep =
    [];


  for (
    const coin of
    coins
  ) {

    if (
      coin.collected
    ) {

      keep.push(
        coin
      );

      continue;

    }


    if (
      map.hasLayer(
        coin.marker
      )
    ) {

      map.removeLayer(
        coin.marker
      );

    }

  }


  coins =
    keep;

}


/* =========================================================
   CREATE COIN
========================================================= */

function createCoin(
  lat,
  lon
) {

  if (!map)
    return;


  const id =
    makeCoinId(
      lat,
      lon
    );


  if (
    playerData?.collected_coins?.includes(
      id
    )
  )
    return;


  /*
    Avoid duplicates within ~25m.
  */

  for (
    const existing of
    coins
  ) {

    if (
      distanceMeters(
        lat,
        lon,
        existing.latitude,
        existing.longitude
      ) <
      25
    ) {

      return;

    }

  }


  const marker =
    L.marker(

      [
        lat,
        lon
      ],

      {

        icon:
          L.divIcon({

            className:
              "",

            html:
              `<div class="coin">
                🪙
              </div>`,

            iconSize:
              [31,31],

            iconAnchor:
              [15.5,15.5]

          }),

        zIndexOffset:
          100

      }

    ).addTo(
      map
    );


  const coin = {

    id,

    marker,

    latitude:
      lat,

    longitude:
      lon,

    collected:
      false

  };


  coins.push(
    coin
  );

}


/* =========================================================
   COIN ID
========================================================= */

function makeCoinId(
  lat,
  lon
) {

  return (

    Math.round(
      lat * 100000
    ) +
    "_" +
    Math.round(
      lon * 100000
    )

  );

}


/* =========================================================
   COLLECTION
========================================================= */

function checkCoins(
  lat,
  lon
) {

  for (
    const coin of
    [...coins]
  ) {

    if (
      coin.collected
    )
      continue;


    const distance =
      distanceMeters(
        lat,
        lon,
        coin.latitude,
        coin.longitude
      );


    if (
      distance <=
      COLLECTION_DISTANCE
    ) {

      collectCoin(
        coin
      );

    }

  }

}


/* =========================================================
   COLLECT
========================================================= */

async function collectCoin(
  coin
) {

  if (
    !playerData ||
    coin.collected
  )
    return;


  coin.collected =
    true;


  if (
    map &&
    map.hasLayer(
      coin.marker
    )
  ) {

    map.removeLayer(
      coin.marker
    );

  }


  if (
    !playerData.collected_coins.includes(
      coin.id
    )
  ) {

    playerData.collected_coins.push(
      coin.id
    );

  }


  playerData.coins +=
    10;


  playerData.xp +=
    10;


  checkLevel();


  updateCoinDisplay();


  showToast(
    "🪙 +10 COINS"
  );


  setStatus(
    "🎮 Keep exploring!"
  );


  scheduleSave();

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel() {

  if (!playerData)
    return;


  let leveled =
    false;


  while (
    playerData.xp >=
    playerData.level * 100
  ) {

    playerData.xp -=
      playerData.level * 100;

    playerData.level++;

    leveled =
      true;

  }


  if (leveled) {

    showToast(
      `🎉 LEVEL ${playerData.level}!`
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

function scheduleSave() {

  if (
    saveTimer
  )
    clearTimeout(
      saveTimer
    );


  saveTimer =
    setTimeout(
      savePlayer,
      600
    );

}


async function savePlayer() {

  if (
    !playerData
  )
    return;


  playerData.updated_at =
    new Date().toISOString();


  const {
    error
  } =
    await supabase

      .from("players")

      .update({

        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        unlocked_skins:
          playerData.unlocked_skins,

        equipped_skin:
          playerData.equipped_skin,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          playerData.updated_at

      })

      .eq(
        "id",
        playerData.id
      );


  if (error) {

    console.error(
      "SAVE ERROR",
      error
    );


    /*
      Keep a local backup so a temporary
      connection problem doesn't lose coins.
    */

    try {

      localStorage.setItem(
        "gps_game_backup_" +
        playerData.id,

        JSON.stringify(
          playerData
        )

      );

    } catch {}

  } else {

    try {

      localStorage.removeItem(
        "gps_game_backup_" +
        playerData.id
      );

    } catch {}

  }

}


/* =========================================================
   DISPLAY
========================================================= */

function updateCoinDisplay() {

  coinsDisplay.innerText =
    `🪙 ${
      playerData?.coins || 0
    }`;

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(
        1 - a
      )
    );


  return R * c;

}


/* =========================================================
   RECENTER
========================================================= */

document
  .getElementById(
    "recenterButton"
  )
  .onclick =
  () => {

    if (
      !map ||
      !lastPosition
    )
      return;


    map.setView(

      [
        lastPosition.latitude,
        lastPosition.longitude
      ],

      17,

      {
        animate:
          true
      }

    );

  };


/* =========================================================
   SHOP
========================================================= */

document
  .getElementById(
    "shopButton"
  )
  .onclick =
  () => {

    document
      .getElementById(
        "shopOverlay"
      )
      .style.display =
      "block";

    renderShop();

  };


document
  .getElementById(
    "closeShop"
  )
  .onclick =
  () => {

    document
      .getElementById(
        "shopOverlay"
      )
      .style.display =
      "none";

  };


function renderShop() {

  const container =
    document.getElementById(
      "shopItems"
    );


  const balance =
    document.getElementById(
      "shopBalance"
    );


  if (!playerData)
    return;


  balance.innerText =
    `🪙 Coins: ${
      playerData.coins
    }`;


  container.innerHTML =
    "";


  Object.entries(
    SKINS
  ).forEach(
    (
      [
        id,
        skin
      ]
    ) => {

      const unlocked =
        playerData
          .unlocked_skins
          .includes(
            id
          );


      const equipped =
        playerData
          .equipped_skin ===
        id;


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "shopItem";


      const preview =
        document.createElement(
          "div"
        );


      preview.className =
        "skinPreview";


      preview.style.background =
        skin.color;

      preview.style.color =
        skin.color;


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "skinInfo";


      info.innerHTML = `

        <div class="skinName">
          ${skin.name}
        </div>

        <div class="skinPrice">
          ${
            skin.price === 0
              ? "FREE"
              : "🪙 " +
                skin.price
          }
        </div>

      `;


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "shopAction";


      if (
        equipped
      ) {

        button.innerText =
          "EQUIPPED";

        button.disabled =
          true;

      }

      else if (
        unlocked
      ) {

        button.innerText =
          "EQUIP";

        button.onclick =
          () =>
            equipSkin(
              id
            );

      }

      else if (
        playerData.coins >=
        skin.price
      ) {

        button.innerText =
          "BUY";

        button.onclick =
          () =>
            buySkin(
              id
            );

      }

      else {

        button.innerText =
          "NEED COINS";

        button.disabled =
          true;

      }


      item.append(
        preview,
        info,
        button
      );


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   BUY SKIN
========================================================= */

async function buySkin(
  id
) {

  if (!playerData)
    return;


  const skin =
    SKINS[id];


  if (!skin)
    return;


  if (
    playerData
      .unlocked_skins
      .includes(id)
  )
    return;


  if (
    playerData.coins <
    skin.price
  ) {

    showToast(
      "❌ Not enough coins"
    );

    return;

  }


  playerData.coins -=
    skin.price;


  playerData
    .unlocked_skins
    .push(id);


  playerData.equipped_skin =
    id;


  updateCoinDisplay();


  if (playerMarker) {

    playerMarker.setIcon(
      playerIcon()
    );

  }


  await savePlayer();


  renderShop();


  showToast(
    `🎨 ${skin.name} equipped`
  );

}


/* =========================================================
   EQUIP
========================================================= */

async function equipSkin(
  id
) {

  if (!playerData)
    return;


  if (
    !playerData
      .unlocked_skins
      .includes(id)
  )
    return;


  playerData.equipped_skin =
    id;


  if (playerMarker) {

    playerMarker.setIcon(
      playerIcon()
    );

  }


  await savePlayer();


  renderShop();


  showToast(
    `🎨 ${SKINS[id].name} equipped`
  );

}


/* =========================================================
   ACCOUNT
========================================================= */

document
  .getElementById(
    "accountButton"
  )
  .onclick =
  () => {

    const overlay =
      document.getElementById(
        "accountOverlay"
      );


    const email =
      document.getElementById(
        "accountEmail"
      );


    email.innerText =
      currentUser?.email ||
      "No email";


    overlay.style.display =
      "block";

  };


document
  .getElementById(
    "closeAccount"
  )
  .onclick =
  () => {

    document
      .getElementById(
        "accountOverlay"
      )
      .style.display =
      "none";

  };


document
  .getElementById(
    "signOutButton"
  )
  .onclick =
  async () => {

    await supabase.auth.signOut();

  };


/* =========================================================
   STARTUP
========================================================= */

async function boot() {

  /*
    Check if we came back from a magic link.
  */

  setLoading(
    "Checking account...",
    15
  );


  try {

    const session =
      await checkSession();


    if (
      session?.user
    ) {

      currentUser =
        session.user;


      gameMode =
        localStorage.getItem(
          "gps_game_mode"
        );


      if (!gameMode) {

        startScreen.style.display =
          "flex";

        loadingPanel.style.display =
          "none";

        return;

      }


      privateMode.classList.toggle(
        "selected",
        gameMode ===
        "PRIVATE"
      );


      unlimitedMode.classList.toggle(
        "selected",
        gameMode ===
        "UNLIMITED"
      );


      await showSignedIn();


      return;

    }


    /*
      No session.
      User sees mode selection first.
    */

    startScreen.style.display =
      "flex";


    loadingPanel.style.display =
      "none";


  } catch (error) {

    console.error(
      error
    );


    startScreen.style.display =
      "flex";


    loadingPanel.style.display =
      "none";

  }

}


/* =========================================================
   START
========================================================= */

boot();

</script>
