<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>GPS Coin</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #080b10;
    }

    button {
      font-family: inherit;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* =========================
       LOADING SCREEN
    ========================= */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 35%, #20364d 0%, #0c1219 45%, #05070a 100%);
      color: white;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loadingContent {
      width: min(430px, 100%);
      text-align: center;
    }

    .gameLogo {
      font-size: 72px;
      animation: floatLogo 2s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255,215,0,.7));
    }

    @keyframes floatLogo {
      0%,100% {
        transform: translateY(0) rotate(-3deg);
      }
      50% {
        transform: translateY(-12px) rotate(3deg);
      }
    }

    .gameTitle {
      margin: 5px 0 0;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .gameSubtitle {
      margin-top: 8px;
      color: #9caabb;
      font-size: 15px;
    }

    .loadingBar {
      height: 8px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 20px;
      background: #202a35;
    }

    #loadingBarInner {
      width: 10%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg,#00aaff,#66ddff);
      box-shadow: 0 0 18px #00aaff;
      transition: width .4s ease;
    }

    #loadingText {
      min-height: 20px;
      margin-top: 14px;
      color: #bdc9d6;
      font-size: 14px;
    }

    /* =========================
       MODE SELECTION
    ========================= */

    #modeSelect {
      display: none;
      margin-top: 28px;
      animation: appear .45s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modeTitle {
      margin-bottom: 14px;
      font-size: 19px;
      font-weight: 800;
    }

    .modeButtons {
      display: flex;
      gap: 12px;
    }

    .modeChoice {
      flex: 1;
      min-width: 0;
      padding: 18px 10px;
      border: 1px solid #354352;
      border-radius: 18px;
      background: #151d26;
      color: white;
      cursor: pointer;
      transition: transform .15s, background .15s, border .15s;
    }

    .modeChoice:hover {
      border-color: #00aaff;
      background: #1c2935;
    }

    .modeChoice:active {
      transform: scale(.96);
    }

    .modeIcon {
      font-size: 32px;
      margin-bottom: 7px;
    }

    .modeName {
      font-size: 16px;
      font-weight: 900;
    }

    .modeDescription {
      margin-top: 5px;
      color: #8f9baa;
      font-size: 12px;
      line-height: 1.35;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .hudBox {
      min-height: 44px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: rgba(8,13,19,.94);
      color: white;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      white-space: nowrap;
      font-weight: 800;
      pointer-events: auto;
    }

    #coinsDisplay {
      flex: 1;
      justify-content: flex-start;
      overflow: hidden;
    }

    .hudButton {
      width: 46px;
      padding: 0;
      cursor: pointer;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(15px + env(safe-area-inset-bottom));
      z-index: 2000;
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(8,13,19,.94);
      color: white;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      pointer-events: none;
    }

    /* =========================
       PLAYER
    ========================= */

    .player {
      width: 24px;
      height: 24px;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--player-color);
      box-shadow:
        0 0 8px var(--player-color),
        0 0 18px var(--player-color),
        0 0 30px var(--player-color);
    }

    /* =========================
       COIN
    ========================= */

    .coin {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #fff4a3;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          #fffbd0 0%,
          #ffe44d 25%,
          #ffd000 55%,
          #f0a000 80%,
          #c87800 100%
        );
      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255,190,0,.7);
      animation: coinPulse 1.4s infinite;
      font-size: 15px;
    }

    @keyframes coinPulse {
      0%,100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.14);
      }
    }

    /* =========================
       OVERLAYS
    ========================= */

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 7000;
      padding: 20px;
      overflow-y: auto;
      background: rgba(0,0,0,.8);
    }

    .panel {
      width: min(500px,100%);
      margin: 30px auto;
      padding: 20px;
      border-radius: 20px;
      background: #151a20;
      color: white;
      box-shadow: 0 10px 40px rgba(0,0,0,.7);
    }

    .panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .panelHeader h2 {
      margin: 0;
    }

    .closeButton {
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      background: #333b44;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #shopBalance {
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid rgba(255,215,0,.4);
      border-radius: 12px;
      background: rgba(255,215,0,.12);
      text-align: center;
      font-weight: 800;
    }

    .shopItem {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      padding: 14px;
      border-radius: 15px;
      background: #20262d;
    }

    .skinPreview {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 4px solid white;
      border-radius: 50%;
      box-shadow: 0 0 14px currentColor;
    }

    .skinInfo {
      flex: 1;
    }

    .skinName {
      font-size: 16px;
      font-weight: 900;
    }

    .skinPrice {
      margin-top: 4px;
      color: #ffd700;
      font-size: 13px;
    }

    .shopAction,
    .accountAction {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #0077cc;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .shopAction:disabled {
      opacity: .5;
    }

    .accountEmail {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #20262d;
      color: #b9c5d2;
      word-break: break-all;
    }

    .accountAction {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
    }

    .danger {
      background: #a83232;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      z-index: 10000;
      transform: translate(-50%,20px);
      padding: 13px 18px;
      border-radius: 14px;
      background: #101820;
      color: white;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      font-weight: 900;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%,0);
    }

    /* =========================
       LEAFLET
    ========================= */

    .leaflet-top.leaflet-left {
      top: 70px;
      left: 10px;
    }

    .leaflet-control-zoom {
      margin-top: 8px !important;
    }

    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;
      line-height: 40px !important;
      font-size: 20px !important;
    }

    .leaflet-control-attribution {
      font-size: 9px;
    }
  </style>
</head>

<body>

  <!-- =========================
       LOADING
  ========================= -->

  <div id="loadingScreen">

    <div class="loadingContent">

      <div class="gameLogo">🪙</div>

      <h1 class="gameTitle">GPS COIN</h1>

      <div class="gameSubtitle">
        Explore. Collect. Level up.
      </div>

      <div class="loadingBar">
        <div id="loadingBarInner"></div>
      </div>

      <div id="loadingText">
        Starting game...
      </div>

      <div id="modeSelect">

        <div class="modeTitle">
          Choose your game mode
        </div>

        <div class="modeButtons">

          <button class="modeChoice" id="publicMode">
            <div class="modeIcon">🌎</div>
            <div class="modeName">PUBLIC</div>
            <div class="modeDescription">
              Use mapped public paths and roads.
            </div>
          </button>

          <button class="modeChoice" id="unlimitedMode">
            <div class="modeIcon">🔓</div>
            <div class="modeName">UNLIMITED</div>
            <div class="modeDescription">
              Use a wider range of mapped paths.
            </div>
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- =========================
       HUD
  ========================= -->

  <div id="hud">

    <div id="coinsDisplay" class="hudBox">
      🪙 Coins: 0
    </div>

    <button id="shopButton" class="hudBox hudButton">
      🛒
    </button>

    <button id="accountButton" class="hudBox hudButton">
      👤
    </button>

  </div>

  <div id="map"></div>

  <div id="status">
    📍 Starting GPS...
  </div>

  <!-- =========================
       SHOP
  ========================= -->

  <div id="shopOverlay" class="overlay">

    <div class="panel">

      <div class="panelHeader">
        <h2>🛒 Player Shop</h2>
        <button id="closeShop" class="closeButton">✕</button>
      </div>

      <div id="shopBalance">
        🪙 Coins: 0
      </div>

      <div id="shopItems"></div>

    </div>

  </div>

  <!-- =========================
       ACCOUNT
  ========================= -->

  <div id="accountOverlay" class="overlay">

    <div class="panel">

      <div class="panelHeader">
        <h2>👤 Account</h2>
        <button id="closeAccount" class="closeButton">✕</button>
      </div>

      <div id="accountEmail" class="accountEmail">
        Loading...
      </div>

      <button id="signOutButton" class="accountAction danger">
        Sign Out
      </button>

    </div>

  </div>

  <div id="toast"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase browser library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://yrcitnuuskcbiuryyytu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       SETTINGS
    ===================================================== */

    const SEARCH_RADIUS = 800;
    const COIN_SPACING = 65;
    const MAIN_COINS = 5;
    const BRANCH_COINS = 3;
    const COLLECTION_DISTANCE = 15;
    const REFRESH_DISTANCE = 200;


    const OVERPASS_SERVERS = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter"
    ];


    /* =====================================================
       SKINS
    ===================================================== */

    const SKINS = {

      blue: {
        name: "Blue",
        color: "#00aaff",
        price: 0
      },

      red: {
        name: "Red",
        color: "#ff3030",
        price: 50
      },

      green: {
        name: "Green",
        color: "#22dd55",
        price: 100
      },

      purple: {
        name: "Purple",
        color: "#aa55ff",
        price: 150
      },

      gold: {
        name: "Gold",
        color: "#ffd000",
        price: 250
      },

      pink: {
        name: "Pink",
        color: "#ff4fa3",
        price: 350
      }

    };


    /* =====================================================
       STATE
    ===================================================== */

    let currentUser = null;
    let playerData = null;

    let map = null;
    let playerMarker = null;

    let coins = [];

    let gameMode = "PUBLIC";

    let currentLatitude = null;
    let currentLongitude = null;

    let loadingTrail = false;
    let gpsStarted = false;

    let toastTimer = null;


    /* =====================================================
       DOM
    ===================================================== */

    const loadingScreen =
      document.getElementById("loadingScreen");

    const loadingText =
      document.getElementById("loadingText");

    const loadingBar =
      document.getElementById("loadingBarInner");

    const modeSelect =
      document.getElementById("modeSelect");

    const statusElement =
      document.getElementById("status");

    const coinsDisplay =
      document.getElementById("coinsDisplay");

    const shopOverlay =
      document.getElementById("shopOverlay");

    const shopItems =
      document.getElementById("shopItems");

    const shopBalance =
      document.getElementById("shopBalance");

    const accountOverlay =
      document.getElementById("accountOverlay");

    const accountEmail =
      document.getElementById("accountEmail");


    /* =====================================================
       LOADING
    ===================================================== */

    function loading(text, progress) {

      loadingText.innerText = text;
      loadingBar.style.width = progress + "%";

    }


    /* =====================================================
       STATUS
    ===================================================== */

    function setStatus(text) {

      statusElement.innerText = text;

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(text) {

      const toast =
        document.getElementById("toast");

      toast.innerText = text;

      toast.classList.add("show");

      if (toastTimer !== null) {
        clearTimeout(toastTimer);
      }

      toastTimer =
        setTimeout(() => {
          toast.classList.remove("show");
        }, 2200);

    }


    /* =====================================================
       BOOT
    ===================================================== */

    async function boot() {

      try {

        loading("Connecting to account...", 20);

        const {
          data,
          error
        } =
          await supabase.auth.getUser();

        if (error) {
          console.log("Auth check:", error);
        }

        currentUser = data.user;

        if (!currentUser) {

          loading(
            "No account session found.",
            100
          );

          setStatus(
            "❌ Please sign in first."
          );

          return;

        }

        loading("Loading player...", 45);

        await loadPlayer();

        loading(
          "Choose your game mode...",
          100
        );

        modeSelect.style.display = "block";

      } catch (error) {

        console.error(error);

        loading(
          "Something went wrong.",
          100
        );

        setStatus(
          "❌ Game failed to start."
        );

      }

    }


    /* =====================================================
       PLAYER
    ===================================================== */

    async function loadPlayer() {

      if (!currentUser) return;

      let result =
        await supabase
          .from("players")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();

      if (result.error) {
        throw result.error;
      }

      if (!result.data) {

        const newPlayer = {
          id: currentUser.id,
          username: null,
          coins: 0,
          xp: 0,
          level: 1,
          unlocked_skins: ["blue"],
          equipped_skin: "blue",
          collected_coins: []
        };

        const inserted =
          await supabase
            .from("players")
            .insert(newPlayer)
            .select()
            .single();

        if (inserted.error) {
          throw inserted.error;
        }

        playerData = inserted.data;

      } else {

        playerData = result.data;

      }

      updateCoinDisplay();

    }


    /* =====================================================
       MODE
    ===================================================== */

    document
      .getElementById("publicMode")
      .addEventListener("click", () => {
        chooseMode("PUBLIC");
      });


    document
      .getElementById("unlimitedMode")
      .addEventListener("click", () => {
        chooseMode("UNLIMITED");
      });


    function chooseMode(mode) {

      gameMode = mode;

      modeSelect.style.display = "none";

      loading(
        "Finding your location...",
        100
      );

      startGPS();

    }


    /* =====================================================
       GPS
    ===================================================== */

    function startGPS() {

      if (gpsStarted) return;

      gpsStarted = true;

      if (!navigator.geolocation) {

        setStatus(
          "❌ GPS is not available."
        );

        return;

      }

      navigator.geolocation.watchPosition(
        updateLocation,
        locationError,
        {
          enableHighAccuracy: true,
          maximumAge: 2000,
          timeout: 15000
        }
      );

    }


    function locationError(error) {

      console.error("GPS error:", error);

      if (error.code === 1) {

        setStatus(
          "📍 Location permission denied. Enable location for this site."
        );

      } else if (error.code === 2) {

        setStatus(
          "📍 Location unavailable."
        );

      } else {

        setStatus(
          "📍 GPS timed out. Trying again..."
        );

      }

    }


    /* =====================================================
       LOCATION
    ===================================================== */

    function updateLocation(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      if (!map) {

        startGame(
          latitude,
          longitude
        );

        return;

      }


      if (playerMarker) {

        playerMarker.setLatLng([
          latitude,
          longitude
        ]);

      }


      checkCoinCollection(
        latitude,
        longitude
      );


      if (
        currentLatitude !== null &&
        currentLongitude !== null
      ) {

        const distance =
          distanceMeters(
            currentLatitude,
            currentLongitude,
            latitude,
            longitude
          );

        if (
          distance >= REFRESH_DISTANCE
        ) {

          currentLatitude = latitude;
          currentLongitude = longitude;

          loadTrail(
            latitude,
            longitude
          );

        }

      }

    }


    /* =====================================================
       START GAME
    ===================================================== */

    function startGame(latitude, longitude) {

      map =
        L.map("map", {
          zoomControl: true
        }).setView(
          [latitude, longitude],
          17
        );


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution:
            "© OpenStreetMap contributors"
        }
      ).addTo(map);


      currentLatitude = latitude;
      currentLongitude = longitude;


      createPlayer(
        latitude,
        longitude
      );


      loadingScreen.classList.add("hidden");


      setStatus(
        "🗺️ Finding the nearest path..."
      );


      loadTrail(
        latitude,
        longitude
      );

    }


    /* =====================================================
       PLAYER
    ===================================================== */

    function getCurrentSkin() {

      const id =
        playerData?.equipped_skin || "blue";

      return SKINS[id] || SKINS.blue;

    }


    function createPlayer(latitude, longitude) {

      if (!map) return;

      playerMarker =
        L.marker(
          [latitude, longitude],
          {
            icon:
              createPlayerIcon(
                getCurrentSkin().color
              )
          }
        ).addTo(map);

    }


    function createPlayerIcon(color) {

      return L.divIcon({

        className: "",

        html:
          '<div class="player" style="--player-color:' +
          color +
          '"></div>',

        iconSize: [28,28],

        iconAnchor: [14,14]

      });

    }


    function updatePlayerSkin() {

      if (!playerMarker) return;

      playerMarker.setIcon(
        createPlayerIcon(
          getCurrentSkin().color
        )
      );

    }


    /* =====================================================
       OVERPASS
    ===================================================== */

    async function getNearbyWays(latitude, longitude) {

      const latOffset =
        SEARCH_RADIUS / 111320;

      const lonOffset =
        SEARCH_RADIUS /
        (
          111320 *
          Math.cos(latitude * Math.PI / 180)
        );


      const south =
        latitude - latOffset;

      const north =
        latitude + latOffset;

      const west =
        longitude - lonOffset;

      const east =
        longitude + lonOffset;


      let query;


      if (gameMode === "PUBLIC") {

        query = `
          [out:json][timeout:25];

          way["highway"]
          (${south},${west},${north},${east});

          out tags geom;
        `;

      } else {

        query = `
          [out:json][timeout:25];

          way["highway"]
          (${south},${west},${north},${east});

          out tags geom;
        `;

      }


      for (const server of OVERPASS_SERVERS) {

        try {

          const response =
            await fetch(
              server,
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/x-www-form-urlencoded"
                },
                body:
                  "data=" +
                  encodeURIComponent(query)
              }
            );

          if (!response.ok) {
            throw new Error(
              "HTTP " + response.status
            );
          }

          const data =
            await response.json();

          return filterWays(
            data.elements || []
          );

        } catch (error) {

          console.log(
            "Overpass failed:",
            error
          );

        }

      }

      return [];

    }


    /* =====================================================
       FILTER WAYS
    ===================================================== */

    function filterWays(elements) {

      const result = [];

      const publicAllowed = [
        "footway",
        "path",
        "pedestrian",
        "steps",
        "cycleway",
        "bridleway",
        "living_street",
        "residential"
      ];

      const forbidden = [
        "motorway",
        "motorway_link",
        "trunk",
        "trunk_link",
        "primary",
        "primary_link"
      ];


      for (const element of elements) {

        if (
          element.type !== "way" ||
          !element.geometry ||
          element.geometry.length < 2
        ) {
          continue;
        }


        const tags =
          element.tags || {};

        const highway =
          tags.highway;


        if (!highway) continue;


        const access =
          String(
            tags.access || ""
          ).toLowerCase();


        if (
          access === "private" ||
          access === "no" ||
          access === "permit" ||
          access === "customers"
        ) {
          continue;
        }


        if (
          gameMode === "PUBLIC" &&
          !publicAllowed.includes(highway)
        ) {
          continue;
        }


        if (
          gameMode === "UNLIMITED" &&
          forbidden.includes(highway)
        ) {
          continue;
        }


        result.push({
          id: element.id,
          geometry: element.geometry,
          tags
        });

      }

      return result;

    }


    /* =====================================================
       FIND CLOSEST NETWORK POINT
    ===================================================== */

    function findClosestNetworkPoint(
      ways,
      latitude,
      longitude
    ) {

      let best = null;


      for (const way of ways) {

        for (
          let index = 0;
          index < way.geometry.length;
          index++
        ) {

          const point =
            way.geometry[index];

          const distance =
            distanceMeters(
              latitude,
              longitude,
              point.lat,
              point.lon
            );


          if (
            best === null ||
            distance < best.distance
          ) {

            best = {
              way,
              index,
              distance,
              point
            };

          }

        }

      }

      return best;

    }


    /* =====================================================
       TRAIL
    ===================================================== */

    async function loadTrail(
      latitude,
      longitude
    ) {

      if (
        loadingTrail ||
        !map
      ) {
        return;
      }


      loadingTrail = true;


      setStatus(
        "🗺️ Finding nearest road/path..."
      );


      removeUncollectedCoins();


      try {

        const ways =
          await getNearbyWays(
            latitude,
            longitude
          );


        if (!ways.length) {

          setStatus(
            "🔎 No suitable paths found nearby."
          );

          loadingTrail = false;

          return;

        }


        const start =
          findClosestNetworkPoint(
            ways,
            latitude,
            longitude
          );


        if (!start) {

          setStatus(
            "🔎 Couldn't find a nearby path."
          );

          loadingTrail = false;

          return;

        }


        if (start.distance > 250) {

          setStatus(
            "🚶 Nearest mapped path is " +
            Math.round(start.distance) +
            "m away."
          );

          loadingTrail = false;

          return;

        }


        /*
          IMPORTANT:
          First coin is placed directly
          on the nearest mapped point.
        */

        createCoin(
          start.point.lat,
          start.point.lon
        );


        const route =
          buildNetworkRoute(
            ways,
            start,
            MAIN_COINS
          );


        for (const point of route) {

          createCoin(
            point.lat,
            point.lon
          );

        }


        const branch =
          findNetworkBranch(
            ways,
            route,
            start
          );


        for (const point of branch) {

          createCoin(
            point.lat,
            point.lon
          );

        }


        setStatus(
          "🎮 Path ready — collect the coins!"
        );


      } catch (error) {

        console.error(
          "Trail error:",
          error
        );

        setStatus(
          "⚠️ Couldn't load nearby paths."
        );

      }


      loadingTrail = false;

    }


    /* =====================================================
       NETWORK ROUTE
    ===================================================== */

    function buildNetworkRoute(
      ways,
      start,
      numberOfCoins
    ) {

      const route = [];

      let currentWay = start.way;
      let currentIndex = start.index;

      let direction =
        currentIndex <
        currentWay.geometry.length - 1
          ? 1
          : -1;

      let accumulated = 0;

      let lastPoint =
        currentWay.geometry[currentIndex];

      const visited = new Set();


      while (
        route.length < numberOfCoins
      ) {

        const key =
          currentWay.id +
          ":" +
          currentIndex +
          ":" +
          direction;


        if (visited.has(key)) {
          break;
        }

        visited.add(key);


        const nextIndex =
          currentIndex + direction;


        if (
          nextIndex < 0 ||
          nextIndex >= currentWay.geometry.length
        ) {

          const endpoint =
            currentWay.geometry[
              direction === 1
                ? currentWay.geometry.length - 1
                : 0
            ];


          const next =
            findConnectedWay(
              ways,
              endpoint,
              currentWay.id
            );


          if (!next) {
            break;
          }


          currentWay = next.way;
          currentIndex = next.index;
          direction = next.direction;

          lastPoint =
            currentWay.geometry[currentIndex];

          continue;

        }


        const point =
          currentWay.geometry[nextIndex];


        accumulated +=
          distanceMeters(
            lastPoint.lat,
            lastPoint.lon,
            point.lat,
            point.lon
          );


        if (
          accumulated >= COIN_SPACING
        ) {

          route.push({
            lat: point.lat,
            lon: point.lon
          });

          accumulated = 0;

        }


        lastPoint = point;
        currentIndex = nextIndex;

      }


      return route;

    }


    /* =====================================================
       CONNECTED WAY
    ===================================================== */

    function findConnectedWay(
      ways,
      endpoint,
      currentWayId
    ) {

      let best = null;
      let bestDistance = 35;


      for (const way of ways) {

        if (way.id === currentWayId) {
          continue;
        }


        const first =
          way.geometry[0];

        const last =
          way.geometry[
            way.geometry.length - 1
          ];


        const d1 =
          distanceMeters(
            endpoint.lat,
            endpoint.lon,
            first.lat,
            first.lon
          );


        const d2 =
          distanceMeters(
            endpoint.lat,
            endpoint.lon,
            last.lat,
            last.lon
          );


        if (d1 < bestDistance) {

          best = {
            way,
            index: 0,
            direction: 1
          };

          bestDistance = d1;

        }


        if (d2 < bestDistance) {

          best = {
            way,
            index: way.geometry.length - 1,
            direction: -1
          };

          bestDistance = d2;

        }

      }


      return best;

    }


    /* =====================================================
       BRANCH
    ===================================================== */

    function findNetworkBranch(
      ways,
      mainRoute,
      start
    ) {

      if (mainRoute.length < 2) {
        return [];
      }


      for (const routePoint of mainRoute) {

        for (const way of ways) {

          if (way.id === start.way.id) {
            continue;
          }


          const first =
            way.geometry[0];

          const last =
            way.geometry[
              way.geometry.length - 1
            ];


          const d1 =
            distanceMeters(
              routePoint.lat,
              routePoint.lon,
              first.lat,
              first.lon
            );


          const d2 =
            distanceMeters(
              routePoint.lat,
              routePoint.lon,
              last.lat,
              last.lon
            );


          if (d1 <= 30) {

            return buildBranch(
              way,
              0,
              1
            );

          }


          if (d2 <= 30) {

            return buildBranch(
              way,
              way.geometry.length - 1,
              -1
            );

          }

        }

      }


      return [];

    }


    function buildBranch(
      way,
      startIndex,
      direction
    ) {

      const result = [];

      let accumulated = 0;

      let lastPoint =
        way.geometry[startIndex];


      for (
        let step = 1;
        step < way.geometry.length;
        step++
      ) {

        const index =
          startIndex +
          step * direction;


        if (
          index < 0 ||
          index >= way.geometry.length
        ) {
          break;
        }


        const point =
          way.geometry[index];


        accumulated +=
          distanceMeters(
            lastPoint.lat,
            lastPoint.lon,
            point.lat,
            point.lon
          );


        if (
          accumulated >= COIN_SPACING
        ) {

          result.push({
            lat: point.lat,
            lon: point.lon
          });

          accumulated = 0;


          if (
            result.length >= BRANCH_COINS
          ) {
            break;
          }

        }


        lastPoint = point;

      }


      return result;

    }


    /* =====================================================
       COINS
    ===================================================== */

    function makeCoinId(
      latitude,
      longitude
    ) {

      return (
        Math.round(latitude * 100000) +
        "_" +
        Math.round(longitude * 100000)
      );

    }


    function createCoin(
      latitude,
      longitude
    ) {

      if (!map || !playerData) {
        return;
      }


      const id =
        makeCoinId(
          latitude,
          longitude
        );


      if (
        playerData.collected_coins &&
        playerData.collected_coins.includes(id)
      ) {
        return;
      }


      for (const existing of coins) {

        if (
          distanceMeters(
            latitude,
            longitude,
            existing.latitude,
            existing.longitude
          ) < 20
        ) {
          return;
        }

      }


      const marker =
        L.marker(
          [latitude, longitude],
          {
            icon:
              L.divIcon({
                className: "",
                html: '<div class="coin">🪙</div>',
                iconSize: [34,34],
                iconAnchor: [17,17]
              })
          }
        ).addTo(map);


      coins.push({
        id,
        marker,
        latitude,
        longitude,
        collected: false
      });

    }


    function removeUncollectedCoins() {

      if (!map) return;

      const remaining = [];


      for (const coin of coins) {

        if (coin.collected) {

          remaining.push(coin);

        } else {

          if (map.hasLayer(coin.marker)) {
            map.removeLayer(coin.marker);
          }

        }

      }


      coins = remaining;

    }


    /* =====================================================
       COLLECTION
    ===================================================== */

    function checkCoinCollection(
      latitude,
      longitude
    ) {

      for (const coin of coins) {

        if (coin.collected) {
          continue;
        }


        const distance =
          distanceMeters(
            latitude,
            longitude,
            coin.latitude,
            coin.longitude
          );


        if (
          distance <= COLLECTION_DISTANCE
        ) {

          collectCoin(coin);

        }

      }

    }


    async function collectCoin(coin) {

      if (!playerData || coin.collected) {
        return;
      }


      coin.collected = true;


      if (
        map &&
        map.hasLayer(coin.marker)
      ) {

        map.removeLayer(coin.marker);

      }


      if (
        !playerData.collected_coins
      ) {

        playerData.collected_coins = [];

      }


      if (
        !playerData.collected_coins.includes(
          coin.id
        )
      ) {

        playerData.collected_coins.push(
          coin.id
        );

      }


      playerData.coins += 10;
      playerData.xp += 10;


      checkLevel();

      updateCoinDisplay();

      showToast(
        "🪙 COIN COLLECTED! +10"
      );

      setStatus(
        "🎮 Keep exploring!"
      );


      await savePlayer();

    }


    /* =====================================================
       LEVEL
    ===================================================== */

    function checkLevel() {

      if (!playerData) return;


      const requiredXP =
        playerData.level * 100;


      while (
        playerData.xp >= requiredXP
      ) {

        playerData.xp -=
          requiredXP;

        playerData.level++;

        showToast(
          "🎉 LEVEL " +
          playerData.level +
          "!"
        );

      }

    }


    /* =====================================================
       SAVE
    ===================================================== */

    async function savePlayer() {

      if (!playerData) return;


      const {
        error
      } =
        await supabase
          .from("players")
          .update({
            coins: playerData.coins,
            xp: playerData.xp,
            level: playerData.level,
            unlocked_skins:
              playerData.unlocked_skins,
            equipped_skin:
              playerData.equipped_skin,
            collected_coins:
              playerData.collected_coins,
            updated_at:
              new Date().toISOString()
          })
          .eq(
            "id",
            playerData.id
          );


      if (error) {

        console.error(
          "Save error:",
          error
        );

        showToast(
          "⚠️ Couldn't save"
        );

      }

    }


    /* =====================================================
       COIN DISPLAY
    ===================================================== */

    function updateCoinDisplay() {

      const amount =
        playerData?.coins || 0;

      coinsDisplay.innerText =
        "🪙 Coins: " + amount;

    }


    /* =====================================================
       SHOP
    ===================================================== */

    document
      .getElementById("shopButton")
      .addEventListener(
        "click",
        () => {

          shopOverlay.style.display =
            "block";

          renderShop();

        }
      );


    document
      .getElementById("closeShop")
      .addEventListener(
        "click",
        () => {

          shopOverlay.style.display =
            "none";

        }
      );


    function renderShop() {

      if (!playerData) return;


      shopBalance.innerText =
        "🪙 Coins: " +
        playerData.coins;


      shopItems.innerHTML = "";


      Object.entries(SKINS)
        .forEach(
          ([id, skin]) => {

            const unlocked =
              playerData.unlocked_skins
                .includes(id);

            const equipped =
              playerData.equipped_skin === id;


            const item =
              document.createElement("div");

            item.className =
              "shopItem";


            const preview =
              document.createElement("div");

            preview.className =
              "skinPreview";

            preview.style.background =
              skin.color;

            preview.style.color =
              skin.color;


            const info =
              document.createElement("div");

            info.className =
              "skinInfo";


            const name =
              document.createElement("div");

            name.className =
              "skinName";

            name.innerText =
              skin.name;


            const price =
              document.createElement("div");

            price.className =
              "skinPrice";

            price.innerText =
              skin.price === 0
                ? "FREE"
                : "🪙 " + skin.price;


            info.appendChild(name);
            info.appendChild(price);


            const button =
              document.createElement("button");

            button.className =
              "shopAction";


            if (equipped) {

              button.innerText =
                "EQUIPPED";

              button.disabled = true;

            } else if (unlocked) {

              button.innerText =
                "EQUIP";

              button.onclick =
                () => equipSkin(id);

            } else if (
              playerData.coins >= skin.price
            ) {

              button.innerText =
                "BUY";

              button.onclick =
                () => buySkin(id);

            } else {

              button.innerText =
                "NEED COINS";

              button.disabled = true;

            }


            item.appendChild(preview);
            item.appendChild(info);
            item.appendChild(button);

            shopItems.appendChild(item);

          }
        );

    }


    async function buySkin(id) {

      if (!playerData) return;

      const skin = SKINS[id];

      if (!skin) return;


      if (
        playerData.unlocked_skins.includes(id)
      ) {
        return;
      }


      if (
        playerData.coins < skin.price
      ) {

        showToast(
          "🪙 Not enough coins"
        );

        return;

      }


      playerData.coins -= skin.price;

      playerData.unlocked_skins.push(id);

      playerData.equipped_skin = id;


      await savePlayer();

      updateCoinDisplay();
      updatePlayerSkin();
      renderShop();


      showToast(
        "🎨 " +
        skin.name +
        " unlocked!"
      );

    }


    async function equipSkin(id) {

      if (!playerData) return;


      if (
        !playerData.unlocked_skins.includes(id)
      ) {
        return;
      }


      playerData.equipped_skin = id;


      await savePlayer();

      updatePlayerSkin();
      renderShop();


      showToast(
        "🎨 " +
        SKINS[id].name +
        " equipped!"
      );

    }


    /* =====================================================
       ACCOUNT
    ===================================================== */

    document
      .getElementById("accountButton")
      .addEventListener(
        "click",
        () => {

          accountEmail.innerText =
            currentUser?.email ||
            "No email";

          accountOverlay.style.display =
            "block";

        }
      );


    document
      .getElementById("closeAccount")
      .addEventListener(
        "click",
        () => {

          accountOverlay.style.display =
            "none";

        }
      );


    document
      .getElementById("signOutButton")
      .addEventListener(
        "click",
        async () => {

          await supabase.auth.signOut();

          window.location.href =
            "/login.html";

        }
      );


    /* =====================================================
       AUTH
    ===================================================== */

    supabase.auth.onAuthStateChange(
      (event) => {

        console.log(
          "Auth event:",
          event
        );


        if (
          event === "SIGNED_OUT"
        ) {

          window.location.href =
            "/login.html";

        }

      }
    );


    /* =====================================================
       DISTANCE
    ===================================================== */

    function distanceMeters(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const p1 =
        lat1 * Math.PI / 180;

      const p2 =
        lat2 * Math.PI / 180;

      const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

      const dLon =
        (lon2 - lon1) *
        Math.PI / 180;


      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(p1) *
        Math.cos(p2) *
        Math.sin(dLon / 2) ** 2;


      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );


      return R * c;

    }


    /* =====================================================
       START
    ===================================================== */

    boot();

  </script>
