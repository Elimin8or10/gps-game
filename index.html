<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPS Coin</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#080b10;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#map{
  position:fixed;
  inset:0;
  z-index:1;
}

/* =========================
   AUTH
========================= */

#authScreen{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 30%,#172d43,#080b10 70%);
  color:white;
}

.authBox{
  width:min(430px,100%);
  padding:30px 24px;
  border-radius:24px;
  background:rgba(18,25,34,.96);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  text-align:center;
}

.logo{
  font-size:64px;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  50%{transform:translateY(-8px)}
}

.authBox h1{
  margin:8px 0;
  font-size:34px;
}

.authSub{
  color:#9ba8b6;
  margin-bottom:25px;
}

#emailInput{
  width:100%;
  padding:15px;
  border:1px solid #394654;
  border-radius:13px;
  outline:none;
  background:#0e141b;
  color:white;
}

#emailInput:focus{
  border-color:#00aaff;
}

.primary{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#008de0;
  color:white;
  font-weight:bold;
}

.primary:disabled{
  opacity:.5;
}

#authMessage{
  margin-top:15px;
  min-height:20px;
  color:#aebbc8;
  font-size:14px;
}

/* =========================
   LOADING
========================= */

#loadingScreen{
  position:fixed;
  inset:0;
  z-index:9000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:white;
  background:
    radial-gradient(circle at center,#172333,#080b10 70%);
}

.loadingContent{
  width:min(430px,100%);
  text-align:center;
}

.loadingLogo{
  font-size:70px;
  animation:float 2s infinite ease-in-out;
}

.loadingTitle{
  font-size:36px;
  font-weight:900;
}

.loadingSub{
  color:#9ba8b6;
}

.loadingBar{
  height:7px;
  margin-top:28px;
  overflow:hidden;
  border-radius:20px;
  background:#202a35;
}

#loadingBar{
  width:10%;
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,#00aaff,#66ddff);
  box-shadow:0 0 15px #00aaff;
  transition:.4s;
}

#loadingText{
  margin-top:13px;
  color:#b9c5d2;
}

#modeSelect{
  display:none;
  margin-top:25px;
}

.modeTitle{
  font-weight:bold;
  font-size:19px;
  margin-bottom:13px;
}

.modeButtons{
  display:flex;
  gap:10px;
}

.modeChoice{
  flex:1;
  padding:17px 10px;
  border:1px solid #354352;
  border-radius:17px;
  background:#151d26;
  color:white;
}

.modeChoice:active{
  transform:scale(.96);
}

.modeIcon{
  font-size:30px;
}

.modeName{
  margin-top:7px;
  font-weight:900;
}

.modeDescription{
  margin-top:5px;
  color:#8e9aaa;
  font-size:12px;
  line-height:1.4;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  top:max(10px,env(safe-area-inset-top));
  left:10px;
  right:10px;
  z-index:1000;
  display:flex;
  gap:7px;
  pointer-events:none;
}

.hudBox{
  min-height:44px;
  padding:10px 12px;
  border-radius:14px;
  background:rgba(8,13,19,.94);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
  font-weight:bold;
}

#coinsDisplay{
  flex:1;
  justify-content:flex-start;
}

#shopButton,
#accountButton{
  pointer-events:auto;
  cursor:pointer;
}

/* =========================
   STATUS
========================= */

#status{
  position:fixed;
  left:12px;
  right:12px;
  bottom:max(14px,env(safe-area-inset-bottom));
  z-index:1000;
  padding:11px 13px;
  border-radius:14px;
  background:rgba(8,13,19,.94);
  color:white;
  text-align:center;
  font-size:13px;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}

/* =========================
   PLAYER
========================= */

.player{
  width:22px;
  height:22px;
  border:3px solid white;
  border-radius:50%;
  background:var(--player-color);
  box-shadow:
    0 0 8px var(--player-color),
    0 0 18px var(--player-color),
    0 0 30px var(--player-color);
}

/* =========================
   COIN
========================= */

.coin{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:3px solid #fff4a3;
  background:
    radial-gradient(circle at 35% 35%,
    #fffbd0 0%,
    #ffe44d 25%,
    #ffd000 55%,
    #f0a000 80%,
    #c87800 100%);
  box-shadow:
    0 0 8px #ffd700,
    0 0 18px #ffb000;
  font-size:16px;
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.13)}
}

/* =========================
   OVERLAYS
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:5000;
  overflow:auto;
  padding:20px;
  background:rgba(0,0,0,.8);
}

.panel{
  width:min(480px,100%);
  margin:30px auto;
  padding:22px;
  border-radius:20px;
  background:#151a20;
  color:white;
}

.panelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panelHeader h2{
  margin:0;
}

.close{
  border:0;
  border-radius:10px;
  padding:8px 12px;
  background:#333;
  color:white;
}

.balance{
  margin:15px 0;
  padding:12px;
  border-radius:12px;
  text-align:center;
  background:rgba(255,215,0,.12);
}

.shopItem{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
  padding:13px;
  border-radius:14px;
  background:#20262d;
}

.skinPreview{
  width:42px;
  height:42px;
  border:4px solid white;
  border-radius:50%;
}

.skinInfo{
  flex:1;
}

.skinName{
  font-weight:bold;
}

.skinPrice{
  color:#ffd700;
  font-size:13px;
  margin-top:3px;
}

.shopAction{
  border:0;
  border-radius:10px;
  padding:9px 11px;
  background:#0077cc;
  color:white;
  font-weight:bold;
}

.shopAction:disabled{
  opacity:.5;
}

.accountEmail{
  margin:15px 0;
  padding:13px;
  border-radius:12px;
  background:#20262d;
  word-break:break-all;
  color:#b9c5d2;
}

.accountAction{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#0077cc;
  color:white;
  font-weight:bold;
}

.danger{
  background:#a83232;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:85px;
  z-index:10000;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:13px 18px;
  border-radius:14px;
  background:#101820;
  color:white;
  font-weight:bold;
  transition:.25s;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* Leaflet controls don't overlap HUD */
.leaflet-top.leaflet-left{
  top:125px;
  left:10px;
}

.leaflet-control-zoom a{
  width:40px!important;
  height:40px!important;
  line-height:40px!important;
  font-size:20px!important;
}

.leaflet-control-attribution{
  font-size:8px;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="authBox">
    <div class="logo">🪙</div>
    <h1>GPS COIN</h1>
    <div class="authSub">
      Sign in once and your account will stay signed in.
    </div>

    <input
      id="emailInput"
      type="email"
      autocomplete="email"
      placeholder="Your email"
    >

    <button id="signInButton" class="primary">
      Send Sign-In Link
    </button>

    <div id="authMessage"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="loadingContent">

    <div class="loadingLogo">🪙</div>

    <div class="loadingTitle">
      GPS COIN
    </div>

    <div class="loadingSub">
      Explore. Collect. Level up.
    </div>

    <div class="loadingBar">
      <div id="loadingBar"></div>
    </div>

    <div id="loadingText">
      Starting...
    </div>

    <div id="modeSelect">

      <div class="modeTitle">
        Choose your game mode
      </div>

      <div class="modeButtons">

        <button id="publicMode" class="modeChoice">
          <div class="modeIcon">🌎</div>
          <div class="modeName">PUBLIC</div>
          <div class="modeDescription">
            Public mapped roads and paths.
          </div>
        </button>

        <button id="unlimitedMode" class="modeChoice">
          <div class="modeIcon">🔓</div>
          <div class="modeName">UNLIMITED</div>
          <div class="modeDescription">
            Use a wider range of mapped paths.
          </div>
        </button>

      </div>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud">

  <div id="coinsDisplay" class="hudBox">
    🪙 Coins: 0
  </div>

  <div id="shopButton" class="hudBox">
    🛒
  </div>

  <div id="accountButton" class="hudBox">
    👤
  </div>

</div>

<div id="map"></div>

<div id="status">
  📍 Waiting for location...
</div>

<!-- SHOP -->
<div id="shopOverlay" class="overlay">

  <div class="panel">

    <div class="panelHeader">
      <h2>🛒 Shop</h2>
      <button id="closeShop" class="close">✕</button>
    </div>

    <div id="shopBalance" class="balance">
      🪙 Coins: 0
    </div>

    <div id="shopItems"></div>

  </div>
</div>

<!-- ACCOUNT -->
<div id="accountOverlay" class="overlay">

  <div class="panel">

    <div class="panelHeader">
      <h2>👤 Account</h2>
      <button id="closeAccount" class="close">✕</button>
    </div>

    <div id="accountEmail" class="accountEmail">
      Loading...
    </div>

    <button id="signOutButton"
            class="accountAction danger">
      Sign Out
    </button>

  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   CONFIG
========================================================= */

const GAME_URL =
  "https://elimin8or10.github.io/gps-game/";

const SEARCH_RADIUS = 900;

const COIN_SPACING = 55;

const COLLECTION_DISTANCE = 25;

const REFRESH_DISTANCE = 40;

const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];


/* =========================================================
   SKINS
========================================================= */

const SKINS = {

  blue:{
    name:"Blue",
    color:"#00aaff",
    price:0
  },

  red:{
    name:"Red",
    color:"#ff3030",
    price:50
  },

  green:{
    name:"Green",
    color:"#22dd55",
    price:100
  },

  purple:{
    name:"Purple",
    color:"#aa55ff",
    price:150
  },

  gold:{
    name:"Gold",
    color:"#ffd000",
    price:250
  },

  pink:{
    name:"Pink",
    color:"#ff4fa3",
    price:350
  }

};


/* =========================================================
   STATE
========================================================= */

let user = null;

let player = null;

let map = null;

let playerMarker = null;

let coins = [];

let mode = "PUBLIC";

let watchId = null;

let latitude = null;

let longitude = null;

let lastTrailLat = null;

let lastTrailLon = null;

let loadingTrail = false;


/* =========================================================
   DOM
========================================================= */

const authScreen =
  document.getElementById("authScreen");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingText =
  document.getElementById("loadingText");

const loadingBar =
  document.getElementById("loadingBar");

const modeSelect =
  document.getElementById("modeSelect");

const authMessage =
  document.getElementById("authMessage");

const emailInput =
  document.getElementById("emailInput");

const signInButton =
  document.getElementById("signInButton");

const status =
  document.getElementById("status");

const coinsDisplay =
  document.getElementById("coinsDisplay");

const toast =
  document.getElementById("toast");


/* =========================================================
   UI
========================================================= */

function setLoading(text,progress){

  loadingText.textContent = text;

  loadingBar.style.width =
    progress + "%";

}

function setStatus(text){

  status.textContent = text;

}

function toastMessage(text){

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}


/* =========================================================
   AUTH
========================================================= */

async function initAuth(){

  /*
   * THIS IS THE IMPORTANT PART:
   *
   * Supabase automatically restores
   * the saved session.
   */

  const {
    data
  } =
    await supabase.auth.getSession();

  if(data.session){

    user = data.session.user;

    await startAfterLogin();

    return;
  }

  /*
   * If the URL contains a magic-link
   * session, Supabase processes it.
   */

  const {
    data:{
      session
    }
  } =
    await supabase.auth.getSession();

  if(session){

    user = session.user;

    await startAfterLogin();

    return;
  }

  authScreen.style.display = "flex";
}


signInButton.addEventListener(
  "click",
  sendMagicLink
);


emailInput.addEventListener(
  "keydown",
  e=>{
    if(e.key === "Enter"){
      sendMagicLink();
    }
  }
);


async function sendMagicLink(){

  const email =
    emailInput.value.trim();

  if(!email){

    authMessage.textContent =
      "Enter your email.";

    return;
  }

  signInButton.disabled = true;

  authMessage.textContent =
    "Sending sign-in link...";

  const {
    error
  } =
    await supabase.auth.signInWithOtp({

      email,

      options:{
        emailRedirectTo:GAME_URL
      }

    });

  if(error){

    console.error(error);

    authMessage.textContent =
      error.message;

    signInButton.disabled = false;

    return;
  }

  authMessage.textContent =
    "✅ Check your email. Tap the sign-in link.";

  signInButton.disabled = false;
}


/* =========================================================
   AUTH STATE
========================================================= */

supabase.auth.onAuthStateChange(
  async (event,session)=>{

    console.log(
      "Auth:",
      event
    );

    if(
      session &&
      !user
    ){

      user =
        session.user;

      await startAfterLogin();
    }

    if(
      event === "SIGNED_OUT"
    ){

      user = null;

      location.reload();
    }

  }
);


/* =========================================================
   START
========================================================= */

async function startAfterLogin(){

  authScreen.style.display =
    "none";

  loadingScreen.style.display =
    "flex";

  setLoading(
    "Loading your account...",
    25
  );

  await loadPlayer();

  setLoading(
    "Choose your game mode...",
    100
  );

  modeSelect.style.display =
    "block";
}


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

  if(!user) return;

  let result =
    await supabase
      .from("players")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  if(result.error){

    console.error(result.error);

    setStatus(
      "⚠️ Couldn't load player data."
    );

    return;
  }

  /*
   * Safety fallback in case the trigger
   * didn't create the row.
   */

  if(!result.data){

    const insert =
      await supabase
        .from("players")
        .insert({
          id:user.id
        })
        .select()
        .single();

    if(insert.error){

      console.error(insert.error);

      return;
    }

    player =
      insert.data;

  }else{

    player =
      result.data;

  }

  updateCoins();
}


function updateCoins(){

  coinsDisplay.textContent =
    "🪙 Coins: " +
    (player?.coins || 0);

}


/* =========================================================
   MODE
========================================================= */

document
  .getElementById("publicMode")
  .onclick = ()=>{
    chooseMode("PUBLIC");
  };

document
  .getElementById("unlimitedMode")
  .onclick = ()=>{
    chooseMode("UNLIMITED");
  };


function chooseMode(selected){

  mode = selected;

  modeSelect.style.display =
    "none";

  setLoading(
    "Requesting your location...",
    100
  );

  requestLocation();
}


/* =========================================================
   GPS
========================================================= */

function requestLocation(){

  if(!navigator.geolocation){

    setStatus(
      "❌ Your browser doesn't support GPS."
    );

    return;
  }

  /*
   * This explicitly requests permission.
   */

  navigator.geolocation.getCurrentPosition(

    position=>{

      updateLocation(position);

      startWatching();

    },

    error=>{

      console.error(error);

      if(error.code === 1){

        setStatus(
          "📍 Location permission denied. Enable Location for this site."
        );

      }else{

        setStatus(
          "📍 Couldn't get your location. Trying again..."
        );

        setTimeout(
          requestLocation,
          3000
        );
      }

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }

  );
}


function startWatching(){

  if(watchId !== null)
    return;

  watchId =
    navigator.geolocation.watchPosition(

      updateLocation,

      error=>{
        console.log(
          "GPS update:",
          error
        );
      },

      {
        enableHighAccuracy:true,
        maximumAge:2000,
        timeout:15000
      }

    );
}


/* =========================================================
   LOCATION
========================================================= */

async function updateLocation(position){

  latitude =
    position.coords.latitude;

  longitude =
    position.coords.longitude;

  if(!map){

    createMap(
      latitude,
      longitude
    );

    loadingScreen.classList.add("hidden");

    setTimeout(()=>{
      loadingScreen.style.display =
        "none";
    },650);

    setStatus(
      "🗺️ Finding the nearest connected road..."
    );

    await loadTrail(
      latitude,
      longitude
    );

    return;
  }


  if(playerMarker){

    playerMarker.setLatLng([
      latitude,
      longitude
    ]);

  }


  collectNearbyCoins(
    latitude,
    longitude
  );


  if(
    lastTrailLat !== null &&
    lastTrailLon !== null
  ){

    const moved =
      distance(
        lastTrailLat,
        lastTrailLon,
        latitude,
        longitude
      );

    setStatus(
      "📍 " +
      Math.round(moved) +
      "m since last path update"
    );

    /*
     * This is deliberately small.
     *
     * The game does NOT require the player
     * to touch a road before refreshing.
     */

    if(
      moved >= REFRESH_DISTANCE
    ){

      await loadTrail(
        latitude,
        longitude
      );
    }

  }else{

    await loadTrail(
      latitude,
      longitude
    );

  }

}


/* =========================================================
   MAP
========================================================= */

function createMap(lat,lon){

  map =
    L.map("map",{
      zoomControl:true
    }).setView(
      [lat,lon],
      17
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);

  createPlayer(
    lat,
    lon
  );

}


/* =========================================================
   PLAYER MARKER
========================================================= */

function createPlayer(lat,lon){

  const color =
    SKINS[
      player?.equipped_skin || "blue"
    ]?.color || "#00aaff";

  playerMarker =
    L.marker(
      [lat,lon],
      {
        icon:
          L.divIcon({
            className:"",
            html:
              `<div class="player"
                style="--player-color:${color}">
              </div>`,
            iconSize:[28,28],
            iconAnchor:[14,14]
          })
      }
    ).addTo(map);

}


/* =========================================================
   TRAIL LOADING
========================================================= */

async function loadTrail(lat,lon){

  if(
    loadingTrail ||
    !map
  ){
    return;
  }

  loadingTrail = true;

  lastTrailLat = lat;

  lastTrailLon = lon;

  setStatus(
    "🗺️ Finding roads near you..."
  );

  try{

    const ways =
      await getWays(
        lat,
        lon
      );

    if(!ways.length){

      setStatus(
        "❌ No suitable roads found nearby."
      );

      loadingTrail = false;

      return;
    }


    /*
     * Find the closest ROAD NETWORK,
     * not simply the closest random
     * OSM way.
     */

    const network =
      findBestNetwork(
        ways,
        lat,
        lon
      );


    if(!network){

      setStatus(
        "❌ Couldn't find a connected road."
      );

      loadingTrail = false;

      return;
    }


    const nearestDistance =
      network.distance;


    setStatus(
      "🛣️ Nearest connected road: " +
      Math.round(nearestDistance) +
      "m away"
    );


    /*
     * Generate along the actual connected
     * network beginning at the closest
     * point.
     */

    const route =
      generateConnectedRoute(
        ways,
        network
      );


    for(const point of route){

      createCoin(
        point.lat,
        point.lon
      );

    }


    setStatus(
      "🪙 " +
      route.length +
      " coins along your connected road"
    );

  }catch(error){

    console.error(
      "Trail error:",
      error
    );

    setStatus(
      "⚠️ Couldn't load nearby roads."
    );

  }

  loadingTrail = false;
}


/* =========================================================
   OVERPASS
========================================================= */

async function getWays(lat,lon){

  const latOffset =
    SEARCH_RADIUS / 111320;

  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat*Math.PI/180
      )
    );

  const south =
    lat-latOffset;

  const north =
    lat+latOffset;

  const west =
    lon-lonOffset;

  const east =
    lon+lonOffset;


  /*
   * Important:
   *
   * We request geometry so we can follow
   * the actual road network.
   */

  const query = `
[out:json][timeout:25];

way["highway"]
(${south},${west},${north},${east});

out tags geom;
`;


  for(
    const server of OVERPASS
  ){

    try{

      const response =
        await fetch(
          server,
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },
            body:
              "data="+
              encodeURIComponent(query)
          }
        );

      if(!response.ok)
        throw new Error(
          "HTTP "+response.status
        );

      const data =
        await response.json();

      return filterWays(
        data.elements || []
      );

    }catch(error){

      console.log(
        "Overpass failed:",
        error
      );

    }

  }

  return [];
}


/* =========================================================
   FILTER
========================================================= */

function filterWays(elements){

  const allowedPublic = [

    "footway",
    "path",
    "pedestrian",
    "steps",
    "cycleway",
    "bridleway",
    "living_street",
    "residential",
    "unclassified",
    "service"

  ];

  const forbiddenUnlimited = [

    "motorway",
    "motorway_link",
    "trunk",
    "trunk_link"

  ];

  const result = [];

  for(
    const e of elements
  ){

    if(
      e.type !== "way" ||
      !e.geometry ||
      e.geometry.length < 2
    ){
      continue;
    }

    const tags =
      e.tags || {};

    const highway =
      tags.highway;

    if(!highway)
      continue;


    const access =
      String(
        tags.access || ""
      ).toLowerCase();


    if(
      access === "private" ||
      access === "no" ||
      access === "permit" ||
      access === "customers"
    ){
      continue;
    }


    if(mode === "PUBLIC"){

      if(
        !allowedPublic.includes(
          highway
        )
      ){
        continue;
      }

    }else{

      if(
        forbiddenUnlimited.includes(
          highway
        )
      ){
        continue;
      }

    }


    result.push({

      id:e.id,

      geometry:e.geometry,

      tags

    });

  }

  return result;
}


/* =========================================================
   BEST NETWORK
========================================================= */

function findBestNetwork(
  ways,
  lat,
  lon
){

  /*
   * First find the nearest way.
   */

  let nearest = null;

  for(
    const way of ways
  ){

    for(
      let i=0;
      i<way.geometry.length;
      i++
    ){

      const p =
        way.geometry[i];

      const d =
        distance(
          lat,
          lon,
          p.lat,
          p.lon
        );

      if(
        !nearest ||
        d < nearest.distance
      ){

        nearest = {
          way,
          index:i,
          distance:d,
          point:p
        };

      }

    }

  }

  if(!nearest)
    return null;


  /*
   * Verify that this way belongs to
   * a usable connected component.
   *
   * We prefer nearby ways that connect
   * to this way instead of a random
   * disconnected path.
   */

  const component =
    buildComponent(
      ways,
      nearest.way
    );


  /*
   * If a nearby way is tiny/disconnected,
   * search for the closest substantial
   * component instead.
   */

  if(
    component.length < 2
  ){

    let best = null;

    for(
      const way of ways
    ){

      const p =
        closestPointOnWay(
          way,
          lat,
          lon
        );

      if(
        !best ||
        p.distance < best.distance
      ){

        best = {
          way,
          index:p.index,
          point:p.point,
          distance:p.distance
        };

      }

    }

    return best;
  }


  return nearest;
}


/* =========================================================
   CONNECTED COMPONENT
========================================================= */

function buildComponent(
  ways,
  startWay
){

  const component = [];

  const visited =
    new Set();

  const queue =
    [startWay];

  while(queue.length){

    const way =
      queue.shift();

    if(
      visited.has(way.id)
    ){
      continue;
    }

    visited.add(way.id);

    component.push(way);


    for(
      const other of ways
    ){

      if(
        visited.has(other.id)
      )
        continue;

      if(
        waysConnect(
          way,
          other
        )
      ){

        queue.push(other);

      }

    }

    /*
     * Don't spend forever building
     * an enormous network.
     */

    if(component.length >= 100)
      break;

  }

  return component;
}


/* =========================================================
   CONNECTED
========================================================= */

function waysConnect(a,b){

  const threshold = 35;

  const aFirst =
    a.geometry[0];

  const aLast =
    a.geometry[
      a.geometry.length-1
    ];

  const bFirst =
    b.geometry[0];

  const bLast =
    b.geometry[
      b.geometry.length-1
    ];


  return (

    distance(
      aFirst.lat,
      aFirst.lon,
      bFirst.lat,
      bFirst.lon
    ) <= threshold ||

    distance(
      aFirst.lat,
      aFirst.lon,
      bLast.lat,
      bLast.lon
    ) <= threshold ||

    distance(
      aLast.lat,
      aLast.lon,
      bFirst.lat,
      bFirst.lon
    ) <= threshold ||

    distance(
      aLast.lat,
      aLast.lon,
      bLast.lat,
      bLast.lon
    ) <= threshold

  );
}


/* =========================================================
   CLOSEST POINT
========================================================= */

function closestPointOnWay(
  way,
  lat,
  lon
){

  let best = null;

  for(
    let i=0;
    i<way.geometry.length;
    i++
  ){

    const p =
      way.geometry[i];

    const d =
      distance(
        lat,
        lon,
        p.lat,
        p.lon
      );

    if(
      !best ||
      d < best.distance
    ){

      best = {
        index:i,
        point:p,
        distance:d
      };

    }

  }

  return best;
}


/* =========================================================
   ROUTE GENERATOR
========================================================= */

function generateConnectedRoute(
  ways,
  start
){

  const route = [];

  let way =
    start.way;

  let index =
    start.index;

  /*
   * Start from the nearest point and
   * walk forward.
   */

  let direction =
    index <
    way.geometry.length-1
      ? 1
      : -1;

  let accumulated = 0;

  let last =
    way.geometry[index];

  const visited =
    new Set();


  /*
   * Allow plenty of coins.
   */

  const maxCoins = 30;


  while(
    route.length < maxCoins
  ){

    const key =
      way.id +
      ":" +
      index +
      ":" +
      direction;

    if(
      visited.has(key)
    ){
      break;
    }

    visited.add(key);


    const nextIndex =
      index + direction;


    /*
     * Reached the end of this road.
     * Find a road that actually connects
     * to the endpoint.
     */

    if(
      nextIndex < 0 ||
      nextIndex >=
      way.geometry.length
    ){

      const endpoint =
        way.geometry[
          direction === 1
            ? way.geometry.length-1
            : 0
        ];


      const next =
        findConnectedWay(
          ways,
          endpoint,
          way.id
        );


      if(!next)
        break;


      way =
        next.way;

      index =
        next.index;

      direction =
        next.direction;

      last =
        way.geometry[index];

      continue;
    }


    const point =
      way.geometry[nextIndex];


    accumulated +=
      distance(
        last.lat,
        last.lon,
        point.lat,
        point.lon
      );


    if(
      accumulated >=
      COIN_SPACING
    ){

      route.push({
        lat:point.lat,
        lon:point.lon
      });

      accumulated = 0;
    }


    last = point;

    index = nextIndex;

  }


  return route;
}


/* =========================================================
   FIND CONNECTED WAY
========================================================= */

function findConnectedWay(
  ways,
  endpoint,
  currentId
){

  let best = null;

  let bestDistance = 35;


  for(
    const way of ways
  ){

    if(
      way.id === currentId
    )
      continue;


    const first =
      way.geometry[0];

    const last =
      way.geometry[
        way.geometry.length-1
      ];


    const d1 =
      distance(
        endpoint.lat,
        endpoint.lon,
        first.lat,
        first.lon
      );


    const d2 =
      distance(
        endpoint.lat,
        endpoint.lon,
        last.lat,
        last.lon
      );


    if(
      d1 < bestDistance
    ){

      best = {
        way,
        index:0,
        direction:1
      };

      bestDistance = d1;
    }


    if(
      d2 < bestDistance
    ){

      best = {
        way,
        index:
          way.geometry.length-1,
        direction:-1
      };

      bestDistance = d2;
    }

  }

  return best;
}


/* =========================================================
   COINS
========================================================= */

function coinId(lat,lon){

  return (
    Math.round(lat*100000) +
    "_" +
    Math.round(lon*100000)
  );
}


function createCoin(lat,lon){

  if(!map || !player)
    return;


  const id =
    coinId(lat,lon);


  if(
    player.collected_coins?.includes(id)
  ){
    return;
  }


  /*
   * Don't put multiple coins on top
   * of each other.
   */

  for(
    const c of coins
  ){

    if(
      distance(
        lat,
        lon,
        c.lat,
        c.lon
      ) < 20
    ){
      return;
    }

  }


  const marker =
    L.marker(
      [lat,lon],
      {
        icon:
          L.divIcon({
            className:"",
            html:
              `<div class="coin">🪙</div>`,
            iconSize:[34,34],
            iconAnchor:[17,17]
          })
      }
    ).addTo(map);


  coins.push({
    id,
    lat,
    lon,
    marker
  });

}


/* =========================================================
   COLLECTION
========================================================= */

function collectNearbyCoins(
  lat,
  lon
){

  for(
    const coin of [...coins]
  ){

    const d =
      distance(
        lat,
        lon,
        coin.lat,
        coin.lon
      );


    if(
      d <= COLLECTION_DISTANCE
    ){

      collectCoin(
        coin
      );

    }

  }

}


async function collectCoin(
  coin
){

  if(!player)
    return;


  /*
   * Remove immediately so it can't
   * be collected twice.
   */

  if(
    !coins.includes(coin)
  )
    return;


  map.removeLayer(
    coin.marker
  );

  coins =
    coins.filter(
      c=>c!==coin
    );


  if(
    !player.collected_coins
  ){

    player.collected_coins = [];

  }


  if(
    player.collected_coins.includes(
      coin.id
    )
  ){
    return;
  }


  player.collected_coins.push(
    coin.id
  );


  player.coins =
    (player.coins || 0) + 10;


  player.xp =
    (player.xp || 0) + 10;


  levelUp();


  updateCoins();


  toastMessage(
    "🪙 COIN COLLECTED! +10"
  );


  await savePlayer();

}


/* =========================================================
   LEVEL
========================================================= */

function levelUp(){

  if(!player)
    return;


  const needed =
    (player.level || 1) * 100;


  if(
    player.xp >= needed
  ){

    player.xp -= needed;

    player.level =
      (player.level || 1) + 1;

    toastMessage(
      "🎉 LEVEL " +
      player.level +
      "!"
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

async function savePlayer(){

  if(!player)
    return;


  const {
    error
  } =
    await supabase
      .from("players")
      .update({

        coins:player.coins,

        xp:player.xp,

        level:player.level,

        unlocked_skins:
          player.unlocked_skins,

        equipped_skin:
          player.equipped_skin,

        collected_coins:
          player.collected_coins,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        player.id
      );


  if(error){

    console.error(
      "Save error:",
      error
    );

    toastMessage(
      "⚠️ Save failed"
    );

  }

}

document

function renderShop(){

  if(!player)
    return;

  const balance =
    document.getElementById(
      "shopBalance"
    );

  const items =
    document.getElementById(
      "shopItems"
    );


  balance.textContent =
    "🪙 Coins: " +
    player.coins;


  items.innerHTML = "";


  Object.entries(
    SKINS
  ).forEach(
    ([id,skin])=>{

      const unlocked =
        player.unlocked_skins
          ?.includes(id);

      const equipped =
        player.equipped_skin === id;


      const item =
        document.createElement("div");

      item.className =
        "shopItem";


      const preview =
        document.createElement("div");

      preview.className =
        "skinPreview";

      preview.style.background =
        skin.color;


      const info =
        document.createElement("div");

      info.className =
        "skinInfo";

      info.innerHTML =
        `
          <div class="skinName">
            ${skin.name}
          </div>

          <div class="skinPrice">
            ${
              skin.price === 0
                ? "FREE"
                : "🪙 " + skin.price
            }
          </div>
        `;


      const button =
        document.createElement("button");

      button.className =
        "shopAction";


      if(equipped){

        button.textContent =
          "EQUIPPED";

        button.disabled=true;

      }else if(unlocked){

        button.textContent =
          "EQUIP";

        button.onclick =
          ()=>equipSkin(id);

      }else if(
        player.coins >= skin.price
      ){

        button.textContent =
          "BUY";

        button.onclick =
          ()=>buySkin(id);

      }else{

        button.textContent =
          "NEED COINS";

        button.disabled=true;

      }


      item.append(
        preview,
        info,
        button
      );

      items.appendChild(item);

    }
  );

}


async function buySkin(id){

  const skin =
    SKINS[id];

  if(!skin || !player)
    return;


  if(
    player.coins < skin.price
  )
    return;


  player.coins -=
    skin.price;


  if(
    !player.unlocked_skins
  )
    player.unlocked_skins=[];


  player.unlocked_skins.push(id);

  player.equipped_skin =
    id;


  await savePlayer();

  updateCoins();

  updatePlayerMarker();

  renderShop();

  toastMessage(
    "🎨 " +
    skin.name +
    " unlocked!"
  );

}


async function equipSkin(id){

  if(!player)
    return;


  if(
    !player.unlocked_skins.includes(id)
  )
    return;


  player.equipped_skin =
    id;


  await savePlayer();

  updatePlayerMarker();

  renderShop();

}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayerMarker(){

  if(!playerMarker)
    return;


  const color =
    SKINS[
      player.equipped_skin || "blue"
    ]?.color || "#00aaff";


  playerMarker.setIcon(
    L.divIcon({

      html:
        `<div class="player"
          style="--player-color:${color}">
        </div>`,
      iconSize:[28,28],
      iconAnchor:[14,14]
    })
  );

}

/* =========================================================
   DISTANCE
========================================================= */

function distance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1*Math.PI/180;

  const p2 =
    lat2*Math.PI/180;

  const dLat =
    (lat2-lat1)*
    Math.PI/180;

  const dLon =
    (lon2-lon1)*
    Math.PI/180;


  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(p1)*
    Math.cos(p2)*
    Math.sin(dLon/2)**2;


  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}
