/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2)**2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


/* =========================================================
   MUSIC
========================================================= */

/*
 * Browsers normally block audio autoplay.
 *
 * We therefore start the music after the user's
 * first interaction with the page.
 *
 * This creates the music ourselves, so no external
 * music file is needed.
 */

function startMusic(){

  if(musicMuted)
    return;

  if(musicStarted){

    if(
      audioContext &&
      audioContext.state === "suspended"
    ){

      audioContext.resume();

    }

    return;

  }

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(
      audioContext.state === "suspended"
    ){

      audioContext.resume();

    }

    musicStarted = true;

    musicLoop();

  }catch(error){

    console.log(
      "Audio unavailable:",
      error
    );

  }

}


function musicLoop(){

  if(!musicStarted)
    return;

  if(musicMuted)
    return;

  const ctx =
    audioContext;

  const now =
    ctx.currentTime;

  /*
   * Chill electronic melody.
   */

  const notes = [

    220.00,
    261.63,
    329.63,
    392.00,

    329.63,
    293.66,
    261.63,
    329.63

  ];

  notes.forEach(
    (frequency,index)=>{

      const osc =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      osc.type =
        "triangle";

      osc.frequency.value =
        frequency;

      gain.gain.setValueAtTime(
        0,
        now + index * .38
      );

      gain.gain.linearRampToValueAtTime(
        .035,
        now + index * .38 + .03
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        now + index * .38 + .34
      );

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(
        now + index * .38
      );

      osc.stop(
        now + index * .38 + .35
      );

    }
  );

  musicTimer =
    setTimeout(
      musicLoop,
      2800
    );

}


function coinSound(){

  try{

    if(!audioContext)
      startMusic();

    if(!audioContext)
      return;

    const ctx =
      audioContext;

    const now =
      ctx.currentTime;

    const frequencies = [
      880,
      1174,
      1568
    ];

    frequencies.forEach(
      (frequency,index)=>{

        const osc =
          ctx.createOscillator();

        const gain =
          ctx.createGain();

        osc.type =
          "sine";

        osc.frequency.value =
          frequency;

        gain.gain.setValueAtTime(
          .0001,
          now + index*.06
        );

        gain.gain.exponentialRampToValueAtTime(
          .16,
          now + index*.06 + .015
        );

        gain.gain.exponentialRampToValueAtTime(
          .001,
          now + index*.06 + .16
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(
          now + index*.06
        );

        osc.stop(
          now + index*.06 + .18
        );

      }
    );

  }catch(error){

    console.log(error);

  }

}

      await supabase.auth.signInWithPassword({

        email:email,

        password:password

      });

    if(result.error){

      console.error(
        result.error
      );

      authStatus.textContent =
        "❌ " +
        result.error.message;

      return;

    }

    currentUser =

    authStatus.textContent =

    await afterLogin();

  }catch(error){

    console.error(error);

    authStatus.textContent =
      "❌ " + error.message;

  }finally{

    signInButton.disabled =
      false;

    createAccountButton.disabled =
      false;

  }

};

/* =========================================================
   PLAYER DATABASE
========================================================= */

async function loadPlayer(){

  if(!currentUser)
    return;

  let result =
    await supabase
      .from("players")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if(result.error)
    throw result.error;

  let data =
    result.data;

  if(!data){

    const newPlayer = {

      id:
        currentUser.id,

      username:
        currentUser.email
          ?.split("@")[0] ||
        "Player",

      coins:0,

      xp:0,

      level:1,

      unlocked_skins:[
        "blue"
      ],

      equipped_skin:
        "blue",

      collected_coins:[]

    };

    const created =
      await supabase
        .from("players")
        .insert(
          newPlayer
        )
        .select()
        .single();

    if(created.error)
      throw created.error;

    data =
      created.data;

  }

  data.coins =
    Number(
      data.coins || 0
    );

  data.xp =
    Number(
      data.xp || 0
    );

  data.level =
    Number(
      data.level || 1
    );

  data.unlocked_skins =
    Array.isArray(
      data.unlocked_skins
    )
      ? data.unlocked_skins
      : ["blue"];

  data.collected_coins =
    Array.isArray(
      data.collected_coins
    )
      ? data.collected_coins
      : [];

  data.equipped_skin =
    data.equipped_skin ||
    "blue";

  playerData =
    data;

  updateCoinDisplay();

}


/* =========================================================
   SAVE PLAYER
========================================================= */

async function savePlayer(){

  if(!playerData)
    return;

  const result =
    await supabase
      .from("players")
      .update({

        coins:
          playerData.coins,

        xp:
          playerData.xp,

        level:
          playerData.level,

        unlocked_skins:
          playerData.unlocked_skins,

        equipped_skin:
          playerData.equipped_skin,

        collected_coins:
          playerData.collected_coins,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        playerData.id
      );

  if(result.error){

    console.error(
      "Save error:",
      result.error
    );

  }

}

      }

    );

/* =========================================================
   GPS
========================================================= */

function startGPS(){

  if(
    !navigator.geolocation
  ){

    loadingScreen.style.display =
      "none";

    setStatus(
      "❌ GPS is not supported by this browser."
    );

    return;

  }

  if(watchId !== null)
    return;

  watchId =
    navigator.geolocation.watchPosition(

      onLocation,

      onLocationError,

      {

        enableHighAccuracy:true,

        maximumAge:1500,

        timeout:15000

      }

    );

}


function onLocation(position){

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy ||
    30;

  lastPosition = {

    lat,
    lon,
    accuracy

  };

  setLoading(
    "GPS location found!",
    60
  );

  if(!playerMarker){

    createPlayer(
      lat,
      lon
    );

    map.setView(
      [lat,lon],
      17
    );

    loadingScreen.style.display =
      "none";

    setStatus(
      "🗺️ Finding nearby roads..."
    );

    loadRoadNetwork(
      lat,
      lon
    );

  }else{

    playerMarker.setLatLng(
      [lat,lon]
    );

    if(accuracyCircle){

      accuracyCircle
        .setLatLng(
          [lat,lon]
        )
        .setRadius(
          accuracy
        );

    }

  }

  collectNearbyCoins(
    lat,
    lon
  );

  /*
   * CONSTANTLY keep the road network
   * updated as the player moves.
   */

  if(
    lastRoadLat === null ||
    lastRoadLon === null
  ){

    loadRoadNetwork(
      lat,
      lon
    );

    return;

  }

  const moved =
    distanceMeters(
      lastRoadLat,
      lastRoadLon,
      lat,
      lon
    );

  if(
    moved >=
    ROAD_REFRESH_DISTANCE
  ){

    loadRoadNetwork(
      lat,
      lon
    );

  }

}


function onLocationError(error){

  console.log(
    "GPS error:",
    error
  );

  loadingScreen.style.display =
    "none";

  if(
    error.code === 1
  ){

    setStatus(
      "📍 Location permission denied. Allow location access for this site."
    );

  }else{

    setStatus(
      "📍 Waiting for GPS..."
    );

  }

}

/* =========================================================
   ROAD NETWORK
========================================================= */

async function loadRoadNetwork(
  lat,
  lon
){

  if(loadingRoads)
    return;

  loadingRoads = true;

  lastRoadLat =
    lat;

  lastRoadLon =
    lon;

  try{

    const ways =
      await getNearbyWays(
        lat,
        lon
      );

    if(!ways.length){

      setStatus(
        "🔎 Looking for mapped roads..."
      );

      loadingRoads =
        false;

      return;

    }

    const nearest =
      findNearestRoadPoint(
        ways,
        lat,
        lon
      );

    if(!nearest){

      setStatus(
        "🔎 No nearby road found yet."
      );

      loadingRoads =
        false;

      return;

    }

    const roadDistance =
      Math.round(
        nearest.distance
      );

    if(
      roadDistance >
      ROAD_NEAR_DISTANCE
    ){

      setStatus(
        `🛣️ Nearest mapped road: ${roadDistance}m away`
      );

      loadingRoads =
        false;

      return;

    }

    /*
     * IMPORTANT:
     *
     * Start from the ACTUAL nearest way.
     * Then only follow ways that are connected
     * to it.
     *
     * This prevents coins appearing on a
     * disconnected nearby trail.
     */

    const network =
      buildConnectedNetwork(
        ways,
        nearest.way
      );

    generateNetworkCoins(
      network,
      nearest
    );

    setStatus(
      `🛣️ Road ${roadDistance}m away • ${coins.length} coins nearby`
    );

  }catch(error){

    console.error(
      "Road error:",
      error
    );

    setStatus(
      "⚠️ Road server busy. Retrying..."
    );

  }

  loadingRoads =
    false;

}


/* =========================================================
   OVERPASS
========================================================= */

async function getNearbyWays(
  lat,
  lon
){

  const latDelta =
    SEARCH_RADIUS /
    111320;

  const lonDelta =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat *
        Math.PI /
        180
      )
    );

  const south =
    lat - latDelta;

  const north =
    lat + latDelta;

  const west =
    lon - lonDelta;

  const east =
    lon + lonDelta;


  let filter = `

    way["highway"]
    (${south},${west},${north},${east});

  `;


  if(
    gameMode ===
    "PUBLIC"
  ){

    filter = `

      way["highway"]
      ["access"!="private"]
      ["access"!="no"]
      ["access"!="customers"]
      ["access"!="permit"]
      (${south},${west},${north},${east});

    `;

  }


  const query = `

    [out:json][timeout:20];

    ${filter}

    out tags geom;

  `;


  for(
    const server of
    OVERPASS_SERVERS
  ){

    try{

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          ()=>{
            controller.abort();
          },
          14000
        );

      const response =
        await fetch(
          server,
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(
                query
              ),

            signal:
              controller.signal

          }
        );

      clearTimeout(
        timeout
      );

      if(
        !response.ok
      )
        continue;

      const json =
        await response.json();

      const ways =
        filterWays(
          json.elements ||
          []
        );

      if(
        ways.length
      )
        return ways;

    }catch(error){

      console.log(
        "Overpass failed:",
        server
      );

    }

  }

  return [];

}


/* =========================================================
   WAY FILTER
========================================================= */

function filterWays(
  elements
){

  const allowedPublic = [

    "footway",
    "path",
    "pedestrian",
    "steps",
    "cycleway",
    "bridleway",
    "living_street",
    "residential",
    "unclassified",
    "service",
    "tertiary",
    "tertiary_link",
    "secondary",
    "secondary_link"

  ];


  const result = [];


  for(
    const e of elements
  ){

    if(
      e.type !== "way" ||
      !e.geometry ||
      e.geometry.length < 2
    )
      continue;


    const tags =
      e.tags || {};


    const highway =
      tags.highway;


    if(!highway)
      continue;


    if(
      gameMode ===
      "PUBLIC"
    ){

      if(
        !allowedPublic
          .includes(
            highway
          )
      )
        continue;

    }else{

      const forbidden = [

        "motorway",
        "motorway_link",
        "trunk",
        "trunk_link"

      ];

      if(
        forbidden.includes(
          highway
        )
      )
        continue;

    }


    result.push({

      id:e.id,

      geometry:
        e.geometry.map(
          p=>({

            lat:Number(
              p.lat
            ),

            lon:Number(
              p.lon
            )

          })
        ),

      tags

    });

  }


  return result;

}


/* =========================================================
   CLOSEST ROAD POINT
========================================================= */

function findNearestRoadPoint(
  ways,
  lat,
  lon
){

  let best =
    null;


  for(
    const way of
    ways
  ){

    for(
      let i=0;
      i<
      way.geometry.length-1;
      i++
    ){

      const a =
        way.geometry[i];

      const b =
        way.geometry[i+1];


      const point =
        closestPointOnSegment(
          lat,
          lon,
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );


      const d =
        distanceMeters(
          lat,
          lon,
          point.lat,
          point.lon
        );


      if(
        !best ||
        d <
        best.distance
      ){

        best = {

          way,

          segmentIndex:i,

          point,

          distance:d

        };

      }

    }

  }


  return best;

}


function closestPointOnSegment(
  lat,
  lon,
  lat1,
  lon1,
  lat2,
  lon2
){

  const cos =
    Math.cos(
      lat *
      Math.PI /
      180
    );


  const x =
    (lon-lon1) *
    111320 *
    cos;


  const y =
    (lat-lat1) *
    111320;


  const dx =
    (lon2-lon1) *
    111320 *
    cos;


  const dy =
    (lat2-lat1) *
    111320;


  const len2 =
    dx*dx +
    dy*dy;


  let t =
    len2 === 0
      ? 0
      : (x*dx+y*dy) /
        len2;


  t =
    Math.max(
      0,
      Math.min(
        1,
        t
      )
    );


  return {

    lat:
      lat1 +
      (lat2-lat1)*t,

    lon:
      lon1 +
      (lon2-lon1)*t

  };

}


/* =========================================================
   CONNECTED ROAD NETWORK
========================================================= */

function buildConnectedNetwork(
  ways,
  startingWay
){

  const network = [];

  const visited =
    new Set();

  const queue =
    [startingWay];


  while(
    queue.length
  ){

    const way =
      queue.shift();


    if(
      visited.has(
        way.id
      )
    )
      continue;


    visited.add(
      way.id
    );


    network.push(
      way
    );


    for(
      const other of
      ways
    ){

      if(
        visited.has(
          other.id
        )
      )
        continue;


      if(
        waysConnected(
          way,
          other
        )
      ){

        queue.push(
          other
        );

      }

    }

  }


  return network;

}


function waysConnected(
  a,
  b
){

  const a1 =
    a.geometry[0];

  const a2 =
    a.geometry[
      a.geometry.length-1
    ];

  const b1 =
    b.geometry[0];

  const b2 =
    b.geometry[
      b.geometry.length-1
    ];


  /*
   * OSM ways don't always have perfectly
   * identical endpoints.
   *
   * 35m makes the connection tolerant enough
   * for mapped intersections while still
   * preventing random nearby roads.
   */

  const limit =
    35;


  return (

    distanceMeters(
      a1.lat,
      a1.lon,
      b1.lat,
      b1.lon
    ) <= limit ||

    distanceMeters(
      a1.lat,
      a1.lon,
      b2.lat,
      b2.lon
    ) <= limit ||

    distanceMeters(
      a2.lat,
      a2.lon,
      b1.lat,
      b1.lon
    ) <= limit ||

    distanceMeters(
      a2.lat,
      a2.lon,
      b2.lat,
      b2.lon
    ) <= limit

  );

}


/* =========================================================
   AUTOMATIC COIN GENERATION
========================================================= */

function maintainCoins(){

  if(
    !lastPosition ||
    !map ||
    !playerData ||
    loadingRoads
  )
    return;


  /*
   * If coins have run out, load a fresh
   * connected road network around the player.
   */

  const available =
    coins.filter(
      c=>!c.collected
    ).length;


  if(
    available <=
    LOW_COIN_COUNT
  ){

    loadRoadNetwork(
      lastPosition.lat,
      lastPosition.lon
    );

  }

}


setInterval(
  maintainCoins,
  COIN_RESPAWN_INTERVAL
);


/* =========================================================
   GENERATE COINS
========================================================= */

function generateNetworkCoins(
  network,
  nearest
){

  /*
   * Don't delete existing coins if there
   * are still enough available.
   */

  const available =
    coins.filter(
      c=>!c.collected
    ).length;


  if(
    available >=
    MAX_COINS
  )
    return;


  const ordered =
    network
      .slice()
      .sort(
        (a,b)=>{

          const da =
            distanceToWay(
              nearest.point,
              a
            );

          const db =
            distanceToWay(
              nearest.point,
              b
            );

          return da-db;

        }
      );


  let generated =
    available;


  /*
   * Always start with the road closest
   * to the actual player.
   */

  for(
    let i=0;
    i<ordered.length &&
    generated<MAX_COINS;
    i++
  ){

    const way =
      ordered[i];


    const points =
      pointsAlongWay(
        way,
        i === 0
          ? nearest.point
          : null,
        i === 0
      );


    for(
      const p of points
    ){

      if(
        generated >=
        MAX_COINS
      )
        break;


      if(
        addCoin(
          p.lat,
          p.lon
        )
      ){

        generated++;

      }

    }

  }

}


/* =========================================================
   WAY DISTANCE
========================================================= */

function distanceToWay(
  point,
  way
){

  let best =
    Infinity;


  for(
    const p of
    way.geometry
  ){

    const d =
      distanceMeters(
        point.lat,
        point.lon,
        p.lat,
        p.lon
      );


    if(
      d <
      best
    )
      best =
        d;

  }


  return best;

}


/* =========================================================
   POINTS ALONG ROAD
========================================================= */

function pointsAlongWay(
  way,
  startingPoint,
  fromNearest
){

  const result = [];

  let geometry =
    way.geometry.slice();


  if(
    fromNearest &&
    startingPoint
  ){

    const first =
      geometry[0];

    const last =
      geometry[
        geometry.length-1
      ];


    const dFirst =
      distanceMeters(
        startingPoint.lat,
        startingPoint.lon,
        first.lat,
        first.lon
      );


    const dLast =
      distanceMeters(
        startingPoint.lat,
        startingPoint.lon,
        last.lat,
        last.lon
      );


    if(
      dLast <
      dFirst
    ){

      geometry.reverse();

    }

  }


  let accumulated =
    0;


  let previous =
    startingPoint ||
    geometry[0];


  for(
    let i=0;
    i<
    geometry.length;
    i++
  ){

    const p =
      geometry[i];


    const d =
      distanceMeters(
        previous.lat,
        previous.lon,
        p.lat,
        p.lon
      );


    accumulated +=
      d;


    if(
      accumulated >=
      COIN_SPACING
    ){

      result.push({

        lat:p.lat,

        lon:p.lon

      });


      accumulated =
        0;

    }


    previous =
      p;

  }


  return result;

}


/* =========================================================
   COIN ID
========================================================= */

function coinId(
  lat,
  lon
){

  return (

    Math.round(
      lat * 100000
    ) +

    "_" +

    Math.round(
      lon * 100000
    )

  );

}


/* =========================================================
   ADD COIN
========================================================= */

function addCoin(
  lat,
  lon
){

  if(
    !map ||
    !playerData
  )
    return false;


  const id =
    coinId(
      lat,
      lon
    );


  /*
   * Never regenerate a coin that the
   * player has permanently collected.
   */

  if(
    playerData
      .collected_coins
      .includes(
        id
      )
  ){

    return false;

  }


  /*
   * Don't stack coins on top of each other.
   */

  for(
    const c of
    coins
  ){

    if(
      !c.collected &&
      distanceMeters(
        lat,
        lon,
        c.lat,
        c.lon
      ) < 30
    ){

      return false;

    }

  }


  const marker =
    L.marker(
      [lat,lon],
      {

        icon:
          L.divIcon({

            className:"",

            html:
              `<div class="coin">🪙</div>`,

            iconSize:[
              34,
              34
            ],

            iconAnchor:[
              17,
              17
            ]

          })

      }
    ).addTo(map);


  coins.push({

    id,

    lat,

    lon,

    marker,

    collected:false

  });


  return true;

}


/* =========================================================
   COLLECT COINS
========================================================= */

function collectNearbyCoins(
  lat,
  lon
){

  for(
    const c of
    coins
  ){

    if(
      c.collected
    )
      continue;


    const d =
      distanceMeters(
        lat,
        lon,
        c.lat,
        c.lon
      );


    if(
      d <=
      COLLECTION_DISTANCE
    ){

      collectCoin(
        c
      );

    }

  }

}


async function collectCoin(
  c
){

  if(
    !playerData ||
    c.collected
  )
    return;


  c.collected =
    true;


  if(
    map.hasLayer(
      c.marker
    )
  ){

    map.removeLayer(
      c.marker
    );

  }


  if(
    !playerData
      .collected_coins
      .includes(
        c.id
      )
  ){

    playerData
      .collected_coins
      .push(
        c.id
      );

  }


  playerData.coins +=
    10;


  playerData.xp +=
    10;


  checkLevel();

  updateCoinDisplay();

  coinSound();

  showToast(
    "🪙 COIN COLLECTED! +10"
  );

  setStatus(
    "🎮 Keep exploring!"
  );


  await savePlayer();


  /*
   * If this was one of the last coins,
   * immediately begin looking for more.
   */

  const remaining =
    coins.filter(
      x=>!x.collected
    ).length;


  if(
    remaining <=
    LOW_COIN_COUNT &&
    lastPosition
  ){

    loadRoadNetwork(
      lastPosition.lat,
      lastPosition.lon
    );

  }

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

  if(!playerData)
    return;


  let required =
    playerData.level *
    100;


  while(
    playerData.xp >=
    required
  ){

    playerData.xp -=
      required;


    playerData.level++;


    showToast(
      `🎉 LEVEL ${playerData.level}!`
    );


    required =
      playerData.level *
      100;

  }

}


/* =========================================================
   DISPLAY
========================================================= */

function updateCoinDisplay(){

  coinsDisplay.textContent =
    `🪙 Coins: ${
      playerData?.coins || 0
    }`;

}


/* =========================================================
   SHOP
========================================================= */

document
  .getElementById(
    "shopButton"
  )
  .onclick =
  function(){

    shopOverlay.style.display =
      "block";

    renderShop();

  };


document
  .getElementById(
    "closeShop"
  )
  .onclick =
  function(){

    shopOverlay.style.display =
      "none";

  };


function renderShop(){

  if(!playerData)
    return;


  shopBalance.textContent =
    `🪙 Coins: ${
      playerData.coins
    }`;


  shopItems.innerHTML =
    "";


  for(
    const [
      id,
      skin
    ]
    of Object.entries(
      SKINS
    )
  ){

    const unlocked =
      playerData
        .unlocked_skins
        .includes(
          id
        );


    const equipped =
      playerData
        .equipped_skin ===
      id;


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "shopItem";


    const preview =
      document.createElement(
        "div"
      );


    preview.className =
      "skinPreview";


    preview.style.background =
      skin.color;


    const info =
      document.createElement(
        "div"
      );


    info.className =
      "skinInfo";


    info.innerHTML = `

      <div class="skinName">
        ${skin.name}
      </div>

      <div class="skinPrice">
        ${
          skin.price === 0
            ? "FREE"
            : "🪙 " +
              skin.price
        }
      </div>

    `;


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "action";


    if(equipped){

      button.textContent =
        "EQUIPPED";

      button.disabled =
        true;

    }else if(unlocked){

      button.textContent =
        "EQUIP";

      button.onclick =
        ()=>{
          equipSkin(id);
        };

    }else if(
      playerData.coins >=
      skin.price
    ){

      button.textContent =
        "BUY";

      button.onclick =
        ()=>{
          buySkin(id);
        };

    }else{

      button.textContent =
        "NEED COINS";

      button.disabled =
        true;

    }


    item.append(
      preview,
      info,
      button
    );


    shopItems.appendChild(
      item
    );

  }

}


async function buySkin(
  id
){

  const skin =
    SKINS[id];


  if(
    !skin ||
    !playerData
  )
    return;


  if(
    playerData
      .unlocked_skins
      .includes(id)
  )
    return;


  if(
    playerData.coins <
    skin.price
  ){

    showToast(
      "❌ Not enough coins"
    );

    return;

  }


  playerData.coins -=
    skin.price;


  playerData
    .unlocked_skins
    .push(id);


  playerData.equipped_skin =
    id;


  await savePlayer();


  updateCoinDisplay();

  updatePlayerSkin();

  renderShop();


  showToast(
    `🎨 ${skin.name} unlocked!`
  );

}


async function equipSkin(
  id
){

  if(
    !playerData ||
    !playerData
      .unlocked_skins
      .includes(id)
  )
    return;


  playerData.equipped_skin =
    id;


  await savePlayer();

  updatePlayerSkin();

  renderShop();

}


function updatePlayerSkin(){

  if(!playerMarker)
    return;


  const skin =
    SKINS[
      playerData?.equipped_skin
    ] ||
    SKINS.blue;


  playerMarker.setIcon(

    L.divIcon({

      className:"",

      html:
        `<div class="player"
          style="--player-color:${skin.color}">
        </div>`,

      iconSize:[
        28,
        28
      ],

      iconAnchor:[
        14,
        14
      ]

    })

  );

}
