<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GPS Coin</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#080b10;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  position:fixed;
  inset:0;
  z-index:100000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at 50% 30%,#17324a,#080b10 70%);
  color:white;
}

.loginBox{
  width:min(420px,100%);
  text-align:center;
}

.logo{
  font-size:70px;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  50%{transform:translateY(-10px)}
}

.loginBox h1{
  margin:5px 0;
  font-size:38px;
  font-weight:900;
}

.loginBox p{
  color:#9ca9b8;
  margin-bottom:25px;
}

#emailInput{
  width:100%;
  padding:16px;
  border:1px solid #354352;
  border-radius:14px;
  background:#151d26;
  color:white;
  font-size:16px;
  outline:none;
}

.mainButton{
  width:100%;
  margin-top:12px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#008cff;
  color:white;
  font-size:16px;
  font-weight:800;
}

#loginMessage{
  margin-top:15px;
  min-height:20px;
  color:#b9c5d2;
}

/* =========================
   MODE SCREEN
========================= */

#modeScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at center,#172333,#080b10 72%);
  color:white;
}

.modeBox{
  width:min(480px,100%);
  text-align:center;
}

.modeBox h1{
  font-size:34px;
  margin-bottom:8px;
}

.modeBox p{
  color:#9ca9b8;
}

.modeButtons{
  display:flex;
  gap:12px;
  margin-top:25px;
}

.modeChoice{
  flex:1;
  padding:22px 12px;
  border-radius:18px;
  border:1px solid #354352;
  background:#151d26;
  color:white;
  font-size:15px;
}

.modeChoice:active{
  transform:scale(.97);
}

.modeIcon{
  font-size:35px;
  margin-bottom:10px;
}

/* =========================
   LOADING
========================= */

#loadingScreen{
  position:fixed;
  inset:0;
  z-index:99998;
  display:none;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#172333,#080b10 70%);
  color:white;
  transition:.5s;
}

#loadingScreen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loadingContent{
  width:min(430px,90%);
  text-align:center;
}

.loadingLogo{
  font-size:65px;
  animation:float 2s infinite ease-in-out;
}

.loadingTitle{
  font-size:36px;
  font-weight:900;
  margin:5px;
}

.loadingSub{
  color:#9ca9b8;
}

.loadingBar{
  height:7px;
  margin-top:28px;
  border-radius:20px;
  background:#202a35;
  overflow:hidden;
}

#loadingBar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#00aaff,#66ddff);
  box-shadow:0 0 15px #00aaff;
  transition:.3s;
}

#loadingText{
  margin-top:14px;
  color:#b9c5d2;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  z-index:2000;
  display:flex;
  gap:7px;
  pointer-events:none;
}

.hudBox{
  min-height:44px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:rgba(8,13,19,.94);
  color:white;
  font-weight:bold;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
  pointer-events:auto;
}

#coinsDisplay{
  flex:1;
  justify-content:flex-start;
}

.hudButton{
  width:46px;
  cursor:pointer;
}

/* =========================
   STATUS
========================= */

#status{
  position:absolute;
  left:12px;
  right:12px;
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:2000;
  padding:12px;
  border-radius:14px;
  background:rgba(8,13,19,.94);
  color:white;
  text-align:center;
  font-size:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}

/* =========================
   PLAYER
========================= */

.player{
  width:24px;
  height:24px;
  border:3px solid white;
  border-radius:50%;
  background:#00aaff;
  box-shadow:
    0 0 8px #00aaff,
    0 0 20px #00aaff,
    0 0 35px #00aaff;
}

/* =========================
   COIN
========================= */

.coin{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:3px solid #fff4a3;
  background:radial-gradient(
    circle at 35% 30%,
    #fffbd0,
    #ffe44d 25%,
    #ffd000 55%,
    #f0a000 80%,
    #c87800
  );
  box-shadow:
    0 0 8px #ffd700,
    0 0 18px #ffb000,
    0 0 30px rgba(255,190,0,.7);
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.15)}
}

/* =========================
   DISTANCE
========================= */

#roadDistance{
  position:absolute;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  z-index:1900;
  padding:8px 13px;
  border-radius:20px;
  background:rgba(8,13,19,.92);
  color:white;
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

/* =========================
   OVERLAYS
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:5000;
  padding:20px;
  background:rgba(0,0,0,.8);
  overflow:auto;
}

.panel{
  width:min(450px,100%);
  margin:40px auto;
  padding:22px;
  border-radius:20px;
  background:#151a20;
  color:white;
}

.panelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  background:#333;
  color:white;
}

.shopItem{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:12px;
  padding:14px;
  border-radius:14px;
  background:#20262d;
}

.skinPreview{
  width:42px;
  height:42px;
  border:4px solid white;
  border-radius:50%;
}

.skinInfo{
  flex:1;
}

.shopAction{
  border:0;
  border-radius:10px;
  padding:9px 12px;
  background:#0077cc;
  color:white;
  font-weight:bold;
}

.shopAction:disabled{
  opacity:.5;
}

.accountEmail{
  margin:15px 0;
  padding:12px;
  border-radius:12px;
  background:#20262d;
  word-break:break-all;
}

.accountButton{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#0077cc;
  color:white;
  font-weight:bold;
}

.danger{
  background:#a83232;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  z-index:10000;
  transform:translate(-50%,20px);
  padding:13px 18px;
  border-radius:14px;
  background:#101820;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-weight:bold;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* Keep Leaflet zoom away from HUD */
.leaflet-top{
  top:130px!important;
}

.leaflet-left{
  left:12px!important;
}

.leaflet-control-zoom a{
  width:40px!important;
  height:40px!important;
  line-height:40px!important;
  font-size:20px!important;
}

.leaflet-control-attribution{
  font-size:9px;
}
</style>
</head>

========================= -->

  </div>

      id="accountEmail"

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   SETTINGS
========================================================= */

/*
  This is intentionally fairly large.

  You do NOT have to stand on the road.
  If a road is within this distance,
  the game searches for it and builds
  coins before you reach it.
*/

const SEARCH_RADIUS = 1200;

/*
  Maximum distance from player to a road
  before we give up.
*/

const MAX_ROAD_DISTANCE = 300;

/*
  Distance between coins.
*/

const COIN_SPACING = 60;

/*
  How close you need to get to collect.
*/

const COLLECTION_DISTANCE = 18;

/*
  Recalculate route after moving this far.
*/

const REFRESH_DISTANCE = 80;


/* =========================================================
   OVERPASS
========================================================= */

const OVERPASS_SERVERS = [

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter"

];


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let player = null;

let map = null;

let playerMarker = null;

let watchId = null;

let currentLat = null;

let currentLon = null;

let lastRouteLat = null;

let lastRouteLon = null;

let routePoints = [];

let coins = [];

let loadingRoute = false;

let gameMode = "PUBLIC";

let firstGPS = true;


/* =========================================================
   DOM
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const modeScreen =
  document.getElementById("modeScreen");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingBar =
  document.getElementById("loadingBar");

const loadingText =
  document.getElementById("loadingText");

const loginMessage =
  document.getElementById("loginMessage");

const emailInput =
  document.getElementById("emailInput");

const coinsDisplay =
  document.getElementById("coinsDisplay");

const status =
  document.getElementById("status");

const roadDistance =
  document.getElementById("roadDistance");


/* =========================================================
   LOADING
========================================================= */

function setLoading(text, percent){

  loadingText.textContent = text;

  loadingBar.style.width =
    percent + "%";

}


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginButton")
  .onclick = async () => {

    const email =
      emailInput.value.trim();

    if(!email){

      loginMessage.textContent =
        "Enter your email first.";

      return;

    }

    loginMessage.textContent =
      "Sending sign-in link...";

    try{

      /*
        IMPORTANT:
        The redirect uses the CURRENT page.
        This prevents localhost redirect problems.
      */

      const redirect =
        window.location.origin +
        window.location.pathname;

      const {
        error
      } =
      await supabase.auth.signInWithOtp({

        email,

        options:{
          emailRedirectTo: redirect
        }

      });

      if(error)
        throw error;

      loginMessage.textContent =
        "✅ Check your email for the sign-in link.";

    }catch(error){

      console.error(error);

      loginMessage.textContent =
        "❌ " + error.message;

    }

  };


/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

  try{

    const {
      data
    } =
    await supabase.auth.getSession();

    if(data.session?.user){

      await signedIn(
        data.session.user
      );

    }else{

      loginScreen.style.display =
        "flex";

    }

  }catch(error){

    console.error(error);

    loginScreen.style.display =
      "flex";

  }

}


supabase.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if(
      event === "SIGNED_IN" &&
      session?.user
    ){

      await signedIn(
        session.user
      );

    }

    if(
      event === "SIGNED_OUT"
    ){

      location.reload();

    }

  }
);


/* =========================================================
   SIGNED IN
========================================================= */

async function signedIn(user){

  currentUser = user;

  loginScreen.style.display =
    "none";

  await loadPlayer();

  modeScreen.style.display =
    "flex";

}


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

  const {
    data,
    error
  } =
  await supabase
    .from("players")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();


  if(error){

    console.error(error);

    /*
      If the player table exists but the
      row doesn't, create it.
    */

    throw error;

  }


  if(data){

    player = data;

  }else{

    const newPlayer = {

      id: currentUser.id,

      username:
        currentUser.email?.split("@")[0] ||
        "Player",

      coins:0,

      xp:0,

      level:1,

      unlocked_skins:["blue"],

      equipped_skin:"blue",

      collected_coins:[]

    };


    const {
      data:newData,
      error:newError
    } =
    await supabase
      .from("players")
      .insert(newPlayer)
      .select()
      .single();


    if(newError)
      throw newError;

    player = newData;

  }


  updateCoins();

}


/* =========================================================
   MODE
========================================================= */

document
  .getElementById("publicButton")
  .onclick = () => {

    chooseMode("PUBLIC");

  };


document
  .getElementById("unlimitedButton")
  .onclick = () => {

    chooseMode("UNLIMITED");

  };


function chooseMode(mode){

  gameMode = mode;

  modeScreen.style.display =
    "none";

  loadingScreen.style.display =
    "flex";

  setLoading(
    "Requesting your location...",
    20
  );

  startGPS();

}


/* =========================================================
   GPS
========================================================= */

function startGPS(){

  if(watchId !== null)
    return;


  if(!navigator.geolocation){

    setLoading(
      "GPS isn't supported by this browser.",
      100
    );

    status.textContent =
      "❌ GPS unavailable.";

    return;

  }


  /*
    This immediately triggers the browser's
    location permission prompt.
  */

  navigator.geolocation.getCurrentPosition(

    position => {

      handleLocation(
        position
      );

    },

    error => {

      console.error(error);

      status.textContent =
        "📍 " + gpsError(error);

      setLoading(
        "Waiting for GPS permission...",
        30
      );

    },

    {

      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:0

    }

  );


  watchId =
    navigator.geolocation.watchPosition(

      position => {

        handleLocation(
          position
        );

      },

      error => {

        console.error(
          "GPS watch:",
          error
        );

        status.textContent =
          "📍 " + gpsError(error);

      },

      {

        enableHighAccuracy:true,

        timeout:20000,

        maximumAge:2000

      }

    );

}


/* =========================================================
   LOCATION
========================================================= */

function handleLocation(position){

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;


  currentLat = lat;

  currentLon = lon;


  if(firstGPS){

    firstGPS = false;

    setLoading(
      "Location found!",
      55
    );

    createMap(
      lat,
      lon
    );

    setTimeout(
      () => {

        loadingScreen.classList.add(
          "hidden"
        );

      },
      600
    );

  }


  updatePlayerMarker(
    lat,
    lon
  );


  checkCollection(
    lat,
    lon
  );


  /*
    IMPORTANT:
    Recalculate even while you're
    still AWAY from the road.

    We use 80m movement instead of
    waiting until the player reaches it.
  */

  if(
    lastRouteLat === null ||
    distance(
      lat,
      lon,
      lastRouteLat,
      lastRouteLon
    ) >= REFRESH_DISTANCE
  ){

    loadConnectedRoad(
      lat,
      lon
    );

  }


  updateRoadDistance(
    lat,
    lon
  );

}


/* =========================================================
   MAP
========================================================= */

function createMap(lat,lon){

  if(map)
    return;


  map =
    L.map("map",{

      zoomControl:true

    }).setView(
      [lat,lon],
      17
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

      attribution:
        "© OpenStreetMap contributors",

      maxZoom:20

    }
  ).addTo(map);


  playerMarker =
    L.marker(
      [lat,lon],
      {

        icon:
          L.divIcon({

            className:"",

            html:
              '<div class="player"></div>',

            iconSize:[24,24],

            iconAnchor:[12,12]

          })

      }
    ).addTo(map);

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayerMarker(lat,lon){

  if(!playerMarker)
    return;

  playerMarker.setLatLng(
    [lat,lon]
  );

}


/* =========================================================
   LOAD CONNECTED ROAD
========================================================= */

async function loadConnectedRoad(
  lat,
  lon
){

  if(
    loadingRoute ||
    !map
  )
    return;


  loadingRoute = true;


  lastRouteLat = lat;

  lastRouteLon = lon;


  status.textContent =
    "🛣️ Finding your nearest connected road...";


  try{

    const ways =
      await getWays(
        lat,
        lon
      );


    if(!ways.length){

      status.textContent =
        "🔎 No mapped roads nearby.";

      loadingRoute = false;

      return;

    }


    /*
      Find the road network nearest
      to the player.

      We DON'T simply pick the closest
      individual road.

      Instead we score connected
      networks so a random disconnected
      path nearby is less likely to win.
    */

    const network =
      findBestNetwork(
        ways,
        lat,
        lon
      );


    if(!network){

      status.textContent =
        "🔎 Couldn't find a connected road.";

      loadingRoute = false;

      return;

    }


    if(
      network.distance >
      MAX_ROAD_DISTANCE
    ){

      status.textContent =
        "🛣️ Nearest road: " +
        Math.round(network.distance) +
        "m";

      loadingRoute = false;

      return;

    }


    /*
      Build BOTH directions from the
      nearest point.

      This gives you more coins instead
      of stopping after one road segment.
    */

    const route =
      buildRoute(
        ways,
        network
      );


    if(!route.length){

      status.textContent =
        "🔎 Road found, but route couldn't be built.";

      loadingRoute = false;

      return;

    }


    routePoints =
      route;


    clearCoins();


    /*
      Generate coins immediately.
      You can still be hundreds of meters
      away from the road.
    */

    for(
      const point of route
    ){

      createCoin(
        point.lat,
        point.lon
      );

    }


    status.textContent =
      "🪙 " +
      coins.length +
      " coins loaded on your connected road";


    updateRoadDistance(
      lat,
      lon
    );


  }catch(error){

    console.error(
      "Road error:",
      error
    );

    status.textContent =
      "⚠️ Couldn't load roads. Retrying...";

  }


  loadingRoute = false;

}


/* =========================================================
   GET ROADS
========================================================= */

async function getWays(
  lat,
  lon
){

  const latOffset =
    SEARCH_RADIUS / 111320;

  const lonOffset =
    SEARCH_RADIUS /
    (
      111320 *
      Math.cos(
        lat * Math.PI / 180
      )
    );


  const south =
    lat - latOffset;

  const north =
    lat + latOffset;

  const west =
    lon - lonOffset;

  const east =
    lon + lonOffset;


  let highwayFilter;


  if(gameMode === "PUBLIC"){

    highwayFilter = `
      ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|tertiary|unclassified|service"]
    `;

  }else{

    highwayFilter = `
      ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential|tertiary|secondary|unclassified|service"]
    `;

  }


  const query = `

    [out:json]
    [timeout:15];

    way
      ${highwayFilter}
      (${south},${west},${north},${east});

    out tags geom;

  `;


  for(
    const server of
    OVERPASS_SERVERS
  ){

    try{

      const response =
        await fetch(
          server,
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "data=" +
              encodeURIComponent(query)

          }
        );


      if(!response.ok)
        throw new Error(
          "HTTP " +
          response.status
        );


      const data =
        await response.json();


      return data.elements
        .filter(
          validWay
        )
        .map(
          e => ({

            id:e.id,

            geometry:e.geometry,

            tags:e.tags || {}

          })
        );


    }catch(error){

      console.log(
        "Overpass failed:",
        error
      );

    }

  }


  return [];

}


/* =========================================================
   VALID WAY
========================================================= */

function validWay(element){

  if(
    element.type !== "way" ||
    !element.geometry ||
    element.geometry.length < 2
  )
    return false;


  const tags =
    element.tags || {};


  const access =
    String(
      tags.access || ""
    ).toLowerCase();


  if(
    access === "private" ||
    access === "no" ||
    access === "permit" ||
    access === "customers"
  )
    return false;


  return true;

}


/* =========================================================
   BEST NETWORK
========================================================= */

function findBestNetwork(
  ways,
  lat,
  lon
){

  let candidates = [];


  for(
    const way of ways
  ){

    for(
      let i=0;
      i<way.geometry.length-1;
      i++
    ){

      const a =
        way.geometry[i];

      const b =
        way.geometry[i+1];


      const nearest =
        nearestPointOnSegment(
          lat,
          lon,
          a.lat,
          a.lon,
          b.lat,
          b.lon
        );


      candidates.push({

        way,

        index:i,

        point:{
          lat:nearest.lat,
          lon:nearest.lon
        },

        distance:
          nearest.distance

      });

    }

  }


  candidates.sort(
    (a,b) =>
      a.distance -
      b.distance
  );


  /*
    Check the closest candidates and
    prefer one that has nearby connected
    segments.
  */

  const limit =
    Math.min(
      candidates.length,
      80
    );


  let best = null;

  let bestScore = Infinity;


  for(
    let i=0;
    i<limit;
    i++
  ){

    const candidate =
      candidates[i];


    const connections =
      countConnections(
        ways,
        candidate.point,
        candidate.way.id
      );


    /*
      Small score is better.

      Distance matters most.
      Connectedness breaks ties.
    */

    const score =
      candidate.distance -
      Math.min(
        connections * 8,
        40
      );


    if(score < bestScore){

      bestScore =
        score;

      best =
        candidate;

    }

  }


  return best;

}


/* =========================================================
   CONNECTION COUNT
========================================================= */

function countConnections(
  ways,
  point,
  currentId
){

  let count = 0;


  for(
    const way of ways
  ){

    if(
      way.id === currentId
    )
      continue;


    const first =
      way.geometry[0];

    const last =
      way.geometry[
        way.geometry.length-1
      ];


    if(
      distance(
        point.lat,
        point.lon,
        first.lat,
        first.lon
      ) < 35 ||
      distance(
        point.lat,
        point.lon,
        last.lat,
        last.lon
      ) < 35
    ){

      count++;

    }

  }


  return count;

}


/* =========================================================
   BUILD ROUTE
========================================================= */

function buildRoute(
  ways,
  start
){

  const result = [];

  /*
    Start directly on the actual nearest
    point of the road.
  */

  result.push({
    lat:start.point.lat,
    lon:start.point.lon
  });


  /*
    Walk forward.
  */

  const forward =
    walkNetwork(
      ways,
      start,
      1,
      1200
    );


  /*
    Walk backward.
  */

  const backward =
    walkNetwork(
      ways,
      start,
      -1,
      1200
    );


  /*
    Put backward coins first,
    then the player's nearest point,
    then forward coins.
  */

  backward.reverse();

  result.push(...backward);

  result.push(...forward);


  /*
    Remove points that are too close.
  */

  const cleaned = [];


  for(
    const point of result
  ){

    if(!cleaned.length){

      cleaned.push(point);

      continue;

    }


    const last =
      cleaned[
        cleaned.length-1
      ];


    if(
      distance(
        last.lat,
        last.lon,
        point.lat,
        point.lon
      ) >= COIN_SPACING
    ){

      cleaned.push(point);

    }

  }


  return cleaned;

}


/* =========================================================
   WALK NETWORK
========================================================= */

function walkNetwork(
  ways,
  start,
  direction,
  maxDistance
){

  const result = [];

  let way =
    start.way;

  let index =
    start.index +
    (direction === 1 ? 1 : 0);

  let previous =
    start.point;

  let accumulated = 0;

  let total = 0;

  const visited =
    new Set();


  while(
    total < maxDistance
  ){

    if(
      index < 0 ||
      index >= way.geometry.length
    ){

      const endpoint =
        direction === 1
          ? way.geometry[
              way.geometry.length-1
            ]
          : way.geometry[0];


      const next =
        findConnectedWay(
          ways,
          endpoint,
          way.id
        );


      if(!next)
        break;


      const key =
        way.id +
        ":" +
        index;


      if(visited.has(key))
        break;


      visited.add(key);


      way =
        next.way;

      index =
        next.index +
        (direction === 1 ? 1 : 0);

      continue;

    }


    const point =
      way.geometry[index];


    const d =
      distance(
        previous.lat,
        previous.lon,
        point.lat,
        point.lon
      );


    accumulated += d;

    total += d;


    if(
      accumulated >= COIN_SPACING
    ){

      result.push({

        lat:point.lat,

        lon:point.lon

      });

      accumulated = 0;

    }


    previous = point;

    index +=
      direction;

  }


  return result;

}


/* =========================================================
   CONNECTED WAY
========================================================= */

function findConnectedWay(
  ways,
  endpoint,
  currentId
){

  let best = null;

  let bestDistance = 35;


  for(
    const way of ways
  ){

    if(
      way.id === currentId
    )
      continue;


    const first =
      way.geometry[0];

    const last =
      way.geometry[
        way.geometry.length-1
      ];


    const d1 =
      distance(
        endpoint.lat,
        endpoint.lon,
        first.lat,
        first.lon
      );


    const d2 =
      distance(
        endpoint.lat,
        endpoint.lon,
        last.lat,
        last.lon
      );


    if(d1 < bestDistance){

      bestDistance = d1;

      best = {

        way,

        index:0,

        direction:1

      };

    }


    if(d2 < bestDistance){

      bestDistance = d2;

      best = {

        way,

        index:
          way.geometry.length-1,

        direction:-1

      };

    }

  }


  return best;

}


/* =========================================================
   NEAREST POINT ON ROAD SEGMENT
========================================================= */

function nearestPointOnSegment(
  pLat,
  pLon,
  aLat,
  aLon,
  bLat,
  bLon
){

  const cos =
    Math.cos(
      pLat * Math.PI / 180
    );


  const x1 =
    aLon * cos;

  const y1 =
    aLat;


  const x2 =
    bLon * cos;

  const y2 =
    bLat;


  const x =
    pLon * cos;

  const y =
    pLat;


  const dx =
    x2-x1;

  const dy =
    y2-y1;


  let t =
    (
      (x-x1)*dx +
      (y-y1)*dy
    ) /
    (
      dx*dx +
      dy*dy
    );


  t =
    Math.max(
      0,
      Math.min(
        1,
        t
      )
    );


  const lat =
    aLat +
    t*(bLat-aLat);

  const lon =
    aLon +
    t*(bLon-aLon);


  return {

    lat,

    lon,

    distance:
      distance(
        pLat,
        pLon,
        lat,
        lon
      )

  };

}


/* =========================================================
   COINS
========================================================= */

function createCoin(
  lat,
  lon
){

  if(!map)
    return;


  const id =
    coinId(
      lat,
      lon
    );


  /*
    Don't respawn a coin that the player
    already collected.
  */

  if(
    player &&
    Array.isArray(
      player.collected_coins
    ) &&
    player.collected_coins.includes(id)
  )
    return;


  /*
    Avoid duplicate coins.
  */

  for(
    const coin of coins
  ){

    if(
      distance(
        lat,
        lon,
        coin.lat,
        coin.lon
      ) < 30
    )
      return;

  }


  const marker =
    L.marker(
      [lat,lon],
      {

        icon:
          L.divIcon({

            className:"",

            html:
              '<div class="coin">🪙</div>',

            iconSize:[30,30],

            iconAnchor:[15,15]

          })

      }
    ).addTo(map);


  coins.push({

    id,

    lat,

    lon,

    marker

  });

}


/* =========================================================
   CLEAR COINS
========================================================= */

function clearCoins(){

  if(!map)
    return;


  for(
    const coin of coins
  ){

    if(
      map.hasLayer(
        coin.marker
      )
    ){

      map.removeLayer(
        coin.marker
      );

    }

  }


  coins = [];

}


/* =========================================================
   COLLECTION
========================================================= */

function checkCollection(
  lat,
  lon
){

  for(
    const coin of [...coins]
  ){

    if(
      distance(
        lat,
        lon,
        coin.lat,
        coin.lon
      ) <= COLLECTION_DISTANCE
    ){

      collectCoin(
        coin
      );

    }

  }

}


async function collectCoin(coin){

  if(!player)
    return;


  /*
    Prevent double collection.
  */

  const already =
    player.collected_coins
      ?.includes(
        coin.id
      );


  if(already)
    return;


  if(
    map &&
    map.hasLayer(
      coin.marker
    )
  ){

    map.removeLayer(
      coin.marker
    );

  }


  coins =
    coins.filter(
      c => c.id !== coin.id
    );


  if(
    !Array.isArray(
      player.collected_coins
    )
  ){

    player.collected_coins = [];

  }


  player.collected_coins.push(
    coin.id
  );


  player.coins =
    Number(
      player.coins || 0
    ) + 10;


  player.xp =
    Number(
      player.xp || 0
    ) + 10;


  checkLevel();

  updateCoins();

  showToast(
    "🪙 COIN COLLECTED! +10"
  );


  await savePlayer();

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

  const needed =
    Number(
      player.level || 1
    ) * 100;


  if(
    player.xp >= needed
  ){

    player.xp -= needed;

    player.level =
      Number(
        player.level || 1
      ) + 1;


    showToast(
      "🎉 LEVEL " +
      player.level +
      "!"
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

async function savePlayer(){

  if(!player)
    return;


  const {
    error
  } =
  await supabase
    .from("players")
    .update({

      coins:
        player.coins,

      xp:
        player.xp,

      level:
        player.level,

      unlocked_skins:
        player.unlocked_skins,

      equipped_skin:
        player.equipped_skin,

      collected_coins:
        player.collected_coins,

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      player.id
    );


  if(error)
    console.error(
      "Save error:",
      error
    );

}


/* =========================================================
   COIN DISPLAY
========================================================= */

function updateCoins(){

  coinsDisplay.textContent =
    "🪙 Coins: " +
    Number(
      player?.coins || 0
    );

}


/* =========================================================
   ROAD DISTANCE
========================================================= */

function updateRoadDistance(
  lat,
  lon
){

  if(!routePoints.length){

    roadDistance.textContent =
      "📍 Finding nearby road...";

    return;

  }


  let closest =
    Infinity;


  for(
    const point of routePoints
  ){

    const d =
      distance(
        lat,
        lon,
        point.lat,
        point.lon
      );


    if(d < closest)
      closest = d;

  }


  if(
    closest < 10
  ){

    roadDistance.textContent =
      "🛣️ You are on the route";

  }else{

    roadDistance.textContent =
      "🛣️ Route: " +
      Math.round(
        closest
      ) +
      "m away";

  }

}


/* =========================================================
   COIN ID
========================================================= */

function coinId(
  lat,
  lon
){

  return (
    Math.round(
      lat * 100000
    ) +
    "_" +
    Math.round(
      lon * 100000
    )
  );

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 *
    Math.PI /
    180;

  const p2 =
    lat2 *
    Math.PI /
    180;

  const dLat =
    (
      lat2-lat1
    ) *
    Math.PI /
    180;

  const dLon =
    (
      lon2-lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dLon/2)**2;


  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


/* =========================================================
   GPS ERROR
========================================================= */

function gpsError(error){

  if(
    error.code === 1
  )
    return "Location permission denied. Enable Location for this site.";

  if(
    error.code === 2
  )
    return "Location unavailable.";

  if(
    error.code === 3
  )
    return "GPS timed out. Retrying...";

  return "Couldn't get your location.";

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================================
   SHOP
========================================================= */

const SKINS = {

  blue:{
    name:"Blue",
    color:"#00aaff",
    price:0
  },

  red:{
    name:"Red",
    color:"#ff3030",
    price:50
  },

  green:{
    name:"Green",
    color:"#22dd55",
    price:100
  },

  purple:{
    name:"Purple",
    color:"#aa55ff",
    price:150
  },

  gold:{
    name:"Gold",
    color:"#ffd000",
    price:250
  },

  pink:{
    name:"Pink",
    color:"#ff4fa3",
    price:350
  }

};


document
  .getElementById("shopButton")
  .onclick = () => {

    document
      .getElementById("shopOverlay")
      .style.display = "block";

    renderShop();

  };


document
  .getElementById("closeShop")
  .onclick = () => {

    document
      .getElementById("shopOverlay")
      .style.display = "none";

  };


function renderShop(){

  const items =
    document.getElementById(
      "shopItems"
    );


  const balance =
    document.getElementById(
      "shopBalance"
    );


  balance.textContent =
    "🪙 Coins: " +
    player.coins;


  items.innerHTML = "";


  for(
    const [
      id,
      skin
    ] of Object.entries(SKINS)
  ){

    const unlocked =
      player.unlocked_skins
        ?.includes(id);


    const equipped =
      player.equipped_skin === id;


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "shopItem";


    const preview =
      document.createElement(
        "div"
      );


    preview.className =
      "skinPreview";


    preview.style.background =
      skin.color;


    const info =
      document.createElement(
        "div"
      );


    info.className =
      "skinInfo";


    info.innerHTML =
      `<b>${skin.name}</b><br>
       <span style="color:#ffd700">
       ${skin.price ? "🪙 "+skin.price : "FREE"}
       </span>`;


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "shopAction";


    if(equipped){

      button.textContent =
        "EQUIPPED";

      button.disabled = true;

    }else if(unlocked){

      button.textContent =
        "EQUIP";

      button.onclick =
        () => equipSkin(id);

    }else if(
      player.coins >= skin.price
    ){

      button.textContent =
        "BUY";

      button.onclick =
        () => buySkin(id);

    }else{

      button.textContent =
        "NEED COINS";

      button.disabled = true;

    }


    item.append(
      preview,
      info,
      button
    );


    items.appendChild(
      item
    );

  }

}


async function buySkin(id){

  const skin =
    SKINS[id];


  if(
    !skin ||
    player.coins < skin.price ||
    player.unlocked_skins.includes(id)
  )
    return;


  player.coins -=
    skin.price;


  player.unlocked_skins.push(
    id
  );


  player.equipped_skin =
    id;


  await savePlayer();

  updateCoins();

  renderShop();

  showToast(
    "🎨 " +
    skin.name +
    " unlocked!"
  );

}


async function equipSkin(id){

  if(
    !player.unlocked_skins.includes(id)
  )
    return;


  player.equipped_skin =
    id;


  await savePlayer();

  renderShop();

  showToast(
    "🎨 " +
    SKINS[id].name +
    " equipped!"
  );

}
