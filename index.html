<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* =========================
       HUD
       ========================= */

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      display: flex;
      gap: 10px;

      font-family: Arial, sans-serif;
    }

    .hudBox {
      background: rgba(10,15,20,0.94);

      color: white;

      padding: 10px 14px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.4);

      font-weight: bold;
    }

    #coins {
      flex: 1;
    }

    #mode {
      cursor: pointer;
      user-select: none;
    }

    /* =========================
       STATUS
       ========================= */

    #status {
      position: absolute;

      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      background: rgba(10,15,20,0.94);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;
    }

    /* =========================
       PLAYER
       ========================= */

    .player {
      width: 22px;
      height: 22px;

      background: #00aaff;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px #00aaff,
        0 0 18px #00aaff;
    }

    /* =========================
       COINS
       ========================= */

    .coin {
      width: 28px;
      height: 28px;

      background: radial-gradient(
        circle at 35% 35%,
        #fffbd0 0%,
        #ffe44d 25%,
        #ffd000 55%,
        #f0a000 80%,
        #c87800 100%
      );

      border: 3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255,190,0,0.7);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;

      animation: coinPulse 1.4s infinite;
    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>

</head>

<body>


  <!-- HUD -->

  <div id="hud">

    <div
      class="hudBox"
      id="coins"
    >
      🪙 Coins: 0
    </div>

    <div
      class="hudBox"
      id="mode"
    >
      🌎 PUBLIC
    </div>

  </div>


  <!-- STATUS -->

  <div id="status">
    📍 Finding your location...
  </div>


  <!-- MAP -->

  <div id="map"></div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* =====================================================
       GAME VARIABLES
       ===================================================== */

    let map = null;

    let player = null;

    let coins = [];

    let coinCount = 0;

    let gameMode = "PUBLIC";

    let lastLatitude = null;

    let lastLongitude = null;

    let loadingCoins = false;


    /* =====================================================
       SETTINGS
       ===================================================== */

    const SEARCH_DISTANCE_METERS = 700;

    const COLLECTION_DISTANCE = 15;

    const COIN_VALUE = 10;

    const COIN_REFRESH_DISTANCE = 150;

    /*
      Main trail.
    */

    const MAIN_COINS = 5;

    const MAIN_SPACING = 70;

    /*
      Mini branch.
    */

    const BRANCH_COINS = 3;

    const BRANCH_SPACING = 60;



    /* =====================================================
       OVERPASS SERVERS
       ===================================================== */

    const OVERPASS_SERVERS = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];



    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(
      latitude,
      longitude
    ) {


      /*
        IMPORTANT:

        Map centers only ONCE.
      */

      map =
        L.map("map").setView(

          [
            latitude,
            longitude
          ],

          17

        );


      /*
        OSM tiles.
      */

      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

          attribution:
            "© OpenStreetMap contributors"

        }

      ).addTo(map);


      /*
        Player.
      */

      const playerIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="player"></div>',

          iconSize:
            [28,28],

          iconAnchor:
            [14,14]

        });


      player =
        L.marker(

          [
            latitude,
            longitude
          ],

          {

            icon:
              playerIcon

          }

        ).addTo(map);


      lastLatitude =
        latitude;

      lastLongitude =
        longitude;


      /*
        Generate paths.
      */

      loadGamePaths(

        latitude,

        longitude

      );

    }



    /* =====================================================
       GPS
       ===================================================== */

    function updateLocation(
      position
    ) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      /*
        First GPS reading.
      */

      if (!map) {

        startGame(

          latitude,

          longitude

        );

        return;

      }


      /*
        Move player only.

        NO map.setView().
      */

      player.setLatLng([

        latitude,

        longitude

      ]);


      /*
        Check coins.
      */

      checkCoinCollection(

        latitude,

        longitude

      );


      /*
        Refresh trails after
        moving 150 meters.
      */

      if (

        lastLatitude !== null &&

        lastLongitude !== null

      ) {


        const moved =
          getDistanceMeters(

            lastLatitude,

            lastLongitude,

            latitude,

            longitude

          );


        if (
          moved >=
          COIN_REFRESH_DISTANCE
        ) {


          lastLatitude =
            latitude;

          lastLongitude =
            longitude;


          loadGamePaths(

            latitude,

            longitude

          );

        }

      }

    }



    /* =====================================================
       LOAD OSM
       ===================================================== */

    async function loadGamePaths(

      latitude,

      longitude

    ) {


      if (loadingCoins) {
        return;
      }


      loadingCoins = true;


      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Looking for paths...";


      /*
        Remove old coins.
      */

      removeUncollectedCoins();


      /*
        Bounding box.
      */

      const latOffset =
        SEARCH_DISTANCE_METERS /
        111320;


      const lonOffset =
        SEARCH_DISTANCE_METERS /
        (
          111320 *
          Math.cos(
            latitude *
            Math.PI /
            180
          )
        );


      const south =
        latitude -
        latOffset;


      const north =
        latitude +
        latOffset;


      const west =
        longitude -
        lonOffset;


      const east =
        longitude +
        lonOffset;


      /*
        OSM query.
      */

      const query = `

        [out:json]
        [timeout:15];

        way
          ["highway"]
          (${south},${west},${north},${east});

        out tags geom;

      `;


      let data = null;


      /*
        Try servers.
      */

      for (

        let i = 0;

        i <
        OVERPASS_SERVERS.length;

        i++

      ) {


        try {


          const response =
            await fetch(

              OVERPASS_SERVERS[i],

              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/x-www-form-urlencoded"

                },

                body:
                  "data=" +
                  encodeURIComponent(
                    query
                  )

              }

            );


          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }


          data =
            await response.json();


          break;


        } catch (error) {


          console.log(
            "OSM error:",
            error
          );

        }

      }


      if (!data) {


        document.getElementById(
          "status"
        ).innerText =
          "⚠️ Couldn't load map data.";


        loadingCoins = false;

        return;

      }


      /*
        Find usable ways.
      */

      const paths =
        getUsablePaths(

          data,

          latitude,

          longitude

        );


      if (
        paths.length === 0
      ) {


        document.getElementById(
          "status"
        ).innerText =

          gameMode === "PUBLIC"

            ? "🔎 No suitable public paths nearby."

            : "🔎 No mapped paths nearby.";


        loadingCoins = false;

        return;

      }


      /*
        Build main trail.
      */

      const mainTrail =
        buildMainTrail(

          paths[0],

          latitude,

          longitude

        );


      /*
        Find branch paths.
      */

      const branch =
        findBranchPath(

          paths,

          paths[0],

          mainTrail

        );


      /*
        Build branch trail.
      */

      const branchTrail =
        branch

          ? buildBranchTrail(
              branch
            )

          : [];


      /*
        Add main coins.
      */

      mainTrail.forEach(

        function(point) {

          createCoin(

            point.lat,

            point.lon

          );

        }

      );


      /*
        Add branch coins.
      */

      branchTrail.forEach(

        function(point) {

          createCoin(

            point.lat,

            point.lon

          );

        }

      );


      const total =
        mainTrail.length +
        branchTrail.length;


      document.getElementById(
        "status"
      ).innerText =

        "🎮 " +
        total +
        " coins • explore the paths!";


      loadingCoins = false;

    }



    /* =====================================================
       USABLE PATHS
       ===================================================== */

    function getUsablePaths(

      data,

      playerLatitude,

      playerLongitude

    ) {


      const paths = [];


      data.elements.forEach(

        function(element) {


          if (
            element.type !== "way"
          ) {

            return;

          }


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {

            return;

          }


          const tags =
            element.tags || {};


          const highway =
            tags.highway;


          if (!highway) {
            return;
          }


          const access =
            String(
              tags.access || ""
            ).toLowerCase();


          /*
            PUBLIC mode.
          */

          if (
            gameMode === "PUBLIC"
          ) {


            if (

              access === "private" ||

              access === "no" ||

              access === "permit" ||

              access === "customers"

            ) {

              return;

            }


            const publicWays = [

              "footway",

              "path",

              "pedestrian",

              "steps",

              "cycleway",

              "bridleway",

              "corridor"

            ];


            if (
              !publicWays.includes(
                highway
              )
            ) {

              return;

            }

          }


          /*
            UNLIMITED mode.

            Still avoid major roads.
          */

          if (
            gameMode === "UNLIMITED"
          ) {


            const dangerous = [

              "motorway",

              "motorway_link",

              "trunk",

              "trunk_link",

              "primary",

              "primary_link"

            ];


            if (
              dangerous.includes(
                highway
              )
            ) {

              return;

            }

          }


          /*
            Closest point.
          */

          const closest =
            getClosestPointOnWay(

              element.geometry,

              playerLatitude,

              playerLongitude

            );


          if (!closest) {
            return;
          }


          if (
            closest.distance >
            SEARCH_DISTANCE_METERS
          ) {

            return;

          }


          paths.push({

            geometry:
              element.geometry,

            highway:
              highway,

            distance:
              closest.distance,

            closestIndex:
              closest.index,

            tags:
              tags

          });

        }

      );


      /*
        Closest first.
      */

      paths.sort(

        function(a,b) {

          return (
            a.distance -
            b.distance
          );

        }

      );


      return paths;

    }



    /* =====================================================
       CLOSEST POINT
       ===================================================== */

    function getClosestPointOnWay(

      geometry,

      latitude,

      longitude

    ) {


      let best = null;


      geometry.forEach(

        function(point,index) {


          const distance =
            getDistanceMeters(

              latitude,

              longitude,

              point.lat,

              point.lon

            );


          if (

            best === null ||

            distance <
            best.distance

          ) {


            best = {

              distance:
                distance,

              index:
                index

            };

          }

        }

      );


      return best;

    }



    /* =====================================================
       MAIN TRAIL
       ===================================================== */

    function buildMainTrail(

      path,

      playerLatitude,

      playerLongitude

    ) {


      const geometry =
        path.geometry;


      let index =
        path.closestIndex;


      /*
        Determine direction.
      */

      let direction =
        1;


      if (
        index >=
        geometry.length - 1
      ) {

        direction =
          -1;

      } else if (
        index <= 0
      ) {

        direction =
          1;

      } else {


        const next =
          geometry[
            index + 1
          ];


        const previous =
          geometry[
            index - 1
          ];


        const nextDistance =
          getDistanceMeters(

            playerLatitude,
            playerLongitude,

            next.lat,
            next.lon

          );


        const previousDistance =
          getDistanceMeters(

            playerLatitude,
            playerLongitude,

            previous.lat,
            previous.lon

          );


        if (
          previousDistance >
          nextDistance
        ) {

          direction =
            -1;

        }

      }


      return makeTrail(

        geometry,

        index,

        direction,

        MAIN_COINS,

        MAIN_SPACING

      );

    }



    /* =====================================================
       FIND BRANCH
       ===================================================== */

    function findBranchPath(

      paths,

      mainPath,

      mainTrail

    ) {


      /*
        Search for another way
        whose geometry comes close
        to the main path.

        This approximates a branch.
      */

      for (

        let i = 1;

        i <
        paths.length;

        i++

      ) {


        const candidate =
          paths[i];


        /*
          Don't use the same highway
          segment.
        */

        if (
          candidate.geometry ===
          mainPath.geometry
        ) {

          continue;

        }


        /*
          Check whether the candidate
          comes close to the main trail.
        */

        let connected =
          false;


        for (

          let a = 0;

          a <
          candidate.geometry.length;

          a++

        ) {


          const point =
            candidate.geometry[a];


          for (

            let b = 0;

            b <
            mainTrail.length;

            b++

          ) {


            const trailPoint =
              mainTrail[b];


            const distance =
              getDistanceMeters(

                point.lat,
                point.lon,

                trailPoint.lat,
                trailPoint.lon

              );


            /*
              About 80 meters counts
              as a possible branch.
            */

            if (
              distance <= 80
            ) {

              connected =
                true;

              break;

            }

          }


          if (connected) {
            break;
          }

        }


        if (connected) {

          return candidate;

        }

      }


      return null;

    }



    /* =====================================================
       BUILD BRANCH TRAIL
       ===================================================== */

    function buildBranchTrail(
      branch
    ) {


      const geometry =
        branch.geometry;


      if (
        geometry.length < 2
      ) {

        return [];

      }


      /*
        Start at one end of the branch
        and walk toward the other end.

        This makes mini paths naturally
        extend down roads/paths.
      */

      const fromStart =
        geometry[0];


      const fromEnd =
        geometry[
          geometry.length - 1
        ];


      /*
        Prefer the longer direction.
      */

      let startIndex =
        0;


      let direction =
        1;


      if (
        branch.distance <
        100
      ) {


        /*
          If the branch is near the player,
          use its farther end.
        */

        const startDistance =
          branch.distance;


        const endDistance =
          getDistanceMeters(

            lastLatitude,
            lastLongitude,

            fromEnd.lat,
            fromEnd.lon

          );


        if (
          endDistance <
          startDistance
        ) {

          startIndex =
            geometry.length - 1;

          direction =
            -1;

        }

      }


      return makeTrail(

        geometry,

        startIndex,

        direction,

        BRANCH_COINS,

        BRANCH_SPACING

      );

    }



    /* =====================================================
       MAKE TRAIL
       ===================================================== */

    function makeTrail(

      geometry,

      startIndex,

      direction,

      numberOfCoins,

      spacing

    ) {


      const trail = [];


      let accumulated =
        0;


      let lastPoint =
        geometry[startIndex];


      for (

        let step = 1;

        step <
        geometry.length;

        step++

      ) {


        const index =
          startIndex +
          step *
          direction;


        if (
          index < 0 ||
          index >= geometry.length
        ) {

          break;

        }


        const point =
          geometry[index];


        const distance =
          getDistanceMeters(

            lastPoint.lat,
            lastPoint.lon,

            point.lat,
            point.lon

          );


        accumulated +=
          distance;


        if (
          accumulated >=
          spacing
        ) {


          trail.push({

            lat:
              point.lat,

            lon:
              point.lon

          });


          accumulated = 0;


          if (
            trail.length >=
            numberOfCoins
          ) {

            break;

          }

        }


        lastPoint =
          point;

      }


      /*
        Try the other direction if
        the way was too short.
      */

      if (
        trail.length === 0
      ) {


        let reverse =
          [];


        let accumulated2 =
          0;


        let last =
          geometry[startIndex];


        for (

          let index =
            startIndex - direction;

          index >= 0 &&
          index < geometry.length;

          index -= direction

        ) {


          const point =
            geometry[index];


          accumulated2 +=
            getDistanceMeters(

              last.lat,
              last.lon,

              point.lat,
              point.lon

            );


          if (
            accumulated2 >=
            spacing
          ) {


            reverse.push({

              lat:
                point.lat,

              lon:
                point.lon

            });


            accumulated2 = 0;


            if (
              reverse.length >=
              numberOfCoins
            ) {

              break;

            }

          }


          last =
            point;

        }


        trail =
          reverse;

      }


      return trail;

    }



    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(

      latitude,

      longitude

    ) {


      /*
        Prevent coins from being
        placed directly on top of
        each other.
      */

      for (
        let i = 0;
        i < coins.length;
        i++
      ) {


        const existing =
          coins[i];


        const distance =
          getDistanceMeters(

            latitude,
            longitude,

            existing.latitude,
            existing.longitude

          );


        if (
          distance < 25
        ) {

          return;

        }

      }


      const coinIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="coin">🪙</div>',

          iconSize:
            [34,34],

          iconAnchor:
            [17,17]

        });


      const marker =
        L.marker(

          [
            latitude,
            longitude
          ],

          {

            icon:
              coinIcon

          }

        ).addTo(map);


      coins.push({

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }



    /* =====================================================
       REMOVE OLD COINS
       ===================================================== */

    function removeUncollectedCoins() {


      const remaining = [];


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {


            remaining.push(
              coin
            );


          } else {


            if (
              map.hasLayer(
                coin.marker
              )
            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }

      );


      coins =
        remaining;

    }



    /* =====================================================
       COLLECTION
       ===================================================== */

    function checkCoinCollection(

      latitude,

      longitude

    ) {


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {

            return;

          }


          const distance =
            getDistanceMeters(

              latitude,
              longitude,

              coin.latitude,
              coin.longitude

            );


          if (
            distance <=
            COLLECTION_DISTANCE
          ) {

            collectCoin(
              coin
            );

          }

        }

      );

    }



    /* =====================================================
       COLLECT
       ===================================================== */

    function collectCoin(
      coin
    ) {


      coin.collected =
        true;


      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );

      }


      coinCount +=
        COIN_VALUE;


      document.getElementById(
        "coins"
      ).innerText =

        "🪙 Coins: " +
        coinCount;


      document.getElementById(
        "status"
      ).innerText =

        "🪙 COIN COLLECTED! +10";


      setTimeout(

        function() {

          document.getElementById(
            "status"
          ).innerText =
            "🎮 KEEP EXPLORING";

        },

        2000

      );

    }



    /* =====================================================
       DISTANCE
       ===================================================== */

    function getDistanceMeters(

      latitude1,
      longitude1,

      latitude2,
      longitude2

    ) {


      const R =
        6371000;


      const lat1 =
        latitude1 *
        Math.PI /
        180;


      const lat2 =
        latitude2 *
        Math.PI /
        180;


      const dLat =
        (
          latitude2 -
          latitude1
        ) *
        Math.PI /
        180;


      const dLon =
        (
          longitude2 -
          longitude1
        ) *
        Math.PI /
        180;


      const a =

        Math.sin(
          dLat / 2
        ) ** 2

        +

        Math.cos(lat1) *

        Math.cos(lat2) *

        Math.sin(
          dLon / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return R * c;

    }



    /* =====================================================
       MODE SWITCH
       ===================================================== */

    document.getElementById(
      "mode"
    ).addEventListener(

      "click",

      function() {


        if (
          gameMode === "PUBLIC"
        ) {


          gameMode =
            "UNLIMITED";


          document.getElementById(
            "mode"
          ).innerText =
            "🔓 UNLIMITED";


        } else {


          gameMode =
            "PUBLIC";


          document.getElementById(
            "mode"
          ).innerText =
            "🌎 PUBLIC";

        }


        /*
          Rebuild paths using
          the new mode.
        */

        if (

          lastLatitude !== null &&

          lastLongitude !== null

        ) {

          loadGamePaths(

            lastLatitude,

            lastLongitude

          );

        }

      }

    );



    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(
      error
    ) {


      console.log(
        "GPS error:",
        error
      );


      document.getElementById(
        "status"
      ).innerText =
        "❌ Couldn't get your location.";

    }



    /* =====================================================
       START GPS
       ===================================================== */

    if (
      "geolocation" in navigator
    ) {


      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );


    } else {


      document.getElementById(
        "status"
      ).innerText =
        "❌ GPS isn't available.";

    }


  </script>

</body>
</html>
