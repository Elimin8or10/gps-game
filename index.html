<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://yrcitnuuskcbiuryyytu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_REmdL8nVsuxhOsRMTZlGFg_YILsQIVK";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   SETTINGS
========================================================= */

const SEARCH_RADIUS = 800;

const COIN_SPACING = 65;

const COLLECTION_DISTANCE = 18;

const MAX_START_DISTANCE = 80;

const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];


/* =========================================================
   STATE
========================================================= */

let map = null;

let playerMarker = null;

let routeLine = null;

let coins = [];

let player = null;

let gameMode = null;

let started = false;

let loadingTrail = false;


/* =========================================================
   SKINS
========================================================= */

const SKINS = {

  blue:{
    name:"Blue",
    color:"#00aaff",
    price:0
  },

  red:{
    name:"Red",
    color:"#ff3030",
    price:50
  },

  green:{
    name:"Green",
    color:"#22dd55",
    price:100
  },

  purple:{
    name:"Purple",
    color:"#aa55ff",
    price:150
  },

  gold:{
    name:"Gold",
    color:"#ffd000",
    price:250
  },

  pink:{
    name:"Pink",
    color:"#ff4fa3",
    price:350
  }

};


/* =========================================================
   DOM
========================================================= */

const loadingScreen =
document.getElementById("loadingScreen");

const loadingText =
document.getElementById("loadingText");

const loadingBar =
document.getElementById("loadingBarInner");

const modeSelect =
document.getElementById("modeSelect");

const status =
document.getElementById("status");

const coinsDisplay =
document.getElementById("coinsDisplay");

const toast =
document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function setLoading(text,percent){

  loadingText.textContent = text;

  loadingBar.style.width =
  percent + "%";

}


function setStatus(text){

  status.textContent = text;

}


function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}


/* =========================================================
   MODE
========================================================= */

document
.getElementById("publicMode")
.onclick = () => chooseMode("PUBLIC");

document
.getElementById("unlimitedMode")
.onclick = () => chooseMode("UNLIMITED");


async function chooseMode(mode){

  gameMode = mode;

  modeSelect.style.display = "none";

  setLoading(
    "Requesting your location...",
    25
  );

  requestLocation();

}


/* =========================================================
   LOCATION
========================================================= */

function requestLocation(){

  if(!navigator.geolocation){

    setLoading(
      "GPS is not supported on this device.",
      100
    );

    setStatus("❌ GPS unavailable.");

    return;
  }

  navigator.geolocation.getCurrentPosition(
    positionReady,
    locationFailed,
    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );

}


function positionReady(position){

  const lat =
  position.coords.latitude;

  const lon =
  position.coords.longitude;

  startGame(lat,lon);

}


function locationFailed(error){

  console.error(error);

  if(error.code === 1){

    setLoading(
      "Location permission was denied.",
      100
    );

    setStatus(
      "📍 Allow location access in your browser settings."
    );

  }else{

    setLoading(
      "Couldn't get your location.",
      100
    );

    setStatus(
      "📍 Try again and make sure GPS is enabled."
    );

  }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(lat,lon){

  if(started) return;

  started = true;

  setLoading(
    "Building your map...",
    55
  );

  map =
  L.map("map",{
    zoomControl:true
  }).setView(
    [lat,lon],
    18
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
      "© OpenStreetMap contributors"
    }
  ).addTo(map);

  createPlayer(lat,lon);

  loadingScreen.classList.add("hidden");

  setStatus(
    "🗺️ Finding the road you're on..."
  );

  loadConnectedRoute(lat,lon);

}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(lat,lon){

  const color =
  SKINS.blue.color;

  playerMarker =
  L.marker(
    [lat,lon],
    {
      icon:
      L.divIcon({
        className:"",
        html:
        `<div class="player"
        style="--player-color:${color}"></div>`,
        iconSize:[28,28],
        iconAnchor:[14,14]
      })
    }
  ).addTo(map);

}


/* =========================================================
   OVERPASS
========================================================= */

async function getWays(lat,lon){

  const latOffset =
  SEARCH_RADIUS / 111320;

  const lonOffset =
  SEARCH_RADIUS /
  (
    111320 *
    Math.cos(lat*Math.PI/180)
  );

  const south = lat-latOffset;
  const north = lat+latOffset;
  const west = lon-lonOffset;
  const east = lon+lonOffset;

  let highwayFilter;

  if(gameMode === "PUBLIC"){

    highwayFilter =
    `
    ["highway"~"footway|path|pedestrian|steps|cycleway|bridleway|living_street|residential"]
    `;

  }else{

    highwayFilter =
    `
    ["highway"]
    ["highway"!~"motorway|motorway_link|trunk|trunk_link"]
    `;

  }

  const query = `
    [out:json][timeout:25];

    way
      ${highwayFilter}
      (${south},${west},${north},${east});

    out geom tags;
  `;

  for(const server of OVERPASS){

    try{

      const response =
      await fetch(server,{
        method:"POST",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },
        body:
        "data="+
        encodeURIComponent(query)
      });

      if(!response.ok)
        throw new Error(response.status);

      const data =
      await response.json();

      return data.elements || [];

    }catch(error){

      console.log(
        "Overpass failed",
        server,
        error
      );

    }

  }

  return [];

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,lon1,lat2,lon2
){

  const R=6371000;

  const p1=lat1*Math.PI/180;
  const p2=lat2*Math.PI/180;

  const dLat=
  (lat2-lat1)*Math.PI/180;

  const dLon=
  (lon2-lon1)*Math.PI/180;

  const a=
  Math.sin(dLat/2)**2+
  Math.cos(p1)*
  Math.cos(p2)*
  Math.sin(dLon/2)**2;

  return R*
  2*
  Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );

}


/* =========================================================
   FIND CLOSEST POINT
========================================================= */

function closestPointOnWay(
  way,
  lat,
  lon
){

  let best=null;

  const geometry =
  way.geometry || [];

  for(let i=0;i<geometry.length;i++){

    const p=geometry[i];

    const d=
    distanceMeters(
      lat,
      lon,
      p.lat,
      p.lon
    );

    if(!best || d<best.distance){

      best={
        way,
        index:i,
        point:p,
        distance:d
      };

    }

  }

  return best;

}


/* =========================================================
   FIND ACTUAL START ROAD
========================================================= */

function findStartingWay(
  ways,
  lat,
  lon
){

  const candidates=[];

  for(const way of ways){

    if(!way.geometry ||
       way.geometry.length<2)
      continue;

    const closest =
    closestPointOnWay(
      way,
      lat,
      lon
    );

    if(closest){

      candidates.push(closest);

    }

  }

  candidates.sort(
    (a,b)=>
    a.distance-b.distance
  );

  /*
   * Only accept a road/path reasonably
   * close to the player.
   */

  for(const candidate of candidates){

    if(candidate.distance <= MAX_START_DISTANCE){

      return candidate;

    }

  }

  return null;

}


/* =========================================================
   NETWORK NODE
========================================================= */

function nodeKey(p){

  return (
    Math.round(p.lat*100000)+
    ","+
    Math.round(p.lon*100000)
  );

}


/* =========================================================
   BUILD NETWORK
========================================================= */

function buildNetwork(ways){

  const nodes =
  new Map();

  for(const way of ways){

    const geometry =
    way.geometry;

    if(!geometry ||
       geometry.length<2)
      continue;

    const first =
    geometry[0];

    const last =
    geometry[geometry.length-1];

    const a=nodeKey(first);
    const b=nodeKey(last);

    if(!nodes.has(a))
      nodes.set(a,[]);

    if(!nodes.has(b))
      nodes.set(b,[]);

    nodes.get(a).push({
      way,
      index:0,
      other:b
    });

    nodes.get(b).push({
      way,
      index:geometry.length-1,
      other:a
    });

  }

  return nodes;

}


/* =========================================================
   FIND CONNECTED WAYS
========================================================= */

function findConnectedWays(
  ways,
  start
){

  const network =
  buildNetwork(ways);

  const result=[];

  const visitedWays =
  new Set();

  const queue=[];

  /*
   * Start specifically from the way
   * nearest the player.
   */

  queue.push({
    way:start.way,
    depth:0
  });

  visitedWays.add(
    start.way.id
  );

  while(queue.length){

    const current =
    queue.shift();

    result.push(
      current.way
    );

    if(current.depth>=8)
      continue;

    const geometry =
    current.way.geometry;

    if(!geometry)
      continue;

    const endpoints=[
      geometry[0],
      geometry[geometry.length-1]
    ];

    for(const endpoint of endpoints){

      const key =
      nodeKey(endpoint);

      const connections =
      network.get(key) || [];

      for(const connection of connections){

        if(
          visitedWays.has(
            connection.way.id
          )
        )
          continue;

        /*
         * Only follow actual OSM
         * endpoint connections.
         */

        visitedWays.add(
          connection.way.id
        );

        queue.push({
          way:connection.way,
          depth:current.depth+1
        });

      }

    }

  }

  return result;

}


/* =========================================================
   BUILD ROUTE
========================================================= */

function buildRoute(
  connected,
  start
){

  const route=[];

  /*
   * Start exactly at the nearest point
   * on the player's selected way.
   */

  route.push({
    lat:start.point.lat,
    lon:start.point.lon
  });

  let currentWay =
  start.way;

  let currentIndex =
  start.index;

  let direction =
  currentIndex <
  currentWay.geometry.length-1
  ? 1
  : -1;

  let traveled=0;

  let lastPoint =
  currentWay.geometry[currentIndex];

  const visited =
  new Set();

  let steps=0;

  while(
    route.length<60 &&
    steps<500
  ){

    steps++;

    const key =
    currentWay.id+
    ":"+
    currentIndex+
    ":"+
    direction;

    if(visited.has(key))
      break;

    visited.add(key);

    const nextIndex =
    currentIndex+direction;

    if(
      nextIndex<0 ||
      nextIndex>=currentWay.geometry.length
    ){

      const endpoint =
      currentWay.geometry[
        direction===1
        ? currentWay.geometry.length-1
        : 0
      ];

      const next =
      findNextConnectedWay(
        connected,
        currentWay.id,
        endpoint
      );

      if(!next)
        break;

      currentWay=next.way;

      currentIndex=next.index;

      direction=next.direction;

      lastPoint=
      currentWay.geometry[currentIndex];

      continue;

    }

    const point =
    currentWay.geometry[nextIndex];

    traveled +=
    distanceMeters(
      lastPoint.lat,
      lastPoint.lon,
      point.lat,
      point.lon
    );

    if(traveled>=COIN_SPACING){

      route.push({
        lat:point.lat,
        lon:point.lon
      });

      traveled=0;

    }

    lastPoint=point;

    currentIndex=nextIndex;

  }

  return route;

}


/* =========================================================
   NEXT CONNECTED WAY
========================================================= */

function findNextConnectedWay(
  ways,
  currentId,
  endpoint
){

  let best=null;

  let bestDistance=35;

  for(const way of ways){

    if(way.id===currentId)
      continue;

    if(!way.geometry ||
       way.geometry.length<2)
      continue;

    const first=way.geometry[0];

    const last=
    way.geometry[
      way.geometry.length-1
    ];

    const d1=
    distanceMeters(
      endpoint.lat,
      endpoint.lon,
      first.lat,
      first.lon
    );

    const d2=
    distanceMeters(
      endpoint.lat,
      endpoint.lon,
      last.lat,
      last.lon
    );

    if(d1<bestDistance){

      best={
        way,
        index:0,
        direction:1
      };

      bestDistance=d1;

    }

    if(d2<bestDistance){

      best={
        way,
        index:way.geometry.length-1,
        direction:-1
      };

      bestDistance=d2;

    }

  }

  return best;

}


/* =========================================================
   LOAD ROUTE
========================================================= */

async function loadConnectedRoute(
  lat,
  lon
){

  if(loadingTrail)
    return;

  loadingTrail=true;

  try{

    setStatus(
      "🗺️ Finding the road closest to you..."
    );

    const ways =
    await getWays(lat,lon);

    if(!ways.length){

      setStatus(
        "❌ No mapped paths found nearby."
      );

      return;

    }

    const start =
    findStartingWay(
      ways,
      lat,
      lon
    );

    if(!start){

      setStatus(
        "❌ Couldn't find a nearby connected path."
      );

      return;

    }

    console.log(
      "Selected road:",
      start.way.tags,
      "distance:",
      start.distance
    );

    setStatus(
      `🛣️ Found path ${Math.round(start.distance)}m away`
    );

    const connected =
    findConnectedWays(
      ways,
      start
    );

    console.log(
      "Connected ways:",
      connected.length
    );

    const route =
    buildRoute(
      connected,
      start
    );

    if(route.length<2){

      setStatus(
        "⚠️ The road is too short to generate a route."
      );

      return;

    }

    drawRoute(route);

    clearCoins();

    for(const point of route){

      createCoin(
        point.lat,
        point.lon
      );

    }

    setStatus(
      `🎮 ${coins.length} coins on your connected path`
    );

  }catch(error){

    console.error(error);

    setStatus(
      "⚠️ Couldn't load the path."
    );

  }finally{

    loadingTrail=false;

  }

}


/* =========================================================
   DRAW ROUTE
========================================================= */

function drawRoute(route){

  if(routeLine){

    map.removeLayer(
      routeLine
    );

  }

  routeLine =
  L.polyline(
    route.map(p=>[
      p.lat,
      p.lon
    ]),
    {
      weight:6,
      opacity:.8,
      dashArray:"10 8"
    }
  ).addTo(map);

}


/* =========================================================
   COINS
========================================================= */

function createCoin(lat,lon){

  /*
   * Prevent duplicate coins.
   */

  for(const existing of coins){

    if(
      distanceMeters(
        lat,
        lon,
        existing.lat,
        existing.lon
      )<20
    ){

      return;

    }

  }

  const marker =
  L.marker(
    [lat,lon],
    {
      icon:
      L.divIcon({
        className:"",
        html:
        `<div class="coin">🪙</div>`,
        iconSize:[34,34],
        iconAnchor:[17,17]
      })
    }
  ).addTo(map);

  const coin={
    marker,
    lat,
    lon,
    collected:false
  };

  coins.push(coin);

}


/* =========================================================
   CLEAR COINS
========================================================= */

function clearCoins(){

  for(const coin of coins){

    if(map.hasLayer(
      coin.marker
    )){

      map.removeLayer(
        coin.marker
      );

    }

  }

  coins=[];

}


/* =========================================================
   GPS TRACKING
========================================================= */

navigator.geolocation.watchPosition(
  position=>{

    if(!playerMarker)
      return;

    const lat=
    position.coords.latitude;

    const lon=
    position.coords.longitude;

    playerMarker.setLatLng([
      lat,
      lon
    ]);

    checkCoins(lat,lon);

  },
  error=>{
    console.log(
      "GPS watch error",
      error
    );
  },
  {
    enableHighAccuracy:true,
    maximumAge:2000,
    timeout:15000
  }
);


/* =========================================================
   COLLECT
========================================================= */

function checkCoins(lat,lon){

  for(const coin of coins){

    if(coin.collected)
      continue;

    const d=
    distanceMeters(
      lat,
      lon,
      coin.lat,
      coin.lon
    );

    if(d<=COLLECTION_DISTANCE){

      coin.collected=true;

      if(map.hasLayer(
        coin.marker
      )){

        map.removeLayer(
          coin.marker
        );

      }

      addCoins(10);

      showToast(
        "🪙 COIN COLLECTED! +10"
      );

    }

  }

}


/* =========================================================
   PLAYER DATA
========================================================= */

async function loadPlayer(){

  const {
    data:{
      user
    }
  }=
  await supabase.auth.getUser();

  if(!user)
    return null;

  const {
    data,
    error
  }=
  await supabase
  .from("players")
  .select("*")
  .eq("id",user.id)
  .single();

  if(error){

    console.error(
      error
    );

    return null;

  }

  return data;

}


async function savePlayer(){

  if(!player)
    return;

  await supabase
  .from("players")
  .update({
    coins:player.coins,
    xp:player.xp,
    level:player.level,
    unlocked_skins:
    player.unlocked_skins,
    equipped_skin:
    player.equipped_skin,
    collected_coins:
    player.collected_coins,
    updated_at:
    new Date().toISOString()
  })
  .eq("id",player.id);

}


async function addCoins(amount){

  if(!player)
    return;

  player.coins+=amount;

  player.xp+=amount;

  const required =
  player.level*100;

  if(player.xp>=required){

    player.xp-=required;

    player.level++;

    showToast(
      "🎉 LEVEL UP!"
    );

  }

  updateCoins();

  await savePlayer();

}


function updateCoins(){

  coinsDisplay.textContent=
  "🪙 Coins: "+
  (player?.coins||0);

}


/* =========================================================
   SHOP
========================================================= */

document
.getElementById("shopButton")
.onclick=()=>{

  document
  .getElementById("shopOverlay")
  .style.display="block";

  renderShop();

};


document
.getElementById("closeShop")
.onclick=()=>{

  document
  .getElementById("shopOverlay")
  .style.display="none";

};


function renderShop(){

  if(!player)
    return;

  document
  .getElementById("shopBalance")
  .textContent=
  "🪙 Coins: "+
  player.coins;

  const container =
  document.getElementById(
    "shopItems"
  );

  container.innerHTML="";

  for(const [id,skin]
    of Object.entries(SKINS)
  ){

    const unlocked =
    player.unlocked_skins
    .includes(id);

    const equipped =
    player.equipped_skin===id;

    const item =
    document.createElement("div");

    item.className="shopItem";

    item.innerHTML=`
      <div
        class="skinPreview"
        style="background:${skin.color}"
      ></div>

      <div class="skinInfo">
        <div class="skinName">
          ${skin.name}
        </div>

        <div class="skinPrice">
          ${
            skin.price===0
            ? "FREE"
            : "🪙 "+skin.price
          }
        </div>
      </div>
    `;

    const button =
    document.createElement("button");

    button.className="action";

    if(equipped){

      button.textContent=
      "EQUIPPED";

      button.disabled=true;

    }else if(unlocked){

      button.textContent=
      "EQUIP";

      button.onclick=
      async()=>{

        player.equipped_skin=id;

        await savePlayer();

        renderShop();

        showToast(
          "🎨 "+skin.name+" equipped!"
        );

      };

    }else if(
      player.coins>=skin.price
    ){

      button.textContent="BUY";

      button.onclick=
      async()=>{

        player.coins-=skin.price;

        player.unlocked_skins.push(id);

        player.equipped_skin=id;

        await savePlayer();

        updateCoins();

        renderShop();

        showToast(
          "🎨 "+skin.name+" unlocked!"
        );

      };

    }else{

      button.textContent=
      "NEED COINS";

      button.disabled=true;

    }

    item.appendChild(button);

    container.appendChild(item);

  }

}

   AUTH + BOOT
========================================================= */

async function boot(){

  setLoading(
    "Choose your game mode.",
    5
  );

  /*
   * The mode buttons appear BEFORE
   * the actual game loading screen.
   */

  modeSelect.style.display="block";

  player =
  await loadPlayer();

  updateCoins();

}


supabase.auth.onAuthStateChange(
  (event)=>{

    if(event==="SIGNED_OUT"){

      location.href=
      "/login.html";

    }

  }
);

boot();
