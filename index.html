<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }


    /* =========================
       HUD
       ========================= */

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;

      display: flex;
      gap: 10px;

      font-family: Arial, sans-serif;
    }

    .hudBox {
      background: rgba(10, 15, 20, 0.94);
      color: white;

      padding: 10px 14px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.4);

      font-weight: bold;
    }

    #coins {
      flex: 1;
    }

    #mode {
      cursor: pointer;
      user-select: none;
    }


    /* =========================
       STATUS
       ========================= */

    #status {
      position: absolute;

      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      background: rgba(10, 15, 20, 0.94);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;
    }


    /* =========================
       PLAYER
       ========================= */

    .player {
      width: 22px;
      height: 22px;

      background: #00aaff;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px #00aaff,
        0 0 18px #00aaff;
    }


    /* =========================
       COIN
       ========================= */

    .coin {
      width: 28px;
      height: 28px;

      background: radial-gradient(
        circle at 35% 35%,
        #fffbd0 0%,
        #ffe44d 25%,
        #ffd000 55%,
        #f0a000 80%,
        #c87800 100%
      );

      border: 3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255, 190, 0, 0.7);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;

      animation: coinPulse 1.4s infinite;
    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HUD
       ========================= -->

  <div id="hud">

    <div
      class="hudBox"
      id="coins"
    >
      🪙 Coins: 0
    </div>

    <div
      class="hudBox"
      id="mode"
    >
      🌎 PUBLIC
    </div>

  </div>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="status">
    📍 Finding your location...
  </div>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>


    /* =====================================================
       GAME VARIABLES
       ===================================================== */

    let map = null;

    let player = null;

    let coins = [];

    let coinCount = 0;

    let gameMode = "PUBLIC";

    let lastLatitude = null;

    let lastLongitude = null;

    let loadingCoins = false;


    /*
      Player must be this close to collect.
    */

    const COLLECTION_DISTANCE = 15;


    /*
      Number of coins to create.
    */

    const NUMBER_OF_COINS = 8;


    /*
      Search roughly 400 meters around player.
    */

    const SEARCH_DISTANCE_METERS = 400;


    /*
      Don't put a coin directly beside player.
    */

    const MIN_COIN_DISTANCE = 40;


    /*
      Refresh coins after moving this far.
    */

    const COIN_REFRESH_DISTANCE = 100;


    /*
      Coin reward.
    */

    const COIN_VALUE = 10;


    /*
      Overpass servers.

      If one is unavailable, we try the next.
    */

    const OVERPASS_SERVERS = [

      "https://overpass-api.de/api/interpreter",

      "https://overpass.kumi.systems/api/interpreter"

    ];



    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(
      latitude,
      longitude
    ) {


      /*
        Initial map position.

        This is the ONLY place where
        the game automatically centers.
      */

      map = L.map("map").setView(
        [latitude, longitude],
        17
      );


      /*
        OpenStreetMap tiles.
      */

      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          attribution:
            "© OpenStreetMap contributors"
        }

      ).addTo(map);



      /* =================================================
         PLAYER
         ================================================= */

      const playerIcon = L.divIcon({

        className: "",

        html:
          '<div class="player"></div>',

        iconSize:
          [28, 28],

        iconAnchor:
          [14, 14]

      });


      player = L.marker(

        [
          latitude,
          longitude
        ],

        {
          icon:
            playerIcon
        }

      ).addTo(map);



      /*
        Save starting position.
      */

      lastLatitude =
        latitude;

      lastLongitude =
        longitude;



      /*
        Load coins.
      */

      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Looking for nearby locations...";


      loadCoinsFromOSM(
        latitude,
        longitude
      );

    }



    /* =====================================================
       GPS UPDATE
       ===================================================== */

    function updateLocation(position) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;



      /*
        First GPS update.
      */

      if (!map) {

        startGame(
          latitude,
          longitude
        );

        return;
      }



      /*
        Move player only.

        IMPORTANT:

        There is NO map.setView()
        here.

        This keeps the map draggable
        and smooth.
      */

      player.setLatLng([

        latitude,

        longitude

      ]);



      /*
        Check for coins.
      */

      checkCoinCollection(

        latitude,

        longitude

      );



      /*
        Refresh the nearby coin field
        after the player has traveled
        far enough.
      */

      if (

        lastLatitude !== null &&

        lastLongitude !== null

      ) {


        const movedDistance =
          getDistanceMeters(

            lastLatitude,

            lastLongitude,

            latitude,

            longitude

          );


        if (

          movedDistance >=
          COIN_REFRESH_DISTANCE

        ) {


          lastLatitude =
            latitude;

          lastLongitude =
            longitude;


          loadCoinsFromOSM(

            latitude,

            longitude

          );

        }

      }

    }



    /* =====================================================
       LOAD OSM DATA
       ===================================================== */

    async function loadCoinsFromOSM(

      latitude,

      longitude

    ) {


      /*
        Prevent overlapping requests.
      */

      if (loadingCoins) {
        return;
      }


      loadingCoins = true;


      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Searching OpenStreetMap...";



      /*
        Remove existing uncollected
        coins before making the new field.
      */

      removeUncollectedCoins();



      /*
        Create a bounding box around
        the player.
      */

      const latitudeOffset =
        SEARCH_DISTANCE_METERS /
        111320;


      const longitudeOffset =
        SEARCH_DISTANCE_METERS /
        (
          111320 *
          Math.cos(
            latitude *
            Math.PI /
            180
          )
        );


      const south =
        latitude -
        latitudeOffset;


      const north =
        latitude +
        latitudeOffset;


      const west =
        longitude -
        longitudeOffset;


      const east =
        longitude +
        longitudeOffset;



      /*
        Ask for ALL nearby highway ways.

        We intentionally do the filtering
        ourselves in JavaScript.

        This is more reliable than making
        the Overpass query extremely specific.
      */

      const query = `

        [out:json]
        [timeout:25];

        way
          ["highway"]
          (${south},${west},${north},${east});

        out tags geom;

      `;



      let data = null;

      let lastError = null;



      /*
        Try each Overpass server.
      */

      for (
        let i = 0;
        i < OVERPASS_SERVERS.length;
        i++
      ) {


        try {


          const server =
            OVERPASS_SERVERS[i];


          const response =
            await fetch(

              server,

              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "application/x-www-form-urlencoded"

                },

                body:
                  "data=" +
                  encodeURIComponent(
                    query
                  )

              }

            );



          if (
            !response.ok
          ) {

            throw new Error(
              "Server returned " +
              response.status
            );

          }



          data =
            await response.json();


          /*
            Success.
          */

          break;


        } catch (error) {


          console.error(
            "Overpass server failed:",
            error
          );


          lastError =
            error;

        }

      }



      /*
        Neither server worked.
      */

      if (!data) {


        console.error(
          "All Overpass servers failed:",
          lastError
        );


        document.getElementById(
          "status"
        ).innerText =
          "⚠️ Map data server unavailable. Try again.";


        loadingCoins = false;

        return;

      }



      /*
        Convert OSM ways into candidate
        coin locations.
      */

      const candidates =
        getCoinCandidates(
          data,
          latitude,
          longitude
        );



      /*
        Not enough suitable locations.
      */

      if (
        candidates.length === 0
      ) {


        document.getElementById(
          "status"
        ).innerText =
          gameMode === "PUBLIC"
            ? "🔎 No suitable public paths nearby."
            : "🔎 No mapped roads or paths nearby.";


        loadingCoins = false;

        return;

      }



      /*
        Shuffle candidates.
      */

      shuffleArray(
        candidates
      );



      /*
        Select spread-out locations.
      */

      const selected =
        chooseSpreadOutCoins(
          candidates
        );



      /*
        Create markers.
      */

      selected.forEach(

        function(location) {

          createCoin(

            location.latitude,

            location.longitude

          );

        }

      );



      document.getElementById(
        "status"
      ).innerText =

        "🎮 " +
        selected.length +
        " coins found nearby!";


      loadingCoins = false;

    }



    /* =====================================================
       FILTER OSM DATA
       ===================================================== */

    function getCoinCandidates(

      data,

      playerLatitude,

      playerLongitude

    ) {


      const candidates = [];


      if (
        !data ||
        !data.elements
      ) {

        return candidates;

      }



      data.elements.forEach(

        function(element) {


          if (
            element.type !== "way"
          ) {

            return;

          }


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {

            return;

          }



          const tags =
            element.tags || {};


          const highway =
            tags.highway;


          /*
            No highway type.
          */

          if (!highway) {
            return;
          }



          /*
            Access information from OSM.

            This is NOT a legal-access guarantee.
          */

          const access =
            String(
              tags.access || ""
            ).toLowerCase();


          const motorVehicle =
            String(
              tags.motor_vehicle || ""
            ).toLowerCase();


          const vehicle =
            String(
              tags.vehicle || ""
            ).toLowerCase();



          /*
            PUBLIC MODE
            ----------------------------------

            Favor pedestrian-oriented
            mapped ways.

            We do not claim these are
            guaranteed legally accessible.
          */

          if (
            gameMode === "PUBLIC"
          ) {


            /*
              Reject explicitly restricted access.
            */

            if (

              access === "private" ||

              access === "no" ||

              access === "customers" ||

              access === "permit"

            ) {

              return;

            }


            /*
              Reject restricted vehicle access
              when specifically tagged.
            */

            if (

              motorVehicle === "private" ||

              motorVehicle === "no" ||

              vehicle === "private" ||

              vehicle === "no"

            ) {

              return;

            }



            /*
              Good PUBLIC candidates.

              These are primarily pedestrian/
              non-vehicle features.
            */

            const publicHighways = [

              "footway",

              "path",

              "pedestrian",

              "steps",

              "cycleway",

              "bridleway",

              "corridor"

            ];


            if (
              !publicHighways.includes(
                highway
              )
            ) {

              return;

            }

          }



          /*
            UNLIMITED MODE
            ----------------------------------

            Allow a much broader set.

            This includes residential roads,
            service roads, tracks, etc.

            It is intended for private-area
            testing and does NOT mean the
            location is legally accessible.
          */

          if (
            gameMode === "UNLIMITED"
          ) {


            /*
              Don't use major highways even
              in unlimited mode.

              We don't want coins on
              dangerous high-speed roads.
            */

            const dangerousRoads = [

              "motorway",

              "motorway_link",

              "trunk",

              "trunk_link",

              "primary",

              "primary_link"

            ];


            if (
              dangerousRoads.includes(
                highway
              )
            ) {

              return;

            }

          }



          /*
            Pick a point from the actual
            OSM geometry.
          */

          const point =
            chooseGeometryPoint(
              element.geometry
            );


          if (!point) {
            return;
          }



          /*
            Distance from player.
          */

          const distance =
            getDistanceMeters(

              playerLatitude,

              playerLongitude,

              point.lat,

              point.lon

            );



          /*
            Don't put coins directly beside
            the player.
          */

          if (
            distance <
            MIN_COIN_DISTANCE
          ) {

            return;

          }



          /*
            Don't use points too far away.
          */

          if (
            distance >
            SEARCH_DISTANCE_METERS
          ) {

            return;

          }



          candidates.push({

            latitude:
              point.lat,

            longitude:
              point.lon,

            distance:
              distance,

            highway:
              highway

          });

        }

      );


      return candidates;

    }



    /* =====================================================
       CHOOSE POINT ON OSM WAY
       ===================================================== */

    function chooseGeometryPoint(
      geometry
    ) {


      if (
        !geometry ||
        geometry.length === 0
      ) {

        return null;

      }



      /*
        Select a random actual OSM node.

        This means the coin is placed on
        the mapped way geometry rather than
        an arbitrary coordinate.
      */

      const index =
        Math.floor(

          Math.random() *
          geometry.length

        );


      const point =
        geometry[index];


      if (
        !point ||
        typeof point.lat !== "number" ||
        typeof point.lon !== "number"
      ) {

        return null;

      }


      return point;

    }



    /* =====================================================
       SPREAD COINS OUT
       ===================================================== */

    function chooseSpreadOutCoins(
      candidates
    ) {


      const selected = [];


      /*
        Don't cluster all coins in one place.
      */

      const MIN_COIN_SEPARATION = 45;



      for (

        let i = 0;

        i < candidates.length;

        i++

      ) {


        const candidate =
          candidates[i];


        let tooClose =
          false;



        for (

          let j = 0;

          j < selected.length;

          j++

        ) {


          const existing =
            selected[j];


          const distance =
            getDistanceMeters(

              candidate.latitude,

              candidate.longitude,

              existing.latitude,

              existing.longitude

            );


          if (
            distance <
            MIN_COIN_SEPARATION
          ) {

            tooClose =
              true;

            break;

          }

        }



        if (
          !tooClose
        ) {

          selected.push(
            candidate
          );

        }



        if (
          selected.length >=
          NUMBER_OF_COINS
        ) {

          break;

        }

      }



      return selected;

    }



    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(

      latitude,

      longitude

    ) {


      const coinIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="coin">🪙</div>',

          iconSize:
            [34, 34],

          iconAnchor:
            [17, 17]

        });



      const marker =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              coinIcon
          }

        ).addTo(map);



      coins.push({

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }



    /* =====================================================
       REMOVE OLD UNCOLLECTED COINS
       ===================================================== */

    function removeUncollectedCoins() {


      const remaining = [];


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {


            /*
              Keep collected coins recorded.
            */

            remaining.push(
              coin
            );


          } else {


            if (
              map.hasLayer(
                coin.marker
              )
            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }

      );


      coins =
        remaining;

    }



    /* =====================================================
       CHECK COLLECTION
       ===================================================== */

    function checkCoinCollection(

      playerLatitude,

      playerLongitude

    ) {


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {

            return;

          }



          const distance =
            getDistanceMeters(

              playerLatitude,

              playerLongitude,

              coin.latitude,

              coin.longitude

            );



          if (
            distance <=
            COLLECTION_DISTANCE
          ) {

            collectCoin(
              coin
            );

          }

        }

      );

    }



    /* =====================================================
       COLLECT COIN
       ===================================================== */

    function collectCoin(
      coin
    ) {


      coin.collected =
        true;


      /*
        Remove marker.
      */

      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );

      }



      /*
        Reward.
      */

      coinCount +=
        COIN_VALUE;



      /*
        Update HUD.
      */

      document.getElementById(
        "coins"
      ).innerText =

        "🪙 Coins: " +
        coinCount;



      /*
        Collection message.
      */

      document.getElementById(
        "status"
      ).innerText =

        "🪙 COIN COLLECTED! +10";



      /*
        Return to normal.
      */

      setTimeout(

        function() {

          document.getElementById(
            "status"
          ).innerText =
            "🎮 KEEP EXPLORING";

        },

        2000

      );

    }



    /* =====================================================
       DISTANCE CALCULATION
       ===================================================== */

    function getDistanceMeters(

      latitude1,

      longitude1,

      latitude2,

      longitude2

    ) {


      const earthRadius =
        6371000;


      const lat1 =
        latitude1 *
        Math.PI /
        180;


      const lat2 =
        latitude2 *
        Math.PI /
        180;


      const deltaLatitude =

        (
          latitude2 -
          latitude1
        ) *
        Math.PI /
        180;


      const deltaLongitude =

        (
          longitude2 -
          longitude1
        ) *
        Math.PI /
        180;


      const a =

        Math.sin(
          deltaLatitude / 2
        ) ** 2

        +

        Math.cos(lat1) *

        Math.cos(lat2) *

        Math.sin(
          deltaLongitude / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return (
        earthRadius *
        c
      );

    }



    /* =====================================================
       SHUFFLE
       ===================================================== */

    function shuffleArray(
      array
    ) {


      for (

        let i =
          array.length - 1;

        i > 0;

        i--

      ) {


        const j =
          Math.floor(

            Math.random() *
            (i + 1)

          );


        const temp =
          array[i];


        array[i] =
          array[j];


        array[j] =
          temp;

      }

    }



    /* =====================================================
       PUBLIC / UNLIMITED BUTTON
       ===================================================== */

    document.getElementById(
      "mode"
    ).addEventListener(

      "click",

      function() {


        if (
          gameMode === "PUBLIC"
        ) {


          gameMode =
            "UNLIMITED";


          document.getElementById(
            "mode"
          ).innerText =
            "🔓 UNLIMITED";


        } else {


          gameMode =
            "PUBLIC";


          document.getElementById(
            "mode"
          ).innerText =
            "🌎 PUBLIC";

        }



        /*
          Reload nearby coins
          using the new mode.
        */

        if (

          lastLatitude !== null &&

          lastLongitude !== null

        ) {

          loadCoinsFromOSM(

            lastLatitude,

            lastLongitude

          );

        }

      }

    );



    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(
      error
    ) {


      console.error(
        "GPS error:",
        error
      );


      document.getElementById(
        "status"
      ).innerText =
        "❌ Couldn't get your location.";

    }



    /* =====================================================
       START GPS
       ===================================================== */

    if (
      "geolocation" in navigator
    ) {


      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );


    } else {


      document.getElementById(
        "status"
      ).innerText =
        "❌ GPS isn't available.";

    }


  </script>

</body>
</html>
