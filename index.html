<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>GPS Game</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }


    /* =========================
       HUD
       ========================= */

    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      display: flex;
      gap: 10px;

      font-family: Arial, sans-serif;
    }

    .hudBox {
      background: rgba(10, 15, 20, 0.94);

      color: white;

      padding: 10px 14px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.4);

      font-weight: bold;
    }

    #coins {
      flex: 1;
    }

    #mode {
      cursor: pointer;
      user-select: none;
    }


    /* =========================
       STATUS
       ========================= */

    #status {
      position: absolute;

      bottom: 20px;
      left: 15px;
      right: 15px;

      z-index: 1000;

      background: rgba(10, 15, 20, 0.94);

      color: white;

      padding: 12px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;
    }


    /* =========================
       PLAYER
       ========================= */

    .player {
      width: 22px;
      height: 22px;

      background: #00aaff;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 8px #00aaff,
        0 0 18px #00aaff;
    }


    /* =========================
       COIN
       ========================= */

    .coin {
      width: 28px;
      height: 28px;

      background: radial-gradient(
        circle at 35% 35%,
        #fffbd0 0%,
        #ffe44d 25%,
        #ffd000 55%,
        #f0a000 80%,
        #c87800 100%
      );

      border: 3px solid #fff4a3;

      border-radius: 50%;

      box-shadow:
        0 0 8px #ffd700,
        0 0 18px #ffb000,
        0 0 28px rgba(255, 190, 0, 0.7);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 17px;

      animation: coinPulse 1.4s infinite;
    }

    @keyframes coinPulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HUD
       ========================= -->

  <div id="hud">

    <div
      class="hudBox"
      id="coins"
    >
      🪙 Coins: 0
    </div>

    <div
      class="hudBox"
      id="mode"
    >
      🌎 PUBLIC
    </div>

  </div>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="status">
    📍 Finding your location...
  </div>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <!-- =========================
       LEAFLET
       ========================= -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script>


    /* =====================================================
       GAME VARIABLES
       ===================================================== */

    let map = null;

    let player = null;

    let coins = [];

    let coinCount = 0;

    let gameMode = "PUBLIC";

    let lastLatitude = null;

    let lastLongitude = null;

    let loadingCoins = false;


    /*
      Player must be within this distance
      to collect a coin.
    */

    const COLLECTION_DISTANCE = 15;


    /*
      Number of coins to try to create.
    */

    const NUMBER_OF_COINS = 8;


    /*
      How far around the player we search.

      0.003 degrees is roughly 300 meters
      north/south.
    */

    const SEARCH_RADIUS_DEGREES = 0.003;


    /*
      OpenStreetMap Overpass server.

      This is a public Overpass API instance.
    */

    const OVERPASS_URL =
      "https://overpass-api.de/api/interpreter";


    /*
      Prevent repeatedly querying OSM
      every time GPS updates.
    */

    const COIN_REFRESH_DISTANCE = 100;


    /*
      Coin reward.
    */

    const COIN_VALUE = 10;



    /* =====================================================
       START GAME
       ===================================================== */

    function startGame(
      latitude,
      longitude
    ) {


      /*
        IMPORTANT:

        This is the ONLY setView() call.

        It centers the map when the game starts.

        We NEVER call setView() from
        updateLocation().
      */

      map = L.map("map").setView(
        [latitude, longitude],
        17
      );


      /*
        OpenStreetMap map tiles.
      */

      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
          attribution:
            "© OpenStreetMap contributors"
        }

      ).addTo(map);



      /* =================================================
         PLAYER
         ================================================= */

      const playerIcon = L.divIcon({

        className: "",

        html:
          '<div class="player"></div>',

        iconSize:
          [28, 28],

        iconAnchor:
          [14, 14]

      });


      player = L.marker(

        [
          latitude,
          longitude
        ],

        {
          icon: playerIcon
        }

      ).addTo(map);



      /*
        Save current location.
      */

      lastLatitude =
        latitude;

      lastLongitude =
        longitude;



      /*
        Update status.
      */

      document.getElementById(
        "status"
      ).innerText =
        "🗺️ Finding nearby locations...";


      /*
        Load real OSM-based coins.
      */

      loadCoinsFromOSM(
        latitude,
        longitude
      );

    }



    /* =====================================================
       GPS UPDATE
       ===================================================== */

    function updateLocation(position) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;



      /*
        First GPS reading.
      */

      if (!map) {

        startGame(
          latitude,
          longitude
        );

        return;
      }



      /*
        Move ONLY the player.

        NO map.setView() HERE.

        This preserves smooth map scrolling.
      */

      player.setLatLng([

        latitude,

        longitude

      ]);



      /*
        Check nearby coins.
      */

      checkCoinCollection(

        latitude,

        longitude

      );



      /*
        See whether we've moved far enough
        to load a new set of coins.
      */

      if (

        lastLatitude !== null &&

        lastLongitude !== null

      ) {


        const movedDistance =
          getDistanceMeters(

            lastLatitude,

            lastLongitude,

            latitude,

            longitude

          );


        if (

          movedDistance >=

          COIN_REFRESH_DISTANCE

        ) {


          lastLatitude =
            latitude;

          lastLongitude =
            longitude;


          loadCoinsFromOSM(

            latitude,

            longitude

          );

        }

      }

    }



    /* =====================================================
       LOAD COINS FROM OPENSTREETMAP
       ===================================================== */

    async function loadCoinsFromOSM(

      latitude,

      longitude

    ) {


      /*
        Don't send multiple OSM requests
        at the same time.
      */

      if (loadingCoins) {
        return;
      }


      loadingCoins = true;


      document.getElementById(
        "status"
      ).innerText =

        "🗺️ Searching nearby map data...";



      /*
        Clear old uncollected coins.

        Collected coins stay gone.
      */

      removeUncollectedCoins();



      /*
        Build the bounding box.

        Overpass uses:

        south, west, north, east
      */

      const south =
        latitude -
        SEARCH_RADIUS_DEGREES;

      const north =
        latitude +
        SEARCH_RADIUS_DEGREES;

      const west =
        longitude -
        SEARCH_RADIUS_DEGREES;

      const east =
        longitude +
        SEARCH_RADIUS_DEGREES;



      /*
        PUBLIC mode:

        Focus on pedestrian-style features.

        We intentionally do not query
        normal residential/primary/secondary
        vehicle roads.

        We also reject several restrictive
        access tags where present.
      */

      let query;


      if (
        gameMode === "PUBLIC"
      ) {


        query = `

          [out:json]
          [timeout:25];

          (

            way["highway"="footway"]
              ["access"!~"^(private|no|customers|permissive)$"]
              (${south},${west},${north},${east});

            way["highway"="path"]
              ["access"!~"^(private|no|customers|permissive)$"]
              (${south},${west},${north},${east});

            way["highway"="pedestrian"]
              ["access"!~"^(private|no|customers|permissive)$"]
              (${south},${west},${north},${east});

            way["highway"="cycleway"]
              ["access"!~"^(private|no|customers|permissive)$"]
              (${south},${west},${north},${east});

            way["highway"="steps"]
              ["access"!~"^(private|no|customers|permissive)$"]
              (${south},${west},${north},${east});

          );

          out geom;

        `;


      } else {


        /*
          UNLIMITED mode:

          Broader selection.

          This may include private roads
          and other mapped areas.

          It does NOT mean the area is
          legally accessible.
        */

        query = `

          [out:json]
          [timeout:25];

          (

            way["highway"="footway"]
              (${south},${west},${north},${east});

            way["highway"="path"]
              (${south},${west},${north},${east});

            way["highway"="pedestrian"]
              (${south},${west},${north},${east});

            way["highway"="cycleway"]
              (${south},${west},${north},${east});

            way["highway"="steps"]
              (${south},${west},${north},${east});

            way["highway"="service"]
              (${south},${west},${north},${east});

            way["highway"="track"]
              (${south},${west},${north},${east});

          );

          out geom;

        `;

      }



      try {


        /*
          Send query to Overpass.
        */

        const response =
          await fetch(

            OVERPASS_URL,

            {

              method: "POST",

              body:
                "data=" +
                encodeURIComponent(query)

            }

          );



        if (!response.ok) {

          throw new Error(
            "Overpass request failed"
          );

        }



        const data =
          await response.json();



        /*
          Convert returned OSM ways
          into possible coin locations.
        */

        const locations =
          extractCoinLocations(
            data
          );



        /*
          If nothing useful was found,
          tell the player.
        */

        if (
          locations.length === 0
        ) {

          document.getElementById(
            "status"
          ).innerText =

            "🔎 No suitable mapped paths nearby.";

          loadingCoins = false;

          return;

        }



        /*
          Shuffle locations so the coins
          aren't always identical.
        */

        shuffleArray(
          locations
        );



        /*
          Create up to NUMBER_OF_COINS.
        */

        const amount =
          Math.min(

            NUMBER_OF_COINS,

            locations.length

          );



        for (

          let i = 0;

          i < amount;

          i++

        ) {


          createCoin(

            locations[i].latitude,

            locations[i].longitude

          );

        }



        document.getElementById(
          "status"
        ).innerText =

          "🎮 " +
          amount +
          " coins nearby!";


      } catch (error) {


        console.error(
          "OSM coin error:",
          error
        );


        document.getElementById(
          "status"
        ).innerText =

          "⚠️ Couldn't load nearby map locations.";


      }


      loadingCoins = false;

    }



    /* =====================================================
       EXTRACT COIN LOCATIONS
       ===================================================== */

    function extractCoinLocations(
      data
    ) {


      const locations = [];



      if (
        !data ||
        !data.elements
      ) {

        return locations;

      }



      data.elements.forEach(

        function(element) {


          /*
            We requested geometry,
            so ways should have geometry.
          */

          if (

            element.type !== "way" ||

            !element.geometry ||

            element.geometry.length < 2

          ) {

            return;

          }



          /*
            Choose several points along
            the actual OSM way.

            This is much better than putting
            a coin at a random GPS location.
          */

          const geometry =
            element.geometry;



          /*
            Pick the midpoint of the way.

            We can improve this later to
            distribute coins along longer paths.
          */

          const middleIndex =
            Math.floor(
              geometry.length / 2
            );


          const point =
            geometry[middleIndex];



          if (
            !point ||
            typeof point.lat !== "number" ||
            typeof point.lon !== "number"
          ) {

            return;

          }



          /*
            Don't put coins extremely close
            to the player.

            They should require some walking.
          */

          if (
            lastLatitude !== null &&
            lastLongitude !== null
          ) {


            const distance =
              getDistanceMeters(

                lastLatitude,

                lastLongitude,

                point.lat,

                point.lon

              );


            if (
              distance < 40
            ) {

              return;

            }

          }



          locations.push({

            latitude:
              point.lat,

            longitude:
              point.lon

          });

        }

      );



      return locations;

    }



    /* =====================================================
       CREATE COIN
       ===================================================== */

    function createCoin(

      latitude,

      longitude

    ) {


      const coinIcon =
        L.divIcon({

          className: "",

          html:
            '<div class="coin">🪙</div>',

          iconSize:
            [34, 34],

          iconAnchor:
            [17, 17]

        });



      const marker =
        L.marker(

          [
            latitude,
            longitude
          ],

          {
            icon:
              coinIcon
          }

        ).addTo(map);



      coins.push({

        marker:
          marker,

        latitude:
          latitude,

        longitude:
          longitude,

        collected:
          false

      });

    }



    /* =====================================================
       REMOVE UNCOLLECTED COINS
       ===================================================== */

    function removeUncollectedCoins() {


      const remainingCoins = [];



      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {


            /*
              Keep collected coins in the
              array so they don't accidentally
              get reused.
            */

            remainingCoins.push(
              coin
            );


          } else {


            /*
              Remove old visible coin.
            */

            if (
              map.hasLayer(
                coin.marker
              )
            ) {

              map.removeLayer(
                coin.marker
              );

            }

          }

        }

      );


      coins =
        remainingCoins;

    }



    /* =====================================================
       CHECK COIN COLLECTION
       ===================================================== */

    function checkCoinCollection(

      playerLatitude,

      playerLongitude

    ) {


      coins.forEach(

        function(coin) {


          if (
            coin.collected
          ) {

            return;

          }



          const distance =
            getDistanceMeters(

              playerLatitude,

              playerLongitude,

              coin.latitude,

              coin.longitude

            );



          if (

            distance <=
            COLLECTION_DISTANCE

          ) {

            collectCoin(
              coin
            );

          }

        }

      );

    }



    /* =====================================================
       COLLECT COIN
       ===================================================== */

    function collectCoin(
      coin
    ) {


      coin.collected =
        true;



      /*
        Remove marker.
      */

      if (
        map.hasLayer(
          coin.marker
        )
      ) {

        map.removeLayer(
          coin.marker
        );

      }



      /*
        Add reward.
      */

      coinCount +=
        COIN_VALUE;



      /*
        Update HUD.
      */

      document.getElementById(
        "coins"
      ).innerText =

        "🪙 Coins: " +
        coinCount;



      /*
        Show reward.
      */

      document.getElementById(
        "status"
      ).innerText =

        "🪙 COIN COLLECTED! +10";


      /*
        Return to normal message.
      */

      setTimeout(

        function() {

          document.getElementById(
            "status"
          ).innerText =
            "🎮 KEEP EXPLORING";

        },

        2000

      );

    }



    /* =====================================================
       DISTANCE CALCULATION
       ===================================================== */

    function getDistanceMeters(

      latitude1,

      longitude1,

      latitude2,

      longitude2

    ) {


      const earthRadius =
        6371000;



      const lat1 =
        latitude1 *
        Math.PI /
        180;



      const lat2 =
        latitude2 *
        Math.PI /
        180;



      const deltaLatitude =

        (
          latitude2 -
          latitude1
        ) *
        Math.PI /
        180;



      const deltaLongitude =

        (
          longitude2 -
          longitude1
        ) *
        Math.PI /
        180;



      const a =

        Math.sin(
          deltaLatitude / 2
        ) *

        Math.sin(
          deltaLatitude / 2
        )

        +

        Math.cos(lat1) *

        Math.cos(lat2) *

        Math.sin(
          deltaLongitude / 2
        ) *

        Math.sin(
          deltaLongitude / 2
        );



      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );



      return (
        earthRadius *
        c
      );

    }



    /* =====================================================
       SHUFFLE ARRAY
       ===================================================== */

    function shuffleArray(
      array
    ) {


      for (

        let i =
          array.length - 1;

        i > 0;

        i--

      ) {


        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        const temp =
          array[i];


        array[i] =
          array[j];


        array[j] =
          temp;

      }

    }



    /* =====================================================
       PUBLIC / UNLIMITED SWITCH
       ===================================================== */

    document.getElementById(
      "mode"
    ).addEventListener(

      "click",

      function() {


        if (
          gameMode === "PUBLIC"
        ) {


          gameMode =
            "UNLIMITED";


          document.getElementById(
            "mode"
          ).innerText =
            "🔓 UNLIMITED";


        } else {


          gameMode =
            "PUBLIC";


          document.getElementById(
            "mode"
          ).innerText =
            "🌎 PUBLIC";

        }



        /*
          Reload nearby coins using
          the new mode.
        */

        if (

          lastLatitude !== null &&

          lastLongitude !== null

        ) {

          loadCoinsFromOSM(

            lastLatitude,

            lastLongitude

          );

        }

      }

    );



    /* =====================================================
       GPS ERROR
       ===================================================== */

    function locationError(
      error
    ) {


      document.getElementById(
        "status"
      ).innerText =

        "❌ Couldn't get your location.";

    }



    /* =====================================================
       START GPS
       ===================================================== */

    if (
      "geolocation" in navigator
    ) {


      navigator.geolocation.watchPosition(

        updateLocation,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            10000

        }

      );


    } else {


      document.getElementById(
        "status"
      ).innerText =

        "❌ GPS isn't available.";

    }


  </script>

</body>
</html>
